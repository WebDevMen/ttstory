# Retention and engagement devices. Beats list the ones they use in `devices:`; the checker counts variety and
# looks for the structural ones (open loops, pattern interrupts, mini payoffs, comment/share/save triggers).
# engine: how to build it with this repo (draw actors, HUD components, sounds).

retention:
  foreshadowing:
    name: "Ружьё (подготовка поворота)"
    what: "Деталь, которая видна раньше и «выстреливает» в повороте: поворот кажется неожиданным и честным."
    how: "Положить деталь в кадр или фразу в первой трети (тень отстаёт на долю секунды), выстрел — во второй половине; story.twists: {setup, payoff}."
    engine: "Деталь в первом кадре (lag у cast_shadow, предмет в руке, надпись), в повороте — крупный план той же детали."
  cliffhanger:
    name: "Обрыв"
    what: "История останавливается на новом повороте — зритель подписывается или пересматривает."
    how: "Последний сюжетный блок — новая угроза или переворот смысла; призыв называет следующую часть."
    engine: "Блок с ролью cliffhanger, тишина в музыке перед ударом (music: silence), крупный текст-обрыв."
  open_loop:
    name: "Открытая петля"
    what: "Вопрос/обещание, ответ на который будет позже. Держит до закрытия."
    how: "В крючке или в первые 8 с: «но самое страшное — не это», «скажу в конце». Закрыть после 60% ролика."
    engine: "loops: [{id, question, open, close}] в script.yaml; визуально — знак вопроса (prop question), «…» в тексте."
  pattern_interrupt:
    name: "Смена паттерна"
    what: "Новое визуальное событие каждые 2–3 с: смена кадра, зум, появление графики, звук."
    how: "Не держать один статичный кадр дольше 3 с. Чередовать: шот → графика → движение камеры → звук."
    engine: "shots с at: \"@слово\", animation/graphics на словах, transition whip/zoom/glitch, camera.shakes."
  stakes_raise:
    name: "Повышение ставок"
    what: "Каждый блок хуже/интереснее предыдущего."
    how: "Числа растут (час 1 → день 3), цвет сцены теплеет/краснеет, музыка плотнее."
    engine: "sky.hour, battery.level, meter.value как дорожки; music sections drone → tension → pulse."
  progress:
    name: "Видимый прогресс"
    what: "Зритель видит, сколько осталось: 1/3, таймер, метка времени."
    how: "«Правило №2», «День 2 — 03:18», шкала заполнения."
    engine: "HUD marker, timetag, meter, checklist, text count."
  direct_address:
    name: "Обращение на «ты»"
    what: "Зритель — участник событий."
    how: "«Ты просыпаешься…», «твоё окно видно…». Без лекторского «мы рассмотрим»."
    engine: "Текст диктора; персонаж-«ты» (person) с меткой «ВЫ»."
  visual_proof:
    name: "Покажи, а не расскажи"
    what: "Каждое утверждение подтверждено картинкой: цифра растёт, предмет появляется, схема рисуется."
    how: "На слове-ключе — появление объекта/цифры."
    engine: "text count, chart grow, shape draw, callout к объекту, prop pop."
  mini_payoff:
    name: "Мини-награда"
    what: "Каждые 10–15 с — новый факт/вывод/вау-момент."
    how: "Роли point/step/proof/twist/reveal не реже чем раз в ~15 с."
    engine: "Блоки с наградными ролями (formats.roles.reward)."
  number_reveal:
    name: "Цифра с анимацией"
    what: "Ключевая цифра крупно, счётчиком или штампом."
    how: "Цифры — только проверенные (research.facts)."
    engine: "text count / badge stamp / battery / meter."
  contrast:
    name: "Контраст"
    what: "До/после, у нас/у них, правильно/неправильно."
    how: "Два состояния рядом, цвета красный/зелёный."
    engine: "Две группы слева/справа, badge красный ✕ и зелёный ✓, sky.hour день/ночь."
  twist:
    name: "Поворот"
    what: "Неожиданная деталь, ломающая ожидание."
    how: "Подготовить ложное ожидание и сломать его во второй половине."
    engine: "Роль twist, звук-акцент (impact/boom), смена палитры/вспышка (transition flash)."
  sound_hit:
    name: "Звуковой акцент"
    what: "Звук подчёркивает событие: удар, свист, звонок, тишина перед ударом."
    how: "На каждом визуальном ударе — звук; перед кульминацией — тишина."
    engine: "sfx у сцены и у актёров (sfx: true), music style sub/silence для паузы."
  text_reinforcement:
    name: "Текст на экране"
    what: "Ключевая фраза дублируется крупным текстом — для смотрящих без звука и для поиска."
    how: "2–5 слов, не дублировать всю речь."
    engine: "beats.on_screen → text/badge актёр или HUD text; субтитры отдельно."
  callback:
    name: "Отсылка к началу"
    what: "Финал возвращается к образу/фразе из крючка — ощущение завершённости, пересмотры."
    how: "Повторить картинку крючка в развязке с новым смыслом."
    engine: "Тот же набор актёров, что в первом шоте (как знак «нет уборщиков» в «Школе»)."
  relatability:
    name: "Узнаваемость"
    what: "Ситуация из жизни зрителя: «каждый так делал»."
    how: "Бытовые детали, знакомые места (панелька, холодильник, телефон 5%)."
    engine: "building, phone, battery, room, person."
  emotion:
    name: "Эмоция"
    what: "Удивление, тревога, умиление, смех — без эмоции нет пересылок."
    how: "Выбрать одну основную эмоцию на ролик и усиливать её."
    engine: "face у персонажей, палитра, музыка (calm/dark/upbeat)."

engagement:
  comment_bait:
    name: "Повод для комментария"
    what: "Конкретный вопрос или выбор, на который легко ответить одним словом/цифрой."
    how: "«А ты бы смог? Да/нет», «Какой пункт удивил?», «Напиши свой результат». Не «пишите мнение»."
    engine: "HUD choices + cta в последнем блоке; engagement.comment."
  share_trigger:
    name: "Повод переслать"
    what: "Ролик полезен/смешон/важен для кого-то конкретного."
    how: "«Отправь тому, кто живёт в панельке», практическая польза, эмоция."
    engine: "engagement.share; фраза в CTA или в подписи."
  save_trigger:
    name: "Повод сохранить"
    what: "Инструкция/чек-лист, к которому вернутся."
    how: "Сводка шагов в конце (recap), «сохрани, пригодится»."
    engine: "checklist/list в блоке recap."
  follow_trigger:
    name: "Повод подписаться"
    what: "Серия или обещание продолжения."
    how: "«Часть 2 — что делать, если нет воды», единая рубрика."
    engine: "engagement.follow; повторяемая метка рубрики (timetag/marker)."
  rewatch_trigger:
    name: "Повод пересмотреть"
    what: "Детали, которые не успел рассмотреть; петля; быстрый текст."
    how: "Пасхалки в кадре, финал, перетекающий в начало (loop)."
    engine: "Мелкие детали в кадре, loop-финал, быстрые надписи."
  loop_ending:
    name: "Зацикленный финал"
    what: "Последняя фраза грамматически продолжается первой — ролик крутится по кругу."
    how: "Конец: «…и поэтому», начало: «в японской школе нет уборщиков»."
    engine: "Роль loop в последнем блоке; последний кадр совпадает с первым."

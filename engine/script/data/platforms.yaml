# Platform knowledge for scripts. `official` = said by the platform itself; `practice` = widely reported by creators and
# marketers (useful, but not confirmed by the platform). `limits` are used by `vg.py script check`.
# Verified: October 2026. Re-check limits when they look outdated (platforms change them often).

tiktok:
  name: TikTok
  official:
    - "Рекомендации строятся на взаимодействиях (лайки, репосты, подписки, комментарии), информации о видео (подпись, звук, хэштеги) и, слабее, на настройках устройства (язык, страна)."
    - "Сильный сигнал интереса — досмотр длинного видео до конца."
    - "Число подписчиков и прошлые успешные ролики не являются прямыми факторами рекомендаций."
  practice:
    - "Решающие метрики — время просмотра, досматриваемость и пересмотры; затем репосты и сохранения, комментарии."
    - "Поиск TikTok учитывает слова в речи, текст на экране и подпись: одно и то же ключевое слово во всех трёх местах."
    - "В ленте видна только первая строка подписи (~100 символов) — главное в начале."
    - "Монетизация Creator Rewards требует роликов длиннее 1 минуты (засчитываются просмотры из ленты «Рекомендации» от 5 секунд)."
  limits:
    caption_max: 2200          # safe limit (also for API/schedulers); the app may allow more
    caption_visible: 100
    hashtags: [3, 5]
    duration_reach: [21, 75]   # seconds: sweet spot for reach-oriented scripts
    duration_monetize_min: 61
  sources:
    - https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you
    - https://www.toptal.com/creator/post/tiktok-seo
    - https://metricool.com/tiktok-creator-fund/
    - https://recurpost.com/tiktok-scheduler/tiktok-character-limits-and-hashtags/

reels:
  name: Instagram Reels
  official:
    - "Глава Instagram Адам Моссери (январь 2025): главные факторы ранжирования Reels — время просмотра, отправки на охват (sends per reach) и лайки на охват."
    - "С декабря 2025 Instagram постепенно ограничивает число хэштегов в подписи до 5 и советует меньше, но точнее."
  practice:
    - "Отправки (пересылки в директ) особенно важны для охвата новых людей: ролик должен быть «для кого-то»."
    - "Обложка и первый кадр решают, нажмут ли из профиля и сетки."
  limits:
    caption_max: 2200
    hashtags: [1, 5]
    hashtags_max: 5
  sources:
    - https://www.socialsamosa.com/news-2/instagram-hashtags-five-per-post-10923075
    - https://betanews.com/2025/12/19/instagram-puts-a-limit-on-hashtag-usage/
    - https://stackinfluence.com/how-does-the-algorithm-for-reels-work-in-2025/

shorts:
  name: YouTube Shorts
  official:
    - "Shorts могут длиться до 3 минут."
    - "С 31 марта 2025 просмотр Shorts засчитывается при каждом запуске/повторе; прежняя метрика стала «вовлечёнными просмотрами» (engaged views)."
    - "В аналитике есть «Смотрели / пролистнули» (viewed vs swiped away) — прямой показатель силы крючка."
  practice:
    - "Пересмотры повышают счётчик просмотров: зацикленный финал полезен."
    - "Заголовок короткий, с ключевым словом."
  limits:
    title_max: 100
    hashtags: [1, 3]
  sources:
    - https://support.google.com/youtube/answer/10059070
    - https://mobilesyrup.com/2025/03/27/youtube-changes-how-it-counts-shorts-views/
    - https://contentstudio.io/blog/youtube-shorts-analytics-guide

common:
  safe_zones: "Верх ~0–150 px, низ ~1550–1920 px (подпись и ник), правая колонка x > 940 на высоте 800–1550 (кнопки) — без важного текста."
  sound_off: "Значительная часть смотрит без звука: смысл первых секунд должен читаться из картинки и текста на экране."
  originality: "Площадки продвигают оригинальный контент: без чужих водяных знаков, свой голос/графика."

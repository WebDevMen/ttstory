# Hook types for the first 1–3 seconds. Every script keeps ≥ 8 variants of ≥ 4 types (hooks.variants),
# picks one (hooks.primary) and keeps 2 for A/B tests (hooks.ab).

rules:
  - "Первая фраза — до ~3 секунд (≈ 8–12 слов). Суть, ставки или загадка — сразу, без приветствий и вступлений."
  - "Первый кадр уже живой и сам по себе понятен без звука: объект, действие, крупный текст. Много смотрят без звука."
  - "Ключевое слово темы — в первой фразе, в тексте на экране и в подписи (поиск TikTok читает речь, текст и подпись)."
  - "Обещание крючка обязательно выполняется в ролике. Обман без награды = свайп и негатив в комментариях."
  - "Конкретика бьёт абстракцию: цифра, время, место, предмет. «3 дня без света», а не «долгое отключение»."
  - "Говорить «ты»: зритель — участник, а не слушатель лекции."

banned_openers: ["привет", "всем привет", "здравствуйте", "добро пожаловать", "сегодня я", "сегодня мы", "в этом видео", "друзья", "дорогие", "давайте поговорим", "хочу рассказать"]

score_criteria:
  stop: "Остановит ли палец за 1 секунду (неожиданность, ставки, эмоция)."
  clarity: "Понятно ли с первого прослушивания, о чём ролик."
  promise: "Есть ли обещание награды за досмотр."
  specific: "Конкретика: цифры, предметы, время."
  relevance: "Касается ли лично целевой аудитории."
  visual: "Есть ли сильный первый кадр, работающий без звука."

types:
  imagine:
    name: "Представь…"
    formula: "Представь: [неожиданная ситуация с тобой в главной роли] + [ставки]."
    examples:
      - "Представь: ты просыпаешься, а света нет уже третий день."
      - "Представь, что завтра исчезнет интернет. Навсегда."
    best_for: [what_if, survival_guide, story]
    risk: "Если ситуация банальна — не цепляет. Нужна деталь, которой зритель не ждёт."
  pov:
    name: "POV / от первого лица"
    formula: "POV: ты [роль/ситуация], и [осложнение]."
    examples:
      - "POV: ты первоклассник в Японии, и родители не провожают тебя в школу."
    best_for: [day_in_life, what_if, story]
    risk: "Работает, когда роль узнаваемая или очень необычная."
  stakes:
    name: "Ставки / угроза"
    formula: "У тебя есть [время/ресурс], чтобы [избежать потери]. Большинство [ошибается]."
    examples:
      - "У тебя 4 часа, пока еда в холодильнике не испортится."
      - "Если ночью пришло экстренное оповещение — у тебя три минуты."
    best_for: [survival_guide, what_if, how_to]
    risk: "Не пугать ради пугания: цифры должны быть проверены (research.facts)."
  question:
    name: "Вопрос-загадка"
    formula: "Почему/как [парадокс, который зритель видел, но не задумывался]?"
    examples:
      - "Почему в японских школах нет уборщиков?"
      - "Почему самолёт не может упасть из-за открытой двери?"
    best_for: [explainer, myth_busting, day_in_life]
    risk: "Вопрос с очевидным ответом убивает интерес. Ответ — не раньше последней трети."
  shock_fact:
    name: "Шок-факт"
    formula: "[Невероятная, но правдивая цифра/факт]. И это не самое странное."
    examples:
      - "В японской школе нет уборщиков. Вообще."
      - "Японские школьники сами моют свою школу. Даже туалеты."
    best_for: [listicle, day_in_life, timeline, explainer]
    risk: "Факт обязан быть с источником (high/medium confidence)."
  contrarian:
    name: "Против общего мнения"
    formula: "Ты [делаешь/думаешь X] — и это ошибка. / Всё, что ты знал о X, — неправда."
    examples:
      - "Ты пьёшь чай неправильно."
      - "Включать свет в такой ситуации — худшее, что ты можешь сделать."
    best_for: [myth_busting, mistakes, how_to]
    risk: "Нужна убедительная награда-доказательство, иначе выглядит как кликбейт."
  curiosity_gap:
    name: "Недосказанность"
    formula: "Есть одна [вещь/причина/деталь], из-за которой [результат]. Скажу в конце."
    examples:
      - "Есть одна вещь, которую японцы делают каждый день — и ты бы точно не стал."
    best_for: [listicle, explainer, story]
    risk: "Петля должна закрыться (loops), а ответ — стоить ожидания."
  list_promise:
    name: "Обещание списка"
    formula: "[N] [правил/фактов/ошибок], которые [выгода]. Последний — [интрига]."
    examples:
      - "3 правила чайной церемонии, которые знает каждый мастер."
    best_for: [listicle, how_to, mistakes]
    risk: "Чем меньше N, тем лучше для 60 с (3–5)."
  challenge:
    name: "Вызов"
    formula: "Спорим, ты [не сможешь/не знаешь]… / Только [мало %] ответят правильно."
    examples:
      - "Спорим, ты не продержишься в японской школе и одного дня?"
    best_for: [quiz, comparison, myth_busting]
    risk: "Процент «ответят правильно» — не выдумывать, формулировать как оценку («мало кто»)."
  callout:
    name: "Обращение к своим"
    formula: "Если ты [сегмент аудитории], [важное для тебя]."
    examples:
      - "Если ты живёшь выше пятого этажа — запомни это."
    best_for: [survival_guide, how_to, mistakes]
    risk: "Сужает охват; сегмент должен быть массовым."
  result_first:
    name: "Сначала результат"
    formula: "[Финальный результат/кульминация] — а началось всё с [мелочи]."
    examples:
      - "Через три дня без света этот дом стал другим. А началось всё с одной ошибки."
    best_for: [story, how_to, timeline]
    risk: "Не раскрыть всё сразу — оставить «как?»."
  visual_shock:
    name: "Визуальный крючок"
    formula: "Первый кадр — неожиданная картинка/движение, голос подхватывает через 0.5–1 с."
    examples:
      - "Экран телефона вспыхивает красным: ЭКСТРЕННОЕ ОПОВЕЩЕНИЕ."
    best_for: [what_if, survival_guide, quiz]
    risk: "Сочетать с голосовым крючком; одна картинка без смысла не держит."
  speculative:
    name: "Спекулятивный (вымысел)"
    formula: "[Время/место] + [нарушение правила мира] + [поворот против ожидания]."
    examples:
      - "После падения звезды полдеревни осталось без тени. Ночью тени вернулись — за остальными."
      - "В две тысячи сорок пятом пришёл первый сигнал из космоса. Это было предупреждение — о нас."
    best_for: [fiction, story, what_if]
    risk: "Без конкретной детали звучит как трейлер; аномалия должна быть видна в первом кадре без звука."
  anomaly:
    name: "Аномалия в кадре"
    formula: "Первый кадр — то, чего не бывает (человек на солнце без тени, небо не того цвета), голос называет это через 0.5–1 с."
    examples:
      - "У них нет теней. Только у тех, кто подходил к камню."
    best_for: [fiction, what_if]
    risk: "Аномалия должна быть понятна за секунду; сложная — не читается в ленте."

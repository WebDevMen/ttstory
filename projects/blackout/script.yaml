production:
  theme: {preset: minimal, accent: "#ff3b4e", captions: clean}
  palette: ["#0c1020 ночь", "#ffd27a тёплые окна", "#ff3b4e опасность", "#3a8ee6 вода", "#46d27a решение"]
  music: {key: D, mode: minor, bpm: 92}
  assets:
    - "Новые актёры: fridge (дверца, таймер, полки), elevator (двери, табло), cell_tower (мачта с огоньком), faucet (кран и капля), gas_stove (плита с пламенем по конфоркам)"
    - "building: режим разреза с уровнем воды по этажам (или shape-прямоугольники поверх фасада)"
  notes:
    - "Голос: ru-RU-DmitryNeural +18% — спокойный, не истеричный; паузы после «На три дня.» и «Потом сеть исчезает.»"
    - "Цвет ведёт эскалацию: тёплые окна → синяя ночь → серый день 2 → красный поворот → зелёная развязка"
    - "Субтитры прятать, когда на экране крупный штамп с теми же словами (3 ДНЯ БЕЗ СВЕТА, УГАРНЫЙ ГАЗ)"


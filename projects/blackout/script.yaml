# СЦЕНАРИЙ: Что будет, если в доме на 3 дня отключат свет
# Эталонный пример инструмента сценариев (docs/SCRIPTING.md). Видео по нему пока не собиралось.
# Проверка: python3 vg.py script check blackout [--tts] · документ: python3 vg.py script render blackout
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово.end", "@слово+0.3",
# "@start"/"@end" блока, "@другой_блок/слово" или число = секунды от начала блока.

version: 1

meta:
  title: "3 дня без света в многоэтажке"
  topic: "Что будет, если в доме на 3 дня отключат свет"
  language: ru
  platforms: [tiktok, reels, shorts]
  primary_platform: tiktok
  duration: 60
  format: what_if
  style: draw
  voice: {voice: ru-RU-DmitryNeural, rate: "+18%", pitch: "+0Hz"}
  status: checked

brief:
  goal: "Охват и пересылки: полезный «страшный» сценарий, который отправляют соседям и родным; рубрика «Что будет, если…»."
  kpi: [completion, shares, saves, comments]
  audience:
    who: "Жители многоэтажек в городах СНГ, которые хоть раз сидели без света и не знают, что будет, если это затянется"
    age: "18–40"
    interests: [выживание, лайфхаки, городской быт, новости про блэкауты]
    pains: [страх остаться без связи, испорченные продукты, нет воды на верхних этажах, беспомощность]
    desires: ["понять, что реально произойдёт", "знать 2–3 простых действия", "почувствовать себя готовым"]
    knowledge: "Знают про фонарик и пауэрбанк; не знают про четыре часа холодильника, батареи вышек связи, насосы на верхних этажах и угарный газ от плиты"
  promise: "За минуту узнаешь, что ломается по часам, и три вещи, которые надо сделать в первый же час."
  tone: "Тревожно-практичный: напряжение растёт по часам, в конце — облегчение и чёткий план. Главная эмоция — «ого, я об этом не думал»."
  keywords: ["отключение света", "блэкаут", "многоэтажка", "что делать"]
  constraints:
    - "Только проверенные цифры (research.facts); никаких выдуманных процентов и рекордов"
    - "Без запугивания ради запугивания: каждая угроза закрывается действием в развязке"
    - "Не называть конкретные страны и города: ситуация универсальная"
    - "Отопление не обсуждаем: в разных домах оно устроено по-разному, проверенного общего факта нет"

research:
  summary: >-
    При длительном отключении в многоэтажке последствия наступают по часам: лифт и роутер — сразу, холодильник —
    через четыре часа, мобильная связь — когда сядут аккумуляторы вышек (часы, а не дни), вода на верхних этажах —
    сразу, если выше девятого этажа её подают насосы. Главные риски для жизни — не темнота, а угарный газ
    (газовая плита как обогреватель) и пожары от свечей. Простые действия в первый час снимают большую часть проблем.
  facts:
    - id: f1
      text: "Закрытый холодильник сохраняет продукты безопасными до 4 часов без электричества; скоропортящееся после 4 часов без питания нужно выбросить."
      source: "https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html"
      confidence: high
    - id: f2
      text: "Полная морозилка держит безопасную температуру 48 часов, наполовину заполненная — 24 часа, если её не открывать."
      source: "https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html"
      confidence: high
    - id: f3
      text: "Никогда не используйте газовую плиту или духовку для обогрева жилья: источник угарного газа, который не видно и не чувствуется по запаху."
      source: "https://www.cdc.gov/natural-disasters/psa-toolkit/avoiding-carbon-monoxide-poisoning.html"
      confidence: high
    - id: f4
      text: "Для освещения используйте фонарики на батарейках, а не свечи — чтобы снизить риск пожара."
      source: "https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-during-a-power-outage.html"
      confidence: high
    - id: f5
      text: "Давления городских сетей в советской застройке хватает примерно до девятого этажа; выше воду подают насосы, и без электричества верхние зоны остаются без воды."
      source: "https://news.telegraf.com.ua/ukraina/5949452-u-blekauty-ne-budet-eshche-vody-kakim-etazham-ne-povezet"
      confidence: medium
    - id: f6
      text: "Базовые станции мобильной связи без внешнего питания работают на аккумуляторах; даже после массовой замены батарей операторы заявляют до 10 часов в обычном режиме, реально меньше при нагрузке и в холод."
      source: "https://itc.ua/news/skolko-proderzhytsya-svyaz-v-ukrayne-v-totalnyj-blekaut-otvechayut-kyevstar-vodafone-y-lifecell/"
      confidence: medium
    - id: f7
      text: "Перед отключением наберите воду: ванну — для мытья и смыва, чистые ёмкости — для питья; держите заряженные телефоны и фонарики, не используйте открытый огонь."
      source: "https://health.ri.gov/emergencies/power-outages"
      confidence: high
  angles:
    - id: a1
      text: "Хронометраж катастрофы: что ломается через час, четыре часа, ночь и день — от второго лица, в своей многоэтажке"
      score: 9
      why: "Естественная эскалация держит до конца, метки времени дают видимый прогресс, каждый блок — новая награда; узнаваемо для любого жителя панельки."
    - id: a2
      text: "5 ошибок, которые все делают при отключении света"
      score: 7
      why: "Полезно и сохраняемо, но меньше интриги: зритель угадывает половину пунктов, нет нарастания."
    - id: a3
      text: "Миф: «без света страшнее всего темнота»"
      score: 6
      why: "Сильный контраст, но короткий: весь ролик держится на одном повороте, середина провисает."
    - id: a4
      text: "Сколько протянет твой телефон, холодильник и вода — тест «проверь свой дом»"
      score: 7
      why: "Интерактивно, но требует от зрителя знаний о своём доме — сложнее порог входа в первые 3 секунды."
  chosen_angle: a1
  insights:
    - "Самая неожиданная деталь для зрителя — вода пропадает не у всех, а только выше девятого этажа: отсюда спор и комментарии «а у меня какой этаж»."
    - "Цифра «четыре часа» для холодильника конкретная и проверяемая — работает как мини-шок в середине."
    - "Угарный газ — настоящий риск для жизни и не очевиден: идеальный поворот во второй половине."
    - "Практичная развязка из трёх действий даёт повод сохранить и переслать."

hooks:
  variants:
    - {id: h1, type: imagine, vo: "Представь: в твоём доме отключили свет. На три дня.", on_screen: "3 ДНЯ БЕЗ СВЕТА", visual: "Ночная панелька, окна гаснут сверху вниз за полсекунды", score: 9, why: "Ты в главной роли, конкретный срок, мгновенная картинка; ключевое слово в первой фразе."}
    - {id: h2, type: stakes, vo: "У тебя четыре часа, пока еда в холодильнике не испортится.", on_screen: "4 ЧАСА", visual: "Холодильник, на дверце таймер 4:00 начинает отсчёт", score: 8, why: "Конкретная угроза и таймер; но про холодильник — узко для крючка."}
    - {id: h3, type: shock_fact, vo: "Если отключат свет, выше девятого этажа пропадёт и вода.", on_screen: "ВЫШЕ 9 ЭТАЖА — БЕЗ ВОДЫ", visual: "Разрез дома: синяя вода заполняет этажи до девятого и останавливается", score: 8, why: "Неожиданно и проверяемо; провоцирует «а у меня какой этаж»."}
    - {id: h4, type: question, vo: "Что сломается первым, если свет пропадёт на три дня?", on_screen: "ЧТО СЛОМАЕТСЯ ПЕРВЫМ?", visual: "Иконки лифта, холодильника, телефона, крана в ряд, по одной гаснут", score: 7, why: "Хорошая петля, но вопрос-перечисление цепляет слабее личной ситуации."}
    - {id: h5, type: pov, vo: "POV: ты на двенадцатом этаже, и в доме уже третий день нет света.", on_screen: "ДЕНЬ 3 · 12 ЭТАЖ", visual: "Тёмное окно, силуэт с телефоном на 3%", score: 6, why: "Латиница «POV» в голосе (нужно произношение), фраза длинная — больше 3 секунд."}
    - {id: h6, type: contrarian, vo: "Темнота — самое безобидное, что случится без света.", on_screen: "ТЕМНОТА — ЕРУНДА", visual: "Свеча гаснет, за ней проступают иконки угроз", score: 7, why: "Ломает ожидание, но без конкретики (сколько? где?) слабее первой секунды."}
    - {id: h7, type: curiosity_gap, vo: "Без света опаснее всего не темнота. А одна вещь на твоей кухне.", on_screen: "ОПАСНОСТЬ НА КУХНЕ", visual: "Тёмная кухня, газовая плита в луче фонарика", score: 7, why: "Сильная недосказанность, но обещание узкое — тянет весь ролик в одну тему."}
    - {id: h8, type: challenge, vo: "Спорим, ты не продержишься три дня без света в многоэтажке?", on_screen: "ПРОДЕРЖИШЬСЯ 3 ДНЯ?", visual: "Шкала «выживание» на 100%, начинает падать", score: 6, why: "Вызов провоцирует, но звучит кликбейтно и не даёт картинки."}
  primary: h1
  ab: [h3, h2]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Дом гаснет"
    goal: "Остановить палец: личная ситуация + срок + обещание, что темнота — не главное."
    vo: "Представь: в твоём доме отключили свет. На три дня. И темнота — самое безобидное, что тебя ждёт."
    on_screen: "3 ДНЯ БЕЗ СВЕТА"
    devices: [direct_address, open_loop, pattern_interrupt, text_reinforcement, relatability]
    facts: []
    music: drone
    marks: {"три дня": "#ff3b4e"}
    shots:
      - id: h_house
        visual: "Ночь, панельная шестнадцатиэтажка крупно, почти все окна горят тёплым жёлтым. Передний план — тёмные деревья, сзади — силуэт города. С первого кадра идёт медленный наезд."
        actors: [sky, skyline, building, tree, timetag, text]
        camera: "Наезд на дом с z 1.0 до 1.12, лёгкая тряска на «отключили»"
        animation:
          - {at: "@start", what: "Окна мерцают, медленный наезд — кадр живой без звука"}
          - {at: "@отключили", what: "Окна гаснут волной сверху вниз за 0.5 с; гаснет и город на фоне"}
          - {at: "@дня", what: "Камера дёргается (shake), остаются гореть два окна — фонарики"}
        graphics:
          - {at: "@start+0.3", type: timetag, text: "ДЕНЬ 1 · 18:40"}
          - {at: "@отключили", type: "alert badge", text: "⚡ ОТКЛЮЧЕНИЕ СВЕТА"}
          - {at: "@три", type: "text stamp", text: "3 ДНЯ БЕЗ СВЕТА"}
        sfx:
          - {at: "@отключили", sound: click, note: "щелчок рубильника"}
          - {at: "@свет", sound: boom, note: "низкий гул обесточивания"}
          - {at: "@три", sound: kick, note: "удар под штамп"}
        ambience: [city]
        transition: cut
      - id: h_dark
        at: "@темнота-0.1"
        visual: "Тёмная комната, у окна силуэт человека, лицо подсвечено телефоном. Над головой появляется большой знак вопроса."
        actors: [room, person, phone, prop]
        camera: "Медленный наезд на силуэт"
        animation:
          - {at: "@темнота", what: "Луч фонарика проходит по комнате"}
          - {at: "@безобидное", what: "Знак вопроса выскакивает над головой и покачивается"}
        graphics:
          - {at: "@ждёт", type: badge, text: "САМОЕ СТРАШНОЕ — ВПЕРЕДИ"}
        sfx:
          - {at: "@безобидное", sound: pop}
        transition: zoom

  # ------------------------------------------------------------------ 2. SETUP
  - id: setup
    role: setup
    title: "Твоя панелька"
    goal: "Где мы: многоэтажка, двенадцатый этаж, вечер. Первые потери — лифт, вайфай, заряд."
    vo: "Обычная панелька, двенадцатый этаж. Лифт встал, вайфай пропал, а на телефоне сорок процентов."
    on_screen: "12 ЭТАЖ · ПАНЕЛЬКА"
    devices: [relatability, progress, visual_proof]
    music: drone
    shots:
      - id: s_floor
        visual: "Тот же дом днём-сумерками, камера поднимается по фасаду; на двенадцатом этаже подсвечивается окно рамкой, к нему тянется выноска."
        actors: [sky, building, callout]
        camera: "Подъём камеры по фасаду снизу вверх до 12 этажа"
        animation:
          - {at: "@start", what: "Камера едет вверх, этажи отсчитываются"}
          - {at: "@двенадцатый", what: "Окно 12 этажа выделяется красной рамкой"}
        graphics:
          - {at: "@двенадцатый", type: callout, text: "12 ЭТАЖ · ПАНЕЛЬКА"}
        sfx:
          - {at: "@двенадцатый", sound: blip}
        transition: whip_y
      - id: s_lift
        at: "@Лифт-0.2"
        visual: "Двери лифта крупно, табло этажа гаснет, кнопка вызова не светится."
        actors: [new:elevator, badge]
        camera: "Статичный крупный план с ударом-тряской на «встал»"
        animation:
          - {at: "@встал", what: "Табло гаснет, двери вздрагивают"}
        graphics:
          - {at: "@встал", type: badge, text: "ЛИФТ ✕"}
        sfx:
          - {at: "@встал", sound: slam, note: "лязг остановки"}
        transition: whip_x
      - id: s_phone
        at: "@пропал-0.15"
        visual: "Телефон в руке: значок вайфая перечёркнут, батарея сорок процентов и мигает."
        actors: [phone, battery]
        camera: "Лёгкий наезд на экран"
        animation:
          - {at: "@пропал", what: "Значок вайфая перечёркивается"}
          - {at: "@сорок", what: "Батарея падает до 40 % и начинает мигать"}
        graphics:
          - {at: "@сорок", type: battery, text: "40%"}
        sfx:
          - {at: "@пропал", sound: glitch}
          - {at: "@сорок", sound: buzz}
        transition: zoom

  # ------------------------------------------------------------------ 3. ESCALATION: 4 hours, fridge
  - id: fridge
    role: escalation
    title: "Четыре часа холодильника"
    goal: "Первое неочевидное последствие с проверенной цифрой: еда портится через четыре часа."
    vo: "Холодильник держит холод, только пока закрыт. Через четыре часа мясо, молоко и яйца в нём уже опасны."
    on_screen: "ХОЛОДИЛЬНИК: 4 ЧАСА"
    devices: [stakes_raise, number_reveal, progress, visual_proof]
    facts: [f1]
    music: tension
    marks: {"четыре часа": "#ff3b4e"}
    shots:
      - id: f_fridge
        visual: "Кухня в темноте, холодильник по центру, на дверце — термометр и таймер. Синие частицы холода внутри постепенно краснеют."
        actors: [room, new:fridge, meter, timetag, particles]
        camera: "Медленный наезд на дверцу"
        animation:
          - {at: "@start", what: "Метка времени переключается на 22:40, частицы холода дрейфуют"}
          - {at: "@закрыт", what: "Дверца приоткрывается — холод вырывается облаком; дверца захлопывается"}
          - {at: "@четыре", what: "Таймер на дверце быстро отсчитывает 4:00 → 0:00, шкала температуры растёт в красное"}
        graphics:
          - {at: "@start", type: timetag, text: "ДЕНЬ 1 · 22:40"}
          - {at: "@четыре", type: "text count", text: "4 ЧАСА"}
        sfx:
          - {at: "@закрыт", sound: hiss, note: "холодный воздух"}
          - {at: "@четыре", sound: typing, note: "тиканье таймера"}
        transition: whip_x
      - id: f_food
        at: "@мясо-0.1"
        visual: "Полки крупно: мясо, молоко, яйца по очереди получают красные штампы."
        actors: [image, badge]
        camera: "Панорама по полкам слева направо"
        animation:
          - {at: "@мясо", what: "Мясо — красный штамп ✕"}
          - {at: "@молоко", what: "Молоко — штамп ✕"}
          - {at: "@яйца", what: "Яйца — штамп ✕"}
        graphics:
          - {at: "@опасны", type: badge, text: "ОПАСНО ЕСТЬ"}
        sfx:
          - {at: "@мясо", sound: kick}
          - {at: "@молоко", sound: kick}
          - {at: "@яйца", sound: kick}
          - {at: "@опасны", sound: buzz}
        transition: zoom

  # ------------------------------------------------------------------ 4. ESCALATION: night, network
  - id: network
    role: escalation
    title: "Связь умирает ночью"
    goal: "Хуже: пропадает связь — нельзя позвонить и узнать новости. Цифра про батареи вышек."
    vo: "Ночь. Вышки связи держатся на аккумуляторах — часы, а не дни. Даже новые батареи рассчитаны максимум на десять часов. Потом сеть исчезает."
    on_screen: "СВЯЗЬ: ДО 10 ЧАСОВ"
    devices: [stakes_raise, number_reveal, progress, sound_hit]
    facts: [f6]
    music: tension
    shots:
      - id: n_tower
        visual: "Ночной город без огней, на крыше дома вышка связи с мигающим красным огоньком; рядом крупная батарея, заряд которой утекает."
        actors: [sky, stars, skyline, new:cell_tower, battery, timetag]
        camera: "Медленная панорама вверх к вышке"
        animation:
          - {at: "@start", what: "Метка времени 03:10, звёзды, огонёк вышки мигает"}
          - {at: "@аккумуляторах", what: "Батарея появляется рядом с вышкой и начинает разряжаться 100 → 20 %"}
          - {at: "@часы", what: "Слово «ЧАСЫ» и зачёркнутое «ДНИ» по бокам"}
          - {at: "@батареи", what: "Рядом с вышкой встают новые батареи — заряд всё равно утекает до нуля"}
        graphics:
          - {at: "@start", type: timetag, text: "НОЧЬ · 03:10"}
          - {at: "@часы", type: text, text: "ЧАСЫ, А НЕ ДНИ"}
        sfx:
          - {at: "@аккумуляторах", sound: noise_sweep}
        ambience: [wind]
        transition: dip
      - id: n_phone
        at: "@десять-0.1"
        visual: "Экран телефона: полоски сети гаснут по одной, вместо них — «НЕТ СЕТИ»."
        actors: [phone, text]
        camera: "Наезд на экран, на «исчезает» — глитч"
        animation:
          - {at: "@десять", what: "Крупно «10 ЧАСОВ» счётчиком"}
          - {at: "@исчезает", what: "Полоски сети гаснут, экран глитчит, надпись «НЕТ СЕТИ»"}
        graphics:
          - {at: "@десять", type: "text count", text: "10 ЧАСОВ"}
          - {at: "@исчезает", type: badge, text: "НЕТ СЕТИ"}
        sfx:
          - {at: "@исчезает", sound: glitch}
        transition: zoom

  # ------------------------------------------------------------------ 5. ESCALATION: day 2, water
  - id: water
    role: escalation
    title: "Вода выше девятого этажа"
    goal: "Самая неожиданная бытовая деталь: вода пропадает только у верхних этажей — личный вопрос «а у меня?»."
    vo: "День второй. Открываешь кран — а воды нет. Выше девятого этажа её поднимают насосы. А насосам нужно электричество."
    on_screen: "ВЫШЕ 9 ЭТАЖА — БЕЗ ВОДЫ"
    devices: [stakes_raise, contrast, visual_proof, relatability, progress]
    facts: [f5]
    music: tension
    marks: {"девятого этажа": "#3a8ee6"}
    shots:
      - id: w_tap
        visual: "Ванная утром, рука открывает кран — из него падает одна капля и всё."
        actors: [room, new:faucet, timetag]
        camera: "Крупный план крана"
        animation:
          - {at: "@start", what: "Метка «ДЕНЬ 2 · 09:15», рассветный свет в окне"}
          - {at: "@кран", what: "Рука поворачивает вентиль"}
          - {at: "@нет", what: "Одна капля падает и разбивается"}
        graphics:
          - {at: "@start", type: timetag, text: "ДЕНЬ 2 · 09:15"}
        sfx:
          - {at: "@кран", sound: creak}
          - {at: "@нет", sound: drip}
        transition: whip_x
      - id: w_section
        at: "@Выше-0.1"
        visual: "Разрез многоэтажки: снизу поднимается синяя вода и останавливается на девятом этаже; выше — серые сухие этажи и насос с красным крестом."
        actors: [building, shape, callout, badge]
        camera: "Отъезд, чтобы видеть весь дом, затем подъём к насосу"
        animation:
          - {at: "@Выше", what: "Синий уровень воды растёт снизу до 9 этажа и замирает"}
          - {at: "@насосы", what: "Насос на техэтаже крутится и останавливается"}
          - {at: "@электричество", what: "На насос падает красный крест, этажи выше девятого темнеют"}
        graphics:
          - {at: "@девятого", type: callout, text: "ВЫШЕ 9 ЭТАЖА — БЕЗ ВОДЫ"}
          - {at: "@электричество", type: badge, text: "НАСОС ✕"}
        sfx:
          - {at: "@насосы", sound: groan, note: "насос останавливается"}
          - {at: "@электричество", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 6. TWIST: carbon monoxide
  - id: twist
    role: twist
    title: "Опаснее всего — плита"
    goal: "Закрыть петлю из крючка: самое опасное — не темнота, а угарный газ от плиты как обогревателя."
    vo: "Но самое опасное — не темнота и не жажда. Это газовая плита, которой греют квартиру. Угарный газ не видно и не слышно."
    on_screen: "УГАРНЫЙ ГАЗ"
    devices: [twist, sound_hit, emotion, callback]
    facts: [f3]
    music: sub
    marks: {"Угарный газ": "#ff3b4e"}
    shots:
      - id: t_stove
        visual: "Тёмная кухня, газовая плита с синими огнями на всех конфорках, люди греют руки. Тёплый свет пламени — единственный в кадре."
        actors: [room, new:gas_stove, person]
        camera: "Медленный наезд на конфорки, на «опасное» — резкий зум"
        animation:
          - {at: "@опасное", what: "Резкий зум на пламя; картинка уходит в холодный оттенок"}
          - {at: "@газовая", what: "Пламя на конфорках вспыхивает выше"}
        graphics:
          - {at: "@газовая", type: badge, text: "ПЛИТА ≠ ОБОГРЕВАТЕЛЬ"}
        sfx:
          - {at: "@опасное", sound: impact}
        transition: flash
      - id: t_co
        at: "@Угарный-0.1"
        visual: "От плиты расползается почти прозрачный серый туман, заполняет комнату; посередине пульсирует красный штамп."
        actors: [room, particles, text, badge]
        camera: "Медленный отъезд, лёгкое «плывущее» качание"
        animation:
          - {at: "@Угарный", what: "Серый туман (steam) расползается от плиты по комнате"}
          - {at: "@слышно", what: "Звук обрывается — тишина, остаётся только сердцебиение"}
        graphics:
          - {at: "@Угарный", type: "text stamp", text: "УГАРНЫЙ ГАЗ"}
          - {at: "@видно", type: text, text: "НЕ ВИДНО · НЕ СЛЫШНО"}
        sfx:
          - {at: "@Угарный", sound: heartbeat}
          - {at: "@видно", sound: hiss}
        transition: dissolve

  # ------------------------------------------------------------------ 7. PAYOFF: 3 actions
  - id: payoff
    role: payoff
    title: "Три действия в первый час"
    goal: "Главная награда: чёткий план из трёх действий, который закрывает все угрозы ролика (сохранить и переслать)."
    vo: "Поэтому в первый же час сделай три вещи. Набери воды в ванну и бутылки. Заряди пауэрбанк. И свети фонариком, а не свечами."
    on_screen: "3 ДЕЙСТВИЯ В ПЕРВЫЙ ЧАС"
    devices: [mini_payoff, save_trigger, text_reinforcement, progress, contrast]
    facts: [f7, f4]
    music: epic
    shots:
      - id: p_list
        visual: "Светлый экран-облегчение: чек-лист из трёх пунктов, каждый появляется с иконкой (ванна, пауэрбанк, фонарик) и ставится зелёная галочка."
        actors: [checklist, image, text]
        camera: "Лёгкий наезд, на каждом пункте — микро-толчок"
        animation:
          - {at: "@три", what: "Заголовок «В ПЕРВЫЙ ЧАС» и цифра 3"}
          - {at: "@Набери", what: "Пункт 1 + иконка ванны, вода наливается"}
          - {at: "@Заряди", what: "Пункт 2 + пауэрбанк заполняется зелёным"}
          - {at: "@фонариком", what: "Пункт 3 + луч фонарика; свеча зачёркнута"}
        graphics:
          - {at: "@Набери", type: checklist, text: "НАБРАТЬ ВОДУ"}
          - {at: "@Заряди", type: checklist, text: "ЗАРЯДИТЬ ПАУЭРБАНК"}
          - {at: "@фонариком", type: checklist, text: "ФОНАРИК, НЕ СВЕЧИ"}
        sfx:
          - {at: "@Набери", sound: chime}
          - {at: "@Заряди", sound: chime}
          - {at: "@фонариком", sound: chime}
        transition: whip_y
      - id: p_candle
        at: "@свечами-0.1"
        visual: "Свеча крупно, её перечёркивает красная линия, рядом — луч фонарика."
        actors: [image, shape]
        camera: "Статика с толчком"
        animation:
          - {at: "@свечами", what: "Красная линия перечёркивает свечу"}
        graphics: []
        sfx:
          - {at: "@свечами", sound: pop}
        transition: cut

  # ------------------------------------------------------------------ 8. CTA
  - id: cta
    role: cta
    title: "А ты на каком этаже?"
    goal: "Комментарий одним числом (этаж) + пересылка соседям; финальный кадр возвращает дом из крючка."
    vo: "А ты на каком этаже? Пиши — проверим, будет ли у тебя вода. И перешли соседям, пока свет ещё есть."
    on_screen: "ТВОЙ ЭТАЖ?"
    devices: [comment_bait, share_trigger, callback, direct_address]
    music: calm
    shots:
      - id: c_house
        visual: "Тот же дом из первого кадра, ночью, окна тёмные; линия девятого этажа подсвечена синим. На вопросе этажи нумеруются, затем дом снова загорается — как будто свет дали."
        actors: [sky, building, text, badge]
        camera: "Отъезд на весь дом"
        animation:
          - {at: "@этаже", what: "Этажи нумеруются снизу вверх, синяя линия на девятом"}
          - {at: "@вода", what: "Этажи до девятого подсвечиваются синим, выше — серым"}
          - {at: "@есть", what: "Окна загораются волной снизу вверх — свет дали (петля к началу)"}
        graphics:
          - {at: "@этаже", type: text, text: "ТВОЙ ЭТАЖ?"}
          - {at: "@перешли", type: badge, text: "ОТПРАВЬ СОСЕДЯМ"}
        sfx:
          - {at: "@этаже", sound: ping}
          - {at: "@есть", sound: sparkle}
        transition: whip_x

loops:
  - {id: l1, question: "Что опаснее темноты?", open: hook, close: twist}
  - {id: l2, question: "Что делать, чтобы это пережить?", open: hook, close: payoff}

engagement:
  comment: "А ты на каком этаже? Ответ одним числом — и спор «у меня вода будет / не будет»."
  share: "Ролик-предупреждение «для своих»: переслать соседям, родителям, в чат дома — пока свет есть."
  save: "Три действия первого часа — короткий чек-лист, к которому вернутся при следующем отключении."
  follow: "Рубрика «Что будет, если…»: следующая серия — «если на неделю пропадёт интернет»."
  rewatch: "Быстрые цифры (4 часа, 10 часов, 9 этаж) и детали в кадрах; финальный кадр — тот же дом, что в начале."
  cta: {beat: cta, text: "Напиши свой этаж — и перешли соседям", type: comment}


beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Польза есть. Целых три"
    goal: "Остановить палец парадоксом «у азарта есть польза» и открыть петлю «одна деталь тебе не понравится»."
    vo: "У азартных игр есть польза. Целых три. Но одна деталь тебе точно не понравится."
    on_screen: "ПОЛЬЗА АЗАРТНЫХ ИГР"
    devices: [open_loop, pattern_interrupt, text_reinforcement, direct_address, sound_hit]
    music: pulse
    marks: {"польза": "#ffd34d"}
    shots:
      - id: h_neon
        visual: "Тёмная кирпичная стена казино ночью, неоновая вывеска «АЗАРТ = ВРЕД» красным; слово «ВРЕД» трещит и гаснет, на его месте загорается золотое «ПОЛЬЗА». Внизу размыто мерцают огни автоматов, сверху падают редкие искры."
        actors: [neon_sign, text, particles, shape]
        camera: "Медленный наезд на вывеску, лёгкое покачивание"
        animation:
          - {at: "@start", what: "Вывеска «АЗАРТ = ВРЕД» вспыхивает с треском"}
          - {at: "@есть", what: "«ВРЕД» мигает и гаснет"}
          - {at: "@польза", what: "Загорается золотое «ПОЛЬЗА», искры"}
        graphics:
          - {at: "@польза", type: "text slam", text: "ПОЛЬЗА АЗАРТНЫХ ИГР"}
        sfx:
          - {at: "@start", sound: buzz, note: "неон включается"}
          - {at: "@есть", sound: glitch}
          - {at: "@польза", sound: impact}
        ambience: [hum]
        transition: cut
      - id: h_three
        at: "@Целых-0.1"
        visual: "Три пустые карточки рубашкой вверх на зелёном сукне с цифрами 1, 2, 3; третья карточка дрожит и подсвечивается красным краем — «подвох»."
        actors: [playing_card, text, badge]
        camera: "Отъезд сверху, на «понравится» — резкий наезд на третью карту"
        animation:
          - {at: "@Целых", what: "Три карты падают на сукно одна за другой"}
          - {at: "@деталь", what: "Над картами выезжает плашка «1 ПОДВОХ»"}
          - {at: "@понравится", what: "Третья карта вспыхивает красным краем"}
        graphics:
          - {at: "@Целых", type: text, text: "3 ПОЛЬЗЫ"}
          - {at: "@деталь", type: badge, text: "+1 ПОДВОХ"}
        sfx:
          - {at: "@Целых", sound: click, note: "карты ложатся"}
          - {at: "@деталь", sound: pop}
          - {at: "@понравится", sound: kick}
        transition: whip_x

  # ------------------------------------------------------------------ 2. POINT 1 — математика
  - id: math
    role: point
    title: "Польза №1 — математика"
    goal: "Первая награда: теория вероятностей родилась из вопроса игрока."
    vo: "Первая — математика. Семнадцатый век. Игрок спросил Паскаля, как честно поделить ставку, если игру прервали. Из его переписки с Ферма родилась теория вероятностей."
    on_screen: "ТЕОРИЯ ВЕРОЯТНОСТЕЙ"
    devices: [mini_payoff, visual_proof, progress, number_reveal]
    facts: [f1, f2]
    music: pulse
    marks: {"теория вероятностей": "#ffd34d"}
    shots:
      - id: m_dice
        visual: "Стол при свечах: две игральные кости катятся по тёмному дереву, рядом стопка монет и перо; метка «ПОЛЬЗА №1 · МАТЕМАТИКА» и «1654 · ПАРИЖ»."
        actors: [image, coins, timetag, badge, particles]
        camera: "Наезд сверху на кости, тёплый свет свечи качается"
        animation:
          - {at: "@start", what: "Кости катятся и останавливаются"}
          - {at: "@Семнадцатый", what: "Печатается метка «1654 · ПАРИЖ»"}
        graphics:
          - {at: "@Первая", type: badge, text: "ПОЛЬЗА №1 · МАТЕМАТИКА"}
          - {at: "@Семнадцатый", type: timetag, text: "1654 · ПАРИЖ"}
        sfx:
          - {at: "@start", sound: click, note: "кости"}
          - {at: "@Семнадцатый", sound: typing}
        ambience: [room]
        transition: whip_x
      - id: m_question
        at: "@Игрок-0.1"
        visual: "Два силуэта за столом: игрок с картами и Паскаль в парике; над игроком реплика «КАК ПОДЕЛИТЬ СТАВКУ?», банк монет посередине делится пунктиром на две неравные части."
        actors: [person, bubble, coins, shape]
        camera: "Панорама слева направо от игрока к Паскалю"
        animation:
          - {at: "@Игрок", what: "Реплика игрока выскакивает"}
          - {at: "@поделить", what: "Пунктир делит банк монет"}
          - {at: "@прервали", what: "Карты падают на стол — игра прервана"}
        graphics:
          - {at: "@Игрок", type: bubble, text: "КАК ПОДЕЛИТЬ СТАВКУ?"}
        sfx:
          - {at: "@Игрок", sound: pop}
          - {at: "@прервали", sound: scrape}
        transition: zoom
      - id: m_letters
        at: "@переписки-0.1"
        visual: "Карта Франции: письма летят дугой между Парижем и Тулузой; из конвертов высыпаются формулы и дроби, которые собираются в большую надпись «ТЕОРИЯ ВЕРОЯТНОСТЕЙ»."
        actors: [map, image, text, particles]
        camera: "Отъезд, затем подъём к надписи"
        animation:
          - {at: "@переписки", what: "Письма летят по дуге Париж ↔ Тулуза"}
          - {at: "@Ферма", what: "Из конвертов вылетают формулы «1/2», «3/4», «E»"}
          - {at: "@теория", what: "Формулы собираются в золотую надпись"}
        graphics:
          - {at: "@теория", type: "text slam", text: "ТЕОРИЯ ВЕРОЯТНОСТЕЙ"}
        sfx:
          - {at: "@переписки", sound: whoosh}
          - {at: "@Ферма", sound: sparkle}
          - {at: "@теория", sound: impact}
        transition: zoom

  # ------------------------------------------------------------------ 3. POINT 2 — наука
  - id: science
    role: point
    title: "Польза №2 — наука"
    goal: "Вторая награда: метод Монте-Карло назван в честь казино, на нём считают погоду и риски."
    vo: "Вторая — наука. Физик раскладывал пасьянс и придумал метод, названный в честь казино Монте-Карло. Сегодня на нём считают прогноз погоды и риски банков."
    on_screen: "МЕТОД МОНТЕ-КАРЛО"
    devices: [mini_payoff, visual_proof, progress, contrast]
    facts: [f3, f4]
    music: pulse
    shots:
      - id: s_solitaire
        visual: "Больничная тумбочка ночью: на одеяле разложен пасьянс, карты сами переворачиваются; метки «ПОЛЬЗА №2 · НАУКА» и «1946 · ЛОС-АЛАМОС»."
        actors: [playing_card, timetag, badge]
        camera: "Наезд сверху на пасьянс"
        animation:
          - {at: "@Вторая", what: "Метка «ПОЛЬЗА №2» выезжает"}
          - {at: "@пасьянс", what: "Карты пасьянса переворачиваются волной"}
        graphics:
          - {at: "@Вторая", type: badge, text: "ПОЛЬЗА №2 · НАУКА"}
          - {at: "@пасьянс", type: timetag, text: "1946 · ЛОС-АЛАМОС"}
        sfx:
          - {at: "@Вторая", sound: whoosh}
          - {at: "@пасьянс", sound: click}
        transition: whip_x
      - id: s_casino
        at: "@казино-0.1"
        visual: "Неоновая вывеска «MONTE-CARLO» над фасадом казино; тысячи точек-«бросков» сыплются в квадрат с кругом — классическая картинка метода (красные внутри, серые снаружи)."
        actors: [neon_sign, particles, shape, text]
        camera: "Медленный наезд на вывеску, затем вниз к точкам"
        animation:
          - {at: "@казино", what: "Вывеска «MONTE-CARLO» вспыхивает"}
          - {at: "@казино+0.7", what: "Точки сыплются в квадрат с кругом"}
        graphics:
          - {at: "@казино", type: "text", text: "МЕТОД МОНТЕ-КАРЛО"}
        sfx:
          - {at: "@казино", sound: buzz}
          - {at: "@казино+0.7", sound: typing}
        transition: zoom
      - id: s_weather
        at: "@Сегодня-0.1"
        visual: "Экран разделён: сверху карта погоды с веером траекторий циклона (ансамбль прогнозов), снизу биржевой график с веером возможных сценариев; подписи «ПОГОДА» и «РИСКИ БАНКОВ»."
        actors: [sky, cloud, chart, text, badge]
        camera: "Плавный подъём сверху вниз от погоды к графику"
        animation:
          - {at: "@погоды", what: "Веер траекторий рисуется на карте погоды"}
          - {at: "@банков", what: "Веер сценариев на биржевом графике"}
        graphics:
          - {at: "@погоды", type: badge, text: "ПРОГНОЗ ПОГОДЫ"}
          - {at: "@банков", type: badge, text: "РИСКИ БАНКОВ"}
        sfx:
          - {at: "@погоды", sound: noise_sweep}
          - {at: "@банков", sound: blip}
        transition: whip_y

  # ------------------------------------------------------------------ 4. POINT 3 — красота
  - id: opera
    role: point
    title: "Польза №3 — красота"
    goal: "Третья, самая неожиданная награда: Сиднейскую оперу построили на деньги лотерей."
    vo: "Третья — красота. Сиднейскую оперу построили на деньги лотерей. Восемьдесят шесть миллионов билетов — сто два миллиона долларов. Без лотерей её бы просто не было."
    on_screen: "ОПЕРА НА ЛОТЕРЕЯХ"
    devices: [mini_payoff, visual_proof, number_reveal, emotion, progress]
    facts: [f5]
    music: epic
    marks: {"сто два миллиона долларов": "#ffd34d"}
    shots:
      - id: o_house
        visual: "Закатная гавань Сиднея: белые паруса оперы над водой, по небу плывут облака, в воде дрожит отражение; метка «ПОЛЬЗА №3 · КРАСОТА»."
        actors: [sky, new:opera_house, shape, badge, particles]
        camera: "Широкая панорама вдоль гавани с параллаксом воды"
        animation:
          - {at: "@Третья", what: "Метка «ПОЛЬЗА №3»"}
          - {at: "@Сиднейскую", what: "Паруса оперы вырастают из воды один за другим"}
          - {at: "@лотерей", what: "Паруса на миг превращаются в лотерейные билеты"}
        graphics:
          - {at: "@Третья", type: badge, text: "ПОЛЬЗА №3 · КРАСОТА"}
          - {at: "@лотерей", type: "text slam", text: "ОПЕРА НА ЛОТЕРЕЯХ"}
        sfx:
          - {at: "@Третья", sound: whoosh}
          - {at: "@Сиднейскую", sound: riser}
          - {at: "@лотерей", sound: impact}
        ambience: [ocean]
        transition: whip_x
      - id: o_tickets
        at: "@Восемьдесят-0.1"
        visual: "Дождь из лотерейных билетов над оперой; крупный счётчик «86 700 000 БИЛЕТОВ», затем «$102 000 000»; рядом зачёркнутая смета «$7 000 000»."
        actors: [image, text, coins, new:opera_house]
        camera: "Наезд на счётчик, билеты пролетают мимо камеры"
        animation:
          - {at: "@Восемьдесят", what: "Сверху сыплются билеты, счётчик билетов крутится"}
          - {at: "@сто", what: "Счётчик долларов крутится до $102 000 000"}
          - {at: "@просто", what: "Билеты складываются в силуэт оперы"}
        graphics:
          - {at: "@Восемьдесят", type: "text count", text: "86 700 000 БИЛЕТОВ"}
          - {at: "@сто", type: "text count", text: "$102 000 000"}
        sfx:
          - {at: "@Восемьдесят", sound: typing}
          - {at: "@долларов", sound: sparkle}
          - {at: "@просто", sound: chime}
        transition: zoom

  # ------------------------------------------------------------------ 5. TWIST — кроме игроков
  - id: twist
    role: twist
    title: "Кроме самих игроков"
    goal: "Поворот и закрытие первой петли: польза досталась человечеству, но не игрокам."
    vo: "А теперь заметь: польза досталась всем. Кроме самих игроков."
    on_screen: "ВСЕМ, КРОМЕ ИГРОКОВ"
    devices: [twist, contrast, emotion, sound_hit]
    music: sub
    shots:
      - id: t_three
        visual: "Три золотые карточки-пользы (формула, точки Монте-Карло, опера) сияют наверху; от каждой к толпе силуэтов внизу тянутся лучи — люди светятся."
        actors: [card, silhouette, shape, particles]
        camera: "Отъезд, видна вся конструкция"
        animation:
          - {at: "@заметь", what: "Три карточки загораются по очереди"}
          - {at: "@всем", what: "Лучи доходят до толпы, силуэты светятся золотом"}
        graphics:
          - {at: "@всем", type: text, text: "ВСЕМ"}
        sfx:
          - {at: "@заметь", sound: chime}
          - {at: "@всем", sound: sparkle}
        transition: flash
      - id: t_player
        at: "@Кроме-0.1"
        visual: "Луч прожектора на одиноком игроке за зелёным столом: перед ним пустое место, его фишки уезжают по сукну прочь; цвет уходит в холодный, штамп «КРОМЕ ИГРОКОВ»."
        actors: [person, chips, poker_table, badge]
        camera: "Резкий наезд на игрока, тряска на штампе"
        animation:
          - {at: "@Кроме", what: "Свет гаснет, остаётся прожектор на игроке"}
          - {at: "@игроков", what: "Фишки уезжают со стола, штамп"}
        graphics:
          - {at: "@игроков", type: "badge stamp", text: "КРОМЕ ИГРОКОВ"}
        sfx:
          - {at: "@Кроме", sound: boom}
          - {at: "@игроков", sound: slam}
        transition: glitch

  # ------------------------------------------------------------------ 6. PAYOFF — та же математика против игрока
  - id: math_wins
    role: payoff
    title: "Математика против игрока"
    goal: "Развязка и закрытие второй петли: та самая теория вероятностей доказывает, что игрок проигрывает."
    vo: "По той же теории вероятностей рулетка забирает почти три процента с каждой ставки. Играешь дольше — проигрываешь вернее."
    on_screen: "КАЗИНО ЗАБИРАЕТ 2,7%"
    devices: [number_reveal, visual_proof, callback, mini_payoff]
    facts: [f6]
    music: tension
    marks: {"почти три процента": "#ff3b4e"}
    shots:
      - id: w_wheel
        visual: "Рулетка сверху крупно: колесо крутится, шарик бежит; из 37 ячеек подсвечивается одна зелёная «0»; рядом формула «1 из 37 = 2,7%» — та же золотая типографика, что у «теории вероятностей»."
        actors: [new:roulette, text, badge]
        camera: "Медленный наезд и вращение вместе с колесом"
        animation:
          - {at: "@теории", what: "Колесо раскручивается"}
          - {at: "@рулетка", what: "Зелёное зеро подсвечивается"}
          - {at: "@три", what: "Формула «1/37 = 2,7%» печатается"}
        graphics:
          - {at: "@теории", type: badge, text: "ТА ЖЕ МАТЕМАТИКА"}
          - {at: "@три", type: "text slam", text: "−2,7% С КАЖДОЙ СТАВКИ"}
        sfx:
          - {at: "@теории", sound: riser}
          - {at: "@рулетка", sound: click}
          - {at: "@процента", sound: kick}
        transition: zoom
      - id: w_curve
        at: "@Играешь-0.1"
        visual: "График баланса игрока: зубчатая линия с короткими всплесками выигрышей неумолимо ползёт вниз; ось «СТАВКИ» растёт, «БАЛАНС» уходит в красное."
        actors: [chart, text]
        camera: "Панорама вправо вдоль линии"
        animation:
          - {at: "@Играешь", what: "Линия рисуется слева направо"}
          - {at: "@вернее", what: "Линия уходит в красное, мигает минус"}
        graphics:
          - {at: "@вернее", type: badge, text: "ДОЛЬШЕ = ВЕРНЕЕ"}
        sfx:
          - {at: "@Играешь", sound: typing}
          - {at: "@вернее", sound: hiss}
        transition: whip_x

  # ------------------------------------------------------------------ 7. PROOF — тот, кто обыграл казино
  - id: thorp
    role: proof
    title: "Даже тот, кто обыграл казино"
    goal: "Живое доказательство: человек, который математикой обыграл блэкджек, ушёл с ней на биржу."
    vo: "Даже профессор, обыгравший блэкджек, ушёл с этой математикой на биржу."
    on_screen: "ОБЫГРАЛ — И УШЁЛ"
    devices: [visual_proof, contrast, mini_payoff]
    facts: [f7]
    music: tension
    shots:
      - id: w_thorp
        visual: "Силуэт профессора уходит от стола блэкджека (карты 10 и туз, стопки фишек) к светящемуся биржевому табло; метка «1962 · ОБЫГРАЛ БЛЭКДЖЕК»."
        actors: [person, playing_card, chips, chart, timetag]
        camera: "Панорама вслед за профессором слева направо"
        animation:
          - {at: "@профессор", what: "Карты 10 и туз переворачиваются: блэкджек"}
          - {at: "@ушёл", what: "Профессор встаёт и уходит вправо"}
          - {at: "@биржу", what: "Загорается биржевое табло"}
        graphics:
          - {at: "@профессор", type: timetag, text: "1962 · ОБЫГРАЛ БЛЭКДЖЕК"}
          - {at: "@биржу", type: badge, text: "УШЁЛ НА БИРЖУ"}
        sfx:
          - {at: "@профессор", sound: click}
          - {at: "@ушёл", sound: footstep}
          - {at: "@биржу", sound: ping}
        transition: zoom

  # ------------------------------------------------------------------ 8. CTA
  - id: cta
    role: cta
    title: "Какая удивила?"
    goal: "Вывод одной фразой + спор одной цифрой; петля к первому кадру — неоновая вывеска."
    vo: "Выходит, главная польза азартных игр — понять, почему играть невыгодно. Какая из трёх удивила больше? Пиши цифру."
    on_screen: "1, 2 ИЛИ 3?"
    devices: [comment_bait, callback, loop_ending, direct_address, share_trigger]
    music: calm
    shots:
      - id: z_sign
        visual: "Снова неоновая вывеска из первого кадра: теперь она горит «ПОЛЬЗА = ПОНЯТЬ», рядом гаснет «ИГРАТЬ»."
        actors: [neon_sign, text, particles]
        camera: "Медленный отъезд"
        animation:
          - {at: "@главная", what: "Вывеска перегорает на «ПОЛЬЗА = ПОНЯТЬ»"}
          - {at: "@невыгодно", what: "Слово «ИГРАТЬ» гаснет"}
        graphics:
          - {at: "@понять", type: text, text: "ПОНЯТЬ, ПОЧЕМУ НЕ ИГРАТЬ"}
        sfx:
          - {at: "@главная", sound: buzz}
          - {at: "@невыгодно", sound: glitch}
        transition: whip_x
      - id: z_choice
        at: "@Какая-0.1"
        visual: "Три карточки из хука переворачиваются лицом: «1 МАТЕМАТИКА», «2 НАУКА», «3 ОПЕРА»; над ними вопрос «КАКАЯ УДИВИЛА?»."
        actors: [card, text, badge]
        camera: "Лёгкий наезд"
        animation:
          - {at: "@Какая", what: "Карточки переворачиваются по очереди"}
          - {at: "@цифру", what: "Цифры 1, 2, 3 пульсируют"}
        graphics:
          - {at: "@Какая", type: text, text: "1, 2 ИЛИ 3?"}
          - {at: "@цифру", type: badge, text: "ПИШИ ЦИФРУ"}
        sfx:
          - {at: "@Какая", sound: click}
          - {at: "@цифру", sound: pop}
        transition: zoom

loops:
  - {id: l1, question: "Какие три пользы может быть у азартных игр?", open: hook, close: opera}
  - {id: l2, question: "Что за деталь мне «точно не понравится»?", open: hook, close: math_wins}

engagement:
  comment: "Какая польза удивила больше: 1, 2 или 3? Ответ одной цифрой."
  share: "Переслать другу, который верит в «систему» в казино, или тому, кто любит неожиданные факты из истории науки."
  save: "Три готовых факта для спора: Паскаль и Ферма, метод Монте-Карло, Сиднейская опера — и почему 2,7% всегда против игрока."
  follow: "Спецвыпуск серии «Аферы» о казино: в профиле — истории про тех, кто обманывал казино и игроков."
  rewatch: "Первый и последний кадр — одна и та же вывеска с разным текстом; на картинках мелькают формулы, цифры и детали, которые хочется рассмотреть."
  cta: {beat: cta, text: "Какая из трёх удивила больше? Пиши цифру", type: comment}

package:
  tiktok:
    caption: "Польза азартных игр — она правда есть. Целых три. Но игрокам от неё ничего не досталось 🎲"
    hashtags: ["#азартныеигры", "#казино", "#фактыпронауку", "#сиднейскаяопера", "#аферы"]
    cover: "ПОЛЬЗА АЗАРТНЫХ ИГР"
    sound: "Своя музыка движка (pulse → epic → sub → tension → calm), без трендового звука"
  reels:
    caption: "Польза азартных игр, о которой не говорят: теория вероятностей, метод Монте-Карло и Сиднейская опера. Перешли тому, кто верит в систему 🎲"
    hashtags: ["#азартныеигры", "#казино", "#факты"]
    cover: "ПОЛЬЗА АЗАРТНЫХ ИГР"
  shorts:
    title: "Польза азартных игр: 3 факта, о которых не говорят"
    description: "Теория вероятностей из вопроса игрока, метод Монте-Карло и Сиднейская опера на деньги лотерей — и почему игроку от этого ничего не достаётся."
    hashtags: ["#азартныеигры", "#казино"]
  first_frame: "Неоновая вывеска «АЗАРТ = ВРЕД» на тёмной стене; через полсекунды «ВРЕД» гаснет и загорается «ПОЛЬЗА» — понятно без звука."
  posting: ["Вечер 19:00–22:00, через 1–3 дня после прошлой серии «Афер»", "Закрепить комментарий: «Моя — третья. А твоя? 1, 2 или 3»", "Без ссылок, брендов казино и призывов играть"]

production:
  theme: {preset: minimal, accent: "#ffd34d", captions: clean}
  palette: ["#0b0a12 ночь", "#ffd34d золото пользы", "#ff3b4e неон и минус", "#0e5a3a сукно", "#f4ead8 бумага и паруса"]
  music: {key: D, mode: minor, bpm: 100}
  assets:
    - "Новые актёры проекта: roulette (колесо рулетки сверху: 37 ячеек, вращение, шарик, подсветка зеро), opera_house (силуэт Сиднейской оперы: паруса растут по одному, отражение в воде)"
    - "Эмодзи (Twemoji) через image: 🎲 кости, 🎟️ билеты, ✉️ письма"
  notes:
    - "Цвет: тёплое золото на тёмном (три пользы) → холодный прожектор и зелёное сукно (игрок) → красный минус (рулетка) → спокойный неон финала"
    - "Три карточки 1-2-3 — сквозной образ: в хуке рубашкой вверх, в финале лицом"
    - "Брендов казино не показывать; MONTE-CARLO — название метода и города"

review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 9, emotion: 8, payoff: 9, visuals: 8, cta: 8, platform: 7, accuracy: 9}
  weak_points:
    - "Тема азартных игр — риск ограничений площадок; вывод прямо против игры, без брендов и призывов."
    - "«Из переписки родилась теория вероятностей» — упрощение (Кардано писал об играх раньше); так формулирует большинство историй математики."
    - "Опера: часть денег дал фонд пожертвований (~0,9 млн), поэтому «построили на деньги лотерей», а не «только на лотереях»."
    - "Блок развязки плотный (рулетка + график + Торп); проверить темп по --tts."
  improvements:
    - "Отказались от угла «польза для игрока» (мозг, общение) — слабые данные и звучит как реклама азарта."
    - "Добавлен поворот «всем, кроме игроков»: он делает ролик честным и даёт зрителю суть."
    - "Опера поставлена третьей как самый красивый и неожиданный пункт; Торп — мостик к серии «Аферы»."

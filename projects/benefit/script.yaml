brief:
  goal: "Ролик, которого ещё не было: «польза азартных игр» без рекламы игры — три реальные пользы для человечества и честный вывод, что игроку от них ничего не достаётся. Охват за счёт парадокса в заголовке, пересылки и спор в комментариях."
  kpi: [completion, shares, comments, saves, follows]
  audience:
    who: "Зрители серии «Аферы» и все, кто любит неожиданные факты, историю науки и истории про азарт; часть сама играет или знает того, кто играет"
    age: "18–35"
    interests: [факты, история, наука, деньги, казино]
    pains: ["одинаковые ролики «азарт — это зло»", "морализаторство без фактов"]
    desires: ["узнать то, чего не знают друзья", "аргумент для спора с тем, кто верит в систему", "красивый вывод"]
    knowledge: "Знают, что «казино всегда в плюсе», но не знают, что теорию вероятностей придумали из-за вопроса игрока, а Сиднейскую оперу оплатили лотереи"
  promise: "Три настоящие пользы азартных игр, о которых не говорят, — и почему игроку от них ничего не достаётся."
  tone: "Парадокс и восхищение → холодный поворот: тёплое золото и неон (польза) сменяются зелёным сукном и красным минусом (игрок); финал спокойный и умный."
  keywords: ["азартные игры", "польза азартных игр", "казино", "лотерея", "теория вероятностей"]
  constraints:
    - "Не реклама азартных игр: никаких брендов, ссылок, бонусов и призывов играть; вывод — играть невыгодно"
    - "Польза — для человечества (наука, математика, культура), а не для игрока; это прямо проговаривается"
    - "Не используем спорное «польза для мозга пожилых» и «Великую стену оплатило кено» — слабые источники"
    - "Паскаль и Ферма: формулировка «из переписки родилась теория вероятностей» — общепринятая в истории математики; роль кавалера де Мере не преувеличиваем (имя не звучит, «игрок»)"
    - "Опера: «оплатили лотереи» — так пишут Казначейство Нового Южного Уэльса и сама Опера («largely paid for»); небольшая часть пришла из фонда пожертвований"
    - "Рулетка: «почти три процента» — европейская рулетка с одним зеро (2,7%); американская с двумя — ещё больше, не уточняем"

research:
  summary: >-
    Теория вероятностей началась с вопросов игрока: в 1654 году кавалер де Мере спросил Паскаля, как честно поделить ставку
    в прерванной игре, и из переписки Паскаля с Ферма выросли понятия, на которых стоит теория вероятностей (первое явное
    рассуждение о математическом ожидании). В 1946 году Станислав Улам, раскладывая пасьянс, придумал метод статистических
    испытаний; Метрополис назвал его в честь казино Монте-Карло, куда ездил играть дядя Улама. Сегодня метод Монте-Карло —
    основа ансамблевых прогнозов погоды и оценки финансовых рисков. Сиднейскую оперу оплатили лотереи: 496 тиражей,
    86,7 млн билетов, 102 млн долларов (при смете в 7 млн). При этом та же математика доказывает, что игрок проигрывает:
    преимущество казино в европейской рулетке — 1/37 ≈ 2,7% с каждой ставки. Эдвард Торп, математически доказавший,
    что блэкджек можно обыграть подсчётом карт, в итоге применил вероятности в хедж-фондах.
  facts:
    - id: f1
      text: "Около 1654 года кавалер де Мере (Антуан Гомбо) задал Паскалю «задачу о разделе ставки»; Паскаль обсуждал её в переписке с Ферма, и вместе они развили понятия, которые до сих пор лежат в основе теории вероятностей, — первое явное рассуждение о математическом ожидании."
      source: "https://en.wikipedia.org/wiki/Problem_of_points"
      confidence: high
    - id: f2
      text: "Переписка Паскаля и Ферма о задачах игры в кости шла с июля по октябрь 1654 года; с неё принято отсчитывать начало исчисления вероятностей."
      source: "https://york.ac.uk/depts/maths/histstat/pascal.htm"
      confidence: high
    - id: f3
      text: "Идея метода Монте-Карло пришла Станиславу Уламу в 1946 году, когда он выздоравливал после болезни и раскладывал пасьянс; кодовое имя предложил Николас Метрополис — в честь казино Монте-Карло, куда дядя Улама занимал деньги, чтобы играть."
      source: "https://en.wikipedia.org/wiki/Monte_Carlo_method"
      confidence: high
    - id: f4
      text: "Методы Монте-Карло лежат в основе ансамблевых моделей современного прогноза погоды и широко применяются для оценки рисков и неопределённости в финансах (опционы, кредитный риск)."
      source: "https://en.wikipedia.org/wiki/Monte_Carlo_method"
      confidence: high
    - id: f5
      text: "496 лотерей и 86,7 млн билетов принесли 102 млн долларов с 1957 по 1986 год на Сиднейскую оперу; смета была 7 млн. «Без этих лотерей Оперу никогда бы не построили» (Казначейство Нового Южного Уэльса)."
      source: "https://www.nsw.gov.au/departments-and-agencies/nsw-treasury/about-us/nsw-treasury-bicentenary/walking-a-tightrope/moments/house-lotteries-built"
      confidence: high
    - id: f6
      text: "В европейской рулетке (одно зеро) ставка выигрывает с вероятностью 1/37; математическое ожидание −1/37 ≈ −2,70% — это преимущество казино с каждой ставки."
      source: "https://en.wikipedia.org/wiki/Roulette"
      confidence: high
    - id: f7
      text: "Эдвард Торп в книге «Обыграй дилера» (1962) математически доказал, что преимущество казино в блэкджеке можно преодолеть подсчётом карт; вместе с Клодом Шенноном построил первый носимый компьютер для рулетки (1960–1961); позже применял теорию вероятностей в хедж-фондах."
      source: "https://en.wikipedia.org/wiki/Edward_O._Thorp"
      confidence: high
    - id: f8
      text: "Британский музей (1753) — первый публичный национальный музей; деньги на покупку и размещение коллекций дала государственная лотерея."
      source: "https://www.gardenvisit.com/book/london_and_its_environs_1927/37_the_british_museum/history_of_the_british_museum"
      confidence: medium
  angles:
    - id: a1
      text: "Три настоящие пользы азартных игр — математика, наука, красота — и поворот: польза досталась всем, кроме игроков; та же математика доказывает, что игрок проигрывает"
      score: 9
      why: "Парадокс в заголовке останавливает, каждый пункт — реальный факт с «вау», поворот снимает риск «рекламы азарта» и даёт умный вывод; естественный спор «какая польза удивила больше»."
    - id: a2
      text: "«Польза» для игрока: мозг, общение, адреналин — по исследованиям"
      score: 4
      why: "Данные слабые и спорные, ролик превратится в рекламу азарта и рискует ограничениями площадок."
    - id: a3
      text: "Что построено на деньги лотерей: Сиднейская опера, Британский музей, университеты Лиги плюща"
      score: 7
      why: "Красиво и неожиданно, но однообразно (одни здания) и без вывода — зритель не поймёт «суть»."
    - id: a4
      text: "Люди, которые обыграли казино математикой (Торп, Шеннон), и куда они потом ушли"
      score: 7
      why: "Сильная история, но близко к первым сериям «Афер»; лучше как деталь развязки."
  chosen_angle: a1
  insights:
    - "Парадокс «польза азарта» сам по себе — крючок: зритель ждёт либо рекламу, либо подвох; честный ответ — и польза есть, и подвох есть."
    - "Самая цепляющая деталь — математика, которую создали ради игроков, теперь доказывает, что игрок проигрывает (замкнутый круг)."
    - "Опера — визуально самый красивый пункт, его можно держать третьим как «самый неожиданный»."
    - "Торп — мостик к серии «Аферы»: человек, который реально обыграл казино, ушёл на биржу."
    - "Спор в комментариях одним символом: «1, 2 или 3» — какая польза удивила."


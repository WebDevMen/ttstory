            - {actor: person, x: 520, y: 1660, scale: 1.3, look: {age: adult, outfit: suit, hair: side, glasses: true, color: "#2a3346"}, until: "@ушёл-0.05", pose: [{at: 0, v: stand}, {at: "@обыгравший", v: cheer, dur: 0.3}], face: happy}
            - {actor: person, view: side, x: 520, y: 1660, scale: 1.3, look: {age: adult, outfit: suit, hair: side, glasses: true, color: "#2a3346"}, at: "@ушёл-0.05", walk: [{at: 0, v: 2.2}, {at: "@биржу+0.3", v: 0}], anim: [{at: "@ушёл-0.05", dur: 1.3, x: 1050, ease: inOut}], face: happy}
            - {actor: timetag, text: "1962 · ОБЫГРАЛ БЛЭКДЖЕК", x: 540, y: 220, size: 38, color: gold, space: screen, at: "@профессор-0.05", enter: wipe_right, enter_dur: 0.5}
            - {actor: badge, x: 540, y: 340, icon: "📈", title: "УШЁЛ НА БИРЖУ", style: solid, color: "#3cff8a", size: 48, space: screen, at: "@биржу-0.05", enter: stamp}
    sfx:
      - {sound: click, at: "@профессор", gain: -15}
      - {sound: sparkle, at: "@обыгравший", gain: -16}
      - {sound: footstep, at: "@ушёл", gain: -16}
      - {sound: footstep, at: "@ушёл+0.45", gain: -17}
      - {sound: ping, at: "@биржу", gain: -14}

  # ------------------------------------------------------------------ 8. CTA — главная польза + 1, 2 или 3
  - id: cta
    accent: "255,211,77"
    text: "Выходит, главная польза азартных игр — понять, почему играть невыгодно. Какая из трёх удивила больше? Пиши цифру."
    shots:
      - id: z_sign
        transition: {type: whip_x, flash: 0.08}
        effects:
          - {type: glow, at: [540, 820], sigma: 420, color: [1.0, 0.8, 0.3], intensity: 0.12}
        look: {bloom: [0.66, 0.42], grade: {contrast: 0.1, sat: 1.12}}
        ambience: [{sound: hum, gain: -22}]
        draw:
          bg: *night_bg
          camera: {keys: [{t: 0, z: 1.08, y: 930}, {t: end, z: 1.0, y: 960}], sway: {x: 4, y: 3, roll: 0.3, freq: 0.3}}
          layers:
            - *bricks
            - {actor: neon_sign, text: "ГЛАВНАЯ ПОЛЬЗА =", x: 540, y: 520, size: 64, color: gold, at: "@главная-0.1", enter: {type: fade, dur: 0.15}}
            - {actor: neon_sign, text: "ПОНЯТЬ", x: 540, y: 780, size: 170, color: gold, frame: false, at: "@понять-0.1", enter: {type: fade, dur: 0.15}}
            - {actor: neon_sign, text: "ИГРАТЬ", x: 540, y: 1040, size: 150, color: alarm, frame: false, off_at: "@невыгодно+0.25", stagger: 0.06, at: "@играть-0.1", enter: {type: fade, dur: 0.12}}
            - {actor: text, text: "НЕВЫГОДНО", x: 540, y: 1060, size: 120, weight: 900, color: "#ffffff", stroke: {w: 10, color: "#c2001f"}, rot: -7, at: "@невыгодно-0.05", enter: stamp, shadow: "0 0 30px rgba(255,40,60,.8)"}
            - {actor: particles, kind: embers, region: [0, 300, 1080, 1500], count: 20, colors: ["#ffd34d", "#ff8a3c"], alpha: 0.7}
            - {actor: timetag, text: "АФЕРЫ · СПЕЦВЫПУСК", x: 540, y: 200, size: 34, color: gold, space: screen}
      - id: z_choice
        start: "@Какая-0.15"
        transition: {type: zoom, dur: 0.3}
        captions_top: 1440
        look: {bloom: [0.7, 0.32], grade: {contrast: 0.08, sat: 1.1}}
        draw:
          bg: *green_bg
          camera: {keys: [{t: 0, z: 1.06}, {t: end, z: 1.0}]}
          layers:
            - {actor: text, text: "КАКАЯ УДИВИЛА?", x: 540, y: 380, size: 100, weight: 900, color: "#ffffff", stroke: {w: 10, color: "#031410"}, at: "@Какая-0.05", enter: pop}
            - {actor: playing_card, rank: "A", suit: s, w: 230, x: 210, y: 860, rot: -6, back: "#b3001b", until: "@Какая+0.2", exit: {type: fade, dur: 0.15}}
            - {actor: playing_card, rank: "A", suit: h, w: 230, x: 540, y: 840, back: "#b3001b", until: "@Какая+0.35", exit: {type: fade, dur: 0.15}}
            - {actor: playing_card, rank: "A", suit: d, w: 230, x: 870, y: 860, rot: 6, back: "#b3001b", until: "@Какая+0.5", exit: {type: fade, dur: 0.15}}
            - {actor: card, x: 210, y: 860, w: 290, rot: -6, emoji: "🎲", title: "МАТЕМАТИКА", sub: "Паскаль и Ферма", color: "#ffd34d", style: dark, size: 32, number: 1, at: "@Какая+0.2", enter: flip_y, shakes: [{at: "@цифру", amp: 5, dur: 0.3}]}
            - {actor: card, x: 540, y: 840, w: 290, emoji: "🌦️", title: "НАУКА", sub: "Монте-Карло", color: "#4de1ff", style: dark, size: 32, number: 2, at: "@Какая+0.35", enter: flip_y, shakes: [{at: "@цифру+0.1", amp: 5, dur: 0.3}]}
            - {actor: card, x: 870, y: 860, w: 290, rot: 6, emoji: "🎭", title: "ОПЕРА", sub: "102 млн на лотереях", color: "#ff8a3c", style: dark, size: 32, number: 3, at: "@Какая+0.5", enter: flip_y, shakes: [{at: "@цифру+0.2", amp: 5, dur: 0.3}]}
            - {actor: text, text: "1, 2 ИЛИ 3?", x: 540, y: 1130, size: 96, weight: 900, color: gold, stroke: {w: 8, color: "#031410"}, shadow: "0 0 30px rgba(255,211,77,.6)", at: "@больше-0.05", enter: pop}
            - {actor: badge, x: 540, y: 1290, icon: "💬", title: "ПИШИ ЦИФРУ", style: solid, color: gold, size: 50, at: "@Пиши-0.05", enter: drop, pulse: {freq: 1.6, amp: 0.04}}
    sfx:
      - {sound: buzz, at: "@главная", gain: -15, f: 120, d: 0.08, n: 3}
      - {sound: buzz, at: "@понять", gain: -16, f: 120, d: 0.08, n: 2}
      - {sound: glitch, at: "@невыгодно", gain: -14}
      - {sound: slam, at: "@невыгодно+0.05", gain: -14}
      - {sound: click, at: "@Какая+0.2", gain: -15}
      - {sound: click, at: "@Какая+0.35", gain: -16}
      - {sound: click, at: "@Какая+0.5", gain: -16}
      - {sound: pop, at: "@больше", gain: -14}
      - {sound: pop, at: "@Пиши", gain: -14}

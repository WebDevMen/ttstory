# «Польза азартных игр» — спецвыпуск серии «Аферы». 100% code-drawn video from projects/benefit/script.yaml
# (skill write-script → vg.py script project → this file).
# Actors: library casino.js (neon_sign, slot_machine, coins), cards.js (playing_card, chips), ui/world/people/libs and the
# project's actors/benefit.js (roulette, opera_house, mc_dots, walks). Coordinates: screen px 1080x1920. Times: "@word".

title: "Польза азартных игр"

voice: {voice: ru-RU-DmitryNeural, rate: "+18%", pitch: "+0Hz", tail: 1.6}

theme:
  preset: minimal
  accent: "255,211,77"
  captions:
    style: clean
    top: 1250
    size: 64
    max_chars: 18
    hide:
      - {from: "@math/теория-0.1", until: "@math.end"}
      - {from: "@science/казино-0.15", until: "@science/Сегодня-0.15"}
      - {from: "@math_wins/забирает-0.1", until: "@math_wins/Играешь-0.15"}
      - {from: "@cta/главная-0.1", until: "@cta/Какая-0.15"}

post: {vignette: 0.3, chromatic: 0.0006, grain: 0.02}

draw:
  palette: {gold: "#ffd34d", alarm: "#ff3b4e", felt: "#0e5a3a", paper: "#f4ead8", cyan: "#4de1ff", neon: "#ff2bd6"}

# shared pieces (YAML anchors)
x-night: &night_bg {type: radial, at: "50% 38%", stops: [[0, "#2a1636"], [0.6, "#110a1a"], [1, "#05030a"]]}
x-green: &green_bg {type: radial, at: "50% 40%", stops: [[0, "#0f3b2c"], [0.6, "#06150f"], [1, "#020806"]]}
x-warm: &warm_bg {type: radial, at: "70% 25%", stops: [[0, "#4a2c14"], [0.55, "#1d1009"], [1, "#080403"]]}
x-blue: &blue_bg {type: radial, at: "50% 40%", stops: [[0, "#12223a"], [1, "#03060c"]]}
x-bricks: &bricks
  actor: svg
  x: 540
  y: 960
  w: 1240
  h: 2080
  opacity: 0.5
  markup: >-
    <svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2080" viewBox="0 0 1240 2080"><defs><pattern id="brk" width="160" height="80" patternUnits="userSpaceOnUse">
    <rect width="160" height="80" fill="#1a0f1c"/>
    <rect x="3" y="3" width="154" height="34" rx="4" fill="#2b1726"/>
    <rect x="-77" y="43" width="154" height="34" rx="4" fill="#2b1726"/>
    <rect x="83" y="43" width="154" height="34" rx="4" fill="#2b1726"/></pattern></defs>
    <rect width="1240" height="2080" fill="url(#brk)"/></svg>

audio:
  music:
    key: D
    mode: minor
    bpm: 100
    gain: -15
    sections:
      - {at: 0, style: pulse, chords: [Dm, Bb, F, C]}
      - {at: "@opera.start", style: epic, chords: [Bb, C, Dm, F]}
      - {at: "@twist.start", style: sub}
      - {at: "@math_wins.start", style: tension}
      - {at: "@cta.start", style: calm, chords: [Dm, Bb, F, C]}
  duck: 0.6

scenes:
  # ------------------------------------------------------------------ 1. HOOK — вред → польза, три карты и подвох
  - id: hook
    accent: "255,211,77"
    caption_marks: {"польза": "255,211,77"}
    text: "У азартных игр есть польза. Целых три. Но одна деталь тебе точно не понравится."
    shots:
      - id: h_neon
        effects:
          - {type: glow, at: [540, 900], sigma: 420, color: [1.0, 0.25, 0.35], intensity: 0.1, until: "@есть+0.2"}
          - {type: glow, at: [540, 980], sigma: 420, color: [1.0, 0.8, 0.3], intensity: 0.14, from: "@польза-0.1", fade_in: 0.2}
        look: {bloom: [0.66, 0.42], grade: {contrast: 0.1, sat: 1.12}}
        ambience: [{sound: hum, gain: -20}]
        draw:
          bg: *night_bg
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.08, y: 930}], sway: {x: 4, y: 3, roll: 0.3, freq: 0.3}, shakes: [{at: "@польза", amp: 9, dur: 0.3}]}
          layers:
            - *bricks
            - {actor: slot_machine, x: 200, y: 1980, scale: 0.55, par: 0.6, brightness: 0.5, blur: 3, title: "BONUS", neon: "#7a2cff"}
            - {actor: slot_machine, x: 540, y: 2010, scale: 0.55, par: 0.6, brightness: 0.5, blur: 3}
            - {actor: slot_machine, x: 880, y: 1980, scale: 0.55, par: 0.6, brightness: 0.5, blur: 3, title: "FORTUNE", neon: "#4de1ff"}
            - {actor: neon_sign, text: "АЗАРТНЫЕ ИГРЫ", x: 540, y: 560, size: 76, color: neon}
            - {actor: text, text: "=", x: 540, y: 760, size: 120, weight: 900, color: "#ffffff", shadow: "0 0 24px rgba(255,43,214,.9)"}
            - {actor: neon_sign, text: "ВРЕД", x: 540, y: 980, size: 190, color: alarm, frame: false, off_at: "@есть", stagger: 0.07}
            - {actor: neon_sign, text: "ПОЛЬЗА", x: 540, y: 980, size: 180, color: gold, frame: false, flicker: 0.1, at: "@польза-0.12", enter: {type: fade, dur: 0.15}}
            - {actor: particles, kind: embers, region: [0, 300, 1080, 1500], count: 26, colors: ["#ffd34d", "#ff8a3c"], alpha: 0.8, at: "@польза-0.1"}
            - {actor: timetag, text: "АФЕРЫ · СПЕЦВЫПУСК", x: 540, y: 200, size: 34, color: gold, space: screen, at: 0.1, enter: fade}
      - id: h_three
        start: "@Целых-0.15"
        transition: {type: whip_x, flash: 0.08}
        captions_top: 1420
        effects:
          - {type: glow, at: [840, 860], sigma: 300, color: [1.0, 0.2, 0.3], intensity: 0.16, from: "@понравится-0.05", fade_in: 0.15}
        look: {bloom: [0.7, 0.32], grade: {contrast: 0.08, sat: 1.1}}
        draw:
          bg: *green_bg
          camera: {keys: [{t: 0, z: 1.06, x: 540, y: 960}, {t: "@понравится-0.1", z: 1.0, x: 540, y: 960}, {t: "@понравится+0.35", z: 1.16, x: 720, y: 900, ease: expo}, {t: end, z: 1.18, x: 730, y: 900}], shakes: [{at: "@понравится", amp: 7, dur: 0.3}]}
          layers:
            - {actor: text, text: "3 ПОЛЬЗЫ", x: 540, y: 380, size: 130, weight: 900, color: gold, stroke: {w: 10, color: "#031410"}, shadow: "0 0 30px rgba(255,211,77,.6)", at: "@Целых-0.05", enter: stamp}
            - {actor: playing_card, rank: "A", suit: s, w: 230, x: 240, y: 860, rot: -6, back: "#b3001b", at: "@Целых", enter: drop, sfx: false}
            - {actor: playing_card, rank: "A", suit: h, w: 230, x: 540, y: 840, back: "#b3001b", at: "@Целых+0.12", enter: drop, sfx: false}
            - {actor: playing_card, rank: "A", suit: d, w: 230, x: 840, y: 860, rot: 6, back: "#b3001b", at: "@Целых+0.24", enter: drop, sfx: false, highlight: [{at: 0, v: 0}, {at: "@понравится", v: 1, dur: 0.2}], glow: alarm, shakes: [{at: "@понравится", amp: 6, dur: 0.5}]}
            - {actor: text, text: "1", x: 240, y: 1120, size: 80, weight: 900, color: "#ffffff", at: "@три", enter: pop}
            - {actor: text, text: "2", x: 540, y: 1120, size: 80, weight: 900, color: "#ffffff", at: "@три+0.1", enter: pop}
            - {actor: text, text: "3", x: 840, y: 1120, size: 80, weight: 900, color: "#ffffff", at: "@три+0.2", enter: pop}
            - {actor: badge, x: 540, y: 1270, icon: "!", title: "+1 ПОДВОХ", style: solid, color: alarm, size: 54, rot: -3, at: "@деталь", enter: stamp, pulse: {freq: 1.6, amp: 0.03}}
    sfx:
      - {sound: buzz, at: 0.05, gain: -15, f: 120, d: 0.1, n: 3}
      - {sound: glitch, at: "@есть", gain: -14}
      - {sound: impact, at: "@польза", gain: -12}
      - {sound: click, at: "@Целых", gain: -16}
      - {sound: click, at: "@Целых+0.12", gain: -17}
      - {sound: click, at: "@Целых+0.24", gain: -17}
      - {sound: pop, at: "@деталь", gain: -14}
      - {sound: kick, at: "@понравится", gain: -11}

  # ------------------------------------------------------------------ 2. POINT 1 — математика: Паскаль и Ферма
  - id: math
    accent: "255,211,77"
    caption_marks: {"теория вероятностей": "255,211,77"}
    text: "Первая — математика. Семнадцатый век. Игрок спросил Паскаля, как честно поделить ставку, если игру прервали. Из его переписки с Ферма родилась теория вероятностей."
    shots:
      - id: m_dice
        transition: {type: whip_x, flash: 0.08}
        effects:
          - {type: glow, at: [850, 520], sigma: 300, color: [1.0, 0.7, 0.3], intensity: 0.18, pulse: {freq: 2.3, amp: 0.25}}
        look: {bloom: [0.66, 0.4], grade: {contrast: 0.1, sat: 1.1, warmth: 0.08}}
        ambience: [{sound: room, gain: -22}]
        draw:
          bg: *warm_bg
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.08, y: 1000}], sway: {x: 3, y: 2, roll: 0.2, freq: 0.4}}
          layers:
            - {actor: shape, kind: rect, x: 0, y: 1080, w: 1080, h: 900, origin: top-left, fill: {linear: ["#5a3418", "#2a160a"], angle: 180}}
            - {actor: shape, kind: rect, x: 0, y: 1080, w: 1080, h: 8, origin: top-left, fill: "#7a4a24"}
            - {actor: image, emoji: "🕯️", x: 850, y: 900, size: 300, flicker: 0.15}
            - {actor: image, emoji: "🪶", x: 220, y: 1140, size: 200, rot: -25}
            - {actor: image, emoji: "🪙", x: 760, y: 1210, size: 110}
            - {actor: image, emoji: "🪙", x: 820, y: 1180, size: 110}
            - {actor: image, emoji: "🪙", x: 700, y: 1190, size: 110}
            - {actor: image, emoji: "🎲", x: 420, y: 1200, size: 190, anim: [{at: 0, dur: 0.01, x: -100, y: 1100, rot: -200}, {at: 0.05, dur: 0.9, x: 420, y: 1200, rot: 15, ease: "power3.out"}]}
            - {actor: image, emoji: "🎲", x: 580, y: 1250, size: 170, anim: [{at: 0, dur: 0.01, x: -160, y: 1200, rot: -260}, {at: 0.12, dur: 0.95, x: 580, y: 1250, rot: -12, ease: "power3.out"}]}
            - {actor: badge, x: 540, y: 380, title: "ПОЛЬЗА №1", style: solid, color: gold, size: 52, at: "@Первая-0.05", enter: stamp}
            - {actor: text, text: "МАТЕМАТИКА", x: 540, y: 540, size: 120, weight: 900, color: "#ffffff", stroke: {w: 10, color: "#1d1009"}, shadow: "0 0 30px rgba(255,211,77,.5)", at: "@математика-0.05", reveal: {by: char, mode: rise, stagger: 0.03}}
            - {actor: timetag, text: "1654 · ПАРИЖ", x: 540, y: 220, size: 38, color: gold, space: screen, at: "@Семнадцатый-0.05", enter: wipe_right, enter_dur: 0.5}
      - id: m_question
        start: "@Игрок-0.15"
        transition: {type: zoom, dur: 0.3}
        captions_top: 1470
        effects:
          - {type: glow, at: [540, 700], sigma: 380, color: [1.0, 0.7, 0.3], intensity: 0.1}
        look: {bloom: [0.66, 0.4], grade: {contrast: 0.1, warmth: 0.08}}
        draw:
          bg: *warm_bg
          camera: {keys: [{t: 0, z: 1.05, x: 500, y: 960}, {t: end, z: 1.05, x: 580, y: 960}]}
          layers:
            - {actor: person, x: 250, y: 1300, scale: 1.25, look: {age: adult, outfit: casual, hair: short, color: "#7a2a1c"}, pose: [{at: 0, v: stand}, {at: "@поделить", v: shrug, dur: 0.3}], face: [{at: 0, v: talk}, {at: "@прервали", v: surprised}], talk: [["@Игрок", "@прервали.end"]]}
            - {actor: person, x: 830, y: 1300, scale: 1.25, look: {age: adult, outfit: suit, hair: long, hair_color: "#5a4030", color: "#2a2438"}, pose: [{at: 0, v: stand}, {at: "@Паскаля", v: think, dur: 0.35}], face: neutral, look_dx: -0.6}
            - {actor: badge, x: 830, y: 520, title: "ПАСКАЛЬ", style: dark, color: gold, size: 40, at: "@Паскаля-0.05", enter: pop}
            - {actor: shape, kind: rect, x: 540, y: 1260, w: 1100, h: 300, radius: 20, fill: {linear: ["#0e5a3a", "#06301e"], angle: 180}, stroke: "#7a4a24", sw: 14}
            - {actor: image, emoji: "🪙", x: 470, y: 1220, size: 100}
            - {actor: image, emoji: "🪙", x: 540, y: 1200, size: 100}
            - {actor: image, emoji: "🪙", x: 610, y: 1225, size: 100}
            - {actor: image, emoji: "🪙", x: 540, y: 1260, size: 100}
            - {actor: shape, kind: line, points: [[580, 1130], [580, 1370]], stroke: gold, sw: 6, dash: "14 10", at: "@поделить-0.05", enter: draw, enter_dur: 0.4}
            - {actor: text, text: "?", x: 460, y: 1060, size: 90, weight: 900, color: gold, at: "@поделить", enter: pop, wiggle: {rot: 10, freq: 1.4}}
            - {actor: text, text: "?", x: 680, y: 1060, size: 90, weight: 900, color: gold, at: "@поделить+0.1", enter: pop, wiggle: {rot: 10, freq: 1.4}}
            - {actor: bubble, text: "КАК ЧЕСТНО ПОДЕЛИТЬ СТАВКУ?", x: 560, y: 330, width: 520, size: 40, side: left, at: "@Игрок", enter: pop}
            - {actor: playing_card, rank: "K", suit: s, w: 110, x: 330, y: 1250, rot: -30, face: 1, at: "@прервали-0.05", enter: drop}
            - {actor: playing_card, rank: "7", suit: h, w: 110, x: 400, y: 1290, rot: 20, face: 1, at: "@прервали", enter: drop}
            - {actor: text, text: "ИГРА ПРЕРВАНА", x: 540, y: 980, size: 70, weight: 900, color: alarm, stroke: {w: 8, color: "#080403"}, rot: -4, space: screen, at: "@прервали", enter: stamp}
      - id: m_letters
        start: "@переписки-0.15"
        transition: {type: zoom, dur: 0.3}
        effects:
          - {type: glow, at: [540, 420], sigma: 380, color: [1.0, 0.8, 0.3], intensity: 0.16, from: "@теория-0.1", fade_in: 0.2}
        look: {bloom: [0.66, 0.4], grade: {contrast: 0.1}}
        draw:
          bg: *warm_bg
          camera: {keys: [{t: 0, z: 1.08, y: 1000}, {t: end, z: 1.0, y: 960}]}
          layers:
            - actor: map
              x: 470
              y: 1080
              w: 1000
              h: 900
              focus: ["Belgium", "Spain", "Switzerland"]
              projection: mercator
              land: "#3a2614"
              ocean: "rgba(0,0,0,0)"
              stroke: "#a9824e"
              highlight: ["France"]
              hi: "#5a3a1c"
              pins:
                - {lon: 2.35, lat: 48.86, label: "ПАСКАЛЬ", at: 0.05, color: gold}
                - {lon: 1.44, lat: 43.6, label: "ФЕРМА", at: 0.2, color: gold}
              routes:
                - {src: [2.35, 48.86], dst: [1.44, 43.6], at: "@переписки", dur: 0.8, color: gold, width: 5, packets: 3, period: 0.7}
                - {src: [1.44, 43.6], dst: [2.35, 48.86], at: "@Ферма", dur: 0.8, color: "#ffffff", width: 4, packets: 3, period: 0.7}
            - {actor: image, emoji: "✉️", x: 520, y: 900, size: 120, at: "@переписки", until: "@теория", enter: pop, exit: fade, anim: [{at: "@переписки", dur: 0.9, dx: -60, dy: 360, ease: inOut}]}
            - {actor: text, text: "½", x: 300, y: 980, size: 110, weight: 900, color: gold, at: "@Ферма", enter: pop, float: {amp: 14, freq: 0.8}, anim: [{at: "@теория-0.05", dur: 0.35, x: 540, y: 420, scale: 0.2, opacity: 0, ease: in}]}
            - {actor: text, text: "¾", x: 780, y: 1000, size: 110, weight: 900, color: gold, at: "@Ферма+0.1", enter: pop, float: {amp: 14, freq: 0.9}, anim: [{at: "@теория-0.05", dur: 0.35, x: 540, y: 420, scale: 0.2, opacity: 0, ease: in}]}
            - {actor: text, text: "P(A)", x: 330, y: 1380, size: 80, font: serif, italic: true, color: "#ffffff", at: "@Ферма+0.2", enter: pop, float: {amp: 12, freq: 0.7}, anim: [{at: "@теория-0.05", dur: 0.35, x: 540, y: 420, scale: 0.2, opacity: 0, ease: in}]}
            - {actor: text, text: "E = Σ p·x", x: 760, y: 1400, size: 70, font: serif, italic: true, color: "#ffffff", at: "@Ферма+0.3", enter: pop, float: {amp: 12, freq: 0.75}, anim: [{at: "@теория-0.05", dur: 0.35, x: 540, y: 420, scale: 0.2, opacity: 0, ease: in}]}
            - {actor: text, text: "ТЕОРИЯ ВЕРОЯТНОСТЕЙ", x: 540, y: 400, size: 104, width: 1000, line: 1.0, weight: 900, color: gold, stroke: {w: 10, color: "#1d1009"}, shadow: "0 0 34px rgba(255,211,77,.8)", space: screen, at: "@теория-0.05", reveal: {by: word, mode: slam, stagger: 0.3}}
    sfx:
      - {sound: click, at: 0.1, gain: -16}
      - {sound: click, at: 0.5, gain: -18}
      - {sound: typing, at: "@Семнадцатый", gain: -17}
      - {sound: pop, at: "@Игрок", gain: -14}
      - {sound: scrape, at: "@прервали", gain: -15}
      - {sound: slam, at: "@прервали+0.05", gain: -15}
      - {sound: whoosh, at: "@переписки", gain: -15}
      - {sound: sparkle, at: "@Ферма", gain: -15}
      - {sound: impact, at: "@теория", gain: -12}

  # ------------------------------------------------------------------ 3. POINT 2 — наука: пасьянс → метод Монте-Карло
  - id: science
    accent: "77,225,255"
    caption_marks: {"Монте-Карло": "77,225,255"}
    text: "Вторая — наука. Физик раскладывал пасьянс и придумал метод, названный в честь казино Монте-Карло. Сегодня на нём считают прогноз погоды и риски банков."
    shots:
      - id: s_solitaire
        transition: {type: whip_x, flash: 0.08}
        captions_top: 1420
        effects:
          - {type: glow, at: [540, 980], sigma: 400, color: [0.3, 0.85, 1.0], intensity: 0.08}
        look: {bloom: [0.7, 0.32], grade: {contrast: 0.08}}
        draw:
          bg: *blue_bg
          camera: {keys: [{t: 0, z: 1.0, y: 1000}, {t: end, z: 1.08, y: 960}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 1000, w: 1000, h: 640, radius: 40, fill: {linear: ["#2c3e5c", "#1a2740"], angle: 180}, rot: -2}
            - {actor: playing_card, rank: "K", suit: h, w: 120, x: 160, y: 850, face: [{at: 0, v: 0}, {at: "@пасьянс", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "Q", suit: s, w: 120, x: 290, y: 880, face: [{at: 0, v: 0}, {at: "@пасьянс+0.08", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "J", suit: d, w: 120, x: 420, y: 910, face: [{at: 0, v: 0}, {at: "@пасьянс+0.16", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "10", suit: c, w: 120, x: 550, y: 940, face: [{at: 0, v: 0}, {at: "@пасьянс+0.24", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "9", suit: h, w: 120, x: 680, y: 970, face: [{at: 0, v: 0}, {at: "@пасьянс+0.32", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "8", suit: s, w: 120, x: 810, y: 1000, face: [{at: 0, v: 0}, {at: "@пасьянс+0.4", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "7", suit: d, w: 120, x: 940, y: 1030, face: [{at: 0, v: 0}, {at: "@пасьянс+0.48", v: 1, dur: 0.25}]}
            - {actor: playing_card, rank: "6", suit: c, w: 120, x: 350, y: 1130, rot: 8, face: 1, at: "@раскладывал", enter: fly_left}
            - {actor: playing_card, rank: "5", suit: h, w: 120, x: 720, y: 1150, rot: -8, face: 1, at: "@раскладывал+0.2", enter: fly_right}
            - {actor: image, emoji: "💡", x: 540, y: 640, size: 170, at: "@придумал-0.05", enter: pop, glow: {color: "#ffd34d", r: 30, a: 1}, pulse: {freq: 1.5, amp: 0.06}}
            - {actor: badge, x: 540, y: 380, title: "ПОЛЬЗА №2 · НАУКА", style: solid, color: cyan, size: 52, at: "@Вторая-0.05", enter: stamp}
            - {actor: timetag, text: "1946 · ЛОС-АЛАМОС", x: 540, y: 220, size: 38, color: cyan, space: screen, at: "@Физик-0.05", enter: wipe_right, enter_dur: 0.5}
            - {actor: text, text: "МЕТОД", x: 540, y: 520, size: 96, weight: 900, color: "#ffffff", stroke: {w: 8, color: "#03060c"}, at: "@метод-0.05", enter: pop}
      - id: s_casino
        start: "@казино-0.15"
        transition: {type: zoom, dur: 0.25}

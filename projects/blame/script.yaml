beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Казино не виновато"
    goal: "Остановить палец спорным приговором и открыть петлю «почему»."
    vo: "Казино не виновато в твоём проигрыше. Оно тебе ничего не обещало."
    on_screen: "КАЗИНО НЕ ВИНОВАТО"
    devices: [open_loop, pattern_interrupt, text_reinforcement, direct_address, sound_hit]
    music: pulse
    marks: {"не виновато": "#ffd34d"}
    shots:
      - id: h_court
        visual: "Зал суда в полумраке: на скамье подсудимых за решёткой — неоновая вывеска «КАЗИНО»; сверху опускается молоток судьи; штамп «НЕ ВИНОВНО»."
        actors: [neon_sign, shape, image, text]
        camera: "Наезд на вывеску, тряска на ударе молотка"
        animation:
          - {at: "@start", what: "Вывеска «КАЗИНО» вспыхивает за решёткой"}
          - {at: "@виновато", what: "Молоток бьёт, штамп «НЕ ВИНОВНО»"}
          - {at: "@проигрыше", what: "Решётка поднимается"}
        graphics:
          - {at: "@виновато", type: "text stamp", text: "НЕ ВИНОВНО"}
        sfx:
          - {at: "@start", sound: buzz, note: "неон"}
          - {at: "@виновато", sound: slam, note: "молоток"}
          - {at: "@проигрыше", sound: metal_ring}
        ambience: [room]
        transition: cut
      - id: h_contract
        at: "@ничего-0.1"
        visual: "Лист «ГАРАНТИИ КАЗИНО» на столе: под заголовком пустые строки 1, 2, 3; печать «0 ОБЕЩАНИЙ»."
        actors: [shape, text, badge]
        camera: "Сверху, быстрый наезд на пустые строки"
        animation:
          - {at: "@ничего", what: "Лист выезжает, строки пустые"}
          - {at: "@обещало", what: "Печать «0 ОБЕЩАНИЙ»"}
        graphics:
          - {at: "@ничего", type: text, text: "ГАРАНТИИ КАЗИНО:"}
          - {at: "@обещало", type: "badge stamp", text: "0 ОБЕЩАНИЙ"}
        sfx:
          - {at: "@ничего", sound: whoosh}
          - {at: "@обещало", sound: kick}
        transition: whip_x

  # ------------------------------------------------------------------ 2. CONTEXT — ты сам
  - id: choice
    role: context
    title: "Ты сам"
    goal: "Миф «казино меня обмануло» против простой хроники: ты сам пришёл, купил и поставил."
    vo: "Вспомни: никто не тащил тебя к столу. Ты сам купил фишки и сам поставил. На входе нет договора «ты выиграешь»."
    on_screen: "ТЫ САМ"
    devices: [direct_address, relatability, contrast]
    music: pulse
    shots:
      - id: c_walk
        visual: "Игрок входит в зал казино: пустой проход, никто не держит его за руку; он сам подходит к кассе и получает стопку фишек."
        actors: [person, chips, slot_machine, text]
        camera: "Панорама вслед за игроком"
        animation:
          - {at: "@никто", what: "Игрок идёт по пустому проходу"}
          - {at: "@купил", what: "Стопка фишек растёт в руке"}
          - {at: "@поставил", what: "Фишки скользят на стол"}
        graphics:
          - {at: "@сам", type: badge, text: "САМ ПРИШЁЛ"}
          - {at: "@поставил", type: badge, text: "САМ ПОСТАВИЛ"}
        sfx:
          - {at: "@никто", sound: footstep}
          - {at: "@купил", sound: click}
          - {at: "@поставил", sound: pop}
        transition: whip_x
      - id: c_door
        at: "@входе-0.1"
        visual: "Двери казино: на табличке вместо договора — «ВХОД»; рядом листок «ТЫ ВЫИГРАЕШЬ» перечёркивается красной линией."
        actors: [shape, text, neon_sign]
        camera: "Наезд на табличку"
        animation:
          - {at: "@договора", what: "Появляется листок «ТЫ ВЫИГРАЕШЬ»"}
          - {at: "@выиграешь", what: "Красная линия перечёркивает листок"}
        graphics:
          - {at: "@выиграешь", type: "text stamp", text: "ТАКОГО НЕТ"}
        sfx:
          - {at: "@договора", sound: whoosh}
          - {at: "@выиграешь", sound: scrape}
        transition: zoom

  # ------------------------------------------------------------------ 3. PROOF 1 — шансы напечатаны заранее
  - id: printed
    role: proof
    title: "Улика №1 — шансы напечатаны"
    goal: "Первая награда: организатор сам публикует шанс выигрыша — человек платит, зная его."
    vo: "Тебя даже предупреждают. Лотерея сама печатает шанс джекпота: один к двумстам девяноста двум миллионам. И ты покупаешь билет, зная это."
    on_screen: "1 К 292 000 000"
    devices: [mini_payoff, visual_proof, number_reveal, sound_hit]
    facts: [f1, f2]
    music: tension
    marks: {"один к двумстам девяноста двум миллионам": "#ffd34d"}
    shots:
      - id: p_ticket
        visual: "Лотерейный билет крупно на тёмном столе: шесть шаров-номеров; внизу мелкий шрифт, который увеличивается лупой: «ШАНС ДЖЕКПОТА 1 К 292 201 338»."
        actors: [shape, text, image, badge]
        camera: "Наезд на мелкий шрифт под лупой"
        animation:
          - {at: "@предупреждают", what: "Билет выезжает на стол"}
          - {at: "@печатает", what: "Лупа наезжает на мелкий шрифт"}
          - {at: "@один", what: "Счётчик шанса крутится до 292 201 338"}
        graphics:
          - {at: "@предупреждают", type: badge, text: "УЛИКА №1 · ШАНСЫ"}
          - {at: "@один", type: "text count", text: "1 К 292 201 338"}
        sfx:
          - {at: "@предупреждают", sound: whoosh}
          - {at: "@печатает", sound: scrape}
          - {at: "@миллионам", sound: kick}
        transition: whip_x
      - id: p_buy
        at: "@покупаешь-0.1"
        visual: "Рука протягивает купюру кассиру и забирает билет; над билетом штамп «ЗНАЛ ЗАРАНЕЕ»."
        actors: [hand, image, text]
        camera: "Сверху, тряска на штампе"
        animation:
          - {at: "@покупаешь", what: "Купюра уходит, билет приходит в руку"}
          - {at: "@зная", what: "Штамп «ЗНАЛ ЗАРАНЕЕ»"}
        graphics:
          - {at: "@зная", type: "text stamp", text: "ЗНАЛ ЗАРАНЕЕ"}
        sfx:
          - {at: "@покупаешь", sound: click}
          - {at: "@зная", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 4. PROOF 2 — открытая математика
  - id: odds
    role: proof
    title: "Улика №2 — шансы на виду"
    goal: "Вторая награда: минус казино виден на столе: 37 ячеек, платят как за 36."
    vo: "А в рулетке минус виден прямо на столе. Ячеек тридцать семь, а платят как за тридцать шесть. Посчитать может каждый."
    on_screen: "37 ПРОТИВ 36"
    devices: [visual_proof, number_reveal, contrast, mini_payoff]
    facts: [f3, f7]
    music: pulse
    marks: {"тридцать семь": "#ffd34d"}
    shots:
      - id: o_wheel
        visual: "Рулетка сверху: ячейки пересчитываются по кругу, счётчик бежит до 37; зеро подсвечивается зелёным."
        actors: [roulette, text, badge]
        camera: "Медленный наезд и вращение"
        animation:
          - {at: "@рулетке", what: "Колесо раскручивается"}
          - {at: "@Ячеек", what: "Счётчик ячеек бежит до 37"}
        graphics:
          - {at: "@рулетке", type: badge, text: "УЛИКА №2 · МАТЕМАТИКА"}
          - {at: "@семь", type: "text count", text: "37 ЯЧЕЕК"}
        sfx:
          - {at: "@рулетке", sound: riser}
          - {at: "@семь", sound: click}
        transition: whip_x
      - id: o_bars
        at: "@платят-0.1"
        visual: "Две полосы: «ЯЧЕЕК 37» и «ПЛАТЯТ 36»; разница — одна зелёная ячейка с подписью «ДОЛЯ КАЗИНО 2,7%»."
        actors: [chart, text, badge]
        camera: "Наезд на разницу полос"
        animation:
          - {at: "@платят", what: "Полосы растут"}
          - {at: "@шесть", what: "Зелёная разница вспыхивает"}
          - {at: "@каждый", what: "Плашка «2,7% — НА ВИДУ»"}
        graphics:
          - {at: "@шесть", type: "text stamp", text: "−2,7%"}
          - {at: "@каждый", type: badge, text: "НЕ СЕКРЕТ"}
        sfx:
          - {at: "@платят", sound: typing}
          - {at: "@шесть", sound: kick}
          - {at: "@каждый", sound: ping}
        transition: zoom

  # ------------------------------------------------------------------ 5. REVEAL — Монте-Карло 1913
  - id: monte
    role: reveal
    title: "Улика №3 — Монте-Карло, 1913"
    goal: "Главная награда и поворот: колесо было честным — игроков разорила их собственная уверенность."
    vo: "Монте-Карло, тысяча девятьсот тринадцатый. Чёрное выпало двадцать шесть раз подряд. Игроки ставили миллионы на красное — «ну теперь-то точно». Колесо было честным. Их разорила собственная уверенность."
    on_screen: "26 РАЗ ПОДРЯД"
    devices: [twist, number_reveal, visual_proof, emotion, stakes_raise]
    facts: [f4]
    music: tension
    marks: {"двадцать шесть раз подряд": "#ffd34d", "собственная уверенность": "#ff3b4e"}
    shots:
      - id: m_streak
        visual: "Казино Монте-Карло в сепии, метка «18 АВГУСТА 1913»; под колесом растёт лента из чёрных кружков, счётчик 1 → 26."
        actors: [roulette, shape, text, timetag]
        camera: "Отъезд вдоль растущей ленты"
        animation:
          - {at: "@start", what: "Метка «18 АВГУСТА 1913»"}
          - {at: "@Чёрное", what: "Лента чёрных кружков растёт"}
          - {at: "@подряд", what: "Счётчик останавливается на 26"}
        graphics:
          - {at: "@start", type: timetag, text: "МОНТЕ-КАРЛО · 18.08.1913"}
          - {at: "@подряд", type: "text count", text: "26 РАЗ ПОДРЯД"}
        sfx:
          - {at: "@start", sound: typing}
          - {at: "@Чёрное", sound: click}
          - {at: "@подряд", sound: kick}
        transition: whip_x
      - id: m_crowd
        at: "@Игроки-0.1"
        visual: "Толпа силуэтов у стола двигает горы фишек на красное поле; над ними реплика «НУ ТЕПЕРЬ-ТО ТОЧНО!»."
        actors: [silhouette, chips, bubble, shape]
        camera: "Наезд на красное поле"
        animation:
          - {at: "@ставили", what: "Фишки едут на красное"}
          - {at: "@точно", what: "Реплика «НУ ТЕПЕРЬ-ТО ТОЧНО!»"}
        graphics:
          - {at: "@миллионы", type: badge, text: "МИЛЛИОНЫ ФРАНКОВ"}
        sfx:
          - {at: "@ставили", sound: scrape}
          - {at: "@точно", sound: pop}
        transition: zoom
      - id: m_fair
        at: "@Колесо-0.1"
        visual: "Колесо крупно с зелёной плашкой «КОЛЕСО ЧЕСТНОЕ»; затем силуэт головы игрока, внутри которой крутится маленькая рулетка; штамп «ВИНОВАТА УВЕРЕННОСТЬ»."
        actors: [roulette, badge, silhouette, text]
        camera: "Наезд на голову, тряска на штампе"
        animation:
          - {at: "@честным", what: "Плашка «КОЛЕСО ЧЕСТНОЕ»"}
          - {at: "@разорила", what: "Колесо уменьшается внутрь головы игрока"}
          - {at: "@уверенность", what: "Штамп"}
        graphics:
          - {at: "@честным", type: badge, text: "КОЛЕСО ЧЕСТНОЕ"}
          - {at: "@уверенность", type: "text stamp", text: "ВИНОВАТА УВЕРЕННОСТЬ"}
        sfx:
          - {at: "@честным", sound: chime}
          - {at: "@уверенность", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 6. PAYOFF — цена и стоп-кнопка
  - id: verdict
    role: payoff
    title: "Приговор: выбор и стоп-кнопка — твои"
    goal: "Развязка: казино продаёт ровно то, что обещает; проигрыш — цена согласия; остановка тоже в руках игрока (самозапрет)."
    vo: "Казино продаёт ровно то, что обещает: игру с минусом. Проигрыш — цена, на которую ты согласился. И кнопка «стоп» тоже твоя: самозапрет теперь оформляется через Госуслуги."
    on_screen: "ВЫБОР — ТВОЙ"
    devices: [mini_payoff, callback, direct_address, save_trigger]
    facts: [f5, f6]
    music: epic
    marks: {"цена": "#ffd34d", "кнопка «стоп»": "#3cff8a"}
    shots:
      - id: v_tag
        visual: "Над столом рулетки висит ценник как в магазине: «ИГРА С МИНУСОМ · ЦЕНА 2,7%»; ценник покачивается."
        actors: [shape, text, roulette]
        camera: "Наезд на ценник"
        animation:
          - {at: "@продаёт", what: "Ценник падает сверху и качается"}
          - {at: "@минусом", what: "Строка «ЦЕНА 2,7%» подсвечивается"}
        graphics:
          - {at: "@минусом", type: text, text: "ИГРА С МИНУСОМ"}
        sfx:
          - {at: "@продаёт", sound: whoosh}
          - {at: "@минусом", sound: ping}
        transition: whip_x
      - id: v_receipt
        at: "@Проигрыш-0.1"
        visual: "Чек печатается: «ПРОИГРЫШ — ЦЕНА СОГЛАСИЯ», внизу подпись игрока «Я СОГЛАСЕН»."
        actors: [shape, text]
        camera: "Сверху, чек выезжает"
        animation:
          - {at: "@Проигрыш", what: "Чек печатается сверху вниз"}
          - {at: "@согласился", what: "Подпись «Я СОГЛАСЕН»"}
        graphics:
          - {at: "@согласился", type: "badge stamp", text: "Я СОГЛАСЕН"}
        sfx:
          - {at: "@Проигрыш", sound: typing}
          - {at: "@согласился", sound: kick}
        transition: zoom
      - id: v_stop
        at: "@кнопка-0.1"
        visual: "Смартфон: экран приложения с большой красной кнопкой «САМОЗАПРЕТ · 12 МЕСЯЦЕВ»; палец нажимает — экран зелёный «ДОСТУП ЗАКРЫТ»."
        actors: [phone, hand, text, badge]
        camera: "Наезд на кнопку"
        animation:
          - {at: "@стоп", what: "Кнопка пульсирует"}
          - {at: "@самозапрет", what: "Палец нажимает, экран зеленеет"}
        graphics:
          - {at: "@самозапрет", type: badge, text: "С 1.09.2026 · ГОСУСЛУГИ"}
        sfx:
          - {at: "@стоп", sound: blip}
          - {at: "@самозапрет", sound: chime}
        transition: zoom

  # ------------------------------------------------------------------ 7. CTA
  - id: cta
    role: cta
    title: "Казино или игрок?"
    goal: "Спор одним словом; петля к суду из хука."
    vo: "Так кто виноват в проигрыше: казино или игрок? Пиши одним словом."
    on_screen: "КАЗИНО ИЛИ ИГРОК?"
    devices: [comment_bait, callback, loop_ending, direct_address]
    music: pulse
    shots:
      - id: z_scales
        visual: "Весы правосудия: на одной чаше неоновое «КАЗИНО», на другой силуэт «ИГРОК»; чаши качаются, внизу «ПИШИ ОДНИМ СЛОВОМ»; в конце снова удар молотка."
        actors: [shape, neon_sign, silhouette, text, badge, image]
        camera: "Лёгкий наезд, удар молотка в конце"
        animation:
          - {at: "@казино", what: "Чаша «КАЗИНО» опускается"}
          - {at: "@игрок", what: "Чаша «ИГРОК» перевешивает"}
          - {at: "@словом", what: "Молоток бьёт — как в начале"}
        graphics:
          - {at: "@казино", type: text, text: "КАЗИНО"}
          - {at: "@игрок", type: text, text: "ИГРОК"}
          - {at: "@Пиши", type: badge, text: "ПИШИ ОДНИМ СЛОВОМ"}
        sfx:
          - {at: "@казино", sound: blip}
          - {at: "@игрок", sound: blip}
          - {at: "@словом", sound: slam}
        transition: whip_x


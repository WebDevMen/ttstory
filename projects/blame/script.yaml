brief:
  goal: "Спорный тезис серии «Аферы» — «казино не виновато» — доказать тремя неудобными фактами (опубликованные шансы, математика, история) и вызвать спор в комментариях одним словом."
  kpi: [comments, completion, shares, follows, rewatch]
  audience:
    who: "Зрители серии «Аферы» и все, кто хоть раз проигрывал в казино, ставках или автоматах — или винил в этом «подкрученное» казино"
    age: "18–35"
    interests: [казино, ставки, деньги, психология, true crime]
    pains: ["обида после проигрыша", "ощущение, что «всё подкручено»", "морализаторство без фактов"]
    desires: ["честный разбор без нотаций", "аргумент для спора", "понять, где на самом деле ошибка"]
    knowledge: "Слышали, что «казино всегда в плюсе», но не задумываются, что шанс джекпота напечатан самим организатором, что минус рулетки виден на столе, и что в Монте-Карло 1913 года игроков разорила их собственная логика"
  promise: "Три факта, после которых обвинять казино в своём проигрыше станет сложно, — и где на самом деле ошибка игрока."
  tone: "Холодный разбор-приговор: зал суда и зелёное сукно; без морали, но жёстко; в финале — спокойное «выбор и стоп-кнопка — твои»."
  keywords: ["казино", "проигрыш в казино", "азартные игры", "рулетка", "самозапрет"]
  constraints:
    - "Не реклама азартных игр: никаких брендов, ссылок, бонусов и призывов играть"
    - "Тезис — о легальном казино с честными правилами; мошенничество и обман — отдельная история"
    - "Не высмеивать зависимых: зависимость — болезнь; финал даёт инструмент — самозапрет, который включает сам человек"
    - "По просьбе заказчика статья 1062 ГК РФ в ролик не входит; вместо неё — шансы, которые организатор публикует сам (Powerball)"
    - "Powerball — американская лотерея; название в голосе не звучит («лотерея»), на экране только цифра шанса, без логотипа"
    - "Самозапрет: закон вступил в силу 1 сентября 2026; через Госуслуги или МФЦ; минимум 12 месяцев — логотип Госуслуг не рисуем"
    - "Сознательно не используем эксперимент Лангер (1975) про лотерейные билеты: в 2021 году его выводы оспорены"

research:
  summary: >-
    Организаторы сами публикуют шансы: в официальной таблице призов Powerball шанс джекпота — 1 к 292 201 338, любого
    приза — 1 к 24,87; игрок покупает билет, зная эти цифры. Преимущество казино не скрыто: в европейской рулетке 37 ячеек, а ставка на число оплачивается 35 к 1 (как
    за 36), отсюда −2,7% с каждой ставки. 18 августа 1913 года в казино Монте-Карло чёрное выпало 26 раз подряд; игроки
    теряли миллионы франков, ставя против чёрного в уверенности, что «теперь точно красное» (ошибка игрока). С 1 сентября
    2026 года в России действует самозапрет на азартные игры: заявление через Госуслуги или МФЦ, минимум на 12 месяцев,
    у всех легальных организаторов сразу.
  facts:
    - id: f1
      text: "Официальная таблица призов Powerball: шанс джекпота (5 номеров + Powerball) — 1 к 292 201 338; шанс выиграть хоть какой-то приз — 1 к 24,87."
      source: "https://www.powerball.com/powerball-prize-chart"
      confidence: high
    - id: f2
      text: "Шансы на приз публикуются самим организатором лотереи в таблице призов — до покупки билета."
      source: "https://www.powerball.com/powerball-prize-chart"
      confidence: high
    - id: f3
      text: "В европейской рулетке (одно зеро) 37 ячеек; ставка на одно число выигрывает с вероятностью 1/37 и оплачивается 35 к 1; математическое ожидание −1/37 ≈ −2,70%."
      source: "https://en.wikipedia.org/wiki/Roulette"
      confidence: high
    - id: f4
      text: "18 августа 1913 года в казино Монте-Карло шарик упал на чёрное 26 раз подряд; игроки потеряли миллионы франков, ставя против чёрного, — ошибочно считая, что серия «должна» смениться красным."
      source: "https://en.wikipedia.org/wiki/Gambler%27s_fallacy"
      confidence: high
    - id: f5
      text: "С 1 сентября 2026 года в России можно добровольно установить самозапрет на азартные игры: заявление через Госуслуги или в МФЦ, минимум на 12 месяцев, отменить раньше года нельзя; ограничение действует сразу у всех легальных организаторов."
      source: "https://www.securitylab.ru/blog/personal/paragraph/362890.php"
      confidence: high
    - id: f6
      text: "Закон о самозапрете вступил в силу 1 сентября; срок гражданин выбирает сам, но не менее 12 месяцев; подать можно через портал «Госуслуги» или лично в МФЦ."
      source: "https://expert.ru/news/rossiyane-smogut-oformit-samozapret-na-azartnye-igry-s-1-sentyabrya"
      confidence: high
    - id: f7
      text: "В Неваде регламент 14.040 требует, чтобы игровой автомат теоретически возвращал не меньше 75% ставок; на практике современные автоматы возвращают около 90% — то есть минус заложен и регулируется открыто."
      source: "https://legalclarity.org/nevada-gaming-commission-slot-payout-rules-explained/"
      confidence: medium
  angles:
    - id: a1
      text: "Суд над казино: обвинение «оно виновато» и три улики защиты — напечатанные шансы (1 к 292 млн), открытая математика (37 против 36), Монте-Карло 1913 (разорила уверенность); приговор — виноват выбор, и стоп-кнопка тоже твоя"
      score: 9
      why: "Формат «суда» даёт драматургию и спор, факты проверяемые и неожиданные (особенно шанс 1 к 292 миллионам), финал честный: без насмешки над зависимыми, с реальным инструментом."
    - id: a2
      text: "Психология проигрыша: иллюзия контроля, «почти выигрыш», ошибка игрока"
      score: 6
      why: "Интересно, но часть исследований спорная (Лангер оспорен), а тезис «казино не виновато» размывается — дизайн автоматов как раз работает против игрока."
    - id: a3
      text: "«Казино ничего не гарантирует»: разбор правил и мелкого шрифта"
      score: 6
      why: "Честно, но сухо и без истории — мало эмоции и наград."
    - id: a4
      text: "Монте-Карло 1913: как игроки сами себя разорили — одна история на минуту"
      score: 7
      why: "Сильная история, но одна улика слабее трёх; лучше как кульминация угла a1."
  chosen_angle: a1
  insights:
    - "Самый наглядный факт — шанс джекпота 1 к 292 миллионам: организатор сам печатает его, и билеты всё равно покупают."
    - "«37 ячеек, платят как за 36» — минус казино виден прямо на столе; это делает его честным продавцом, а не обманщиком."
    - "Монте-Карло 1913 — идеальный «поворот»: колесо было честным, разорила логика «теперь точно красное»."
    - "Самозапрет с сентября 2026 — свежая новость и честный финал: стоп-кнопка у человека."
    - "Спор одним словом «казино» или «игрок» — естественная поляризация для комментариев."


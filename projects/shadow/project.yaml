      - {sound: blip, at: "@Один", gain: -14}
      - {sound: impact, at: "@пять", gain: -12}

  # ------------------------------------------------------------------ 7. DILEMMA — колодец или солнце
  - id: dilemma
    text: "Утро третьего дня. Сход у колодца. Сбросим камень в колодец. Тридцать локтей — и никто его больше не тронет. Там тень моего отца! Сбросишь — он меня не вспомнит. Один факел — одна тень. Где ты возьмёшь пять? Возьму солнце. А если солнце его не разобьёт, а накормит? Тогда он заберёт тени у всех. На закате — в колодец."
    lines:
      - {who: ulrich, say: "Сбросим камень в колодец. Тридцать локтей — и никто его больше не тронет."}
      - {who: marta, say: "Там тень моего отца! Сбросишь — он меня не вспомнит."}
      - {who: ulrich, say: "Один факел — одна тень. Где ты возьмёшь пять?"}
      - {who: marta, say: "Возьму солнце."}
      - {who: ulrich, say: "А если солнце его не разобьёт, а накормит? Тогда он заберёт тени у всех. На закате — в колодец."}
    caption_marks: {"возьму солнце": "#ffcf6a"}
    shots:
      - id: d_well
        transition: {type: whip_x}
        ambience: [{sound: wind, gain: -20}, {sound: birds, gain: -24}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1040}, {t: "@Сбросим", z: 1.1, x: 600, y: 1060}, {t: end, z: 1.16, x: 640, y: 1070}]}
          layers: &square_morning
            - *sky_morning
            - {actor: smoke, x: 300, y: 905, w: 120, h: 520, color: "#9a8f88", n: 10, blur: 9, speed: 20, drift: 0.2, alpha: 0.5, seed: 5, par: 0.2}
            - *forest_far
            - *ground_far
            - *haze
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - *ground_mid
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - *cobbles
            - {actor: well, id: well, x: 640, y: 1200, scale: 0.9}
            # villagers in a half-circle (their shadows fall to the right: the morning sun is on the left)
            - {<<: *vsh, x: 120, y: 1230, scale: 0.8, look: {age: adult, outfit: peasant_f, hair: bun}}
            - {actor: person, x: 120, y: 1230, scale: 0.8, look: {age: adult, outfit: peasant_f, hair: bun}, face: neutral}
            - {<<: *vsh, x: 230, y: 1235, scale: 0.82, look: {age: adult, outfit: tunic, hair: short, beard: true}}
            - {actor: person, x: 230, y: 1235, scale: 0.82, look: {age: adult, outfit: tunic, hair: short, beard: true}, face: [{at: 0, v: neutral}, {at: "@тронет", v: smile}]}
            - {<<: *vsh, x: 960, y: 1235, scale: 0.82, look: {age: adult, outfit: tunic, hair: side, color: "#5a6a3a"}}
            - {actor: person, x: 960, y: 1235, scale: 0.82, look: {age: adult, outfit: tunic, hair: side, color: "#5a6a3a"}, face: neutral}
            - {actor: star_stone, x: 470, y: 1300, r: 46}
            - {actor: shape, kind: rect, x: 470, y: 1345, w: 200, h: 20, radius: 6, fill: "#6a4a2e"}
            - {<<: *vsh, x: 800, y: 1320, scale: 1.0, view: side, flip: true, look: *ulrich}
            - {actor: person, id: ulrich, view: side, flip: true, x: 800, y: 1320, scale: 1.0, look: *ulrich, face: determined,
               pose: [{at: 0, v: stand}, {at: "@Сбросим", v: {a1: [80, 10], a2: [6, 10], l1: [2, 0], l2: [2, 0]}, dur: 0.3}, {at: "@тронет", v: stand, dur: 0.4}]}
            - {actor: shape, kind: circle, x: 700, y: 1100, r: 8, fill: "#6a6058", enter: fade, enter_dur: 0.1, at: "@Тридцать", until: "@Тридцать+0.6", anim: [{at: "@Тридцать", dur: 0.5, y: 1190, ease: in}]}
            - {<<: *tag, text: "ДЕНЬ 3 · УТРО · СХОД", at: "@Утро", enter: fade}
            - {<<: *who, target: "ulrich.top", x: 800, y: 700, title: "УЛЬРИХ", at: "@Сбросим"}
      - id: d_marta
        start: "@Там-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.2, x: 440, y: 1060}, {t: end, z: 1.28, x: 420, y: 1060}]}
          layers:
            - *sky_morning
            - *forest_far
            - *ground_far
            - *haze
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - *ground_mid
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - *cobbles
            - {actor: star_stone, x: 470, y: 1300, r: 46}
            - {actor: shape, kind: rect, x: 470, y: 1345, w: 200, h: 20, radius: 6, fill: "#6a4a2e"}
            - {<<: *vsh, x: 300, y: 1330, scale: 1.0, view: side, look: *marta, walk: [{at: 0, v: 1.4}, {at: "@отца", v: 0}], anim: [{at: "@Там-0.22", dur: 0.9, x: 380, ease: out}]}
            - {actor: person, id: marta, view: side, x: 300, y: 1330, scale: 1.0, look: *marta, walk: [{at: 0, v: 1.4}, {at: "@отца", v: 0}], anim: [{at: "@Там-0.22", dur: 0.9, x: 380, ease: out}],
               face: [{at: 0, v: determined}, {at: "@вспомнит", v: sad}], pose: [{at: 0, v: stand}, {at: "@Сбросишь", v: {a1: [60, 20], a2: [60, 20], l1: [8, 0], l2: [-8, 0]}, dur: 0.3}]}
            - {<<: *who, target: "marta.top", x: 380, y: 700, title: "МАРТА", at: "@Там"}
      - id: d_ulrich
        start: "@Один-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.15, x: 600, y: 1060}, {t: end, z: 1.2, x: 560, y: 1060}]}
          layers:
            - *sky_morning
            - *forest_far
            - *ground_far
            - *haze
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - *ground_mid
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - *cobbles
            - {<<: *vsh, x: 760, y: 1330, scale: 1.0, view: side, flip: true, look: *ulrich}
            - {actor: person, id: ulrich, view: side, flip: true, x: 760, y: 1330, scale: 1.0, look: *ulrich, face: [{at: 0, v: determined}, {at: "@Возьму", v: surprised}],
               pose: [{at: 0, v: stand}, {at: "@Один", v: {a1: [100, 10], a2: [6, 10], l1: [2, 0], l2: [2, 0]}, dur: 0.3}, {at: "@пять", v: {a1: [120, 10], a2: [6, 10], l1: [2, 0], l2: [2, 0]}, dur: 0.3}, {at: "@Возьму", v: stand, dur: 0.4}]}
            - {<<: *vsh, x: 380, y: 1330, scale: 1.0, view: side, look: *marta}
            - {actor: person, id: marta, view: side, x: 380, y: 1330, scale: 1.0, look: *marta, face: [{at: 0, v: sad}, {at: "@Возьму", v: determined}],
               pose: [{at: 0, v: stand}, {at: "@Возьму", v: {a1: [150, 10], a2: [6, 10], l1: [2, 0], l2: [2, 0], nod: -10}, dur: 0.4}]}
            - {actor: badge, x: 760, y: 760, title: "5?", style: solid, color: warn, size: 60, space: screen, at: "@пять", enter: pop, sfx: false, until: "@Возьму-0.1", exit: fade}
            - {<<: *who, target: "ulrich.top", x: 760, y: 640, title: "УЛЬРИХ", at: "@Один", until: "@Возьму-0.1", exit: fade}
            - {<<: *who, target: "marta.top", x: 380, y: 640, title: "МАРТА", at: "@Возьму"}
      - id: d_scale
        start: "@А-0.22"
        transition: {type: cut}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.05, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 6}
            # balance: SUN (left) — 5 shadows come back / WELL (right) — the village is safe
            - {actor: shape, kind: line, points: [[540, 640], [540, 1180]], stroke: ink, sw: 8}
            - {actor: shape, kind: triangle, x: 540, y: 1200, w: 160, h: 60, fill: ink}
            - actor: group
              x: 540
              y: 660
              rot: [{at: 0, v: 0}, {at: "@накормит", v: -10, dur: 0.6, ease: out}, {at: "@закате", v: 12, dur: 0.8, ease: inOut}]
              children:
                - {actor: shape, kind: line, points: [[-330, 0], [330, 0]], stroke: ink, sw: 8}
                - {actor: shape, kind: line, points: [[-330, 0], [-330, 160]], stroke: ink, sw: 3}
                - {actor: shape, kind: line, points: [[330, 0], [330, 160]], stroke: ink, sw: 3}
                - {actor: shape, kind: arc, x: -330, y: 170, r: 110, start: 90, end: 270, stroke: ink, sw: 6, fill: "rgba(160,112,42,0.2)"}
                - {actor: shape, kind: arc, x: 330, y: 170, r: 110, start: 90, end: 270, stroke: ink, sw: 6, fill: "rgba(160,112,42,0.2)"}
                - {actor: shape, kind: circle, x: -330, y: 110, r: 46, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 18, a: 0.9}}
                - {actor: well, x: 330, y: 160, scale: 0.36}
            - {actor: text, x: 250, y: 980, size: 36, font: hand, color: ink, text: "солнце: вернуть 5 теней", width: 260, space: screen}
            - {actor: text, x: 790, y: 980, size: 36, font: hand, color: ink, text: "колодец: деревня цела", width: 260, space: screen}
            - {actor: badge, x: 250, y: 1100, title: "ИЛИ ТЕНИ ВСЕХ", style: solid, color: warn, size: 28, space: screen, at: "@накормит", enter: pop, sfx: false}
            - {actor: badge, x: 790, y: 1100, title: "5 ЗАБУДУТ", style: solid, color: "#6a5a7a", size: 28, space: screen, at: "@закате", enter: pop, sfx: false}
            - {<<: *title, y: 400, size: 86, text: "КОЛОДЕЦ ИЛИ СОЛНЦЕ?", at: "@А", reveal: {by: word, mode: slam, stagger: 0.12}}
            - {actor: badge, x: 540, y: 1300, title: "УЛЬРИХ:", style: outline, color: gold, size: 34, space: screen, at: "@А", until: "@А+1.5", exit: fade, enter: pop, sfx: false}
    sfx:
      - {sound: drip, at: "@Тридцать+0.45", gain: -12}
      - {sound: footstep, at: "@Там", gain: -14}
      - {sound: chime, at: "@Возьму", gain: -12}
      - {sound: impact, at: "@накормит", gain: -12}
      - {sound: bell, at: "@закате", gain: -12}

  # ------------------------------------------------------------------ 8. TURN — камень в тени; щит сияет
  - id: turn
    text: "Полдень. Солнце над деревней, а камень вернули в яму, в густую тень леса. Свет туда не достаёт. Марта бежит в кузницу. Отец сидит у горна. В руках щит. Он сияет так, что режет глаза."
    shots:
      - id: t_shade
        transition: {type: whip_x}
        ambience: [{sound: wind, gain: -20}]
        look: {grade: {contrast: 0.1}}
        draw:
          camera: {keys: [{t: 0, z: 1.08, y: 980}, {t: end, z: 1.0, y: 960}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 12.5, par: 0, sun: [700, 300], horizon: 1000, clouds: 3, seed: 7}
            - {actor: forest, x: 540, y: 1020, w: 2100, h: 280, hill: 40, color: "#2e4a36", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 1000, w: 2120, h: 1000, color: ["#3e5a3e", "#2e4a2e"], par: 0.3}
            - {actor: tree, kind: pine, h: 700, x: 140, y: 1250, color: "#1e3a28", par: 0.7, seed: 1}
            - {actor: tree, kind: pine, h: 760, x: 940, y: 1250, color: "#1e3a28", par: 0.7, seed: 2}
            - {actor: ground, x: -520, y: 1230, w: 2120, h: 900, color: ["#5a4a32", "#3a2e20"], par: 0.7}
            - {actor: crater, x: 540, y: 1430, w: 900, depth: 220, color: "#4a3a2a"}
            # the pit floor in deep shade; sun rays stop at the rim
            - {actor: shape, kind: ellipse, x: 540, y: 1300, w: 600, h: 160, fill: "rgba(10,12,16,0.65)", blur: 12}
            - {actor: star_stone, x: 540, y: 1290, r: 46, at: "@яму-0.3", enter: {type: drop, dur: 0.4}}
            - {actor: shape, kind: line, points: [[700, 300], [400, 1180]], stroke: "rgba(255,240,200,0.55)", sw: 14, blur: 3, at: "@Солнце", enter: draw, enter_dur: 0.5}
            - {actor: shape, kind: line, points: [[700, 300], [700, 1180]], stroke: "rgba(255,240,200,0.55)", sw: 14, blur: 3, at: "@Солнце+0.15", enter: draw, enter_dur: 0.5}
            - {actor: shape, kind: line, points: [[700, 300], [960, 1180]], stroke: "rgba(255,240,200,0.55)", sw: 14, blur: 3, at: "@Солнце+0.3", enter: draw, enter_dur: 0.5}
            - {actor: shape, id: shadezone, kind: ellipse, x: 540, y: 1300, w: 440, h: 120, fill: "none", stroke: warn, sw: 4, dash: "10 8", at: "@достаёт", enter: grow}
            - {<<: *tag, text: "ДЕНЬ 3 · ПОЛДЕНЬ", at: "@Полдень", enter: fade}
            - {actor: callout, target: "shadezone.top", x: 540, y: 620, title: "СВЕТ НЕ ДОСТАЁТ", color: warn, size: 44, space: screen, at: "@достаёт", enter: pop, sfx: false}
      - id: t_shield
        start: "@кузницу-0.22"
        look: {bloom: [0.55, 0.5]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: "@щит", z: 1.15, x: 520, y: 1100}, {t: end, z: 1.3, x: 520, y: 1140}]}
          layers:
            - *forge_in
            - {actor: shape, kind: rect, x: 860, y: 520, w: 180, h: 240, fill: "#fff2c8", glow: {color: "#ffe6a0", r: 30, a: 0.9}}
            - {actor: light_pool, x: 700, y: 1000, r: 520, sy: 0.7, color: "#fff0c0", a: 0.35}
            - {actor: anvil, x: 860, y: 1440, scale: 0.9}
            - {actor: person, id: hans, view: side, flip: true, x: 640, y: 1440, scale: 1.0, look: *hans_empty, sit: 0.6, face: neutral, pose: {a1: [60, 40], a2: [40, 70], sit: 0.6}}
            - {actor: shield, id: mirror, x: 520, y: 1230, r: 100, sx: 0.85, shine: 1, glow: {color: "#ffffff", r: 30, a: 1}}
            # a sun spot from the shield dances on the wall
            - {actor: shape, kind: circle, x: 300, y: 800, r: 40, fill: "#fff6dc", blur: 8, opacity: 0.85, anim: [{at: "@щит", dur: 1.2, path: [[300, 800], [220, 700], [380, 640], [300, 800]], ease: inOut}]}
            - {actor: person, view: side, x: 1000, y: 1430, scale: 0.9, look: *marta, face: [{at: 0, v: sad}, {at: "@сияет", v: surprised}], walk: [{at: 0, v: 2.2}, {at: "@Отец", v: 0}], anim: [{at: "@кузницу-0.22", dur: 1.2, x: 860, ease: out}]}
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: "#ffffff", opacity: [{at: 0, v: 0}, {at: "@глаза", v: 0.75, dur: 0.15}, {at: "@глаза+0.25", v: 0, dur: 0.5}]}
            - {actor: callout, target: "mirror.top", x: 420, y: 640, title: "ЩИТ СИЯЕТ", color: gold, size: 40, space: screen, at: "@щит", enter: pop, sfx: false}
    sfx:
      - {sound: hiss, at: "@достаёт", gain: -14}
      - {sound: footstep, at: "@бежит", gain: -14}
      - {sound: sparkle, at: "@сияет", gain: -12}
      - {sound: chime, at: "@глаза", gain: -12}

  # ------------------------------------------------------------------ 9. TWIST — он готовил зеркало
  - id: twist
    text: "Три ночи Марта думала, что он сошёл с ума. А он видел ту белую нитку на камне. Говорить уже не мог. Но руки помнили. Он готовил ей зеркало."
    shots:
      - id: w_flash
        transition: {type: dip}
        captions_top: 1500
        look: {grade: {sat: 0.35, contrast: 0.06}, bloom: [0.7, 0.3]}
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.15, y: 860}, {t: "@нитку", z: 1.3, y: 840}, {t: "@руки-0.2", z: 1.0, y: 960}, {t: end, z: 1.08, y: 980}]}
          layers:
            # flashback 1: the torch touches the stone, the white thread
            - {actor: shape, kind: rect, x: -200, y: 0, w: 1480, h: 2000, origin: top-left, fill: {linear: ["#1a120e", "#3a281c", "#2a1e16"], angle: 180}, until: "@Говорить+0.3", exit: fade}
            - {actor: star_stone, x: 540, y: 820, r: 165, heat: 0.6, crack: [{at: 0, v: 0}, {at: "@нитку", v: 0.35, dur: 0.15}, {at: "@камне+0.3", v: 0, dur: 0.4}], until: "@Говорить+0.3", exit: fade}
            - {actor: shape, kind: path, d: "M-200,980 Q120,930 330,950 Q540,990 760,948 Q980,925 1280,985 L1280,2000 L-200,2000 Z", fill: {linear: ["#4a3424", "#2a1e16"], angle: 180}, until: "@Говорить+0.3", exit: fade}
            - {actor: torch, x: 230, y: 1260, len: 260, scale: 1.3, rot: 48, halo: 260, until: "@Говорить+0.3", exit: fade}
            - {actor: person, view: side, x: 150, y: 1500, scale: 0.9, look: *hans, face: surprised, brightness: 0.8, at: "@видел", enter: fade, until: "@Говорить+0.3", exit: fade}
            # flashback 2: three nights of polishing
            - {actor: hut_interior, floor_y: 1420, wall: "#2a2420", timber: "#161210", floor: "#221a14", light: [260, 1160], light_r: 600, light_k: 0.6, seed: 7, at: "@Говорить", enter: fade}
            - {actor: fire, x: 250, y: 1125, w: 200, h: 90, tongues: 5, seed: 4, k: 0.55, at: "@Говорить", enter: fade}
            - {actor: person, view: side, flip: true, x: 640, y: 1440, scale: 1.0, look: *hans_empty, sit: 0.6, face: neutral, at: "@Говорить", enter: fade,
               pose: [{at: 0, v: {a1: [40, 60], a2: [50, 50], sit: 0.6}}, {at: "@руки", v: {a1: [50, 40], a2: [40, 70], sit: 0.6}, dur: 0.25}, {at: "@помнили", v: {a1: [40, 60], a2: [50, 50], sit: 0.6}, dur: 0.25}]}
            - {actor: shield, x: 520, y: 1230, r: 95, sx: 0.8, at: "@Говорить", enter: fade, shine: [{at: 0, v: 0.3}, {at: "@помнили", v: 1, dur: 0.6}]}
            - {actor: stack, x: 540, y: 300, dir: h, gap: 16, space: screen, children: [
                {actor: badge, title: "НОЧЬ 1", style: solid, color: "#6a5a4a", size: 30, at: "@Три", enter: pop, sfx: false},
                {actor: badge, title: "НОЧЬ 2", style: solid, color: "#6a5a4a", size: 30, at: "@Три+0.25", enter: pop, sfx: false},
                {actor: badge, title: "НОЧЬ 3", style: solid, color: "#6a5a4a", size: 30, at: "@Три+0.5", enter: pop, sfx: false}]}
            - {actor: badge, x: 540, y: 470, style: outline, title: "ТА САМАЯ НИТКА", color: "#e8eeff", size: 40, space: screen, at: "@нитку", until: "@Говорить", exit: fade, enter: pop, sfx: false}
      - id: w_gift
        start: "@Он#2-0.22"
        transition: {type: zoom}
        look: {bloom: [0.55, 0.5]}
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 540, y: 1060}, {t: end, z: 1.25, x: 540, y: 1100}]}
          layers:
            - *forge_in
            - {actor: light_pool, x: 540, y: 1150, r: 420, color: "#fff0c0", a: 0.4}
            - {actor: person, view: side, x: 380, y: 1440, scale: 1.0, look: *hans_empty, face: neutral, pose: {a1: [70, 20], a2: [70, 20], l1: [8, 0], l2: [-8, 0]}}
            - {actor: shield, x: [{at: 0, v: 470}, {at: "@зеркало", v: 560, dur: 0.6, ease: out}], y: 1180, r: 100, sx: 0.85, shine: 1, glow: {color: "#ffffff", r: 30, a: 1}}
            - {actor: person, view: side, flip: true, x: 700, y: 1430, scale: 0.92, look: *marta, face: [{at: 0, v: surprised}, {at: "@зеркало", v: happy}], pose: [{at: 0, v: stand}, {at: "@зеркало", v: {a1: [70, 20], a2: [70, 20], l1: [8, 0], l2: [-8, 0]}, dur: 0.4}]}
            - {<<: *title, text: "ОН ГОТОВИЛ ЗЕРКАЛО", at: "@готовил-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: ping, at: "@нитку", gain: -12}
      - {sound: scrape, at: "@руки", gain: -14}
      - {sound: chime, at: "@зеркало", gain: -10}

  # ------------------------------------------------------------------ 10. CLIMAX — луч, тени вернулись, «Марта»
  - id: climax
    text: "Марта ставит щит на край ямы и ловит солнце. Луч падает на камень. Звон. Трещина. Ещё одна. Ульрих с верёвками замирает на краю. Пять теней вырываются из камня и ложатся под ноги хозяевам. Третий закат. Отец поднимает глаза. Марта."
    lines:
      - {who: hans, say: "Марта."}
    shots:
      - id: c_beam
        transition: {type: zoom}
        ambience: [{sound: wind, gain: -20}]
        look: {bloom: [0.55, 0.5]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 980}, {t: "@Луч", z: 1.06, x: 600, y: 1000}, {t: end, z: 1.12, x: 620, y: 1020}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 12.5, par: 0, sun: [180, 260], horizon: 1000, clouds: 3, seed: 7}
            - {actor: forest, x: 540, y: 1020, w: 2100, h: 280, hill: 40, color: "#2e4a36", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 1000, w: 2120, h: 1000, color: ["#3e5a3e", "#2e4a2e"], par: 0.3}
            - {actor: tree, kind: pine, h: 760, x: 960, y: 1250, color: "#1e3a28", par: 0.7, seed: 2}
            - {actor: ground, x: -520, y: 1230, w: 2120, h: 900, color: ["#5a4a32", "#3a2e20"], par: 0.7}
            - {actor: crater, x: 640, y: 1450, w: 900, depth: 220, color: "#4a3a2a"}
            - {actor: shape, kind: ellipse, x: 640, y: 1320, w: 560, h: 150, fill: "rgba(10,12,16,0.6)", blur: 12}
            - {actor: star_stone, id: stone, x: 700, y: 1310, r: 46, drink: 0.8, rim: "#7a4aff"}
            # the beam: sun → shield → stone
            - {actor: shape, kind: line, points: [[180, 260], [300, 1100]], stroke: beam, sw: 12, at: "@ловит", enter: draw, enter_dur: 0.3, glow: {color: "#ffffff", r: 22, a: 1}}
            - {actor: shape, kind: line, points: [[300, 1100], [690, 1300]], stroke: beam, sw: 14, at: "@Луч", enter: draw, enter_dur: 0.3, glow: {color: "#ffffff", r: 26, a: 1}}
            - {<<: *vsh, x: 220, y: 1260, scale: 0.9, view: side, look: *marta, angle: 40, len: 0.4}
            - {actor: person, id: marta, view: side, x: 220, y: 1260, scale: 0.9, look: *marta, face: determined,
               pose: [{at: 0, v: {a1: [50, 60], a2: [50, 60], l1: [2, 0], l2: [-2, 0]}}, {at: "@ловит", v: {a1: [90, 30], a2: [90, 30], l1: [10, 0], l2: [-10, 0]}, dur: 0.3}]}
            - {actor: shield, id: mirror, x: [{at: 0, v: 280}, {at: "@ловит", v: 300, dur: 0.3}], y: [{at: 0, v: 1170}, {at: "@ловит", v: 1100, dur: 0.3}], r: 55, sx: 0.55, shine: [{at: 0, v: 0.4}, {at: "@ловит", v: 1, dur: 0.2}], glow: {color: "#ffffff", r: 20, a: 0.9}}
            - {actor: callout, target: "mirror.top", x: 540, y: 600, title: "ЩИТ = ЗЕРКАЛО", color: gold, size: 42, space: screen, at: "@ловит", until: "@Луч+0.6", exit: fade, enter: pop, sfx: false}
      - id: c_crack
        start: "@Звон-0.22"
        captions_top: 1520
        look: {bloom: [0.5, 0.6]}
        draw:
          bg: "#0a0c14"
          camera: {keys: [{t: 0, z: 1.1}, {t: end, z: 0.98}], shakes: [{at: "@Трещина", amp: 14, dur: 0.4}, {at: "@Ещё", amp: 20, dur: 0.5}]}
          layers:
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: {radial: ["#4a4a5a", "#1e2028", "#0a0b10"]}}
            - {actor: shape, kind: line, points: [[-100, 300], [540, 760]], stroke: beam, sw: 22, glow: {color: "#ffffff", r: 30, a: 1}}
            - {actor: star_stone, x: 540, y: 760, r: 190, crack: [{at: 0, v: 0}, {at: "@Трещина", v: 0.5, dur: 0.3}, {at: "@Ещё", v: 1, dur: 0.4}], drink: [{at: 0, v: 1}, {at: "@Ещё", v: 0, dur: 0.2}]}
            - {actor: particles, kind: sparkles, region: [200, 400, 900, 1100], count: 30, at: "@Трещина", seed: 4}
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: "#ffffff", opacity: [{at: 0, v: 0}, {at: "@Ещё", v: 0.6, dur: 0.1}, {at: "@Ещё+0.15", v: 0, dur: 0.5}]}
            # Ulrich with the ropes at the rim freezes (bottom of the frame)
            - {actor: shape, kind: rect, x: 540, y: 1460, w: 1300, h: 220, fill: {linear: ["#2a2420", "#16120e"], angle: 180}}
            - {actor: person, id: ulrich, view: side, flip: true, x: 820, y: 1400, scale: 0.85, look: *ulrich, face: [{at: 0, v: determined}, {at: "@замирает", v: surprised}],
               walk: [{at: 0, v: 1.6}, {at: "@замирает", v: 0}], anim: [{at: "@Звон-0.22", dur: 2.5, x: 760, ease: out}], hold: bucket, hold_rot: 0, brightness: 0.8}
            - {<<: *title, text: "ЗВОН", at: "@Звон-0.05", until: "@Ульрих-0.1", exit: fade, reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: c_shadows
        start: "@Пять-0.22"
        transition: {type: dip}
        draw:
          camera: {keys: [{t: 0, z: 1.12, y: 1080}, {t: end, z: 1.0, y: 1000}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 13, par: 0, sun: [180, 260], horizon: 930, clouds: 2, seed: 7}
            - {actor: forest, x: 540, y: 1010, w: 2100, h: 260, hill: 40, color: "#3a5a46", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 995, w: 2120, h: 1000, color: ["#4a6a4a", "#3a5a3a"], par: 0.3}
            - {actor: ground, x: -520, y: 1150, w: 2120, h: 900, color: ["#6a5a3a", "#4a3e2a"]}
            - {actor: crater, x: 540, y: 1430, w: 1000, depth: 230, color: "#5a4430"}
            - {actor: particles, kind: sparkles, region: [400, 1150, 700, 1350], count: 20, seed: 3}
            - {<<: *shade, x: 540, y: 1330, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@вырываются", dur: 0.7, path: [[540, 1330], [360, 1150], [140, 1230]], ease: in}, {at: "@вырываются+0.7", dur: 0.2, opacity: 0}]}
            - {<<: *shade, x: 540, y: 1330, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@вырываются+0.08", dur: 0.7, path: [[540, 1330], [420, 1080], [300, 1225]], ease: in}, {at: "@вырываются+0.78", dur: 0.2, opacity: 0}]}
            - {<<: *shade, x: 540, y: 1330, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@вырываются+0.16", dur: 0.7, path: [[540, 1330], [650, 1080], [760, 1220]], ease: in}, {at: "@вырываются+0.86", dur: 0.2, opacity: 0}]}
            - {<<: *shade, x: 540, y: 1330, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@вырываются+0.24", dur: 0.7, path: [[540, 1330], [800, 1100], [900, 1225]], ease: in}, {at: "@вырываются+0.94", dur: 0.2, opacity: 0}]}
            - {<<: *shade, x: 540, y: 1330, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@вырываются+0.32", dur: 0.7, path: [[540, 1330], [900, 1060], [1010, 1230]], ease: in}, {at: "@вырываются+1.02", dur: 0.2, opacity: 0}]}
            - {<<: *vsh, x: 140, y: 1230, scale: 0.7, view: side, look: {age: adult, outfit: peasant_f, hair: bun}, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложатся", v: 0.5, dur: 0.3}]}
            - {<<: *vsh, x: 300, y: 1225, scale: 0.72, view: side, look: {age: adult, outfit: tunic, hair: short}, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложатся+0.08", v: 0.5, dur: 0.3}]}
            - {<<: *vsh, x: 760, y: 1220, scale: 0.72, view: side, flip: true, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложатся+0.16", v: 0.5, dur: 0.3}]}
            - {<<: *vsh, x: 900, y: 1225, scale: 0.72, view: side, flip: true, look: {<<: *miller, hollow: false}, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложатся+0.24", v: 0.5, dur: 0.3}]}
            - {<<: *vsh, x: 1010, y: 1230, scale: 0.75, view: side, flip: true, look: *hans, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложатся+0.32", v: 0.5, dur: 0.3}]}
            - {actor: person, view: side, x: 140, y: 1230, scale: 0.7, look: {age: adult, outfit: peasant_f, hair: bun, hollow: true}, face: [{at: 0, v: neutral}, {at: "@ложатся", v: surprised}]}
            - {actor: person, view: side, x: 300, y: 1225, scale: 0.72, look: {age: adult, outfit: tunic, hair: short, hollow: true}, face: [{at: 0, v: neutral}, {at: "@ложатся", v: surprised}]}
            - {actor: person, view: side, flip: true, x: 760, y: 1220, scale: 0.72, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a", hollow: true}, face: [{at: 0, v: neutral}, {at: "@ложатся", v: surprised}]}
            - {actor: person, view: side, flip: true, x: 900, y: 1225, scale: 0.72, look: {<<: *miller, hollow: false}, face: happy}
            - {actor: person, view: side, flip: true, x: 1010, y: 1230, scale: 0.75, look: *hans_empty, face: [{at: 0, v: neutral}, {at: "@ложатся", v: surprised}]}
            - {<<: *title, text: "ТЕНИ ВЕРНУЛИСЬ", at: "@ложатся-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: c_name
        start: "@Третий-0.22"
        captions_top: 1560
        transition: {type: dip}
        ambience: [{sound: fire, gain: -18}]
        look: {bloom: [0.7, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.05, x: 560, y: 980}, {t: end, z: 1.2, x: 560, y: 960}]}
          layers:
            - {actor: hut_interior, floor_y: 1420, wall: "#3a2a24", timber: "#1e1612", floor: "#2e241c", window: {x: 760, y: 520, w: 220, h: 260}, light: [860, 900], light_r: 700, seed: 7}
            - {actor: light_pool, x: 860, y: 700, r: 360, color: "#ff9a4a", a: 0.55}
            # sunset light from the window: now BOTH cast shadows on the wall
            - {actor: cast_shadow, x: 760, y: 1430, look: *marta, view: side, angle: 6, len: 1.25, wide: 1.2, color: "#100a08", alpha: 0.6, soft: 3}
            - {actor: cast_shadow, x: 380, y: 1440, look: *hans, view: side, angle: 6, len: [{at: 0, v: 0}, {at: "@Третий+0.2", v: 1.25, dur: 0.8}], wide: 1.2, color: "#100a08", alpha: 0.6, soft: 3, sit: 0.6, pose: {a1: [40, 60], a2: [50, 50], sit: 0.6}}
            - {actor: anvil, x: 180, y: 1440, scale: 0.85}
            - {actor: person, id: hans, view: side, x: 380, y: 1440, scale: 1.0, look: *hans, sit: 0.6, face: [{at: 0, v: neutral}, {at: "@Марта#2", v: happy}],
               pose: [{at: 0, v: {a1: [40, 60], a2: [50, 50], sit: 0.6}}, {at: "@глаза", v: {a1: [40, 60], a2: [50, 50], sit: 0.6, nod: -8}, dur: 0.4}, {at: "@Марта#2", v: {a1: [100, 30], a2: [60, 30], sit: 0.6}, dur: 0.4}]}
            - {actor: person, id: marta, view: side, flip: true, x: 760, y: 1430, scale: 0.92, look: *marta, face: [{at: 0, v: sad}, {at: "@Марта#2", v: happy}], anim: [{at: "@Марта#2+0.2", dur: 0.6, x: 560, ease: out}]}
            - {<<: *tag, text: "ТРЕТИЙ ЗАКАТ", at: "@Третий", enter: fade}
            - {<<: *who, target: "hans.top", x: 380, y: 700, title: "ГАНС", at: "@Марта#2"}
    sfx:
      - {sound: sparkle, at: "@ловит", gain: -12}
      - {sound: noise_sweep, at: "@Луч", gain: -14}
      - {sound: metal_ring, at: "@Звон", gain: -10}
      - {sound: impact, at: "@Трещина", gain: -12}
      - {sound: boom, at: "@Ещё", gain: -10}
      - {sound: whoosh, at: "@вырываются", gain: -12}
      - {sound: chime, at: "@ложатся", gain: -12}
      - {sound: chime, at: "@Марта#2", gain: -10}

  # ------------------------------------------------------------------ 11. CLIFF — тень Марты отстаёт
  - id: cliff
    text: "Вечером Марта идёт домой. Её тень отстаёт на полшага."
    shots:
      - id: z_lag
        transition: {type: dip}
        ambience: [{sound: wind, gain: -22}]
        draw:
          camera: {keys: [{t: 0, z: 1.12, y: 1060}, {t: end, z: 1.25, x: 500, y: 1080}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 18.6, par: 0, sun: [120, 900], horizon: 930, clouds: 3, seed: 4}
            - {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#6a5a6a", seed: 3, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#7a6a5a", "#5a4e44"], par: 0.2}
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45, lit: 0.6}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#8a7a60", "#6a5e4a"], par: 0.45}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false, lit: 0.8}
            - {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#6a6058"}
            # she stops — her shadow takes one more step
            - {<<: *vsh, x: 260, y: 1280, scale: 0.95, view: side, look: *marta, angle: 120, len: 1.6, walk: [{at: 0, v: 1.5}, {at: "@отстаёт+0.3", v: 0}], lag: 0.55, anim: [{at: "@cliff.start", dur: 3.6, x: 520, ease: linear}]}
            - {actor: person, id: marta, x: 260, y: 1280, scale: 0.95, view: side, look: *marta, walk: [{at: 0, v: 1.5}, {at: "@отстаёт-0.25", v: 0}], face: [{at: 0, v: smile}, {at: "@отстаёт", v: surprised}], anim: [{at: "@cliff.start", dur: 3.6, x: 520, ease: linear}]}
            - {actor: particles, kind: dust, region: [0, 300, 1080, 1300], count: 22, colors: ["#fff1d0"], alpha: 0.5, seed: 13}
            - {<<: *title, y: 620, size: 92, text: "ТЕНЬ ОТСТАЁТ", at: "@отстаёт-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: footstep, at: "@идёт", gain: -16}
      - {sound: creature, at: "@отстаёт", gain: -14}

  # ------------------------------------------------------------------ 12. CTA — солнце или колодец
  - id: cta
    text: "А ты бы рискнул солнцем — или сбросил камень в колодец? Пиши: солнце или колодец."
    shots:
      - id: q_choice
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#0c0e16"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: {radial: ["#2a2438", "#141624", "#08090e"]}}
            - {actor: star_stone, x: 540, y: 560, r: 90, crack: 0.3, pulse: {freq: 1.2, amp: 0.03}}
            - actor: group
              x: 330
              y: 1000
              at: "@рискнул"
              enter: {type: slide_left, dur: 0.4}
              scale: [{at: 0, v: 1}, {at: "@солнцем", v: 1.08, dur: 0.3}, {at: "@колодец", v: 1, dur: 0.3}, {at: "@солнце", v: 1.08, dur: 0.3}]
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 360, h: 520, radius: 28, fill: "#2a2216", stroke: gold, sw: 6}
                - {actor: shape, kind: circle, x: 0, y: -140, r: 60, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 20, a: 1}}
                - {actor: shield, x: 0, y: 40, r: 70, shine: 1}
                - {actor: text, x: 0, y: 190, size: 46, color: "#ffcf6a", text: "СОЛНЦЕ"}
            - actor: group
              x: 750
              y: 1000
              at: "@рискнул+0.1"
              enter: {type: slide_right, dur: 0.4}
              scale: [{at: 0, v: 1}, {at: "@колодец", v: 1.08, dur: 0.3}, {at: "@Пиши", v: 1, dur: 0.3}, {at: "@колодец#2", v: 1.08, dur: 0.3}]
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 360, h: 520, radius: 28, fill: "#1a1e26", stroke: "#9ab0c8", sw: 6}
                - {actor: well, x: 0, y: 80, scale: 0.55}
                - {actor: text, x: 0, y: 190, size: 46, color: "#c8d8e8", text: "КОЛОДЕЦ"}
            - {<<: *title, y: 330, size: 86, text: "СОЛНЦЕ ИЛИ КОЛОДЕЦ?", at: "@Пиши-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: whoosh, at: "@рискнул", gain: -14}
      - {sound: sparkle, at: "@солнцем", gain: -14}
      - {sound: drip, at: "@колодец", gain: -12}
      - {sound: blip, at: "@Пиши", gain: -12}

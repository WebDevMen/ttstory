# «Без тени» — одна история (~2:54). 100% code-drawn (method draw) из projects/shadow/script.yaml
# (skill write-script → vg.py script project → этот файл). Сценарий по правилам ясности: героиня Марта, реплики героев
# своими голосами (voices + lines у сцены), дилемма у колодца, улика щита трижды.
# Актёры: библиотека medieval.js + person; графика старой серии shadow1–3 использована повторно.
# Координаты: экран 1080x1920. Время: "@слово" (числа в at — абсолютные секунды ролика, кроме 0).
#
# Глубина (docs/DRAW.md §10.6): у каждого дальнего плана своя полоса земли с тем же par; свет в кадре с одной стороны.

title: "Без тени"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+12%", pitch: "+0Hz", tail: 1.4}
# голоса героев: реплики сцен (lines) звучат своим голосом, рассказчик — голосом voice
voices:
  marta: {voice: ru-RU-SvetlanaNeural, rate: "+12%", pitch: "+18Hz"}
  hans: {voice: ru-RU-DmitryNeural, rate: "+0%", pitch: "-10Hz"}
  ulrich: {voice: ru-RU-DmitryNeural, rate: "+6%", pitch: "+4Hz"}
  miller: {voice: ru-RU-DmitryNeural, rate: "-6%", pitch: "-16Hz"}

theme:
  preset: minimal
  accent: "#ffcf6a"
  captions:
    style: clean
    top: 1480
    size: 62
    max_chars: 20

post: {vignette: 0.32, chromatic: 0, grain: 0.03}

draw:
  palette: {gold: "#ffcf6a", ink: "#3a2416", night: "#0b1022", warn: "#e0553a", shade: "#120d0c", beam: "#fff6dc"}

# ------------------------------------------------------------------ shared pieces
x-title: &title {actor: text, x: 540, y: 420, size: 100, width: 980, lines: 2, color: "#ffffff", stroke: {w: 10, color: "#120d0c"}, shadow: "0 0 34px rgba(255,190,90,.55)", space: screen}
x-tag: &tag {actor: timetag, x: 540, y: 200, size: 36, color: gold, space: screen}
x-who: &who {actor: callout, color: gold, size: 38, space: screen, enter: pop, sfx: false}

x-look-marta: &marta {age: student, outfit: dress, hair: braid, hair_color: "#b8481e", skin: light}
x-look-hans: &hans {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true, skin: mid}
x-look-hans-empty: &hans_empty {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true, skin: mid, hollow: true}
x-look-ulrich: &ulrich {age: adult, outfit: tunic, color: "#7a2a22", hair: buzz, hair_color: "#8a8a8a", beard: "#9a9a9a", skin: mid}
x-look-miller: &miller {age: adult, outfit: tunic, color: "#d8d0bc", hair: short, hair_color: "#d0d0d0", beard: "#dadada", skin: light, hollow: true}

x-sky-morning: &sky_morning {actor: sky, x: -200, w: 1480, hour: 7.4, par: 0, sun: [150, 860], horizon: 930, clouds: 3, seed: 6}
x-forest-far: &forest_far {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#7c8a8a", seed: 3, par: 0.2}
x-ground-far: &ground_far {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#8d9474", "#717858"], par: 0.2}
x-haze: &haze {actor: shape, kind: rect, x: 540, y: 905, w: 2100, h: 200, par: 0.25, fill: {linear: ["rgba(255,230,200,0)", "rgba(255,226,190,0.5)", "rgba(255,230,200,0)"], angle: 180}}
x-ground-mid: &ground_mid {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#9a9070", "#7a7258"], par: 0.45}
x-cobbles: &cobbles {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#7a7064"}
x-vsh: &vsh {actor: cast_shadow, angle: 128, len: 1.0, flat: 0.42, alpha: 0.5, color: "#1a1410", soft: 2.5}
x-shade: &shade {actor: living_shadow, color: "#06060a", glow: {color: "#9a8cff", r: 10, a: 0.45}}

# forge interior: timber wall, hearth with fire on the left (light from the left), shield on the wall
x-forge-in: &forge_in
  - {actor: hut_interior, floor_y: 1420, wall: "#3a302a", timber: "#1e1612", floor: "#2e241c", light: [260, 1160], light_r: 760, seed: 7}
  - {actor: shape, kind: rect, x: 250, y: 1270, w: 380, h: 300, radius: 10, fill: {linear: ["#5a5048", "#3a332e"], angle: 180}}
  - {actor: shape, kind: rect, x: 250, y: 1130, w: 400, h: 34, radius: 6, fill: "#6a6058"}
  - {actor: shape, kind: rect, x: 250, y: 880, w: 200, h: 470, fill: {linear: ["#4a4038", "#3a322c"], angle: 0}}
  - {actor: fire, x: 250, y: 1125, w: 240, h: 170, tongues: 6, seed: 4}
  - {actor: light_pool, x: 260, y: 1120, r: 520, sy: 0.75, color: "#ff8a3a", a: 0.5}

audio:
  music:
    key: D
    mode: minor
    bpm: 84
    gain: -16
    sections:
      - {at: 0, style: drone, chords: [Dm, Bb, F, A]}
      - {at: "@problem.start", style: tension}
      - {at: "@second.start", style: dark}
      - {at: "@proof.start", style: tension}
      - {at: "@dilemma.start", style: pulse, chords: [Dm, Bb, Gm, A]}
      - {at: "@twist.start", style: sub}
      - {at: "@climax.start", style: epic, chords: [Dm, Bb, F, C]}
      - {at: "@cliff.start", style: drone}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ 1. HOOK — три заката
  - id: hook
    accent: "#ffcf6a"
    text: "Человек без тени помнит тебя три заката. Потом он забудет твоё имя."
    caption_marks: {"без тени": "#ffcf6a", "три заката": "#ffcf6a"}
    shots:
      - id: h_sun
        ambience: [{sound: birds, gain: -18}]
        look: {grade: {contrast: 0.08}}
        draw:
          camera: {keys: [{t: 0, z: 1.04, x: 540, y: 1020}, {t: end, z: 1.1, x: 520, y: 1060}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 7.6, par: 0, sun: [120, 820], horizon: 900, clouds: 3, seed: 6}
            - {actor: forest, x: 540, y: 880, w: 2100, h: 150, hill: 100, color: "#7c8a8a", seed: 13, par: 0.2}
            - {actor: ground, x: -520, y: 865, w: 2120, h: 1100, color: ["#8d9474", "#717858"], par: 0.2}
            - {actor: forge, x: 300, y: 1130, scale: 1.25, par: 0.7}
            - {actor: cottage, x: 900, y: 1130, scale: 0.75, seed: 8, floors: 2, thatch: false, door_at: 1, par: 0.7}
            - {actor: ground, x: -520, y: 1110, w: 2120, h: 1000, color: ["#8a7458", "#6a5640"], par: 0.7}
            - {actor: ground, x: -520, y: 1250, w: 2120, h: 800, color: ["#9a8262", "#7a644a"]}
            - {actor: shape, kind: path, d: "M560,1395 L760,1385 L790,1405 L600,1420 Z", fill: "rgba(26,20,16,0.55)", blur: 2.5}
            - {actor: anvil, x: 560, y: 1410, scale: 1.0}
            - {actor: prop, kind: bucket, color: "#7a5a3a", x: 860, y: 1425, scale: 0.6}
            - {actor: shape, kind: path, d: "M880,1420 L990,1414 L1000,1428 L890,1432 Z", fill: "rgba(26,20,16,0.5)", blur: 2.5}
            - {actor: person, id: hans, view: side, x: 400, y: 1420, scale: 1.0, look: *hans_empty, hold: hammer, hold_rot: 180, face: neutral, pose: stand}
            - {actor: shape, id: noshadow, kind: rect, x: 610, y: 1440, w: 420, h: 64, radius: 32, fill: "none", stroke: gold, sw: 4, dash: "12 9", at: "@тени", enter: draw, enter_dur: 0.5, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {<<: *title, text: "БЕЗ ТЕНИ", at: "@без-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: h_suns
        start: "@три-0.22"
        transition: {type: dip}
        draw:
          camera: {keys: [{t: 0, z: 1.06, y: 960}, {t: end, z: 1.0, y: 960}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: [{at: 0, v: 18.4}, {at: "@Потом", v: 19.6, dur: 1.4}], par: 0, sun: false, moon: false, horizon: 1060, clouds: 2, seed: 9}
            # three suns in a row: the evenings he has left; they sink and go out one by one
            - {actor: shape, kind: circle, x: 300, y: 700, r: 70, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 30, a: 1}, at: "@три", enter: pop, opacity: [{at: 0, v: 1}, {at: "@Потом", v: 0.15, dur: 0.4}]}
            - {actor: shape, kind: circle, x: 540, y: 700, r: 70, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 30, a: 1}, at: "@три+0.12", enter: pop, opacity: [{at: 0, v: 1}, {at: "@он", v: 0.15, dur: 0.4}]}
            - {actor: shape, kind: circle, x: 780, y: 700, r: 70, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 30, a: 1}, at: "@заката", enter: pop, opacity: [{at: 0, v: 1}, {at: "@забудет", v: 0.15, dur: 0.4}]}
            - {actor: forest, x: 540, y: 1080, w: 2100, h: 200, hill: 60, color: "#2a2438", seed: 4, par: 0.3}
            - {actor: ground, x: -520, y: 1060, w: 2120, h: 1000, color: ["#2a2438", "#1c1826"], par: 0.3}
            - {actor: cottage, x: 200, y: 1250, scale: 0.9, seed: 3, brightness: 0.45, lit: 0.6}
            - {actor: cottage, x: 880, y: 1250, scale: 0.85, seed: 8, floors: 2, thatch: false, brightness: 0.45, lit: 0.6}
            - {actor: cobbles, x: -300, y: 1230, w: 1680, h: 800, color: "#3a3646"}
            - {actor: text, x: 540, y: 1000, size: 120, font: hand, color: "#ffe6b0", text: "Марта", at: "@Потом", enter: fade, until: "@имя+0.35", exit: {type: fade, dur: 0.3}, blur: [{at: 0, v: 0}, {at: "@имя", v: 14, dur: 0.35}], space: screen}
            - {actor: particles, kind: dust, region: [340, 900, 740, 1100], count: 30, colors: ["#ffe6b0"], at: "@имя", seed: 5}
            - {<<: *title, y: 400, text: "3 ЗАКАТА", at: "@три-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: metal_ring, at: "@hook.start", gain: -14}
      - {sound: hiss, at: "@тени", gain: -14}
      - {sound: bell, at: "@три", gain: -12}
      - {sound: bell, at: "@заката", gain: -14}
      - {sound: sparkle, at: "@имя", gain: -14}

  # ------------------------------------------------------------------ 2. SETUP — кузница, герои, звезда
  - id: setup
    text: "Деревня Вельмар, осень. Марта, шестнадцать лет, дочь кузнеца. Держит отцу мехи у горна. Ганс, сорок пять, кузнец. Руки в саже, борода в искрах. Над лесом проносится огонь, и за мельницей вздрагивает земля. Ганс хватает факел. Сиди дома. Пап, только ничего там не трогай!"
    lines:
      - {who: hans, say: "Сиди дома."}
      - {who: marta, say: "Пап, только ничего там не трогай!"}
    shots:
      - id: s_forge
        transition: {type: whip_x}
        ambience: [{sound: fire, gain: -16}]
        look: {bloom: [0.72, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.1, x: 560, y: 1000}]}
          layers:
            - *forge_in
            # the old round shield on the wall — dull for now (clue, polished later)
            - {actor: shield, x: 820, y: 760, r: 100, brightness: 0.55, saturate: 0.6}
            - {actor: anvil, x: 760, y: 1440, scale: 0.9}
            - {actor: shape, kind: path, d: "M450,1330 L560,1290 L590,1330 L470,1370 Z", fill: "#6a4a2e", stroke: "#3a2616", sw: 4, sy: [{at: 0, v: 1}, {at: "@Держит", v: 0.75, dur: 0.3}, {at: "@мехи", v: 1, dur: 0.3}, {at: "@горна", v: 0.75, dur: 0.3}]}
            - {actor: person, id: marta, view: side, flip: true, x: 640, y: 1430, scale: 0.92, look: *marta, face: [{at: 0, v: neutral}, {at: "@Марта", v: smile}],
               pose: [{at: 0, v: {a1: [60, 30], a2: [70, 20], l1: [10, 0], l2: [-10, 0], lean: 10}}, {at: "@Держит", v: {a1: [40, 50], a2: [50, 40], l1: [10, 0], l2: [-10, 0], lean: 18}, dur: 0.3},
                      {at: "@мехи", v: {a1: [60, 30], a2: [70, 20], l1: [10, 0], l2: [-10, 0], lean: 10}, dur: 0.3}, {at: "@горна", v: {a1: [40, 50], a2: [50, 40], l1: [10, 0], l2: [-10, 0], lean: 18}, dur: 0.3}]}
            - {actor: particles, kind: embers, region: [100, 800, 500, 1150], count: 26, seed: 3}
            - {actor: particles, kind: embers, region: [150, 900, 450, 1150], count: 18, at: "@мехи", seed: 8}
            - {<<: *tag, text: "ВЕЛЬМАР · ОСЕНЬ", at: "@Деревня", enter: fade}
            - {<<: *who, target: "marta.top", x: 640, y: 700, title: "МАРТА, 16 · ДОЧЬ КУЗНЕЦА", at: "@Марта+0.1"}
      - id: s_hans
        start: "@Ганс-0.22"
        look: {bloom: [0.72, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.08, x: 520, y: 1020}, {t: end, z: 1.16, x: 560, y: 1040}], shakes: [{at: "@саже", amp: 6, dur: 0.25}, {at: "@искрах", amp: 6, dur: 0.25}]}
          layers:
            - *forge_in
            - {actor: shield, x: 820, y: 760, r: 100, brightness: 0.55, saturate: 0.6}
            - {actor: anvil, x: 640, y: 1440, scale: 1.0}
            - {actor: shape, kind: rect, x: 660, y: 1270, w: 160, h: 14, radius: 6, fill: "#ff7a2a", glow: {color: "#ff9a3a", r: 14, a: 1}}
            - {actor: person, id: hans, view: side, x: 470, y: 1440, scale: 1.05, look: *hans, hold: hammer, hold_rot: 180, face: determined,
               pose: [{at: 0, v: swing_ready}, {at: "@саже-0.15", v: swing, dur: 0.15}, {at: "@саже+0.3", v: swing_ready, dur: 0.35}, {at: "@искрах-0.15", v: swing, dur: 0.15}, {at: "@искрах+0.3", v: swing_ready, dur: 0.35}]}
            - {<<: *vsh, x: 470, y: 1440, scale: 1.05, view: side, look: *hans, angle: 160, len: 0.9, alpha: 0.45,
               pose: [{at: 0, v: swing_ready}, {at: "@саже-0.15", v: swing, dur: 0.15}, {at: "@саже+0.3", v: swing_ready, dur: 0.35}, {at: "@искрах-0.15", v: swing, dur: 0.15}, {at: "@искрах+0.3", v: swing_ready, dur: 0.35}]}
            - {actor: particles, kind: sparkles, region: [560, 1150, 780, 1300], count: 16, colors: ["#ffcf6a", "#ff8a3a"], at: "@саже", until: "@саже+0.8", seed: 2}
            - {actor: particles, kind: sparkles, region: [560, 1150, 780, 1300], count: 16, colors: ["#ffcf6a", "#ff8a3a"], at: "@искрах", seed: 6}
            - {<<: *who, target: "hans.top", x: 420, y: 700, title: "ГАНС, 45 · КУЗНЕЦ", at: "@Ганс+0.1"}
      - id: s_fall
        start: "@Над-0.22"
        transition: {type: zoom}
        captions_top: 1250
        look: {bloom: [0.7, 0.35]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: "@вздрагивает", z: 1.05, y: 960}, {t: end, z: 1.07, y: 970}], shakes: [{at: "@вздрагивает", amp: 16, dur: 0.6}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 19.3, par: 0, horizon: 1150, clouds: 2, seed: 9, sun: false, moon: false}
            - {actor: light_pool, x: 400, y: 960, r: 640, sy: 0.6, color: "#ff8a3a", a: 0.9, par: 0.2, k: [{at: 0, v: 0}, {at: "@вздрагивает", v: 1, dur: 0.15}, {at: "@вздрагивает+0.5", v: 0.45, dur: 1.2}]}
            - {actor: forest, x: 540, y: 1300, w: 2000, h: 230, hill: 210, color: "#1f2238", seed: 8, par: 0.3}
            - {actor: ground, x: -500, y: 1280, w: 2100, h: 800, color: ["#1f2238", "#15172a"], par: 0.3}
            - {actor: shape, kind: path, x: 0, y: 0, origin: top-left, d: "M1240,40 Q760,260 400,1120", fill: "none", stroke: "#8a7a86", sw: 26, opacity: 0.45, blur: 10, enter: {type: fade, dur: 0.2},
               at: "@Над-0.1", draw: [{at: 0, v: 0}, {at: "@Над-0.1", v: 1, dur: 2.35, ease: in}]}
            - {actor: meteor, x: 1240, y: 40, len: 520, angle: 180, r: 26, enter: {type: fade, dur: 0.15}, at: "@Над-0.1", until: "@вздрагивает",
               scale: [{at: 0, v: 0.6}, {at: "@Над-0.1", v: 1.3, dur: 2.35, ease: in}], tail: [{at: 0, v: 0.5}, {at: "@Над-0.1", v: 1, dur: 2.35, ease: in}],
               anim: [{at: "@Над-0.1", dur: 2.35, path: "M1240,40 Q760,260 400,1120", orient: true, ease: in}]}
            - {actor: watermill, x: 820, y: 1720, scale: 0.9, speed: 30, lit: 0.9, brightness: 0.35, par: 0.7}
            - {actor: ground, x: -500, y: 1700, w: 2100, h: 400, color: ["#1a1a26", "#0e0e16"], par: 0.7}
            - {actor: particles, kind: embers, region: [200, 900, 700, 1300], count: 30, at: "@вздрагивает", seed: 5}
            - {<<: *title, text: "ЗВЕЗДА УПАЛА", at: "@вздрагивает-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: s_door
        start: "@хватает-0.22"
        transition: {type: dip}
        ambience: [{sound: wind, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.05, x: 560, y: 1000}, {t: end, z: 1.14, x: 600, y: 1020}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 20.4, par: 0, sun: false, moon: false, horizon: 1050, clouds: 2, seed: 2}
            - {actor: light_pool, x: 260, y: 1050, r: 520, sy: 0.5, color: "#ff8a3a", a: 0.5, par: 0.3}
            - {actor: forest, x: 540, y: 1070, w: 2100, h: 220, hill: 80, color: "#1a2030", seed: 6, par: 0.3}
            - {actor: ground, x: -520, y: 1050, w: 2120, h: 1000, color: ["#1a2030", "#12161f"], par: 0.3}
            # neighbours' torches on the path to the forest
            - {actor: torch, x: 160, y: 1160, len: 120, scale: 0.6, rot: 8, halo: 70, par: 0.3, anim: [{at: "@хватает", dur: 3, x: 60, ease: linear}]}
            - {actor: torch, x: 300, y: 1170, len: 120, scale: 0.6, rot: -6, halo: 70, par: 0.3, anim: [{at: "@хватает", dur: 3, x: 200, ease: linear}]}
            - {actor: forge, x: 760, y: 1330, scale: 1.5, brightness: 0.6}
            - {actor: ground, x: -520, y: 1310, w: 2120, h: 800, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 760, y: 1250, r: 320, sy: 0.6, color: "#ff9a3a", a: 0.45}
            - {actor: person, id: marta, view: side, flip: true, x: 760, y: 1340, scale: 0.92, look: *marta, face: [{at: 0, v: neutral}, {at: "@Пап", v: sad}],
               pose: [{at: 0, v: stand}, {at: "@Пап", v: {a1: [80, 10], a2: [10, 10], l1: [14, 6], l2: [-10, 6], lean: -6}, dur: 0.3}]}
            - {actor: person, id: hans, view: side, flip: true, x: 640, y: 1350, scale: 1.0, look: *hans, hold: torch, hold_rot: 140, face: determined,
               pose: [{at: 0, v: {a1: [6, 10], a2: [60, 80]}}, {at: "@Сиди", v: {a1: [6, 10], a2: [60, 80]}}], walk: [{at: 0, v: 0}, {at: "@Пап", v: 1.6}],
               anim: [{at: "@Пап", dur: 2.0, x: 330, y: 1300, ease: in}], glow: {color: "#ff9a3a", r: 16, a: 0.5}}
            - {<<: *who, target: "hans.top", x: 360, y: 720, title: "ГАНС", at: "@Сиди", until: "@Пап-0.1", exit: fade}
            - {<<: *who, target: "marta.top", x: 760, y: 720, title: "МАРТА", at: "@Пап"}
    sfx:
      - {sound: whoosh, at: "@мехи", gain: -14}
      - {sound: metal_ring, at: "@саже", gain: -12}
      - {sound: metal_ring, at: "@искрах", gain: -12}
      - {sound: noise_sweep, at: "@огонь", gain: -14}
      - {sound: boom, at: "@вздрагивает", gain: -10}
      - {sound: whoosh, at: "@хватает", gain: -14}
      - {sound: creak, at: "@Пап", gain: -16}

  # ------------------------------------------------------------------ 3. PROBLEM — камень без блика, белая нитка
  - id: problem
    text: "Яма за мельницей ещё дымится. Ганс спускается первым. На дне чёрный камень, тёплый, как живой. Свет факела в нём тонет: ни одного блика. Ганс касается его ладонью. Факел задевает камень — и по нему бежит белая нитка. Гаснет."
    shots:
      - id: p_pit
        transition: {type: zoom}

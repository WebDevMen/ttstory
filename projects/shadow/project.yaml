  # ------------------------------------------------------------------ 6. PROOF — один факел, одна трещина, одна тень
  - id: proof
    text: "Ночью Марта идёт к яме с факелом. Пламя гнётся к камню, будто его пьют. Марта подносит факел вплотную. Камень звенит. Трещина. Из неё вырывается тень — и ложится под ноги мельнику. Старый Йорг шепчет: меня зовут Йорг. Один факел — одна трещина — одна тень. А теней в камне ещё пять."
    lines:
      - {who: miller, say: "Меня зовут Йорг."}
    caption_marks: {"одна тень": "#ffcf6a"}
    shots:
      - id: x_torch
        transition: {type: zoom}
        ambience: [{sound: fire, gain: -18}, {sound: wind, gain: -20}]
        captions_top: 1520
        look: {bloom: [0.7, 0.3]}
        draw:
          bg: "#0a0c14"
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.12, x: 520, y: 900}]}
          layers:
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: {radial: ["#2a2a44", "#141624", "#08090e"]}}
            - {actor: star_stone, x: 540, y: 820, r: 170, drink: [{at: 0, v: 0.3}, {at: "@Пламя", v: 1, dur: 0.6}], rim: "#7a4aff", pulse: {freq: 1.2, amp: 0.02}}
            - {actor: shape, kind: path, d: "M-200,1000 Q240,960 540,1010 Q840,960 1280,1000 L1280,2000 L-200,2000 Z", fill: {linear: ["#2e241c", "#16110c"], angle: 180}}
            # Marta's torch: the tip of the flame is pulled to the stone and fire flows into it
            - {actor: torch, id: mtorch, x: -40, y: 1700, len: 300, scale: 1.25, rot: 24, halo: 220, lean: [{at: 0, v: 0}, {at: "@Пламя", v: 1.3, dur: 0.6}],
               anim: [{at: "@start", dur: 1.2, x: 130, y: 1400, ease: out}, {at: "@вплотную-0.5", dur: 0.7, x: 330, y: 1300, rot: 38, ease: inOut}]}
            - {actor: light_stream, x: 0, y: 0, from: [330, 960], to: [440, 860], bend: -40, width: 18, seed: 1, k: [{at: 0, v: 0}, {at: "@Пламя", v: 1, dur: 0.8, ease: out}], until: "@вплотную-0.4"}
            - {actor: light_stream, x: 0, y: 0, from: [520, 960], to: [530, 900], bend: -10, width: 22, seed: 2, at: "@вплотную-0.2", enter: fade, k: [{at: 0, v: 0}, {at: "@вплотную", v: 1, dur: 0.5}]}
            - {actor: particles, kind: embers, region: [100, 800, 1000, 1500], count: 30, seed: 7}
            - {<<: *tag, text: "НОЧЬ ВТОРАЯ · ЯМА", at: "@Ночью", enter: fade}
            - {<<: *title, text: "ПЛАМЯ ТЯНЕТСЯ К КАМНЮ", at: "@Пламя-0.05", until: "@вплотную-0.2", exit: fade, reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: x_crack
        start: "@звенит-0.22"
        captions_top: 1520
        look: {bloom: [0.5, 0.6]}
        draw:
          bg: "#0a0c14"
          camera: {keys: [{t: 0, z: 1.1}, {t: end, z: 1.0}], shakes: [{at: "@Трещина", amp: 14, dur: 0.45}]}
          layers:
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: {radial: ["#2a2a44", "#141624", "#08090e"]}}
            - {actor: star_stone, x: 540, y: 860, r: 190, drink: 0.6, crack: [{at: 0, v: 0}, {at: "@Трещина", v: 0.45, dur: 0.3}], pulse: {freq: 6, amp: 0.01}}
            - {actor: torch, x: 330, y: 1300, len: 300, scale: 1.25, rot: 38, halo: 220, lean: 1.3}
            - {<<: *shade, x: 560, y: 900, h: 300, alpha: 0.9, scale: 0.8, at: "@вырывается-0.1", enter: fade, enter_dur: 0.15, anim: [{at: "@вырывается-0.1", dur: 0.9, path: [[560, 900], [760, 760], [1200, 1100]], ease: in}]}
            - {actor: particles, kind: sparkles, region: [300, 600, 800, 1100], count: 22, colors: ["#e8eeff", "#ffffff"], at: "@Трещина", seed: 4}
            - {<<: *title, text: "ТРЕЩИНА", at: "@Трещина-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: x_miller
        start: "@ложится-0.22"
        transition: {type: cut}
        ambience: [{sound: wind, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 560, y: 1060}, {t: end, z: 1.2, x: 540, y: 1040}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 23, par: 0, horizon: 1000, clouds: 1, seed: 11, moon: [820, 300]}
            - {actor: forest, x: 540, y: 1010, w: 2100, h: 260, hill: 40, color: "#151b26", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 995, w: 2120, h: 1000, color: ["#1a1e26", "#121418"], par: 0.3}
            - {actor: ground, x: -520, y: 1150, w: 2120, h: 900, color: ["#2e2219", "#1e1712"]}
            - {actor: light_pool, x: 300, y: 1300, r: 420, sy: 0.5, color: "#ff8a3a", a: 0.45}
            - {actor: torch, x: 260, y: 1360, len: 220, scale: 1.0, rot: 10, halo: 200}
            # the freed shadow lands under the miller's feet; he breathes in and says his name
            - {<<: *shade, x: 1100, y: 1300, h: 300, alpha: 0.9, scale: 0.8, anim: [{at: "@ложится-0.2", dur: 0.6, path: [[1100, 1100], [800, 1200], [620, 1330]], ease: out}, {at: "@ложится+0.4", dur: 0.2, opacity: 0}]}
            - {<<: *vsh, x: 600, y: 1330, scale: 1.05, look: {<<: *miller, hollow: false}, angle: 40, alpha: [{at: 0, v: 0}, {at: "@ложится+0.2", v: 0.55, dur: 0.4}], len: [{at: 0, v: 0}, {at: "@ложится+0.2", v: 1.1, dur: 0.6}]}
            - {actor: person, id: miller, x: 600, y: 1330, scale: 1.05, look: *miller, face: [{at: 0, v: neutral}, {at: "@ложится+0.4", v: surprised}, {at: "@меня", v: smile}],
               pose: [{at: 0, v: stand}, {at: "@ложится+0.4", v: {a1: [40, 120], a2: [40, 120], l1: [2, 0], l2: [2, 0]}, dur: 0.3}]}
            - {actor: person, view: side, x: 300, y: 1340, scale: 0.95, look: *marta, face: [{at: 0, v: surprised}, {at: "@меня", v: smile}], brightness: 0.85}
            - {<<: *who, target: "miller.top", x: 640, y: 680, title: "МЕЛЬНИК ЙОРГ", at: "@Старый"}
      - id: x_math
        start: "@Один-0.22"
        transition: {type: dip}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.05, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 5}
            - {actor: torch, x: 200, y: 900, len: 140, scale: 0.9, rot: 0, halo: 60, at: "@Один", enter: pop}
            - {actor: shape, kind: arrow, points: [[270, 760], [380, 760]], stroke: ink, sw: 6, at: "@факел", enter: draw}
            - {actor: star_stone, x: 540, y: 760, r: 70, crack: 0.45, at: "@факел", enter: pop}
            - {actor: shape, kind: arrow, points: [[640, 760], [750, 760]], stroke: ink, sw: 6, at: "@трещина", enter: draw}
            - {actor: cast_shadow, x: 870, y: 820, look: {age: adult, outfit: tunic, hair: short}, angle: 0, len: 0.7, color: "#1a1410", alpha: 0.85, at: "@тень", enter: pop}
            # five shadows still inside the stone
            - {actor: star_stone, x: 540, y: 1100, r: 95, drink: 0.8, at: "@теней", enter: pop}
            - {actor: stack, x: 540, y: 1100, dir: h, gap: 4, children: [
                {actor: cast_shadow, look: {age: adult, outfit: smith, hair: short}, angle: 0, len: 0.32, color: "#5a4a8a", alpha: 0.9, at: "@пять", enter: pop},
                {actor: cast_shadow, look: {age: adult, outfit: tunic, hair: short}, angle: 0, len: 0.32, color: "#5a4a8a", alpha: 0.9, at: "@пять+0.08", enter: pop},
                {actor: cast_shadow, look: {age: adult, outfit: peasant_f, hair: bun}, angle: 0, len: 0.32, color: "#5a4a8a", alpha: 0.9, at: "@пять+0.16", enter: pop},
                {actor: cast_shadow, look: {age: adult, outfit: tunic, hair: side}, angle: 0, len: 0.32, color: "#5a4a8a", alpha: 0.9, at: "@пять+0.24", enter: pop},
                {actor: cast_shadow, look: {age: adult, outfit: tunic, hair: short}, angle: 0, len: 0.32, color: "#5a4a8a", alpha: 0.9, at: "@пять+0.32", enter: pop}]}
            - {<<: *title, y: 400, text: "1 ФАКЕЛ = 1 ТЕНЬ", at: "@Один-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
            - {actor: badge, x: 540, y: 1330, title: "В КАМНЕ ЕЩЁ 5", style: solid, color: warn, size: 44, space: screen, at: "@пять", enter: pop, sfx: false}
    sfx:
      - {sound: footstep, at: "@идёт", gain: -16}
      - {sound: hiss, at: "@Пламя", gain: -14}

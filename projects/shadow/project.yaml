  # ------------------------------------------------------------------ 4. RULE — утро без тени, три заката, щит ночью
  - id: rule
    text: "Утром Марта выносит отцу воду. Он стоит на солнце, а тени под ним нет. Пап, где твоя тень? Он молчит. Без тени ещё четверо, кто трогал камень. Староста Ульрих, шестьдесят. Видел такой камень в детстве. Первый закат — молчат. Второй — путают имена. Третий — не помнят никого. А ночью Ганс до рассвета трёт старый щит. Молча."
    lines:
      - {who: marta, say: "Пап, где твоя тень?"}
      - {who: ulrich, say: "Первый закат — молчат. Второй — путают имена. Третий — не помнят никого."}
    caption_marks: {"не помнят никого": "#ffcf6a"}
    shots:
      - id: r_yard
        transition: {type: whip_x}
        ambience: [{sound: birds, gain: -18}]
        look: {grade: {contrast: 0.08}}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 560, y: 1010}, {t: "@тени", z: 1.06, x: 520, y: 1060}, {t: end, z: 1.08, x: 520, y: 1070}]}
          layers:

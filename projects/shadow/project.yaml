            - {actor: shape, kind: ellipse, x: 880, y: 1440, w: 30, h: 10, fill: "rgba(120,160,210,0.7)", at: "@молчит+0.4", enter: fade, anim: [{at: "@молчит+0.4", dur: 0.8, w: 240, h: 34}]}

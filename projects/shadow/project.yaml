  # ------------------------------------------------------------------ 5. SECOND SUNSET — чужое имя
  - id: second
    text: "Второй закат. Отец поднимает глаза от щита. Анна? Пап, это я. Марта. Анной звали маму. Остался один закат."
    lines:
      - {who: hans, say: "Анна?"}
      - {who: marta, say: "Пап, это я. Марта."}
    shots:
      - id: e_name
        captions_top: 1560
        ambience: [{sound: fire, gain: -18}]
        look: {bloom: [0.7, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.05, x: 560, y: 980}, {t: end, z: 1.18, x: 560, y: 960}]}
          layers:
            - {actor: hut_interior, floor_y: 1420, wall: "#3a2a24", timber: "#1e1612", floor: "#2e241c", window: {x: 760, y: 520, w: 220, h: 260}, light: [860, 900], light_r: 700, seed: 7}
            # low sunset light from the window on the right: both figures cast shadows on the wall to the left… only Marta does
            - {actor: light_pool, x: 860, y: 700, r: 360, color: "#ff9a4a", a: 0.55}
            - {actor: cast_shadow, x: 760, y: 1430, look: *marta, view: side, angle: 6, len: 1.25, wide: 1.2, color: "#100a08", alpha: 0.6, soft: 3, pose: [{at: 0, v: stand}, {at: "@это", v: {a1: [50, 30], a2: [10, 10]}, dur: 0.3}]}
            - {actor: anvil, x: 180, y: 1440, scale: 0.85}
            - {actor: person, id: hans, view: side, x: 380, y: 1440, scale: 1.0, look: *hans_empty, sit: 0.6, face: [{at: 0, v: neutral}, {at: "@Анна", v: smile}],
               pose: [{at: 0, v: {a1: [40, 60], a2: [50, 50], sit: 0.6}}, {at: "@глаза", v: {a1: [40, 60], a2: [50, 50], sit: 0.6, nod: -8}, dur: 0.4}, {at: "@Анна", v: {a1: [70, 10], a2: [50, 50], sit: 0.6, nod: -8}, dur: 0.4}]}
            - {actor: shield, x: 470, y: 1250, r: 90, sx: 0.8, shine: 0.8}
            - {actor: person, id: marta, view: side, flip: true, x: 760, y: 1430, scale: 0.92, look: *marta, face: [{at: 0, v: neutral}, {at: "@это", v: sad}],
               pose: [{at: 0, v: stand}, {at: "@это", v: {a1: [50, 30], a2: [10, 10]}, dur: 0.3}], anim: [{at: "@маму", dur: 0.5, x: 800, ease: out}]}
            - {<<: *tag, text: "ДЕНЬ 2 · ЗАКАТ", at: "@Второй", enter: fade}
            - {<<: *who, target: "hans.top", x: 380, y: 700, title: "ГАНС", at: "@Анна", until: "@Пап-0.1", exit: fade}
            - {<<: *who, target: "marta.top", x: 760, y: 700, title: "МАРТА", at: "@Пап"}
            - {actor: badge, x: 540, y: 470, title: "АННОЙ ЗВАЛИ МАМУ", style: outline, color: "#e8d8c0", size: 40, space: screen, at: "@Анной", enter: pop, sfx: false}
      - id: e_count
        start: "@Остался-0.22"
        transition: {type: whip_x}
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.04, y: 960}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 19.0, par: 0, sun: false, moon: false, horizon: 1060, clouds: 2, seed: 9}
            - {actor: shape, kind: circle, x: 300, y: 700, r: 70, fill: "#ffcf6a", opacity: 0.15}
            - {actor: shape, kind: circle, x: 540, y: 700, r: 70, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 30, a: 1}, opacity: [{at: 0, v: 1}, {at: "@Остался", v: 0.15, dur: 0.5}]}
            - {actor: shape, kind: circle, x: 780, y: 700, r: 70, fill: "#ffcf6a", glow: {color: "#ffb04a", r: 30, a: 1}, pulse: {freq: 1.2, amp: 0.05}}
            - {actor: forest, x: 540, y: 1080, w: 2100, h: 200, hill: 60, color: "#2a2438", seed: 4, par: 0.3}
            - {actor: ground, x: -520, y: 1060, w: 2120, h: 1000, color: ["#2a2438", "#1c1826"], par: 0.3}
            - {actor: cottage, x: 200, y: 1250, scale: 0.9, seed: 3, brightness: 0.45, lit: 0.6}

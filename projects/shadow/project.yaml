            - {actor: ground, x: -520, y: 1250, w: 2120, h: 800, color: ["#9a8262", "#7a644a"]}
            - {actor: shape, kind: path, d: "M560,1395 L760,1385 L790,1405 L600,1420 Z", fill: "rgba(26,20,16,0.55)", blur: 2.5}
            - {actor: anvil, x: 560, y: 1410, scale: 1.0}
            - {actor: person, id: hans, view: side, x: 400, y: 1420, scale: 1.0, look: *hans_empty, face: neutral, pose: stand}
            - {actor: shape, id: noshadow, kind: rect, x: 610, y: 1440, w: 420, h: 64, radius: 32, fill: "none", stroke: gold, sw: 4, dash: "12 9", at: "@тени", enter: draw, enter_dur: 0.6, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {<<: *vsh, x: 860, y: 1430, scale: 0.92, look: *marta, pose: [{at: 0, v: hold}, {at: "@молчит", v: surprised, dur: 0.25}], len: 1.2}

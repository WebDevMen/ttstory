# СЦЕНАРИЙ: «Без тени» — одна история, ~3 минуты (переписано по правилам ясности, docs/SCRIPTING.md §14.6)
# Прошлая версия — серия shadow1–3 (антипример: перегруз понятиями, нет героя-точки зрения, нет диалогов и выбора).
# Образец по ощущению (не шаблон): docs/examples/shelter14.md.
# Проверка: python3 vg.py script check shadow [--tts] · документ: python3 vg.py script render shadow
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово+0.3", "@start"/"@end" блока.
# Реплики героев написаны прямо в vo (их произносит голос героя — см. production.voices), lines отмечает, чья реплика.

version: 1

meta:
  title: "Без тени"
  topic: "Без тени: дочь кузнеца должна вернуть отцу тень до третьего заката (средневековая мистика, вымысел)"
  wishes: "Переписать «Без тени» по новым правилам: понятный сюжет, герой, диалоги, дилемма, драйв; одно видео дольше минуты, без деления на части"
  language: ru
  platforms: [tiktok, reels, shorts]
  primary_platform: tiktok
  duration: 180
  format: fiction
  genre: fiction
  style: draw
  voice: {voice: ru-RU-SvetlanaNeural, rate: "+12%", pitch: "+0Hz"}
  status: checked

brief:
  goal: "Рассказать одну понятную мистическую историю так, чтобы зритель досмотрел три минуты, понял каждое правило и захотел ответить, как поступил бы сам."
  kpi: [completion, comments, shares, follows, rewatch]
  audience:
    who: "Зрители мистики, страшилок, фэнтези и «сериалов в ленте», которые спорят в комментариях, как поступили бы сами"
    age: "16–34"
    interests: [мистика, фэнтези, средневековье, страшные истории, сериалы]
    pains: ["запутанные истории, где непонятно, кто герой и что происходит", "одинаковые зомби", "сюжет, который пересказывают, а не показывают"]
    desires: ["понятные правила мира, по которым можно «играть» самому", "живые герои, которые спорят", "поворот, который объясняет прошлое"]
    knowledge: "Знают средневековый антураж из игр и кино; ничего не знают про этот мир — всё объясняется по ходу"
  promise: "Одна история про отца и дочь: у отца пропала тень, до третьего заката он её забудет — и дочь находит, как вернуть."
  tone: "Тихая сказочная жуть и тепло: огонь кузницы против синей ночи, без крови и скримеров; живые реплики, рассказчик у костра."
  keywords: ["без тени", "тень", "средневековье", "мистика", "упавшая звезда"]
  constraints:
    - "Вымысел целиком: деревня Вельмар, люди и события придуманы; реальны только физика света и тени, металлические зеркала эпохи"
    - "Одна точка зрения — Марта: всё, что видит зритель, видит она"
    - "Два правила мира, не больше; оба проверены на людях с числом (три заката, один факел — одна тень)"
    - "Без крови, трупов и скримеров; 13+"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах: тень — место, куда не доходит свет; металлический щит, начищенный до
    блеска, — это зеркало эпохи и может направить солнечный луч; яма в лесу в полдень остаётся в тени краёв и деревьев.
    Деталь «звезды, которую вытащили из ямы» взята из истории Энзисхаймского метеорита.
  facts:
    - id: f1
      text: "Тень — тёмная область, куда свет от источника не доходит, потому что его загораживает предмет."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f2
      text: "В Средние века в Европе зеркала были в основном металлическими: полированная бронза, олово, серебро; стеклянные — редкость."
      source: "https://en.wikipedia.org/wiki/Mirror"
      confidence: high
    - id: f3
      text: "Плоское зеркало отражает свет под тем же углом, под которым он падает (закон отражения) — так солнечный «зайчик» можно направить в тень."
      source: "https://en.wikipedia.org/wiki/Specular_reflection"
      confidence: high
    - id: f4
      text: "7 ноября 1492 года у Энзисхайма упал каменный метеорит около 127 кг; жители вытащили его из ямы и откалывали куски."
      source: "https://en.wikipedia.org/wiki/Ensisheim_meteorite"
      confidence: high
  angles:
    - id: a1
      text: "Отец коснулся упавшей звезды и потерял тень; до третьего заката он забудет дочь — и только она может его вернуть"
      archetype: what_if
      paradox: "Камень, который пьёт свет, ломается от света: спасение — в том, что кажется пищей для угрозы"
      score: 9
      why: "Одна понятная ставка (отец забудет дочь), часы (три заката), личный герой, дилемма со старостой и поворот, который объясняет странное поведение отца."
    - id: a2
      text: "Немой отец три ночи полирует щит — дочь думает, что он сошёл с ума"
      archetype: unreliable
      paradox: "Безумие оказывается последним осознанным поступком"
      score: 8
      why: "Сильный эмоциональный поворот — взят внутрь угла a1 как главная улика."
    - id: a3
      text: "История глазами тени отца, запертой в камне"
      archetype: inhuman_pov
      paradox: "Тень помнит дочь, а сам отец — нет"
      score: 6
      why: "Красиво, но зрителю трудно держаться за героя без тела; теряется ясность."
    - id: a4
      text: "Деревня, где после звезды ночью тени охотятся на людей (версия 2)"
      archetype: rule_break
      score: 4
      why: "Так было в серии shadow1–3: слишком много правил и героев, зритель не понял сюжет."
  chosen_angle: a1
  insights:
    - "Ставка, понятная за секунду: «он забудет твоё имя» — страшнее любого чудовища и не требует объяснений."
    - "Правила дают цифрами: три заката, один факел — одна трещина — одна тень, в камне пять теней."
    - "Спор Марты и старосты — дилемма без правильного ответа: рискнуть всей деревней ради пятерых или сбросить их тени в колодец."
    - "Улика щита сеется трижды (ночь после ямы, вторая ночь, полдень) — поворот объясняет «безумие» отца."

story:
  logline: "Марта, дочь кузнеца, должна вернуть отцу тень до третьего заката, но староста хочет сбросить камень с тенями в колодец; не успеет — отец забудет её навсегда."
  retell: "Кузнец Ганс коснулся упавшей звезды, потерял тень и к третьему закату забудет дочь. Марта узнаёт, что камень трескается от света, и спорит со старостой, который хочет утопить его в колодце. Щит, который немой отец полировал по ночам, становится зеркалом для полуденного солнца."
  premise: "Что если упавшая звезда забирает тени — а вместе с тенью человек теряет память о близких?"
  paradox: "Камень, который пьёт свет, ломается от света: то, что кажется его пищей, — единственное оружие"
  genre: "средневековая мистика"
  world_rules:
    - id: r1
      rule: "Кто коснулся камня, теряет тень. Первый закат — молчит, второй — путает имена, третий — не помнит никого"
      test: "Ганс коснулся камня ночью: утром без тени, на первом закате молчит, на втором зовёт Марту именем умершей матери — остаётся один закат"
      shown_in: rule
      basis: f1
    - id: r2
      rule: "Камень пьёт свет, но больше, чем может выпить, не выдерживает: трескается — и отпускает тень. Один факел — одна трещина — одна тень"
      test: "Марта подносит к камню факел: пламя тянется к нему, по камню бежит трещина, и тень старого мельника возвращается к нему; в камне ещё пять теней — нужен свет сильнее пяти факелов"
      shown_in: proof
  characters:
    - id: marta
      name: "Марта"
      intro: "Марта, шестнадцать лет, дочь кузнеца. Держит отцу мехи у горна."
      role: "героиня, точка зрения"
      want: "чтобы отец вспомнил её имя"
      fear: "что отец забудет её, как забыл мать"
      look: "рыжая коса, зелёное платье"
      arc: "от «пап, не трогай» — к поступку, на который не решилась деревня"
    - id: hans
      name: "Ганс"
      intro: "Ганс, сорок пять, кузнец. Руки в саже, борода в искрах."
      role: "отец"
      want: "успеть оставить дочери выход"
      fear: "что не сможет сказать, что знает"
      look: "борода, кожаный фартук"
      arc: "первым тронул камень; немой, он три ночи готовит дочери зеркало"
    - id: ulrich
      name: "Ульрих"
      intro: "Староста Ульрих, шестьдесят. Видел такой камень в детстве."
      role: "староста, голос правил и страха"
      want: "спасти деревню, пожертвовав пятерыми"
      fear: "что камень заберёт тени у всех"
      look: "седой, красная рубаха"
      arc: "от «в колодец» — до молчаливого «рискни» у края ямы"
    - id: miller
      name: "Йорг"
      intro: "Старый Йорг, мельник."
      role: "мельник, доказательство правила 2"
      want: "вспомнить своё имя"
      fear: "не вспомнить"
      look: "седой, мучной фартук"
      arc: "пустой → первый, кому вернули тень"
  twists:
    - id: t1
      what: "Отец не сошёл с ума: он видел, как свет факела пустил трещину по камню, и три ночи полировал щит — готовил дочери зеркало"
      setup: [problem, rule, turn]
      payoff: twist
    - id: t2
      what: "Тень Марты, которая держала щит у камня, теперь отстаёт на полшага"
      setup: [climax]
      payoff: cliff
  dilemmas:
    - id: d1
      beat: dilemma
      who: marta
      question: "Рискнуть солнцем ради пятерых или сбросить камень в колодец, чтобы он не тронул остальных?"
      options: ["Солнце: вернуть тени, но если камень не треснет, а напьётся — он заберёт тени у всей деревни", "Колодец: деревня в безопасности, но отец и ещё четверо забудут своих навсегда"]
  stakes:
    - {beat: problem, level: personal}
    - {beat: rule, level: family}
    - {beat: dilemma, level: community}
    - {beat: climax, level: community}

hooks:
  variants:
    - {id: h1, type: rule_warning, vo: "Человек без тени помнит тебя три заката. Потом он забудет твоё имя.", on_screen: "3 ЗАКАТА", visual: "Кузнец на солнечном дворе, под ним нет тени; над ним три солнца-заката, одно уже погасло", score: 9, why: "Ставка и срок в первой фразе, личное «твоё имя»; картинка без тени понятна без звука."}
    - {id: h2, type: anomaly, vo: "Он стоит на солнце. А тени под ним нет.", on_screen: "ТЕНИ НЕТ", visual: "Ганс на солнце, у наковальни и ведра тени есть, у него — нет", score: 8, why: "Мгновенная аномалия, но нет срока и ставки."}
    - {id: h3, type: stakes, vo: "Через три заката отец не вспомнит, как её зовут.", on_screen: "ОН ЗАБУДЕТ ЕЁ", visual: "Марта и отец у горна; отец смотрит сквозь неё", score: 8, why: "Сильная эмоция, но без аномалии не ясно, при чём тени."}
    - {id: h4, type: speculative, vo: "После падения звезды кузнец потерял тень. А вместе с ней — имя своей дочери.", on_screen: "БЕЗ ТЕНИ", visual: "Огненный шар над лесом, затем кузнец без тени", score: 8, why: "Хорошая формула, но длиннее и медленнее h1."}
    - {id: h5, type: visual_shock, vo: "Её отец три ночи подряд полирует щит. Молча. Без тени.", on_screen: "ТРЕТЬЯ НОЧЬ", visual: "Тёмная кузница, Ганс трёт щит, огонь горна — а тени на стене нет", score: 7, why: "Загадка-улика, но спойлерит главный поворот."}
    - {id: h6, type: result_first, vo: "Тени пяти человек сидели в камне. Вернула их девочка со щитом.", on_screen: "5 ТЕНЕЙ В КАМНЕ", visual: "Луч от щита бьёт в чёрный камень, вылетают тени", score: 6, why: "Раскрывает финал."}
    - {id: h7, type: question, vo: "Что ты сделаешь, если твой отец потеряет тень?", on_screen: "ОТЕЦ БЕЗ ТЕНИ", visual: "Отец без тени", score: 6, why: "Вопрос-лекция, слабее правила с цифрой."}
    - {id: h8, type: imagine, vo: "Представь: отец смотрит на тебя и не узнаёт.", on_screen: "НЕ УЗНАЁТ", visual: "Отец смотрит сквозь Марту", score: 6, why: "«Представь» — штамп, медленный вход."}
  primary: h1
  ab: [h2, h4]

beats:
  # ------------------------------------------------------------------ 1. HOOK — правило-предупреждение
  - id: hook
    role: hook
    title: "Три заката"
    goal: "Сразу ставка и срок: человек без тени забудет твоё имя через три заката."
    vo: "Человек без тени помнит тебя три заката. Потом он забудет твоё имя."
    on_screen: "БЕЗ ТЕНИ · 3 ЗАКАТА"
    devices: [open_loop, stakes_raise, visual_proof, text_reinforcement]
    music: drone
    marks: {"три заката": "#ffcf6a"}
    accent: "#ffcf6a"
    shots:
      - id: h_sun
        visual: "Солнечный двор кузницы: каменная кузница, наковальня, ведро — у всего длинные тени вправо; кузнец Ганс стоит на солнце, а под ним пусто. Пунктир отмечает, где должна быть тень."
        actors: [sky, forge, anvil, person, cast_shadow, ground, shape]
        camera: "Медленный наезд на ноги Ганса"
        animation:
          - {at: "@start", what: "Тени предметов лежат вправо, под Гансом — пусто"}
          - {at: "@тени", what: "Пунктирный контур на месте тени"}
        graphics:
          - {at: "@тени", type: callout, text: "БЕЗ ТЕНИ"}
        sfx:
          - {at: "@start", sound: metal_ring}
          - {at: "@тени", sound: hiss}
        ambience: [birds]
        transition: cut
      - id: h_suns
        at: "@три-0.1"
        visual: "Три солнца-заката в ряд над крышами; первое гаснет; на «имя» — табличка с именем «МАРТА» трескается и рассыпается."
        actors: [sky, cottage, shape, text]
        camera: "Плавный отъезд"
        animation:
          - {at: "@три", what: "Появляются три заката, первое солнце тускнеет"}
          - {at: "@имя", what: "Имя «МАРТА» рассыпается на буквы"}
        graphics:
          - {at: "@три", type: "text slam", text: "3 ЗАКАТА"}
        sfx:
          - {at: "@три", sound: bell}
          - {at: "@имя", sound: ping}
        transition: dip

  # ------------------------------------------------------------------ 2. SETUP — кузница, герои, звезда
  - id: setup
    role: setup
    title: "Кузница Вельмара"
    goal: "Кто и где: Марта и Ганс у горна; падает звезда; Марта просит не трогать."
    vo: "Деревня Вельмар, осень. Марта, шестнадцать лет, дочь кузнеца. Держит отцу мехи у горна. Ганс, сорок пять, кузнец. Руки в саже, борода в искрах. Над лесом проносится огонь, и за мельницей вздрагивает земля. Ганс хватает факел. Сиди дома. Пап, только ничего там не трогай!"
    lines:
      - {who: hans, say: "Сиди дома."}
      - {who: marta, say: "Пап, только ничего там не трогай!"}
    scene: {when: "осень, вечер", where: "деревня Вельмар, кузница"}
    on_screen: "ЗВЕЗДА УПАЛА"
    devices: [relatability, pattern_interrupt, sound_hit, emotion]
    music: drone
    shots:
      - id: s_forge
        visual: "Вечерняя кузница изнутри: горн с огнём, на стене висит старый круглый щит; Марта (рыжая коса, зелёное платье) качает мехи. Метка «ВЕЛЬМАР · ОСЕНЬ»."
        actors: [hut_interior, forge, person, shield, particles, timetag]
        camera: "Медленный наезд на Марту"
        animation:
          - {at: "@Деревня", what: "Горн тлеет, по стене пляшет оранжевый свет"}
          - {at: "@Марта", what: "Марта качает мехи, горн вспыхивает"}
          - {at: "@мехи", what: "Сноп искр из горна"}
        graphics:
          - {at: "@Деревня", type: timetag, text: "ВЕЛЬМАР · ОСЕНЬ"}
          - {at: "@Марта", type: callout, text: "МАРТА, 16 · ДОЧЬ КУЗНЕЦА"}
        sfx:
          - {at: "@мехи", sound: whoosh}
        ambience: [fire]
        transition: whip_x
      - id: s_hans
        at: "@Ганс-0.1"
        visual: "Ганс (борода, кожаный фартук) у наковальни бьёт молотом по раскалённой полосе, искры летят в бороду."
        actors: [hut_interior, anvil, person, particles, light_pool]
        camera: "Средний план, наезд на руки"
        animation:
          - {at: "@Ганс", what: "Ганс замахивается молотом"}
          - {at: "@саже", what: "Удар — сноп искр"}
          - {at: "@искрах", what: "Второй удар, искры гаснут в бороде"}
        graphics:
          - {at: "@Ганс", type: callout, text: "ГАНС, 45 · КУЗНЕЦ"}
        sfx:
          - {at: "@саже", sound: metal_ring}
          - {at: "@искрах", sound: metal_ring}
        transition: cut
      - id: s_fall
        at: "@Над-0.1"
        visual: "Небо над лесом: огненный шар по дуге уходит за холм у мельницы, вспышка подсвечивает лес снизу."
        actors: [sky, meteor, forest, watermill, light_pool]
        camera: "Резкий поворот вверх за шаром, на «вздрагивает» — тряска"
        animation:
          - {at: "@огонь", what: "Шар летит по дуге, хвост позади"}
          - {at: "@вздрагивает", what: "Вспышка за холмом, тряска"}
        graphics:
          - {at: "@вздрагивает", type: "text slam", text: "ЗВЕЗДА УПАЛА"}
        sfx:
          - {at: "@огонь", sound: noise_sweep}
          - {at: "@вздрагивает", sound: boom}
        transition: zoom
      - id: s_door
        at: "@хватает-0.1"
        visual: "Дверь кузницы: Ганс с факелом уходит в ночь, Марта в проёме тянет руку вслед; за ним по тропе мелькают факелы соседей."
        actors: [forge, person, torch, sky, ground]
        camera: "Средний план, лёгкий наезд на Марту"
        animation:
          - {at: "@хватает", what: "Ганс поднимает факел"}
          - {at: "@Сиди", what: "Ганс оборачивается в дверях"}

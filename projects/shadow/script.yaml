review:
  scores: {hook: 9, clarity: 9, pacing: 8, novelty: 8, emotion: 9, payoff: 9, visuals: 8, cta: 9, platform: 8, accuracy: 8}
  weak_points:
    - "Три минуты — длинно для ленты: держится на часах «трёх закатов» и спорах; первые 10 секунд должны продать ставку."
    - "Два мужских голоса на одном движке (Дмитрий) различаются только высотой — подписи говорящих обязательны."
    - "Зритель может спросить, почему солнце не «накормило» камень: ответ в правиле 2 — больше, чем может выпить, не выдерживает."
  improvements:
    - "Вместо серии из трёх частей по 60 с — одна история на ~3 минуты: сцены, споры и улика помещаются без спешки."
    - "Одна героиня-точка зрения (Марта) и три названных героя вместо пяти; два правила мира вместо пяти."
    - "Правила даны цифрами и проверены на людях: три заката на Гансе, один факел — одна тень на мельнике."
    - "Появились реплики и спор у колодца — дилемма, по которой зритель голосует в комментариях."
    - "Поворот со щитом посеян трижды (белая нитка, ночная полировка, сияющий щит) и объясняет «безумие» отца."

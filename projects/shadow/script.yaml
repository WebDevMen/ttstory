    lines:
      - {who: miller, say: "Меня зовут Йорг."}
    scene: {when: "вторая ночь", where: "воронка"}
    on_screen: "1 ФАКЕЛ = 1 ТЕНЬ"
    devices: [visual_proof, mini_payoff, contrast, number_reveal]

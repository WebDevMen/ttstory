  # ------------------------------------------------------------------ 7. DILEMMA — спор у колодца
  - id: dilemma
    role: escalation
    title: "Колодец или солнце"
    goal: "Дилемма: Ульрих хочет сбросить камень в колодец, Марта — разбить солнцем. У каждого своя правда."
    vo: "Утро третьего дня. Сход у колодца. Сбросим камень в колодец. Тридцать локтей — и никто его больше не тронет. Там тень моего отца! Сбросишь — он меня не вспомнит. Один факел — одна тень. Где ты возьмёшь пять? Возьму солнце. А если солнце его не разобьёт, а накормит? Тогда он заберёт тени у всех. На закате — в колодец."
    lines:
      - {who: ulrich, say: "Сбросим камень в колодец. Тридцать локтей — и никто его больше не тронет."}
      - {who: marta, say: "Там тень моего отца! Сбросишь — он меня не вспомнит."}
      - {who: ulrich, say: "Один факел — одна тень. Где ты возьмёшь пять?"}
      - {who: marta, say: "Возьму солнце."}
      - {who: ulrich, say: "А если солнце его не разобьёт, а накормит?"}
      - {who: ulrich, say: "Тогда он заберёт тени у всех. На закате — в колодец."}

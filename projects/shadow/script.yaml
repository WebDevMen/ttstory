  # ------------------------------------------------------------------ 4. RULE — правило 1 проверено на Гансе (улика 2: щит)
  - id: rule
    role: rule
    title: "Три заката"
    goal: "Правило 1 с числами: утро без тени, первый закат — молчит; Ульрих называет три заката; ночью Ганс полирует щит."
    vo: "Утром Марта выносит отцу воду. Он стоит на солнце, а тени под ним нет. Пап, где твоя тень? Он молчит. Без тени ещё четверо, кто трогал камень. Староста Ульрих, шестьдесят. Видел такой камень в детстве. Первый закат — молчат. Второй — путают имена. Третий — не помнят никого. А ночью Ганс до рассвета трёт старый щит. Молча."
    lines:
      - {who: marta, say: "Пап, где твоя тень?"}
      - {who: ulrich, say: "Первый закат — молчат. Второй — путают имена. Третий — не помнят никого."}
    scene: {when: "день первый", where: "двор кузницы → площадь → кузница ночью"}
    on_screen: "1 · 2 · 3 ЗАКАТА"
    devices: [visual_proof, stakes_raise, relatability, foreshadowing]
    facts: [f1]
    music: tension
    shots:
      - id: r_yard
        visual: "Солнечный двор кузницы: Марта с ведром, Ганс у наковальни — у Марты, ведра и наковальни тени, у Ганса нет; пунктир на месте тени."
        actors: [sky, forge, anvil, person, cast_shadow, ground, shape, prop]
        camera: "Наезд с Марты на ноги Ганса"
        animation:
          - {at: "@воду", what: "Марта выходит с ведром"}
          - {at: "@тени", what: "Пунктир на пустом месте"}
          - {at: "@молчит", what: "Ведро выпадает из рук Марты"}
        graphics:
          - {at: "@тени", type: callout, text: "ТЕНИ НЕТ"}
        sfx:
          - {at: "@молчит", sound: impact}
        ambience: [birds]
        transition: whip_x
      - id: r_ulrich
        at: "@Без-0.1"
        visual: "Площадь у колодца: четверо без теней стоят молча в ряд, под ними пусто; староста Ульрих (седой, красная рубаха) подходит к Марте."
        actors: [sky, cottage, well, cobbles, person, cast_shadow, shape]
        camera: "Панорама вдоль ряда людей, остановка на Ульрихе"
        animation:
          - {at: "@четверо", what: "Под четырьмя людьми подсвечиваются пустые места"}
          - {at: "@Староста", what: "Ульрих выходит вперёд"}
          - {at: "@шестьдесят", what: "Ульрих опирается на посох"}
          - {at: "@детстве", what: "Ульрих смотрит на камень вдалеке"}
        graphics:
          - {at: "@Староста", type: callout, text: "УЛЬРИХ, 60 · СТАРОСТА"}
        sfx:
          - {at: "@Староста", sound: footstep}
        transition: cut
      - id: r_scheme
        at: "@Первый-0.1"
        visual: "Схема на пергаменте: три солнца-заката в ряд; под каждым — значок: сомкнутые губы, перепутанные имена, пустое лицо."
        actors: [parchment, shape, text]
        camera: "Медленный наезд"
        animation:
          - {at: "@Первый", what: "Первое солнце и значок «молчат»"}
          - {at: "@Второй", what: "Второе солнце и «путают имена»"}
          - {at: "@Третий", what: "Третье солнце и «не помнят никого»"}
        graphics:
          - {at: "@Первый", type: chip, text: "1 · МОЛЧАТ"}
          - {at: "@Второй", type: chip, text: "2 · ПУТАЮТ ИМЕНА"}
          - {at: "@Третий", type: chip, text: "3 · НЕ ПОМНЯТ"}
        sfx:
          - {at: "@Первый", sound: bell}
          - {at: "@Второй", sound: bell}
          - {at: "@Третий", sound: bell}
        transition: whip_x
      - id: r_night
        at: "@ночью-0.1"
        visual: "Кузница ночью: горн тлеет, Ганс трёт тряпкой круглый щит, тот всё ярче блестит; тени Ганса на стене нет — тень есть только у наковальни; Марта смотрит из двери."

  # ------------------------------------------------------------------ 6. PROOF — правило 2: свет ломает камень
  - id: proof
    role: proof
    title: "Одна трещина — одна тень"
    goal: "Марта проверяет камень светом: факел пускает трещину, тень мельника возвращается. В камне ещё пять — нужен свет сильнее."

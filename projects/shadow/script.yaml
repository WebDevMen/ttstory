          - {at: "@Солнце", what: "Лучи падают сверху на лес"}
          - {at: "@яму", what: "Камень опускают в яму"}
          - {at: "@достаёт", what: "Лучи обрываются у края ямы"}
        graphics:
          - {at: "@достаёт", type: callout, text: "СВЕТ НЕ ДОСТАЁТ"}
        sfx:
          - {at: "@достаёт", sound: hiss}
        transition: whip_x
      - id: t_shield
        at: "@кузницу-0.1"
        visual: "Кузница днём: Ганс сидит у горна без тени, в руках щит сверкает, солнечный зайчик пляшет по стене."
        actors: [hut_interior, person, shield, light_pool]
        camera: "Наезд на щит"
        animation:
          - {at: "@щит", what: "Щит вспыхивает бликом"}
          - {at: "@глаза", what: "Зайчик ослепительно бьёт в камеру"}
        graphics: []
        sfx:
          - {at: "@сияет", sound: chime}
        transition: cut

  # ------------------------------------------------------------------ 9. TWIST — отец готовил зеркало
  - id: twist
    role: twist
    title: "Зеркало"
    goal: "Поворот: отец видел белую нитку от факела и три ночи готовил дочери зеркало."
    vo: "Три ночи Марта думала, что он сошёл с ума. А он видел ту белую нитку на камне. Говорить уже не мог. Но руки помнили. Он готовил ей зеркало."
    scene: {when: "день третий, полдень", where: "кузница"}
    on_screen: "ОН ГОТОВИЛ ЗЕРКАЛО"
    devices: [twist, callback, emotion]
    music: sub
    shots:
      - id: w_flash
        visual: "Флешбэк в сепии: ночь в яме — факел Ганса касается камня, белая нитка; затем три ночи: Ганс трёт щит (три быстрых кадра)."
        actors: [star_stone, torch, human_hand, person, shield, hut_interior]
        camera: "Быстрые склейки, наезд"
        animation:
          - {at: "@Три", what: "Сепия: ночь в яме, Ганс с факелом"}
          - {at: "@сошёл", what: "Марта у двери кузницы качает головой"}
          - {at: "@нитку", what: "Повтор: белая нитка на камне"}
          - {at: "@Говорить", what: "Ганс молча смотрит на камень"}
          - {at: "@руки", what: "Руки Ганса трут щит"}
        graphics:
          - {at: "@нитку", type: chip, text: "НОЧЬ 1"}
        sfx:
          - {at: "@нитку", sound: ping}
        transition: dip
      - id: w_gift
        at: "@зеркало-0.1"
        visual: "Кузница: Ганс протягивает Марте сияющий щит; в щите отражается её лицо."
        actors: [hut_interior, person, shield, light_pool]
        camera: "Наезд на щит в руках"
        animation:
          - {at: "@зеркало", what: "Ганс протягивает щит, Марта берёт"}
        graphics:
          - {at: "@зеркало", type: "text slam", text: "ОН ГОТОВИЛ ЗЕРКАЛО"}
        sfx:
          - {at: "@зеркало", sound: chime}
        transition: zoom

  # ------------------------------------------------------------------ 10. CLIMAX — луч в камень
  - id: climax
    role: payoff
    title: "Луч"
    goal: "Развязка из правил: щит ловит солнце, луч бьёт в камень, тени возвращаются; на закате отец называет её имя."
    vo: "Марта ставит щит на край ямы и ловит солнце. Луч падает на камень. Звон. Трещина. Ещё одна. Ульрих с верёвками замирает на краю. Пять теней вырываются из камня и ложатся под ноги хозяевам. Третий закат. Отец поднимает глаза. Марта."
    lines:
      - {who: hans, say: "Марта."}
    scene: {when: "день третий, полдень → закат", where: "воронка → кузница"}
    on_screen: "ТЕНИ ВЕРНУЛИСЬ"
    devices: [mini_payoff, visual_proof, emotion, sound_hit]
    facts: [f2, f3]
    music: epic
    shots:
      - id: c_beam
        visual: "Яма в лесу: сверху солнце, Марта на краю наклоняет щит; луч от солнца → щит → камень."
        actors: [sky, forest, crater, star_stone, person, shield, shape]
        camera: "Широкий план, затем наезд по лучу на камень"
        animation:
          - {at: "@ставит", what: "Марта ставит щит на край"}
          - {at: "@ловит", what: "Щит поворачивается, вспыхивает блик"}
          - {at: "@Луч", what: "Луч рисуется от щита к камню"}
        graphics: []
        sfx:
          - {at: "@Луч", sound: noise_sweep}
        transition: zoom
      - id: c_crack
        at: "@Звон-0.1"
        visual: "Крупно: камень звенит, по нему бегут трещины; на краю ямы Ульрих с мужиками и верёвками замирает."
        actors: [star_stone, person, particles]
        camera: "Тряска на каждой трещине"
        animation:
          - {at: "@Звон", what: "Первая трещина"}
          - {at: "@Ещё", what: "Вторая трещина, камень раскалывается"}
          - {at: "@замирает", what: "Ульрих на краю опускает верёвку"}
        graphics: []
        sfx:
          - {at: "@Звон", sound: ping}
          - {at: "@Ещё", sound: boom}
        transition: cut
      - id: c_shadows
        at: "@Пять-0.1"
        visual: "Пять теней вылетают из расколотого камня и летят к людям на краю ямы; под каждым ложится тень."
        actors: [star_stone, living_shadow, person, cast_shadow, crater, forest]
        camera: "Отъезд, показать всех на краю"
        animation:
          - {at: "@вырываются", what: "Пять теней разлетаются к хозяевам"}
          - {at: "@хозяевам", what: "Под людьми ложатся тени"}
        graphics:
          - {at: "@вырываются", type: "text slam", text: "ТЕНИ ВЕРНУЛИСЬ"}
        sfx:
          - {at: "@вырываются", sound: whoosh}
        transition: dip
      - id: c_name
        at: "@Третий-0.1"
        visual: "Кузница на закате: у Ганса снова есть тень на стене, рядом с тенью Марты; он смотрит на дочь и узнаёт."
        actors: [hut_interior, person, cast_shadow, light_pool, shield]
        camera: "Медленный наезд на лица"
        animation:
          - {at: "@Третий", what: "Тень Ганса проступает на стене"}
          - {at: "@глаза", what: "Ганс поднимает глаза"}
          - {at: "@Марта#2", what: "Ганс обнимает Марту"}
        graphics: []
        sfx:
          - {at: "@Марта#2", sound: chime}
        ambience: [fire]
        transition: cut

  # ------------------------------------------------------------------ 11. CLIFF — тень Марты отстаёт
  - id: cliff
    role: cliffhanger
    title: "Полшага"
    goal: "Короткий обрыв: тень Марты, которая держала щит у камня, отстаёт на полшага."
    vo: "Вечером Марта идёт домой. Её тень отстаёт на полшага."
    scene: {when: "третий вечер", where: "улица деревни"}
    on_screen: "ОТСТАЁТ"
    devices: [cliffhanger, open_loop]
    music: drone
    shots:
      - id: z_lag
        visual: "Вечерняя улица, низкое солнце: Марта идёт, её длинная тень повторяет шаги с опозданием."
        actors: [sky, cottage, cobbles, person, cast_shadow]
        camera: "Боковой проезд за Мартой, остановка"
        animation:
          - {at: "@идёт", what: "Марта шагает"}
          - {at: "@отстаёт", what: "Тень делает шаг позже"}
        graphics: []
        sfx:
          - {at: "@отстаёт", sound: creature, note: "тихий шорох"}
        transition: dip

  # ------------------------------------------------------------------ 12. CTA — вопрос по дилемме
  - id: cta
    role: cta
    title: "Солнце или колодец"
    goal: "Вопрос-выбор зрителю по дилемме Марты и Ульриха."
    vo: "А ты бы рискнул солнцем — или сбросил камень в колодец? Пиши: солнце или колодец."
    on_screen: "СОЛНЦЕ ИЛИ КОЛОДЕЦ?"
    devices: [comment_bait, direct_address]
    music: drone
    shots:
      - id: q_choice
        visual: "Две карточки: «СОЛНЦЕ» (щит и луч) и «КОЛОДЕЦ» (колодец и верёвка); над ними чёрный камень с трещиной."
        actors: [parchment, shield, well, star_stone, text]
        camera: "Медленный наезд"
        animation:
          - {at: "@рискнул", what: "Две карточки выезжают с краёв"}
          - {at: "@солнцем", what: "Карточка «СОЛНЦЕ» подсвечивается"}
          - {at: "@колодец", what: "Карточка «КОЛОДЕЦ» подсвечивается"}
          - {at: "@Пиши", what: "Обе карточки пульсируют"}
          - {at: "@колодец#2", what: "Камень между карточками вздрагивает"}
        graphics:
          - {at: "@Пиши", type: "text slam", text: "СОЛНЦЕ ИЛИ КОЛОДЕЦ?"}
        sfx:
          - {at: "@Пиши", sound: blip}
        transition: cut

loops:
  - {id: l1, question: "Почему три заката и что будет потом?", open: hook, close: rule}
  - {id: l2, question: "Что значит белая нитка на камне и зачем отец полирует щит?", open: problem, close: twist}
  - {id: l3, question: "Разобьёт солнце камень или накормит его?", open: dilemma, close: climax}


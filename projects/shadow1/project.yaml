# «Без тени», часть 1/3 — «Звезда». 100% code-drawn (method draw) from projects/shadow1/script.yaml
# (skill write-script → vg.py script project → this file). Series plan: projects/shadow1/series.md.
# Actors: library medieval.js (cottage, chapel, well, watermill, forge, anvil, cobbles, forest, hut_interior, crater,
# star_stone, meteor, smoke, fire, light_pool, candle, torch, astrolabe, book, parchment, cast_shadow, living_shadow)
# + person with medieval outfits. Coordinates: screen px 1080x1920. Times: "@word".
#
# Depth (docs/DRAW.md §10.6): every background plane stands on its own ground strip with the same par; light comes
# from ONE side per shot (morning sun from the left → shadows fall to the right; candle in front → shadow on the wall).

title: "Без тени. Часть 1: Звезда"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+14%", pitch: "+0Hz", tail: 1.4}

theme:
  preset: minimal
  accent: "#ffcf6a"
  captions:
    style: clean
    top: 1480
    size: 62
    max_chars: 20
    hide:
      - {from: "@cliff/Сама-0.1", until: "@cliff.end"}
      - {from: "@cta.start", until: "@cta/Ответ-0.1"}

post: {vignette: 0.34, chromatic: 0, grain: 0.03}

draw:
  palette: {gold: "#ffcf6a", ink: "#3a2416", night: "#0b1022", warn: "#e0553a", shade: "#120d0c"}

# ------------------------------------------------------------------ shared pieces
x-title: &title {actor: text, x: 540, y: 420, size: 100, width: 980, lines: 2, color: "#ffffff", stroke: {w: 10, color: "#120d0c"}, shadow: "0 0 34px rgba(255,190,90,.55)", space: screen}
x-tag: &tag {actor: timetag, x: 540, y: 200, size: 36, color: gold, space: screen}

x-look-marta: &marta {age: student, outfit: dress, hair: braid, hair_color: "#b8481e", skin: light}
x-look-hans: &hans {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true, skin: mid}
x-look-anselm: &anselm {age: adult, outfit: robe, hair: tonsure, hair_color: "#6a5a48", glasses: true, skin: light}
x-look-tomas: &tomas {age: kid, outfit: tunic, hair: short, hair_color: "#e2c070", color: "#7a8a5a", skin: light}

# morning village square (hook, cta): far forest hill → chapel + small houses → main houses, well, cobbles
x-sky-morning: &sky_morning {actor: sky, x: -200, w: 1480, hour: 7.3, par: 0, sun: [190, 860], horizon: 930, clouds: 3, seed: 4}
x-sky-night: &sky_night {actor: sky, x: -200, w: 1480, hour: 22.5, par: 0, moon: [820, 300], horizon: 930, clouds: 2, seed: 4}
x-forest-far: &forest_far {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#7c8a8a", seed: 3, par: 0.2}
x-ground-far: &ground_far {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#8d9474", "#717858"], par: 0.2}
x-haze: &haze {actor: shape, kind: rect, x: 540, y: 905, w: 2100, h: 200, par: 0.25, fill: {linear: ["rgba(255,230,200,0)", "rgba(255,226,190,0.5)", "rgba(255,230,200,0)"], angle: 180}}
x-ground-mid: &ground_mid {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#9a9070", "#7a7258"], par: 0.45}
x-cobbles: &cobbles {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#7a7064"}

x-square-day: &square_day
  - *sky_morning
  - {actor: smoke, x: 300, y: 905, w: 120, h: 520, color: "#9a8f88", n: 10, blur: 9, speed: 20, drift: 0.2, alpha: 0.5, seed: 5, par: 0.2}
  - *forest_far
  - *ground_far
  - *haze
  - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
  - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
  - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
  - *ground_mid
  - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
  - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
  - *cobbles
  - {actor: well, x: 540, y: 1110, scale: 0.72}

x-v-shadow: &vsh {actor: cast_shadow, angle: 128, len: 1.0, flat: 0.42, alpha: 0.5, color: "#1a1410", soft: 2.5}

audio:
  music:
    key: D
    mode: minor
    bpm: 84
    gain: -15
    sections:
      - {at: 0, style: drone, chords: [Dm, Bb, F, A]}
      - {at: "@problem.start", style: tension}
      - {at: "@rule.start", style: pulse, chords: [Dm, Bb, Gm, A]}
      - {at: "@loss.start", style: dark}
      - {at: "@cliff.start", style: silence}
      - {at: "@cta.start", style: drone, chords: [Dm, Bb, F, A]}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ 1. HOOK — у них нет теней
  - id: hook
    accent: "#ffcf6a"
    text: "После падения звезды полдеревни осталось без тени. Ночью тени вернулись — за остальными."
    caption_marks: {"без тени": "#ffcf6a"}
    shots:
      - id: h_square
        ambience: [{sound: birds, gain: -20}, {sound: wind, gain: -22}]
        look: {grade: {contrast: 0.06, sat: 1.05}}
        draw:
          camera: {keys: [{t: 0, z: 1.08, y: 1040}, {t: end, z: 1.15, y: 1080}]}
          layers:
            - *sky_morning
            # the star's smoke trail fading over the forest
            - {actor: shape, kind: line, points: [[1180, 120], [330, 860]], stroke: "rgba(210,200,190,0.55)", sw: 14, par: 0.1, blur: 6, opacity: [{at: 0, v: 1}, {at: "@падения", v: 0, dur: 1.4}]}
            - {actor: smoke, x: 300, y: 905, w: 140, h: 560, color: "#9a8f88", n: 10, blur: 9, speed: 20, drift: 0.25, alpha: 0.55, seed: 5, par: 0.2}
            - *forest_far
            - *ground_far
            - *haze
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - *ground_mid
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - *cobbles
            - {actor: well, x: 540, y: 1110, scale: 0.72}
            # Marta walks behind the well — her shadow repeats every step 0.3 s late (easter egg, solved in part 3)
            - {<<: *vsh, x: 330, y: 1130, scale: 0.7, view: side, look: *marta, walk: 1.5, lag: 0.3, anim: [{at: 0, dur: 3.1, x: 470, ease: linear}]}
            - {actor: person, id: marta, x: 330, y: 1130, scale: 0.7, view: side, look: *marta, walk: 1.5, face: neutral, anim: [{at: 0, dur: 3.1, x: 470, ease: linear}]}
            # villagers: shadows of three of them shrink to the feet and vanish
            - {<<: *vsh, x: 130, y: 1270, scale: 0.92, look: {age: adult, outfit: peasant_f, hair: bun}}
            - {<<: *vsh, x: 300, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: short}, len: [{at: 0, v: 1.0}, {at: "@падения", v: 0, dur: 0.6}], alpha: [{at: 0, v: 0.5}, {at: "@падения", v: 0, dur: 0.6}]}
            - {<<: *vsh, x: 470, y: 1268, scale: 0.92, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}}
            - {<<: *vsh, x: 650, y: 1275, scale: 0.94, look: {age: adult, outfit: peasant_f, hair: long, color: "#5a6a8a"}, len: [{at: 0, v: 1.0}, {at: "@падения+0.25", v: 0, dur: 0.6}], alpha: [{at: 0, v: 0.5}, {at: "@падения+0.25", v: 0, dur: 0.6}]}
            - {<<: *vsh, x: 820, y: 1270, scale: 0.95, look: {age: adult, outfit: tunic, hair: short, beard: true}, len: [{at: 0, v: 1.0}, {at: "@падения+0.5", v: 0, dur: 0.6}], alpha: [{at: 0, v: 0.5}, {at: "@падения+0.5", v: 0, dur: 0.6}]}
            - {actor: person, x: 130, y: 1270, scale: 0.92, look: {age: adult, outfit: peasant_f, hair: bun}, face: neutral}
            - {actor: person, x: 300, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: short}, face: [{at: 0, v: neutral}, {at: "@тени", v: surprised}]}
            - {actor: person, x: 470, y: 1268, scale: 0.92, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}, face: neutral}
            - {actor: person, x: 650, y: 1275, scale: 0.94, look: {age: adult, outfit: peasant_f, hair: long, color: "#5a6a8a"}, face: [{at: 0, v: neutral}, {at: "@тени", v: sad}]}
            - {actor: person, x: 820, y: 1270, scale: 0.95, look: {age: adult, outfit: tunic, hair: short, beard: true}, face: neutral}
            # empty places where a shadow should be
            - {actor: shape, kind: ellipse, x: 300, y: 1275, w: 170, h: 44, fill: "none", stroke: gold, sw: 4, dash: "10 8", at: "@тени", enter: grow, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {actor: shape, kind: ellipse, x: 650, y: 1275, w: 170, h: 44, fill: "none", stroke: gold, sw: 4, dash: "10 8", at: "@тени+0.12", enter: grow, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {actor: shape, kind: ellipse, x: 820, y: 1270, w: 170, h: 44, fill: "none", stroke: gold, sw: 4, dash: "10 8", at: "@тени+0.24", enter: grow, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {actor: particles, kind: dust, region: [0, 300, 1080, 1300], count: 26, colors: ["#fff1d0"], alpha: 0.5, seed: 3}
            - {<<: *tag, text: "ЧАСТЬ 1/3 · ЗВЕЗДА", at: 0.05, enter: fade}
            - {<<: *title, text: "У НИХ НЕТ ТЕНЕЙ", at: "@тени-0.05", reveal: {by: word, mode: slam, stagger: 0.18}}
      - id: h_night
        start: "@Ночью-0.22"
        transition: {type: dip}
        ambience: [{sound: wind, gain: -18}]
        look: {grade: {contrast: 0.1}}
        draw:
          camera: {keys: [{t: 0, z: 1.04, x: 520, y: 1000}, {t: end, z: 1.1, x: 640, y: 1010}]}
          layers:
            - *sky_night
            - {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#1e2a3c", seed: 3, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#1a2236", "#141a2a"], par: 0.2}
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45, lit: 0.8, brightness: 0.7}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45, lit: 0.5, brightness: 0.7}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45, lit: 1, brightness: 0.7}
            - {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#20283a", "#181e2c"], par: 0.45}
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3, brightness: 0.75, lit: [{at: 0, v: 0}, {at: "@Ночью+0.2", v: 1, dur: 0.5}]}
            - {actor: cottage, id: home, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false, brightness: 0.75, lit: [{at: 0, v: 0}, {at: "@Ночью+0.4", v: 1, dur: 0.5}]}
            - {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#3a3c4a"}
            - {actor: light_pool, x: 960, y: 1090, r: 260, sy: 0.35, color: "#ffb04a", a: 0.45, k: [{at: 0, v: 0}, {at: "@Ночью+0.4", v: 1, dur: 0.5}]}
            - {actor: well, x: 540, y: 1110, scale: 0.72, brightness: 0.7}
            # a shadow without an owner peels off the left house and glides to the lit window
            - {actor: light_pool, x: 420, y: 1150, r: 380, sy: 0.4, color: "#8aa0d0", a: 0.35}
            - {actor: living_shadow, x: 230, y: 1120, h: 420, glow: {color: "#9a8cff", r: 10, a: 0.45}, alpha: [{at: 0, v: 0.35}, {at: "@остальными-0.6", v: 0.95, dur: 0.4}], sx: [{at: 0, v: 0.6}, {at: "@остальными-0.6", v: 1, dur: 0.4}], reach: [{at: 0, v: 0}, {at: "@остальными", v: 1, dur: 0.6}], lean: 8,
               anim: [{at: "@остальными-0.3", dur: 1.6, x: 700, ease: inOut}]}
            - {actor: particles, kind: dust, region: [0, 300, 1080, 1300], count: 18, colors: ["#9fb0d0"], alpha: 0.35, seed: 6}

    sfx:
      - {sound: bell, at: "@hook.start", gain: -16}
      - {sound: hiss, at: "@падения", gain: -14}
      - {sound: impact, at: "@тени", gain: -12}
      - {sound: whoosh, at: "@Ночью", gain: -14}
      - {sound: creature, at: "@остальными", gain: -12}

  # ------------------------------------------------------------------ 2. CONTEXT — звезда за мельницей
  - id: context
    text: "Осень. Над лесом пронёсся огонь, и за мельницей дрогнула земля. Мужчины схватили факелы. Марта просила отца остаться."
    shots:
      - id: c_village
        transition: {type: whip_x}
        ambience: [{sound: stream, gain: -18}, {sound: wind, gain: -22}]
        draw:
          world: [1800, 1920]
          camera: {keys: [{t: 0, x: 700, y: 980, z: 1.0}, {t: end, x: 1060, y: 980, z: 1.02}]}
          layers:
            - {actor: sky, x: -200, w: 2200, hour: 18.1, par: 0, sun: [300, 980], horizon: 1000, clouds: 4, seed: 7}
            - {actor: forest, x: 900, y: 1010, w: 2600, h: 170, hill: 150, color: "#6a5878", seed: 5, par: 0.25}
            - {actor: ground, x: -500, y: 995, w: 2800, h: 1000, color: ["#6a5a6a", "#4a4050"], par: 0.25}
            - {actor: shape, kind: rect, x: 900, y: 1010, w: 2800, h: 220, par: 0.3, fill: {linear: ["rgba(255,170,140,0)", "rgba(255,170,140,0.45)", "rgba(255,170,140,0)"], angle: 180}}
            - {actor: smoke, x: 330, y: 960, w: 90, h: 420, color: "#b8a8b0", n: 9, blur: 7, speed: 25, drift: 0.3, alpha: 0.5, seed: 1, par: 0.55}
            - {actor: smoke, x: 790, y: 960, w: 90, h: 420, color: "#b8a8b0", n: 9, blur: 7, speed: 25, drift: 0.3, alpha: 0.5, seed: 2, par: 0.55}
            - {actor: cottage, x: 240, y: 1120, scale: 0.55, seed: 21, par: 0.55, lit: 0.6}
            - {actor: cottage, x: 520, y: 1120, scale: 0.5, seed: 22, floors: 1, par: 0.55, lit: 0.4}
            - {actor: cottage, x: 760, y: 1120, scale: 0.56, seed: 23, par: 0.55, lit: 0.7}
            - {actor: chapel, x: 1020, y: 1120, scale: 0.5, par: 0.55, lit: 0.5}
            - {actor: ground, x: -500, y: 1105, w: 2800, h: 900, color: ["#7a6a58", "#5a4c40"], par: 0.55}
            - {actor: tree, kind: round, h: 300, x: 1380, y: 1130, color: "#c8742a", par: 0.55, seed: 4}
            - {actor: watermill, x: 1180, y: 1330, scale: 0.95, speed: 40, lit: 0.8}
            - {actor: ground, x: -500, y: 1300, w: 2800, h: 120, color: ["#6a5a44", "#5a4a38"]}
            - {actor: shape, kind: rect, x: -500, y: 1330, w: 2800, h: 110, origin: top-left, fill: {linear: ["#5a6a8a", "#3a4a6a"], angle: 180}}
            - {actor: particles, kind: sparkles, region: [500, 1340, 1700, 1430], count: 22, size: [4, 9], colors: ["#ffd9a0", "#ffffff"], alpha: 0.7, seed: 3}
            - {actor: ground, x: -500, y: 1420, w: 2800, h: 600, color: ["#5a4a38", "#3a3026"]}
            - {actor: particles, kind: leaves, region: [0, 300, 1800, 1700], count: 26, speed: 0.5, seed: 4}
            - {<<: *tag, text: "ВЕЛЬМАР · ОСЕНЬ", at: 0.1, enter: wipe_right, enter_dur: 0.6}
      - id: c_fall
        start: "@пронёсся-0.3"
        transition: {type: zoom}
        captions_top: 1250
        look: {bloom: [0.7, 0.35]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: "@дрогнула", z: 1.05, y: 960}, {t: end, z: 1.07, y: 970}], shakes: [{at: "@дрогнула", amp: 16, dur: 0.6}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 19.3, par: 0, horizon: 1150, clouds: 2, seed: 9, sun: false, moon: false}
            - {actor: light_pool, x: 400, y: 960, r: 640, sy: 0.6, color: "#ff8a3a", a: 0.9, par: 0.2, k: [{at: "@пронёсся-0.3", v: 0}, {at: "@дрогнула", v: 1, dur: 0.15}, {at: "@дрогнула+0.5", v: 0.45, dur: 1.2}]}
            - {actor: forest, x: 540, y: 1300, w: 2000, h: 230, hill: 210, color: "#1f2238", seed: 8, par: 0.3}
            - {actor: ground, x: -500, y: 1280, w: 2100, h: 800, color: ["#1f2238", "#15172a"], par: 0.3}
            - {actor: meteor, x: 1180, y: 60, len: 560, angle: 216, r: 28, until: "@дрогнула", anim: [{at: "@пронёсся-0.3", dur: 1.75, x: 400, y: 1120, ease: in}]}
            - {actor: watermill, x: 820, y: 1720, scale: 0.9, speed: 30, lit: 0.9, brightness: 0.35, par: 0.7}
            - {actor: ground, x: -500, y: 1700, w: 2100, h: 400, color: ["#1a1a26", "#0e0e16"], par: 0.7}
            - {actor: particles, kind: embers, region: [200, 900, 700, 1300], count: 30, at: "@дрогнула", seed: 5}
            - {<<: *title, text: "ЗВЕЗДА УПАЛА В ЛЕС", at: "@дрогнула-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: c_run
        start: "@Мужчины-0.22"
        transition: {type: whip_x}
        ambience: [{sound: fire, gain: -20}]
        draw:
          world: [2600, 1920]
          camera: {keys: [{t: 0, x: 560, y: 1000, z: 1.0}, {t: end, x: 1500, y: 1000, z: 1.0}], sway: {x: 4, y: 6, freq: 2.2}}
          layers:
            - {actor: sky, x: -200, w: 3000, hour: 21.5, par: 0, horizon: 1100, clouds: 2, seed: 2}
            - {actor: light_pool, x: 2300, y: 1100, r: 700, sy: 0.5, color: "#ff8a3a", a: 0.65, par: 0.3}
            - {actor: forest, x: 1300, y: 1120, w: 3800, h: 300, hill: 60, color: "#141a24", seed: 6, par: 0.3}
            - {actor: ground, x: -600, y: 1100, w: 4000, h: 900, color: ["#141a24", "#0e1219"], par: 0.3}
            - {actor: tree, kind: pine, h: 520, x: 300, y: 1230, color: "#1a2430", par: 0.6, seed: 1}
            - {actor: tree, kind: pine, h: 600, x: 900, y: 1230, color: "#1a2430", par: 0.6, seed: 2}
            - {actor: tree, kind: pine, h: 480, x: 1500, y: 1230, color: "#1a2430", par: 0.6, seed: 3}
            - {actor: tree, kind: pine, h: 640, x: 2100, y: 1230, color: "#1a2430", par: 0.6, seed: 4}
            - {actor: ground, x: -600, y: 1215, w: 4000, h: 900, color: ["#1c2028", "#12151b"], par: 0.6}
            - {actor: ground, x: -600, y: 1330, w: 4000, h: 700, color: ["#2a2420", "#1a1612"]}
            - {actor: person, view: side, x: 520, y: 1340, scale: 0.85, look: {age: adult, outfit: tunic, hair: short, color: "#5a4a3a"}, run: true, walk: 2.4, hold: torch, hold_rot: 140, pose: {a1: [10, 20], a2: [70, 70], l1: [0, 0], l2: [0, 0]}, glow: {color: "#ff9a3a", r: 18, a: 0.5}, anim: [{at: "@Мужчины-0.22", dur: 2.4, x: 1420, ease: linear}]}
            - {actor: person, view: side, x: 320, y: 1350, scale: 0.86, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a4a", beard: true}, run: true, walk: 2.5, hold: torch, hold_rot: 140, pose: {a1: [10, 20], a2: [70, 70], l1: [0, 0], l2: [0, 0]}, glow: {color: "#ff9a3a", r: 18, a: 0.5}, anim: [{at: "@Мужчины-0.22", dur: 2.4, x: 1230, ease: linear}]}
            - {actor: person, id: hans_run, view: side, x: 760, y: 1345, scale: 0.92, look: *hans, run: true, walk: 2.4, hold: torch, hold_rot: 140, pose: {a1: [10, 20], a2: [70, 70], l1: [0, 0], l2: [0, 0]}, glow: {color: "#ff9a3a", r: 18, a: 0.5}, anim: [{at: "@Мужчины-0.22", dur: 2.4, x: 1700, ease: linear}]}
            - {actor: tree, kind: pine, h: 900, x: 700, y: 1980, color: "#0a0d12", par: 1.25, seed: 7}
            - {actor: tree, kind: pine, h: 860, x: 1650, y: 1990, color: "#0a0d12", par: 1.25, seed: 8}
            - {actor: particles, kind: embers, region: [300, 900, 2000, 1400], count: 30, seed: 2}

      - id: c_marta
        start: "@Марта-0.22"
        transition: {type: whip_x}
        ambience: [{sound: fire, gain: -22}, {sound: wind, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, x: 600, y: 1000}, {t: end, z: 1.16, x: 640, y: 1010}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 21.5, par: 0, moon: false, horizon: 1000, clouds: 2, seed: 2}

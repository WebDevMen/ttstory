        captions_top: 1520
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.08, y: 1000}]}
          layers:
            - {actor: hut_interior, floor_y: 1340, wall: "#4a4640", timber: "#241a14", floor: "#3a2e24", window: {x: 120, y: 420, w: 220, h: 260}, light: [860, 1120], light_r: 640, seed: 4}
            - {actor: stars, region: [120, 420, 340, 680], count: 12, size: 2}
            - {actor: person, id: monk, x: 520, y: 1330, scale: 1.0, look: *anselm, pose: [{at: 0, v: {a1: [24, 120], a2: [30, 110], l1: [2, 0], l2: [2, 0], nod: 14}}, {at: "@Монах", v: {a1: [24, 120], a2: [30, 110], l1: [2, 0], l2: [2, 0], nod: 0}, dur: 0.4}], hold: quill, hold_rot: 200,
               face: [{at: 0, v: neutral}, {at: "@Монах", v: surprised}, {at: "@понял", v: determined}]}
            - {actor: shape, kind: rect, x: 540, y: 1250, w: 1000, h: 46, fill: "#4a3020"}
            - {actor: shape, kind: rect, x: 540, y: 1400, w: 960, h: 260, fill: {linear: ["#3a2618", "#24180f"], angle: 180}}
            - {actor: book, x: 480, y: 1200, w: 320, write: [{at: 0, v: 0.3}, {at: "@правило", v: 1, dur: 0.9, ease: linear}]}
            - {actor: astrolabe, x: 210, y: 1150, r: 80, spin_speed: 8}
            - {actor: candle, x: 860, y: 1250, scale: 1.1, halo: 240}
            - {actor: callout, target: "monk.top", x: 540, y: 520, title: "БРАТ АНСЕЛЬМ · ЗВЕЗДОЧЁТ", color: gold, size: 40, space: screen, at: "@Монах+0.1", enter: pop, sfx: false}
      - id: r_diagram
        start: "@Чужая-0.22"
        transition: {type: zoom}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: "@Свеча", z: 1.04, y: 920}, {t: end, z: 1.06, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 880, w: 1010, h: 1180, seed: 5}
            # the wall and the floor of the diagram
            - {actor: shape, kind: line, points: [[90, 1140], [990, 1140]], stroke: ink, sw: 4, opacity: 0.6}
            # the person's shadow on the wall: candle low in front → the shadow grows tall behind
            - {actor: cast_shadow, id: wallsh, x: 560, y: 1140, look: {age: adult, outfit: tunic, hair: short}, angle: 6, len: [{at: "@Чужая-0.22", v: 1.25}, {at: "@Свеча", v: 1.75, dur: 1.0}], wide: [{at: "@Чужая-0.22", v: 1.15}, {at: "@Свеча", v: 1.4, dur: 1.0}], color: "#2a1a10", alpha: 0.6, soft: 2,
               glow: {color: "#ffcf6a", r: 18, a: 1}, glow_k: [{at: "@Чужая-0.22", v: 0}, {at: "@собственную", v: 1, dur: 0.2}, {at: "@собственную+0.5", v: 0, dur: 0.4}, {at: "@дверь", v: 1, dur: 0.2}]}
            - {actor: person, x: 520, y: 1230, scale: 0.85, look: {age: adult, outfit: tunic, hair: short, silhouette: "#5a3e28"}}
            # rays: from the flame past the head to the top of the shadow
            - {actor: shape, kind: line, points: [[400, 1325], [520, 870], [610, 450]], stroke: "#a0702a", sw: 3, dash: "10 10", at: "@Свеча", enter: draw, enter_dur: 0.5}
            - {actor: candle, id: cndl, x: 400, y: 1370, scale: 0.9, anim: [{at: "@Свеча", dur: 1.0, y: 1420}]}
            # a free shadow crawls along the wall and slips into the person's shadow, as into a doorway
            - {actor: living_shadow, x: 40, y: 1140, h: 360, color: "#1a0e08", alpha: 0.85, lean: 18, reach: [{at: "@Чужая-0.22", v: 0}, {at: "@собственную-0.4", v: 1, dur: 0.4}],
               anim: [{at: "@Чужая-0.12", dur: 1.4, x: 300, ease: out}, {at: "@дверь", dur: 0.8, x: 560, scale: 0.55, opacity: 0, ease: in}]}
            - {actor: shape, kind: path, d: "M500,1140 L500,880 Q560,800 620,880 L620,1140", fill: "none", stroke: gold, sw: 6, at: "@дверь-0.05", enter: draw, enter_dur: 0.5, glow: {color: "#ffcf6a", r: 16, a: 1}}
            - {actor: callout, target: "cndl.flame", x: 540, y: 1290, title: "НИЗКИЙ СВЕТ = ДЛИННАЯ ТЕНЬ", color: "#a0702a", size: 34, space: screen, at: "@Свеча+0.2", enter: pop, sfx: false}
            - {<<: *title, y: 380, size: 88, text: "ТВОЯ ТЕНЬ — ЭТО ДВЕРЬ", at: "@дверь-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}

    sfx:
      - {sound: creature, at: "@тени", gain: -12}
      - {sound: hiss, at: "@сами", gain: -14}
      - {sound: scrape, at: "@правило", gain: -14}
      - {sound: glitch, at: "@собственную", gain: -14}
      - {sound: whoosh, at: "@Свеча", gain: -14}
      - {sound: slam, at: "@дверь", gain: -10}

  # ------------------------------------------------------------------ 6. TWIST — Томас вернулся пустым
  - id: loss
    text: "Забрали Томаса, брата Марты. Он задул свечу на вдох позже. Утром он вернулся. Тихий. Без блеска в глазах. Без тени."
    shots:
      - id: l_candle
        transition: {type: dip}
        captions_top: 1520
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 1040}, {t: end, z: 1.12, y: 1080}], shakes: [{at: "@позже", amp: 8, dur: 0.3}]}
          layers:
            - {actor: hut_interior, floor_y: 1300, wall: "#5a4634", timber: "#2e2018", floor: "#4a3628", window: {x: 780, y: 360, w: 200, h: 240}, light: [540, 1080], light_r: 620, light_k: [{at: "@loss.start", v: 1}, {at: "@задул", v: 0.08, dur: 0.25}], seed: 7}
            - {actor: stars, region: [780, 360, 980, 600], count: 10, size: 2}
            - {actor: cast_shadow, id: tsh, x: 540, y: 1300, look: *tomas, angle: 0, len: 1.55, wide: 1.45, color: "#1a120c", alpha: [{at: "@loss.start", v: 0.7}, {at: "@задул", v: 0.15, dur: 0.25}], soft: 3,
               glow: {color: "#ffcf6a", r: 20, a: 1}, glow_k: [{at: "@loss.start", v: 0}, {at: "@позже", v: 1, dur: 0.1}, {at: "@позже+0.4", v: 0, dur: 0.5}]}
            - {actor: living_shadow, x: -60, y: 1300, h: 420, color: "#100a06", alpha: 0.9, lean: 24, reach: [{at: "@loss.start", v: 0.2}, {at: "@Томаса", v: 1, dur: 0.5}],
               anim: [{at: "@loss.start+0.1", dur: 1.2, x: 300, ease: out}, {at: "@Томаса+0.2", dur: 0.9, x: 520, scale: 0.7, opacity: 0, ease: in}]}
            - {actor: person, id: tomas, x: 540, y: 1470, scale: 1.12, look: *tomas, pose: [{at: "@loss.start", v: {a1: [20, 100], a2: [20, 100], l1: [2, 0], l2: [2, 0]}}, {at: "@задул-0.2", v: {a1: [20, 100], a2: [20, 100], l1: [2, 0], l2: [2, 0], bow: 0.25}, dur: 0.2}],
               face: [{at: "@loss.start", v: smile}, {at: "@Он", v: neutral}, {at: "@задул", v: sleep}], brightness: [{at: "@loss.start", v: 1}, {at: "@задул", v: 0.3, dur: 0.25}]}
            - {actor: shape, kind: rect, x: 540, y: 1345, w: 760, h: 40, fill: "#4a3020", brightness: [{at: "@loss.start", v: 1}, {at: "@задул", v: 0.3, dur: 0.25}]}
            - {actor: shape, kind: rect, x: 540, y: 1515, w: 700, h: 300, fill: {linear: ["#3a2618", "#24180f"], angle: 180}, brightness: [{at: "@loss.start", v: 1}, {at: "@задул", v: 0.3, dur: 0.25}]}
            - {actor: candle, x: 540, y: 1335, scale: 1.0, halo: 220, on: [{at: "@loss.start", v: 1}, {at: "@задул+0.05", v: 0, dur: 0.2}]}
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1500, h: 2200, origin: top-left, fill: "#05040a", opacity: [{at: "@loss.start", v: 0}, {at: "@задул+0.05", v: 0.62, dur: 0.3}]}
            - {actor: callout, target: "tomas.top", x: 300, y: 560, title: "ТОМАС, 8 ЛЕТ", color: gold, size: 40, space: screen, at: "@Томаса+0.1", until: "@задул", enter: pop, exit: fade, sfx: false}
      - id: l_return
        start: "@Утром-0.22"
        transition: {type: dip}
        ambience: [{sound: wind, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: end, z: 1.12, x: 470, y: 1010}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 6.1, par: 0, sun: [880, 880], horizon: 930, clouds: 3, seed: 12}
            - {actor: forest, x: 540, y: 905, w: 2100, h: 170, hill: 110, color: "#3a3046", seed: 21, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#4a3e50", "#3a3040"], par: 0.2}
            - {actor: shape, kind: rect, x: 540, y: 905, w: 2100, h: 200, par: 0.25, fill: {linear: ["rgba(255,190,170,0)", "rgba(255,190,170,0.4)", "rgba(255,190,170,0)"], angle: 180}}
            - {actor: cottage, id: home, x: 740, y: 1180, scale: 0.86, seed: 8, floors: 2, thatch: false, door_at: 1, door: 0.6}
            - {actor: ground, x: -520, y: 1160, w: 2120, h: 900, color: ["#6a5a4c", "#4a3e34"]}
            # sun behind them → shadows fall toward us
            - {actor: cast_shadow, x: 770, y: 1200, scale: 0.8, look: *marta, angle: 178, len: 1.1, flat: 0.5, alpha: 0.55, color: "#1a1410"}
            - {actor: person, id: marta, x: 770, y: 1200, scale: 0.8, look: *marta, pose: together, face: sad}
            - {actor: person, view: side, x: -60, y: 1340, scale: 0.98, look: {<<: *tomas, hollow: true}, walk: 1.3, face: neutral, until: "@Тихий-0.05", anim: [{at: "@Утром-0.22", dur: 1.4, x: 360, ease: out}]}
            - {actor: person, id: tomas, x: 360, y: 1340, scale: 0.98, look: {<<: *tomas, hollow: true}, face: neutral, at: "@Тихий-0.05", enter: {type: fade, dur: 0.15},
               look_dx: [{at: "@Утром-0.22", v: 0}, {at: "@Тихий+0.2", v: -1, dur: 0.6}], pose: {a1: [4, 2], a2: [4, 2], l1: [2, 0], l2: [2, 0], tilt: -8}}
            - {actor: shape, kind: ellipse, x: 360, y: 1360, w: 220, h: 70, fill: "none", stroke: gold, sw: 4, dash: "10 8", at: "@Без-0.05", enter: grow, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {actor: particles, kind: dust, region: [0, 400, 1080, 1400], count: 18, colors: ["#ffe1d0"], alpha: 0.45, seed: 11}
            - {<<: *title, text: "ОН ВЕРНУЛСЯ ПУСТЫМ", at: "@тени-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}

    sfx:
      - {sound: creature, at: "@Томаса", gain: -14}
      - {sound: breath, at: "@задул", gain: -12}
      - {sound: slam, at: "@позже", gain: -12}
      - {sound: footstep, at: "@вернулся", gain: -14}
      - {sound: boom, at: "@тени", gain: -10}

  # ------------------------------------------------------------------ 7. PAYOFF — тень подняла руку
  - id: cliff
    text: "Вечером Марта сидела у стены. Свеча не дрожала. А её тень медленно подняла руку. Сама."
    shots:
      - id: z_wall
        captions_top: 1520
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 560, y: 1180}, {t: end, z: 1.22, x: 470, y: 1130}]}
          layers:
            - {actor: hut_interior, floor_y: 1320, wall: "#6a5440", timber: "#2e2018", floor: "#4a3628", light: [780, 1150], light_r: 700, seed: 9}
            - {actor: cast_shadow, x: 420, y: 1320, look: *marta, angle: -16, len: 1.4, wide: 1.35, color: "#1a120c", alpha: 0.72, soft: 3,
               pose: [{at: 0, v: sit}, {at: "@подняла", v: {a1: [12, 70], a2: [150, -22], l1: [4, 0], l2: [4, 0], sit: 1}, dur: 1.1, ease: inOut}]}
            - {actor: shape, kind: rect, x: 420, y: 1350, w: 360, h: 36, fill: "#5a3a22"}
            - {actor: shape, kind: rect, x: 290, y: 1420, w: 26, h: 120, fill: "#3a2416"}
            - {actor: shape, kind: rect, x: 550, y: 1420, w: 26, h: 120, fill: "#3a2416"}
            - {actor: person, id: marta, x: 420, y: 1440, scale: 1.0, look: *marta, pose: sit, face: [{at: 0, v: neutral}, {at: "@Сама", v: surprised}], look_dx: [{at: 0, v: 0.6}, {at: "@Сама", v: -1, dur: 0.3}]}
            - {actor: shape, kind: rect, x: 820, y: 1300, w: 300, h: 34, fill: "#4a3020"}
            - {actor: shape, kind: rect, x: 820, y: 1400, w: 260, h: 200, fill: {linear: ["#3a2618", "#24180f"], angle: 180}}
            - {actor: candle, x: 800, y: 1290, scale: 1.0, halo: 220}
            - {<<: *title, text: "ТЕНЬ ДВИЖЕТСЯ САМА", at: "@Сама-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}

    sfx:
      - {sound: creak, at: "@подняла", gain: -12}
      - {sound: impact, at: "@Сама", gain: -10}

  # ------------------------------------------------------------------ 8. CTA — одну свечу или ни одной?
  - id: cta
    text: "Что ты зажжёшь ночью: одну свечу или ни одной? Ответ — во второй части."
    shots:
      - id: q_choice
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#06070c"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05}]}
          layers:
            - {actor: shape, kind: rect, x: 270, y: 860, w: 540, h: 1060, fill: {radial: ["#b07a44", "#5a3a20", "#120c08"]}, opacity: [{at: 0, v: 0.15}, {at: "@одну", v: 1, dur: 0.4}]}
            - {actor: shape, kind: line, points: [[540, 420], [540, 1380]], stroke: "rgba(255,207,106,0.35)", sw: 3}
            - {actor: cast_shadow, x: 270, y: 1180, look: {age: adult, outfit: tunic, hair: short}, angle: 0, len: [{at: 0, v: 0}, {at: "@одну", v: 1.7, dur: 0.5}], wide: 1.4, color: "#000000", alpha: 0.85, soft: 3}
            - {actor: person, x: 270, y: 1240, scale: 0.75, look: {age: adult, outfit: tunic, hair: short}, brightness: [{at: 0, v: 0.1}, {at: "@одну", v: 0.9, dur: 0.4}]}
            - {actor: candle, x: 270, y: 1330, scale: 0.8, halo: 200, on: [{at: 0, v: 0}, {at: "@одну", v: 1, dur: 0.3}]}
            - {actor: living_shadow, x: 760, y: 1240, h: 420, color: "#1a1c28", alpha: [{at: 0, v: 0.25}, {at: "@ни", v: 0.5, dur: 0.6}], reach: 0.6}
            - {actor: living_shadow, x: 900, y: 1250, h: 380, color: "#1a1c28", alpha: [{at: 0, v: 0.18}, {at: "@ни", v: 0.4, dur: 0.6}], arms_up: 0.4}
            - {actor: text, x: 270, y: 1440, size: 64, color: gold, text: "ОДНУ", space: screen, at: "@одну", reveal: {by: word, mode: pop}}
            - {actor: text, x: 790, y: 1440, size: 64, color: "#9aa6c4", text: "НИ ОДНОЙ", space: screen, at: "@ни", reveal: {by: word, mode: pop}}
            - {<<: *title, text: "ОДНУ ИЛИ НИ ОДНОЙ?", size: 92, at: 0.05, reveal: {by: word, mode: rise, stagger: 0.1}}
      - id: q_loop
        start: "@Ответ-0.22"
        transition: {type: dip}
        ambience: [{sound: birds, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.02, y: 980}, {t: end, z: 1.1, y: 1010}]}
          layers:
            - *sky_morning
            - *forest_far
            - *ground_far
            - *haze
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - *ground_mid
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - *cobbles
            - {actor: well, x: 540, y: 1110, scale: 0.72}
            - {<<: *vsh, x: 200, y: 1270, scale: 0.92, look: {age: adult, outfit: peasant_f, hair: bun}}
            - {actor: person, x: 200, y: 1270, scale: 0.92, look: {age: adult, outfit: peasant_f, hair: bun}, face: neutral}
            # Marta stands still — her shadow lifts a hand and waves on its own
            - {<<: *vsh, x: 520, y: 1280, scale: 0.95, look: *marta, pose: [{at: 0, v: stand}, {at: "@части", v: wave, dur: 0.5}]}
            - {actor: person, id: marta, x: 520, y: 1280, scale: 0.95, look: *marta, face: neutral}
            - {<<: *vsh, x: 780, y: 1272, scale: 0.94, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}}
            - {actor: person, x: 780, y: 1272, scale: 0.94, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}, face: neutral}
            - {actor: particles, kind: dust, region: [0, 300, 1080, 1300], count: 22, colors: ["#fff1d0"], alpha: 0.5, seed: 13}
            - {actor: badge, x: 540, y: 420, title: "ЧАСТЬ 2 — ПРАВИЛА", style: solid, color: gold, size: 52, space: screen, at: "@второй", enter: pop, sfx: false}
    sfx:
      - {sound: pop, at: "@одну", gain: -14}
      - {sound: whoosh, at: "@ни", gain: -14}
      - {sound: bell, at: "@второй", gain: -14}
      - {sound: hiss, at: "@части", gain: -14}


brief:
  goal: "Запустить серию «Без тени»: зацепить загадкой (пропавшие тени), дать одно ясное правило мира и оборвать на повороте так, чтобы подписались ради второй части."
  kpi: [completion, follows, comments, rewatch, shares]
  audience:
    who: "Зрители, которые любят мистику, страшилки, фэнтези и «сериалы в ленте»: смотрят истории частями, спорят в комментариях, как бы выжили сами"
    age: "16–34"
    interests: [мистика, фэнтези, средневековье, страшные истории, апокалипсис, сериалы]
    pains: ["одинаковые истории про зомби", "сериалы без правил, где всё решает случай", "долгие вступления"]
    desires: ["новая жуть, которой ещё не видел", "понятные правила, по которым можно «выжить» самому", "поворот, которого не ждал"]
    knowledge: "Знают зомби-апокалипсис и средневековый антураж из игр и кино; не встречали угрозы, которая приходит через собственную тень"
  promise: "Новая, ни на что не похожая средневековая жуть: тени уходят от людей и возвращаются за остальными — и простое правило, почему одна свеча опаснее темноты."
  tone: "Тихая сказочная жуть: тёплые окна и факелы против густой синей ночи, без крови и скримеров; голос рассказчика у костра."
  keywords: ["без тени", "тени", "средневековье", "мистика", "апокалипсис"]
  constraints:
    - "Вымысел целиком: деревня Вельмар, люди и события придуманы; реальные только физика тени (свет, длина тени), колокол тушения огня и сам образ упавшей звезды-камня"
    - "Не выдавать вымысел за историю: в упаковке и на первом кадре серии — «ЧАСТЬ 1/3», в описании — «мистическая история»"
    - "Без крови, трупов и скримеров: страх через тишину, свет и движение тени; возрастная аудитория 13+"
    - "Три части равной длины (~60 с) и одной структуры: крючок → место → находка → беда → правило мира → потеря → поворот-обрыв → вопрос; каждая заканчивается обрывом и вопросом с ответом одним словом"
    - "Правила мира не меняются между частями: тень входит через твою собственную тень; свет с одной стороны = длинная тень = дверь; со всех сторон = тени нет"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах, чтобы правила мира казались логичными. Тень — место, куда не доходит свет
    от источника; при низком источнике (свеча на столе, закатное солнце) тень длинная, при свете сверху — короткая, а при
    нескольких источниках вокруг тени ослабляются и перекрываются — на этом держатся бестеневые лампы операционных. В
    средневековых городах вечером звонил колокол «покрой огонь» (couvre-feu): огонь гасили на ночь, чтобы деревянные дома не
    сгорели. Падение «небесного камня» люди видели и тогда: Энзисхаймский метеорит 1492 года повесили на цепи в церкви.
  facts:
    - id: f1
      text: "Тень — тёмная область, куда свет от источника не доходит, потому что его загораживает предмет."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f2
      text: "Длина тени зависит от высоты источника света: чем ниже источник (свеча на полу, солнце у горизонта), тем длиннее тень; у солнца — пропорционально котангенсу его высоты."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f3
      text: "Если источников света несколько, теней тоже несколько, а там, где они перекрываются, темнее всего; хирургические светильники специально гасят тени (shadow dilution)."
      source: "https://en.wikipedia.org/wiki/Surgical_lighting"
      confidence: high
    - id: f4
      text: "Слово curfew — от старофранцузского couvre-feu, «покрой огонь»: по вечернему колоколу огни и очаги полагалось закрыть, чтобы не сгорели деревянные дома."
      source: "https://en.wikipedia.org/wiki/Curfew"
      confidence: high
    - id: f5
      text: "7 ноября 1492 года у городка Энзисхайм упал каменный метеорит массой около 127 кг; жители вытащили его из ямы и начали откалывать куски, а камень потом подвесили на цепи в церкви."
      source: "https://en.wikipedia.org/wiki/Ensisheim_meteorite"
      confidence: high
    - id: f6
      text: "В Средние века в Европе зеркала были в основном металлическими (полированный металл); стеклянные — редкость."
      source: "https://en.wikipedia.org/wiki/Mirror"
      confidence: high
  angles:
    - id: a1
      text: "Тени, ушедшие от хозяев: после падения звезды у половины деревни нет теней, а ночью тени приходят за остальными — через их собственную тень"
      archetype: what_if
      paradox: "Свет защищает от тьмы — но одна свеча открывает дверь тени"
      score: 9
      why: "Свежая угроза (не зомби, но так же «заразна»), идеально рисуется силуэтами, даёт понятное правило с физикой света и сильный финал-поворот: тень героини двигается сама."
    - id: a2
      text: "Лунатики: днём люди обычные, ночью во сне строят башню у кратера"
      archetype: rule_break
      score: 7
      why: "Хорошая жуть, но меньше визуальных правил и «как это работает»; ближе к знакомым сюжетам про одержимость."
    - id: a3
      text: "Колокол из звёздного металла: кто слышит звон — каменеет"
      archetype: inheritance
      score: 7
      why: "Красивый образ, но угроза статична, нет нарастания «заражения» и меньше динамики на экране."
    - id: a4
      text: "Классическая чума с ожившими мертвецами в средневековом городе"
      archetype: what_if
      score: 4
      why: "Ровно то, чего заказчик не хочет: зомби видели все."
  chosen_angle: a1
  insights:
    - "Главная находка — правило «одна свеча опаснее темноты»: оно противоречит интуиции, легко показывается схемой и даёт спор в комментариях."
    - "Тени — идеальный материал для своей графики: силуэты, свет, длина тени от источника рисуются кодом точно и выразительно."
    - "Каждая часть должна дать новое правило мира (ч.1 — дверь через тень, ч.2 — круг огня и полдень, ч.3 — затмение и зеркала) — это «интерактив»: зритель начинает играть по правилам сам."
    - "Финал каждой части — физический поворот на экране (тень подняла руку), понятный без звука: это пересмотры и пересылки."
    - "Вопрос с ответом одним словом («одну свечу или ни одной?») раскрывается в следующей части — причина подписаться."

story:
  premise: "Что если после падения звезды тени уйдут от людей — и ночью вернутся за остальными?"
  paradox: "Свет, который всегда защищал от темноты, здесь открывает дверь: одна свеча опаснее полной тьмы"
  genre: "средневековая мистика"
  world_rules:
    - {id: r1, rule: "Чужая тень входит в человека через его собственную тень", shown_in: rule, basis: f1}
    - {id: r2, rule: "Низкий свет с одной стороны — длинная тень — открытая дверь", shown_in: rule, basis: f2}
    - {id: r4, rule: "Кого забрали, тот возвращается пустым: без тени и без бликов в глазах; пустые не нападают — они копают", shown_in: loss}
  characters:
    - {id: marta, name: "Марта", role: "героиня, дочь кузнеца, 14 лет", want: "вернуть отца и брата", fear: "что её тень тоже уйдёт", look: "рыжая коса, зелёное платье", arc: "от испуга перед своей тенью — к союзу с ней"}
    - {id: hans, name: "Ганс", role: "кузнец, отец Марты", want: "первым узнать, что упало", fear: "показаться трусом перед деревней", look: "борода, кожаный фартук", arc: "первым тронул камень — первым стал пустым"}
    - {id: tomas, name: "Томас", role: "младший брат, 8 лет", want: "чтобы ночь кончилась", fear: "темнота", look: "светлые волосы, зелёная рубаха", arc: "забран в ч.1, возвращён в ч.3"}
    - {id: anselm, name: "брат Ансельм", role: "монах-звездочёт", want: "понять правило, пока не поздно", fear: "что знание придёт слишком поздно", look: "серая ряса, тонзура, очки", arc: "голос «как это работает»"}
    - {id: godfrid, name: "сир Годфрид", role: "старый рыцарь", want: "защитить деревню силой", fear: "оказаться бесполезным", look: "кольчуга, седые усы", arc: "меч бессилен (ч.2) → держит огонь ценой тени (ч.3)"}
  twists:
    - {id: t1, what: "Томас возвращается пустым — угроза не убивает, а подменяет", setup: rule, payoff: loss}
    - {id: t2, what: "Тень Марты поднимает руку сама", setup: hook, payoff: cliff}
  stakes:
    - {beat: problem, level: personal}
    - {beat: escalation, level: community}
    - {beat: loss, level: family}
    - {beat: cliff, level: personal}
  series: {name: "Без тени", part: 1, of: 3, next: shadow2, cliff: "Тень Марты двигается сама"}

hooks:
  variants:
    - {id: h1, type: shock_fact, vo: "После падения звезды полдеревни осталось без тени.", on_screen: "У НИХ НЕТ ТЕНЕЙ", visual: "Утренняя площадь деревни на солнце: у одних людей длинные тени, у других — ни одной; тени исчезают на глазах", score: 9, why: "Невозможная, но мгновенно понятная картинка; ключевое слово в первой фразе; читается без звука."}
    - {id: h2, type: curiosity_gap, vo: "Тени ушли от своих хозяев. Ночью они вернулись — за остальными.", on_screen: "ТЕНИ ВЕРНУЛИСЬ", visual: "Силуэт-тень отлипает от стены дома и идёт по улице одна", score: 8, why: "Сильная угроза, но без контекста «звезды» непонятно, почему так."}
    - {id: h3, type: imagine, vo: "Представь: ты выходишь на солнце, а тени под тобой нет.", on_screen: "А ТЕНИ НЕТ", visual: "Человек на солнце, под ногами пусто; вокруг тени других людей", score: 8, why: "Личное «ты», но медленнее входит в историю."}
    - {id: h4, type: stakes, vo: "Одна свеча в этой деревне — открытая дверь для того, что придёт ночью.", on_screen: "ОДНА СВЕЧА — ДВЕРЬ", visual: "Свеча в окне и огромная тень человека за ним на стене", score: 7, why: "Интригует правилом, но раскрывает главную механику до того, как зритель увлёкся."}
    - {id: h5, type: question, vo: "Куда уходят тени, когда их хозяева спят?", on_screen: "КУДА УХОДЯТ ТЕНИ?", visual: "Спящая деревня, по крышам скользят тени без людей", score: 7, why: "Загадочно и красиво, но абстрактно для первой секунды."}
    - {id: h6, type: result_first, vo: "К третьей ночи в деревне осталось шесть человек с тенью.", on_screen: "ОСТАЛОСЬ 6 ТЕНЕЙ", visual: "Счётчик теней над картой деревни, огоньки гаснут", score: 7, why: "Масштаб беды сразу, но спойлерит вторую часть."}
    - {id: h7, type: visual_shock, vo: "Её тень подняла руку. А сама она не шевелилась.", on_screen: "ТЕНЬ ДВИЖЕТСЯ САМА", visual: "Девочка у стены, её тень медленно поднимает руку отдельно от неё", score: 8, why: "Мощный кадр, но это финал части — лучше как A/B для зрителей, которые любят жуть."}
    - {id: h8, type: pov, vo: "Ты в средневековой деревне, и твой сосед потерял свою тень.", on_screen: "СОСЕД БЕЗ ТЕНИ", visual: "Ты у колодца, сосед на солнце — без тени", score: 6, why: "Формула POV, но длинная первая фраза и слабее образ."}
  primary: h1
  ab: [h7, h3]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "У них нет теней"
    goal: "Остановить палец невозможной картинкой: люди на солнце без теней; открыть петлю «куда ушли тени»."
    vo: "После падения звезды полдеревни осталось без тени. Ночью деревня узнала, куда они ушли."
    on_screen: "У НИХ НЕТ ТЕНЕЙ"
    devices: [open_loop, visual_proof, text_reinforcement, pattern_interrupt, sound_hit]
    facts: [f1]
    music: drone
    marks: {"без тени": "#ffcf6a"}
    accent: "#ffcf6a"
    shots:
      - id: h_square
        visual: "Утро, площадь средневековой деревни Вельмар: фахверковые дома, каменный колодец по центру, за домами деревянная колокольня и тёмный лес на холме, низкое солнце слева. Шестеро жителей стоят на брусчатке: у троих длинные тени вправо, у троих — тени на глазах тают и исчезают. Слева у колодца проходит Марта (рыжая коса) — её тень повторяет шаг с опозданием ~0.3 с (пасхалка, разгадка в финале части 3)."
        actors: [sky, new:cottage, new:chapel, new:well, person, new:cast_shadow, ground, tree, text]
        camera: "Медленный наезд на центр площади, лёгкий подъём"
        animation:
          - {at: "@start", what: "Над лесом гаснет дымный след упавшей звезды; люди стоят, тени лежат"}
          - {at: "@падения", what: "У трёх жителей тени стягиваются к ногам и исчезают одна за другой"}
          - {at: "@тени", what: "Три пустых места под ногами подсвечиваются жёлтыми кругами"}
        graphics:
          - {at: "@start", type: chip, text: "ЧАСТЬ 1/3 · ЗВЕЗДА"}
          - {at: "@тени", type: "text slam", text: "У НИХ НЕТ ТЕНЕЙ"}
        sfx:
          - {at: "@start", sound: bell, note: "далёкий утренний колокол"}
          - {at: "@падения", sound: hiss}
          - {at: "@тени", sound: impact}
        ambience: [birds, wind]
        transition: cut
      - id: h_night
        at: "@Ночью-0.1"
        visual: "Та же площадь ночью, синяя мгла, в окнах тёплый свет; по стене дома ползёт человеческая тень без человека, вытягивается и скользит к освещённому окну."
        actors: [sky, new:cottage, new:living_shadow, stars, ground]
        camera: "Панорама вслед за тенью вправо"
        animation:
          - {at: "@Ночью", what: "Свет дня гаснет, площадь синеет, зажигаются окна"}
          - {at: "@ушли", what: "Тень без хозяина отлипает от стены и скользит к окну"}
        graphics: []
        sfx:
          - {at: "@Ночью", sound: whoosh}
          - {at: "@ушли", sound: creature, note: "тихий шорох-вдох"}
        ambience: [wind]
        transition: dip

  # ------------------------------------------------------------------ 2. CONTEXT — где и что упало
  - id: context
    role: context
    title: "Звезда за мельницей"
    goal: "Коротко: где, когда, что случилось — падение звезды и кто побежал смотреть."
    vo: "Деревня Вельмар, осень. Над лесом пролетел огонь и рухнул за мельницей. Мужчины побежали смотреть."
    on_screen: "ЗВЕЗДА УПАЛА В ЛЕС"
    devices: [pattern_interrupt, progress, sound_hit]
    music: drone
    shots:
      - id: c_village
        visual: "Вечерняя деревня сбоку: ряд фахверковых домов с соломенными крышами, мельница с водяным колесом на речке, лес на холме, сиреневое небо. Метка «ВЕЛЬМАР · ОСЕНЬ»."
        actors: [sky, new:cottage, new:watermill, tree, ground, timetag]
        camera: "Медленная панорама слева направо"
        animation:
          - {at: "@start", what: "Колесо мельницы крутится, из труб идёт дым"}
          - {at: "@осень", what: "С деревьев срываются жёлтые листья"}
        graphics:
          - {at: "@start", type: timetag, text: "ВЕЛЬМАР · ОСЕНЬ"}
        sfx:
          - {at: "@start", sound: creak, note: "колесо мельницы"}
        ambience: [stream, wind]
        transition: whip_x
      - id: c_fall
        at: "@Над-0.1"
        visual: "Небо над лесом: огненный шар с длинным хвостом проносится наискосок и уходит за холм за мельницей; вспышка подсвечивает лес снизу оранжевым."
        actors: [sky, new:meteor, tree, new:watermill, particles]
        camera: "Резкий поворот вверх за шаром, на «рухнул» — тряска"
        animation:
          - {at: "@огонь", what: "Огненный шар проносится по небу"}
          - {at: "@рухнул", what: "Вспышка за холмом, ударная волна гнёт верхушки деревьев"}
        graphics:
          - {at: "@рухнул", type: "text slam", text: "ЗВЕЗДА УПАЛА В ЛЕС"}
        sfx:
          - {at: "@огонь", sound: noise_sweep}
          - {at: "@рухнул", sound: boom}
        transition: zoom
      - id: c_run
        at: "@Мужчины-0.1"
        visual: "Тропа в лес ночью: цепочка мужчин с факелами бежит к оранжевому зареву за деревьями; впереди — широкоплечий кузнец в фартуке."
        actors: [person, new:torch, tree, ground, sky]
        camera: "Камера бежит следом, лёгкая тряска"
        animation:
          - {at: "@Мужчины", what: "Мужчины с факелами бегут по тропе к зареву"}
        graphics: []
        sfx:
          - {at: "@Мужчины", sound: footstep}
        ambience: [fire]
        transition: whip_x

  # ------------------------------------------------------------------ 3. PROBLEM — камень, который не отражает свет
  - id: problem
    role: problem
    title: "Чёрный камень"
    goal: "Находка: странный камень, который поглощает свет, — первое «нарушение правил мира»."
    vo: "Кузнец Ганс первым спустился в яму. На дне лежал чёрный камень. Тёплый, как живой. И он не отражал света факелов."
    on_screen: "КАМЕНЬ ГЛОТАЕТ СВЕТ"
    devices: [visual_proof, emotion, pattern_interrupt]
    music: tension
    shots:
      - id: p_crater
        visual: "Воронка в лесу: поваленные деревья веером, дымок, по краю стоят мужчины с факелами. Кузнец Ганс (борода, кожаный фартук) спускается по склону."
        actors: [new:crater, tree, person, new:torch, sky, particles]
        camera: "Сверху вниз в воронку, медленный наезд"
        animation:
          - {at: "@Ганс", what: "Ганс съезжает по склону воронки, из-под ног сыплется земля"}
          - {at: "@яму", what: "Дым из воронки клубится вверх"}
        graphics:
          - {at: "@Ганс", type: callout, text: "КУЗНЕЦ ГАНС"}
        sfx:
          - {at: "@Ганс", sound: scrape}
        ambience: [fire]
        transition: zoom
      - id: p_stone
        at: "@чёрный-0.1"
        visual: "Крупно: дно ямы, идеально чёрный камень-сфера размером с голову, без единого блика; вокруг — оранжевые отсветы факелов на земле, но на камне их нет. Рука Ганса тянется к нему."
        actors: [new:star_stone, hand, new:torch, particles]
        camera: "Крупный план, медленный наезд на камень"
        animation:
          - {at: "@чёрный", what: "Камень проступает из дыма — совершенно чёрный"}
          - {at: "@Тёплый", what: "От камня поднимается дрожащий жар, рука Ганса касается его"}
          - {at: "@отражал", what: "Факел подносят ближе: свет на земле ярче, а камень остаётся чёрной дырой"}
        graphics:
          - {at: "@отражал", type: "text stamp", text: "КАМЕНЬ ГЛОТАЕТ СВЕТ"}
        sfx:
          - {at: "@Тёплый", sound: heartbeat, note: "камень «живой»"}
          - {at: "@отражал", sound: hiss}
        transition: dip

  # ------------------------------------------------------------------ 4. ESCALATION — утро без теней
  - id: escalation
    role: escalation
    title: "Утро без теней"
    goal: "Беда становится явной: у всех, кто был у камня, нет теней; знакомство с героиней Мартой."
    vo: "Утром Марта, дочь кузнеца, увидела: отец стоит на солнце, а тени под ним нет. Нет её у всех, кто был у камня."
    on_screen: "ТЕНИ ПРОПАЛИ"
    devices: [stakes_raise, visual_proof, contrast, emotion]
    facts: [f1]
    music: tension
    shots:
      - id: e_marta
        visual: "Двор кузницы утром: каменная кузница с горном, наковальня; Марта (14 лет, рыжая коса, зелёное платье) выходит из дома с ведром. На солнце её длинная тень ложится вправо по земле."
        actors: [new:forge, person, new:cast_shadow, ground, sky]
        camera: "Средний план, лёгкий наезд на Марту"
        animation:
          - {at: "@Марта", what: "Марта выходит из двери, тень тянется за ней"}
        graphics:
          - {at: "@Марта", type: callout, text: "МАРТА, ДОЧЬ КУЗНЕЦА"}
        sfx:
          - {at: "@Марта", sound: creak, note: "дверь"}
        ambience: [birds]
        transition: whip_x
      - id: e_father
        at: "@отец-0.1"
        visual: "Отец Ганс стоит у наковальни на ярком солнце: у Марты, у наковальни и у ведра — тени; под Гансом — пустая освещённая земля. Ведро выпадает из рук Марты."
        actors: [new:forge, person, new:cast_shadow, new:anvil, ground]
        camera: "Наезд с Марты на ноги Ганса"
        animation:
          - {at: "@отец", what: "Ганс поднимает молот на наковальне"}
          - {at: "@тени", what: "Пунктир показывает, где должна быть тень — там пусто"}
          - {at: "@нет", what: "Ведро падает, вода растекается"}
        graphics:
          - {at: "@тени", type: callout, text: "ТЕНИ НЕТ"}
        sfx:
          - {at: "@отец", sound: metal_ring}
          - {at: "@нет", sound: impact}
        transition: zoom
      - id: e_all
        at: "@всех-0.1"
        visual: "Улица деревни сверху под углом: десятки жителей; у одних тени есть, у других (кто ходил к камню) нет; тех, что без тени, отмечают бледные кольца. Счётчик «БЕЗ ТЕНИ: 14»."
        actors: [new:cottage, person, new:cast_shadow, ground, text]
        camera: "Отъезд вверх, показать всю улицу"
        animation:
          - {at: "@всех", what: "Люди без тени по одному подсвечиваются бледными кольцами"}
          - {at: "@камня", what: "Счётчик досчитывает до четырнадцати"}
        graphics:
          - {at: "@всех", type: "text slam", text: "ТЕНИ ПРОПАЛИ"}
          - {at: "@камня", type: counter, text: "БЕЗ ТЕНИ: 14"}
        sfx:
          - {at: "@всех", sound: blip}
          - {at: "@камня", sound: kick}
        transition: dip

  # ------------------------------------------------------------------ 5. PROOF — правило мира: дверь через тень
  - id: rule
    role: proof
    title: "Правило: тень — это дверь"
    goal: "Как это работает: свободная тень входит в человека через его собственную тень; низкий свет — длинная тень — открытая дверь."
    vo: "Ночью тени пришли сами. Брат Ансельм, монах-звездочёт, понял правило. Чужая тень входит в человека через его собственную. Свеча внизу — длинная тень за спиной. А значит, открытая дверь."
    on_screen: "ТВОЯ ТЕНЬ — ЭТО ДВЕРЬ"
    devices: [mini_payoff, visual_proof, direct_address, text_reinforcement]
    facts: [f1, f2]
    music: pulse
    shots:
      - id: r_night
        visual: "Ночная улица: по стенам домов скользят чёрные тени без людей — длинные руки, нет лиц; у окон с огнём они замирают и ждут."
        actors: [sky, new:cottage, new:living_shadow, stars, ground]
        camera: "Медленная панорама вдоль улицы"
        animation:
          - {at: "@тени", what: "Три свободные тени отлипают от стены колокольни и расходятся по улице"}
          - {at: "@сами", what: "Одна тень замирает у освещённого окна"}
        graphics: []
        sfx:
          - {at: "@тени", sound: creature}
          - {at: "@сами", sound: hiss}
        ambience: [wind]
        transition: dip
      - id: r_monk
        at: "@Брат-0.1"
        visual: "Келья в колокольне: брат Ансельм (серая ряса, лысина-тонзура, очки на шнурке) у стола с астролябией и раскрытой книгой; пишет пером правило."
        actors: [person, new:astrolabe, new:candle, new:book, room]
        camera: "Наезд на монаха и книгу"
        animation:
          - {at: "@Брат", what: "Ансельм поднимает голову от книги"}
          - {at: "@правило", what: "Перо выводит строку в книге"}
        graphics:
          - {at: "@Брат", type: callout, text: "БРАТ АНСЕЛЬМ, ЗВЕЗДОЧЁТ"}
        sfx:
          - {at: "@правило", sound: scrape, note: "перо по пергаменту"}
        transition: whip_x
      - id: r_diagram
        at: "@Чужая-0.1"
        visual: "Схема на пергаменте (вид сбоку): человек, свеча на полу перед ним, от человека назад по полу и стене — длинная тень; от свечи лучи пунктиром. Свободная тень подползает и входит в тень человека, как в дверной проём."
        actors: [person, new:candle, new:cast_shadow, new:living_shadow, shape, text]
        camera: "Статичная схема с медленным наездом на тень"
        animation:
          - {at: "@Чужая", what: "Слева вползает свободная тень"}
          - {at: "@собственную", what: "Она касается тени человека — та вспыхивает контуром двери"}
          - {at: "@Свеча", what: "Свеча опускается ниже — тень человека удлиняется до стены (лучи пунктиром)"}
          - {at: "@спиной", what: "Тень ложится на стену за спиной и темнеет"}
          - {at: "@дверь", what: "Контур тени становится открытой дверью, свободная тень входит"}
        graphics:
          - {at: "@Свеча", type: callout, text: "НИЗКИЙ СВЕТ = ДЛИННАЯ ТЕНЬ"}
          - {at: "@дверь", type: "text stamp", text: "ТВОЯ ТЕНЬ — ЭТО ДВЕРЬ"}
        sfx:
          - {at: "@собственную", sound: glitch}
          - {at: "@Свеча", sound: whoosh}
          - {at: "@дверь", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 6. TWIST — первая потеря
  - id: loss
    role: twist
    title: "Томас вернулся"
    goal: "Личная потеря: младшего брата забирают и он возвращается «пустым» — новый тип угрозы, не зомби."
    vo: "Первым забрали Томаса, младшего брата Марты. Он задул свечу на миг позже. Утром он вернулся. Тихий. Без тени."
    on_screen: "ОН ВЕРНУЛСЯ ПУСТЫМ"
    devices: [twist, emotion, stakes_raise, sound_hit]
    music: dark
    shots:
      - id: l_candle
        visual: "Изба ночью: мальчик Томас (8 лет, светлые волосы) у стола, перед ним свеча; его огромная тень на стене за спиной. Из угла в его тень вползает чужая тень. Он дует на свечу."
        actors: [room, person, new:candle, new:cast_shadow, new:living_shadow]
        camera: "Наезд на стену с тенью"
        animation:
          - {at: "@Томаса", what: "Чужая тень вползает в тень мальчика на стене"}
          - {at: "@задул", what: "Томас задувает свечу — темно, вспышка контура"}
        graphics:
          - {at: "@Томаса", type: callout, text: "ТОМАС, 8 ЛЕТ"}
        sfx:
          - {at: "@задул", sound: breath}
          - {at: "@позже", sound: slam}
        transition: dip
      - id: l_return
        at: "@Утром-0.1"
        visual: "Рассвет у ворот дома: Томас стоит на пороге, бледный, глаза без бликов; солнце светит в спину — у Марты на ступенях длинная тень, у Томаса — нет. Марта замирает в дверях."
        actors: [new:cottage, person, new:cast_shadow, sky, ground]
        camera: "Медленный наезд на лицо Томаса"
        animation:
          - {at: "@вернулся", what: "Томас входит в кадр и останавливается"}
          - {at: "@Тихий", what: "Он молча поворачивает голову к лесу"}
          - {at: "@тени", what: "Пунктир под ногами: тени нет"}
        graphics:
          - {at: "@тени", type: "text stamp", text: "ОН ВЕРНУЛСЯ ПУСТЫМ"}
        sfx:
          - {at: "@вернулся", sound: footstep}
          - {at: "@тени", sound: boom}
        ambience: [wind]
        transition: dip

  # ------------------------------------------------------------------ 7. PAYOFF — обрыв: тень Марты
  - id: cliff
    role: payoff
    title: "Её тень подняла руку"
    goal: "Поворот-обрыв части: тень самой героини двигается без неё — зритель хочет вторую часть."
    vo: "А вечером Марта посмотрела на стену. Её тень подняла руку. Сама."
    on_screen: "ТЕНЬ ДВИЖЕТСЯ САМА"
    devices: [twist, open_loop, rewatch_trigger, sound_hit]
    music: silence
    shots:
      - id: z_wall
        visual: "Изба, вечер: Марта сидит на лавке спиной к стене, свеча на столе; на стене её тень. Тень медленно поднимает руку, хотя Марта неподвижна. Марта медленно поворачивает голову."
        actors: [room, person, new:candle, new:cast_shadow]
        camera: "Очень медленный наезд на стену"
        animation:
          - {at: "@стену", what: "Марта сидит, свеча трепещет"}
          - {at: "@подняла", what: "Тень поднимает руку, Марта неподвижна"}
          - {at: "@Сама", what: "Марта оборачивается; тень замирает с поднятой рукой"}
        graphics:
          - {at: "@Сама", type: "text slam", text: "ТЕНЬ ДВИЖЕТСЯ САМА"}
        sfx:
          - {at: "@подняла", sound: creak}
          - {at: "@Сама", sound: impact}
        transition: cut

  # ------------------------------------------------------------------ 8. CTA
  - id: cta
    role: cta
    title: "Одна свеча или ни одной?"
    goal: "Вопрос с ответом одним словом по правилу мира + обещание второй части; финальный кадр перекликается с первым."
    vo: "Что ты зажжёшь ночью: одну свечу или ни одной? Ответ — во второй части."
    on_screen: "ОДНУ ИЛИ НИ ОДНОЙ?"
    devices: [comment_bait, follow_trigger, direct_address, loop_ending]
    music: drone
    shots:
      - id: q_choice
        visual: "Тёмный экран: слева одна свеча и длинная тень за ней, справа полная темнота; подписи «ОДНУ» и «НИ ОДНОЙ»."
        actors: [new:candle, new:cast_shadow, text]
        camera: "Лёгкий наезд"
        animation:
          - {at: "@одну", what: "Загорается свеча слева, вырастает тень"}
          - {at: "@ни", what: "Справа гаснет последний отсвет"}
        graphics:
          - {at: "@одну", type: text, text: "ОДНУ"}
          - {at: "@ни", type: text, text: "НИ ОДНОЙ"}
        sfx:
          - {at: "@одну", sound: pop}
          - {at: "@ни", sound: whoosh}
        transition: whip_x
      - id: q_loop
        at: "@Ответ-0.1"
        visual: "Возврат к площади первого кадра на рассвете: люди с тенями и без; одна из оставшихся теней медленно поворачивает голову к зрителю; снизу плашка «ЧАСТЬ 2 — ПРАВИЛА»."
        actors: [sky, new:cottage, new:well, person, new:cast_shadow, ground, badge]
        camera: "Медленный наезд"
        animation:
          - {at: "@второй", what: "Плашка «ЧАСТЬ 2 — ПРАВИЛА» поднимается снизу"}
          - {at: "@части", what: "Тень одного жителя поворачивает голову к камере"}
        graphics:
          - {at: "@второй", type: badge, text: "ЧАСТЬ 2 — ПРАВИЛА"}
        sfx:
          - {at: "@второй", sound: bell}
          - {at: "@части", sound: hiss}
        transition: dip

loops:
  - {id: l1, question: "Куда ушли тени и что они делают ночью?", open: hook, close: rule}
  - {id: l2, question: "Что за камень упал в лес и почему у людей пропали тени?", open: problem, close: escalation}
  - {id: l3, question: "Почему тень Марты двигается сама — она следующая?", open: cliff, close: cta}

engagement:
  comment: "Что ты зажжёшь этой ночью: одну свечу или ни одной? Ответ одним словом — «одну» или «ни одной»."
  share: "Переслать другу, с которым смотрите страшилки и сериалы: «смотри, тут тени уходят от людей»."
  save: "Сохранить, чтобы не потерять серию: впереди ещё две части и правила, как выжить."
  follow: "Часть 1 из 3: ответ на вопрос про свечу и правила выживания — во второй части."
  rewatch: "В первом кадре одна из теней уже смотрит на зрителя, а на площади видна Марта — её тень чуть отстаёт от неё; финальный кадр повторяет первый."
  cta: {beat: cta, text: "Одну свечу или ни одной? Пиши ответ — разбор во второй части", type: comment}

package:
  tiktok:
    caption: "Без тени: после падения звезды тени ушли от людей — и ночью вернулись за остальными. Средневековая мистика, часть 1/3 🕯️"
    hashtags: ["#тени", "#мистика", "#средневековье", "#страшныеистории", "#апокалипсис"]
    cover: "У НИХ НЕТ ТЕНЕЙ"
    sound: "Своя музыка движка (drone → tension → pulse → dark → тишина), без трендового звука"
  reels:
    caption: "Тени уходят от хозяев и возвращаются за остальными 🕯️ «Без тени», часть 1/3. Одну свечу или ни одной — что зажжёшь ты?"
    hashtags: ["#тени", "#мистика", "#средневековье"]
    cover: "У НИХ НЕТ ТЕНЕЙ"
  shorts:
    title: "Тени ушли от людей после падения звезды — «Без тени», часть 1"
    description: "Средневековая мистическая история в трёх частях: упавшая звезда, люди без теней и правило, почему одна свеча опаснее темноты."
    hashtags: ["#тени", "#мистика"]
  first_frame: "Утренняя площадь средневековой деревни: у половины людей на солнце нет теней, плашка «ЧАСТЬ 1/3» — понятно без звука."
  posting: ["Части выходят через 1–2 дня, в одно время (19:00–22:00)", "Закрепить комментарий: «Одну свечу или ни одной? Ответ — в части 2»", "В описании: «вымышленная история»"]

production:
  theme: {preset: minimal, accent: "#ffcf6a", captions: clean}
  palette: ["#0b1022 ночь", "#1c2a4a синяя мгла", "#ffcf6a огонь и окна", "#e8dcc0 штукатурка", "#5a3a22 дерево фахверка", "#08080c живые тени", "#c94a3a тревога"]
  music: {key: D, mode: minor, bpm: 84}
  assets:
    - "Новые актёры (общие для всех трёх частей, в библиотеку engine/hud/draw/actors/medieval.js): cottage (фахверковый дом с соломенной крышей, окна с огнём), chapel (деревянная колокольня/часовня), well (колодец), watermill (мельница с колесом), forge и anvil (кузница), crater и star_stone (воронка и чёрный камень, который не отражает свет), meteor (огненный шар с хвостом), torch и candle (огонь с ореолом света), astrolabe и book (стол монаха)"
    - "Главное: cast_shadow (тень персонажа, рассчитанная от источника света: длина и направление по позиции свечи/солнца, может отставать или двигаться сама) и living_shadow (свободная тень: длинные руки, без лица, ползёт по стенам и земле)"
    - "person: средневековые наряды — платье и коса (Марта), фартук кузнеца (Ганс), ряса с тонзурой (Ансельм), рубаха мальчика (Томас), крестьяне; позже — доспех рыцаря (часть 2)"
  notes:
    - "Цвет ведёт историю: тёплая осень → синяя ночь → бледное утро без теней → чёрно-золотая келья → почти монохромный финал с одной свечой"
    - "Тени — главный носитель смысла: всегда ровно от источника света, кроме «живых» — их неправильность и пугает"
    - "Персонажи с первого появления подписаны выноской (имя и роль) — их будут узнавать во второй и третьей частях"

review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 9, emotion: 8, payoff: 8, visuals: 9, cta: 8, platform: 8, accuracy: 8}
  weak_points:
    - "Вымысел: зритель может принять за «реальную историю» — в первом кадре и упаковке «ЧАСТЬ 1/3», в описании «вымышленная история»."
    - "Правило «тень — дверь» нужно понять за 5 секунд — держится на схеме; если схема перегружена, правило потеряется."
    - "Много новых актёров (дома, мельница, кузница, тени) — первая часть дорогая в производстве, но вторая и третья используют те же."
  improvements:
    - "Отказались от реальной «танцевальной чумы» по просьбе заказчика: история полностью выдумана, реальна только физика света и тени."
    - "Правило мира вынесено в отдельный блок со схемой — это «как это работает», которое зритель может проверить сам со свечой."
    - "Финал на физическом повороте (тень подняла руку) вместо слов — понятен без звука и толкает к пересмотру."

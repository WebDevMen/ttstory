brief:
  goal: "Удержать аудиторию первой серии и закрепить рубрику «Аферы»: обещанная «ещё наглее» афера — обманывали не казино, а игроков изнутри самого сайта."
  kpi: [completion, comments, follows, shares, rewatch]
  audience:
    who: "Зрители первой серии и все, кто любит true crime, хакеров и истории про азарт; многие играли в онлайн-покер или слышали о нём"
    age: "18–35"
    interests: [true crime, хакеры, покер, онлайн-игры, деньги]
    pains: ["подозрение, что онлайн-игры подкручены", "истории без доказательств"]
    desires: ["узнать реальный случай с доказательствами", "понять, как именно раскрыли", "поспорить, что хуже"]
    knowledge: "Знают правила покера в общих чертах; не знают, что крупнейший скандал онлайн-покера раскрыли сами игроки — по файлу, который сайт им же и прислал"
  promise: "Реальная история, где обманывали не казино, а игроков — изнутри самого покер-сайта, и как это вскрылось из-за одного файла."
  tone: "Холодный цифровой триллер: тёмно-зелёное сукно, голубой «режим бога», красные улики; в финале — признание на записи и спор."
  keywords: ["онлайн-покер", "афера", "покер", "казино"]
  constraints:
    - "Только факты из отчётов комиссии Каанаваке и крупных покерных СМИ; формулировки «по ошибке», «след вёл» — как в источниках"
    - "Не реклама азартных игр: никаких призывов играть, ссылок и бонусов; история о мошенничестве и о том, как его вскрыли игроки"
    - "Имя виновника не звучит — «чемпион мира девяносто четвёртого года» (так назван в решении комиссии и в СМИ); лица — силуэты"
    - "Не утверждать про уголовное преследование и точную сумму украденного: известны только возвраты и признание на записи"
    - "Связка с первой серией: «в прошлый раз хакеры обыгрывали казино — теперь игроков обманывали изнутри»"

research:
  summary: >-
    В сентябре 2007 года на Absolute Poker аккаунт POTRIPPER, сыгравший до этого всего три недорогих турнира, выиграл турнир
    с бай-ином 1000 долларов и гарантией 100 000, а в финальной раздаче ответил на олл-ин с десяткой-старшей без пары и дро.
    Соперник (CrazyMarco) попросил историю раздач, и сайт по ошибке прислал таблицу действий всех столов с закрытыми картами
    и IP-адресами наблюдателей. Форумы нашли наблюдателя с IP компании; след привёл в офис сайта в Коста-Рике. Сайт признал
    инсайдерское жульничество (программная лазейка давала доступ к картам соперников), вернул 1,6 млн долларов, комиссия
    Каанаваке оштрафовала его на 500 000. Затем на UltimateBet той же сети нашли аккаунты с невозможными результатами; в 2008
    комиссия назвала главным виновником чемпиона Мировой серии покера 1994 года; игрокам вернули 22,1 млн долларов. В 2013-м
    на утёкшей записи он сказал: «Я взял эти деньги».
  facts:
    - id: f1
      text: "Сентябрь 2007: аккаунт POTRIPPER, до этого сыгравший лишь три недорогих турнира, выиграл на Absolute Poker турнир с бай-ином 1000 долларов (гарантия 100 000); в финальной раздаче ответил на олл-ин с десяткой-старшей без пары и дро и выиграл 30 000 долларов."
      source: "https://www.pokernews.com/news/2022/11/ultimate-bet-scandal-42623.htm"
      confidence: high
    - id: f2
      text: "Финалист Марко «CrazyMarco» Джонсон запросил историю раздач, и Absolute Poker по ошибке прислал таблицу действий всех столов за первые часы турнира — с закрытыми картами игроков и IP/почтой наблюдателей."
      source: "https://www.theregister.co.uk/2007/10/18/absolute_poker_cheating_allegations/"
      confidence: high
    - id: f3
      text: "В файле был наблюдатель с IP-адресом Absolute Poker, следивший за столом POTRIPPER; аккаунт в итоге отследили до корпоративного офиса сайта в Коста-Рике."
      source: "https://www.pokernews.com/news/2022/11/ultimate-bet-scandal-42623.htm"
      confidence: medium
    - id: f4
      text: "Аудит по заказу комиссии Каанаваке подтвердил: примерно с 14 августа 2007 программная лазейка давала инсайдерам доступ к закрытым картам; связано 7 аккаунтов. Absolute Poker вернул игрокам 1,6 млн долларов и получил штраф 500 000."
      source: "https://www.pokernews.com/news/2008/01/absolute-poker-kgc-releases-final-audit-report-4634.htm"
      confidence: high
    - id: f5
      text: "Затем на UltimateBet (та же сеть Cereus) игроки нашли аккаунты вроде NioNio с результатами далеко за пределами статистической нормы; сайт признал скрытый код, передававший карты соперников мошенникам во время игры."
      source: "https://www.pokernews.com/news/2022/11/ultimate-bet-scandal-42623.htm"
      confidence: high
    - id: f6
      text: "29 сентября 2008 комиссия Каанаваке назвала чемпиона главного турнира Мировой серии покера 1994 года главным виновником жульничества на UltimateBet (май 2004 — январь 2008); сайт вернул игрокам 22,1 млн долларов."
      source: "https://en.wikipedia.org/wiki/Russ_Hamilton_(poker_player)"
      confidence: high
    - id: f7
      text: "В 2013 году утекла тайная запись разговора, где он признал, что забрал у игроков 16–18 млн долларов: «I did take this money» («Я взял эти деньги»)."
      source: "https://www.pokernews.com/news/2022/11/ultimate-bet-scandal-42623.htm"
      confidence: high
    - id: f8
      text: "Он — единственный победитель главного турнира WSOP, чей баннер не вывешивают на турнире (по данным PokerNews)."
      source: "https://www.pokernews.com/news/2022/11/ultimate-bet-scandal-42623.htm"
      confidence: medium
  angles:
    - id: a1
      text: "Сам сайт видел твои карты: история «режима бога», который вскрылся из-за файла, присланного жертве, — и финал с чемпионом мира"
      score: 9
      why: "Честно «наглее», чем первая серия (обман изнутри), онлайн — как просил заказчик, улики вещественные (файл, IP, статистика), два поворота (файл, чемпион) и признание на записи."
    - id: a2
      text: "Инспектор, который сам проверял автоматы на честность и вшил в них лазейку (Рон Харрис, Невада, 1990-е)"
      score: 8
      why: "Отличный поворот «проверяющий — жулик», но офлайн и снова игровые автоматы — визуально повторит первую серию."
    - id: a3
      text: "Лазерный сканер в телефоне и рулетка «Ритца»: деньги вернули мошенникам"
      score: 7
      why: "Сильный финал, но слабее доказательная база и меньше «наглости» — это не обман игроков, а обыгрывание казино."
    - id: a4
      text: "Фил Айви и узор рубашки карт: 10 млн и суды"
      score: 6
      why: "Слишком известная история, спорная мораль, мало «вау» в механике для 60 секунд."
  chosen_angle: a1
  insights:
    - "Главный крючок — подмена ролей: в первой серии жертвой было казино, здесь жертвы — игроки, а обманщик — сам сайт."
    - "Самая цепляющая деталь — сайт сам прислал улику жертве; это легко показать (запрос → файл → все карты)."
    - "«Чемпион мира» — второй поворот, который поднимает ставки во второй половине."
    - "Признание на записи закрывает вопрос «а было ли?» и снимает возможные споры о доказательствах."
    - "Спор «что хуже: хакер снаружи или казино изнутри» — естественный повод для комментариев одним словом и связка с первой серией."


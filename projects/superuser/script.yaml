beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Он видел карты всех"
    goal: "Остановить палец: суперсила «видеть чужие карты» и поворот «свой человек внутри сайта»."
    vo: "В онлайн-покере он видел карты всех соперников. И это был свой человек — внутри самого сайта."
    on_screen: "ВИДЕЛ КАРТЫ ВСЕХ"
    devices: [open_loop, pattern_interrupt, text_reinforcement, visual_proof, sound_hit]
    music: pulse
    marks: {"карты всех соперников": "#4de1ff"}
    shots:
      - id: h_table
        visual: "Онлайн-покерный стол сверху: тёмно-зелёное сукно, шесть мест с никами и фишками, у всех соперников карты рубашкой вверх. По столу пробегает голубой луч — и все карты переворачиваются лицом."
        actors: [poker_table, playing_card, chips, text]
        camera: "Медленный наезд сверху с лёгким поворотом"
        animation:
          - {at: "@start", what: "Карты разлетаются к игрокам (раздача)"}
          - {at: "@видел", what: "Голубой луч-сканер проходит по столу, карты соперников переворачиваются лицом вверх"}
          - {at: "@соперников", what: "Открытые карты подсвечиваются голубыми рамками, над столом — значок глаза"}
        graphics:
          - {at: "@видел", type: "text slam", text: "ВИДЕЛ КАРТЫ ВСЕХ"}
        sfx:
          - {at: "@start", sound: click, note: "раздача"}
          - {at: "@видел", sound: noise_sweep}
          - {at: "@соперников", sound: kick}
        ambience: [hum]
        transition: cut
      - id: h_insider
        at: "@свой-0.1"
        visual: "Тёмный офис: силуэт за мониторами, на мониторе тот же стол с открытыми картами; на груди силуэта бейдж сотрудника, который вспыхивает."
        actors: [person, monitor, badge, text]
        camera: "Быстрый наезд на бейдж"
        animation:
          - {at: "@свой", what: "Камера проезжает к силуэту за мониторами"}
          - {at: "@сайта", what: "Бейдж «ПЕРСОНАЛ» вспыхивает красным"}
        graphics:
          - {at: "@сайта", type: "badge stamp", text: "СВОЙ ЧЕЛОВЕК"}
        sfx:
          - {at: "@свой", sound: glitch}
          - {at: "@сайта", sound: slam}
        transition: glitch

  # ------------------------------------------------------------------ 2. CONTEXT — связка с первой серией
  - id: context
    role: context
    title: "Афера №2"
    goal: "Связка с первой серией и смена ролей: тогда жертвой было казино, теперь — игроки."
    vo: "В прошлой серии хакеры обыгрывали казино. Теперь игроков обманывали изнутри."
    on_screen: "АФЕРА №2"
    devices: [callback, contrast, progress]
    music: pulse
    shots:
      - id: c_prev
        visual: "Мини-повтор первой серии: неоновый автомат и телефон с вибрацией, сверху метка «АФЕРА №1»; кадр сжимается в карточку и уезжает влево."
        actors: [slot_machine, phone, buzz, text]
        camera: "Отъезд, карточка уменьшается"
        animation:
          - {at: "@прошлой", what: "Телефон вибрирует у автомата, барабаны встают на 7-7-7"}
          - {at: "@казино", what: "Кадр сжимается в карточку «АФЕРА №1» и улетает влево"}
        graphics:
          - {at: "@прошлой", type: timetag, text: "АФЕРА №1 · КАЗИНО"}
        sfx:
          - {at: "@прошлой", sound: buzz}
          - {at: "@казино", sound: whoosh}
        transition: whip_x
      - id: c_now
        at: "@Теперь-0.1"
        visual: "Покерный стол сверху; над ним огромный голубой глаз в экране; штамп «АФЕРА №2». Фишки игроков медленно утекают к логотипу сайта в центре."
        actors: [poker_table, chips, text]
        camera: "Наезд на глаз"
        animation:
          - {at: "@Теперь", what: "Над столом раскрывается глаз"}
          - {at: "@изнутри", what: "Фишки игроков утекают в центр стола, к логотипу сайта"}
        graphics:
          - {at: "@игроков", type: "text stamp", text: "АФЕРА №2"}
        sfx:
          - {at: "@игроков", sound: kick}
          - {at: "@изнутри", sound: riser}
        transition: whip_x

  # ------------------------------------------------------------------ 3. PROBLEM — идеальная игра и колл с пустой рукой
  - id: problem
    role: problem
    title: "Колл с пустой рукой"
    goal: "Конкретная подозрительная раздача: почти новичок играет без ошибок и отвечает на олл-ин с пустой рукой."
    vo: "Две тысячи седьмой. Турнир на тысячу долларов. Почти новичок играет без единой ошибки. А в финале отвечает на олл-ин с пустой рукой — и забирает тридцать тысяч."
    on_screen: "КОЛЛ С ПУСТОЙ РУКОЙ"
    devices: [visual_proof, stakes_raise, relatability, progress]
    facts: [f1]
    music: tension
    shots:
      - id: p_lobby
        visual: "Лобби онлайн-турнира: карточка «БАЙ-ИН $1 000 · ГАРАНТИЯ $100 000», список игроков, метка «СЕНТЯБРЬ 2007 · ОНЛАЙН-ПОКЕР»."
        actors: [monitor, text, timetag, badge]
        camera: "Скролл лобби вниз"
        animation:
          - {at: "@Две", what: "Метка времени печатается"}
          - {at: "@тысячу", what: "Карточка бай-ина выскакивает"}
        graphics:
          - {at: "@Две", type: timetag, text: "СЕНТЯБРЬ 2007 · ОНЛАЙН-ПОКЕР"}
          - {at: "@тысячу", type: badge, text: "БАЙ-ИН $1 000"}
        sfx:
          - {at: "@Две", sound: typing}
          - {at: "@тысячу", sound: pop}
        transition: whip_y
      - id: p_rookie
        at: "@Почти-0.1"
        visual: "Профиль POTRIPPER: «ТУРНИРОВ: 3»; справа лента раздач, где каждая отмечается зелёной галочкой — ни одной ошибки."
        actors: [playing_card, checklist, text]
        camera: "Медленный наезд на ленту галочек"
        animation:
          - {at: "@новичок", what: "Карточка профиля POTRIPPER: «ТУРНИРОВ: 3»"}
          - {at: "@без", what: "Галочки ставятся одна за другой всё быстрее"}
        graphics:
          - {at: "@новичок", type: card, text: "POTRIPPER · ТУРНИРОВ: 3"}
        sfx:
          - {at: "@без", sound: blip}
        transition: zoom
      - id: p_allin
        at: "@финале-0.1"
        visual: "Финальная раздача один на один: на столе К-К-4-7, у соперника 9-2, у POTRIPPER 10-9 — пустая рука. Соперник жмёт ОЛЛ-ИН, POTRIPPER мгновенно отвечает КОЛЛ; штамп «ПУСТАЯ РУКА»."
        actors: [poker_table, playing_card, chips, text]
        camera: "Наезд на карты POTRIPPER, на «рукой» — тряска"
        animation:
          - {at: "@финале", what: "Общие карты К-К-4-7 выкладываются"}
          - {at: "@отвечает", what: "Фишки соперника летят в банк: ОЛЛ-ИН"}
          - {at: "@пустой", what: "POTRIPPER отвечает: карты 10-9 открываются, штамп «ПУСТАЯ РУКА»"}
        graphics:
          - {at: "@пустой", type: "text stamp", text: "ПУСТАЯ РУКА"}
        sfx:
          - {at: "@финале", sound: click}
          - {at: "@отвечает", sound: whoosh}
          - {at: "@рукой", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 4. PROOF — файл, который прислал сам сайт
  - id: file
    role: proof
    title: "Улику прислали жертве"
    goal: "Первый поворот и награда: сайт сам прислал проигравшему файл со всеми картами."
    vo: "Проигравший попросил историю раздач. А сайт по ошибке прислал файл со всеми картами всех игроков. Даже с теми, что лежали рубашкой вверх."
    on_screen: "ФАЙЛ СО ВСЕМИ КАРТАМИ"
    devices: [twist, visual_proof, mini_payoff, sound_hit]
    facts: [f2]
    music: pulse
    shots:
      - id: f_mail
        visual: "Окно почты: исходящее «Пришлите историю раздач» улетает; входящий ответ с вложением «hand_history.xls» мигает."
        actors: [monitor, text, playing_card]
        camera: "Лёгкий наезд на окно почты"
        animation:
          - {at: "@попросил", what: "Письмо-запрос улетает вправо"}
          - {at: "@прислал", what: "Входящее письмо с вложением выскакивает и мигает"}
        graphics:
          - {at: "@попросил", type: bubble, text: "ПРИШЛИТЕ ИСТОРИЮ РАЗДАЧ"}
        sfx:
          - {at: "@попросил", sound: whoosh}
          - {at: "@прислал", sound: ping}
        transition: whip_x
      - id: f_sheet
        at: "@файл-0.1"
        visual: "Таблица Excel на весь экран: бегут строки раздач; в колонке «КАРТЫ» видны закрытые карты всех игроков; строки подсвечиваются."
        actors: [spreadsheet, text]
        camera: "Быстрый скролл таблицы, затем стоп"
        animation:
          - {at: "@файл", what: "Таблица раскрывается, строки бегут вниз"}
          - {at: "@всеми", what: "Колонка с картами подсвечивается голубым"}
          - {at: "@игроков", what: "Скролл резко останавливается"}
          - {at: "@Даже", what: "Рядом с таблицей карты рубашкой вверх становятся прозрачными — видно, что под ними"}
        graphics:
          - {at: "@всеми", type: "text slam", text: "ВСЕ КАРТЫ ВСЕХ ИГРОКОВ"}
          - {at: "@рубашкой", type: badge, text: "ДАЖЕ ЗАКРЫТЫЕ"}
        sfx:
          - {at: "@файл", sound: typing}
          - {at: "@игроков", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 5. REVEAL — наблюдатель и офис
  - id: observer
    role: reveal
    title: "След вёл в офис"
    goal: "Ответ на «кто это был»: наблюдатель видел карты, его IP вёл в офис самого сайта."
    vo: "В файле нашли наблюдателя, который видел чужие карты. Его след вёл в офис самого покер-рума."
    on_screen: "СЛЕД ВЁЛ В ОФИС"
    devices: [mini_payoff, visual_proof, progress, emotion]
    facts: [f3, f4]
    music: tension
    shots:
      - id: o_row
        visual: "Таблица крупно: среди игроков строка «НАБЛЮДАТЕЛЬ», подсвеченная красным; рядом иконка глаза и столбец IP."
        actors: [spreadsheet, text, callout]
        camera: "Наезд на красную строку"
        animation:
          - {at: "@наблюдателя", what: "Строка «НАБЛЮДАТЕЛЬ» вспыхивает красным"}
          - {at: "@чужие", what: "Иконка глаза рядом со строкой раскрывается"}
        graphics:
          - {at: "@наблюдателя", type: callout, text: "НАБЛЮДАТЕЛЬ"}
        sfx:
          - {at: "@наблюдателя", sound: blip}
          - {at: "@чужие", sound: hiss}
        transition: zoom
      - id: o_trace
        at: "@след-0.1"
        visual: "Карта Центральной Америки ночью: линия трассировки IP прыгает по узлам и упирается в пин «ОФИС ПОКЕР-РУМА · КОСТА-РИКА»."
        actors: [map, text, badge]
        camera: "Наезд на Коста-Рику"
        animation:
          - {at: "@след", what: "Линия трассировки рисуется по узлам"}
          - {at: "@офис", what: "Пин «ОФИС» вспыхивает, круги расходятся"}
        graphics:
          - {at: "@офис", type: badge, text: "ОФИС САМОГО ПОКЕР-РУМА"}
        sfx:
          - {at: "@след", sound: noise_sweep}
          - {at: "@офис", sound: slam}
        transition: whip_x

  # ------------------------------------------------------------------ 6. ESCALATION — соседний сайт и невозможная статистика
  - id: network
    role: escalation
    title: "Статистика отказывалась верить"
    goal: "Масштаб растёт: то же на втором сайте сети, доказательство — статистика."
    vo: "Дальше — больше. На соседнем сайте той же сети аккаунты выигрывали так, что статистика отказывалась верить."
    on_screen: "СТАТИСТИЧЕСКИ НЕВОЗМОЖНО"
    devices: [stakes_raise, number_reveal, visual_proof, contrast]
    facts: [f5]
    music: tension
    shots:
      - id: n_sites
        visual: "Два логотипа сайтов соединены светящейся линией «ОДНА СЕТЬ»; второй логотип загорается красным."
        actors: [text, shape, badge]
        camera: "Панорама от первого логотипа ко второму"
        animation:
          - {at: "@больше", what: "Появляется второй сайт, линия между сайтами рисуется"}
          - {at: "@сети", what: "Второй логотип загорается красным"}
        graphics:
          - {at: "@сети", type: badge, text: "ТА ЖЕ СЕТЬ"}
        sfx:
          - {at: "@больше", sound: whoosh}
          - {at: "@сети", sound: buzz}
        transition: whip_y
      - id: n_curve
        at: "@аккаунты-0.1"
        visual: "Колокол нормального распределения выигрышей: тысячи игроков в серой «горке», и одна красная точка далеко справа за краем графика."
        actors: [bell_curve, text]
        camera: "Отъезд вправо вслед за точкой"
        animation:
          - {at: "@аккаунты", what: "Колокол рисуется слева направо"}
          - {at: "@выигрывали", what: "Красная точка уезжает далеко за правый край"}
          - {at: "@статистика", what: "Точка мигает, подпись «НЕВОЗМОЖНО»"}
        graphics:
          - {at: "@статистика", type: "text stamp", text: "НЕВОЗМОЖНО"}
        sfx:
          - {at: "@выигрывали", sound: riser}
          - {at: "@статистика", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 7. TWIST — чемпион мира
  - id: champion
    role: twist
    title: "Главный — чемпион мира"
    goal: "Второй поворот: главный виновник — чемпион мира по покеру."
    vo: "А главным оказался чемпион мира по покеру девяносто четвёртого года."
    on_screen: "ЧЕМПИОН МИРА 1994"
    devices: [twist, emotion, sound_hit]
    facts: [f6]
    music: sub
    shots:
      - id: t_champ
        visual: "Сцена в луче прожектора: силуэт с трофеем, за спиной золотые баннеры чемпионов; надпись «ЧЕМПИОН МИРА 1994» и красный штамп «ГЛАВНЫЙ ВИНОВНИК»."
        actors: [person, text, badge, particles]
        camera: "Медленный наезд снизу вверх на силуэт"
        animation:
          - {at: "@главным", what: "Прожектор включается, силуэт с трофеем"}
          - {at: "@чемпион", what: "Золотое конфетти падает, надпись «ЧЕМПИОН МИРА 1994»"}
          - {at: "@года", what: "Свет краснеет, штамп «ГЛАВНЫЙ ВИНОВНИК»"}
        graphics:
          - {at: "@чемпион", type: text, text: "ЧЕМПИОН МИРА 1994"}
          - {at: "@года", type: "badge stamp", text: "ГЛАВНЫЙ ВИНОВНИК"}
        sfx:
          - {at: "@главным", sound: impact}
          - {at: "@года", sound: slam}
        transition: flash

  # ------------------------------------------------------------------ 8. PAYOFF — возврат и признание
  - id: payoff
    role: payoff
    title: "«Я взял эти деньги»"
    goal: "Развязка: масштаб (возврат 22 млн) и признание на записи."
    vo: "Игрокам вернули двадцать два миллиона долларов. А на записи он сам признался: «Да, я взял эти деньги»."
    on_screen: "$22 000 000"
    devices: [number_reveal, mini_payoff, emotion, callback]
    facts: [f6, f7]
    music: epic
    marks: {"двадцать два миллиона долларов": "#ffd34d"}
    shots:
      - id: pay_refund
        visual: "Счётчик «ВОЗВРАТ ИГРОКАМ» крутится до $22 100 000; фишки и купюры летят обратно к аватарам игроков."
        actors: [text, coins, chips]
        camera: "Отъезд, счётчик крупно"
        animation:
          - {at: "@двадцать", what: "Счётчик крутится до $22 100 000"}
          - {at: "@долларов", what: "Купюры летят обратно к игрокам"}
        graphics:
          - {at: "@двадцать", type: "text count", text: "$22 100 000"}
        sfx:
          - {at: "@двадцать", sound: typing}
          - {at: "@долларов", sound: sparkle}
        transition: whip_y
      - id: pay_tape
        at: "@записи-0.1"
        visual: "Кассетный диктофон и звуковая волна; под ней печатается цитата «ДА, Я ВЗЯЛ ЭТИ ДЕНЬГИ»; метка «ЗАПИСЬ · 2013»."
        actors: [waveform, text, timetag]
        camera: "Медленный наезд на волну"
        animation:
          - {at: "@записи", what: "Кассета крутится, волна бежит"}
          - {at: "@признался", what: "Цитата печатается по буквам"}
        graphics:
          - {at: "@записи", type: timetag, text: "ЗАПИСЬ · 2013"}
          - {at: "@признался", type: "text type", text: "«ДА, Я ВЗЯЛ ЭТИ ДЕНЬГИ»"}
        sfx:
          - {at: "@записи", sound: click}
          - {at: "@деньги", sound: boom}
        transition: zoom

  # ------------------------------------------------------------------ 9. CTA
  - id: cta
    role: cta
    title: "Что наглее?"
    goal: "Спор одним словом (хакер или казино) + подписка на третью серию; петля к первому кадру — карты снова переворачиваются."
    vo: "Что наглее: хакер снаружи или казино изнутри? Пиши одним словом. Третья афера — уже на очереди."
    on_screen: "ХАКЕР ИЛИ КАЗИНО?"
    devices: [comment_bait, follow_trigger, loop_ending, direct_address]
    music: pulse
    shots:
      - id: z_choice
        visual: "Две неоновые кнопки: красная «ХАКЕР СНАРУЖИ» и голубая «КАЗИНО ИЗНУТРИ»; между ними «ИЛИ»; плашка «АФЕРА №3 — СКОРО»."
        actors: [text, shape, badge]
        camera: "Лёгкий наезд"
        animation:
          - {at: "@хакер", what: "Загорается красная кнопка"}
          - {at: "@казино", what: "Загорается голубая кнопка"}
          - {at: "@Третья", what: "Плашка «АФЕРА №3 — СКОРО» падает сверху"}
        graphics:
          - {at: "@хакер", type: text, text: "ХАКЕР СНАРУЖИ"}
          - {at: "@казино", type: text, text: "КАЗИНО ИЗНУТРИ"}
          - {at: "@Третья", type: badge, text: "АФЕРА №3 — СКОРО"}
        sfx:
          - {at: "@хакер", sound: blip}
          - {at: "@казино", sound: blip}
          - {at: "@Третья", sound: pop}
        transition: whip_x
      - id: z_loop
        at: "@очереди-0.1"
        visual: "Возврат к первому кадру: стол сверху, карты соперников снова переворачиваются под голубым лучом."
        actors: [poker_table, playing_card, chips]
        camera: "Медленный наезд"
        animation:
          - {at: "@очереди", what: "Голубой луч снова проходит по столу, карты переворачиваются"}
        graphics: []
        sfx:
          - {at: "@очереди", sound: noise_sweep}
        transition: zoom

loops:
  - {id: l1, question: "Кто этот «свой человек» и как его вычислили?", open: hook, close: observer}
  - {id: l2, question: "Почему почти новичок играет без ошибок?", open: problem, close: file}
  - {id: l3, question: "Насколько всё это было масштабно и кто стоял во главе?", open: network, close: payoff}

engagement:
  comment: "Что наглее: хакер снаружи или казино изнутри? Ответ одним словом — «хакер» или «казино»."
  share: "Переслать другу, который играет в онлайн-покер или уверен, что «там всё честно»."
  save: "Сохранить как пример того, как игроки сами вскрыли обман по данным раздач."
  follow: "Серия «Аферы»: это вторая часть, в финале обещана третья — повод подписаться."
  rewatch: "Первый и последний кадр совпадают (карты переворачиваются); в таблице и графике мелькают детали, которые хочется рассмотреть."
  cta: {beat: cta, text: "Хакер или казино? Пиши одним словом — третья афера на очереди", type: comment}

package:
  tiktok:
    caption: "Афера №2: в онлайн-покере люди самого сайта видели карты всех игроков. Выдал файл, который сайт сам прислал жертве 👀"
    hashtags: ["#онлайнпокер", "#афера", "#покер", "#truecrime", "#хакеры"]
    cover: "ОН ВИДЕЛ КАРТЫ ВСЕХ"
    sound: "Своя музыка движка (pulse → tension → sub → epic), без трендового звука"
  reels:
    caption: "Онлайн-покер, где сайт видел твои карты 👀 Афера №2: как игроки сами вскрыли «режим бога» по одному файлу. Перешли тому, кто играет в покер."
    hashtags: ["#онлайнпокер", "#афера", "#покер"]
    cover: "ОН ВИДЕЛ КАРТЫ ВСЕХ"
  shorts:
    title: "Онлайн-покер, где сайт видел карты всех игроков — афера №2"
    description: "Реальная история 2007–2008 годов: колл с пустой рукой, файл со всеми картами, офис в Коста-Рике, чемпион мира и 22 миллиона долларов возврата."
    hashtags: ["#онлайнпокер", "#афера"]
  first_frame: "Покерный стол сверху с картами рубашкой вверх и меткой «АФЕРА №2»; через секунду все карты переворачиваются — понятно без звука."
  posting: ["Через 1–3 дня после первой серии, тот же час (19:00–22:00)", "Закрепить комментарий: «Первая серия — в профиле. Хакер или казино?»", "Без ссылок, брендов действующих покер-румов и призывов играть"]

production:
  theme: {preset: minimal, accent: "#4de1ff", captions: clean}
  palette: ["#04140f тёмное сукно", "#0e5a3a стол", "#4de1ff «режим бога»", "#ff3b4e улики", "#ffd34d деньги/чемпион", "#e9e3d6 карты"]
  music: {key: D, mode: minor, bpm: 100}
  assets:
    - "Новые актёры: playing_card (игральная карта: ранг/масть, рубашка, переворот), chips (стопка фишек), poker_table (стол сверху с местами, никами, банком), monitor (экран/окно приложения), spreadsheet (таблица с бегущими строками и подсветкой), bell_curve (колокол распределения с выбросом), waveform (звуковая волна + кассета)"
    - "Из первой серии: slot_machine, buzz, coins, digits — перенесены в библиотеку актёров"
  notes:
    - "Цвет: тёмно-зелёное сукно и голубой «режим бога» (то, что видит мошенник) → красные улики → золото чемпиона → красная развязка"
    - "Карты и таблица — главные носители смысла; держать их крупно и читаемо"
    - "Брендов действующих сайтов и лиц не показывать; названия сайтов-участников в тексте не звучат"

review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 9, emotion: 8, payoff: 9, visuals: 8, cta: 8, platform: 7, accuracy: 9}
  weak_points:
    - "Тема азартных игр — риск ограничений; подача — история мошенничества и его разоблачения, без призывов играть."
    - "След в офис компании — вывод расследования форумов и СМИ (средняя уверенность); формулировка «след вёл» соответствует источникам."
    - "Покерные термины (олл-ин, колл) понятны не всем; смысл держится на картинке «пустая рука»."
  improvements:
    - "Выбран угол «обман изнутри» вместо инспектора-жулика: он онлайн, визуально не повторяет первую серию и честно «наглее»."
    - "Имя виновника заменено на «чемпиона мира девяносто четвёртого года» — так безопаснее и интригующе."
    - "Не утверждаем, был ли уголовный процесс и сколько украдено всего; говорим только о возвратах и признании на записи."

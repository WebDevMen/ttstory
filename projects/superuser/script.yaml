# СЦЕНАРИЙ: Афера №2 — в онлайн-покере люди самого сайта видели карты всех игроков (Absolute Poker и UltimateBet, 2007–2008)
# Продолжение серии после projects/slots («Как обыграть казино телефоном»). Skill write-script.
# Проверка: python3 vg.py script check superuser [--tts] · документ: python3 vg.py script render superuser
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово.end", "@слово+0.3",
# "@start"/"@end" блока, "@другой_блок/слово" или число = секунды от начала блока.


# «Без тени», часть 2/3 — «Правила». 100% code-drawn (method draw) from projects/shadow2/script.yaml.
# Series plan: projects/shadow1/series.md. Actors: library medieval.js (as in part 1 + bonfire, eclipse, village_map, sword)
# + person with medieval outfits. Coordinates: screen px 1080x1920. Times: "@word".
# Light: one source per shot (moon / bonfires / the low sun on the left at dawn); shadows fall away from it.

title: "Без тени. Часть 2: Правила"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+14%", pitch: "+0Hz", tail: 1.4}

theme:
  preset: minimal
  accent: "#ffb347"
  captions:
    style: clean
    top: 1480
    size: 62
    max_chars: 20
    hide:
      - {from: "@cta.start", until: "@cta/Финал-0.1"}

post: {vignette: 0.34, chromatic: 0, grain: 0.03}

draw:
  palette: {gold: "#ffcf6a", fire: "#ffb347", ink: "#3a2416", night: "#0b1022"}

# ------------------------------------------------------------------ shared pieces
x-title: &title {actor: text, x: 540, y: 420, size: 100, width: 980, lines: 2, color: "#ffffff", stroke: {w: 10, color: "#120d0c"}, shadow: "0 0 34px rgba(255,170,70,.6)", space: screen}
x-tag: &tag {actor: timetag, x: 540, y: 200, size: 36, color: gold, space: screen}

x-look-marta: &marta {age: student, outfit: dress, hair: braid, hair_color: "#b8481e", skin: light}
x-look-hans: &hans {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true, skin: mid, hollow: true}
x-look-anselm: &anselm {age: adult, outfit: robe, hair: tonsure, hair_color: "#6a5a48", glasses: true, skin: light}
x-look-tomas: &tomas {age: kid, outfit: tunic, hair: short, hair_color: "#e2c070", color: "#7a8a5a", skin: light, hollow: true}
x-look-godfrid: &godfrid {age: adult, outfit: knight, hair: short, hair_color: "#d0d0d0", beard: "#dadada", skin: light}
x-look-ulrich: &ulrich {age: adult, outfit: tunic, color: "#7a2a22", hair: buzz, hair_color: "#8a8a8a", beard: "#9a9a9a", skin: mid}

x-sky-night: &sky_night {actor: sky, x: -200, w: 1480, hour: 22.5, par: 0, moon: [820, 300], horizon: 930, clouds: 2, seed: 4}
x-forest-night: &forest_night {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#1e2a3c", seed: 3, par: 0.2}
x-ground-night-far: &ground_night_far {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#1a2236", "#141a2a"], par: 0.2}
x-shade: &shade {actor: living_shadow, color: "#06060a", glow: {color: "#9a8cff", r: 10, a: 0.45}}

audio:
  music:
    key: D
    mode: minor
    bpm: 88
    gain: -15
    sections:
      - {at: 0, style: pulse, chords: [Dm, Bb, Gm, A]}
      - {at: "@context.start", style: drone}
      - {at: "@problem.start", style: tension}
      - {at: "@rule.start", style: pulse, chords: [Dm, Bb, F, C]}
      - {at: "@sign.start", style: drone}
      - {at: "@cliff.start", style: dark}
      - {at: "@cta.start", style: drone, chords: [Dm, Bb, F, A]}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ 1. HOOK — спасает круг огня
  - id: hook
    accent: "#ffb347"
    text: "Одна свеча открывает дверь тени. Темнота — её дом. Спасает только круг огня."
    caption_marks: {"круг огня": "#ffb347"}
    shots:
      - id: h_candle
        ambience: [{sound: wind, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.05, y: 1000}, {t: end, z: 1.16, x: 500, y: 980}]}
          layers:
            - *sky_night
            - *forest_night
            - *ground_night_far
            - {actor: cottage, x: 560, y: 1250, scale: 1.25, seed: 8, floors: 2, thatch: false, brightness: 0.55, lit: 0.2}
            - {actor: cobbles, x: -300, y: 1230, w: 1680, h: 800, color: "#3a3c4a"}
            - {actor: light_pool, x: 640, y: 1100, r: 420, color: "#ffb04a", a: 0.4}
            # candle low in his hand → a tall shadow on the wall behind him
            - {actor: cast_shadow, id: wsh, x: 520, y: 1250, look: {age: adult, outfit: tunic, hair: short}, view: side, angle: -4, len: [{at: 0, v: 0.6}, {at: "@свеча", v: 1.55, dur: 0.6}], wide: 1.4, color: "#0a0806", alpha: 0.8, soft: 3,
               pose: {a1: [6, 10], a2: [40, 60]}, glow: {color: "#ffcf6a", r: 18, a: 1}, glow_k: [{at: 0, v: 0}, {at: "@дверь", v: 1, dur: 0.15}, {at: "@тени+0.3", v: 0, dur: 0.4}]}
            - {<<: *shade, x: 0, y: 1250, h: 520, alpha: 0.9, lean: 16, reach: [{at: 0, v: 0}, {at: "@открывает", v: 1, dur: 0.4}], anim: [{at: 0.2, dur: 1.2, x: 300, ease: out}, {at: "@дверь", dur: 0.6, x: 500, opacity: 0, scale: 0.7, ease: in}]}
            - {actor: person, x: 560, y: 1380, scale: 1.0, view: side, look: {age: adult, outfit: tunic, hair: short}, hold: candle, hold_rot: 100, pose: {a1: [6, 10], a2: [40, 60]}, face: [{at: 0, v: neutral}, {at: "@дверь", v: surprised}]}
            - {actor: light_pool, x: 640, y: 1250, r: 200, color: "#ffd27a", a: 0.5}
            - {<<: *tag, text: "ЧАСТЬ 2/3 · ПРАВИЛА", at: 0.05, enter: fade}
      - id: h_dark
        start: "@Темнота-0.22"
        transition: {type: dip}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 520}, {t: end, z: 1.06, x: 580}]}
          layers:
            - {actor: hut_interior, floor_y: 1300, wall: "#2a241e", timber: "#120c08", floor: "#1e1812", window: {x: 780, y: 380, w: 200, h: 240}, seed: 5}
            - {actor: stars, region: [780, 380, 980, 620], count: 10, size: 2}
            - {actor: light_pool, x: 880, y: 520, r: 300, color: "#8aa0d0", a: 0.25}
            - {<<: *shade, x: 180, y: 1300, h: 560, color: "#000000", alpha: [{at: 0, v: 0.2}, {at: "@Темнота+0.2", v: 0.85, dur: 0.6}], arms_up: 0.5, glow: {color: "#7a6cdf", r: 12, a: 0.5}}
            - {<<: *shade, x: 640, y: 1300, h: 620, color: "#000000", alpha: [{at: 0, v: 0.2}, {at: "@её", v: 0.85, dur: 0.6}], reach: 0.8, lean: -8, glow: {color: "#7a6cdf", r: 12, a: 0.5}}
            - {actor: shape, kind: rect, x: 540, y: 1430, w: 900, h: 70, fill: "#2a2018"}
            - {actor: person, x: 300, y: 1470, scale: 1.0, look: {age: adult, outfit: peasant_f, hair: bun}, pose: sit, face: sleep, brightness: 0.45}
            - {actor: person, x: 520, y: 1470, scale: 0.9, look: {age: kid, outfit: tunic, hair: short}, pose: sit, face: sleep, brightness: 0.45}
            - {actor: person, x: 740, y: 1470, scale: 1.0, look: {age: adult, outfit: tunic, hair: side, beard: true}, pose: sit, face: sleep, brightness: 0.45}
            - {<<: *title, text: "ТЕМНОТА — ЕЁ ДОМ", at: "@её-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: h_ring
        start: "@Спасает-0.22"
        transition: {type: zoom}
        ambience: [{sound: fire, gain: -16}]
        look: {bloom: [0.7, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.12, y: 1180}, {t: end, z: 1.0, y: 1080}]}
          layers:
            - *sky_night
            - *forest_night
            - *ground_night_far
            - {actor: chapel, x: 300, y: 1040, scale: 0.6, lit: 0.6, brightness: 0.7, par: 0.6}
            - {actor: cottage, x: 880, y: 1040, scale: 0.5, seed: 8, floors: 2, thatch: false, brightness: 0.6, par: 0.6}
            - {actor: ground, x: -520, y: 1025, w: 2120, h: 1000, color: ["#2a2420", "#1a1612"], par: 0.6}
            - {actor: ground, x: -520, y: 1080, w: 2120, h: 900, color: ["#3a2e24", "#221a14"]}
            - {actor: light_pool, x: 540, y: 1260, r: 620, sy: 0.42, color: "#ff9a3a", a: 0.55, k: [{at: 0, v: 0.2}, {at: "@огня", v: 1, dur: 0.5}]}
            - {<<: *shade, x: 140, y: 1120, h: 420, alpha: 0.9, reach: 0.7, anim: [{at: "@огня", dur: 0.5, dx: -90, ease: out}]}
            - {<<: *shade, x: 960, y: 1110, h: 400, alpha: 0.9, reach: 0.7, flip: true, anim: [{at: "@огня", dur: 0.5, dx: 90, ease: out}]}
            - {actor: bonfire, x: 243, y: 1154, scale: 0.52, at: "@Спасает+0.35", enter: pop, seed: 5}
            - {actor: bonfire, x: 540, y: 1110, scale: 0.5, at: "@Спасает+0.45", enter: pop, seed: 6}
            - {actor: bonfire, x: 837, y: 1154, scale: 0.52, at: "@Спасает+0.55", enter: pop, seed: 7}
            - {actor: bonfire, x: 120, y: 1260, scale: 0.6, at: "@Спасает+0.25", enter: pop, seed: 4}
            - {actor: bonfire, x: 960, y: 1260, scale: 0.6, at: "@Спасает+0.65", enter: pop, seed: 8}
            - {actor: person, x: 380, y: 1270, scale: 0.78, look: {age: adult, outfit: peasant_f, hair: bun}, face: neutral}
            - {actor: person, x: 490, y: 1290, scale: 0.68, look: {age: kid, outfit: tunic, hair: short, hair_color: "#6a4a2a"}, face: neutral}
            - {actor: person, x: 600, y: 1275, scale: 0.8, look: {age: adult, outfit: tunic, hair: side, beard: true}, face: determined}
            - {actor: person, x: 710, y: 1270, scale: 0.76, look: *marta, face: neutral}
            - {actor: bonfire, x: 243, y: 1366, scale: 0.68, at: "@Спасает+0.15", enter: pop, seed: 3}
            - {actor: bonfire, x: 540, y: 1410, scale: 0.72, at: "@Спасает+0.05", enter: pop, seed: 2}
            - {actor: bonfire, x: 837, y: 1366, scale: 0.68, at: "@Спасает+0.75", enter: pop, seed: 1}
            - {actor: particles, kind: embers, region: [100, 900, 1000, 1400], count: 40, seed: 3}
            - {<<: *title, text: "СПАСАЕТ КРУГ ОГНЯ", at: "@огня-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: pop, at: "@start", gain: -14}
      - {sound: slam, at: "@дверь", gain: -14}
      - {sound: creature, at: "@Темнота", gain: -14}
      - {sound: whoosh, at: "@Спасает", gain: -14}
      - {sound: impact, at: "@огня", gain: -14}

  # ------------------------------------------------------------------ 2. CONTEXT — что было в части 1
  - id: context
    text: "Часть вторая. Звезда упала, тени ушли от людей. Брат Марты вернулся пустым."
    shots:
      - id: c_recap
        transition: {type: whip_x}
        look: {grade: {sat: 0.7, contrast: 0.05}}
        draw:
          camera: {keys: [{t: 0, z: 1.08, y: 1040}, {t: end, z: 1.15, y: 1080}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 7.3, par: 0, sun: [190, 860], horizon: 930, clouds: 3, seed: 4}
            # the star falls along an arc, accelerating and growing, tail always behind (orient), leaving a smoke trail
            - {actor: shape, kind: path, x: 0, y: 0, origin: top-left, d: "M1000,-60 Q700,220 360,860", fill: "none", stroke: "#b0a8b0", sw: 22, opacity: 0.4, blur: 9, enter: {type: fade, dur: 0.2},
               at: "@Звезда-0.55", draw: [{at: 0, v: 0}, {at: "@Звезда-0.55", v: 1, dur: 1.0, ease: inQuad}]}
            - {actor: meteor, x: 1000, y: -60, len: 480, angle: 180, r: 24, enter: {type: fade, dur: 0.15}, at: "@Звезда-0.55", until: "@упала+0.1",
               scale: [{at: 0, v: 0.6}, {at: "@Звезда-0.55", v: 1.25, dur: 1.0, ease: in}], tail: [{at: 0, v: 0.5}, {at: "@Звезда-0.55", v: 1, dur: 1.0, ease: in}],
               anim: [{at: "@Звезда-0.55", dur: 1.0, path: "M1000,-60 Q700,220 360,860", orient: true, ease: inQuad}]}
            - {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#7c8a8a", seed: 3, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#8d9474", "#717858"], par: 0.2}
            - {actor: light_pool, x: 360, y: 880, r: 400, sy: 0.5, color: "#ff8a3a", a: 0.7, par: 0.2, k: [{at: 0, v: 0}, {at: "@упала", v: 1, dur: 0.15}, {at: "@упала+0.4", v: 0.3, dur: 0.8}]}
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#9a9070", "#7a7258"], par: 0.45}
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#7a7064"}
            - {actor: well, x: 540, y: 1110, scale: 0.72}
            - {actor: cast_shadow, x: 240, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: short}, angle: 128, flat: 0.42, alpha: [{at: 0, v: 0.5}, {at: "@тени", v: 0, dur: 0.5}], len: [{at: 0, v: 1}, {at: "@тени", v: 0, dur: 0.5}], color: "#1a1410"}
            - {actor: cast_shadow, x: 540, y: 1280, scale: 0.95, look: {age: adult, outfit: smith, hair: short, beard: true}, angle: 128, flat: 0.42, alpha: [{at: 0, v: 0.5}, {at: "@тени+0.15", v: 0, dur: 0.5}], len: [{at: 0, v: 1}, {at: "@тени+0.15", v: 0, dur: 0.5}], color: "#1a1410"}
            - {actor: cast_shadow, x: 820, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}, angle: 128, flat: 0.42, alpha: [{at: 0, v: 0.5}, {at: "@тени+0.3", v: 0, dur: 0.5}], len: [{at: 0, v: 1}, {at: "@тени+0.3", v: 0, dur: 0.5}], color: "#1a1410"}
            - {actor: person, x: 240, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: short}, face: neutral}
            - {actor: person, x: 540, y: 1280, scale: 0.95, look: {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true}, face: neutral}
            - {actor: person, x: 820, y: 1275, scale: 0.95, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}, face: neutral}
            - {<<: *tag, text: "ЧАСТЬ 1 · ЗВЕЗДА", at: "@Часть-0.05", enter: wipe_right, enter_dur: 0.5}
      - id: c_tomas
        start: "@Брат-0.22"
        transition: {type: dip}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.12, x: 520, y: 900}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 6.1, par: 0, sun: [880, 880], horizon: 930, clouds: 3, seed: 12}
            - {actor: forest, x: 540, y: 905, w: 2100, h: 170, hill: 110, color: "#3a3046", seed: 21, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#4a3e50", "#3a3040"], par: 0.2}
            - {actor: cottage, x: 540, y: 1150, scale: 1.1, seed: 8, floors: 2, thatch: false, door_at: 1, door: 0.6}
            - {actor: ground, x: -520, y: 1130, w: 2120, h: 900, color: ["#6a5a4c", "#4a3e34"]}
            - {actor: person, id: tomas, x: 520, y: 1340, scale: 1.25, look: *tomas, face: neutral, pose: {a1: [4, 2], a2: [4, 2], l1: [2, 0], l2: [2, 0], tilt: -6}}
            - {actor: shape, kind: ellipse, x: 520, y: 1345, w: 260, h: 70, fill: "none", stroke: gold, sw: 4, dash: "10 8", at: "@пустым-0.05", enter: grow, glow: {color: "#ffcf6a", r: 12, a: 0.8}}
            - {actor: callout, target: "tomas.top", x: 540, y: 520, title: "ТОМАС — ПУСТОЙ", color: gold, size: 44, space: screen, at: "@пустым", enter: pop, sfx: false}
    sfx:
      - {sound: noise_sweep, at: "@Звезда", gain: -14}
      - {sound: hiss, at: "@тени", gain: -14}
      - {sound: boom, at: "@пустым", gain: -14}

  # ------------------------------------------------------------------ 3. PROBLEM — колокол «покрой огонь»
  - id: problem
    text: "Староста Ульрих не отменил старый закон: вечером колокол велел гасить огни. В ту ночь тени забрали ещё двадцать человек."
    shots:
      - id: p_bell
        transition: {type: whip_y}
        captions_top: 1520
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 420, y: 920}, {t: "@огни", z: 1.0, x: 540, y: 960}, {t: end, z: 1.0, x: 560, y: 970}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: [{at: 0, v: 18.6}, {at: "@закон", v: 19.6, dur: 1.4}], par: 0, sun: false, horizon: 1000, clouds: 3, seed: 5}
            - {actor: forest, x: 540, y: 1000, w: 2100, h: 160, hill: 120, color: "#3a3050", seed: 5, par: 0.2}
            - {actor: ground, x: -520, y: 985, w: 2120, h: 1000, color: ["#3a3048", "#2a2436"], par: 0.2}
            - {actor: cottage, x: 640, y: 1150, scale: 0.6, seed: 31, par: 0.55, brightness: 0.8, lit: [{at: 0, v: 1}, {at: "@гасить", v: 0, dur: 0.3}]}
            - {actor: cottage, x: 860, y: 1150, scale: 0.56, seed: 32, floors: 1, par: 0.55, brightness: 0.8, lit: [{at: 0, v: 1}, {at: "@гасить+0.35", v: 0, dur: 0.3}]}
            - {actor: cottage, x: 1050, y: 1150, scale: 0.6, seed: 33, par: 0.55, brightness: 0.8, lit: [{at: 0, v: 1}, {at: "@гасить+0.7", v: 0, dur: 0.3}]}
            - {actor: ground, x: -520, y: 1135, w: 2120, h: 900, color: ["#4a3e34", "#2e261e"], par: 0.55}
            - {actor: chapel, id: ch, x: 330, y: 1330, scale: 1.05, ring: [{at: 0, v: 0}, {at: "@колокол", v: 1, dur: 0.2}], lit: 0.4}
            - {actor: shape, kind: line, points: [[434, 820], [434, 1180]], stroke: "#c9b48a", sw: 4}
            - {actor: ground, x: -520, y: 1310, w: 2120, h: 800, color: ["#5a4a3a", "#3a3026"]}
            - {actor: person, id: ulrich, x: 470, y: 1360, scale: 0.95, view: side, flip: true, look: *ulrich, face: determined,
               pose: [{at: 0, v: {a1: [150, 10], a2: [160, 0], l1: [2, 0], l2: [-2, 0]}}, {at: "@колокол", v: {a1: [110, 10], a2: [120, 0], l1: [2, 0], l2: [-2, 0]}, dur: 0.4}, {at: "@гасить", v: {a1: [150, 10], a2: [160, 0], l1: [2, 0], l2: [-2, 0]}, dur: 0.4}, {at: "@закон", v: {a1: [110, 10], a2: [120, 0], l1: [2, 0], l2: [-2, 0]}, dur: 0.4}]}
            - {actor: callout, target: "ulrich.top", x: 700, y: 640, title: "ЗАКОН: «ПОКРОЙ ОГОНЬ»", color: gold, size: 42, space: screen, at: "@закон-0.3", enter: pop, sfx: false}
      - id: p_map
        start: "@ночь-0.22"
        transition: {type: zoom}
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.08}]}
          layers:
            - {actor: village_map, x: 540, y: 900, w: 980, h: 980, out: [{at: 0, v: 0}, {at: "@тени", v: 0.45, dur: 1.4, ease: linear}], stain: [{at: 0, v: 0}, {at: "@тени", v: 1, dur: 1.4}]}
            - {<<: *title, y: 300, size: 90, text: "{n} ЗА ОДНУ НОЧЬ", count: {from: 0, to: 20, at: "@тени", dur: 1.0}, at: "@тени", enter: fade}
    sfx:
      - {sound: bell, at: "@колокол", gain: -14}
      - {sound: whoosh, at: "@гасить", gain: -14}
      - {sound: creature, at: "@тени", gain: -14}
      - {sound: kick, at: "@двадцать", gain: -14}

  # ------------------------------------------------------------------ 4. ESCALATION — меч не ранит тень
  - id: escalation
    text: "Сир Годфрид, рыцарь, вышел к теням с мечом. Клинок прошёл насквозь, с шипением, как сквозь дым. А пустые днём молча уходили в лес — копать."
    shots:
      - id: e_knight
        transition: {type: whip_x}
        ambience: [{sound: fire, gain: -20}, {sound: wind, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 980}, {t: end, z: 1.1, y: 940}]}
          layers:
            - *sky_night
            - *forest_night
            - *ground_night_far
            - {actor: cottage, x: 150, y: 1120, scale: 0.75, seed: 3, brightness: 0.6, lit: 0.6}
            - {actor: cottage, x: 930, y: 1120, scale: 0.7, seed: 21, brightness: 0.6, lit: 0.3}
            - {actor: cobbles, x: -300, y: 1100, w: 1680, h: 900, color: "#3a3c4a"}

  # ------------------------------------------------------------------ 5. RULE — законы света
  - id: rule
    text: "Ансельм понял законы света. Один огонь даёт одну длинную тень. Много огней вокруг — тени перекрываются и тают. Нет тени — нет двери. А в полдень тень прячется под ногами."

  # ------------------------------------------------------------------ 8. CTA — огонь или камень?
  - id: cta
    text: "Где ты встретишь затмение: в круге огня или у камня? Финал — в третьей части."
    shots:
      - id: q_choice
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#06070c"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05}]}
          layers:
            - {actor: shape, kind: rect, x: 270, y: 900, w: 540, h: 1000, fill: {radial: ["#7a4a24", "#3a2212", "#0a0806"]}, opacity: [{at: 0, v: 0.2}, {at: "@огня", v: 1, dur: 0.4}]}

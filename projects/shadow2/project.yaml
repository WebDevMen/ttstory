  - id: cliff
    text: "Ансельм открыл звёздные таблицы и побледнел. Через три дня — затмение. Солнце погаснет, и тень будет везде."
    shots:
      - id: z_tables
        transition: {type: zoom}
        captions_top: 1520
        draw:

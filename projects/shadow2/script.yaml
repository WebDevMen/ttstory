brief:
  goal: "Удержать зрителей первой части: ответить на вопрос «одну свечу или ни одной», дать понятные правила выживания и поднять ставки к финалу."
  kpi: [completion, comments, follows, saves, shares]
  audience:
    who: "Зрители первой части и новые зрители, которые любят мистику, фэнтези и «правила выживания» в апокалипсисе"
    age: "16–34"
    interests: [мистика, фэнтези, средневековье, выживание, апокалипсис, сериалы]
    pains: ["вторые части, которые топчутся на месте", "правила, которые меняются, когда удобно автору"]
    desires: ["узнать ответ на вопрос из первой части", "правила, по которым можно «играть» самому", "новый уровень угрозы"]
    knowledge: "Знают из части 1: упала звезда, у людей пропали тени, тень входит через твою собственную тень, брат Марты вернулся пустым, тень Марты двигается сама"
  promise: "Ответ на вопрос из первой части и три правила, как не впустить тень: почему не спасает ни свеча, ни темнота — а спасает круг огня."
  tone: "Напряжённая ночная осада у костров: золото огня против чёрных теней, сдержанный героизм; в конце — холодный ужас перед затмением."
  keywords: ["тени", "без тени", "средневековье", "мистика"]
  constraints:
    - "Вымысел целиком; реальны только физика света и тени, колокол «покрой огонь» и предсказуемость затмений"
    - "Правила мира те же, что в части 1 (series.md): тень входит через твою тень; меч и огонь её не ранят"
    - "Без крови: рыцарь проигрывает не ранами, а тем, что меч проходит сквозь тень"
    - "Длина и структура как у частей 1 и 3: 8 блоков, ~60 с, обрыв и вопрос одним словом"

research:
  summary: >-
    Вторая часть отвечает на вопрос первой («одну свечу или ни одной?») законами света. Один источник даёт одну резкую тень,
    и чем он ниже, тем она длиннее. При нескольких источниках теней несколько, они перекрываются и бледнеют — так устроены
    бестеневые лампы в операционных: свет падает со многих сторон. Солнце в полдень стоит выше всего, и тень короче всего.
    В средневековых городах вечерний колокол велел покрыть огонь (couvre-feu) — в нашей истории этот закон и губит людей.
    Затмения в Средние века умели предсказывать по астрономическим таблицам — монах-звездочёт находит дату.
  facts:
    - id: f1
      text: "Тень — тёмная область, куда свет от источника не доходит, потому что его загораживает предмет."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f2
      text: "Длина тени зависит от высоты источника: у солнца она пропорциональна котангенсу его высоты — у горизонта тени очень длинные, высоко в небе (в полдень) — самые короткие."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f3
      text: "Если источников света несколько, теней тоже несколько и они перекрываются; хирургические светильники созданы, чтобы гасить тени (shadow dilution)."
      source: "https://en.wikipedia.org/wiki/Surgical_lighting"
      confidence: high
    - id: f4
      text: "Curfew — от старофранцузского couvre-feu, «покрой огонь»: по вечернему колоколу огни полагалось закрыть, чтобы деревянные дома не сгорели."
      source: "https://en.wikipedia.org/wiki/Curfew"
      confidence: high
    - id: f5
      text: "В Средние века в Европе зеркала были в основном из полированного металла; стеклянные — редкость."
      source: "https://en.wikipedia.org/wiki/Mirror"
      confidence: high
    - id: f6
      text: "Полное солнечное затмение не может длиться больше 7 минут 32 секунд; в одном месте полное затмение повторяется в среднем раз в 360–410 лет."
      source: "https://en.wikipedia.org/wiki/Solar_eclipse"
      confidence: high
    - id: f7
      text: "Альфонсинские таблицы (Толедо, с 1252 года) давали данные для расчёта положения Солнца, Луны и планет — по таким таблицам средневековые астрономы вычисляли небесные события."
      source: "https://en.wikipedia.org/wiki/Alfonsine_tables"
      confidence: medium
  angles:
    - id: a1
      text: "Правила выживания: ни свеча, ни темнота — только круг огня; рыцарь, которому меч не помог; знак затмения от тени Марты"
      score: 9
      why: "Отвечает на вопрос первой части, даёт «интерактив» (зритель сам проверит тени со свечами), поднимает ставки и обрывается на катастрофе."
    - id: a2
      text: "Часть 2 целиком о пустых: что они копают в лесу"
      score: 7
      why: "Сильная загадка, но без правил выживания вторая часть теряет пользу; загадку оставляем на финал."
    - id: a3
      text: "Бегство из деревни: обоз ночью через лес"
      score: 6
      why: "Динамично, но ломает правило «тень входит через твою тень» — в лесу ночью все погибли бы сразу."
  chosen_angle: a1
  insights:
    - "Ответ «ни одной» — ловушка: темнота тоже опасна, это и есть мини-поворот в начале."
    - "Правило круга огня проверяемо дома: две-три свечи вокруг предмета — и тень бледнеет."
    - "Рыцарь с мечом — ожидаемый «герой» жанра; его бессилие показывает, что здесь работают только правила света."
    - "Знак затмения от тени Марты одновременно отвечает на «зачем её тень двигалась» и открывает финал."

hooks:
  variants:
    - {id: h1, type: contrarian, vo: "Одна свеча открывает дверь тени. Темнота — её дом. Спасает только круг огня.", on_screen: "СПАСАЕТ КРУГ ОГНЯ", visual: "Ночь: один человек со свечой и длинной тенью — тень хватает его; рядом люди в кольце костров, теней нет", score: 9, why: "Отвечает на вопрос части 1 и сразу ломает оба ответа; правило видно на картинке без звука."}
    - {id: h2, type: question, vo: "Одну свечу или ни одной? Неправильно ответили все.", on_screen: "ОШИБЛИСЬ ВСЕ", visual: "Две половины экрана: свеча и темнота, обе перечёркнуты", score: 8, why: "Прямая связь с комментариями к части 1, но новичку непонятно."}
    - {id: h3, type: stakes, vo: "За одну ночь тени забрали двадцать человек. Утром выжившие поняли правило.", on_screen: "20 ЗА ОДНУ НОЧЬ", visual: "Карта деревни, огоньки домов гаснут один за другим", score: 8, why: "Масштаб угрозы и обещание правила."}
    - {id: h4, type: imagine, vo: "Представь: твоя тень — это дверь. И ночью в неё стучат.", on_screen: "ТВОЯ ТЕНЬ — ДВЕРЬ", visual: "Тень человека на стене, в неё изнутри стучит чужая тень", score: 7, why: "Хорошо для новых зрителей, но повторяет правило части 1."}
    - {id: h5, type: visual_shock, vo: "Рыцарь ударил тень мечом. Клинок прошёл насквозь.", on_screen: "МЕЧ НЕ РАНИТ ТЕНЬ", visual: "Меч рыцаря проходит сквозь тень как сквозь дым", score: 7, why: "Эффектный кадр, но без правила нет пользы."}
    - {id: h6, type: list_promise, vo: "Три правила, чтобы тень тебя не забрала. Третье спасло деревню.", on_screen: "3 ПРАВИЛА ВЫЖИВАНИЯ", visual: "Пергамент с тремя пунктами, третий скрыт", score: 7, why: "Обещание пользы, но звучит как инструкция, а не история."}
    - {id: h7, type: curiosity_gap, vo: "Тень Марты нарисовала на земле знак. Монах побледнел.", on_screen: "ЗНАК НА ЗЕМЛЕ", visual: "Тень чертит пальцем круг и чёрный круг на нём", score: 7, why: "Интрига, но раскрывает финальный поворот."}
    - {id: h8, type: callout, vo: "Если ты ответил «ни одной» — ты бы не пережил эту ночь.", on_screen: "«НИ ОДНОЙ» — ОШИБКА", visual: "Тёмная изба, в темноте шевелятся тени", score: 8, why: "Цепляет тех, кто комментировал часть 1; первая фраза длинновата."}
  primary: h1
  ab: [h8, h3]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Спасает круг огня"
    goal: "Ответить на вопрос части 1 и сломать оба ответа: свеча — дверь, темнота — дом тени; открыть петлю «почему круг»."
    vo: "Одна свеча открывает дверь тени. Темнота — её дом. Спасает только круг огня."
    on_screen: "СПАСАЕТ КРУГ ОГНЯ"
    devices: [open_loop, contrast, visual_proof, text_reinforcement, sound_hit]
    facts: [f1]
    music: pulse
    marks: {"круг огня": "#ffb347"}
    accent: "#ffb347"
    shots:
      - id: h_candle
        visual: "Ночная улица Вельмара: крестьянин со свечой у двери дома, за ним по стене тянется длинная тень; к ней из темноты подползает чужая тень. Фон — фахверковые дома и колокольня, синяя мгла."
        actors: [sky, new:cottage, person, new:candle, new:cast_shadow, new:living_shadow, ground]
        camera: "Быстрый наезд на тень у стены"
        animation:
          - {at: "@start", what: "Свеча вспыхивает"}
          - {at: "@свеча", what: "Тень человека вырастает по стене"}
          - {at: "@дверь", what: "Чужая тень входит в его тень, контур вспыхивает"}
        graphics:
          - {at: "@start", type: chip, text: "ЧАСТЬ 2/3 · ПРАВИЛА"}
        sfx:
          - {at: "@start", sound: pop}
          - {at: "@дверь", sound: slam}
        ambience: [wind]
        transition: cut
      - id: h_dark
        at: "@Темнота-0.1"
        visual: "Изба без огня: почти чёрный кадр, на стенах и полу шевелятся и сливаются тени; угадывается силуэт спящей семьи."
        actors: [room, new:living_shadow, person]
        camera: "Медленный дрейф по стене"
        animation:
          - {at: "@Темнота", what: "Свет гаснет, тени заполняют стены"}
        graphics: []
        sfx:
          - {at: "@Темнота", sound: creature}
        transition: dip
      - id: h_ring
        at: "@Спасает-0.1"
        visual: "Церковный двор сверху: кольцо из восьми костров, внутри люди — под ними нет теней; за кольцом в темноте стоят тени и не могут войти."
        actors: [new:bonfire, person, new:living_shadow, new:chapel, ground]
        camera: "Подъём вверх, вид сверху"
        animation:
          - {at: "@Спасает", what: "Костры вспыхивают по кругу один за другим"}
          - {at: "@огня", what: "Тени у кольца отшатываются"}
        graphics:
          - {at: "@огня", type: "text slam", text: "СПАСАЕТ КРУГ ОГНЯ"}
        sfx:
          - {at: "@Спасает", sound: whoosh}
          - {at: "@огня", sound: impact}
        ambience: [fire]
        transition: zoom

  # ------------------------------------------------------------------ 2. CONTEXT — напоминание части 1
  - id: context
    role: context
    title: "Что было"
    goal: "За 5 секунд напомнить часть 1 для новых зрителей: звезда, тени ушли, Томас вернулся пустым."
    vo: "Часть вторая. Звезда упала, тени ушли от людей. Брат Марты вернулся пустым."
    on_screen: "ЧТО БЫЛО В ЧАСТИ 1"
    devices: [callback, progress, pattern_interrupt]
    music: drone
    shots:
      - id: c_recap
        visual: "Быстрая нарезка-повтор части 1 в одном кадре: огненный шар над лесом → площадь, где у людей нет теней; кадр-карточка с меткой «ЧАСТЬ 1»."
        actors: [sky, new:meteor, new:cottage, person, new:cast_shadow, timetag]
        camera: "Быстрая панорама справа налево"
        animation:
          - {at: "@Звезда", what: "Огненный шар падает за лес"}
          - {at: "@тени", what: "Тени жителей тают на площади"}
        graphics:
          - {at: "@Часть", type: timetag, text: "ЧАСТЬ 1 · ЗВЕЗДА"}
        sfx:
          - {at: "@Звезда", sound: noise_sweep}
          - {at: "@тени", sound: hiss}
        transition: whip_x
      - id: c_tomas
        at: "@Брат-0.1"
        visual: "Томас на пороге: бледный, глаза без бликов, под ногами пусто; Марта в дверях за ним."
        actors: [new:cottage, person, new:cast_shadow, sky]
        camera: "Наезд на лицо Томаса"
        animation:
          - {at: "@пустым", what: "Пунктир под ногами: тени нет"}
        graphics:
          - {at: "@пустым", type: callout, text: "ТОМАС — ПУСТОЙ"}
        sfx:
          - {at: "@пустым", sound: boom}
        transition: dip

  # ------------------------------------------------------------------ 3. PROBLEM — закон гасить огни
  - id: problem
    role: problem
    title: "Колокол гасить огни"
    goal: "Конфликт: старый закон «покрой огонь» (реальный обычай) оставляет деревню в темноте — двадцать человек за ночь."
    vo: "Вечером колокол велел гасить огни — так велел старый закон. В ту ночь тени забрали ещё двадцать человек."
    on_screen: "20 ЗА ОДНУ НОЧЬ"
    devices: [stakes_raise, number_reveal, emotion, sound_hit]
    facts: [f4]
    music: tension
    shots:
      - id: p_bell
        visual: "Деревянная колокольня на закате; староста Ульрих (толстый, меховая шапка) дёргает верёвку колокола; на домах одно за другим гаснут окна."
        actors: [new:chapel, person, new:cottage, sky]
        camera: "Снизу вверх на колокол, затем отъезд на деревню"
        animation:
          - {at: "@колокол", what: "Колокол качается, звон расходится кругами"}
          - {at: "@гасить", what: "Окна домов гаснут одно за другим"}
        graphics:
          - {at: "@закон", type: callout, text: "«ПОКРОЙ ОГОНЬ»"}
        sfx:
          - {at: "@колокол", sound: bell}
          - {at: "@гасить", sound: whoosh}
        transition: whip_y
      - id: p_map
        at: "@ночь-0.1"
        visual: "Карта деревни сверху, как на пергаменте: крошечные дома, у каждого огонёк-человек; чёрные тени ползут по улицам, огоньки гаснут; счётчик растёт до 20."
        actors: [new:village_map, new:living_shadow, text]
        camera: "Медленный наезд на центр карты"
        animation:
          - {at: "@тени", what: "Чёрные пятна-тени расползаются по улицам карты"}
          - {at: "@двадцать", what: "Огоньки гаснут, счётчик бежит до двадцати"}
        graphics:
          - {at: "@двадцать", type: counter, text: "20 ЗА ОДНУ НОЧЬ"}
        sfx:
          - {at: "@тени", sound: creature}
          - {at: "@двадцать", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 4. ESCALATION — меч бессилен, пустые копают
  - id: escalation
    role: escalation
    title: "Меч проходит насквозь"
    goal: "Ставки растут: сила бесполезна (новый персонаж — рыцарь), а пустые днём что-то копают в лесу."
    vo: "Сир Годфрид, старый рыцарь, вышел к теням с мечом. Клинок прошёл насквозь, как сквозь дым. А пустые днём молча уходили в лес — копать."
    on_screen: "МЕЧ НЕ РАНИТ ТЕНЬ"
    devices: [stakes_raise, visual_proof, open_loop, pattern_interrupt]
    music: tension
    shots:
      - id: e_knight
        visual: "Ночная улица у колодца: сир Годфрид (седые усы, кольчуга, синий плащ с гербом-львом) с факелом в левой руке и мечом в правой; перед ним встаёт тень выше человеческого роста."
        actors: [person, new:torch, new:living_shadow, new:well, new:cottage, sky, ground]
        camera: "Снизу, медленный наезд на рыцаря"
        animation:
          - {at: "@Годфрид", what: "Рыцарь выходит вперёд, поднимает меч"}
          - {at: "@мечом", what: "Тень вырастает перед ним до крыши"}
        graphics:
          - {at: "@Годфрид", type: callout, text: "СИР ГОДФРИД, РЫЦАРЬ"}
        sfx:
          - {at: "@Годфрид", sound: metal_ring}
        ambience: [fire, wind]
        transition: whip_x
      - id: e_slash
        at: "@Клинок-0.1"
        visual: "Крупно: меч рубит тень, лезвие проходит насквозь, тень рассыпается дымом и тут же собирается снова."
        actors: [new:sword, new:living_shadow, particles]
        camera: "Удар — тряска, затем замедление"
        animation:
          - {at: "@Клинок", what: "Взмах меча, след клинка"}
          - {at: "@насквозь", what: "Лезвие проходит сквозь тень, тень дымом расходится и смыкается"}
        graphics:
          - {at: "@насквозь", type: "text stamp", text: "МЕЧ НЕ РАНИТ ТЕНЬ"}
        sfx:
          - {at: "@Клинок", sound: whoosh}
          - {at: "@насквозь", sound: hiss}
        transition: zoom
      - id: e_dig
        at: "@пустые-0.1"
        visual: "День, лес у воронки: цепочка пустых (Ганс, Томас и другие, без теней на солнечной поляне) молча копают лопатами яму вокруг чёрного камня."
        actors: [new:crater, new:star_stone, person, tree, sky, ground]
        camera: "Медленный отъезд от ямы"
        animation:
          - {at: "@пустые", what: "Пустые бредут в лес цепочкой"}
          - {at: "@копать", what: "Лопаты поднимаются и опускаются в одном ритме"}
        graphics:
          - {at: "@копать", type: callout, text: "ЧТО ОНИ КОПАЮТ?"}
        sfx:
          - {at: "@копать", sound: scrape}
        ambience: [birds]
        transition: dip

  # ------------------------------------------------------------------ 5. PROOF — законы света
  - id: rule
    role: proof
    title: "Законы света"
    goal: "Как это работает: один огонь — длинная тень; огни вокруг — тени тают; в полдень тень под ногами. Закрыть петлю «почему круг»."
    vo: "Ансельм понял законы света. Один огонь даёт одну длинную тень. Много огней вокруг — тени перекрываются и тают. Нет тени — нет двери. А в полдень тень прячется под ногами."
    on_screen: "ОГОНЬ СО ВСЕХ СТОРОН"
    devices: [mini_payoff, visual_proof, save_trigger, text_reinforcement]
    facts: [f1, f2, f3]
    music: pulse
    shots:
      - id: r_one
        visual: "Схема на пергаменте сверху: человек-кружок в центре, один костёр слева — от человека вправо одна длинная чёрная тень."
        actors: [person, new:bonfire, new:cast_shadow, shape, text]
        camera: "Статично, лёгкий наезд"
        animation:
          - {at: "@Ансельм", what: "Пергамент разворачивается, рядом рука монаха с пером"}
          - {at: "@длинную", what: "Тень вытягивается от человека до края листа"}
        graphics:
          - {at: "@Один", type: callout, text: "1 ОГОНЬ = 1 ТЕНЬ"}
        sfx:
          - {at: "@Ансельм", sound: scrape}
          - {at: "@длинную", sound: whoosh}
        transition: whip_x
      - id: r_many
        at: "@Много-0.1"
        visual: "Та же схема: вокруг человека загораются ещё семь огней; восемь бледных теней расходятся лучами и бледнеют, перекрываясь, пока не исчезают."
        actors: [person, new:bonfire, new:cast_shadow, shape, text]
        camera: "Плавный отъезд, чтобы видеть весь круг"
        animation:
          - {at: "@Много", what: "Огни зажигаются по кругу один за другим"}
          - {at: "@тают", what: "Тени бледнеют и пропадают"}
          - {at: "@двери", what: "Вокруг человека вспыхивает золотое кольцо"}
        graphics:
          - {at: "@тают", type: "text slam", text: "ОГОНЬ СО ВСЕХ СТОРОН"}
          - {at: "@двери", type: badge, text: "НЕТ ТЕНИ — НЕТ ДВЕРИ"}
        sfx:
          - {at: "@Много", sound: pop}
          - {at: "@двери", sound: chime}
        transition: zoom
      - id: r_noon
        at: "@полдень-0.1"
        visual: "Схема сбоку: солнце поднимается по дуге от горизонта к зениту; тень человека укорачивается от длинной до пятна под ногами; метка «ПОЛДЕНЬ»."
        actors: [new:sun_arc, person, new:cast_shadow, text]
        camera: "Статично"
        animation:
          - {at: "@полдень", what: "Солнце поднимается по дуге в зенит"}
          - {at: "@ногами", what: "Тень сжимается в пятно под ногами"}
        graphics:
          - {at: "@полдень", type: callout, text: "ПОЛДЕНЬ = КОРОТКАЯ ТЕНЬ"}
        sfx:
          - {at: "@ногами", sound: blip}
        transition: dip

  # ------------------------------------------------------------------ 6. TWIST — тень Марты рисует знак
  - id: sign
    role: twist
    title: "Знак на земле"
    goal: "Поворот: тень Марты не враг — она предупреждает; закрыть загадку из обрыва части 1."
    vo: "На рассвете тень Марты снова ожила. Она не нападала. Она чертила на земле знак: солнце, закрытое чёрным кругом."
    on_screen: "ТЕНЬ ПРЕДУПРЕЖДАЕТ"
    devices: [twist, callback, emotion, visual_proof]
    music: drone
    shots:
      - id: s_dawn
        visual: "Рассвет в церковном дворе: костры догорают, низкое солнце сзади Марты, её длинная тень лежит по земле. Тень сама отделяет руку и тянется к земле; Марта стоит неподвижно."
        actors: [new:chapel, new:bonfire, person, new:cast_shadow, sky, ground]
        camera: "Медленный наезд на тень"
        animation:
          - {at: "@ожила", what: "Тень Марты отделяет руку от силуэта"}
          - {at: "@нападала", what: "Марта отступает на шаг, тень остаётся спокойной"}
        graphics: []
        sfx:
          - {at: "@ожила", sound: creak}
        ambience: [birds, fire]
        transition: dip
      - id: s_draw
        at: "@чертила-0.1"
        visual: "Крупно земля: палец тени проводит по пыли светлый круг-солнце, затем закрашивает его чёрным кругом, оставляя тонкое кольцо."
        actors: [new:living_shadow, shape, ground]
        camera: "Сверху, медленное вращение"
        animation:
          - {at: "@чертила", what: "Палец тени выводит круг"}
          - {at: "@чёрным", what: "Поверх рисуется чёрный круг, остаётся сияющее кольцо"}
        graphics:
          - {at: "@чёрным", type: "text stamp", text: "ТЕНЬ ПРЕДУПРЕЖДАЕТ"}
        sfx:
          - {at: "@чертила", sound: scrape}
          - {at: "@чёрным", sound: impact}
        transition: zoom

  # ------------------------------------------------------------------ 7. PAYOFF — обрыв: затмение
  - id: cliff
    role: payoff
    title: "Через три дня"
    goal: "Обрыв: монах находит дату — затмение; в темноте тень будет везде, а круг огня не спасёт."
    vo: "Ансельм открыл звёздные таблицы и побледнел. Через три дня — затмение. Солнце погаснет, и тень будет везде."
    on_screen: "ЗАТМЕНИЕ ЧЕРЕЗ 3 ДНЯ"
    devices: [stakes_raise, open_loop, number_reveal, sound_hit]
    facts: [f7]
    music: dark
    shots:
      - id: z_tables
        visual: "Келья монаха: Ансельм над раскрытой книгой с таблицами и кругами затмений, рядом астролябия и свеча; его лицо бледнеет в свете."
        actors: [person, new:book, new:astrolabe, new:candle, room]
        camera: "Наезд на книгу, затем на лицо"
        animation:
          - {at: "@таблицы", what: "Палец бежит по таблице и останавливается"}
          - {at: "@побледнел", what: "Лицо монаха бледнеет, свеча вздрагивает"}
        graphics:
          - {at: "@затмение", type: "text slam", text: "ЗАТМЕНИЕ ЧЕРЕЗ 3 ДНЯ"}
        sfx:
          - {at: "@таблицы", sound: scrape}
          - {at: "@затмение", sound: boom}
        transition: zoom
      - id: z_eclipse
        at: "@Солнце-0.1"
        visual: "Деревня днём: тёмный диск луны наползает на солнце, свет гаснет, тени домов и людей растекаются, сливаются и затапливают всю улицу."
        actors: [sky, new:eclipse, new:cottage, new:chapel, new:living_shadow, ground]
        camera: "Медленный отъезд вверх"
        animation:
          - {at: "@Солнце", what: "Луна закрывает солнце"}
          - {at: "@везде", what: "Тени растекаются по всей деревне"}
        graphics: []
        sfx:
          - {at: "@Солнце", sound: riser}
          - {at: "@везде", sound: thunder}
        ambience: [wind]
        transition: dip

  # ------------------------------------------------------------------ 8. CTA
  - id: cta
    role: cta
    title: "Круг огня или камень?"
    goal: "Вопрос-выбор одним словом + обещание финала; последний кадр повторяет первый (кольцо костров)."
    vo: "Где ты встретишь затмение: в круге огня или у камня? Финал — в третьей части."
    on_screen: "ОГОНЬ ИЛИ КАМЕНЬ?"
    devices: [comment_bait, follow_trigger, direct_address, loop_ending]
    music: drone
    shots:
      - id: q_choice
        visual: "Две половины кадра: слева кольцо костров с людьми, справа чёрный камень в воронке; подписи «ОГОНЬ» и «КАМЕНЬ»."
        actors: [new:bonfire, person, new:star_stone, new:crater, text]
        camera: "Лёгкий наезд"
        animation:
          - {at: "@огня", what: "Загорается левая половина"}
          - {at: "@камня", what: "Камень справа медленно поворачивается"}
        graphics:
          - {at: "@огня", type: text, text: "ОГОНЬ"}
          - {at: "@камня", type: text, text: "КАМЕНЬ"}
        sfx:
          - {at: "@огня", sound: pop}
          - {at: "@камня", sound: heartbeat}
        transition: whip_x
      - id: q_loop
        at: "@Финал-0.1"
        visual: "Возврат к кольцу костров сверху, как в первом кадре; один костёр гаснет; снизу плашка «ЧАСТЬ 3 — ЗАТМЕНИЕ»."
        actors: [new:bonfire, person, new:living_shadow, new:chapel, badge]
        camera: "Подъём вверх"
        animation:
          - {at: "@третьей", what: "Один из костров гаснет, тень делает шаг внутрь"}
        graphics:
          - {at: "@третьей", type: badge, text: "ЧАСТЬ 3 — ЗАТМЕНИЕ"}
        sfx:
          - {at: "@третьей", sound: bell}
        transition: dip

loops:
  - {id: l1, question: "Почему спасает именно круг огня?", open: hook, close: rule}
  - {id: l2, question: "Что пустые копают в лесу?", open: escalation, close: cta}
  - {id: l3, question: "Зачем двигалась тень Марты (обрыв части 1)?", open: context, close: sign}
  - {id: l4, question: "Что будет, когда погаснет солнце?", open: cliff, close: cta}

engagement:

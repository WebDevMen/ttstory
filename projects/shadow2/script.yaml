  theme: {preset: minimal, accent: "#ffb347", captions: clean}
  palette: ["#0b1022 ночь", "#ffb347 костры", "#08080c живые тени", "#e8dcc0 пергамент", "#3a5a8a сталь рыцаря", "#c94a3a тревога"]
  music: {key: D, mode: minor, bpm: 88}
  assets:
    - "Актёры из части 1: cottage, chapel, well, crater, star_stone, meteor, torch, candle, astrolabe, book, cast_shadow, living_shadow"
    - "Новые: bonfire (костёр с ореолом света), sword (меч со следом удара), village_map (карта-пергамент деревни с огоньками домов), sun_arc (дуга солнца для схемы полудня), eclipse (диск луны на солнце, корона)"
    - "person: доспех рыцаря (кольчуга, плащ с гербом), староста в меховой шапке"

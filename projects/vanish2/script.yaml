          - {at: "@троих", what: "Карточка правила"}
        graphics:
          - {at: "@троих", type: rule_card, text: "ВЪЕХАЛ → ПРОПАЛ СО СНИМКОВ"}
        sfx:
          - {at: "@троих", sound: boom}
        transition: cut

  # ------------------------------------------------------------------ 7. STAMP — повторы на снимках: город закрашен штампом (улика 2)
  - id: stamp
    role: escalation
    title: "Штамп"
    goal: "Лена смотрит как ретушёр: повторы волн, облаков и окон — Заречье закрашено штампом."
    vo: "Ира учила Лену смотреть, как ретушёр. Искать повторы. Одна и та же волна на реке трижды. Одно облако четыре раза. В пяти окнах один и тот же мужчина поливает цветок. Это штамп. Город закрасили, как дыру на снимке."
    scene: {when: "10:25", where: "кухня Лены, снимок Заречья на экране"}
    on_screen: "ПОВТОРЫ — СЛЕД ШТАМПА"
    devices: [visual_proof, callback, mini_payoff, progress]
    facts: [f2]
    music: pulse
    shots:
      - id: m_river
        visual: "Снимок набережной увеличен: на реке три одинаковые волны с одинаковым бликом — три одинаковые рамки «КОПИЯ»."
        actors: [photo, new:river]
        camera: "Резкий наезд в пиксели"
        animation:
          - {at: "@учила", what: "Снимок набережной на экране"}
          - {at: "@повторы", what: "Курсор начинает поиск — сетка поверх"}
          - {at: "@волна", what: "Рамки вокруг трёх одинаковых волн"}
        graphics:
          - {at: "@трижды", type: chip, text: "КОПИЯ ×3"}
        sfx:
          - {at: "@трижды", sound: blip}
        transition: zoom
      - id: m_cloud
        at: "@облако-0.1"
        visual: "Небо над Заречьем: четыре одинаковых облака одной формы в ряд, рамки «КОПИЯ»."
        actors: [photo, cloud, sky, skyline]
        camera: "Панорама по небу"
        animation:
          - {at: "@четыре", what: "Четыре рамки вокруг облаков"}
        graphics:
          - {at: "@четыре", type: chip, text: "КОПИЯ ×4"}
        sfx:
          - {at: "@четыре", sound: blip}
        transition: cut
      - id: m_windows
        at: "@пяти-0.1"
        visual: "Фасад дома в Заречье: в пяти окнах один и тот же мужчина в майке поливает один и тот же цветок одной и той же лейкой — синхронно."
        actors: [photo, building, figure, new:window_man]
        camera: "Отъезд — весь фасад"
        animation:
          - {at: "@поливает", what: "Пять одинаковых мужчин синхронно наклоняют лейки"}
        graphics:
          - {at: "@цветок", type: chip, text: "КОПИЯ ×5"}
        sfx:
          - {at: "@поливает", sound: blip}
        transition: cut
      - id: m_stamp
        at: "@штамп-0.1"
        visual: "Экран ретуши: курсор-штамп кружит над снимком Заречья и кладёт копии — волна, облако, окно; под ними видна степь из части 1."
        actors: [retouch_screen, photo, satellite]
        camera: "Медленный наезд на курсор"
        animation:
          - {at: "@штамп", what: "Курсор-штамп кладёт копию"}
          - {at: "@дыру", what: "Под копией на миг проступает степь"}
        graphics:
          - {at: "@дыру", type: text, text: "ГОРОД ЗАКРАСИЛИ"}
        sfx:
          - {at: "@штамп", sound: click}
          - {at: "@дыру", sound: glitch}
        transition: cut

  # ------------------------------------------------------------------ 8. TWIST — последний снимок: Ира с запиской «Это заплатка. Не езжай»
  - id: twist
    role: twist
    title: "Заплатка"
    goal: "Щелчок: Ира смотрит в объектив с запиской; Заречье — заплатка на месте Ольховска, и Ира внутри."
    vo: "Последний снимок. Ира смотрит прямо в объектив. В руке листок. Почерк Иры. Это заплатка. Не езжай. Заречье — не город. Мир закрашивает дыру на месте Ольховска копиями. А Ира внутри."
    scene: {when: "10:31", where: "галерея Лены, последний снимок"}
    on_screen: "ЭТО ЗАПЛАТКА. НЕ ЕЗЖАЙ"
    devices: [twist, callback, emotion, visual_proof, rewatch_trigger]
    music: sub
    marks: {"Не езжай": "#ffb23e"}
    shots:
      - id: t_last
        visual: "Галерея: последний снимок 214/214 открывается — набережная, и на переднем плане Ира смотрит прямо в объектив."
        actors: [phone, photo, figure, new:river]
        camera: "Наезд на лицо Иры"
        animation:
          - {at: "@Последний", what: "Снимок открывается"}
          - {at: "@объектив", what: "Ира смотрит в кадр"}
        graphics:

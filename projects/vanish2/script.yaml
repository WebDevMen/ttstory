    vo: "Десять ноль девять. Лена вдруг помнит Заречье. Запах реки. Скрип карусели. Дорогу в школу мимо синей двери. Как в пять лет упала с карусели. Под снимком тысячи комментариев: я там вырос. Никто там не был. Прошло семь минут."

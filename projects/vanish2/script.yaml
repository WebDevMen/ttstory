brief:
  goal: "Удержать зрителей части 1: ответить, куда делась Ира, дать новое понятное правило (место на снимке → память), поднять ставку до ребёнка героини и оставить спор «поехал бы ты в город, который помнишь»."
  kpi: [completion, comments, follows, rewatch, shares]
  audience:
    who: "Зрители части 1 и новички из ленты: мистика, «Чёрное зеркало», эффект Манделы, страшилки-«свидетельства»"
    age: "16–34"
    interests: [мистика, фантастика, эффект Манделы, ложные воспоминания, фотография, «Чёрное зеркало»]
    pains: ["вторые части, которые пересказывают первую", "непонятно, кто теперь герой", "обрыв без ответа на прошлый обрыв"]
    desires: ["узнать, что стало с Ирой", "новое правило, которое можно примерить на себя", "жуть из своего телефона — галерея со снимками, которых ты не делал"]
    knowledge: "Часть 1 могли не смотреть: правило «снимок → 7 минут → память» и Ира объясняются заново одной фразой"
  promise: "Одна история Лены: на месте пропавшего Ольховска появляется город Заречье, через семь минут его помнят все, в галерее — двести снимков оттуда, и на каждом пропавшая Ира с запиской «Не езжай»."
  tone: "Тихое бытовое утро на кухне, детский рисунок, солнце; жуть — в собственной галерее телефона и в памяти, которой не было. Чем больше масштаб — тем спокойнее подача: спутник, комментарии, дрон над трассой."
  keywords: ["город, которого не было", "ложные воспоминания", "эффект Манделы", "мистика", "фотография"]
  constraints:
    - "Вымысел целиком: Лена, Тёма, Сергей, Ира, Ольховск и Заречье придуманы; реальны ложные воспоминания по поддельному фото, штамп в ретуши, город-ловушка Агло на картах, ежедневная спутниковая съёмка"
    - "Одна точка зрения — Лена: зритель видит только её кухню, её галерею, новости и двор"
    - "Правила части 1 действуют (снимок → 7 минут → память; снимок опережает мир); в этой части два новых правила, оба проверены с цифрами"
    - "Без монстров, крови, силуэтов и дыма: места и люди просто появляются и пропадают; 13+"
    - "Идея пользователя «фотографии мест, которых никогда не существовало, но все начинают помнить» — ядро части; ответ части 1: Ира не умерла, она внутри «заплатки»"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах. Ретушёр закрывает дыру на снимке штампом — копирует соседний кусок
    фона; поэтому на подделке повторяются волны, облака и окна. По поддельной фотографии люди уверенно «вспоминают» то,
    чего не было: в опыте 2002 года половина участников вспомнила полёт на воздушном шаре. Город Агло существовал только на
    карте как ловушка картографов — а потом там появился магазин с этим названием, и город стал «настоящим». Спутники снимают
    всю сушу каждый день, поэтому новый город на снимке увидели бы сразу.
  facts:
    - id: f1
      text: "Опыт Wade, Garry, Read, Lindsay (2002): по поддельной фотографии полёта на воздушном шаре половина участников создала полное или частичное ложное воспоминание."
      source: "https://link.springer.com/article/10.3758/BF03196318"
      confidence: high
    - id: f2
      text: "Инструмент «штамп» (Clone Stamp) копирует пиксели из одной части снимка в другую — так ретушёры закрывают лишнее; след подделки — повторяющиеся фрагменты фона."
      source: "https://en.wikipedia.org/wiki/Clone_tool"
      confidence: medium
    - id: f3
      text: "Агло (штат Нью-Йорк) — несуществующий город, который картографы General Drafting в 1930-х нанесли на карту как ловушку для копировщиков; позже рядом появился магазин «Agloe General Store», и название стало «настоящим»."
      source: "https://en.wikipedia.org/wiki/Agloe,_New_York"
      confidence: high
    - id: f4
      text: "Спутники PlanetScope (Planet) снимают всю сушу Земли каждый день с разрешением около трёх метров."
      source: "https://www.earthdata.nasa.gov/about/csda/vendor-planet"
      confidence: medium
    - id: f5
      text: "Эффект Манделы — название для массовых одинаковых ложных воспоминаний: многие люди уверенно помнят событие или деталь, которых не было."
      source: "https://en.wikipedia.org/wiki/False_memory#Mandela_effect"
      confidence: medium
  angles:
    - id: a1
      archetype: rule_break
      text: "Мир закрашивает дыру, как ретушёр: на месте пропавшего города появляется другой, и через семь минут все его помнят"
      paradox: "Самое надёжное, что у нас есть, — память о доме — оказалось заплаткой; и именно тот город, который ты помнишь лучше всех, никогда не существовал"
      score: 9
      why: "Продолжает правило части 1 зеркально (там память стиралась — здесь появляется), даёт картинку без звука (новый город на спутнике) и личную ставку — сын хочет «домой»."
    - id: a2
      archetype: unreliable
      text: "Героиня вспоминает детство в городе, где никогда не была — и зритель видит, как воспоминание «докрашивается» на её глазах"
      paradox: "Чем ярче воспоминание, тем оно фальшивее"
      score: 8
      why: "Сильно, но без внешнего события это внутренний монолог; взято внутрь a1 как бит «Семь минут»."
    - id: a3
      archetype: what_if
      text: "Что если в твоей галерее появились двести снимков места, где ты никогда не был"
      paradox: "Телефон помнит то, чего с тобой не было"
      score: 8
      why: "Отличная бытовая зацепка; стала инцидентом внутри a1."
    - id: a4
      archetype: inhuman_pov
      text: "История глазами самой заплатки — города, который хочет, чтобы в нём жили"
      paradox: "Город-копия зовёт людей домой, потому что без них он пустой"
      score: 6
      why: "Холодно и без героя; оставлено на часть 3."
  chosen_angle: a1
  insights:
    - "Новый город на месте степи из обрыва части 1 понятен без звука за секунду — лучший первый кадр и прямой мост между частями."
    - "Правило зеркальное: в части 1 через семь минут забывают пропавших, здесь через семь минут вспоминают несуществующее — новичок понимает его без части 1."
    - "Лена помнит Иру, потому что не видела её пустое селфи, — правило части 1 объясняет, почему героиня части 2 знает, что ищет."
    - "Ира на заднем плане всех снимков Заречья — улика для зрителей части 1 и пасхалка для пересмотра; её записка закрывает обрыв части 1."
    - "Ставка — ребёнок: Тёма «помнит» дом с синей дверью и рвётся туда; выбор «поехать вместе или удержать» понятен любому родителю."

story:
  logline: "Лена, администратор ателье и мама семилетнего Тёмы, хочет понять, откуда взялся город, который все вдруг помнят, но кто туда въезжает, пропадает из этого мира, а сын рвётся «домой»; не удержит — потеряет его."
  retell: "На месте пропавшего Ольховска появилось Заречье, и через семь минут его помнят все. На каждом снимке оттуда — пропавшая Ира с запиской «Это заплатка, не езжай». Сын Лены рвётся туда, а в галерее уже снимок, где они вдвоём в Заречье."
  premise: "Что если на месте исчезнувшего города появляется другой — и через семь минут все его помнят, хотя никто там не был?"
  paradox: "Город, который ты помнишь лучше всего, никогда не существовал; а единственный, кто знает правду, живёт внутри него"
  genre: "мистическая фантастика, глобальная аномалия"
  series: {name: "Выпадение", part: 2, of: 3, prev: vanish, answers: "Что стало с Ирой после селфи без себя? — она не исчезла совсем: она внутри Заречья, заплатки на месте Ольховска, и предупреждает «Не езжай»", cliff: "В галерее снимок из будущего: Лена и Тёма в Заречье в 11:30 — снимок опережает мир"}
  world_rules:
    - id: r3
      rule: "Место, которое появилось на снимках, через семь минут помнят все — даже те, кто там никогда не был"
      test: "Заречье на спутнике в 10:02; в 10:09 Лена помнит запах реки, карусель и дорогу в школу мимо синей двери"
      shown_in: rule
      basis: f1
    - id: r4
      rule: "Кто въезжает в Заречье, пропадает со снимков этого мира — а дальше по правилу части 1 и из памяти"
      test: "Сосед Сергей уезжает в 10:20; в 10:21 его нет на снимке летних шашлыков, а жена накрывает стол на троих"
      shown_in: sergey
      basis: f3
  characters:
    - id: lena
      name: "Лена"
      intro: "Лена, двадцать шесть лет, администратор ателье на Садовой."
      role: "героиня, точка зрения; коллега Иры из части 1, мама Тёмы"
      want: "понять, откуда город, который все помнят, и не отпустить туда сына"
      fear: "что сын помнит дом, которого нет, лучше, чем свой"
      look: "рыжее каре, зелёное платье, домашний кардиган; телефон в руке"
      arc: "от «мы там никогда не были» — к собственным воспоминаниям о Заречье — к снимку, где она сама уже там"
    - id: tema
      name: "Тёма"
      intro: "Сын Тёма, семь лет, рисует дом с синей дверью."
      role: "сын Лены; первым «вспоминает» Заречье"
      want: "домой — в дом с синей дверью"
      fear: "что мама не поедет"
      look: "жёлтая футболка, вихор, фломастеры; потом — куртка и рюкзак у двери"
      arc: "рисунок дома → «это наш дом» → в куртке у двери → на снимке у карусели"
    - id: ira
      name: "Ира"
      intro: "Семь минут назад её коллега Ира сделала селфи и пропала."
      role: "ретушёр, героиня части 1; теперь — только на снимках Заречья, на заднем плане"
      want: "предупредить: не езжайте"
      fear: "что Лена не заметит"
      look: "тёмный пучок, бежевый свитер, два стакана кофе"
      arc: "пропала в части 1 → женщина на заднем плане → смотрит в объектив с запиской → качает головой на снимке из будущего"
    - id: sergey
      name: "Сергей"
      intro: "Сосед Сергей грузит машину."
      role: "сосед Лены; проверка правила r4"
      want: "домой, в Заречье, которое он «вспомнил»"
      fear: "—"
      look: "клетчатая рубашка, кепка, коробки в багажнике"
      arc: "«я вспомнил, где мой дом» → уезжает → пропадает со снимка шашлыков"
  twists:
    - id: t1
      what: "Заречье — не город, а заплатка: мир закрашивает дыру на месте Ольховска копиями, как ретушёр штампом; Ира внутри и предупреждает «Не езжай»"
      setup: [problem, clue, stamp]
      payoff: twist
    - id: t2
      what: "Снимок опережает мир (правило части 1): в галерее появляется снимок, где Лена и Тёма у карусели в Заречье через полчаса — значит, они поедут"
      setup: [setup, rule, dilemma]
      payoff: cliff
  dilemmas:
    - id: d1
      beat: dilemma
      who: lena
      question: "Поехать с сыном в город, который они оба помнят, или удержать его здесь, как велела Ира?"
      options: ["Поехать: быть с Тёмой, даже если их обоих сотрёт со снимков этого мира и из памяти", "Остаться: послушать Иру — но Тёму уже закрашивают на снимках, и он может пропасть без неё"]
  stakes:
    - {beat: setup, level: family}
    - {beat: problem, level: family}
    - {beat: rule, level: community}
    - {beat: clue, level: personal}
    - {beat: sergey, level: community}
    - {beat: stamp, level: world}
    - {beat: twist, level: world}
    - {beat: road, level: world}
    - {beat: dilemma, level: family}
    - {beat: cliff, level: family}


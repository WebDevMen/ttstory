        transition: cut
      - id: t_note
        at: "@руке-0.1"
        visual: "Крупно: рука Иры держит тетрадный листок, на нём маркером «ЭТО ЗАПЛАТКА. НЕ ЕЗЖАЙ»."
        actors: [photo, new:note, human_hand]
        camera: "Сверхкрупно, медленный наезд"
        animation:
          - {at: "@заплатка", what: "Первая строка проступает"}
          - {at: "@езжай", what: "Вторая строка"}
        graphics:
          - {at: "@езжай", type: text, text: "НЕ ЕЗЖАЙ"}
        sfx:
          - {at: "@заплатка", sound: heartbeat}
          - {at: "@езжай", sound: heartbeat}
        transition: cut
      - id: t_patch
        at: "@Заречье-0.1"
        visual: "Спутник: снимок Заречья, и поверх ровным контуром — граница бывшего Ольховска; внутри контура видно, что город сложен из повторяющихся кусков, как заплатка на ткани."
        actors: [satellite, evidence]
        camera: "Отъезд — весь контур"
        animation:
          - {at: "@город", what: "Контур Ольховска рисуется по краю Заречья"}
          - {at: "@копиями", what: "Одинаковые куски подсвечиваются"}
        graphics:
          - {at: "@копиями", type: text, text: "ЗАПЛАТКА НА МЕСТЕ ОЛЬХОВСКА"}
        sfx:
          - {at: "@дыру", sound: boom}
        transition: cut
      - id: t_inside
        at: "@Ира#2-0.1"
        visual: "Снимок набережной: Ира стоит одна у перил с двумя стаканами, а вокруг неё одинаковые волны и облака — она внутри копии."
        actors: [photo, figure, new:river, cloud]
        camera: "Очень медленный отъезд"
        animation:
          - {at: "@внутри", what: "Камера отъезжает — повторы вокруг Иры"}
        graphics:
          - {at: "@внутри", type: text, text: "ИРА ВНУТРИ"}
        sfx:
          - {at: "@внутри", sound: gong}
        transition: dip

  # ------------------------------------------------------------------ 9. ROAD — дрон над трассой: машины гаснут под знаком
  - id: road
    role: escalation
    title: "Трасса на Заречье"
    goal: "Масштаб мира: тысячи едут «домой» и пропадают со снимков на въезде."
    vo: "Десять сорок. Съёмка с дрона. Трасса на Заречье. Пробка на сорок километров. Все едут домой, где не были ни разу. Под знаком Заречье машины гаснут одна за другой. Новости называют это переездом. Для этого мира их больше нет."
    scene: {when: "10:40", where: "трасса на Заречье, вид с дрона в новостях"}
    on_screen: "10:40 · ТРАССА НА ЗАРЕЧЬЕ"
    devices: [stakes_raise, visual_proof, number_reveal, contrast]
    music: epic
    shots:
      - id: w_drone
        visual: "Вид сверху с дрона: трасса через поле, две полосы, плотная пробка в одну сторону; встречная пуста. Оверлей дрона: высота, REC, 10:40."
        actors: [new:highway_top, drone_hud]
        camera: "Медленный дрейф дрона вдоль трассы"
        animation:
          - {at: "@Съёмка", what: "Дрон дрейфует над пробкой"}
        graphics:
          - {at: "@Десять", type: chip, text: "10:40 · ДРОН"}
        sfx:
          - {at: "@Съёмка", sound: blip}
        ambience: [wind, city]
        transition: cut
      - id: w_jam
        at: "@Пробка-0.1"
        visual: "Дрон поднимается выше: пробка тянется до горизонта; счётчик «40 КМ»."
        actors: [new:highway_top, drone_hud]
        camera: "Подъём дрона, отъезд"
        animation:
          - {at: "@сорок#2", what: "Пробка вытягивается до горизонта"}
          - {at: "@домой", what: "Дрон проходит над колонной"}
          - {at: "@ни", what: "Встречная полоса пуста"}
        graphics:
          - {at: "@сорок#2", type: counter, text: "ПРОБКА 40 КМ"}
        sfx:
          - {at: "@сорок#2", sound: noise_sweep}
        transition: cut
      - id: w_sign
        at: "@Под-0.1"
        visual: "Дрон над въездом: зелёный знак «ЗАРЕЧЬЕ» над дорогой; машины доезжают до линии знака и гаснут на снимке одна за другой — короткая помеха, пустая полоса."
        actors: [new:highway_top, drone_hud]
        camera: "Дрон снижается к знаку"
        animation:
          - {at: "@знаком", what: "Знак «ЗАРЕЧЬЕ» в кадре"}
          - {at: "@гаснут", what: "Машины гаснут у знака одна за другой"}
          - {at: "@другой", what: "Гаснет ещё одна машина"}
          - {at: "@переездом", what: "Бегущая строка «ПЕРЕЕЗД»"}
        graphics:
          - {at: "@гаснут", type: chip, text: "ВЪЕЗД · ЗАРЕЧЬЕ"}
        sfx:
          - {at: "@гаснут", sound: glitch}
        transition: cut
      - id: w_none
        at: "@Для-0.1"
        visual: "Лист дела: таймлайн «ВЪЕЗД → СНИМКИ → ПАМЯТЬ», счётчик «ПРОПАЛИ СО СНИМКОВ: 12 408»."
        actors: [timeline, rule_card, evidence]
        camera: "Наезд"
        animation:
          - {at: "@больше", what: "Счётчик растёт"}
        graphics:
          - {at: "@больше", type: counter, text: "ПРОПАЛИ СО СНИМКОВ 12 408"}
        sfx:
          - {at: "@нет", sound: slam}
        transition: cut

  # ------------------------------------------------------------------ 10. DILEMMA — Тёма у двери; его уже закрашивают
  - id: dilemma
    role: escalation
    title: "Поехали домой"
    goal: "Выбор с ценой: удержать сына, как велела Ира, — но его уже закрашивают на снимках; или поехать вместе."
    vo: "Тёма стоит у двери в куртке. Мам, поехали домой. Ира сказала не ехать. Лена смотрит на фото Тёмы на холодильнике. За его спиной трижды повторяется одна ветка. Его уже закрашивают. Поехать с ним? Или удержать?"
    lines:
      - {who: tema, say: "Мам, поехали домой."}
      - {who: lena, say: "Ира сказала не ехать."}
    scene: {when: "10:52", where: "прихожая и кухня Лены"}
    on_screen: "ПОЕХАТЬ С НИМ?"
    devices: [comment_bait, emotion, contrast, stakes_raise, callback]
    music: drone
    shots:
      - id: d_door
        visual: "Прихожая: Тёма в куртке и с рюкзаком у входной двери, держит свой рисунок дома с синей дверью; Лена в проёме кухни."
        actors: [figure, new:hallway, new:drawing]
        camera: "Медленный отъезд"
        animation:
          - {at: "@куртке", what: "Тёма поправляет рюкзак"}
          - {at: "@домой", what: "Тёма протягивает рисунок"}
        graphics:
          - {at: "@домой", type: text, text: "«ПОЕХАЛИ ДОМОЙ»"}

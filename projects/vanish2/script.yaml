      - id: d_no
        at: "@Ира-0.1"
        visual: "Лена крупно, за ней кухня; в руке телефон с запиской Иры на экране."
        actors: [figure, new:kitchen, phone]
        camera: "Наезд на лицо"
        animation:
          - {at: "@ехать", what: "Лена сжимает телефон"}
        graphics:
          - {at: "@ехать", type: chip, text: "«НЕ ЕЗЖАЙ»"}
        sfx:
          - {at: "@ехать", sound: blip}
        transition: cut
      - id: d_fridge
        at: "@фото-0.1"
        visual: "Холодильник: на магните фото Тёмы на качелях во дворе; за его спиной три одинаковые ветки — рамки «КОПИЯ», край снимка рябит."
        actors: [new:fridge, photo, figure, branch]
        camera: "Медленный наезд на фото"
        animation:
          - {at: "@повторяется", what: "Рамки вокруг трёх одинаковых веток"}
          - {at: "@закрашивают", what: "Край снимка рябит"}
        graphics:
          - {at: "@закрашивают", type: text, text: "ЕГО УЖЕ ЗАКРАШИВАЮТ"}
        sfx:
          - {at: "@закрашивают", sound: glitch}
        transition: cut
      - id: d_choice
        at: "@Поехать-0.1"
        visual: "Лист дела: выбор «ПОЕХАТЬ С НИМ» / «УДЕРЖАТЬ ЗДЕСЬ»."
        actors: [card, figure]
        camera: "Статично"
        animation:
          - {at: "@Поехать", what: "Карточка «ПОЕХАТЬ С НИМ»"}
          - {at: "@удержать", what: "Карточка «УДЕРЖАТЬ ЗДЕСЬ»"}
        graphics:
          - {at: "@удержать", type: card, text: "ПОЕХАТЬ / УДЕРЖАТЬ"}
        sfx:
          - {at: "@Поехать", sound: click}
          - {at: "@удержать", sound: click}
        transition: cut

  # ------------------------------------------------------------------ 11. CLIFF — снимок из будущего: они у карусели в 11:30
  - id: cliff
    role: cliffhanger
    title: "Одиннадцать тридцать"
    goal: "Обрыв: в галерее снимок, где Лена и Тёма у карусели в Заречье; дата — через полчаса; Ира за ними качает головой."
    vo: "Десять пятьдесят восемь. Телефон звенит. Новый снимок. Лена и Тёма у карусели в Заречье. Улыбаются. Дата: сегодня, одиннадцать тридцать. Сейчас десять пятьдесят восемь. Лена ещё ничего не решила. А за ними Ира. Качает головой."
    scene: {when: "10:58", where: "прихожая Лены, экран телефона"}
    on_screen: "11:30 · ЕЩЁ НЕ НАСТУПИЛО"
    devices: [twist, sound_hit, visual_proof, rewatch_trigger, pattern_interrupt]
    music: silence
    shots:
      - id: f_buzz
        visual: "Телефон в руке Лены вибрирует: «+1 ФОТО · 10:58»."
        actors: [phone, buzz, human_hand]
        camera: "Крупно экран"
        animation:
          - {at: "@звенит", what: "Вибрация, уведомление"}
        graphics:

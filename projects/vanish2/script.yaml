        sfx:
          - {at: "@звенит", sound: buzz}
        transition: cut
      - id: f_photo
        at: "@Лена-0.1"
        visual: "Снимок-отпечаток: Лена и Тёма у карусели в солнечном парке, обнимаются, смеются; Тёма в той же куртке и с тем же рюкзаком."
        actors: [photo, new:carousel, figure]
        camera: "Медленный наезд"
        animation:
          - {at: "@Улыбаются", what: "Блик по глянцу"}
        graphics:
          - {at: "@Заречье", type: chip, text: "ЗАРЕЧЬЕ"}
        sfx:
          - {at: "@Лена", sound: shutter}
        transition: cut
      - id: f_date
        at: "@Дата-0.1"
        visual: "Наезд на оранжевую дату в углу снимка: «СЕГОДНЯ 11:30»; рядом часы телефона — 10:58."
        actors: [photo, text]
        camera: "Сверхкрупно на дату"
        animation:
          - {at: "@тридцать", what: "Дата вспыхивает"}
          - {at: "@Сейчас", what: "Часы телефона 10:58 рядом"}
          - {at: "@решила", what: "Лёгкий наезд на дату"}
        graphics:
          - {at: "@тридцать", type: text, text: "11:30 · ЕЩЁ НЕ НАСТУПИЛО"}
        sfx:
          - {at: "@тридцать", sound: boom}
        transition: zoom
      - id: f_ira
        at: "@за-0.1"
        visual: "Отъезд по снимку: за Леной и Тёмой у карусели — Ира с двумя стаканами; медленно качает головой."
        actors: [photo, new:carousel, figure]
        camera: "Очень медленный отъезд"
        animation:
          - {at: "@Качает", what: "Ира качает головой"}
        graphics:
          - {at: "@головой", type: chip, text: "ИРА"}
        sfx:
          - {at: "@Качает", sound: hiss}
        transition: fade

  # ------------------------------------------------------------------ 12. CTA — правило части 1 замыкает обрыв + вопрос + часть 3
  - id: cta
    role: cta
    title: "Ты бы поехал?"
    goal: "Правило «снимок опережает мир» из части 1 делает обрыв страшным; вопрос на одно слово; третья часть."
    vo: "Снимок всегда опережает мир. Значит, они поедут. Ты бы поехал в город, который помнишь, но где никогда не был? Да или нет? В третьей части Лена войдёт в заплатку."
    on_screen: "ТЫ БЫ ПОЕХАЛ?"
    devices: [comment_bait, follow_trigger, callback, rewatch_trigger]
    music: drone
    shots:
      - id: z_rule
        visual: "Лист дела части 1: таймлайн «СНИМОК → 28 МИН → МИР»; рядом снимок у карусели с датой 11:30, стрелка от 10:58 к 11:30."
        actors: [timeline, rule_card, photo]
        camera: "Панорама вдоль таймлайна"
        animation:
          - {at: "@опережает", what: "Стрелка растёт к 11:30"}
        graphics:
          - {at: "@поедут", type: text, text: "СНИМОК ОПЕРЕЖАЕТ МИР"}
        sfx:
          - {at: "@поедут", sound: boom}
        transition: dissolve
      - id: z_cta
        at: "@Ты-0.1"
        visual: "Знак на трассе «ЗАРЕЧЬЕ» крупно на фоне пустой дороги; вопрос «ТЫ БЫ ПОЕХАЛ? ДА / НЕТ»."
        actors: [new:highway_top, text, card]
        camera: "Медленный наезд на знак"
        animation:
          - {at: "@помнишь", what: "Знак проступает"}
          - {at: "@никогда", what: "Наезд на знак"}
          - {at: "@Да", what: "Кнопки ДА / НЕТ"}
        graphics:
          - {at: "@поехал", type: text, text: "ДА ИЛИ НЕТ?"}
        sfx:
          - {at: "@поехал", sound: click}
        transition: cut
      - id: z_part3
        at: "@третьей-0.4"
        visual: "Спутник: Заречье, контур заплатки пульсирует; карточка «ЧАСТЬ 3: ВНУТРИ ЗАПЛАТКИ»."
        actors: [satellite, card]
        camera: "Медленный наезд"
        animation:
          - {at: "@третьей", what: "Контур заплатки пульсирует"}
          - {at: "@Лена", what: "Наезд на набережную внутри контура"}
          - {at: "@заплатку", what: "Карточка «ЧАСТЬ 3»"}
        graphics:
          - {at: "@заплатку", type: card, text: "ЧАСТЬ 3: ВНУТРИ ЗАПЛАТКИ"}
        sfx:
          - {at: "@войдёт", sound: riser}
        transition: dissolve

loops:
  - {id: l1, question: "Что стало с Ирой после селфи (обрыв части 1)?", open: setup, close: twist}
  - {id: l2, question: "Откуда город, который все помнят?", open: hook, close: twist}
  - {id: l3, question: "Поедут ли Лена и Тёма в Заречье?", open: dilemma, close: cta}
  - {id: l4, question: "Что внутри заплатки?", open: cliff, close: cta}

engagement:
  comment: "Ты бы поехал в город, который помнишь, но где никогда не был? Да или нет."
  share: "Переслать тому, с кем вы вспоминаете одно и то же детство, — «а ты точно там был?»."
  save: "Сохранить правила серии: снимок → 7 минут → память; въехал в Заречье → пропал со снимков; снимок опережает мир."
  follow: "Подписка на третью часть: Лена входит в заплатку."
  rewatch: "Ира с двумя стаканами есть уже на сетке галереи в 10:03 — до того, как Лена её замечает."
  cta: {beat: cta, text: "Ты бы поехал? Да или нет", type: comment}


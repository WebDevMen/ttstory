# СЦЕНАРИЙ: «Выпадение. Часть 2: Город, которого не было» — одна история, ~3 минуты (вымысел, мистическая фантастика).
# Продолжение projects/vanish: на месте стёртого Ольховска появляется город Заречье, и через семь минут его «помнят» все.
# Героиня-точка зрения — Лена (коллега Иры из части 1), реплики героев своими голосами, два новых правила мира с цифрами
# (новое место → 7 минут → память; въехал в Заречье → пропал со снимков этого мира), улика «Ира на заднем плане» трижды,
# дилемма «поехать с сыном или удержать его». Проверка: python3 vg.py script check vanish2 [--tts] · документ: script render

version: 1

meta:
  title: "Выпадение. Часть 2: Город, которого не было"
  topic: "На месте исчезнувшего города появляется другой — и через семь минут его вспоминают все, даже те, кто там никогда не был (мистическая фантастика, вымысел, часть 2)"
  wishes: "Вторая часть «Люди выпадают из фотографий»: люди находят фотографии мест, которых никогда не существовало, но которые все внезапно начинают помнить; тот же стиль архива свидетельств, тот же голос рассказчика, длина как у части 1 (~3:20); ответить на обрыв части 1 (что стало с Ирой) и оставить обрыв на третью часть"

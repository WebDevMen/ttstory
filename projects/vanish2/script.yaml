beats:
  # ------------------------------------------------------------------ 1. HOOK — новый город на спутнике
  - id: hook
    role: hook
    title: "Город, которого не было"
    goal: "Сразу аномалия и правило: на месте пропавшего города — другой; через семь минут его помнят все."
    vo: "На месте пропавшего города появился другой. Через семь минут его вспомнили все. Даже те, кто там никогда не был."
    on_screen: "ГОРОД, КОТОРОГО НЕ БЫЛО"
    devices: [open_loop, visual_proof, text_reinforcement, sound_hit, callback]
    music: drone
    marks: {"семь минут": "#ffb23e"}
    accent: "#ffb23e"
    shots:
      - id: k_steppe
        visual: "Спутниковый снимок из финала части 1: степь, дороги, мост и ЛЭП обрываются в траве ровной линией; оверлей «SAT · 10:01». На слове «появился» полоса прогрузки идёт сверху вниз — и под ней проступает новый город у реки: набережная, кварталы с яркими крышами, колесо карусели в парке."
        actors: [satellite, evidence]
        camera: "Медленный наезд сверху; толчок на прогрузке"
        animation:
          - {at: "@start", what: "Степь, дороги обрываются"}
          - {at: "@пропавшего", what: "Метка «SAT · 10:01» мигает"}
          - {at: "@появился", what: "Полоса прогрузки — новый город проступает"}
          - {at: "@семь", what: "Метка «7:00» начинает отсчёт"}
        graphics:
          - {at: "@семь", type: badge, text: "7:00"}
        sfx:
          - {at: "@start", sound: hiss}
          - {at: "@появился", sound: glitch}
        ambience: [rumble]
        transition: fade

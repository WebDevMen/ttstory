production:
  theme: {preset: archive, accent: "#ffb23e", captions: clean}
  palette: ["#f4efe6 бумага отпечатка", "#1b1d20 стол/тёмный фон", "#ffb23e оранжевая дата — сквозной цвет свидетельств", "#3d7fb8 синяя дверь — цвет Заречья", "#d8e6f0 дневное небо", "#e3262f красный — только «REC» и «LIVE»"]
  concept:
    name: "ДЕЛО 0841 · ЧАСТЬ 2 · ФОТОАРХИВ СВИДЕТЕЛЬСТВ"
    rules:
      - "Тот же архив свидетельств, что в части 1: отпечатки с оранжевой датой, экран телефона, спутник, дрон, новости; в углу — номер свидетельства и время"
      - "Заречье слишком красивое: тёплый свет, яркие крыши, синие двери; повторы (волны, облака, окна) видны тому, кто ищет"
      - "Новые места и люди появляются и пропадают без силуэтов и дыма — короткая помеха, полоса прогрузки"
      - "Шрифты: заголовки Oswald, метки и время IBM Plex Mono, субтитры Inter"
  music: {key: D, mode: minor, bpm: 84}
  voices:
    narrator: {voice: fr-FR-RemyMultilingualNeural, rate: "+20%"}
    lena: {voice: en-US-EmmaMultilingualNeural, rate: "+14%", pitch: "+6Hz"}
    tema: {voice: en-US-AvaMultilingualNeural, rate: "+10%", pitch: "+40Hz"}
    sergey: {voice: en-US-BrianMultilingualNeural, rate: "+6%", pitch: "-6Hz"}
  assets:
    - "Своя графика без ИИ. Из библиотеки (перенесены из части 1): photo, evidence, satellite, figure, rule_card, timeline, news_desk, retouch_screen, drone_hud, paper_cup, branch"
    - "Новые актёры: кухня, холодильник с фото, прихожая, детский рисунок, галерея телефона, чат, лента комментариев, река с волнами, карусель, двор с машиной, мангал, окно с мужчиной и лейкой, трасса сверху со знаком, записка"
  notes:
    - "Голос рассказчика — тот же fr-FR-RemyMultilingualNeural, что в части 1; Лена — тот же голос Emma"
    - "Говорящий подписан на экране при первом появлении"
    - "Ира с двумя стаканами видна на сетке галереи в 10:03 — пасхалка для пересмотра"

review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 8, emotion: 9, payoff: 8, visuals: 8, cta: 9, platform: 8, accuracy: 8}
  weak_points:
    - "Три минуты длинно для ленты: держится на часах (10:02 → 10:09 → 10:21 → 10:40 → 10:58) и на загадке «откуда Ира на снимках»."
    - "Механика заплатки объяснена образом (штамп), без «почему» — это часть 3."
    - "Зрителю без части 1 Ира представлена одной фразой; улика «К» на стакане работает только для смотревших часть 1."
  improvements:
    - "Идея пользователя (фотографии мест, которых не было, но все помнят) стала правилом с цифрами: 10:02 → 10:09."
    - "Ответ на обрыв части 1 — Ира внутри заплатки — дан через улику на заднем плане, а не пересказом."
    - "Ставка — сын героини: личный выбор «поехать или удержать» вместо обзора мировой катастрофы."
    - "Правило части 1 «снимок опережает мир» замыкает обрыв: снимок из 11:30 значит, что они поедут."

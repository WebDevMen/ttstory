# «Выпадение. Часть 2: Город, которого не было» (~3:15). Своя графика кодом (method draw), без ИИ-картинок.
# Продолжение projects/vanish в том же стиле ДЕЛО 0841 · ФОТОАРХИВ СВИДЕТЕЛЬСТВ: отпечатки с оранжевой датой, экран
# телефона, спутник, дрон, новости; в углу — номер дела, источник и время. Заречье «слишком красивое»: яркие крыши, синие
# двери, тёплый свет — и повторы (волны, облака, окна), которые видит тот, кто ищет штамп.
# Сценарий: projects/vanish2/script.yaml. Актёры — библиотека: figures, evidence, places, aerial (из части 1),
# home и phone_screens (новые для части 2). Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Выпадение. Часть 2: Город, которого не было"

voice: {voice: fr-FR-RemyMultilingualNeural, rate: "+20%", pitch: "+0Hz", tail: 1.6}
voices:
  lena: {voice: en-US-EmmaMultilingualNeural, rate: "+14%", pitch: "+6Hz"}
  tema: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+8%", pitch: "+38Hz"}
  sergey: {voice: en-US-BrianMultilingualNeural, rate: "+6%", pitch: "-6Hz"}

theme:
  preset: archive
  accent: "#ffb23e"
  captions: {style: clean, top: auto, size: 62, max_chars: 20, hide: [{from: "@cta/Ты-0.2", until: "@cta/нет.end"}]}

post: {vignette: 0.16, chromatic: 0, grain: 0.018}

draw:
  palette: {paper: "#f6f2ea", orange: "#ffb23e", desk: "#2a2420", grey: "#8b939c", blue_door: "#2f6fc0"}

audio:
  music:
    key: D
    mode: minor
    bpm: 84
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@setup.start", style: calm}
      - {at: "@problem.start", style: tension}
      - {at: "@rule.start", style: pulse}
      - {at: "@clue.start", style: tension}
      - {at: "@sergey.start", style: dark}
      - {at: "@stamp.start", style: pulse}
      - {at: "@twist.start", style: sub}
      - {at: "@road.start", style: epic}
      - {at: "@dilemma.start", style: drone}
      - {at: "@cliff.start", style: silence}
      - {at: "@cta.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-ira: &ira {actor: figure, top: sweater, top_color: "#d9c9a8", hair: bun, hair_color: "#3a2a22", seed: 1}
x-lena: &lena {actor: figure, top: dress, top_color: "#3f7a5a", hair: bob, hair_color: "#b5562c", seed: 2}
x-tema: &tema {actor: figure, kid: true, top: tshirt, top_color: "#f2c230", hair: short, hair_color: "#6b4a2e", bottom_color: "#3a4a6a", seed: 21}
x-tema-out: &tema_out {actor: figure, kid: true, top: jacket, top_color: "#3d7fb8", top2: "#f2c230", hair: short, hair_color: "#6b4a2e", bottom_color: "#3a4a6a", bag: "#c0503a", seed: 21}
x-sergey: &sergey {actor: figure, top: shirt, top_color: "#9a3b3b", hair: cap, cap_color: "#2a2f36", seed: 23}
x-ev: &ev {actor: evidence, x: 0, y: 0, space: screen, case: "ДЕЛО 0841 · ЧАСТЬ 2"}
x-tag: &tag {actor: text, space: screen, font: plex, size: 44, weight: 600, color: orange, bg: {color: "rgba(18,16,14,.86)", pad: 14}, enter: {type: fade, dur: 0.2}, sfx: false}
x-title: &title {actor: text, slot: title, font: cond, size: 96, weight: 700, color: "#f6f2ea", lines: 2, width: 940, bg: {color: "rgba(18,16,14,.85)", pad: 24}, enter: fade}
x-desk: &desk_bg {type: radial, at: "50% 40%", stops: [[0, "#3a312a"], [1, "#16120f"]]}


scenes:

  # ------------------------------------------------------------------ 1. HOOK — на месте степи проступает новый город
  - id: hook
    text: "На месте пропавшего города появился другой. Через семь минут его вспомнили все. Даже те, кто там никогда не был."
    caption_marks: {"семь минут": "#ffb23e"}
    shots:
      - id: k_steppe
        transition: {type: fade, dur: 0.2}
        ambience: [{sound: rumble, gain: -20}]
        draw:
          world: [2000, 2800]
          camera: {keys: [{t: 0, z: 0.74, x: 1000, y: 1400}, {t: end, z: 0.82, x: 1000, y: 1380}], shakes: [{at: "@появился", amp: 6, dur: 0.3}]}
          layers:
            - {actor: satellite, x: 0, y: 0, label: "", erase: 1, patch: [{at: 0, v: 0}, {at: "@появился-0.2", v: 1, dur: 1.6, ease: linear}], patch_label_on: 0}
            - {actor: text, x: 540, y: 290, space: screen, at: "@семь", enter: pop, font: plex, size: 72, weight: 600, color: orange, bg: {color: "rgba(18,16,14,.86)", pad: 14},
               text: [{at: 0, v: "7:00"}, {at: "@семь+1", v: "6:59"}, {at: "@семь+2", v: "6:58"}]}
            - {<<: *ev, src: "СПУТНИК · 3 М/ПИКС", time: [{at: 0, v: "10:01:00"}, {at: "@появился", v: "10:02:00"}], sub: "СНИМОК 3 / ?"}
      - id: k_title
        start: "@Даже-0.22"
        transition: {type: zoom}
        draw:
          world: [2000, 2800]
          camera: {keys: [{t: 0, z: 0.9, x: 1000, y: 1300}, {t: end, z: 1.1, x: 1000, y: 1250, ease: out}]}
          layers:
            - {actor: satellite, x: 0, y: 0, label: "", erase: 1, patch: 1, patch_label_on: [{at: 0, v: 0}, {at: "@Даже", v: 1, dur: 0.3}]}
            - {actor: text, x: 540, y: 470, space: screen, at: "@никогда-0.1", enter: {type: fade, dur: 0.15}, text: "ДЕЛО 0841 · ЧАСТЬ 2", font: plex, size: 34, weight: 600, color: orange, letter: 4}
            - {actor: text, x: 540, y: 640, space: screen, at: "@никогда-0.1", enter: {type: fade, dur: 0.2}, text: "ГОРОД, КОТОРОГО НЕ БЫЛО", font: cond, size: 118, weight: 700, color: "#f6f2ea", lines: 2, width: 960,
               bg: {color: "rgba(18,16,14,.86)", pad: 30, radius: 4}}
    sfx:
      - {sound: hiss, at: 0.1, gain: -16}
      - {sound: glitch, at: "@появился", gain: -12}
      - {sound: boom, at: "@никогда", gain: -12}

  # ------------------------------------------------------------------ 2. SETUP — кухня Лены; Ира пропала; Тёма рисует дом
  - id: setup
    text: "Десять ноль две. Кухня Лены. Лена, двадцать шесть лет, администратор ателье на Садовой. Семь минут назад её коллега Ира сделала селфи и пропала. Лена её помнит: тот снимок она не видела. Сын Тёма, семь лет, рисует дом с синей дверью. Такого дома у них нет."
    caption_marks: {"синей дверью": "#ffb23e"}
    shots:
      - id: s_kitchen
        transition: {type: dip, dur: 0.3}
        ambience: [{sound: room, gain: -22}, {sound: birds, gain: -24}]
        draw:
          world: [1500, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 820, y: 960}, {t: end, z: 1.04, x: 680, y: 980, ease: inout}]}
          layers:
            - {actor: kitchen, x: 0, y: 0, w: 1500, h: 1920, floor_y: 1330, window: [560, 220, 560, 640], steam: 1}
            - {actor: fridge, x: 1330, y: 1340, h: 1020}
            - {actor: photo, x: 1330, y: 640, w: 150, h: 120, rot: 4, border: 8, date: "", children: [{actor: shape, kind: rect, x: 0, y: 0, w: 150, h: 120, fill: "#9cc8e8", origin: top-left}, {<<: *tema, x: 75, y: 118, h: 90, face: smile}]}
            - {<<: *tema, x: 900, y: 1350, h: 560, view: back}
            - {actor: kitchen_table, x: 860, y: 1470, w: 720, h: 420}
            - {actor: particles, kind: dust, region: [500, 200, 1200, 1300], count: 22, colors: ["#fff7e0"], alpha: 0.45}
            - {actor: timetag, slot: tag, at: "@Десять", enter: fade, text: "10:02 · КУХНЯ ЛЕНЫ"}
      - id: s_lena
        start: "@Лена-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06, y: 940}]}
          layers:
            - {actor: kitchen, x: -260, y: 0, w: 1600, h: 1920, floor_y: 1500, window: [420, 260, 560, 640]}
            - {<<: *lena, x: 540, y: 3000, h: 2300, arms: [down, hold], face: [{at: 0, v: calm}, {at: "@администратор", v: worry}], look_dx: -0.3}
            - {<<: *tag, at: "@Лена", x: 540, y: 300, text: "ЛЕНА, 26 · АДМИНИСТРАТОР"}
      - id: s_ira
        start: "@Семь-0.22"
        draw:
          bg: "#2a2724"
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.08, y: 900}]}
          layers:
            - actor: phone
              x: 540
              y: 900
              w: 520
              h: 940
              screen: app
              color: "#15171a"
              glow: "#ffb23e"
              children:
                - {actor: chat_screen, x: 0, y: 0, w: 484, h: 904, name: "Ира", status: "была в 09:55",
                   msgs: [{text: "Лен, если меня не будет на селфи — не смотри.", time: "09:53"}, {photo: true, time: "09:55", label: "НЕ ОТКРЫТО"}],
                   hl: [{at: 0, v: -1}, {at: "@селфи", v: 0}, {at: "@помнит", v: 1}]}
            - {actor: human_hand, x: 1300, y: 950, rot: -60, skin: "#f1d2bd", sleeve: "#3f7a5a", anim: [{at: "@помнит-0.3", dur: 0.6, x: 700, y: 1160, ease: out}, {at: "@видела", dur: 0.4, x: 1300, y: 1000, ease: in}]}
            - {<<: *tag, at: "@видела", x: 540, y: 250, text: "НЕ ВИДЕЛА СНИМОК → ПОМНИТ"}
            - {<<: *ev, src: "ТЕЛЕФОН ЛЕНЫ · ЧАТ", time: "10:02:20"}
      - id: s_tema
        start: "@Сын-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.04, y: 940}]}
          layers:
            - {actor: kitchen, x: -200, y: 0, w: 1500, h: 1920, floor_y: 1150, window: [560, 160, 560, 560], steam: 1}
            - {<<: *tema, x: 540, y: 1200, h: 720, arms: [hold, hold], face: calm, look_dx: 0.2}
            - {actor: kitchen_table, x: 540, y: 1250, w: 900, h: 340}
            - {<<: *tag, at: "@Тёма", x: 540, y: 300, text: "ТЁМА, 7"}
      - id: s_draw
        start: "@рисует-0.22"
        transition: {type: dip, dur: 0.3}
        draw:
          bg: "#e9e2d4"
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@синей", z: 1.0}, {t: end, z: 1.5, x: 620, y: 1000, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 0, y: 0, w: 1080, h: 1920, fill: {linear: ["#f2efe8", "#e6e0d2"], angle: 180}, origin: top-left}
            - {actor: drawing, x: 540, y: 960, w: 860, h: 618, rot: -3, door: [{at: 0, v: 0}, {at: "@синей-0.3", v: 1, dur: 1.4, ease: linear}],
               marker: [{at: 0, v: [0.62, 0.9]}, {at: "@синей-0.3", v: [0.55, 0.62], dur: 0.7}, {at: "@синей+0.4", v: [0.53, 0.8], dur: 0.6}, {at: "@Такого", v: [0.8, 1.05], dur: 0.5}]}
            - {actor: shape, kind: rect, x: 160, y: 1420, w: 40, h: 220, fill: "#e05a44", radius: 10, rot: 20}
            - {actor: shape, kind: rect, x: 900, y: 1380, w: 40, h: 220, fill: "#5fa040", radius: 10, rot: -35}
            - {actor: shape, kind: rect, x: 820, y: 520, w: 40, h: 220, fill: "#ffd23e", radius: 10, rot: 70}
            - {actor: text, slot: subtitle, at: "@Такого", enter: fade, text: "ТАКОГО ДОМА У НИХ НЕТ", font: cond, size: 80, weight: 700, color: "#f6f2ea", bg: {color: "rgba(18,16,14,.85)", pad: 20}}
    sfx:
      - {sound: click, at: "@Десять", gain: -16}
      - {sound: pop, at: "@Лена", gain: -18}
      - {sound: blip, at: "@пропала", gain: -14}
      - {sound: scrape, at: "@рисует", gain: -16}

  # ------------------------------------------------------------------ 3. PROBLEM — новости: Заречье; 214 снимков; «наш дом»
  - id: problem
    text: "В новостях спутник. На месте Ольховска город. Подпись: Заречье. У Лены звенит телефон. В галерее двести четырнадцать новых снимков. Она их не делала. Набережная. Карусель. Дом с синей дверью. Мам, это же наш дом! Мы там никогда не были, Тёма."
    lines:
      - {who: tema, say: "Мам, это же наш дом!"}
      - {who: lena, say: "Мы там никогда не были, Тёма."}
    caption_marks: {"двести четырнадцать": "#ffb23e"}
    shots:
      - id: p_news
        ambience: [{sound: hum, gain: -24}]
        captions_top: 1450
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: "@город", z: 1.0}, {t: end, z: 1.06, ease: inout}]}
          layers:
            - {actor: news_studio, x: 0, y: 0, chair_y: 1200, chair_rot: 30}
            - actor: photo
              x: 540
              y: 760
              w: 820
              h: 560
              border: 0
              shadow: 0
              date: ""
              children: [{actor: group, x: -100, y: -460, scale: 0.5, children: [{actor: satellite, x: 0, y: 0, label: "", erase: 1, patch: 1, patch_label_on: [{at: 0, v: 0}, {at: "@Заречье", v: 1, dur: 0.3}]}]}]
            - {actor: news_desk, x: 0, y: 0, desk_y: 1240, backdrop: false, title: "НА МЕСТЕ ОЛЬХОВСКА — ГОРОД", sub: "10:03 · спутник: «Заречье»", ticker: "ЗАРЕЧЬЕ · ГОРОД НА МЕСТЕ ОЛЬХОВСКА · ЖИТЕЛИ: «МЫ ВСЕГДА ТАМ ЖИЛИ» · ТРАССА М-4: ДВИЖЕНИЕ ЗАТРУДНЕНО"}
            - {<<: *ev, src: "ЭФИР · НОВОСТИ 24", time: "10:03:12", rec: true}
      - id: p_gallery
        start: "@звенит-0.22"
        draw:
          bg: "#2a2724"
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.06, y: 920}], shakes: [{at: "@звенит", amp: 5, dur: 0.5}]}
          layers:
            - actor: phone
              x: 540
              y: 960
              w: 520
              h: 940
              screen: app
              color: "#15171a"
              glow: "#ffb23e"
              children:
                - {actor: phone_gallery, x: 0, y: 0, w: 484, h: 904, count: 30, total: "+214", ira: [4, 9, 13, 17, 22, 26],
                   n: [{at: 0, v: 0}, {at: "@двести", v: 30, dur: 1.8, ease: linear}], scroll: [{at: 0, v: 0}, {at: "@делала", v: 160, dur: 1.2}]}
            - {actor: buzz, x: 540, y: 960, w: 580, h: 1000, times: ["@звенит", "@звенит+0.5"]}
            - {<<: *tag, at: "@двести", x: 540, y: 300, text: "+214 ФОТО · НЕ ЕЁ"}
            - {<<: *ev, src: "ТЕЛЕФОН ЛЕНЫ · ГАЛЕРЕЯ", time: "10:03:40"}
      - id: p_photos
        start: "@Набережная-0.22"
        draw:
          bg: *desk_bg
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {actor: photo, x: 470, y: 900, w: 740, h: 880, scale: 0.92, rot: -6, date: "'98 07 14", at: "@Набережная-0.15", enter: {type: drop, dur: 0.3}, children: *emb}
            - {actor: photo, x: 600, y: 940, w: 740, h: 880, scale: 0.92, rot: 4, date: "'03 06 01", at: "@Карусель-0.15", enter: {type: drop, dur: 0.3}, children: *car_park}
            - {actor: photo, x: 540, y: 980, w: 740, h: 880, scale: 0.92, rot: -1, date: "'11 09 01", at: "@синей-0.4", enter: {type: drop, dur: 0.3}, children: *house_blue}
            - {<<: *tag, at: "@синей", x: 540, y: 330, text: "ДОМ С СИНЕЙ ДВЕРЬЮ"}
            - {<<: *ev, src: "ГАЛЕРЕЯ · 214 НОВЫХ", time: "10:04:02"}
      - id: p_tema
        start: "@Мам-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05, y: 940}]}
          layers:
            - {actor: kitchen, x: -200, y: 0, w: 1500, h: 1920, floor_y: 1500, window: [560, 260, 560, 640]}
            - {<<: *lena, x: 790, y: 3050, h: 2300, arms: [down, down], face: worry, look_dx: -0.5, talk: [["@Мы", "@Тёма.end"]]}
            - {<<: *tema, x: 300, y: 2750, h: 1550, arms: [down, hold], face: laugh, look_dx: 0.6, talk: [["@Мам", "@дом#2.end"]]}
            - {actor: drawing, x: 330, y: 1700, w: 330, h: 237, rot: -8, door: 1}
            - {<<: *title, at: "@дом#2", text: "«ЭТО ЖЕ НАШ ДОМ!»"}
    sfx:
      - {sound: blip, at: "@новостях", gain: -16}
      - {sound: buzz, at: "@звенит", gain: -10}
      - {sound: shutter, at: "@двести", gain: -10}
      - {sound: shutter, at: "@Набережная", gain: -10}
      - {sound: shutter, at: "@Карусель", gain: -10}
      - {sound: shutter, at: "@синей", gain: -10}
      - {sound: heartbeat, at: "@дом#2", gain: -10}

  # ------------------------------------------------------------------ 4. RULE — 10:09: Лена помнит Заречье (правило 3)
  - id: rule
    text: "Десять ноль девять. Лена вдруг помнит Заречье. Запах реки. Скрип карусели. Дорогу в школу мимо синей двери. Как в пять лет упала с карусели. Под снимком тысячи комментариев: я там вырос. Никто там не был. Прошло семь минут."
    caption_marks: {"семь минут": "#ffb23e"}
    shots:
      - id: r_memory
        transition: {type: dissolve, dur: 0.4}
        ambience: [{sound: wind, gain: -26}]
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06, y: 940}]}
          layers:
            - {actor: kitchen, x: -200, y: 0, w: 1500, h: 1920, floor_y: 1500, window: [560, 260, 560, 640], brightness: 0.7}
            - {<<: *lena, x: 330, y: 3050, h: 2300, arms: [down, down], face: calm, look_dx: 0.5}

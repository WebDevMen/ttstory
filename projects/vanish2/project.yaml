  # ------------------------------------------------------------------ 10. DILEMMA — Тёма у двери; его уже закрашивают
  - id: dilemma
    text: "Тёма стоит у двери в куртке. Мам, поехали домой. Ира сказала не ехать. Лена смотрит на фото Тёмы на холодильнике. За его спиной трижды повторяется одна ветка. Его уже закрашивают. Поехать с ним? Или удержать?"
    lines:
      - {who: tema, say: "Мам, поехали домой."}
      - {who: lena, say: "Ира сказала не ехать."}
    caption_marks: {"Его уже закрашивают": "#ffb23e"}
    shots:
      - id: d_door
        transition: {type: dip, dur: 0.3}
        ambience: [{sound: room, gain: -22}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, x: 600}, {t: end, z: 1.0, x: 600}]}

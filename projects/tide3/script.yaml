    - "Одна точка зрения — Глеб: всё, что видит зритель, видит он"
    - "Правила частей 1–2 не меняются (мокрое — вверх, сухое — тяжёлое, высохнет — снова тяжёлое; море копит весь дождь и опускается); новых правил два, оба проверены: сухая земля не поднимается (камешек, полоса под мостом); кончится дождь — море остановится (семь двадцать)"
    - "Без крови и скримеров; утонувшие кварталы живы — окна горят, фонарь мигает; 13+"
    - "Финал серии: никаких новых загадок, кроме тихой пасхалки (фонарь в море мигает в ответ)"

research:
  summary: >-
    Финал держится на двух настоящих вещах. Первая — погода: холодный фронт проходит, за ним обычно проясняется, а
    барометр после фронта быстро растёт — по нему метеоролог Петрович (тридцать лет на метеостанции, паспорт из части 1)
    понимает, когда кончится дождь, лучше, чем система оповещения. Вторая — лифт: в кабине есть аварийная связь, и лифтёр
    может говорить с кабиной в яме, где нет мобильной сети; а закрытая сухая кабина под водой держит воздух, как
    водолазный колокол, — поэтому Глеб из прошлого круга жив на дне моря и может позвонить, высунув телефон в люк.
  facts:
    - id: f1
      text: "Быстрый рост атмосферного давления, например после холодного фронта, связан с улучшением погоды; по изменению давления делают краткосрочный прогноз."
      source: "https://en.wikipedia.org/wiki/Barometer"
      confidence: high
    - id: f2
      text: "После прохождения холодного фронта обычно наступает прояснение; затяжная непогода бывает, когда фронт «волнуется»."
      source: "https://weather.metoffice.gov.uk/learn-about/weather/atmosphere/weather-fronts"
      confidence: medium
    - id: f3
      text: "Во многих лифтах есть кнопка аварийной связи или телефон, чтобы застрявшие пассажиры вызвали помощь; правила часто это требуют."
      source: "https://en.wikipedia.org/wiki/Elevator"
      confidence: high
    - id: f4
      text: "В водолазном колоколе воздух удерживается под куполом давлением воды на границе — внутри можно дышать под водой."
      source: "https://en.wikipedia.org/wiki/Diving_bell"
      confidence: high
  angles:
    - id: a1
      archetype: time_loop
      text: "Звонок из-под воды — Глеб прошлого круга: он сделал всё как наш Глеб и спрятался в яме. Чтобы разорвать круг, нужно не повторить спасение из части 1"
      paradox: "Голос, который спас дочь в первой части, — тот самый, что ведёт её на дно моря; разорвать петлю можно, только ослушавшись самого себя"
      score: 9
      why: "Отвечает на обрыв части 2 в первой сцене, переворачивает смысл части 1 (яма — не спасение, а отсрочка) и даёт ясную цель с часами: восемь минут до семи."
    - id: a2
      archetype: rule_break
      text: "Сухое — тяжёлое: значит, сухая земля не поднимается. Под мостом всю ночь было сухо — это единственное место, которое останется на земле"
      paradox: "В городе, где спасаются наверху или в яме, спасает бытовая мелочь, которую знает каждый ребёнок: под мостом всегда сухо"
      score: 9
      why: "Развязка из правила части 1, найдена ребёнком; зритель может «сыграть» сам (камешек из лужи — вверх, с сухого — вниз). Взято внутрь a1."
    - id: a3
      archetype: role_swap
      text: "Крыша, от которой Глеб увёл дочь в части 1, становится его выбором: теперь он идёт туда за соседями, а дочь доверяет другому себе"
      paradox: "Чтобы спасти чужих, он отдаёт свою дочь самому себе — и это единственный человек, которому он может её доверить"
      score: 8
      why: "Замыкает арку героя (своя дочь → общий двор) и делает цену выбора личной. Взято внутрь a1."
    - id: a4
      archetype: inhuman_pov
      text: "Финал глазами системы оповещения, которая три протокола подряд отправляла людей не туда"
      paradox: "Голос, которому верили все, ни разу не был прав"
      score: 5
      why: "Холодно и без героя; система остаётся голосом-антагонистом без лица."
  chosen_angle: a1
  insights:
    - "Ответ на обрыв части 2 — в первой сцене: Глеб отвечает, и это он сам из утонувшего квартала. Протокол 08 «это не вы» почти прав: это вы — через двадцать минут."
    - "Развязка не новое чудо, а правило части 1 «сухое — тяжёлое», доведённое до земли: сухой прямоугольник под машиной, камешек, полоса под мостом."
    - "Петрович снова на крыше, но в этот раз решает не система, а его тридцать лет на метеостанции: барометр, фронт уходит в семь двадцать."
    - "Мотив «звонок со своего номера» в последний раз переворачивается: звонит Соня с телефона другого Глеба."
    - "Последняя сцена серии повторяет первую: Соня складывает жёлтый зонт и ловит дождь языком — теперь он идёт вниз. «Пап, он сладкий!» — как в части 1, до того как всё началось."

story:
  logline: "Глеб, лифтёр, должен за восемь минут вытащить из ямы лифта самого себя с дочкой и увести двор с крыш, но нижний Глеб верит голосу, который однажды спас, а соседи — сирене; не успеет — квартал поднимется в море, которое опускается к Речной."
  retell: "Глеб из-под воды предупреждает: яма поднимется вместе с домом. Глеб вытаскивает нижнего себя из ямы, отправляет дочек на сухую землю под мостом, а сам поднимается с домом к морю. В семь двадцать дождь кончается, море замирает над крышей."
  premise: "Что если дождь, который идёт вверх, однажды просто кончится — и всё решит, кто в эту минуту стоит на сухом?"
  paradox: "Голос, который спас дочь, ведёт её на дно; спасает не крыша и не яма, а полоска сухого асфальта, про которую знает любой ребёнок"
  genre: "фантастика, лёгкий хоррор"
  world_rules:
    - id: r5
      rule: "Сухая земля тяжёлая и не поднимается: квартал отрывается по мокрому, сухое остаётся на месте"
      test: "Камешек из лужи улетает вверх, камешек с сухого прямоугольника под машиной падает; в семь ноль-ноль квартал отрывается, а полоса сухого асфальта под мостом с двумя Сонями и соседями остаётся"
      shown_in: rule
      basis: вымысел
    - id: r6
      rule: "Море копит дождь: пока идёт дождь, оно опускается; кончится дождь — море остановится, а высохшее снова станет тяжёлым"
      test: "Фронт уходит в семь двадцать (барометр Петровича): в семь двадцать последняя капля уходит в море, и море замирает в метре над антенной; через час высохший квартал садится"
      shown_in: twist
      basis: f1
  characters:
    - id: gleb
      name: "Глеб"
      intro: "Глеб, двадцать девять лет, лифтёр."
      role: "герой, точка зрения; отец Сони"
      want: "разорвать круг: чтобы Соня осталась на земле, а не в яме, которая уйдёт в море"
      fear: "что Соня останется с другим Глебом"
      look: "тёмная куртка лифтёра с отражающей полосой, рабочий пояс с ключами и ножом"
      arc: "в части 1 спрятал свою дочь от всех → в финале отдаёт её самому себе и идёт на крышу за соседями"
    - id: sonya
      name: "Соня"
      intro: "Соня, семь лет, его дочь."
      role: "дочь, ставка; глаза ребёнка: замечает сухое под мостом"
      want: "чтобы папа пошёл с ней"
      fear: "что папа улетит"
      look: "жёлтая куртка, две косички"
      arc: "«под мостом всегда сухо» → «пап, а ты?» → звонит с другого телефона: «пап, тут солнце» → «он сладкий»"
    - id: gleb_deep
      name: "Голос из-под воды"
      intro: "В трубке — его голос. И вода."
      role: "Глеб прошлого круга: спустился на простынях в зону 06, спрятался в яме — и квартал ушёл в море; звонит из закрытой кабины, высунув телефон в люк"
      want: "чтобы следующий Глеб не повторил его ошибку"
      fear: "что его не послушают, как он не послушал"
      look: "только голос и экран: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР · ГЛУБИНА 40 М»; в финале — фонарь в окне под водой"
      arc: "предупреждает → его фонарь мигает в море в последнем кадре"
    - id: gleb_pit
      name: "Нижний Глеб"
      intro: "В яме лифта — нижний Глеб с дочкой."
      role: "Глеб нижнего города: послушал голос с ветром и спрятался с дочкой в яме лифта"
      want: "сделать то, что велел его собственный голос"
      fear: "ошибиться, ослушавшись себя"
      look: "тот же Глеб, в куртке лифтёра, с жёлтой Соней на руках"
      arc: "«мне сказали: в яму» → «тогда ошибёмся вместе» → держит двух Сонь под мостом"
    - id: petrovich
      name: "Аркадий Петрович"
      intro: "Аркадий Петрович, семьдесят лет. Тридцать лет на метеостанции."
      role: "сосед нижнего города, ещё не знает Глеба; верит системе и стоит на крыше"
      want: "дождаться вертолётов, как велит протокол"
      fear: "что система, которой он верил тридцать лет, ошибается"
      look: "седой, очки, вязаный жилет, транзисторный приёмник и старый барометр"
      arc: "«система тридцать лет не врала» → смотрит на свой барометр: «фронт уходит в семь двадцать» → на поднятой крыше смотрит не вверх, а на часы"
    - id: system
      name: "Оповещение"
      role: "женский голос городской системы оповещения из динамиков; говорит протоколами"
      want: "чтобы жители выполнили протокол"
      fear: "—"
      look: "нет лица: решётка динамика, красная плашка на экране"
      arc: "Протокол 09: «оставайтесь на крышах, ждите вертолёты» → в семь двадцать молчит"
  twists:
    - id: t1
      what: "Спасает сухая земля: квартал отрывается по мокрому, а полоса под мостом, где ночью не было дождя, остаётся на земле вместе с людьми"

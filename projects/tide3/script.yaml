      setup: [problem, roof, rise]
      payoff: twist
    - id: t3
      what: "Последний звонок «со своего номера» — не Глеб, а Соня с телефона нижнего Глеба: у двух Глебов один номер"
      setup: [setup, call, dilemma]
      payoff: final
  dilemmas:
    - id: d1
      beat: dilemma
      who: gleb
      question: "Бежать с Соней под мост — или подняться на крышу за соседями, которые даже не знают его, и отдать дочь самому себе?"
      options: ["Под мост с Соней: дочь рядом и на сухом, но двор и Петрович поднимутся с домом в море", "На крышу: может, уведёт соседей, но может не успеть вниз до семи — и Соня останется с другим Глебом"]
  stakes:
    - {beat: setup, level: personal}
    - {beat: call, level: family}
    - {beat: problem, level: community}
    - {beat: rule, level: family}
    - {beat: dilemma, level: family}
    - {beat: roof, level: community}
    - {beat: rise, level: community}
    - {beat: twist, level: world}
    - {beat: final, level: world}
    - {beat: epilogue, level: personal}
  series: {name: "Обратный прилив", part: 3, of: 3, prev: tide2, next: "—", answers: "Кто звонит с номера Глеба из-под воды, что будет с нижним Глебом в яме и с городом, к которому опускается море", cliff: "— (финал серии)"}


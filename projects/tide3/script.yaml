  theme: {preset: archive, accent: "#d9e2ea", captions: clean}
  palette: ["#0a0c0f почти чёрный", "#3c4650 сталь", "#8a96a2 холодный серый", "#f2f4f6 белый", "#1f4a4c глубина моря (над крышами всю часть)", "#d8cfa8 сухой асфальт (светлый — цвет спасения)", "#e3262f аварийный красный (только опасность)", "#ffd23a жёлтый (Соня, зонт, финальный свет)", "#7fd0a8 солнце сквозь море (только финал)"]
  music: {key: E, mode: minor, bpm: 88}
  voices:
    narrator: {voice: ru-RU-SvetlanaNeural, rate: "+15%"}
    system: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+6%", pitch: "-2Hz"}
    gleb: {voice: ru-RU-DmitryNeural, rate: "+10%", pitch: "-4Hz"}
    gleb_pit: {voice: ru-RU-DmitryNeural, rate: "+6%", pitch: "-6Hz"}

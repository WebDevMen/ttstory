    - {id: h7, type: anomaly, vo: "В трубке ваш голос. И бульканье воды.", on_screen: "ГЛУБИНА 40 М", visual: "Экран телефона заливает рябь", score: 7, why: "Жутко, но без правила и срока."}
    - {id: h8, type: question, vo: "Кто звонит с вашего номера из-под воды?", on_screen: "КТО?", visual: "Телефон звонит", score: 5, why: "Вопрос-лекция."}
  primary: h1
  ab: [h2, h3]

beats:
  # ------------------------------------------------------------------ 1. HOOK — Протокол 09
  - id: hook
    role: hook
    title: "Это вы через двадцать минут"
    goal: "Ответ на вопрос части 2 одной фразой: ответить. И новая жуть: звонящий — ты сам, через двадцать минут."
    vo: "Звонят с вашего номера из-под воды? Ответьте. Это вы через двадцать минут."
    on_screen: "ЗВОНЯТ С ВАШЕГО НОМЕРА? ОТВЕТЬТЕ"
    devices: [open_loop, visual_proof, text_reinforcement, sound_hit, pattern_interrupt]
    music: drone
    marks: {"из-под воды": "#f2f4f6"}
    shots:
      - id: h_call
        visual: "Первый кадр — аномалия: мокрый двор панелек, дождь идёт ВВЕРХ, а над крышами вместо неба висит море вверх дном — гребни волн свисают вниз, в толще горят окна утонувших кварталов. На переднем плане рука с телефоном: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР · ГЛУБИНА 40 М», по экрану бежит водяная рябь."
        actors: [sky, sky_sea, panel_block, wet_ground, rain, phone_call, archive]
        camera: "Медленный наезд снизу вверх, лёгкая тряска"
        animation:
          - {at: "@start", what: "Капли с асфальта уходят вверх, море колышется"}
          - {at: "@номера", what: "Телефон вибрирует: свой номер"}
          - {at: "@воды", what: "Рябь по экрану телефона"}
          - {at: "@Ответьте", what: "Зелёная кнопка «ответить» мигает"}
        graphics:
          - {at: "@Ответьте", type: rule_card, text: "ОТВЕТЬТЕ"}
        sfx:
          - {at: "@start", sound: buzz}
          - {at: "@воды", sound: noise_sweep}
        ambience: [rain]
        transition: cut
      - id: h_title
        at: "@Это-0.1"
        visual: "Сбой сигнала — заголовок «ПРОТОКОЛ 09 · ОБРАТНЫЙ ПРИЛИВ · ФИНАЛ». За ним лестница кварталов вверх, к поверхности моря; на миг в окне под водой мигает фонарь (пасхалка последнего кадра)."
        actors: [sky, sky_sea, city_chunk, cloud_bank, title_card, archive]
        camera: "Резкий подъём вверх"
        animation:
          - {at: "@Это", what: "Сбой, камера уходит вверх"}
          - {at: "@минут", what: "Заголовок; фонарь в окне под водой мигает"}
        graphics:
          - {at: "@минут", type: "text slam", text: "ПРОТОКОЛ 09 · ОБРАТНЫЙ ПРИЛИВ · ФИНАЛ"}
        sfx:
          - {at: "@минут", sound: boom}
        transition: glitch

  # ------------------------------------------------------------------ 2. SETUP — нижний двор, 06:52, звонок
  - id: setup
    role: setup
    title: "Шесть пятьдесят две"
    goal: "Где и кто: нижний двор, Глеб и Соня только что спустились; звонит его номер — и он отвечает (ответ на вопрос части 2)."
    vo: "Шесть пятьдесят две. Двор на Речной, внизу. Глеб, двадцать девять лет, лифтёр. Соня, семь лет, его дочь. Они только что спустились с неба. Звонит Глеб. Его собственный номер. Протокол запрещает. Глеб отвечает."
    scene: {when: "06:52 нижнего города", where: "двор на Речной, у кабины лифта, которая села в лужу"}
    on_screen: "06:52 · НИЖНИЙ ГОРОД"
    devices: [relatability, callback, emotion]
    music: drone
    shots:
      - id: s_yard
        visual: "Камера наблюдения CAM 03 нижнего двора: мокрый двор, лужи идут дождём вверх; посреди — стальная кабина лифта, села в лужу, обрывки тросов тянутся вверх. Из люка выбираются Глеб и Соня. Метка «06:52 · НИЖНИЙ ГОРОД»."
        actors: [sky, panel_block, wet_ground, puddle, lift_cabin, person, rain, archive]
        camera: "Неподвижная камера наблюдения, медленный цифровой наезд"
        animation:
          - {at: "@Шесть", what: "Метка времени"}
          - {at: "@Речной", what: "Простыни отрываются от тросов и улетают вверх"}
          - {at: "@внизу", what: "Люк кабины открывается"}
        graphics:
          - {at: "@Шесть", type: timetag, text: "06:52 · НИЖНИЙ ГОРОД"}
        sfx:
          - {at: "@Шесть", sound: whoosh}
          - {at: "@внизу", sound: creak}
        ambience: [rain]
        transition: dip
      - id: s_heroes
        at: "@Глеб-0.1"
        visual: "Ближе, телефонная съёмка: Глеб спрыгивает с крыши кабины в лужу, снимает Соню; подписи героев. За ними подъезд и мокрая стена, дождь из луж идёт вверх."
        actors: [panel_block, wet_ground, lift_cabin, person, rain, archive]
        camera: "Ручная, наезд"
        animation:
          - {at: "@Глеб", what: "Глеб спрыгивает, подпись"}
          - {at: "@Соня", what: "Соня у него на руках, подпись"}
        graphics:
          - {at: "@Глеб", type: callout, text: "ГЛЕБ, 29 · ЛИФТЁР"}
          - {at: "@Соня", type: callout, text: "СОНЯ, 7 · ДОЧЬ"}
        sfx:
          - {at: "@Глеб", sound: click}
        transition: cut
      - id: s_sky
        at: "@Они-0.1"
        visual: "Взгляд вверх со двора: обрывки тросов кабины уходят в облака; над облаками тёмный потолок перевёрнутого моря, в нём огоньки окон."
        actors: [sky, sky_sea, cloud_bank, archive]
        camera: "Наклон вверх"
        animation:
          - {at: "@неба", what: "Сквозь облака проступает море"}
        sfx:
          - {at: "@неба", sound: noise_sweep}
        transition: cut
      - id: s_answer
        at: "@Звонит-0.1"
        visual: "Экран телефона Глеба: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР», поверх красная плашка Протокола 08 «НЕ ОТВЕЧАЙТЕ». Большой палец в мокрой перчатке тянется к зелёной кнопке — и жмёт."
        actors: [phone_call, rule_card, archive]
        camera: "Ручная, дрожь, наезд на кнопку"
        animation:
          - {at: "@Звонит", what: "Вызов"}
          - {at: "@запрещает", what: "Красная плашка «НЕ ОТВЕЧАЙТЕ»"}
          - {at: "@отвечает", what: "Палец жмёт «ответить», плашка гаснет"}
        graphics:
          - {at: "@запрещает", type: rule_card, text: "ПРОТОКОЛ 08: НЕ ОТВЕЧАЙТЕ"}
        sfx:
          - {at: "@Звонит", sound: buzz}
          - {at: "@отвечает", sound: click}
        transition: cut

  # ------------------------------------------------------------------ 3. CALL — Глеб из-под воды
  - id: call
    role: reveal
    title: "Голос из-под воды"
    goal: "Ответ на обрыв части 2: это Глеб прошлого круга; он спрятался в яме, и яма утонула вместе с домом. Цель и срок: вытащить нижних из ямы до семи; ружьё: «найди то, что не поднимается»."
    vo: "В трубке — его голос. И вода. Не сбрасывай. Я тоже спустился на простынях. Тоже спрятался с ними в яме. Яма поднимается вместе с домом. Теперь мы под водой. Вытащи их из ямы. До семи. А куда? Найди то, что не поднимается. Гудки."
    lines:
      - {who: gleb_deep, say: "Не сбрасывай. Я тоже спустился на простынях."}
      - {who: gleb_deep, say: "Тоже спрятался с ними в яме."}
      - {who: gleb_deep, say: "Яма поднимается вместе с домом. Теперь мы под водой."}
      - {who: gleb_deep, say: "Вытащи их из ямы. До семи."}
      - {who: gleb, say: "А куда?"}
      - {who: gleb_deep, say: "Найди то, что не поднимается."}
    scene: {when: "06:52 (на дне моря — зона 06)", where: "двор на Речной; на том конце — закрытая кабина лифта на глубине сорока метров"}
    on_screen: "ГЛЕБ · ИЗ-ПОД ВОДЫ · ЗОНА 06"
    facts: [f4]
    devices: [mini_payoff, callback, open_loop, stakes_raise, emotion]
    music: tension
    marks: {"под водой": "#f2f4f6", "не поднимается": "#f2f4f6"}
    shots:
      - id: c_ear
        visual: "Крупно телефон у уха Глеба: на экране «ГЛЕБ · МОЙ НОМЕР · 00:01», дорожка голоса прыгает, по стеклу бежит рябь, как от воды; капли с куртки уходят вверх."
        actors: [phone_call, person, rain, archive]
        camera: "Ручная, очень близко"
        animation:
          - {at: "@голос", what: "Дорожка голоса"}
          - {at: "@вода", what: "Рябь по экрану, бульканье"}
        sfx:
          - {at: "@вода", sound: noise_sweep}
        transition: cut
      - id: c_deep
        at: "@Не-0.1"
        visual: "Реконструкция того конца: под толщей перевёрнутого моря — утонувший квартал зоны 06, в его подвале светится закрытая кабина лифта, щели заклеены скотчем, внутри воздух, как в колоколе. Из приоткрытого люка — рука с телефоном, вокруг пузыри воздуха. Подпись «ГЛЕБ · ИЗ-ПОД ВОДЫ»."
        actors: [sky_sea, new:deep_cabin, archive]
        camera: "Медленный наезд сквозь толщу воды к кабине"
        animation:
          - {at: "@сбрасывай", what: "Пузыри, рябь, свет каустики"}
          - {at: "@простынях", what: "Подпись: ГЛЕБ · ИЗ-ПОД ВОДЫ · ЗОНА 06"}
          - {at: "@яме", what: "Кабина в яме подсвечивается"}
          - {at: "@домом", what: "Пузыри воздуха вырываются из люка"}
          - {at: "@водой", what: "Камера отъезжает: над кабиной сорок метров воды"}
        graphics:
          - {at: "@простынях", type: callout, text: "ГЛЕБ · ИЗ-ПОД ВОДЫ · 40 М"}
        sfx:
          - {at: "@сбрасывай", sound: noise_sweep}
          - {at: "@водой", sound: drip}
        ambience: [water_calm]
        transition: dip
      - id: c_scheme
        at: "@Вытащи-0.1"
        visual: "Архивный разрез дома нижнего города: в яме лифта — кабина с двумя фигурками. Стрелки: весь дом вместе с ямой уходит вверх; сверху опускается море. Таймер «до 07:00 — 08:00»."
        actors: [house_section, mark, archive]
        camera: "Наезд на яму"
        animation:
          - {at: "@ямы", what: "Подсвечивается кабина в яме"}
          - {at: "@семи", what: "Таймер 08:00"}
        graphics:
          - {at: "@семи", type: badge, text: "ДО 07:00 · 08:00"}
        sfx:
          - {at: "@семи", sound: impact}
        transition: cut
      - id: c_face
        at: "@А-0.1"
        visual: "Крупно Глеб с телефоном у уха под дождём, который идёт вверх; Соня держит его за куртку. Экран: «ВЫЗОВ ЗАВЕРШЁН»."
        actors: [person, phone_call, rain, archive]
        camera: "Ручная, наезд"
        animation:
          - {at: "@куда", what: "Глеб кричит в трубку"}
          - {at: "@поднимается#2", what: "Глеб медленно оглядывает двор"}
          - {at: "@Гудки", what: "Экран: вызов завершён"}
        sfx:
          - {at: "@Гудки", sound: blip}
        transition: cut

  # ------------------------------------------------------------------ 4. PROBLEM — восемь минут; нижние в яме; крыши; Протокол 09
  - id: problem
    role: reveal
    title: "Протокол девять"
    goal: "Часы и общая беда: восемь минут до отрыва, в яме нижний Глеб с дочкой, весь двор на крышах; система велит ждать вертолёты — а море дойдёт до Речной в семь двадцать."
    vo: "Восемь минут до семи. В яме лифта — нижний Глеб с дочкой. Связи там нет. На крышах — весь двор. Из динамиков — сирена. Протокол девять. Море дойдёт до Речной в семь двадцать. Оставайтесь на крышах. Ждите вертолёты."
    lines:
      - {who: system, say: "Протокол девять. Море дойдёт до Речной в семь двадцать."}
      - {who: system, say: "Оставайтесь на крышах. Ждите вертолёты."}
    scene: {when: "06:52", where: "двор на Речной: подъезд, крыши панелек, над ними — море"}
    on_screen: "ПРОТОКОЛ 09 · МОРЕ В 07:20"
    devices: [stakes_raise, visual_proof, open_loop, sound_hit]
    music: tension
    marks: {"семь двадцать": "#f2f4f6", "вертолёты": "#f2f4f6"}
    shots:
      - id: p_timer
        visual: "Подъезд нижнего дома снаружи: дверь, табличка «Речная, 12», над дверью — часы-табло 06:52; поверх — таймер «08:00» до отрыва. Глеб с Соней бегут к двери."
        actors: [panel_block, wet_ground, rule_card, person, rain, archive]
        camera: "Медленный наезд на дверь подъезда"
        animation:
          - {at: "@Восемь", what: "Таймер 08:00 начинает отсчёт"}
          - {at: "@семи", what: "Глеб с Соней бегут к двери"}
        graphics:
          - {at: "@Восемь", type: rule_card, text: "ДО ОТРЫВА 08:00"}
        sfx:
          - {at: "@Восемь", sound: click}
        transition: cut
      - id: p_pit
        at: "@В-0.1"
        visual: "Архивный разрез дома нижнего города: в яме лифта светится кабина с двумя фигурками — взрослый и девочка; значок «СВЯЗЬ 0»; стрелки: весь дом вместе с ямой стоит на мокром грунте."
        actors: [house_section, mark, archive]
        camera: "Наезд на яму"
        animation:
          - {at: "@яме", what: "Кабина в яме подсвечивается"}
          - {at: "@нет", what: "Значок «связь 0»"}
        graphics:
          - {at: "@нет", type: callout, text: "ЯМА · 2 ЧЕЛ. · СВЯЗЬ 0"}
        sfx:
          - {at: "@яме", sound: drip}
        transition: cut
      - id: p_roofs
        at: "@На-0.1"
        visual: "Взгляд вверх по фасаду: на крышах трёх панелек — силуэты жильцов с вещами; над ними — нижняя поверхность перевёрнутого моря, тёмно-зелёная, гребни свисают; на крыше ближнего дома седой старик с приёмником."
        actors: [sky, sky_sea, panel_block, person, rain, archive]
        camera: "Медленный подъём по фасаду к крышам"
        animation:
          - {at: "@крышах", what: "Силуэты на крышах, фонарики"}
          - {at: "@двор", what: "В кадр входит поверхность моря над крышами"}
        sfx:
          - {at: "@крышах", sound: noise_sweep}
        transition: cut
      - id: p_alert
        at: "@Из-0.1"
        visual: "Решётка громкоговорителя на столбе, капли с неё уходят вверх; ЭЛТ-экран системы: «ПРОТОКОЛ 09 · УРОВЕНЬ МОРЯ: РЕЧНАЯ · 07:20 · ОСТАВАЙТЕСЬ НА КРЫШАХ · ВЕРТОЛЁТЫ»."
        actors: [crt_tv, archive]
        camera: "Наезд на экран"
        animation:
          - {at: "@Протокол", what: "«ВНИМАНИЕ ВСЕМ · ПРОТОКОЛ 09»"}
          - {at: "@двадцать", what: "«МОРЕ: РЕЧНАЯ · 07:20»"}
          - {at: "@вертолёты", what: "«ЖДИТЕ ВЕРТОЛЁТЫ», сбой"}
        sfx:
          - {at: "@Протокол", sound: alarm}
          - {at: "@вертолёты", sound: glitch}
        transition: glitch

  # ------------------------------------------------------------------ 5. RULE — сухой прямоугольник; камешек; под мостом сухо
  - id: rule
    role: rule
    title: "Сухое не поднимается"
    goal: "Правило r5 как опыт: камешек из лужи — вверх, с сухого — вниз; сухая земля не поднимется; ребёнок находит, где её много: под мостом."
    vo: "Соня тянет его за рукав. Где ночью стояла машина, асфальт сухой. Глеб бросает камешек из лужи. Он улетает вверх. Камешек с сухого — падает. Сухая земля тяжёлая. Она не поднимется. Пап, под мостом всегда сухо! Мост через Речную. Двести метров."
    lines:
      - {who: sonya, say: "Пап, под мостом всегда сухо!"}
    scene: {when: "06:53", where: "двор на Речной: место у подъезда, где ночью стояла машина"}
    on_screen: "ПРАВИЛО 05 · СУХАЯ ЗЕМЛЯ НЕ ПОДНИМАЕТСЯ"
    devices: [visual_proof, text_reinforcement, callback, foreshadowing]
    music: tension
    marks: {"сухой": "#f2f4f6", "под мостом": "#f2f4f6"}
    shots:
      - id: r_patch
        visual: "Сверху, как с камеры наблюдения: мокрый тёмный асфальт с лужами, из которых идёт дождь вверх, — и ровный светлый сухой прямоугольник по форме машины; у его края стоят Соня и Глеб. В небе — машина, которая улетела в шесть сорок две."
        actors: [new:asphalt_top, person, rain, archive]
        camera: "Сверху, медленный наезд на прямоугольник"
        animation:
          - {at: "@рукав", what: "Соня тянет Глеба"}
          - {at: "@машина", what: "Контур машины пунктиром"}
          - {at: "@сухой", what: "Прямоугольник подсвечен"}
        graphics:
          - {at: "@сухой", type: callout, text: "ЗДЕСЬ СТОЯЛА МАШИНА · СУХО"}
        sfx:
          - {at: "@сухой", sound: click}
        transition: cut
      - id: r_stones
        at: "@Глеб-0.1"
        visual: "Крупно рука в перчатке над асфальтом: камешек из лужи — мокрый, блестит — выпущен и улетает вверх; камешек с сухого — падает и стучит. Стрелки ↑ и ↓."
        actors: [new:asphalt_top, new:pebble, archive]
        camera: "Крупный план, лёгкая дрожь"
        animation:
          - {at: "@вверх", what: "Мокрый камешек улетает вверх"}
          - {at: "@падает", what: "Сухой падает, отскок"}
        sfx:
          - {at: "@вверх", sound: whoosh}
          - {at: "@падает", sound: click}
        transition: cut

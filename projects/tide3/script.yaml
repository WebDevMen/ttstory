  kpi: [completion, comments, rewatch, shares, follows]
  audience:
    who: "Зрители частей 1–2 и любители страшилок-«протоколов», фантастики и сюжетных роликов, которые ждут развязку и спорят, как поступили бы сами"
    age: "16–34"
    interests: [фантастика, страшные истории, правила выживания, «Чёрное зеркало», петли времени]
    pains: ["финалы, где всё решает чудо из ниоткуда", "загадки, на которые так и не ответили", "герой, который ничем не платит за победу"]
    desires: ["ответ на обрыв части 2 в первые секунды", "развязка по уже известным правилам", "герой, который делает выбор с ценой", "последний кадр, который перекликается с первым кадром серии"]
    knowledge: "Видели части 1–2: дождь вверх, мокрое падает в небо, сухое тяжёлое; голос с номера Глеба — он сам; над облаками море вверх дном, оно опускается на квартал каждые двадцать минут. Новичкам всё объясняется по ходу"
  promise: "Глеб отвечает на звонок из-под воды — и узнаёт, что яма, которая спасла его в первой части, утонула вместе с домом. У него восемь минут, чтобы вытащить из ямы самого себя и найти землю, которая не поднимается."
  tone: "Холодный пасмурный свет, сталь и бетон; море вверх дном над крышами, окна под водой; в конце — первое солнце серии, зелёное сквозь воду, и тёплый вечерний свет. Жёлтый — единственный тёплый цвет до самого финала."
  keywords: ["звонят с вашего номера", "дождь вверх", "обратный прилив", "протокол", "финал", "фантастика"]
  constraints:

# СЦЕНАРИЙ: «Обратный прилив. Протокол 09» — часть 3 из 3, ФИНАЛ серии, одна история ~3 минуты (вымысел, фантастика).
# Продолжение projects/tide и projects/tide2: та же точка зрения (Глеб), та же ставка (Соня), та же стилистика EMERGENCY ARCHIVE.
# Отвечает на обрыв части 2 (с номера Глеба звонят из-под воды, когда оба Глеба на земле) и закрывает серию:
# петля разорвана, прилив остановлен, звонок «со своего номера» в последний раз — от Сони; вечером идёт обычный дождь, «он сладкий».
# Правила ясности: docs/SCRIPTING.md §14.6. Проверка: python3 vg.py script check tide3 [--tts]
#
# Время (at:) — ссылки на слова текста ЭТОГО блока. Реплики героев написаны прямо в vo, lines отмечает, чья реплика.
# Глебов трое, и каждый подписан на экране: «наш» Глеб (точка зрения), «Глеб из-под воды» (прошлый круг, зона 06) и «нижний Глеб» (в яме лифта).


        camera: "Медленный отъезд"
        animation:
          - {at: "@кончается", what: "Дождь редеет"}
          - {at: "@капля", what: "Последняя капля уходит в воду, круги"}
          - {at: "@замирает", what: "Море останавливается"}
          - {at: "@антенной", what: "Метка 1 М"}
        graphics:
          - {at: "@кончается", type: rule_card, text: "07:20 · ДОЖДЬ КОНЧИЛСЯ"}
        sfx:
          - {at: "@капля", sound: drip}
          - {at: "@замирает", sound: chime}
        transition: cut

  # ------------------------------------------------------------------ 10. FINAL — солнце; звонок с моего номера — Соня; вечер: «он сладкий»
  - id: final
    role: payoff
    title: "Он сладкий"
    goal: "Развязка по правилам: облака рвутся, солнце сушит, сухое тяжелеет — квартал садится, как лифт. Последний звонок со своего номера — от Сони."
    vo: "Облака рвутся. Солнце. Сквозь море оно зелёное. У Глеба жужжит телефон. Звонит Глеб. Его номер. Он отвечает сразу. Пап, тут солнце! Высохнет — снова тяжёлое. Через час квартал садится. Плавно, как лифт."
    lines:
      - {who: sonya, say: "Пап, тут солнце!"}
    scene: {when: "07:21 → 08:21", where: "крыша под морем → посадка у моста"}
    on_screen: "07:21 · ЗВОНИТ МОЙ НОМЕР"
    devices: [callback, emotion, mini_payoff, twist]
    music: epic
    marks: {"тут солнце": "#ffd23a"}
    shots:
      - id: f_sun
        visual: "Над морем рвутся облака — впервые за серию солнце: свет проходит сквозь толщу перевёрнутого моря и падает на город зелёными колышущимися пятнами; от крыши идёт пар."
        actors: [sky, sky_sea, new:roof, person, archive]
        camera: "Медленный подъём, камера разворачивается к свету"
        animation:
          - {at: "@рвутся", what: "Облака расходятся"}
          - {at: "@Солнце", what: "Лучи сквозь воду, каустика по крыше"}
          - {at: "@зелёное", what: "Пар от мокрой крыши"}
        sfx:
          - {at: "@Солнце", sound: riser}
        transition: dip
      - id: f_call
        at: "@жужжит-0.1"
        visual: "Экран телефона на солнце: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР · РЕЧНАЯ, МОСТ». Без плашки протокола. Глеб жмёт сразу; на экране фото — две Сони под мостом, машут."
        actors: [phone_call, archive]
        camera: "Ручная, наезд"
        animation:
          - {at: "@Звонит", what: "Вызов, мост в подписи"}
          - {at: "@сразу", what: "Ответ, без плашки"}
          - {at: "@солнце#2", what: "Метка «С ТЕЛЕФОНА НИЖНЕГО ГЛЕБА»"}
        graphics:
          - {at: "@солнце#2", type: callout, text: "СОНЯ · С ТЕЛЕФОНА НИЖНЕГО ГЛЕБА"}
        sfx:
          - {at: "@жужжит", sound: buzz}
          - {at: "@сразу", sound: click}
        transition: cut
      - id: f_dry
        at: "@Высохнет-0.1"
        visual: "Крыша на солнце: от бетона, курток и антенны идёт пар; Петрович снимает очки, протирает; Глеб с телефоном у уха смеётся. Капли на перилах больше не уходят вверх — тяжелеют и висят."
        actors: [sky_sea, new:roof, person, archive]
        camera: "Медленный облёт"
        animation:
          - {at: "@Высохнет", what: "Пар от крыши"}
          - {at: "@тяжёлое", what: "Капля на перилах тяжелеет и висит"}
        sfx:
          - {at: "@тяжёлое", sound: drip}
        transition: cut
      - id: f_land
        at: "@Через-0.1"
        visual: "Дрон: высохший квартал опускается в свою яму у моста, медленно, как кабина; над городом остаётся море, в нём горят окна. Метка «08:21 · ПОСАДКА · ЛИФТЁР: ПЛАВНО»."
        actors: [sky, sky_sea, city_chunk, new:bridge, archive]
        camera: "Дрон, медленное опускание вместе с кварталом"
        animation:
          - {at: "@садится", what: "Квартал опускается, касание, пыль"}
          - {at: "@лифт", what: "Метка «ПЛАВНО»"}
        graphics:
          - {at: "@лифт", type: callout, text: "08:21 · ПОСАДКА"}
        sfx:
          - {at: "@садится", sound: impact}
        transition: cut
  # ------------------------------------------------------------------ 11. EPILOGUE — вечер: обычный дождь, «он сладкий»
  - id: epilogue
    role: payoff
    title: "Он сладкий"
    goal: "Последний кадр серии повторяет первый: вечером обычный дождь идёт вниз, Соня складывает зонт и ловит его языком — «он сладкий»."
    vo: "Вечером идёт обычный дождь. Вниз. Соня складывает зонт. Пап, он сладкий!"
    lines:
      - {who: sonya, say: "Пап, он сладкий!"}
    scene: {when: "вечер", where: "двор на Речной"}
    on_screen: "ПРОТОКОЛ 09 ЗАВЕРШЁН"
    devices: [callback, emotion, loop_ending]
    music: epic
    marks: {"он сладкий": "#ffd23a"}
    shots:
      - id: f_evening
        visual: "Тот же ракурс, что в первом кадре части 1: двор на Речной вечером, тёплые окна, обычный дождь идёт ВНИЗ; Соня в жёлтой куртке складывает жёлтый зонт и ловит дождь языком; Глеб рядом не останавливает её. Над крышами в темноте — море, в нём одно окно мигает фонарём."
        actors: [sky, sky_sea, panel_block, wet_ground, person, umbrella, rain, archive]
        camera: "Медленный наезд, как в начале серии"
        animation:
          - {at: "@Вниз", what: "Дождь идёт вниз"}
          - {at: "@зонт", what: "Соня складывает зонт"}
          - {at: "@сладкий", what: "Соня смеётся; в море мигает фонарь"}
        graphics:
          - {at: "@сладкий", type: callout, text: "ЗАПИСЬ 093 / 093"}
        sfx:
          - {at: "@Вниз", sound: drip}
          - {at: "@сладкий", sound: chime}
        ambience: [rain]
        transition: cut

  # ------------------------------------------------------------------ 11. CTA — под мост или на крышу
  - id: cta
    role: cta
    title: "Под мост или на крышу"
    goal: "Вопрос-выбор одним словом по главной дилемме финала; конец серии."
    vo: "Под мост с дочкой или на крышу за соседями? Пиши одним словом. Обратный прилив. Конец."
    on_screen: "ПОД МОСТ ИЛИ НА КРЫШУ?"
    devices: [comment_bait, callback]
    music: drone
    shots:
      - id: q_choice
        visual: "Тёмный экран-архив: две карточки — «А · ПОД МОСТ: С ДОЧЕРЬЮ» и «Б · НА КРЫШУ: ЗА СОСЕДЯМИ»; сверху тихое море с горящими окнами. Финал — «ПРОТОКОЛ 09 ЗАВЕРШЁН · КОНЕЦ ЗАПИСИ 093 / 093»."
        actors: [sky_sea, rule_card, title_card, archive]
        camera: "Медленный наезд"
        animation:
          - {at: "@дочкой", what: "Карточка А"}
          - {at: "@соседями", what: "Карточка Б"}
          - {at: "@одним", what: "Вопрос"}
          - {at: "@Конец", what: "КОНЕЦ ЗАПИСИ"}
        graphics:
          - {at: "@одним", type: title, text: "ПОД МОСТ ИЛИ НА КРЫШУ?"}
          - {at: "@Конец", type: title, text: "ОБРАТНЫЙ ПРИЛИВ · КОНЕЦ"}
        sfx:
          - {at: "@дочкой", sound: blip}
          - {at: "@соседями", sound: blip}
          - {at: "@Конец", sound: glitch}
        transition: glitch

loops:
  - {id: l0, question: "Почему звонящий из-под воды — это «вы через двадцать минут»?", open: hook, close: call}
  - {id: l1, question: "Что не поднимается, если всё мокрое падает в небо?", open: call, close: rise}
  - {id: l2, question: "Что будет в семь двадцать, когда море дойдёт до Речной?", open: problem, close: twist}
  - {id: l3, question: "Успеет ли Глеб вниз и останется ли Соня с другим папой?", open: dilemma, close: final}
  - {id: l4, question: "Каким будет дождь, когда всё кончится?", open: setup, close: epilogue}


  assets:
    - "Своя графика без ИИ. Актёры частей 1–2 (projects/tide/actors, projects/tide2/actors) подключаются целиком — одна серия, один мир"
    - "Новые актёры (projects/tide3/actors): двор сверху с сухим прямоугольником и камешками; бетонный мост через Речную с сухой полосой; щиток аварийной связи лифта в подвале; разрез стены шахты (два Глеба через бетон); крыша панельки с антеннами и люком; круглый барометр; закрытая кабина на дне моря"
  concept:
    name: "EMERGENCY ARCHIVE, часть 3 — записи 063–093"
    rules:
      - "Тот же утёкший видеопротокол: камеры наблюдения, телефон, нашлемная камера, дрон, документы; интерфейс в углу, правило — крупно на 1–2 с; красный — только опасность"
      - "Нумерация продолжает части 1–2 (001–062): эта часть — 063–093, последняя запись — 093 / 093"
      - "Новое в графике: море всю часть висит над крышами (тёмно-зелёный потолок); светлый сухой асфальт — цвет спасения; в финале первый тёплый свет серии — солнце сквозь воду и вечерние окна"
      - "Интерфейс начинает сломанным (stage 2, как в конце части 2) и чинится к финалу (stage 1); последняя метка — «ПРОТОКОЛ 09 ЗАВЕРШЁН»"
  notes:
    - "Каждый Глеб подписан: «ГЛЕБ, 29 · ЛИФТЁР», «ГЛЕБ · ИЗ-ПОД ВОДЫ · ЗОНА 06», «ГЛЕБ · НИЖНИЙ · ЯМА ЛИФТА»"
    - "Две Сони одинаковые — только по месту в кадре видно, кто чья; это не важно: «держи её» значит обеих"
    - "Последний кадр повторяет первую сцену части 1 — та же композиция двора и жёлтый зонт"

review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 8, emotion: 9, payoff: 9, visuals: 9, cta: 8, platform: 8, accuracy: 8}
  weak_points:
    - "Три Глеба в одной части: держится на подписях на экране, разных голосах (из-под воды — ниже и медленнее) и на том, что наш Глеб всегда в кадре."
    - "Конец дождя в семь двадцать — погода, а не подвиг героя; поэтому он подготовлен трижды (сирена «в семь двадцать», паспорт Петровича «тридцать лет на метеостанции», барометр) и героя спасает не он, а выбор, где стоять."
    - "Физика «сухая земля не поднимается» придумана, но выросла из правила части 1 «сухое — тяжёлое» и проверена на камешке."
  improvements:
    - "Ответ на обрыв части 2 — в первой сцене: Глеб отвечает, и сразу ясно, кто звонит и почему из-под воды."
    - "Спасение части 1 (яма) переосмыслено как ловушка — финал меняет смысл всей серии, а не добавляет новое чудо."
    - "Главный спор — с самим собой; реплика «тогда ошибёмся вместе» возвращает слова Петровича из части 1."
    - "Мотив звонка со своего номера закрыт: последний звонок — от Сони; последняя сцена повторяет первую сцену серии."

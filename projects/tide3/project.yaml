  # ------------------------------------------------------------------ 4. PROBLEM — восемь минут; яма; крыши; Протокол 09
  - id: problem
    text: "Восемь минут до семи. В яме лифта — нижний Глеб с дочкой. Связи там нет. На крышах — весь двор. Из динамиков — сирена. Протокол девять. Море дойдёт до Речной в семь двадцать. Оставайтесь на крышах. Ждите вертолёты."

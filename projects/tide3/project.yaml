            - {actor: mark, x: 420, y: 1440, w: 260, h: 500, at: "@Глеб", until: "@Соня-0.1", exit: fade, enter: {type: fade, dur: 0.2}, label: "ГЛЕБ, 29", sub: "ЛИФТЁР · ПОДЪЕЗД 2"}

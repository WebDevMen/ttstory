  # ------------------------------------------------------------------ 2. SETUP — нижний двор, 06:52; отвечает
  - id: setup
    text: "Шесть пятьдесят две. Двор на Речной, внизу. Глеб, двадцать девять лет, лифтёр. Соня, семь лет, его дочь. Они только что спустились с неба. Звонит Глеб. Его собственный номер. Протокол запрещает. Глеб отвечает."

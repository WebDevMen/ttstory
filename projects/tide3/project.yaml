    text: "Звонят с вашего номера из-под воды? Ответьте. Это вы через двадцать минут."
    gap_after: 1.4
    caption_marks: {"из-под воды": "#f2f4f6"}
    shots:
      - id: h_call
        transition: {type: fade, dur: 0.2}
        ambience: [{sound: rain, gain: -16}]
        look: {bloom: [0.8, 0.25]}
        draw:
          camera: {keys: [{t: 0, z: 1.06, x: 540, y: 1000}, {t: end, z: 1.14, x: 540, y: 930}], sway: {x: 5, y: 4, roll: 0.3, freq: 0.4}, shakes: [{at: "@номера", amp: 6, dur: 0.5, freq: 5}]}
          layers:
            - *sky_low
            - {actor: sky_sea, x: -260, y: -160, w: 1600, h: 960, level: 640, amp: 70, seed: 5, glow: 0.9, blocks: *sea_blocks, beacon: {x: 1028, y: 230}, par: 0.1}
            - {actor: cloud_bank, x: -500, y: 640, w: 2100, h: 380, color: "#8b96a1", shade: "#56616c", n: 26, blur: 34, opacity: 0.6, par: 0.12}

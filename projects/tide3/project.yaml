          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 2100}, {t: end, z: 1.04, x: 540, y: 1150, ease: inout}], sway: {x: 6, y: 4, roll: 0.4, freq: 0.3}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 3000, hour: 12, colors: ["#0e1a1c", "#2b3a40", "#66727d"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 2900}
            - {actor: sky_sea, x: -260, y: -200, w: 1600, h: 1200, level: 900, amp: 80, glow: 1, seed: 3, blocks: [{x: 300, y: 600, w: 260, floors: 9, cols: 5, lit: 0.45, fade: 0.4}, {x: 860, y: 760, w: 300, floors: 9, cols: 6, lit: 0.5, fade: 0.8, soil: 120}], beacon: {x: 822, y: 520}}
            - {actor: cloud_bank, x: -500, y: 860, w: 2100, h: 500, color: "#56616a", shade: "#28323a", n: 34, blur: 34}

            - {actor: mark, x: 540, y: 1010, w: 300, h: 560, space: screen, at: "@воды-0.1", enter: {type: fade, dur: 0.2}, label: "ГЛУБИНА 40 М", sub: "ИСТОЧНИК ВЫЗОВА · ЗОНА 06", side: top, danger: true}
            - {<<: *rule, y: 430, at: "@Ответьте-0.05", until: end, kicker: "ПРОТОКОЛ 09 · НИЖНИЙ ГОРОД", text: "ОТВЕТЬТЕ", size: 104}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ВИДЕО", tc: 24720, status: "ВРЕМЯ НЕ СОВПАДАЕТ", glitch: [{at: "@вашего", dur: 0.2}]}
      - id: h_title
        start: "@Это-0.22"

      - id: s_heroes
        start: "@Глеб-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.06, x: 520, y: 990}], sway: {x: 6, y: 6, roll: 0.5, freq: 0.6}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 1300, hour: 12, colors: ["#1d242b", "#38424b", "#5a6570"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 900, par: 0}
            - {actor: panel_block, x: 540, y: 1430, scale: 1.7, floors: 9, cols: 7, cell: [100, 84], seed: 6, lit: 0.25, entrances: [3], stains: 0.8, par: 0.5}

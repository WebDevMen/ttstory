            - {actor: rule_card, x: 540, y: 830, w: 900, kicker: "Б · ЗА СОСЕДЯМИ", text: "НА КРЫШУ", size: 110, at: "@соседями-0.2", enter: {type: wipe_right, dur: 0.25}, sfx: false}

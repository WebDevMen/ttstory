            - {actor: sky, x: -300, y: 0, w: 1680, h: 2000, hour: 12, colors: [{at: 0, v: ["#0e1a1c", "#2b3a40", "#56646e"]}], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1800, par: 0}

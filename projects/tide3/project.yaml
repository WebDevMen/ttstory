    text: "Соня тянет его за рукав. Где ночью стояла машина, асфальт сухой. Глеб бросает камешек из лужи. Он улетает вверх. Камешек с сухого — падает. Сухая земля тяжёлая. Она не поднимется. Пап, под мостом всегда сухо! Мост через Речную. Двести метров."
    lines:
      - {who: sonya, say: "Пап, под мостом всегда сухо!"}
    caption_marks: {"сухой": "#f2f4f6", "под мостом": "#f2f4f6"}

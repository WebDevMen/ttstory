            - {actor: panel_block, x: 880, y: 1540, scale: 0.75, floors: 9, cols: 5, seed: 8, lit: 0.15, color: "#737b82", par: 0.5}
            - {actor: wet_ground, x: -400, y: 1530, w: 1900, h: 600, par: 0.5}
            - {actor: rain, x: 0, y: 0, space: screen, count: 220, v: -0.7, alpha: 0.42, seed: 2}
            - {actor: phone_call, id: ph, x: 540, y: 1010, scale: 0.42, space: screen, state: incoming, bars: 3, clock: "06:52", name: "Глеб", number: "+7 912 406-17-33", own: "Мой номер",

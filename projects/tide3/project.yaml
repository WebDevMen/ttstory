# «Обратный прилив. Протокол 09» (~3:19) — часть 3 из 3, ФИНАЛ. Своя графика кодом (method draw), без ИИ-картинок.
# Та же концепция EMERGENCY ARCHIVE, что в частях 1–2 (projects/tide, projects/tide2): «найденные записи» (камеры
# наблюдения, телефон, нашлемная камера, дрон, документы) + кинематографичные кадры; интерфейс PROTOCOL 09 в углу
# (актёр archive), правила — крупно (rule_card), красный — только опасность. Новое: море вверх дном висит над крышами
# всю часть; светлый сухой асфальт — цвет спасения (мост, прямоугольник под машиной); в финале первое солнце серии —
# зелёное сквозь воду, вечерний тёплый двор. Интерфейс начинает сломанным (stage 2) и чинится к финалу (stage 1).
# Сценарий: projects/tide3/script.yaml. Актёры: частей 1–2 (через actors/series.txt) + actors/final.js.
# Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Обратный прилив. Протокол 09"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+15%", pitch: "+0Hz", tail: 1.6}
voices:
  system: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+6%", pitch: "-2Hz"}
  gleb: {voice: ru-RU-DmitryNeural, rate: "+10%", pitch: "-4Hz"}
  gleb_pit: {voice: ru-RU-DmitryNeural, rate: "+6%", pitch: "-6Hz"}
  gleb_deep: {voice: ru-RU-DmitryNeural, rate: "-4%", pitch: "-12Hz"}
  sonya: {voice: ru-RU-SvetlanaNeural, rate: "+16%", pitch: "+45Hz"}
  petrovich: {voice: ru-RU-DmitryNeural, rate: "-2%", pitch: "-18Hz"}

theme:
  preset: archive
  accent: "#d9e2ea"
  captions: {style: clean, top: auto, size: 64, max_chars: 20}

post: {vignette: 0.18, chromatic: 0, grain: 0.02}

draw:
  palette: {ink: "#0a0c0f", steel: "#3c4650", grey: "#8a96a2", white: "#f2f4f6", red: "#e3262f", yellow: "#ffd23a", water: "#9fc4dc", sea: "#1f4a4c", dry: "#cfc6a4"}

audio:
  music:
    key: E
    mode: minor
    bpm: 88
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@call.start", style: tension}
      - {at: "@dilemma.start", style: pulse}
      - {at: "@rise.start", style: epic}
      - {at: "@twist.start", style: sub}
      - {at: "@final.start", style: epic}
      - {at: "@cta.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-sky-low: &sky_low {actor: sky, x: -300, y: 0, w: 1680, h: 2000, hour: 12, colors: ["#16211f", "#36424a", "#5c6772"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1700, par: 0}
x-rule: &rule {actor: rule_card, x: 540, y: 800, space: screen, enter: {type: wipe_right, dur: 0.25}, exit: {type: fade, dur: 0.2}, sfx: false}
x-look-gleb: &gleb {age: adult, outfit: gakuran, hair: short, silhouette: "#14181c"}
x-look-sonya: &sonya {age: kid, outfit: kyushoku, hat: none, mask: false, hair: twintails, silhouette: "#6b5718"}

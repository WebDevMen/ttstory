  # ------------------------------------------------------------------ 10. FINAL — солнце сквозь море; звонок «мой номер» — Соня; квартал садится
  - id: final
    text: "Облака рвутся. Солнце. Сквозь море оно зелёное. У Глеба жужжит телефон. Звонит Глеб. Его номер. Он отвечает сразу. Пап, тут солнце! Высохнет — снова тяжёлое. Через час квартал садится. Плавно, как лифт."
    lines:
      - {who: sonya, say: "Пап, тут солнце!"}
    caption_marks: {"тут солнце": "#ffd23a"}
    shots:
      - id: f_sun
        transition: {type: dip, dur: 0.4}
        ambience: [{sound: water_calm, gain: -18}]
        look: {bloom: [0.7, 0.45]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: end, z: 1.06, x: 540, y: 940, ease: inout}]}

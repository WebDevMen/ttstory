  # ------------------------------------------------------------------ 6. DILEMMA — связь с кабиной: спор с самим собой; Соня — нижнему Глебу
  - id: dilemma
    text: "Подвал. Глеб жмёт связь с кабиной. Из ямы — его же голос. Вылезай. Яма поднимется вместе с домом. Мне сказали: в яму. Моим голосом. Это был я. Я ошибся. А если ошибаешься сейчас? Тогда ошибёмся вместе. Замок щёлкает. Под мост. Держи её. Пап, а ты? Я за соседями. Не успеешь."

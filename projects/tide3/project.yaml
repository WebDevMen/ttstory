            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ВЗГЛЯД ВВЕРХ", tc: 24733, status: "ВРЕМЯ НЕ СОВПАДАЕТ"}
      - id: s_answer
        start: "@Звонит-0.22"
        transition: {type: cut}
        captions_top: 1650
        draw:
          bg: "#0e1114"
          camera: {keys: [{t: 0, z: 1.0}, {t: "@отвечает", z: 1.05}, {t: end, z: 1.1}], shakes: [{at: "@Звонит", amp: 6, dur: 0.6, freq: 5}], sway: {x: 6, y: 6, roll: 0.6, freq: 0.7}}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#2a3138", "#0e1114"]}}

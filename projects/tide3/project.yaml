            - {actor: shape, kind: path, d: "M600,2600 C590,2000 640,1700 610,950", fill: "none", stroke: "#20262b", sw: 6}
            - {actor: cloud_bank, x: -500, y: 850, w: 2100, h: 700, color: "#a7b1ba", shade: "#6c7782", n: 40, blur: 30, speed: 10, opacity: [{at: 0, v: 1}, {at: "@неба", v: 0.75, dur: 1}]}

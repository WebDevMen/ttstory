  # ------------------------------------------------------------------ 3. CALL — Глеб из-под воды
  - id: call
    text: "В трубке — его голос. И вода. Не сбрасывай. Я тоже спустился на простынях. Тоже спрятался с ними в яме. Яма поднимается вместе с домом. Теперь мы под водой. Вытащи их из ямы. До семи. А куда? Найди то, что не поднимается. Гудки."
    lines:
      - {who: gleb_deep, say: "Не сбрасывай. Я тоже спустился на простынях."}
      - {who: gleb_deep, say: "Тоже спрятался с ними в яме."}
      - {who: gleb_deep, say: "Яма поднимается вместе с домом. Теперь мы под водой."}
      - {who: gleb_deep, say: "Вытащи их из ямы. До семи."}
      - {who: gleb, say: "А куда?"}
      - {who: gleb_deep, say: "Найди то, что не поднимается."}
    caption_marks: {"под водой": "#f2f4f6", "не поднимается": "#f2f4f6"}
    shots:
      - id: c_ear
        transition: {type: cut}
        captions_top: 1650
        draw:
          bg: "#0e1114"

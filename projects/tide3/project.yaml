            - {actor: person, id: sonya, x: 580, y: 1700, scale: 0.95, look: *sonya, face: [{at: 0, v: sad}, {at: "@дочь", v: neutral}], pose: stand, look_dx: -0.5, at: "@Соня-0.3", enter: {type: fade, dur: 0.3}}

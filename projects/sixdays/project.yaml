  # ------------------------------------------------------------------ seoul: Доказательство — Ему нужен объектив
  # задача: Правило 2 проверено на стороже: оно обходит человека и идёт к камере.
  # на экране: «ЕМУ НУЖЕН ОБЪЕКТИВ»
  - id: seoul
    text: "День четвёртый. Сеул, парковка, трещат лампы. Сторож стоит между ним и камерой. Восемь метров. Оно обходит сторожа, не повернув головы. Людей оно не трогает. Ему нужен объектив."
    caption_marks: {"восемь метров": "#e8333f", "объектив": "#e8333f"}
    shots:
      - id: r_seoul
        # ВИЗУАЛ: Запись камеры подземной парковки: ряды колонн, машины, люминесцентные лампы, дальний пандус в
        #         темноте; сторож с фонарём стоит в середине кадра между камерой и фигурой. Рамка «8 М».
        # актёры: new:parking, new:creature, person, torch, cctv, new:vhs
        # камера: Статика камеры наблюдения, лёгкий зум на «Восемь»
        # анимация: @Сеул — Мигает лампа, по полу ползёт свет фонаря
        # анимация: @Сторож — Сторож поднимает фонарь в сторону фигуры
        # анимация: @Восемь — Рамка захвата: 8 М
        transition: {"type": "glitch"}
        ambience: [{"sound": "hum", "gain": -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@Восемь", z: 1.0}, {t: "@Восемь+0.14", z: 1.25, x: 560, y: 1000, ease: out}, {t: end, z: 1.28, x: 560, y: 1000}]}
          layers:
            - {actor: corridor, kind: parking, vx: 540, vy: 840, lamp: [{at: 0, v: 0}, {at: "@трещат", v: 1}]}
            - {actor: creature, id: it, x: 600, y: 1200, h: 560, tilt: 20, soft: 0.6}
            - {actor: person, id: guard, x: 470, y: 1420, scale: 1.45, look: {age: adult, outfit: suit, color: "#2b2f36", hair: buzz, skin: mid, hat: cap, cap_color: "#1c1e22"}, face: neutral, pose: [{at: 0, v: stand}, {at: "@Сторож", v: point, dur: 0.4}], grayscale: 1, brightness: 0.8}
            - {actor: light_pool, x: 620, y: 1250, r: 300, sy: 0.4, color: "#e9ecee", a: [{at: 0, v: 0}, {at: "@Сторож", v: 0.35, dur: 0.3}]}
            - {<<: *vhs, label: "ЗАПИСЬ №4", date: "ДЕНЬ 4", clock: 8410, cam: "CAM B2-07"}
            - {<<: *tag, text: "ДЕНЬ 4 · СЕУЛ", at: "@День", enter: fade}
            - {actor: shape, kind: rect, x: 600, y: 920, w: 200, h: 600, fill: none, stroke: red, sw: 4, at: "@Восемь", enter: zoom}
            - {<<: *rbadge, title: "8 МЕТРОВ", x: 540, y: 330, at: "@Восемь"}
      - id: r_around
        # ВИЗУАЛ: Та же парковка: фигура в три длинных шага огибает сторожа по дуге, его фонарь светит в пустоту;
        #         голова фигуры всё время повёрнута прямо в объектив, красная точка растёт. Пунктир траектории
        #         дугой вокруг сторожа к камере.
        # актёры: new:parking, new:creature, person, torch, cctv, new:vhs, shape
        # камера: Статика, кадр дрожит на каждом шаге
        # анимация: @обходит — Фигура шагает по дуге вокруг сторожа
        # анимация: @повернув — Голова не двигается — точка смотрит в камеру
        # анимация: @трогает — Сторож оборачивается — фигуры за ним уже нет
        start: "@обходит-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.0, x: 540, y: 960}], shakes: [{at: "@обходит+0.3", amp: 6, dur: 0.2}, {at: "@обходит+0.9", amp: 6, dur: 0.2}, {at: "@повернув", amp: 8, dur: 0.25}]}
          layers:
            - {actor: corridor, kind: parking, vx: 540, vy: 840, lamp: [{at: 0, v: 0}, {at: "@трещат", v: 1}]}
            - {actor: shape, kind: path, d: "M600,1200 Q920,1300 820,1520 Q760,1700 560,1880", fill: none, stroke: red, sw: 5, dash: "16 12", at: "@обходит", enter: draw, enter_dur: 1.0}
            - {actor: person, id: guard, x: 470, y: 1420, scale: 1.45, look: {age: adult, outfit: suit, color: "#2b2f36", hair: buzz, skin: mid, hat: cap, cap_color: "#1c1e22"}, face: [{at: 0, v: neutral}, {at: "@трогает", v: surprised}], pose: point, grayscale: 1, brightness: 0.8, flip: [{at: 0, v: false}, {at: "@трогает", v: true}]}
            - {actor: creature, id: it, x: [{at: 0, v: 600}, {at: "@обходит", v: 830, dur: 1.2, ease: inOutSine}, {at: "@повернув", v: 620, dur: 1.4, ease: in}], y: [{at: 0, v: 1200}, {at: "@обходит", v: 1450, dur: 1.2, ease: inOutSine}, {at: "@повернув", v: 1960, dur: 1.4, ease: in}], h: [{at: 0, v: 560}, {at: "@обходит", v: 690, dur: 1.2}, {at: "@повернув", v: 1500, dur: 1.4, ease: in}], walk: [{at: 0, v: 0}, {at: "@обходит", v: 1.4}], tilt: 20, soft: 0.8}
            - {<<: *vhs, label: "ЗАПИСЬ №4", date: "ДЕНЬ 4", clock: 8418, cam: "CAM B2-07", tear: [{at: 0, v: 0}, {at: "@трогает", v: 0.7, dur: 0.1}, {at: "@трогает+0.4", v: 0.1, dur: 0.3}]}
            - {<<: *rbadge, title: "ЛЮДЕЙ НЕ ТРОГАЕТ", x: 540, y: 330, at: "@обходит"}
      - id: r_lens
        # ВИЗУАЛ: Стоп-кадр: красная точка фигуры в отражении линзы камеры парковки — крупный объектив, в стекле
        #         изогнутое отражение силуэта; кольца диафрагмы.
        # актёры: new:lens, new:creature, new:vhs, text
        # камера: Резкий наезд в зрачок объектива
        # анимация: @объектив — Диафрагма сжимается, отражение фигуры заполняет линзу
        start: "@Ему-0.22"
        transition: {"type": "zoom"}
        draw:
          camera: {keys: [{t: 0, z: 0.9, x: 540, y: 900}, {t: end, z: 1.25, x: 540, y: 900, ease: in}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {linear: ["#020203", "#0b0c0e"], angle: 180}}
            - {actor: lens, x: 540, y: 900, r: 400, close: [{at: 0, v: 0}, {at: "@объектив", v: 0.75, dur: 0.6, ease: out}], reflect: [{at: 0, v: 0.3}, {at: "@объектив", v: 1, dur: 0.8}]}
            - {<<: *vhs, text: false, grain: 0.12}
            - {<<: *title, y: 330, text: "ЕМУ НУЖЕН ОБЪЕКТИВ", at: "@Ему-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
    sfx:
      - {"sound": "glitch", "at": "@День", "gain": -14}
      - {"sound": "blip", "at": "@Восемь", "gain": -14}
      - {"sound": "footstep", "at": "@обходит", "gain": -14}
      - {"sound": "creature", "at": "@повернув", "gain": -14}
      - {"sound": "boom", "at": "@объектив", "gain": -14}

  # ------------------------------------------------------------------ day5: Эскалация — Четыре метра
  # задача: Запись 5 с чужого телефона: оно закрывает полэкрана — следующая будет ещё ближе.
  # на экране: «ДЕНЬ 5 · 4 М»
  - id: day5
    text: "День пятый. Чужой телефон, четыре метра. Рука дрожит. Оно закрывает полэкрана."
    caption_marks: {"четыре метра": "#e8333f"}
    shots:
      - id: d_phone
        # ВИЗУАЛ: Вертикальная запись с чужого телефона: тёмный двор панельного дома, качели, фонарь; фигура в
        #         четырёх метрах закрывает половину экрана, красная точка размыта автофокусом; рука снимающего
        #         дрожит. Рамка «4 М».
        # актёры: new:phone_rec, house, streetlight, ground, new:creature, new:vhs
        # камера: Ручная тряска, автофокус «дышит»
        # анимация: @телефон — Камера дрожит, фокус гуляет
        # анимация: @четыре — Рамка захвата, 4 М
        # анимация: @полэкрана — Фигура делает шаг, закрывая половину кадра, запись обрывается
        transition: {"type": "glitch"}
        ambience: [{"sound": "wind", "gain": -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.04, x: 540, y: 960}], sway: {x: 16, y: 18, freq: 0.35}}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 500, w: 1500, h: 1100, fill: {linear: ["#050608", "#15171a"], angle: 180}}
            - {actor: building, x: 300, y: 1030, floors: 9, cols: 5, color: "#1c1e21", win_off: "#0c0d0f", win_on: "#8f8c80", lit: 0.25, seed: 4}
            - {actor: building, x: 880, y: 1030, floors: 9, cols: 4, color: "#191b1e", win_off: "#0c0d0f", win_on: "#8f8c80", lit: 0.2, seed: 9}
            - {actor: ground, x: -400, y: 1010, w: 1900, h: 1000, color: ["#2a2c2f", "#141518"]}
            - {actor: streetlight, x: 140, y: 1230, h: 600, on: 1, color: "#c9c6bb"}
            - {actor: light_pool, x: 170, y: 1230, r: 380, sy: 0.35, color: "#c9c6bb", a: 0.35}
            - {actor: creature, id: it, x: [{at: 0, v: 600}, {at: "@полэкрана", v: 560, dur: 0.5, ease: out}], y: [{at: 0, v: 1700}, {at: "@полэкрана", v: 2500, dur: 0.5, ease: out}], h: [{at: 0, v: 1050}, {at: "@полэкрана", v: 2300, dur: 0.5, ease: out}], tilt: 16, soft: [{at: 0, v: 3}, {at: "@телефон", v: 1.2, dur: 0.6}, {at: "@дрожит", v: 4, dur: 0.3}, {at: "@дрожит+0.5", v: 1.5, dur: 0.3}]}
            - {actor: cam_ui, x: 0, y: 0, mode: phone, timer: 3, space: screen}
            - {<<: *vhs, text: false, grain: 0.18, scan: 0.12, snow: [{at: 0, v: 0}, {at: "@полэкрана+0.5", v: 1, dur: 0.1}], tear: [{at: 0, v: 0}, {at: "@полэкрана", v: 1, dur: 0.1}]}
            - {<<: *tag, text: "ДЕНЬ 5 · ЗАПИСЬ С ТЕЛЕФОНА", y: 340, at: "@День", enter: fade}
            - {<<: *rbadge, title: "4 МЕТРА", x: 540, y: 470, at: "@четыре"}
    sfx:
      - {"sound": "glitch", "at": "@День", "gain": -14}
      - {"sound": "heartbeat", "at": "@четыре", "gain": -14}
      - {"sound": "noise_sweep", "at": "@полэкрана", "gain": -14}

  # ------------------------------------------------------------------ dilemma: Эскалация — Выложить или стереть
  # задача: Пятая запись (4 м) и спор Олега и Веры: у каждого своя правда; Вера снова ставит запись на повтор.
  # на экране: «ВЫЛОЖИТЬ ИЛИ СТЕРЕТЬ?»
  - id: dilemma
    text: "Олег кладёт на стол флешку. Выкладываем подборку. Люди должны знать, как оно выглядит. А если ему нужно, чтобы на него смотрели? Тогда пусть знают, куда не смотреть. Вера включает пятую запись снова. Сорок первый раз."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: oleg, say: "Выкладываем подборку. Люди должны знать, как оно выглядит."}
      - {who: vera, say: "А если ему нужно, чтобы на него смотрели?"}
      - {who: oleg, say: "Тогда пусть знают, куда не смотреть."}
    shots:
      - id: d_drive
        # ВИЗУАЛ: Стол Веры сверху: рука Олега кладёт флешку с красной наклейкой «ПОДБОРКА»; на мониторе папка из
        #         пяти записей.
        # актёры: desk, new:monitor_wall, human_hand, prop, text
        # камера: Вид сверху, лёгкий наезд на флешку
        # анимация: @кладёт — Флешка ложится на стол с тенью
        # анимация: @Выкладываем — На мониторе прогресс загрузки замер на 0%
        draw:
          camera: {keys: [{t: 0, z: 1.06, x: 540, y: 980}, {t: end, z: 1.0, x: 540, y: 960, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#2a3240", "#11151c"]}}
            - {actor: shape, kind: rect, x: 540, y: 300, w: 980, h: 240, radius: 14, fill: "#0f1218", stroke: "#2a2f38", sw: 3, glow: {color: "#5aa0ff", r: 40, a: 0.4}}
            - {actor: shape, kind: rect, x: 520, y: 1260, w: 760, h: 240, radius: 16, fill: "#1a1d23", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 900, y: 1250, w: 120, h: 190, radius: 50, fill: "#1a1d23", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 300, y: 880, w: 120, h: 150, radius: 14, fill: "#cfd3d8", rot: -8}
            - {actor: shape, kind: rect, id: drv, x: [{at: 0, v: 760}, {at: "@кладёт", v: 600, dur: 0.6, ease: out}], y: [{at: 0, v: 300}, {at: "@кладёт", v: 860, dur: 0.6, ease: out}], w: 90, h: 220, radius: 12, fill: "#1b1d22", stroke: "#3a3f48", sw: 3, rot: 12, shadow: {x: 10, y: 14, blur: 14, a: 0.6}}
            - {actor: shape, kind: rect, x: [{at: 0, v: 760}, {at: "@кладёт", v: 600, dur: 0.6, ease: out}], y: [{at: 0, v: 335}, {at: "@кладёт", v: 895, dur: 0.6, ease: out}], w: 90, h: 90, fill: red, rot: 12}
            - {actor: human_hand, x: [{at: 0, v: 800}, {at: "@кладёт", v: 640, dur: 0.6, ease: out}, {at: "@подборку", v: 900, dur: 0.6, ease: in}], y: [{at: 0, v: 200}, {at: "@кладёт", v: 760, dur: 0.6, ease: out}, {at: "@подборку", v: -300, dur: 0.6, ease: in}], rot: 170, scale: 1.3, skin: "#d9b49a", sleeve: "#c9cdd4"}
            - {<<: *rbadge, title: "ПОДБОРКА · 5 ЗАПИСЕЙ", x: 540, y: 600, at: "@Выкладываем"}
      - id: d_argue
        # ВИЗУАЛ: Двухплановый спор у стола: Олег стоит, руки в карманах, освещён тёплой лампой; Вера сидит в
        #         синем свете монитора и смотрит на экран, а не на него. Между ними на экране — замёрший кадр
        #         фигуры. Подписи говорящих.
        # актёры: desk, new:monitor_wall, person, new:creature, callout
        # камера: Медленный наезд, на каждой реплике — смена фокуса между героями
        # анимация: @Люди — Олег говорит, жест рукой на экран
        # анимация: @если — Вера поворачивается к нему
        start: "@Люди-0.22"
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 700, y: 960}, {t: "@если", z: 1.06, x: 820, y: 940, ease: inout}, {t: end, z: 1.06, x: 760, y: 940}]}
          layers:
            - *office
            - {actor: light_pool, x: 380, y: 700, r: 500, sy: 0.9, color: "#ffb36a", a: 0.22}
            - {actor: person, id: oleg, x: 420, y: 1400, scale: 2.2, look: *oleg, face: talk, talk: [["@Выкладываем", "@выглядит.end"]], pose: [{at: 0, v: stand}, {at: "@Люди", v: point, dur: 0.35}]}
            - {actor: office_desk, x: 1060, y: 1400, w: 700, h: 300}
            - {actor: monitor, x: 860, y: 1110, w: 320, h: 200, glow: "#5aa0ff", children: [{actor: shape, kind: rect, x: 160, y: 100, w: 320, h: 200, fill: "#9aa0a4"}, {actor: creature, x: 160, y: 190, h: 150, tilt: 16}]}
            - {actor: light_pool, x: 960, y: 1150, r: 520, sy: 0.6, color: "#5aa0ff", a: 0.35}
            - {actor: person, id: vera, view: side, flip: true, x: 1180, y: 1400, scale: 2.0, look: *vera, pose: sit, face: [{at: 0, v: neutral}, {at: "@если", v: talk}], talk: [["@если", "@смотрели.end"]], look_dx: -1}
            - {actor: stack, dir: h, gap: 40, x: 540, y: 330, space: screen, at: "@если", enter: pop, children: [{actor: badge, title: "ВЫЛОЖИТЬ", style: solid, color: "#e8e8e4", size: 44}, {actor: badge, title: "СТЕРЕТЬ", style: solid, color: red, size: 44}]}
      - id: d_oleg2
        # ВИЗУАЛ: Крупно Олег в тёплом свете лампы, за ним тёмные окна офиса с огнями города; он выпрямляется и
        #         забирает флешку со стола.
        # актёры: room, skyline, person, prop, callout
        # камера: Медленный наезд на лицо Олега
        # анимация: @Тогда — Олег выпрямляется
        # анимация: @куда — Олег забирает флешку со стола
        start: "@Тогда-0.22"
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.02, x: 600, y: 940}, {t: end, z: 1.05, x: 580, y: 940, ease: inout}]}
          layers:
            - *office
            - {actor: light_pool, x: 380, y: 760, r: 600, sy: 0.9, color: "#ffb36a", a: 0.3}
            - {actor: person, id: oleg, x: 440, y: 1380, scale: 2.2, look: *oleg, face: talk, talk: [["@Тогда", "@смотреть.end"]], pose: [{at: 0, v: point}, {at: "@куда", v: hold, dur: 0.4}]}
            - {<<: *dbadge, title: "КУДА НЕ СМОТРЕТЬ", x: 540, y: 330, at: "@куда"}
      - id: d_replay
        # ВИЗУАЛ: Монитор крупно: пятая запись на повторе, счётчик просмотров щёлкает с 40 на 41; в отражении
        #         экрана — лицо Веры и маленький красный огонёк камеры над её столом.
        # актёры: new:monitor_wall, new:creature, new:view_counter, new:wall_camera, new:vhs
        # камера: Наезд на счётчик
        # анимация: @снова — Значок повтора крутится
        # анимация: @Сорок — Счётчик щёлкает 40 → 41, в отражении мигает красный огонёк
        start: "@Вера-0.22"
        transition: {"type": "dip"}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.12, x: 640, y: 760, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {linear: ["#03050a", "#0b1424"], angle: 180}}
            - {actor: monitor, x: 540, y: 1250, w: 840, h: 520, glow: "#5aa0ff", children: [{actor: shape, kind: rect, x: 420, y: 260, w: 840, h: 520, fill: "#141518"}, {actor: creature_face, x: 220, y: 0, w: 400, h: 520, cy: 760, tilt: 12}, {actor: shape, kind: circle, x: 760, y: 60, r: 9, fill: red, glow: {color: "#ff2a36", r: 26, a: 0.9}, blink: {freq: 0.8, duty: 0.6, min: 0.2}}, {actor: shape, kind: ellipse, x: 650, y: 140, w: 200, h: 240, fill: "rgba(160,190,230,.06)"}, {actor: text, x: 420, y: 470, size: 56, color: "#e8e8e4", text: "⟳", spin: 180, at: "@снова", enter: pop}, {actor: text, x: 690, y: 40, size: 30, font: mono, weight: 700, color: "#e8e8e4", text: [{at: 0, v: "👁 40"}, {at: "@Сорок", v: "👁 41"}]}]}
            - {<<: *rbadge, title: "ПРОСМОТР №41", x: 540, y: 330, at: "@Сорок"}
    sfx:
      - {"sound": "click", "at": "@кладёт", "gain": -14}
      - {"sound": "heartbeat", "at": "@если", "gain": -14}
      - {"sound": "click", "at": "@куда", "gain": -14}
      - {"sound": "click", "at": "@снова", "gain": -14}
      - {"sound": "ping", "at": "@Сорок", "gain": -14}

  # ------------------------------------------------------------------ twist: Поворот — Карта просмотров
  # задача: Улика щёлкает: каждая следующая запись — там, где предыдущую смотрели больше всех; пятую больше всех
  #         смотрела Вера.
  # на экране: «ОНО ИДЁТ НА ВЗГЛЯД»
  - id: twist
    text: "Вера открывает карту просмотров. Первую запись больше всех смотрели в Чили. Вторую — в Осаке. Третью — в Сеуле. Оно выходит туда, где на него смотрели больше всех. Пятую больше всех смотрел один адрес. Её стол."
    caption_marks: {"больше всех": "#e8333f", "Её стол": "#e8333f"}
    shots:
      - id: t_map
        # ВИЗУАЛ: Тёмная карта мира на мониторе, точки просмотров светятся; от Шпицбергена красная дуга к Чили, от
        #         Чили — к Осаке, от Осаки — к Сеулу; в каждом городе вспыхивает самый большой кружок просмотров.
        # актёры: map, shape, text, new:vhs
        # камера: Панорама по карте вслед за дугами
        # анимация: @карту — Карта загорается точками просмотров
        # анимация: @Чили — Дуга Шпицберген → Чили, самый большой кружок в Чили
        # анимация: @Осаке — Дуга Чили → Осака
        # анимация: @Сеуле — Дуга Осака → Сеул
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 860}, {t: end, z: 1.08, x: 540, y: 840, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2100, fill: "#05070c"}
            - {<<: *map, pins: [{lon: 15.6, lat: 78.2, label: "№1", at: "@карту", color: "#8d9196"}, {lon: -70.6, lat: -33.4, label: "№2", at: "@Чили", color: "#ff2a36"}, {lon: 135.5, lat: 34.7, label: "№3", at: "@Осаке", color: "#ff2a36"}, {lon: 127.0, lat: 37.5, label: "№4", at: "@Сеуле", color: "#ff2a36"}], routes: [{src: [15.6, 78.2], dst: [-70.6, -33.4], at: "@Чили-0.4", dur: 0.8, color: "#ff2a36", width: 4}, {src: [-70.6, -33.4], dst: [135.5, 34.7], at: "@Осаке-0.4", dur: 0.8, color: "#ff2a36", width: 4}, {src: [135.5, 34.7], dst: [127.0, 37.5], at: "@Сеуле-0.3", dur: 0.5, color: "#ff2a36", width: 4}]}
            - {<<: *tag, text: "КАРТА ПРОСМОТРОВ", at: "@карту", enter: fade}
            - {<<: *dbadge, title: "№1 → БОЛЬШЕ ВСЕХ: ЧИЛИ", x: 540, y: 1300, at: "@Чили", until: "@Осаке-0.1", exit: fade}
            - {<<: *dbadge, title: "№2 → БОЛЬШЕ ВСЕХ: ОСАКА", x: 540, y: 1300, at: "@Осаке", until: "@Сеуле-0.1", exit: fade}
            - {<<: *dbadge, title: "№3 → БОЛЬШЕ ВСЕХ: СЕУЛ", x: 540, y: 1300, at: "@Сеуле"}
      - id: t_rule
        # ВИЗУАЛ: Схема-правило на карте: глаз-кружок просмотров → стрелка → силуэт фигуры в следующем городе;
        #         крупная подпись.
        # актёры: map, new:creature, shape, text
        # камера: Наезд на схему
        # анимация: @выходит — Силуэт фигуры встаёт в кружке просмотров
        # анимация: @смотрели#2 — Все кружки просмотров на карте пульсируют красным
        start: "@Оно-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.06, x: 540, y: 940}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2100, fill: "#05070c"}
            - {<<: *map, opacity: 0.35}
            - {actor: shape, kind: circle, x: 300, y: 860, r: 120, fill: "rgba(255,42,54,.15)", stroke: red, sw: 5, at: "@Оно", enter: pop, pulse: {amp: 0.06, freq: 1.2}}
            - {actor: text, x: 300, y: 860, size: 90, text: "👁", at: "@Оно", enter: pop}
            - {actor: text, x: 300, y: 1030, size: 30, font: mono, weight: 700, color: "#e8e8e4", text: "БОЛЬШЕ ВСЕХ", at: "@Оно", enter: fade}
            - {actor: shape, kind: arrow, points: [[450, 860], [650, 860]], stroke: red, sw: 8, at: "@выходит", enter: draw}
            - {actor: shape, kind: rect, x: 790, y: 1130, w: 260, h: 30, fill: "#2a2c2f", at: "@выходит", enter: fade}
            - {actor: creature, x: 790, y: 1120, h: 400, tilt: 22, at: "@выходит", enter: fade}
            - {<<: *title, text: "ОНО ИДЁТ НА ВЗГЛЯД", at: "@выходит-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
      - id: t_address
        # ВИЗУАЛ: Карта приближается к Москве, к одному зданию, к одному этажу: кружок просмотров пятой записи —
        #         огромный, рядом цифра «41 · ОДИН АДРЕС»; план офиса с одним столом, подсвеченным красным.
        # актёры: map, new:office_plan, text, badge
        # камера: Быстрый зум с карты мира в план офиса
        # анимация: @пятую — Карта летит к Москве
        # анимация: @адрес — Кружок сжимается до одного здания, план этажа
        start: "@пятую-0.22"
        transition: {"type": "zoom"}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 820}, {t: "@адрес", z: 1.0}, {t: end, z: 1.5, x: 540, y: 820, ease: in}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2100, fill: "#05070c"}
            - {actor: map, x: 540, y: 820, w: 900, h: 900, projection: orthographic, rotate: [37.6, 50], highlight: ["Russia"], land: "#262a31", ocean: "#07090d", stroke: "#3a3f48", pins: [{lon: 37.6, lat: 55.75, label: "МОСКВА", at: "@пятую", color: "#ff2a36"}]}
            - {<<: *rbadge, title: "41 ПРОСМОТР · ОДИН АДРЕС", x: 540, y: 330, at: "@адрес"}
      - id: t_desk
        # ВИЗУАЛ: План этажа превращается в настоящий офис сверху: среди тёмных столов один — стол Веры — залит
        #         красным; Вера за ним поднимает голову; над столом мигает огонёк камеры.
        # актёры: new:office_plan, room, desk, person, new:wall_camera, text
        # камера: Резкий наезд на стол сверху
        # анимация: @Её — Стол Веры вспыхивает красным
        # анимация: @стол — Вера поднимает голову к камере над столом
        start: "@Её-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.25, x: 640, y: 1000}, {t: end, z: 1.0, x: 540, y: 920, ease: out}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2100, fill: "#07090d"}
            - {actor: shape, kind: rect, x: 540, y: 920, w: 860, h: 860, fill: none, stroke: "#3a3f48", sw: 4}
            - {actor: shape, kind: rect, x: 240, y: 620, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 240, y: 820, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 240, y: 1020, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 240, y: 1220, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 440, y: 620, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 440, y: 820, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 440, y: 1020, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 440, y: 1220, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 640, y: 620, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 640, y: 820, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 640, y: 1220, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 840, y: 620, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 840, y: 820, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 840, y: 1020, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 840, y: 1220, w: 150, h: 90, radius: 6, fill: "#1a1e26", stroke: "#2c313a", sw: 3}
            - {actor: shape, kind: rect, x: 640, y: 1020, w: 150, h: 90, radius: 6, fill: red, glow: {color: "#ff2a36", r: 40, a: 1}, at: "@Её", enter: pop}
            - {actor: wall_cam, x: 760, y: 950, size: 90, at: "@стол", enter: pop}
            - {<<: *title, text: "ЕЁ СТОЛ", y: 1500, at: "@стол-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
    sfx:
      - {"sound": "blip", "at": "@Чили", "gain": -14}
      - {"sound": "blip", "at": "@Осаке", "gain": -14}
      - {"sound": "blip", "at": "@Сеуле", "gain": -14}
      - {"sound": "impact", "at": "@выходит", "gain": -14}
      - {"sound": "whoosh", "at": "@пятую", "gain": -14}
      - {"sound": "blip", "at": "@адрес", "gain": -14}
      - {"sound": "boom", "at": "@стол", "gain": -14}

  # ------------------------------------------------------------------ day6: Раскрытие — День шестой
  # задача: Шестая запись снята над её столом, а Олег уже выложил подборку.
  # на экране: «ДЕНЬ 6 · 2 М»
  - id: day6
    text: "День шестой. Запись камеры над её столом. Красный огонёк. Два метра. Олег, удали подборку! Я выложил её час назад."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: vera, say: "Олег, удали подборку!"}
      - {who: oleg, say: "Я выложил её час назад."}
    caption_marks: {"два метра": "#e8333f"}
    shots:
      - id: c_cam
        # ВИЗУАЛ: Запись камеры наблюдения сверху: Вера за столом в синем свете мониторов, затылком к камере; в
        #         тёмном проходе между столами, в двух метрах за её спиной, стоит фигура — голова упирается в
        #         потолок, красная точка смотрит в объектив. REC, таймкод 03:33.
        # актёры: room, desk, new:monitor_wall, person, new:creature, cctv, new:vhs
        # камера: Статика камеры наблюдения, медленный цифровой зум
        # анимация: @запись — Кадр включается с помехой
        # анимация: @столом — Зум: в проходе проступает фигура
        # анимация: @два — Рамка захвата на фигуре: 2 М
        transition: {"type": "glitch"}
        ambience: [{"sound": "hum", "gain": -18}]
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 800, y: 960}, {t: "@столом", z: 1.0}, {t: end, z: 1.06, x: 760, y: 960, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 800, y: 960, w: 2000, h: 2100, fill: {linear: ["#55585b", "#6a6d70"], angle: 180}}
            - {actor: glass_wall, x: -200, y: 260, w: 2000, h: 600, cols: 6, color: "#2a2c2f"}
            - {actor: shape, kind: rect, x: 800, y: 1400, w: 2000, h: 1100, fill: {linear: ["#7a7d80", "#8e9194"], angle: 180}}
            - {actor: office_desk, x: 260, y: 1030, w: 520, h: 260, scale: 0.7}
            - {actor: office_desk, x: 1350, y: 1030, w: 520, h: 260, scale: 0.7}
            - {actor: creature, id: it, x: 560, y: 1300, h: 900, tilt: 26, soft: 0.8, dot: [{at: 0, v: 0}, {at: "@огонёк", v: 1, dur: 0.3}]}
            - {actor: office_desk, x: 940, y: 1450, w: 700, h: 300}
            - {actor: monitor, x: 840, y: 1160, w: 300, h: 210, glow: "#b9bec1", children: [{actor: shape, kind: rect, x: 170, y: 105, w: 340, h: 210, fill: "#8d9296"}]}
            - {actor: monitor, x: 1100, y: 1160, w: 260, h: 210, glow: "#b9bec1", children: [{actor: shape, kind: rect, x: 150, y: 105, w: 300, h: 210, fill: "#6d7175"}]}
            - {actor: back_view, x: 960, y: 1440, w: 320, rim: "#d0d3d6", top: "#45484d"}
            - {<<: *vhs, label: "ЗАПИСЬ №6", date: "ДЕНЬ 6", clock: 12780, cam: "CAM 03 · ОТДЕЛ"}
            - {<<: *tag, text: "ДЕНЬ 6 · КАМЕРА НАД ЕЁ СТОЛОМ", y: 330, at: "@запись", enter: fade}
            - {actor: shape, kind: rect, x: 560, y: 820, w: 260, h: 880, fill: none, stroke: red, sw: 4, at: "@метра", enter: zoom}
            - {<<: *rbadge, title: "2 МЕТРА", x: 540, y: 460, at: "@метра"}
      - id: c_oleg
        # ВИЗУАЛ: Вера вскакивает, оборачивается — проход пуст; Олег в дверях с телефоном, на телефоне —
        #         опубликованная подборка и счётчик, который несётся: 1 000 000 просмотров.
        # актёры: room, desk, person, phone, new:view_counter
        # камера: Резкий разворот камеры за Верой, затем наезд на телефон Олега
        # анимация: @Олег — Вера вскакивает, стул откатывается
        # анимация: @выложил — Олег поворачивает к ней экран телефона
        # анимация: @час — Счётчик просмотров разгоняется до миллиона
        start: "@Олег-0.22"
        transition: {"type": "whip_x"}
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.1, x: 600, y: 980}, {t: "@выложил", z: 1.1, x: 700, y: 980}, {t: "@час", z: 1.12, x: 960, y: 1000, ease: inout}, {t: end, z: 1.14, x: 960, y: 1000}], shakes: [{at: "@Олег", amp: 14, dur: 0.35}]}
          layers:
            - *office
            - {actor: office_desk, x: 540, y: 1400, w: 700, h: 300}
            - {actor: light_pool, x: 540, y: 1150, r: 520, sy: 0.6, color: "#5aa0ff", a: 0.35}
            - {actor: person, id: vera, x: 520, y: 1400, scale: 2.1, look: *vera, pose: [{at: 0, v: stand}, {at: "@удали", v: point, dur: 0.3}], face: [{at: 0, v: surprised}, {at: "@Олег", v: talk}, {at: "@выложил", v: surprised}], talk: [["@Олег", "@подборку.end"]]}
            - {actor: person, id: oleg, x: 1180, y: 1400, scale: 2.2, look: *oleg, face: talk, talk: [["@Я", "@назад.end"]], pose: hold, hold: phone}
            - {actor: card, x: 380, y: 640, w: 380, style: dark, color: red, title: "ПОДБОРКА: 6 ДНЕЙ", sub: "ОПУБЛИКОВАНО 1 Ч НАЗАД", at: "@выложил", enter: pop, space: screen}
            - {actor: text, x: 540, y: 330, size: 80, font: mono, weight: 800, color: red, space: screen, text: "👁 {n}", count: {from: 1200, to: 1000000, at: "@час", dur: 1.4, sep: " "}, at: "@час", enter: pop}
    sfx:
      - {"sound": "glitch", "at": "@День", "gain": -14}
      - {"sound": "heartbeat", "at": "@два", "gain": -14}
      - {"sound": "slam", "at": "@Олег", "gain": -14}
      - {"sound": "riser", "at": "@час", "gain": -14}

  # ------------------------------------------------------------------ cliff: Обрыв — Стекло твоего телефона
  # задача: Правило 1 доводится до зрителя: метр, полметра, стекло телефона — и камера над ним; существо
  #         поворачивается к объективу.
  # на экране: «СТЕКЛО ТВОЕГО ТЕЛЕФОНА»
  - id: cliff
    text: "Завтра будет метр. Потом — полметра. Потом — стекло твоего телефона. Над ним тоже есть камера."
    caption_marks: {"твоего телефона": "#e8333f"}
    shots:
      - id: c_count
        # ВИЗУАЛ: Чёрный экран с VHS-полосами: цепочка расстояний 64 → 32 → 16 → 8 → 4 → 2 → 1 → 0,5, последняя
        #         ячейка — силуэт смартфона; красная точка катится по цепочке к телефону.
        # актёры: new:vhs, text, shape, phone
        # камера: Панорама вдоль цепочки к телефону
        # анимация: @метр — Загорается «1 М»
        # анимация: @полметра — Загорается «0,5 М»
        # анимация: @стекло — Красная точка упирается в стекло телефона, стекло трескается помехой
        transition: {"type": "glitch"}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 900}, {t: end, z: 1.08, x: 540, y: 1000, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: "#040506"}
            - {actor: stack, dir: v, gap: 26, x: 540, y: 690, space: screen, children: [{actor: badge, title: "ДЕНЬ 6 · 2 М", style: dark, color: "#8d9196", size: 44}, {actor: badge, title: "ДЕНЬ 7 · 1 М", style: solid, color: red, size: 44, at: "@метр", enter: stamp}, {actor: badge, title: "ДЕНЬ 8 · 0,5 М", style: solid, color: red, size: 44, at: "@полметра", enter: stamp}]}
            - {actor: shape, kind: rect, x: 540, y: 1180, w: 260, h: 380, radius: 36, fill: "#0b0c0e", stroke: "#e8e8e4", sw: 6, at: "@стекло", enter: zoom}
            - {actor: shape, kind: rect, x: 540, y: 1012, w: 70, h: 14, radius: 7, fill: "#e8e8e4", at: "@стекло", enter: fade}
            - {actor: shape, kind: circle, x: 540, y: 1180, r: 16, fill: red, glow: {color: "#ff2a36", r: 40, a: 1}, at: "@стекло+0.2", enter: pop}
            - {actor: shape, kind: polyline, points: [[470, 1060], [520, 1140], [500, 1200], [580, 1290]], stroke: "#e8e8e4", sw: 3, fill: none, at: "@стекло+0.3", enter: draw}
            - {<<: *vhs, text: false, grain: 0.12, tear: [{at: 0, v: 0}, {at: "@стекло", v: 0.8, dur: 0.1}, {at: "@стекло+0.5", v: 0, dur: 0.3}]}
            - {<<: *title, y: 330, text: "СТЕКЛО ТВОЕГО ТЕЛЕФОНА", at: "@стекло-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
      - id: c_face
        # ВИЗУАЛ: Весь экран — существо вплотную, как с фронтальной камеры: голова наклонена, лица нет, только
        #         красная точка точно по центру (x = 540) смотрит прямо на зрителя; тело тонет в зерне; рамка
        #         интерфейса фронтальной камеры по краям. REC мигает.
        # актёры: new:creature, new:vhs, new:selfie_ui, particles
        # камера: Очень медленный наезд на красную точку, микро-дрожь
        # анимация: @Над — Голова существа медленно выпрямляется к объективу
        # анимация: @камера — Красная точка расширяется, зерно усиливается
        start: "@Над-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.05, x: 540, y: 900}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#1b1c1f", "#040405"]}}
            - {actor: creature_face, x: 0, y: 0, space: screen, tilt: [{at: 0, v: 26}, {at: "@Над", v: 0, dur: 1.4, ease: inOutSine}], open: [{at: 0, v: 0}, {at: "@камера", v: 0.6, dur: 0.6}]}
            - {actor: cam_ui, x: 0, y: 0, mode: selfie, space: screen}
            - {<<: *vhs, text: false, grain: 0.16, scan: 0.18}
    sfx:
      - {"sound": "blip", "at": "@метр", "gain": -14}
      - {"sound": "blip", "at": "@полметра", "gain": -14}
      - {"sound": "glitch", "at": "@стекло", "gain": -14}
      - {"sound": "creature", "at": "@Над", "gain": -14}
      - {"sound": "heartbeat", "at": "@камера", "gain": -14}

  # ------------------------------------------------------------------ cta: Призыв — Оно знает твоё лицо
  # задача: Финальная надпись по концепции и вопрос-выбор по дилемме одним словом.
  # на экране: «ОНО УЖЕ ЗНАЕТ ТВОЁ ЛИЦО»
  - id: cta
    text: "Если ты видишь это видео — оно уже знает твоё лицо. Олег выложил. Вера бы стёрла. А ты бы выложил или стёр?"
    caption_marks: {"твоё лицо": "#e8333f"}
    shots:
      - id: e_face
        # ВИЗУАЛ: Тот же кадр вплотную: красная точка по центру; поверх — белый машинописный текст, красным
        #         выделено «ТВОЁ ЛИЦО». Помехи стихают, остаётся только зерно и гул.
        # актёры: new:creature, new:vhs, new:selfie_ui, text
        # камера: Почти неподвижно, медленный наезд
        # анимация: @Если — Текст печатается по буквам
        # анимация: @лицо — «ТВОЁ ЛИЦО» вспыхивает красным, точка мигает
        draw:
          camera: {keys: [{t: 0, z: 1.05, x: 540, y: 900}, {t: end, z: 1.1, x: 540, y: 880}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#1b1c1f", "#040405"]}}
            - {actor: creature_face, x: 0, y: 0, space: screen, tilt: 0, open: [{at: 0, v: 0.6}, {at: "@лицо", v: 1, dur: 0.5}]}
            - {actor: cam_ui, x: 0, y: 0, mode: selfie, space: screen}
            - {<<: *vhs, text: false, grain: 0.16, scan: 0.18}
            - {actor: text, x: 540, y: 430, size: 56, font: mono, weight: 700, color: "#f1f1ec", space: screen, text: "ЕСЛИ ТЫ ВИДИШЬ ЭТО ВИДЕО —", width: 900, at: "@Если", reveal: {by: char, mode: type, stagger: 0.035}}
            - {<<: *title, y: 1250, size: 82, width: 860, text: "ОНО УЖЕ ЗНАЕТ [ТВОЁ ЛИЦО](#ff2a36)", at: "@знает-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
      - id: e_choice
        # ВИЗУАЛ: Финальный кадр, перекликается с первым: снежная запись №1 снова на мониторе — но теперь фигура
        #         стоит у самой камеры, и это тот же кадр, что в начале; внизу две кнопки «ВЫЛОЖИТЬ» и «СТЕРЕТЬ».
        # актёры: new:snowfield, new:creature, cctv, new:vhs, hud:choices
        # камера: Статика, VHS-полоса проходит сверху вниз; петля к первому кадру
        # анимация: @Олег — Кнопки выезжают снизу
        # анимация: @ты#2 — Кнопки мигают по очереди
        start: "@Олег-0.22"
        transition: {"type": "glitch"}
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 540, y: 880}, {t: end, z: 1.14, x: 540, y: 870}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#1b1c1f", "#040405"]}}
            - {actor: creature_face, x: 0, y: 0, space: screen, tilt: 0, open: 1}
            - {actor: cam_ui, x: 0, y: 0, mode: selfie, space: screen}
            - {<<: *vhs, text: false, grain: 0.16, scan: 0.18}
            - {actor: text, x: 540, y: 430, size: 56, font: mono, weight: 700, color: "#f1f1ec", space: screen, text: "ЕСЛИ ТЫ ВИДИШЬ ЭТО ВИДЕО —", width: 900, at: 0}
            - {<<: *title, y: 1250, size: 82, width: 860, text: "ОНО УЖЕ ЗНАЕТ [ТВОЁ ЛИЦО](#ff2a36)", at: 0}
            - {actor: stack, dir: h, gap: 40, x: 540, y: 1490, space: screen, at: "@Олег", enter: slide_up, children: [{actor: badge, title: "ВЫЛОЖИТЬ", style: solid, color: "#e8e8e4", size: 46}, {actor: badge, title: "СТЕРЕТЬ", style: solid, color: red, size: 46}]}
            - {actor: text, x: 540, y: 1395, size: 46, font: mono, weight: 700, color: "#f1f1ec", space: screen, text: "А ТЫ БЫ? ОДНО СЛОВО", at: "@ты#2", enter: fade}
    sfx:
      - {"sound": "typing", "at": "@Если", "gain": -14}
      - {"sound": "boom", "at": "@лицо", "gain": -14}
      - {"sound": "click", "at": "@Олег", "gain": -14}
      - {"sound": "glitch", "at": "@стёр", "gain": -14}

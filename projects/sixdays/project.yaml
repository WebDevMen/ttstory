# ЧЕРНОВИК ПРОЕКТА из projects/sixdays/script.yaml (python3 vg.py script project sixdays).
# Уже готово: голос, сцены с текстом, кадры со сменой на словах и переходами, музыка по блокам, звуки на словах.
# Вместо картинки каждый кадр — аниматик-карточка (текст на экране + описание кадра): темп можно проверить сразу
# (python3 vg.py voice sixdays && python3 vg.py compile sixdays && python3 vg.py preview sixdays --shots).
# Дальше замените layers каждого кадра настоящей графикой по плану из комментариев (skill make-video, docs/DRAW.md).

title: "Оно появилось 6 дней назад"

voice: {"voice": "ru-RU-DmitryNeural", "rate": "+16%", "pitch": "-4Hz"}
# голоса героев: реплики сцен (lines) звучат своим голосом, рассказчик — голосом voice
voices:
  vera: {"voice": "ru-RU-SvetlanaNeural", "rate": "+10%", "pitch": "+0Hz"}
  oleg: {"voice": "ru-RU-DmitryNeural", "rate": "+0%", "pitch": "-14Hz"}

theme:
  preset: documentary
  accent: "#e8333f"
  captions: {"style": "clean", "top": "auto", "size": 60, "max_chars": 20, "hide": [{"from": "@cta.start", "until": 140}]}

post: {vignette: 0.36, chromatic: 0.0022, grain: 0.035}

draw:
  palette: {red: "#ff2a36", ink: "#f1f1ec", night: "#05070c", blue: "#5aa0ff", ok: "#3ddc84", snow: "#c9cdd0", fog: "#9aa0a4"}

# ------------------------------------------------------------------ общие куски
# записи — серая гамма, единственный цвет — красная точка и REC; офис — синий свет мониторов
x-title: &title {actor: text, x: 540, y: 400, size: 96, width: 980, lines: 2, color: "#ffffff", weight: 900, stroke: {w: 10, color: "#05070c"}, shadow: "0 0 30px rgba(0,0,0,.8)", space: screen}
x-tag: &tag {actor: timetag, x: 540, y: 200, size: 34, color: red, space: screen}
x-rbadge: &rbadge {actor: badge, style: solid, color: red, size: 48, space: screen, enter: stamp, sfx: false}
x-dbadge: &dbadge {actor: badge, style: dark, color: red, size: 44, space: screen, enter: pop, sfx: false}
x-who: &who {actor: callout, color: red, size: 46, space: screen, enter: pop, sfx: false}
x-vhs: &vhs {actor: vhs, x: 0, y: 0, space: screen}

x-look-vera: &vera {age: adult, outfit: casual, color: "#4a4f58", bottom_color: "#22252b", hair: bob, hair_color: "#17141a", skin: light, shoes: "#d8d8d8"}
x-look-oleg: &oleg {age: adult, outfit: casual, color: "#c9cdd4", bottom_color: "#2b2f3a", hair: short, hair_color: "#8d8f94", beard: "#8d8f94", skin: mid, shoes: "#1d1a1a"}

# снежная равнина метеостанции (запись №1)
x-snow: &snow
  - {actor: shape, kind: rect, x: 540, y: 520, w: 1700, h: 1000, fill: {linear: ["#55595d", "#8d9296", "#b4b9bc"], angle: 180}}
  - {actor: ridge, x: 520, y: 905, w: 1900, h: 250, color: "#7c8287", snow: "#b9bec1", peaks: 7, seed: 4}
  - {actor: ridge, x: 600, y: 915, w: 1900, h: 130, color: "#91969a", snow: false, peaks: 9, seed: 9}
  - {actor: shape, kind: rect, x: 540, y: 905, w: 1900, h: 120, fill: {linear: ["rgba(200,205,208,0)", "rgba(206,210,213,.75)", "rgba(200,205,208,0)"], angle: 180}}
  - {actor: ground, x: -400, y: 900, w: 1900, h: 1100, color: ["#b7bcbf", "#8f9497"]}
  - {actor: shape, kind: ellipse, x: 250, y: 1130, w: 700, h: 70, fill: "#c6cacd", blur: 6}
  - {actor: shape, kind: ellipse, x: 900, y: 1260, w: 600, h: 60, fill: "#a5aaad", blur: 6}
  - {actor: mast, x: 790, y: 1012, h: 400, color: "#3b3e42"}
  - {actor: shape, kind: line, points: [[150, 1010], [790, 830], [1100, 840]], stroke: "#3b3e42", sw: 2, opacity: 0.6}

# офис ночью: стеклянная стена, за ней город; ковролин; ряды столов
x-office: &office
  - {actor: shape, kind: rect, x: 540, y: 600, w: 2400, h: 1400, fill: {linear: ["#04060b", "#0b1220", "#132036"], angle: 180}}
  - {actor: skyline, x: 540, y: 1060, w: 2400, h: 420, color: "#0d1524", color2: "#111b2e", lit: 0.35, seed: 5, far: true, par: 0.35}
  - {actor: shape, kind: rect, x: 540, y: 1080, w: 2400, h: 120, par: 0.35, fill: {linear: ["rgba(90,160,255,0)", "rgba(60,110,190,.22)", "rgba(90,160,255,0)"], angle: 180}}
  - {actor: glass_wall, x: -660, y: 300, w: 2400, h: 900, cols: 8}
  - {actor: shape, kind: rect, x: 540, y: 1580, w: 2400, h: 820, fill: {linear: ["#0c1018", "#05070b"], angle: 180}}

x-map: &map {actor: map, x: 540, y: 820, w: 1040, h: 760, projection: natural, lon0: -100, land: "#262a31", ocean: "#07090d", stroke: "#3a3f48", graticule: false}

audio:
  music:
    key: C#
    mode: minor
    bpm: 72
    gain: -14
    sections:
      - {at: 0, style: drone}
      - {at: "@problem.start", style: tension}
      - {at: "@day5.start", style: dark}
      - {at: "@twist.start", style: sub}
      - {at: "@day6.start", style: dark}
      - {at: "@cliff.start", style: sub}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ hook: Крючок — Шесть дней назад
  # задача: С первой секунды аномалия на записи и правило с цифрой: каждый день вдвое ближе.
  # на экране: «ОНО ПОЯВИЛОСЬ · 6 ДНЕЙ»
  - id: hook
    accent: "#e8333f"
    text: "Оно появилось на Земле шесть дней назад. Каждый день оно вдвое ближе к камере."
    caption_marks: {"шесть дней": "#e8333f", "вдвое ближе": "#e8333f"}
    shots:
      - id: h_snow
        # ВИЗУАЛ: Зернистая чёрно-белая запись камеры метеостанции: бескрайняя снежная равнина, три плана —
        #         дальние горы в дымке, средний план с мачтой и сугробами, на переднем плане столб ограды;
        #         позёмка. На горизонте стоит очень высокая тонкая фигура, руки ниже колен, голова набок; вместо
        #         лица — красная точка, единственный цвет в кадре. Оверлей: REC, таймкод, «ЗАПИСЬ №1».
        # актёры: sky, ground, new:snowfield, new:creature, particles, cctv, new:vhs
        # камера: Неподвижная камера наблюдения с микро-дрожью; цифровой наезд рывками на «Земле»
        # анимация: @start — Позёмка, мигает REC, по кадру ползёт полоса VHS
        # анимация: @Земле — Цифровой зум ×2 на фигуру — пиксели крупнее, красная точка вспыхивает
        # анимация: @назад — Помеха: кадр рвётся строками
        ambience: [{"sound": "wind", "gain": -18}]
        look: {grade: {contrast: 0.06}}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@Земле", z: 1.02, x: 540, y: 960}, {t: "@Земле+0.14", z: 2.1, x: 420, y: 900, ease: out}, {t: end, z: 2.16, x: 420, y: 900}], sway: {x: 1.5, y: 1, roll: 0.05, freq: 0.6}}
          layers:
            - *snow
            - {actor: creature, id: it, x: 380, y: 958, h: 150, tilt: 22, soft: 0.6}
            - {actor: shape, kind: rect, x: 110, y: 1560, w: 70, h: 1100, fill: "#2b2d30", par: 1.15}
            - {actor: shape, kind: line, points: [[110, 1180], [-60, 1260]], stroke: "#2b2d30", sw: 6, par: 1.15}
            - {actor: particles, kind: snow, region: [-200, 200, 1300, 1800], count: 140, size: [3, 6], speed: 1.4, wind: 260, colors: ["#e8ecee"], seed: 3}
            - {<<: *vhs, label: "ЗАПИСЬ №1", date: "ДЕНЬ 1", clock: 11530, cam: "МЕТЕОСТАНЦИЯ", tear: [{at: 0, v: 0}, {at: "@назад", v: 0.9, dur: 0.1}, {at: "@назад+0.35", v: 0, dur: 0.2}]}
            - {<<: *title, text: "ОНО ПОЯВИЛОСЬ", at: 0.15, reveal: {by: word, mode: slam, stagger: 0.12}}
            - {<<: *title, y: 540, size: 84, color: red, text: "6 ДНЕЙ НАЗАД", at: "@шесть-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
      - id: h_six
        # ВИЗУАЛ: Сетка из шести тёмных окошек-записей на чёрном фоне (2×3); в каждом та же фигура, и в каждом
        #         следующем она вдвое крупнее; последнее окошко закрыто помехами. Под каждым — подпись дня и
        #         метров.
        # актёры: new:vhs, new:rec_grid, new:creature, text
        # камера: Медленный наезд на последнее окошко
        # анимация: @Каждый — Окошки загораются по очереди, фигура растёт скачками
        # анимация: @вдвое — Между окошками появляются стрелки «×2»
        # анимация: @камере — Шестое окошко — белый шум, красная точка просвечивает сквозь него
        start: "@Каждый-0.22"
        transition: {"type": "glitch"}
        draw:
          bg: "#060709"
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 640, y: 1040}]}
          layers:
            - {actor: shape, kind: rect, x: 250, y: 620, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@Каждый", enter: pop}
            - {actor: shape, kind: rect, x: 250, y: 560, w: 250, h: 270, fill: {linear: ["#5a5e62", "#a2a7aa"], angle: 180}, space: screen, at: "@Каждый", enter: fade}
            - {actor: shape, kind: rect, x: 250, y: 755, w: 250, h: 120, fill: {linear: ["#b4b9bc", "#8a8f92"], angle: 180}, space: screen, at: "@Каждый", enter: fade}
            - {actor: creature, x: 250, y: 790, h: 40, tilt: 22, soft: 0.4, space: screen, at: "@Каждый", enter: fade}
            - {actor: text, x: 250, y: 856, size: 26, font: mono, weight: 700, color: "#e8e8e4", text: "ДЕНЬ 1 · 64 М", space: screen, at: "@Каждый", enter: fade}
            - {actor: shape, kind: rect, x: 540, y: 620, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@Каждый+0.25", enter: pop}
            - {actor: shape, kind: rect, x: 540, y: 560, w: 250, h: 270, fill: {linear: ["#5a5e62", "#a2a7aa"], angle: 180}, space: screen, at: "@Каждый+0.25", enter: fade}
            - {actor: shape, kind: rect, x: 540, y: 755, w: 250, h: 120, fill: {linear: ["#b4b9bc", "#8a8f92"], angle: 180}, space: screen, at: "@Каждый+0.25", enter: fade}
            - {actor: creature, x: 540, y: 790, h: 80, tilt: 22, soft: 0.4, space: screen, at: "@Каждый+0.25", enter: fade}
            - {actor: text, x: 540, y: 856, size: 26, font: mono, weight: 700, color: "#e8e8e4", text: "ДЕНЬ 2 · 32 М", space: screen, at: "@Каждый+0.25", enter: fade}
            - {actor: shape, kind: rect, x: 830, y: 620, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@оно", enter: pop}
            - {actor: shape, kind: rect, x: 830, y: 560, w: 250, h: 270, fill: {linear: ["#5a5e62", "#a2a7aa"], angle: 180}, space: screen, at: "@оно", enter: fade}
            - {actor: shape, kind: rect, x: 830, y: 755, w: 250, h: 120, fill: {linear: ["#b4b9bc", "#8a8f92"], angle: 180}, space: screen, at: "@оно", enter: fade}
            - {actor: creature, x: 830, y: 790, h: 160, tilt: 22, soft: 0.4, space: screen, at: "@оно", enter: fade}
            - {actor: text, x: 830, y: 856, size: 26, font: mono, weight: 700, color: "#e8e8e4", text: "ДЕНЬ 3 · 16 М", space: screen, at: "@оно", enter: fade}
            - {actor: shape, kind: rect, x: 250, y: 1110, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@вдвое", enter: pop}
            - {actor: shape, kind: rect, x: 250, y: 1050, w: 250, h: 270, fill: {linear: ["#5a5e62", "#a2a7aa"], angle: 180}, space: screen, at: "@вдвое", enter: fade}
            - {actor: shape, kind: rect, x: 250, y: 1245, w: 250, h: 120, fill: {linear: ["#b4b9bc", "#8a8f92"], angle: 180}, space: screen, at: "@вдвое", enter: fade}
            - {actor: creature, x: 250, y: 1280, h: 330, tilt: 22, soft: 0.4, space: screen, at: "@вдвое", enter: fade}
            - {actor: text, x: 250, y: 1346, size: 26, font: mono, weight: 700, color: "#e8e8e4", text: "ДЕНЬ 4 · 8 М", space: screen, at: "@вдвое", enter: fade}
            - {actor: shape, kind: rect, x: 540, y: 1110, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@камере-0.6", enter: pop}
            - {actor: creature_face, x: 410, y: 925, w: 260, h: 370, cy: 700, tilt: 14, space: screen, at: "@камере-0.6", enter: fade}
            - {actor: text, x: 540, y: 1346, size: 26, font: mono, weight: 700, color: "#e8e8e4", text: "ДЕНЬ 5 · 4 М", space: screen, at: "@камере-0.6", enter: fade}
            - {actor: shape, kind: rect, x: 830, y: 1110, w: 260, h: 400, radius: 6, fill: "#2b2e31", stroke: "#6d7175", sw: 3, space: screen, at: "@камере", enter: pop}
            - {actor: vhs, x: 700, y: 910, w: 260, h: 400, text: false, grain: 0.5, snow: 1, space: screen, at: "@камере", enter: fade}
            - {actor: shape, kind: circle, x: 830, y: 1080, r: 14, fill: red, glow: {color: "#ff2a36", r: 30, a: 1}, space: screen, at: "@камере+0.15", enter: pop, blink: {freq: 3, duty: 0.6, min: 0.2}}
            - {actor: text, x: 830, y: 1346, size: 26, font: mono, weight: 700, color: red, text: "ДЕНЬ 6 · ?", space: screen, at: "@камере", enter: fade}
            - {<<: *vhs, text: false, grain: 0.1}
            - {<<: *title, y: 300, size: 80, text: "×2 БЛИЖЕ КАЖДЫЙ ДЕНЬ", at: "@вдвое-0.05", reveal: {by: word, mode: slam, stagger: 0.08}}
    sfx:
      - {"sound": "glitch", "at": "@hook.start", "gain": -14}
      - {"sound": "click", "at": "@Земле", "gain": -14}
      - {"sound": "boom", "at": "@шесть", "gain": -14}
      - {"sound": "blip", "at": "@Каждый", "gain": -14}
      - {"sound": "impact", "at": "@вдвое", "gain": -14}
      - {"sound": "noise_sweep", "at": "@камере", "gain": -14}

  # ------------------------------------------------------------------ setup: Завязка — Отдел проверки
  # задача: Кто и где: Вера проверяет записи на монтаж, смотрит каждую по сорок раз (улика); Олег спрашивает
  #         «монтаж?» — «ни одной склейки».
  # на экране: «ПО 40 РАЗ»
  - id: setup
    text: "Москва, третья ночь, отдел проверки видео. Мониторы гудят в темноте. Вера, двадцать семь. Ищет подделки в вирусных роликах. Каждую запись смотрит покадрово, по сорок раз."
    shots:
      - id: s_office
        # ВИЗУАЛ: Тёмный опенспейс ночью: дальний план — окна с огнями ночной Москвы в дымке, средний — пустые
        #         столы с погасшими мониторами на полу-ковролине, передний — стол Веры: три монитора с синим
        #         светом, кружка, на стене над её столом маленькая камера наблюдения с красным огоньком (ружьё).
        #         Метка места и времени.
        # актёры: room, skyline, desk, new:monitor_wall, person, new:wall_camera, timetag
        # камера: Медленный проезд вдоль столов к Вере
        # анимация: @Москва — Мониторы мерцают, за окном мигают огни
        # анимация: @ночь — Красный огонёк камеры над столом мигает
        # анимация: @отдел — Проезд доходит до стола Веры, видна её спина
        # анимация: @гудят — Мониторы вспыхивают синим, гул
        transition: {"type": "glitch"}
        ambience: [{"sound": "hum", "gain": -18}, {"sound": "room", "gain": -18}]
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 560, y: 960}, {t: end, z: 1.14, x: 900, y: 1020, ease: inout}]}
          layers:
            - *office
            - {actor: office_desk, x: 170, y: 1260, w: 520, h: 260, scale: 0.75}
            - {actor: monitor, x: 120, y: 1072, w: 260, h: 160, scale: 0.75, on: 0.12, glow: "#203040"}
            - {actor: monitor, x: 290, y: 1072, w: 260, h: 160, scale: 0.75, on: 0.12, glow: "#203040"}
            - {actor: office_desk, x: 600, y: 1290, w: 560, h: 280, scale: 0.8}
            - {actor: monitor, x: 600, y: 1090, w: 280, h: 170, scale: 0.8, on: 0.1, glow: "#203040"}
            - {actor: shape, kind: rect, x: 1330, y: 950, w: 80, h: 1300, fill: {linear: ["#0f141c", "#1a2230"], angle: 90}}
            - {actor: wall_cam, x: 1290, y: 620, size: 120, flip: true, led: [{at: 0, v: 0.6}, {at: "@ночь", v: 1, dur: 0.2}]}
            - {actor: office_desk, x: 1060, y: 1440, w: 760, h: 280}
            - {actor: monitor, x: 860, y: 1185, w: 300, h: 190, glow: "#5aa0ff", on: [{at: 0, v: 0.55}, {at: "@гудят", v: 1, dur: 0.25}], children: [{actor: shape, kind: rect, x: 150, y: 95, w: 300, h: 190, fill: {linear: ["#2a4a7a", "#14243e"], angle: 180}}]}
            - {actor: monitor, x: 1080, y: 1185, w: 300, h: 190, glow: "#5aa0ff", on: [{at: 0, v: 0.55}, {at: "@гудят", v: 1, dur: 0.25}], children: [{actor: shape, kind: rect, x: 150, y: 95, w: 300, h: 190, fill: "#9aa0a4"}, {actor: creature, x: 120, y: 150, h: 60, tilt: 22}]}
            - {actor: monitor, x: 1300, y: 1185, w: 300, h: 190, glow: "#5aa0ff", on: [{at: 0, v: 0.55}, {at: "@гудят", v: 1, dur: 0.25}], children: [{actor: shape, kind: rect, x: 150, y: 95, w: 300, h: 190, fill: {linear: ["#1d3354", "#0d1828"], angle: 180}}]}
            - {actor: light_pool, x: 1080, y: 1300, r: 700, sy: 0.6, color: "#5aa0ff", a: [{at: 0, v: 0.25}, {at: "@гудят", v: 0.45, dur: 0.25}]}
            - {actor: back_view, x: 1080, y: 1430, w: 300, rim: "#5aa0ff", top: "#3b3f47", at: "@отдел", enter: fade}
            - {<<: *tag, text: "МОСКВА · ОТДЕЛ ПРОВЕРКИ · 02:14", at: "@Москва", enter: fade}
      - id: s_vera
        # ВИЗУАЛ: Крупнее: Вера (каре, серый худи) в синем свете, на мониторе запись №1 и таймлайн с кадрами; она
        #         жмёт стрелку — кадр за кадром. Счётчик просмотров на мониторе: «40».
        # актёры: desk, new:monitor_wall, person, new:creature, new:vhs, callout, new:view_counter
        # камера: Наезд через плечо на монитор
        # анимация: @Вера — Вера наклоняется к монитору
        # анимация: @подделки — На мониторе рамка проверки обходит фигуру
        # анимация: @роликах — Сбоку листается лента вирусных роликов с метками «ФЕЙК»
        # анимация: @покадрово — Таймлайн щёлкает по кадру
        # анимация: @сорок — Счётчик просмотров докручивается до 40
        start: "@Вера-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.1, x: 560, y: 900, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {linear: ["#03050a", "#0b1424"], angle: 180}}
            - {actor: light_pool, x: 540, y: 820, r: 900, sy: 0.8, color: "#3a78d8", a: 0.35}
            - {actor: monitor, id: mon, x: 540, y: 1250, w: 840, h: 520, glow: "#5aa0ff", children: [{actor: shape, kind: rect, x: 420, y: 140, w: 840, h: 280, fill: {linear: ["#55595d", "#9da2a5"], angle: 180}}, {actor: ridge, x: 420, y: 250, w: 900, h: 90, color: "#7c8287", snow: "#b9bec1", peaks: 6, seed: 4}, {actor: shape, kind: rect, x: 420, y: 380, w: 840, h: 260, fill: {linear: ["#b7bcbf", "#8f9497"], angle: 180}}, {actor: creature, x: 330, y: 268, h: 70, tilt: 22}, {actor: mast, x: 600, y: 300, h: 170}, {actor: shape, id: chk, kind: rect, x: 330, y: 230, w: 90, h: 120, fill: none, stroke: "#3ddc84", sw: 4, dash: "10 8", at: "@подделки", enter: draw}, {actor: shape, kind: rect, x: 420, y: 470, w: 840, h: 60, fill: "#0b0d12"}, {actor: shape, kind: rect, x: 420, y: 470, w: 800, h: 8, fill: "#3a3f48"}, {actor: shape, kind: rect, x: [{at: 0, v: 120}, {at: "@покадрово", v: 160, dur: 0.05, ease: step}, {at: "@покадрово+0.3", v: 200, dur: 0.05, ease: step}, {at: "@покадрово+0.6", v: 240, dur: 0.05, ease: step}, {at: "@раз", v: 280, dur: 0.05, ease: step}], y: 470, w: 6, h: 44, fill: "#ff2a36"}, {actor: text, x: 690, y: 40, size: 28, font: mono, weight: 700, color: "#e8e8e4", text: "👁 {n}", count: {from: 31, to: 40, at: "@сорок", dur: 0.8}}]}
            - {actor: stack, dir: h, gap: 26, x: 540, y: 520, space: screen, at: "@роликах", children: [{actor: badge, title: "ФЕЙК", style: outline, color: "#8d9196", size: 34}, {actor: badge, title: "ФЕЙК", style: outline, color: "#8d9196", size: 34}, {actor: badge, title: "НЕ ФЕЙК?", style: solid, color: red, size: 34}], enter: slide_up}
            - {actor: back_view, id: vera, x: 170, y: 2180, w: 560, rim: "#5aa0ff", top: "#3b3f47", par: 1.1}
            - {<<: *who, title: "ВЕРА, 27 · ПРОВЕРКА ВИДЕО", x: 540, y: 1300, target: "vera.head", at: "@Вера"}
            - {<<: *rbadge, title: "ПО 40 РАЗ", x: 540, y: 330, at: "@сорок"}
    sfx:
      - {"sound": "click", "at": "@Москва", "gain": -14}
      - {"sound": "click", "at": "@покадрово", "gain": -14}
      - {"sound": "blip", "at": "@сорок", "gain": -14}

  # ------------------------------------------------------------------ nocut: Доказательство — Ни одной склейки
  # задача: Олег входит с паспортом; проверка доказывает: записи — не монтаж.
  # на экране: «НИ ОДНОЙ СКЛЕЙКИ»
  - id: nocut
    text: "Олег, пятьдесят, её начальник. Двадцать лет в новостях. Это монтаж? Нет. Ни одной склейки."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: oleg, say: "Это монтаж?"}
      - {who: vera, say: "Нет. Ни одной склейки."}
    shots:
      - id: s_oleg
        # ВИЗУАЛ: Олег (седая щетина, рукава закатаны) подходит со стаканом кофе и наклоняется над её плечом; на
        #         мониторе — сравнение кадров с наложением, зелёные метки «склеек нет».
        # актёры: desk, new:monitor_wall, person, callout, checklist
        # камера: Двухплановый кадр, лёгкий наезд на монитор на «склейки»
        # анимация: @Олег — Олег входит в кадр справа
        # анимация: @новостях — Олег ставит кофе и наклоняется к экрану
        # анимация: @монтаж — Олег тычет пальцем в фигуру на экране
        draw:
          world: [1600, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 800, y: 960}, {t: end, z: 1.08, x: 760, y: 1000, ease: inout}]}
          layers:
            - *office
            - {actor: office_desk, x: 760, y: 1400, w: 760, h: 300}
            - {actor: monitor, x: 640, y: 1110, w: 360, h: 220, glow: "#5aa0ff", children: [{actor: shape, kind: rect, x: 180, y: 110, w: 360, h: 220, fill: "#9aa0a4"}, {actor: creature, x: 150, y: 170, h: 70, tilt: 22}]}
            - {actor: light_pool, x: 640, y: 1150, r: 600, sy: 0.6, color: "#5aa0ff", a: 0.35}
            - {actor: person, id: oleg, x: 1220, y: 1400, scale: 2.1, look: *oleg, face: [{at: 0, v: neutral}, {at: "@монтаж", v: talk}], pose: [{at: 0, v: stand}, {at: "@новостях", v: think, dur: 0.4}, {at: "@монтаж", v: point, dur: 0.3}], talk: [["@Это", "@монтаж.end"]], at: "@Олег-0.1", enter: slide_left}
            - {actor: back_view, x: 430, y: 2300, w: 560, rim: "#5aa0ff", top: "#3b3f47"}
            - {<<: *who, title: "ОЛЕГ, 50 · НАЧАЛЬНИК", x: 540, y: 520, target: "oleg.head", at: "@Олег"}
            - {<<: *dbadge, title: "20 ЛЕТ В НОВОСТЯХ", x: 540, y: 330, at: "@новостях"}
      - id: s_check
        # ВИЗУАЛ: Монитор крупно: два кадра наложены друг на друга, по стыкам бегут зелёные метки проверки, шкала
        #         шумов ровная; в углу — архивная справка «Слендермен, 2009: монтаж» перечёркнута.
        # актёры: new:monitor_wall, new:creature, checklist, text
        # камера: Наезд на шкалу шумов
        # анимация: @Нет — Зелёные метки бегут по стыкам кадров
        # анимация: @склейки — Шкала шумов ровная, штамп «СКЛЕЕК НЕТ»
        start: "@Нет-0.22"
        transition: {"type": "dip"}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 540, y: 940}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {linear: ["#03050a", "#0b1424"], angle: 180}}
            - {actor: monitor, x: 540, y: 1180, w: 840, h: 520, stand: false, glow: "#3ddc84", children: [{actor: shape, kind: rect, x: 420, y: 140, w: 840, h: 280, fill: {linear: ["#55595d", "#9da2a5"], angle: 180}}, {actor: ridge, x: 420, y: 250, w: 900, h: 90, color: "#7c8287", snow: "#b9bec1", peaks: 6, seed: 4}, {actor: shape, kind: rect, x: 420, y: 380, w: 840, h: 260, fill: {linear: ["#b7bcbf", "#8f9497"], angle: 180}}, {actor: creature, x: 330, y: 268, h: 70, tilt: 22}, {actor: mast, x: 600, y: 300, h: 170}, {actor: shape, kind: rect, x: 420, y: 260, w: 840, h: 520, fill: "rgba(61,220,132,.06)"}, {actor: shape, kind: line, points: [[0, 160], [840, 160]], stroke: "#3ddc84", sw: 3, dash: "14 10", at: "@Нет", enter: draw}, {actor: shape, kind: line, points: [[0, 320], [840, 320]], stroke: "#3ddc84", sw: 3, dash: "14 10", at: "@Нет+0.2", enter: draw}, {actor: shape, kind: line, points: [[420, 0], [420, 520]], stroke: "#3ddc84", sw: 3, dash: "14 10", at: "@Нет+0.4", enter: draw}]}
            - {actor: checklist, x: 290, y: 1250, width: 500, size: 40, origin: top-left, color: "#3ddc84", ink: "#e8e8e4", space: screen, items: [{text: "СКЛЕЙКИ: НЕТ", at: "@Нет"}, {text: "ШУМ: РОВНЫЙ", at: "@одной"}]}
            - {<<: *title, text: "НИ ОДНОЙ СКЛЕЙКИ", y: 400, at: "@склейки-0.05", reveal: {by: word, mode: slam, stagger: 0.1}}
    sfx:
      - {"sound": "footstep", "at": "@Олег", "gain": -14}
      - {"sound": "click", "at": "@Нет", "gain": -14}
      - {"sound": "impact", "at": "@склейки", "gain": -14}

  # ------------------------------------------------------------------ problem: Раскрытие — Запись первая
  # задача: Запись 1: фигура описана одной деталью — красная точка вместо лица, 64 метра.
  # на экране: «ДЕНЬ 1 · 64 М»
  - id: problem
    text: "День первый. Шпицберген, метеостанция, в динамике воет ветер. На снегу фигура, шестьдесят четыре метра. Руки ниже колен, голова набок. Вместо лица — красная точка, как огонёк записи."
    caption_marks: {"шестьдесят четыре": "#e8333f", "красная точка": "#e8333f"}
    shots:
      - id: p_snow
        # ВИЗУАЛ: Запись №1 на весь экран: снежная равнина метеостанции, фигура вдали; по фигуре — рамка захвата с
        #         дальномером «64 М».
        # актёры: sky, ground, new:snowfield, new:creature, particles, cctv, new:vhs
        # камера: Статика камеры, цифровой зум на «фигура»
        # анимация: @Шпицберген — Позёмка, VHS-полоса
        # анимация: @ветер — Порыв: снег бьёт в объектив, кадр дрожит
        # анимация: @фигура — Рамка захвата наводится на фигуру
        # анимация: @метра — Дальномер докручивает 64 М
        transition: {"type": "glitch"}
        ambience: [{"sound": "wind", "gain": -18}]
        look: {grade: {contrast: 0.06}}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@фигура", z: 1.0}, {t: "@фигура+0.14", z: 1.6, x: 450, y: 930, ease: out}, {t: end, z: 1.66, x: 450, y: 930}], sway: {x: 1.5, y: 1, roll: 0.05, freq: 0.6}, shakes: [{at: "@ветер", amp: 10, dur: 0.6}]}
          layers:
            - *snow
            - {actor: creature, id: it, x: 380, y: 958, h: 150, tilt: 22, soft: 0.6}
            - {actor: particles, kind: snow, region: [-200, 200, 1300, 1800], count: 140, size: [3, 6], speed: 1.4, wind: 260, colors: ["#e8ecee"], seed: 4}
            - {actor: particles, kind: snow, region: [-200, 200, 1300, 1800], count: 220, size: [4, 8], speed: 2.6, wind: 900, colors: ["#f2f4f5"], seed: 8, at: "@ветер", until: "@ветер+1.6", enter: fade, exit: fade}
            - {actor: shape, kind: rect, x: 380, y: 880, w: 110, h: 190, fill: none, stroke: red, sw: 4, at: "@фигура", enter: zoom}
            - {<<: *vhs, label: "ЗАПИСЬ №1", date: "ДЕНЬ 1", clock: 11602, cam: "МЕТЕОСТАНЦИЯ"}
            - {<<: *tag, text: "ДЕНЬ 1 · ШПИЦБЕРГЕН", at: "@День", enter: fade}
            - {<<: *rbadge, title: "64 МЕТРА", x: 540, y: 330, at: "@метра"}
      - id: p_face
        # ВИЗУАЛ: Стоп-кадр крупно, зерно и пиксели: силуэт — длинные руки ниже колен, голова склонена набок,
        #         вместо лица одна красная точка; рядом выноски-стрелки «руки», «голова», «точка». Красная точка
        #         мигает в такт с REC в углу.
        # актёры: new:creature, new:vhs, callout, shape
        # камера: Медленный наезд на голову
        # анимация: @Руки — Выноска к рукам
        # анимация: @голова — Выноска к голове
        # анимация: @точка — Красная точка вспыхивает, REC в углу мигает одновременно
        start: "@Руки-0.22"
        look: {grade: {contrast: 0.08}}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 540, y: 900, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {linear: ["#6a6e72", "#9da2a5", "#a9aeb1"], angle: 180}, blur: 6}
            - {actor: ridge, x: 540, y: 1100, w: 1900, h: 300, color: "#868b90", snow: "#b4b9bc", peaks: 5, seed: 6, blur: 5}
            - {actor: ground, x: -400, y: 1090, w: 1900, h: 900, color: ["#b2b7ba", "#8f9497"]}
            - {actor: creature, id: it, x: 540, y: 1300, h: 960, tilt: [{at: 0, v: 16}, {at: "@голова", v: 30, dur: 0.6}], soft: 1.4, dot: [{at: 0, v: 0.7}, {at: "@точка", v: 1, dur: 0.15}]}
            - {actor: particles, kind: snow, region: [-200, 200, 1300, 1800], count: 90, size: [3, 7], speed: 1.2, wind: 220, colors: ["#e8ecee"], seed: 6}
            - {<<: *vhs, label: "ЗАПИСЬ №1 · ×6", date: "ДЕНЬ 1", clock: 11610, cam: "СТОП-КАДР", tear: [{at: 0, v: 0.5}, {at: "@Руки", v: 0, dur: 0.3}, {at: "@точка", v: 0.6, dur: 0.05}, {at: "@точка+0.4", v: 0, dur: 0.2}]}
            - {<<: *who, title: "РУКИ НИЖЕ КОЛЕН", x: 360, y: 1000, target: "it.box:0.25,0.82", at: "@Руки"}
            - {<<: *who, title: "ГОЛОВА НАБОК", x: 780, y: 640, target: "it.box:0.6,0.08", at: "@голова"}
            - {<<: *who, title: "КАК ОГОНЁК ЗАПИСИ", x: 540, y: 300, target: "it.dot", at: "@точка"}
    sfx:
      - {"sound": "glitch", "at": "@День", "gain": -14}
      - {"sound": "blip", "at": "@метра", "gain": -14}
      - {"sound": "click", "at": "@Руки", "gain": -14}
      - {"sound": "heartbeat", "at": "@точка", "gain": -14}

  # ------------------------------------------------------------------ days23: Эскалация — Тридцать два, шестнадцать
  # задача: Записи 2–3: расстояние честно сокращается вдвое, места всё ближе к людям.
  # на экране: «32 → 16 М»
  - id: days23
    text: "День второй. Чили, видеорегистратор. Тридцать два метра. День третий. Осака, метро. Шестнадцать."
    caption_marks: {"тридцать два": "#e8333f", "шестнадцать": "#e8333f"}
    shots:
      - id: p_chile
        # ВИЗУАЛ: Запись видеорегистратора ночью: мокрая трасса, фары выхватывают обочину, дальний план — силуэты
        #         Анд и огни посёлка; фигура стоит на обочине, ближе, чем на снегу. Рамка «32 М».
        # актёры: sky, new:road_night, streetlight, new:creature, cctv, new:vhs
        # камера: Камера едет вперёд (дорога течёт), фигура проплывает мимо
        # анимация: @Чили — Разметка бежит, дворники
        # анимация: @Тридцать — Рамка захвата на фигуре, 32 М
        transition: {"type": "glitch"}
        ambience: [{"sound": "rain", "gain": -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.05, x: 540, y: 960}], sway: {x: 3, y: 3, roll: 0.15, freq: 0.5}}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 500, w: 1400, h: 1000, fill: {linear: ["#0c0d0f", "#2a2c2f"], angle: 180}}
            - {actor: ridge, x: 540, y: 905, w: 1900, h: 300, color: "#1d1f22", snow: "#3c3f43", peaks: 5, seed: 12}
            - {actor: shape, kind: rect, x: 540, y: 900, w: 1900, h: 60, fill: {linear: ["rgba(90,94,98,0)", "rgba(90,94,98,.5)", "rgba(90,94,98,0)"], angle: 180}}
            - {actor: shape, kind: circle, x: 860, y: 880, r: 4, fill: "#d8d8d0", glow: {color: "#d8d8d0", r: 10, a: 0.8}}
            - {actor: shape, kind: circle, x: 905, y: 884, r: 3, fill: "#d8d8d0", glow: {color: "#d8d8d0", r: 10, a: 0.8}}
            - {actor: shape, kind: circle, x: 940, y: 879, r: 4, fill: "#d8d8d0", glow: {color: "#d8d8d0", r: 10, a: 0.8}}
            - {actor: highway, x: 0, y: 0, hz: 900, speed: 1.6, glow: 0.85}
            - {actor: creature, id: it, x: [{at: 0, v: 700}, {at: "@end", v: 1180, dur: 4.2, ease: in}], y: [{at: 0, v: 1000}, {at: "@end", v: 1700, dur: 4.2, ease: in}], h: [{at: 0, v: 160}, {at: "@end", v: 900, dur: 4.2, ease: in}], tilt: 20, soft: 0.8}
            - {actor: particles, kind: dust, region: [-100, 300, 1180, 1700], count: 120, size: [2, 4], speed: 4, colors: ["#bfc3c6"], seed: 2}
            - {<<: *vhs, label: "ЗАПИСЬ №2", date: "ДЕНЬ 2", clock: 79220, cam: "72 КМ/Ч"}
            - {<<: *tag, text: "ДЕНЬ 2 · ЧИЛИ", at: "@День", enter: fade}
            - {<<: *rbadge, title: "32 МЕТРА", x: 540, y: 330, at: "@Тридцать"}
      - id: p_osaka
        # ВИЗУАЛ: Камера наблюдения на платформе метро: перспектива платформы с колоннами, табло, дальний конец
        #         тоннеля в темноте; фигура стоит у дальней колонны, голова почти касается потолка. Рамка «16 М».
        # актёры: new:metro_platform, new:creature, person, cctv, new:vhs
        # камера: Статика, рывковый цифровой зум на «Шестнадцать»
        # анимация: @Осака — Мигает лампа на платформе
        # анимация: @Шестнадцать — Зум на фигуру, полоса помех
        start: "@День#2-0.22"
        transition: {"type": "glitch"}
        ambience: [{"sound": "hum", "gain": -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@Шестнадцать", z: 1.0}, {t: "@Шестнадцать+0.14", z: 1.45, x: 470, y: 900, ease: out}, {t: end, z: 1.5, x: 470, y: 900}]}
          layers:
            - {actor: corridor, kind: metro, vx: 520, vy: 820, lamp: [{at: 0, v: 0}, {at: "@Осака", v: 1}]}
            - {actor: creature, id: it, x: 470, y: 1100, h: 360, tilt: 24, soft: 0.6}
            - {actor: person, x: 760, y: 1500, scale: 1.25, look: {age: adult, outfit: suit, hair: short, skin: mid}, pose: stand, hold: phone, face: neutral, grayscale: 1, brightness: 0.75}
            - {<<: *vhs, label: "ЗАПИСЬ №3", date: "ДЕНЬ 3", clock: 11460, cam: "CAM 14 · ПЛАТФОРМА"}
            - {<<: *tag, text: "ДЕНЬ 3 · ОСАКА", at: "@День", enter: fade}
            - {<<: *rbadge, title: "16 МЕТРОВ", x: 540, y: 330, at: "@Шестнадцать"}
    sfx:
      - {"sound": "glitch", "at": "@День", "gain": -14}
      - {"sound": "blip", "at": "@Тридцать", "gain": -14}
      - {"sound": "glitch", "at": "@День#2", "gain": -14}
      - {"sound": "impact", "at": "@Шестнадцать", "gain": -14}

  # ------------------------------------------------------------------ rule: Правило мира — Вдвое ближе
  # задача: Правило 1 проверено линейкой: вдвое выше — вдвое ближе; зритель сам досчитывает 8 → 4 → 2.
  # на экране: «×2 ВЫШЕ = ×2 БЛИЖЕ»
  - id: rule
    text: "Вера кладёт кадры рядом. Каждые сутки фигура ровно вдвое выше. Значит, расстояние делится пополам."
    caption_marks: {"вдвое": "#e8333f", "пополам": "#e8333f"}
    shots:
      - id: r_ruler
        # ВИЗУАЛ: Монитор Веры: три кадра рядом, фигура в каждом вдвое выше; Вера проводит красную линейку по
        #         экрану — отметки ×2; под кадрами цепочка 64 → 32 → 16 и пустые места для 8 → 4 → 2.
        # актёры: new:monitor_wall, new:creature, shape, text, chart
        # камера: Плавная панорама по трём кадрам слева направо
        # анимация: @рядом — Три кадра встают в ряд
        # анимация: @вдвое — Красная линейка меряет фигуры, отметки ×2
        # анимация: @пополам — Цепочка дописывает 8 → 4 → 2 серым, будущим
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 920}, {t: end, z: 1.05, x: 540, y: 920, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2100, fill: {linear: ["#05070c", "#0d1626"], angle: 180}}
            - {<<: *tag, text: "СРАВНЕНИЕ КАДРОВ · №1–3", at: "@rule.start", enter: fade}
            - {actor: shape, kind: rect, x: 200, y: 840, w: 300, h: 440, radius: 6, fill: {linear: ["#5a5e62", "#a2a7aa", "#b4b9bc"], angle: 180}, stroke: "#6d7175", sw: 3, at: "@рядом", enter: pop}
            - {actor: creature, x: 200, y: 1030, h: 70, tilt: 22, soft: 0.4, at: "@рядом", enter: fade}
            - {actor: shape, kind: rect, x: 540, y: 840, w: 300, h: 440, radius: 6, fill: {linear: ["#5a5e62", "#a2a7aa", "#b4b9bc"], angle: 180}, stroke: "#6d7175", sw: 3, at: "@рядом+0.15", enter: pop}
            - {actor: creature, x: 540, y: 1030, h: 140, tilt: 22, soft: 0.4, at: "@рядом+0.15", enter: fade}
            - {actor: shape, kind: rect, x: 880, y: 840, w: 300, h: 440, radius: 6, fill: {linear: ["#5a5e62", "#a2a7aa", "#b4b9bc"], angle: 180}, stroke: "#6d7175", sw: 3, at: "@рядом+0.3", enter: pop}
            - {actor: creature, x: 880, y: 1030, h: 280, tilt: 22, soft: 0.4, at: "@рядом+0.3", enter: fade}
            - {actor: shape, kind: line, points: [[365, 1030], [365, 960]], stroke: red, sw: 6, at: "@вдвое", enter: draw}
            - {actor: shape, kind: line, points: [[705, 1030], [705, 890]], stroke: red, sw: 6, at: "@вдвое+0.2", enter: draw}
            - {actor: shape, kind: line, points: [[1045, 1030], [1045, 750]], stroke: red, sw: 6, at: "@вдвое+0.4", enter: draw}
            - {actor: text, x: 370, y: 700, size: 44, font: mono, weight: 800, color: red, text: "×2", at: "@вдвое+0.2", enter: pop}
            - {actor: text, x: 710, y: 700, size: 44, font: mono, weight: 800, color: red, text: "×2", at: "@вдвое+0.4", enter: pop}
            - {<<: *title, text: "×2 ВЫШЕ = ×2 БЛИЖЕ", at: "@вдвое-0.05", reveal: {by: word, mode: slam, stagger: 0.08}}
            - {actor: text, x: 540, y: 1200, size: 54, font: mono, weight: 800, color: "#e8e8e4", space: screen, text: "64 → 32 → 16 → [8 → 4 → 2](#6d7175)", at: "@пополам", reveal: {by: word, mode: rise, stagger: 0.12}}
            - {actor: text, x: 540, y: 1290, size: 34, font: mono, weight: 700, color: "#8d9196", space: screen, text: "МЕТРОВ ДО ОБЪЕКТИВА", at: "@пополам+0.5", enter: fade}
    sfx:
      - {"sound": "click", "at": "@рядом", "gain": -14}
      - {"sound": "blip", "at": "@вдвое", "gain": -14}

# СЦЕНАРИЙ: «Оно появилось 6 дней назад» — криптид, космический хоррор, псевдодокументалистика (~2:10)
# Одна история, одна героиня-точка зрения (Вера), два правила мира с цифрами, дилемма «выложить или стереть»,
# улика «сорок просмотров» посеяна трижды, финал — четвёртая стена: существо смотрит на зрителя.
# Проверка: python3 vg.py script check sixdays [--tts] · документ: python3 vg.py script render sixdays
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово+0.3", "@start"/"@end" блока.
# Реплики героев написаны прямо в vo (их произносит голос героя — см. production.voices), lines отмечает, чья реплика.

version: 1

meta:
  title: "Оно появилось 6 дней назад"
  topic: "Оно появилось на Земле 6 дней назад: на записях со всего мира одна фигура каждый день вдвое ближе к объективу (криптид, космический хоррор, псевдодокументалистика, вымысел)"
  wishes: "Тёмная кинематографичная псевдодокументалистика: красные акценты, VHS-помехи, зерно, архивные кадры, тревожный эмбиент, напряжение нарастает до финала; финал — существо смотрит прямо на зрителя, надпись «Если ты видишь это видео — оно уже знает твоё лицо»"
  language: ru
  platforms: [tiktok, reels, shorts]
  primary_platform: tiktok
  duration: 130
  format: fiction
  style: draw
  voice: {voice: ru-RU-DmitryNeural, rate: "+16%", pitch: "-4Hz"}

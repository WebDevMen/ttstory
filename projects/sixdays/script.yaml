  status: checked

brief:
  goal: "Рассказать одну понятную жуткую историю в стиле найденных записей так, чтобы зритель досмотрел до финального кадра, пересмотрел ради деталей и ответил в комментариях, выложил бы он записи или стёр."
  kpi: [completion, rewatch, comments, shares, follows]
  audience:
    who: "Зрители криптидов, «найденных записей», аналогового хоррора и страшилок с камер наблюдения, которые любят разгадывать детали в кадре"
    age: "16–34"
    interests: [криптиды, аналоговый хоррор, крипипаста, камеры наблюдения, мистика, космический хоррор]
    pains: ["одинаковые скримеры без сюжета", "страшилки, где непонятно, что происходит", "финалы «продолжение следует» без ответа"]
    desires: ["правило, которое можно посчитать самому", "деталь в кадре, которую замечаешь при пересмотре", "финал, который касается его самого"]
    knowledge: "Знают Слендермена, Человека-мотылька и записи с камер наблюдения; про это существо не знают ничего — всё объясняется по ходу"
  promise: "Шесть записей одной фигуры, каждая вдвое ближе, — и ответ, к какой камере оно идёт на самом деле."
  tone: "Холодная псевдодокументалка: сухие подписи записей, тишина и гул, красная точка записи как единственный цвет; без крови и скримеров — страх растёт от цифр и расстояния."
  keywords: ["оно появилось", "криптид", "существо на камерах", "найденные записи", "аналоговый хоррор"]
  constraints:
    - "Вымысел целиком: записи, существо и люди придуманы; реальны только законы оптики, фронтальная камера телефона и история криптидов, на которые опирается жанр"
    - "Одна точка зрения — Вера: всё, что видит зритель, видит она на своих мониторах"
    - "Два правила мира, оба с цифрами: вдвое ближе каждые сутки (64 → 32 → 16 → 8 → 4 → 2 м) и «люди ему не нужны — нужен объектив»"
    - "Без крови, трупов и скримеров; лицо существа не показываем — только красная точка; 13+"
    - "В описании пометка «вымышленная история», чтобы не выдавать вымысел за новость"

research:
  summary: >-
    Жанр держится на настоящих вещах. Самый известный интернет-криптид — Слендермен — родился в 2009 году как
    отредактированные фотографии на форумном конкурсе: поэтому героиня — проверяющая подделки, и первый вопрос к записям —
    «это монтаж?». Найденные записи — приём, где история подаётся как плёнки самих участников. Видимый размер предмета
    обратно пропорционален расстоянию: если фигура в кадре стала вдвое больше, она вдвое ближе — правило можно проверить
    линейкой по экрану. А у каждого телефона над экраном есть камера, которая смотрит на того, кто смотрит видео.
  facts:
    - id: f1
      text: "Слендермен придуман 10 июня 2009 года на форуме Something Awful: Эрик Кнудсен добавил высокую тонкую фигуру в чёрном костюме на две чёрно-белые фотографии детей в конкурсе «паранормальных изображений»."
      source: "https://en.wikipedia.org/wiki/Slender_Man"
      confidence: high
    - id: f2
      text: "Человека-мотылька впервые описали 15 ноября 1966 года две пары из Пойнт-Плезант (Западная Виргиния); первая заметка вышла в Point Pleasant Register 16 ноября 1966 года."
      source: "https://en.wikipedia.org/wiki/Mothman"
      confidence: high
    - id: f3
      text: "Найденные записи (found footage) — приём и жанр, где фильм подаётся как плёнки и видеозаписи самих героев, позже «найденные» и показанные зрителю; в мейнстрим жанр вывел «Ведьма из Блэр» (1999)."
      source: "https://en.wikipedia.org/wiki/Found_footage_(film_technique)"
      confidence: high
    - id: f4
      text: "Угловой размер предмета при малых углах ≈ d/D — обратно пропорционален расстоянию: вдвое ближе — вдвое больше в кадре."
      source: "https://en.wikipedia.org/wiki/Angular_diameter"
      confidence: high
    - id: f5
      text: "Фронтальная камера смартфона стоит на стороне экрана и смотрит на пользователя; первый такой телефон — Kyocera VP-210 (Япония, май 1999)."
      source: "https://en.wikipedia.org/wiki/Front-facing_camera"
      confidence: high
    - id: f6
      text: "Камер наблюдения — сотни миллионов: в Китае в 2018 году сообщалось о более чем 170 млн, в США — около 70 млн (оценки разных источников расходятся)."
      source: "https://en.wikipedia.org/wiki/Closed-circuit_television"
      confidence: medium
  angles:
    - id: a1
      archetype: fourth_wall
      text: "Проверяющая видео Вера сводит шесть записей одной фигуры: каждая вдвое ближе к объективу — и понимает, что оно идёт туда, где на него смотрят больше всех; шестая запись — это видео, которое смотрит зритель"
      paradox: "Чтобы предупредить людей, запись нужно показать — а каждый показ подводит существо ближе к тем, кого предупреждают"
      score: 9
      why: "Цифры, которые зритель считает сам (64 → 2 м), одна героиня, спор с начальником, поворот, который объясняет «почему её стол», и финал, который касается каждого, кто держит телефон."
    - id: a2
      archetype: what_if
      text: "Что если криптид — не зверь в лесу, а что-то, что живёт в объективах и выходит туда, куда направлены камеры"
      paradox: "Чем больше в мире камер, тем больше у него дверей"
      score: 7
      why: "Сильная идея, но без героя это лекция; взята внутрь a1 как мир."
    - id: a3
      archetype: inhuman_pov
      text: "Шесть дней глазами существа: оно видит мир только через чужие объективы"
      paradox: "Оно не охотится — оно просто хочет, чтобы его увидели"
      score: 6
      why: "Красиво, но теряется понятная ставка и спор людей; зрителю не за кого бояться."
    - id: a4
      archetype: role_swap
      text: "Отдел, который должен разоблачить запись как монтаж, сам становится камерой, к которой оно идёт"
      paradox: "Проверяющие смотрели внимательнее всех — и этим позвали его к себе"
      score: 8
      why: "Отличный поворот — взят в a1 как главная улика («по сорок раз каждую»)."
  chosen_angle: a1
  insights:
    - "Правило с цифрами считается без объяснений: 64, 32, 16, 8, 4, 2 — зритель сам доходит до «а дальше — стекло телефона»."
    - "Красная точка вместо лица = огонёк записи: существо само похоже на камеру — образ, понятный без звука."
    - "Главная улика — «смотрит каждую запись по сорок раз» — звучит как деталь профессии, а в повороте объясняет, почему шестая запись снята над её столом."
    - "Дилемма Олега и Веры без правильного ответа: молчать — люди будут подпускать его к камерам; выложить — миллион новых взглядов."
    - "Финал работает на пересмотр: в первом кадре на снегу видна та же красная точка, что в последнем кадре смотрит на зрителя."

story:
  logline: "Вера, проверяющая вирусные видео, должна понять, куда идёт существо, которое каждый день вдвое ближе к объективу, но начальник хочет выложить записи на весь мир; не поймёт — следующей камерой станет та, что смотрит на неё."
  retell: "Вера проверяет записи одной фигуры: каждый день оно вдвое ближе к камере и обходит людей. Она понимает, что оно выходит там, где запись смотрели больше всех. Пятую больше всех смотрела она сама — и пока Олег выкладывает подборку, шестая запись приходит с камеры над её столом."
  premise: "Что если существо идёт не к людям, а к объективу, и выходит туда, где на его запись смотрели больше всего?"
  paradox: "Чтобы предупредить людей, запись надо показать — а каждый просмотр подводит его к тем, кого предупреждают"
  genre: "криптид, космический хоррор, псевдодокументалистика"
  world_rules:
    - id: r1
      rule: "Каждые сутки оно ровно вдвое ближе к объективу: 64, 32, 16, 8, 4, 2 метра"
      test: "Вера кладёт кадры рядом: фигура в кадре каждый день вдвое выше, значит, расстояние делится пополам; на четвёртый день — восемь метров, на шестой — два"
      shown_in: rule
      basis: f4
    - id: r2
      rule: "Людей оно не трогает: если человек стоит между ним и камерой, оно обходит его и идёт к объективу"
      test: "Сеул, парковка: сторож стоит в восьми метрах перед камерой — фигура обходит его за две секунды, не повернув головы"
      shown_in: seoul
      basis: вымысел
  characters:
    - id: vera
      name: "Вера"
      intro: "Вера, двадцать семь. Ищет подделки в вирусных роликах."
      role: "героиня, точка зрения; проверяет видео на монтаж"
      want: "доказать, что записи — монтаж, и закрыть дело"
      fear: "что это не монтаж"
      look: "короткое каре, серый худи, лицо в синем свете мониторов"
      arc: "от «ни одной склейки» — к пониманию, что смотреть было опаснее всего"
    - id: oleg
      name: "Олег"
      intro: "Олег, пятьдесят, её начальник. Двадцать лет в новостях."
      role: "начальник отдела, голос «люди должны знать»"
      want: "выпустить главный материал года и предупредить людей"
      fear: "промолчать о том, что убьёт людей"
      look: "седая щетина, рубашка с закатанными рукавами"
      arc: "из правды для всех делает миллион дверей"
  twists:
    - id: t1
      what: "Оно выходит туда, где предыдущую запись смотрели больше всех; пятую больше всех смотрела сама Вера — по сорок раз, покадрово, — поэтому шестая запись снята камерой над её столом"
      setup: [setup, seoul, dilemma]
      payoff: twist
    - id: t2
      what: "Олег уже выложил подборку: видео, которое смотрит зритель, — это и есть шестая запись, и над экраном у зрителя тоже есть камера"
      setup: [dilemma]
      payoff: cliff
  dilemmas:
    - id: d1
      beat: dilemma
      who: vera
      question: "Выложить записи, чтобы люди знали, как оно выглядит, или стереть, чтобы на него никто больше не смотрел?"
      options: ["Выложить: люди будут знать, кого не подпускать к камерам, но миллионы глаз — миллионы дверей", "Стереть: никто не увидит его снова, но люди будут снимать его вблизи, не зная, что это"]
  stakes:
    - {beat: setup, level: personal}
    - {beat: problem, level: community}
    - {beat: seoul, level: community}
    - {beat: dilemma, level: world}
    - {beat: twist, level: personal}
    - {beat: day6, level: personal}
    - {beat: cliff, level: world}

hooks:
  variants:
    - {id: h1, type: speculative, vo: "Оно появилось на Земле шесть дней назад. Каждый день оно вдвое ближе к камере.", on_screen: "ДЕНЬ 1 · 64 М", visual: "Зернистая запись с метеостанции: снежная равнина, на горизонте высокая тонкая фигура с красной точкой вместо лица; таймкод и REC", score: 9, why: "Срок и правило в первой фразе, ключевое слово «оно появилось»; аномалия на снегу читается без звука."}
    - {id: h2, type: rule_warning, vo: "Если оно попало на запись, у него шесть дней. Потом оно выходит из экрана.", on_screen: "6 ДНЕЙ", visual: "Шесть окошек записей, в каждом фигура всё крупнее", score: 8, why: "Правило с цифрой и ценой, но спойлерит финал."}
    - {id: h3, type: visual_shock, vo: "Шесть записей. Одна фигура. И на каждой она ближе к объективу.", on_screen: "6 ЗАПИСЕЙ", visual: "Монтаж шести кадров подряд, фигура растёт скачками", score: 8, why: "Сильная картинка, но нет срока «шесть дней назад» и ключевого слова."}
    - {id: h4, type: stakes, vo: "Шестьдесят четыре метра. Тридцать два. Шестнадцать. Оно идёт к объективу.", on_screen: "64 · 32 · 16", visual: "Счётчик расстояния на трёх записях", score: 7, why: "Цифры цепляют, но первая фраза — просто число, без контекста."}
    - {id: h5, type: result_first, vo: "На последней записи оно смотрело прямо в камеру. Его сняли с двух метров.", on_screen: "2 МЕТРА", visual: "Красная точка на весь кадр", score: 6, why: "Раскрывает финал и снимает напряжение."}
    - {id: h6, type: imagine, vo: "Представь: на каждой новой записи оно стоит вдвое ближе.", on_screen: "ВДВОЕ БЛИЖЕ", visual: "Две записи рядом, фигура вдвое крупнее", score: 6, why: "«Представь» — медленный вход."}
    - {id: h7, type: question, vo: "Почему одна и та же фигура попадает на камеры по всему миру?", on_screen: "ОДНА ФИГУРА", visual: "Глобус с точками записей", score: 5, why: "Вопрос-лекция, без срока и цены."}
    - {id: h8, type: shock_fact, vo: "В мире сотни миллионов камер. Шесть дней назад одна из них сняла его.", on_screen: "ОНО ПОЯВИЛОСЬ", visual: "Стена камер наблюдения, одна мигает красным", score: 7, why: "Масштаб, но первая фраза — справка, а не аномалия."}
  primary: h1
  ab: [h2, h3]

beats:
  # ------------------------------------------------------------------ 1. HOOK — аномалия на снегу + правило
  - id: hook
    role: hook
    title: "Шесть дней назад"
    goal: "С первой секунды аномалия на записи и правило с цифрой: каждый день вдвое ближе."
    vo: "Оно появилось на Земле шесть дней назад. Каждый день оно вдвое ближе к камере."
    on_screen: "ОНО ПОЯВИЛОСЬ · 6 ДНЕЙ"
    devices: [open_loop, pattern_interrupt, visual_proof, text_reinforcement]
    facts: [f4]
    music: drone
    marks: {"шесть дней": "#e8333f", "вдвое ближе": "#e8333f"}
    accent: "#e8333f"
    shots:
      - id: h_snow
        visual: "Зернистая чёрно-белая запись камеры метеостанции: бескрайняя снежная равнина, три плана — дальние горы в дымке, средний план с мачтой и сугробами, на переднем плане столб ограды; позёмка. На горизонте стоит очень высокая тонкая фигура, руки ниже колен, голова набок; вместо лица — красная точка, единственный цвет в кадре. Оверлей: REC, таймкод, «ЗАПИСЬ №1»."
        actors: [sky, ground, new:snowfield, new:creature, particles, cctv, new:vhs]
        camera: "Неподвижная камера наблюдения с микро-дрожью; цифровой наезд рывками на «Земле»"
        animation:
          - {at: "@start", what: "Позёмка, мигает REC, по кадру ползёт полоса VHS"}
          - {at: "@Земле", what: "Цифровой зум ×2 на фигуру — пиксели крупнее, красная точка вспыхивает"}
          - {at: "@назад", what: "Помеха: кадр рвётся строками"}
        graphics:
          - {at: "@start", type: timetag, text: "ЗАПИСЬ №1 · ДЕНЬ 1"}
          - {at: "@шесть", type: "text slam", text: "ОНО ПОЯВИЛОСЬ 6 ДНЕЙ НАЗАД"}
        sfx:
          - {at: "@start", sound: glitch}
          - {at: "@Земле", sound: click}
          - {at: "@шесть", sound: boom}
        ambience: [wind]
        transition: cut
      - id: h_six
        at: "@Каждый-0.1"
        visual: "Сетка из шести тёмных окошек-записей на чёрном фоне (2×3); в каждом та же фигура, и в каждом следующем она вдвое крупнее; последнее окошко закрыто помехами. Под каждым — подпись дня и метров."
        actors: [new:vhs, new:rec_grid, new:creature, text]
        camera: "Медленный наезд на последнее окошко"
        animation:
          - {at: "@Каждый", what: "Окошки загораются по очереди, фигура растёт скачками"}
          - {at: "@вдвое", what: "Между окошками появляются стрелки «×2»"}
          - {at: "@камере", what: "Шестое окошко — белый шум, красная точка просвечивает сквозь него"}
        graphics:
          - {at: "@вдвое", type: "text slam", text: "×2 БЛИЖЕ КАЖДЫЙ ДЕНЬ"}
        sfx:
          - {at: "@Каждый", sound: blip}
          - {at: "@вдвое", sound: impact}
          - {at: "@камере", sound: noise_sweep}
        transition: glitch

  # ------------------------------------------------------------------ 2. SETUP — отдел проверки, Вера, Олег (улика 1: «по сорок раз»)
  - id: setup
    role: setup
    title: "Отдел проверки"
    goal: "Кто и где: Вера проверяет записи на монтаж, смотрит каждую по сорок раз (улика); Олег спрашивает «монтаж?» — «ни одной склейки»."

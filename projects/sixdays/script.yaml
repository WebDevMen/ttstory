      - id: d_argue
        at: "@Люди-0.1"
        visual: "Двухплановый спор у стола: Олег стоит, руки в карманах, освещён тёплой лампой; Вера сидит в синем свете монитора и смотрит на экран, а не на него. Между ними на экране — замёрший кадр фигуры. Подписи говорящих."
        actors: [desk, new:monitor_wall, person, new:creature, callout]
        camera: "Медленный наезд, на каждой реплике — смена фокуса между героями"
        animation:
          - {at: "@Люди", what: "Олег говорит, жест рукой на экран"}
          - {at: "@если", what: "Вера поворачивается к нему"}
        graphics:
          - {at: "@если", type: "hud:choices", text: "ВЫЛОЖИТЬ · СТЕРЕТЬ"}
        sfx:
          - {at: "@если", sound: heartbeat}
        transition: cut
      - id: d_oleg2
        at: "@Тогда-0.1"
        visual: "Крупно Олег в тёплом свете лампы, за ним тёмные окна офиса с огнями города; он выпрямляется и забирает флешку со стола."
        actors: [room, skyline, person, prop, callout]
        camera: "Медленный наезд на лицо Олега"
        animation:
          - {at: "@Тогда", what: "Олег выпрямляется"}
          - {at: "@куда", what: "Олег забирает флешку со стола"}
        graphics:
          - {at: "@куда", type: badge, text: "КУДА НЕ СМОТРЕТЬ"}
        sfx:
          - {at: "@куда", sound: click}
        transition: cut
      - id: d_replay
        at: "@Вера-0.1"
        visual: "Монитор крупно: пятая запись на повторе, счётчик просмотров щёлкает с 40 на 41; в отражении экрана — лицо Веры и маленький красный огонёк камеры над её столом."
        actors: [new:monitor_wall, new:creature, new:view_counter, new:wall_camera, new:vhs]
        camera: "Наезд на счётчик"
        animation:
          - {at: "@снова", what: "Значок повтора крутится"}
          - {at: "@Сорок", what: "Счётчик щёлкает 40 → 41, в отражении мигает красный огонёк"}
        graphics:
          - {at: "@Сорок", type: badge, text: "ПРОСМОТР №41"}
        sfx:
          - {at: "@снова", sound: click}
          - {at: "@Сорок", sound: ping}
        transition: dip

  # ------------------------------------------------------------------ 6. TWIST — карта просмотров: оно выходит туда, где смотрели больше всех
  - id: twist
    role: twist
    title: "Карта просмотров"
    goal: "Улика щёлкает: каждая следующая запись — там, где предыдущую смотрели больше всех; пятую больше всех смотрела Вера."
    vo: "Вера открывает карту просмотров. Первую запись больше всех смотрели в Чили. Вторую — в Осаке. Третью — в Сеуле. Оно выходит туда, где на него смотрели больше всех. Пятую больше всех смотрел один адрес. Её стол."
    scene: {when: "03:20", where: "стол Веры, карта просмотров"}
    on_screen: "ОНО ИДЁТ НА ВЗГЛЯД"
    devices: [twist, callback, visual_proof, sound_hit]
    music: sub
    marks: {"больше всех": "#e8333f", "Её стол": "#e8333f"}
    shots:
      - id: t_map
        visual: "Тёмная карта мира на мониторе, точки просмотров светятся; от Шпицбергена красная дуга к Чили, от Чили — к Осаке, от Осаки — к Сеулу; в каждом городе вспыхивает самый большой кружок просмотров."
        actors: [map, shape, text, new:vhs]
        camera: "Панорама по карте вслед за дугами"
        animation:
          - {at: "@карту", what: "Карта загорается точками просмотров"}
          - {at: "@Чили", what: "Дуга Шпицберген → Чили, самый большой кружок в Чили"}
          - {at: "@Осаке", what: "Дуга Чили → Осака"}
          - {at: "@Сеуле", what: "Дуга Осака → Сеул"}
        graphics:
          - {at: "@карту", type: timetag, text: "КАРТА ПРОСМОТРОВ"}
        sfx:
          - {at: "@Чили", sound: blip}
          - {at: "@Осаке", sound: blip}
          - {at: "@Сеуле", sound: blip}
        transition: cut
      - id: t_rule
        at: "@Оно-0.1"
        visual: "Схема-правило на карте: глаз-кружок просмотров → стрелка → силуэт фигуры в следующем городе; крупная подпись."
        actors: [map, new:creature, shape, text]
        camera: "Наезд на схему"
        animation:
          - {at: "@выходит", what: "Силуэт фигуры встаёт в кружке просмотров"}
          - {at: "@смотрели#2", what: "Все кружки просмотров на карте пульсируют красным"}
        graphics:
          - {at: "@выходит", type: "text slam", text: "ОНО ИДЁТ НА ВЗГЛЯД"}
        sfx:
          - {at: "@выходит", sound: impact}
        transition: cut
      - id: t_address
        at: "@пятую-0.1"
        visual: "Карта приближается к Москве, к одному зданию, к одному этажу: кружок просмотров пятой записи — огромный, рядом цифра «41 · ОДИН АДРЕС»; план офиса с одним столом, подсвеченным красным."
        actors: [map, new:office_plan, text, badge]
        camera: "Быстрый зум с карты мира в план офиса"
        animation:
          - {at: "@пятую", what: "Карта летит к Москве"}
          - {at: "@адрес", what: "Кружок сжимается до одного здания, план этажа"}
        graphics:
          - {at: "@адрес", type: badge, text: "41 ПРОСМОТР · ОДИН АДРЕС"}
        sfx:
          - {at: "@пятую", sound: whoosh}
          - {at: "@адрес", sound: blip}
        transition: zoom
      - id: t_desk
        at: "@Её-0.1"
        visual: "План этажа превращается в настоящий офис сверху: среди тёмных столов один — стол Веры — залит красным; Вера за ним поднимает голову; над столом мигает огонёк камеры."
        actors: [new:office_plan, room, desk, person, new:wall_camera, text]
        camera: "Резкий наезд на стол сверху"
        animation:
          - {at: "@Её", what: "Стол Веры вспыхивает красным"}
          - {at: "@стол", what: "Вера поднимает голову к камере над столом"}
        graphics:
          - {at: "@стол", type: "text slam", text: "ЕЁ СТОЛ"}
        sfx:
          - {at: "@стол", sound: boom}
        transition: cut

  # ------------------------------------------------------------------ 7. CLIFF — шестая запись с камеры над столом; Олег уже выложил; оно смотрит на зрителя
  - id: day6
    role: reveal
    title: "День шестой"
    goal: "Шестая запись снята над её столом, а Олег уже выложил подборку."
    vo: "День шестой. Запись камеры над её столом. Красный огонёк. Два метра. Олег, удали подборку! Я выложил её час назад."
    scene: {when: "день шестой, 03:33", where: "стол Веры — запись камеры над ним"}
    lines:
      - {who: vera, say: "Олег, удали подборку!"}
      - {who: oleg, say: "Я выложил её час назад."}
    on_screen: "ДЕНЬ 6 · 2 М"
    devices: [twist, stakes_raise, pattern_interrupt, number_reveal]
    music: dark
    marks: {"два метра": "#e8333f"}
    shots:
      - id: c_cam
        visual: "Запись камеры наблюдения сверху: Вера за столом в синем свете мониторов, затылком к камере; в тёмном проходе между столами, в двух метрах за её спиной, стоит фигура — голова упирается в потолок, красная точка смотрит в объектив. REC, таймкод 03:33."
        actors: [room, desk, new:monitor_wall, person, new:creature, cctv, new:vhs]
        camera: "Статика камеры наблюдения, медленный цифровой зум"
        animation:
          - {at: "@запись", what: "Кадр включается с помехой"}
          - {at: "@столом", what: "Зум: в проходе проступает фигура"}
          - {at: "@два", what: "Рамка захвата на фигуре: 2 М"}
        graphics:
          - {at: "@День", type: timetag, text: "ЗАПИСЬ №6 · ДЕНЬ 6 · 03:33"}
          - {at: "@два", type: badge, text: "2 М"}
        sfx:
          - {at: "@День", sound: glitch}
          - {at: "@два", sound: heartbeat}
        ambience: [hum]
        transition: glitch
      - id: c_oleg
        at: "@Олег-0.1"
        visual: "Вера вскакивает, оборачивается — проход пуст; Олег в дверях с телефоном, на телефоне — опубликованная подборка и счётчик, который несётся: 1 000 000 просмотров."
        actors: [room, desk, person, phone, new:view_counter]
        camera: "Резкий разворот камеры за Верой, затем наезд на телефон Олега"
        animation:
          - {at: "@Олег", what: "Вера вскакивает, стул откатывается"}
          - {at: "@выложил", what: "Олег поворачивает к ней экран телефона"}
          - {at: "@час", what: "Счётчик просмотров разгоняется до миллиона"}
        graphics:
          - {at: "@выложил", type: badge, text: "1 000 000 ПРОСМОТРОВ"}
        sfx:
          - {at: "@Олег", sound: slam}
          - {at: "@час", sound: riser}
        transition: whip_x

  # ------------------------------------------------------------------ 8b. CLIFF — счёт до стекла телефона; оно смотрит на зрителя
  - id: cliff
    role: cliffhanger
    title: "Стекло твоего телефона"
    goal: "Правило 1 доводится до зрителя: метр, полметра, стекло телефона — и камера над ним; существо поворачивается к объективу."
    vo: "Завтра будет метр. Потом — полметра. Потом — стекло твоего телефона. Над ним тоже есть камера."
    scene: {when: "сейчас", where: "экран зрителя"}
    on_screen: "СТЕКЛО ТВОЕГО ТЕЛЕФОНА"
    devices: [direct_address, stakes_raise, number_reveal]
    facts: [f5]
    music: sub
    marks: {"твоего телефона": "#e8333f"}
    shots:
      - id: c_count
        visual: "Чёрный экран с VHS-полосами: цепочка расстояний 64 → 32 → 16 → 8 → 4 → 2 → 1 → 0,5, последняя ячейка — силуэт смартфона; красная точка катится по цепочке к телефону."
        actors: [new:vhs, text, shape, phone]
        camera: "Панорама вдоль цепочки к телефону"
        animation:
          - {at: "@метр", what: "Загорается «1 М»"}
          - {at: "@полметра", what: "Загорается «0,5 М»"}
          - {at: "@стекло", what: "Красная точка упирается в стекло телефона, стекло трескается помехой"}
        graphics:
          - {at: "@метр", type: badge, text: "ДЕНЬ 7 · 1 М"}
          - {at: "@стекло", type: "text slam", text: "СТЕКЛО ТВОЕГО ТЕЛЕФОНА"}
        sfx:
          - {at: "@метр", sound: blip}
          - {at: "@полметра", sound: blip}
          - {at: "@стекло", sound: glitch}
        transition: glitch
      - id: c_face
        at: "@Над-0.1"
        visual: "Весь экран — существо вплотную, как с фронтальной камеры: голова наклонена, лица нет, только красная точка точно по центру (x = 540) смотрит прямо на зрителя; тело тонет в зерне; рамка интерфейса фронтальной камеры по краям. REC мигает."
        actors: [new:creature, new:vhs, new:selfie_ui, particles]
        camera: "Очень медленный наезд на красную точку, микро-дрожь"
        animation:
          - {at: "@Над", what: "Голова существа медленно выпрямляется к объективу"}
          - {at: "@камера", what: "Красная точка расширяется, зерно усиливается"}
        graphics: []
        sfx:
          - {at: "@Над", sound: creature}
          - {at: "@камера", sound: heartbeat}
        transition: cut

  # ------------------------------------------------------------------ 8. CTA — финальный кадр: надпись + вопрос по дилемме
  - id: cta
    role: cta
    title: "Оно знает твоё лицо"
    goal: "Финальная надпись по концепции и вопрос-выбор по дилемме одним словом."
    vo: "Если ты видишь это видео — оно уже знает твоё лицо. Олег выложил. Вера бы стёрла. А ты бы выложил или стёр?"
    on_screen: "ОНО УЖЕ ЗНАЕТ ТВОЁ ЛИЦО"
    devices: [comment_bait, direct_address, loop_ending, rewatch_trigger]
    facts: [f5]
    music: sub
    marks: {"твоё лицо": "#e8333f"}
    shots:
      - id: e_face
        visual: "Тот же кадр вплотную: красная точка по центру; поверх — белый машинописный текст, красным выделено «ТВОЁ ЛИЦО». Помехи стихают, остаётся только зерно и гул."
        actors: [new:creature, new:vhs, new:selfie_ui, text]
        camera: "Почти неподвижно, медленный наезд"
        animation:
          - {at: "@Если", what: "Текст печатается по буквам"}
          - {at: "@лицо", what: "«ТВОЁ ЛИЦО» вспыхивает красным, точка мигает"}
        graphics:
          - {at: "@Если", type: text, text: "ЕСЛИ ТЫ ВИДИШЬ ЭТО ВИДЕО —"}
          - {at: "@знает", type: "text slam", text: "ОНО УЖЕ ЗНАЕТ ТВОЁ ЛИЦО"}
        sfx:
          - {at: "@Если", sound: typing}
          - {at: "@лицо", sound: boom}
        transition: cut
      - id: e_choice
        at: "@Олег-0.1"
        visual: "Финальный кадр, перекликается с первым: снежная запись №1 снова на мониторе — но теперь фигура стоит у самой камеры, и это тот же кадр, что в начале; внизу две кнопки «ВЫЛОЖИТЬ» и «СТЕРЕТЬ»."
        actors: [new:snowfield, new:creature, cctv, new:vhs, hud:choices]
        camera: "Статика, VHS-полоса проходит сверху вниз; петля к первому кадру"
        animation:
          - {at: "@Олег", what: "Кнопки выезжают снизу"}
          - {at: "@ты#2", what: "Кнопки мигают по очереди"}
        graphics:
          - {at: "@Олег", type: "hud:choices", text: "ВЫЛОЖИТЬ · СТЕРЕТЬ"}
          - {at: "@стёр", type: badge, text: "ОДНО СЛОВО В КОММЕНТАРИИ"}
        sfx:
          - {at: "@Олег", sound: click}
          - {at: "@стёр", sound: glitch}
        transition: glitch

loops:
  - {id: l1, question: "К какой камере оно идёт и что будет, когда расстояние кончится?", open: hook, close: cliff}
  - {id: l2, question: "Почему оно обходит людей и смотрит только в объектив?", open: problem, close: twist}
  - {id: l3, question: "Выложит Олег подборку или Вера успеет её стереть?", open: dilemma, close: day6}

engagement:
  comment: "Выложить или стереть? Одно слово."
  share: "Переслать другу, который смотрит аналоговый хоррор по ночам: «посчитай, сколько осталось до твоего экрана»."
  save: "Сохранить, чтобы пересмотреть и найти красную точку в первом кадре и огонёк камеры над столом Веры с первой сцены."
  follow: "Подписка на новые «найденные записи» — каждая со своим правилом, которое можно посчитать."
  rewatch: "Камера над столом Веры видна с первой сцены, счётчик «40» — во второй, красная точка мигает в такт с REC: при пересмотре поворот видно заранее; финальный кадр возвращает к первой записи."
  cta: {beat: cta, text: "Выложить или стереть? Одно слово", type: comment}


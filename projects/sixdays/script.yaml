    hashtags: ["#криптид", "#аналоговыйхоррор"]
  first_frame: "Зернистая запись камеры метеостанции: снежная равнина, на горизонте высокая тонкая фигура с красной точкой вместо лица; крупно «ОНО ПОЯВИЛОСЬ 6 ДНЕЙ НАЗАД»."
  posting: ["Время 21:00–00:00 — ночной хоррор", "Закрепить комментарий: «Выложить или стереть?»", "В описании: «вымышленная история»"]

production:
  theme: {preset: documentary, accent: "#e8333f", captions: clean}
  palette: ["#07080b чёрный экран", "#1b2a3a синий свет мониторов", "#b9c2c9 серое зерно записей", "#e8333f красная точка / REC", "#f2f2ee машинописный белый"]
  music: {key: C#, mode: minor, bpm: 72}
  voices:
    narrator: {voice: ru-RU-DmitryNeural, rate: "+16%", pitch: "-4Hz"}
    vera: {voice: ru-RU-SvetlanaNeural, rate: "+10%", pitch: "+0Hz"}
    oleg: {voice: ru-RU-DmitryNeural, rate: "+0%", pitch: "-14Hz"}
  assets:
    - "new:creature — существо: очень высокое и тонкое, руки ниже колен, голова набок, вместо лица красная точка; позы: стоит, шаг, поворот головы к объективу; масштаб по расстоянию"
    - "new:vhs — оверлей VHS (space: screen): полосы трекинга, зерно, сдвиг строк, REC с мигающей точкой, таймкод; можно расширить существующий cctv"
    - "new:snowfield, new:road_night, new:metro_platform, new:parking — фоны записей с землёй под каждым планом"
    - "new:monitor_wall, new:wall_camera, new:view_counter, new:lens, new:rec_grid, new:office_plan, new:phone_rec, new:selfie_ui — офис и интерфейсы"
  notes:
    - "Записи — серые и зернистые, единственный цвет — красная точка существа и REC; офис — синий свет мониторов; так зритель сразу отличает «запись» от «сцены»"
    - "Лицо существа никогда не показываем — только красная точка; финальная точка стоит ровно на x = 540"
    - "Говорящие подписаны на экране при первой реплике; реплики Веры и Олега — своими голосами"
    - "Камера над столом Веры с красным огоньком видна с первого кадра офиса — улика для пересмотра"

review:
  scores: {hook: 9, clarity: 9, pacing: 8, novelty: 8, emotion: 8, payoff: 9, visuals: 8, cta: 8, platform: 8, accuracy: 8}
  weak_points:
    - "Около 2:10 — длинно для ленты; держится на счёте 64 → 2 и коротких блоках по 7–15 с, но первые 5 секунд должны продать правило «вдвое ближе»."
    - "Ролик целиком на новых актёрах (существо, VHS-оверлей, фоны записей, мониторы): это основной объём работы в производстве."
    - "Зритель может спросить, почему существо не трогает людей, — ответа нет намеренно (космический хоррор), но правило соблюдается до конца."
    - "Финальная надпись на экране совпадает с голосом — субтитры в этом кадре надо скрыть, чтобы текст не дублировался."
    - "Факт про число камер (f6) — оценки расходятся (medium); в голосе цифр нет, только в исследовании."
  improvements:
    - "Концепцию пользователя превратил в историю с героиней-точкой зрения (Вера проверяет видео на монтаж) и спором с начальником — по правилам ясности §14.6."
    - "Правило «каждая запись ближе» стало числом, которое зритель досчитывает сам: 64, 32, 16, 8, 4, 2 — метр, полметра, стекло телефона."
    - "Фишка «оно не преследует людей» проверена на стороже: обходит, не повернув головы."
    - "Поворот подготовлен трижды (по сорок раз — сторож и объектив — сорок первый просмотр) и объясняет, почему шестая запись снята над её столом."
    - "Длинные блоки по 20 с разделены: новая награда каждые 7–15 с."
    - "Финальный вопрос — выбор по дилемме одним словом: «выложил или стёр?»"

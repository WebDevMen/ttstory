    hashtags: ["#криптид", "#аналоговыйхоррор", "#найденныезаписи", "#страшныеистории", "#мистика"]
    cover: "ОНО ВДВОЕ БЛИЖЕ"
    sound: "Своя музыка движка (drone → tension → dark → sub), гул и VHS-шум"
  reels:
    caption: "Оно появилось 6 дней назад — и каждый день вдвое ближе к объективу 🔴 Выложить или стереть? (вымышленная история)"
    hashtags: ["#криптид", "#аналоговыйхоррор", "#страшныеистории"]

  # ------------------------------------------------------------------ 4. RULE — бельё как пламя; весы минус четыре; противовес
  - id: rule
    role: rule
    title: "Противовес"
    goal: "Правило r4 как опыт: мокрая простыня — минус четыре на весах; кабина 400 кг — сто простыней; идея из профессии героя."
    vo: "Глеб смотрит на балконы. Бельё на верёвках не висит. Оно стоит вверх, как пламя. Мокрое тянет вверх, сухое — вниз. В лифте главное — противовес. Кухня Петровича, его весы. Глеб привязывает к ним мокрую простыню. Минус четыре килограмма. Кабина с ними весит четыреста. Сто простыней — и она ничего не весит. Девяносто девять — плавно идёт вниз."

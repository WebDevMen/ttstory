brief:
  goal: "Продолжить историю так, чтобы и новый зритель, и зритель первой части понял всё с первого раза, досмотрел три минуты и поспорил в комментариях: ответить или сбросить."
  kpi: [completion, comments, rewatch, shares, follows]
  audience:
    who: "Зрители первой части и любители страшилок-«протоколов», фантастики и сюжетных роликов, которые спорят, как поступили бы сами"
    age: "16–34"
    interests: [фантастика, страшные истории, правила выживания, «Чёрное зеркало», аниме-апокалипсис]
    pains: ["вторые части, которые повторяют первую", "ответ на загадку «в следующей серии», который так и не приходит", "правила мира, которые меняются ради сюжета"]
    desires: ["ответ на обрыв первой части в первые секунды", "правило, по которому можно «играть» самому", "картинка, которой не было в первой части", "новая загадка, о которой хочется спорить"]
    knowledge: "Часть зрителей видела первую часть (дождь вверх, мокрое падает в небо, звонок со своего номера, квартал оторвался); новичкам всё объясняется по ходу: кто герои, где они, какие правила"
  promise: "Глеб и Соня висят в облаках на оторванном квартале. Чтобы вернуться и дозвониться до себя, лифтёр делает из мокрого белья противовес — и видит, куда всё это время шёл дождь."
  tone: "Холодный пасмурный свет, сталь и бетон; белые простыни, которые стоят вверх, как пламя; тихий шум моря сверху вместо скримеров. Жёлтый — единственный тёплый цвет."
  keywords: ["звонят с вашего номера", "дождь вверх", "обратный прилив", "протокол", "море в небе", "фантастика"]
  constraints:
    - "Вымысел целиком: город, Речная, люди, протоколы 07 и 08 придуманы; реальны противовес лифта, связь, которая глохнет в стальной кабине, морская соль в облаках, литр воды = килограмм"
    - "Одна точка зрения — Глеб: всё, что видит зритель, видит он"
    - "Правила части 1 не меняются (мокрое — вверх, сухое — тяжёлое; вода в доме идёт вверх); новых правил два, оба проверены цифрой: облако промачивает за минуту; мокрая простыня тянет вверх на четыре килограмма"
    - "Без крови и скримеров; люди, ушедшие вверх, живы — ходят по днищам; 13+"
    - "Финал не отвечает на всё: кто звонит из-под воды — вопрос третьей части"

research:
  summary: >-
    Вторая часть держится на настоящей механике лифта и облаков. Противовес лифта весит как кабина плюс сорок–пятьдесят
    процентов груза: поэтому мотор почти ничего не поднимает — лифтёр Глеб знает это лучше всех и делает противовес из
    мокрого белья, которое в этом мире тянет вверх. Стальная кабина работает как клетка Фарадея — внутри глохнет связь,
    поэтому звонить приходится снаружи. Облако — это тонны воды мелкими каплями, а одно из «зёрен» облачных капель —
    морская соль: отсюда солёная капля на языке Сони, первая улика того, что над облаками море.
  facts:
    - id: f1
      text: "Противовес лифта весит столько же, сколько кабина, плюс 40–50% её грузоподъёмности."
      source: "https://en.wikipedia.org/wiki/Elevator"
      confidence: high
    - id: f2
      text: "Лифты и комнаты с металлическими стенами работают как клетка Фарадея: мобильная связь в них пропадает, появляются «мёртвые зоны»."
      source: "https://en.wikipedia.org/wiki/Faraday_cage"
      confidence: high
    - id: f3
      text: "Морская соль из брызг волн — одно из ядер, на которых конденсируются облачные капли; типичная облачная капля около 0,02 мм."
      source: "https://en.wikipedia.org/wiki/Cloud_condensation_nuclei"
      confidence: high
    - id: f4
      text: "Кучевое облако примерно километр на километр весит около 500 тонн — это вода, которая висит в воздухе."
      source: "https://www.usgs.gov/media/images/how-much-does-a-cloud-weigh"
      confidence: high
    - id: f5
      text: "Литр воды весит около одного килограмма."
      source: "https://en.wikipedia.org/wiki/Litre"
      confidence: high
  angles:
    - id: a1
      archetype: rule_break
      text: "Лифтёр делает лифт без шахты: кабина висит под сотней мокрых простыней — противовесом, который падает в небо"
      paradox: "Сухое тянет вниз, мокрое — вверх; чтобы спуститься на землю, нужно сто вещей, которые падают в небо"
      score: 9
      why: "Правило «играется» самим зрителем (весы: минус четыре; сто простыней — ноль; девяносто девять — вниз), выросло из профессии героя и из правил части 1 — никакого нового чуда."
    - id: a2
      archetype: time_loop
      text: "Голос, который в части 1 «хрипло, с ветром» спас Глеба, — это он сам, кричащий из кабины, летящей сквозь дождь"
      paradox: "Чтобы его спасли в прошлом, он должен сейчас рискнуть дочерью и спуститься"
      score: 8
      why: "Закрывает загадку части 1 действием и даёт причину спускаться (сверху не дозвониться), взято внутрь a1."
    - id: a3
      archetype: what_if
      text: "Куда уходит дождь, который идёт вверх? Над облаками копится море вверх дном, и его уровень опускается на квартал каждые двадцать минут — это и есть «обратный прилив»"
      paradox: "Прилив, который идёт с неба; облака — это пена моря, а не небо"
      score: 9
      why: "Объясняет название серии и все детали первой части (облака опускаются, днища мокрые) — поворот-картинка, сильнее любой лекции."
    - id: a4
      archetype: inhuman_pov
      text: "История глазами Петровича, который ходит по днищу верхнего квартала вверх ногами"
      paradox: "Тот, кто «улетел», жив и видит всё снизу вверх"
      score: 6
      why: "Сильный образ, но теряется точка зрения и личная ставка; Петрович остаётся союзником и ценой выбора."
  chosen_angle: a1
  insights:
    - "Ответ на обрыв части 1 — в первой сцене: Глеб звонит себе, внизу сбрасывают; почему — сталь кабины глушит связь, а снизу видят свой номер."
    - "Правило показано весами — тем же предметом, что в части 1: было «двадцать два → девять», теперь «минус четыре»."
    - "Петрович вверх ногами — тот, кто послушал сирену: он жив, но к земле ему уже нельзя. Его отказ — честная цена по правилам («я мокрый, я вас только подниму»)."
    - "Улика моря сеется трижды: солёная капля, водоросли на днище, шум сверху «как море» — и щёлкает картинкой моря вверх дном."
    - "Финальная загадка (звонок, когда оба Глеба на месте) и вопрос «ответить или сбросить» продолжают спор «крыша или лифт» из первой части."

story:
  logline: "Глеб, лифтёр, должен спустить дочь Соню из квартала в облаках и дозвониться до себя внизу, но облако опускается, а сверху связи нет; не успеет — их квартал утонет в небе, а нижняя Соня уйдёт на крышу."
  retell: "Глеб и Соня висят в облаках на оторванном квартале. Глеб делает из ста мокрых простыней противовес, спускает кабину и в ветер кричит себе внизу про яму лифта. Над облаками оказывается море вверх дном, а на земле Глебу звонят с его номера."
  premise: "Что если дождь, который идёт вверх, всё это время копился над облаками — в море вверх дном?"
  paradox: "Чтобы опуститься на землю, нужно привязать к себе сто вещей, которые падают в небо; спасший тебя голос был твоим — а теперь с твоего номера звонят из-под воды"
  genre: "фантастика, лёгкий хоррор"
  world_rules:
    - id: r3
      rule: "Облако — это вода: в нём всё промокает за минуту и падает вверх. Облако опускается"
      test: "Петрович ушёл на крышу по сирене, минуту пробыл в облаке — и теперь стоит вверх ногами на днище верхнего квартала; облако дойдёт до двора через пять минут"
      shown_in: problem
      basis: f4
    - id: r4
      rule: "Мокрое тянет вверх, сухое — вниз, поэтому вес можно уравновесить: одна мокрая простыня тянет вверх на четыре килограмма"
      test: "Весы с привязанной мокрой простынёй — минус четыре; кабина с людьми весит четыреста: сто простыней — ноль, девяносто девять — плавно вниз; простыни мокнут в дожде, и Глеб срезает по одной"
      shown_in: rule
      basis: f1
  characters:
    - id: gleb
      name: "Глеб"
      intro: "Глеб, двадцать девять лет, лифтёр."
      role: "герой, точка зрения; отец Сони"
      want: "вернуть дочь на землю и дозвониться до себя внизу"
      fear: "что нижняя Соня уйдёт на крышу, а своя — в облако"
      look: "тёмная куртка лифтёра с отражающей полосой, рабочий пояс с ключами и ножом"
      arc: "от «звоню — сбрасывают» — к тому, что сам становится голосом с ветром; на земле получает звонок, которого быть не может"
    - id: sonya
      name: "Соня"
      intro: "Соня, семь лет, его дочь."
      role: "дочь, ставка, глаза ребёнка: замечает соль"
      want: "спасти «девочку с зонтиком» внизу — себя"
      fear: "что папа оставит её наверху"
      look: "жёлтая куртка, две косички"
      arc: "ловит каплю — «он солёный» → считает простыни → «пап, ответь»"
    - id: petrovich
      name: "Аркадий Петрович"
      intro: "Аркадий Петрович, семьдесят лет, сосед."
      role: "сосед, послушал сирену и ушёл на крышу; теперь стоит вверх ногами на днище верхнего квартала"
      want: "чтобы Глеб с Соней не остались одни — поднялись к ним"
      fear: "остаться наверху навсегда"
      look: "седой, очки, вязаный жилет, мокрый; стоит вверх ногами, капли с него летят вверх"
      arc: "зовёт наверх → честно отказывается спускаться («я вас только подниму») → его квартал уходит в волну"
    - id: system
      name: "Оповещение"
      role: "женский голос городской системы оповещения из динамиков; говорит протоколами"
      want: "чтобы жители выполнили протокол"
      fear: "—"
      look: "нет лица: решётка динамика, красная плашка на экране"
      arc: "Протокол 08 «не отвечайте, это не вы» → объявляет прилив → в финале её запрет против звонка, который уже однажды спас"
  twists:
    - id: t1
      what: "Голос из части 1 «хрипло, с ветром» — это Глеб, который кричит в телефон из кабины, летящей сквозь дождь: сверху связь не доходила, пришлось спуститься"
      setup: [call, dilemma]
      payoff: descent
    - id: t2
      what: "Над облаками — море вверх дном: туда уходит дождь, облака — его пена, и уровень опускается на квартал каждые двадцать минут; это и есть обратный прилив"
      setup: [call, problem, dilemma]
      payoff: twist
  dilemmas:
    - id: d1
      beat: dilemma
      who: gleb
      question: "Подняться с Соней к Петровичу и жить вверх ногами в облаке — или спускаться на ста мокрых простынях в город, который оторвётся в семь?"
      options: ["Наверх: живы и вместе с соседями, но мокрые навсегда, к земле не вернуться", "Вниз: два километра на мокром белье, внизу в семь то же самое, Петрович остаётся"]
  stakes:
    - {beat: setup, level: personal}
    - {beat: call, level: personal}
    - {beat: problem, level: family}
    - {beat: rule, level: family}
    - {beat: dilemma, level: community}
    - {beat: descent, level: community}
    - {beat: twist, level: world}
    - {beat: cliff, level: world}
  series: {name: "Обратный прилив", part: 2, of: 3, prev: tide, next: tide3, answers: "Что сделал Глеб, когда внизу сбросили его звонок, и куда девается дождь, который идёт вверх", cliff: "С номера Глеба звонят из-под воды, когда оба Глеба на земле"}

hooks:
  variants:
    - {id: h1, type: rule_warning, vo: "Звонят с вашего номера? Не отвечайте. Это не вы.", on_screen: "ПРОТОКОЛ 08", visual: "Квартал висит в облаках, с днища капает вверх; телефон: «ЗВОНИТ: МОЙ НОМЕР», поверх красное «НЕ ОТВЕЧАЙТЕ»", score: 9, why: "Правило и жуть в одной фразе; прямой ответ на финал части 1 («Протокол 08 загружен»); аномалия видна без звука."}
    - {id: h2, type: visual_shock, vo: "Бельё на балконах не висит. Оно стоит вверх, как пламя.", on_screen: "МОКРОЕ ПАДАЕТ ВВЕРХ", visual: "Панельный дом в облаках, простыни на верёвках стоят вертикально вверх", score: 8, why: "Свежая картинка, но без ставки и без связи с частью 1."}
    - {id: h3, type: speculative, vo: "Дождь шёл вверх целый час. Мы наконец увидели, куда.", on_screen: "КУДА УХОДИТ ДОЖДЬ", visual: "Облака рвутся, сверху висят волны", score: 8, why: "Сильная загадка, но спойлерит поворот."}
    - {id: h4, type: stakes, vo: "Через пять минут облако дойдёт до двора. В нём промокаешь за минуту.", on_screen: "5 МИНУТ", visual: "Облако опускается на крыши, как потолок", score: 8, why: "Срок и цена, но без героя непонятно, за кого бояться."}
    - {id: h5, type: result_first, vo: "Его спасли сто мокрых простыней.", on_screen: "100 ПРОСТЫНЕЙ", visual: "Кабина лифта висит под облаком из белья", score: 7, why: "Интрига и картинка, но без правила не ясно, почему."}
    - {id: h6, type: anomaly, vo: "На днище квартала стоит человек. Вверх ногами.", on_screen: "ОН ЖИВ", visual: "Перевёрнутый Петрович машет фонарём с днища", score: 7, why: "Жутко и понятно, но без правила и срока."}
    - {id: h7, type: imagine, vo: "Представь: над облаками море. Вверх дном.", on_screen: "МОРЕ ВВЕРХ ДНОМ", visual: "Перевёрнутые волны над городом", score: 6, why: "«Представь» — штамп и раскрывает поворот."}
    - {id: h8, type: question, vo: "Куда девается дождь, который идёт вверх?", on_screen: "КУДА?", visual: "Капли уходят в облака", score: 5, why: "Вопрос-лекция."}
  primary: h1
  ab: [h2, h4]

beats:
  # ------------------------------------------------------------------ 1. HOOK — Протокол 08
  - id: hook
    role: hook
    title: "Это не вы"
    goal: "Сразу правило-предупреждение, которое переворачивает спасение из части 1: звонок со своего номера — «не вы»."
    vo: "Звонят с вашего номера? Не отвечайте. Это не вы."
    lines:
      - {who: system, say: "Звонят с вашего номера? Не отвечайте. Это не вы."}
    on_screen: "ЗВОНЯТ С ВАШЕГО НОМЕРА? НЕ ОТВЕЧАЙТЕ"
    devices: [open_loop, visual_proof, text_reinforcement, sound_hit, pattern_interrupt]
    music: drone
    marks: {"вашего номера": "#f2f4f6"}
    shots:
      - id: h_block
        visual: "Первый кадр — аномалия: в пасмурном небе висит оторванный квартал. Сверху панельки, снизу грунт, трубы и корни, с днища капли летят ВВЕРХ. Ниже — облачная пелена, сквозь неё еле видна сетка дворов. Справа в кадр въезжает телефон: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР»."
        actors: [sky, cloud_bank, city_chunk, rain, phone_call, archive]
        camera: "Медленный облёт квартала снизу вверх, лёгкая тряска"
        animation:
          - {at: "@start", what: "Капли с днища уходят вверх, облака плывут"}
          - {at: "@номера", what: "Телефон вибрирует: свой номер"}
          - {at: "@отвечайте", what: "Красная плашка «НЕ ОТВЕЧАЙТЕ» поверх экрана"}
        graphics:
          - {at: "@отвечайте", type: rule_card, text: "НЕ ОТВЕЧАЙТЕ"}
        sfx:
          - {at: "@start", sound: buzz}
          - {at: "@отвечайте", sound: alarm}
        ambience: [wind]
        transition: cut
      - id: h_title
        at: "@Это-0.1"
        visual: "Сбой сигнала — заголовок. За ним облака и днища шести кварталов лестницей; в самом верху сквозь облака на миг проступает гребень перевёрнутой волны (пасхалка)."
        actors: [sky, cloud_bank, city_chunk, title_card, archive]
        camera: "Резкий подъём вверх"
        animation:

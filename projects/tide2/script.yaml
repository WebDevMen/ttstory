  tiktok:
    caption: "Звонят с вашего номера? Не отвечайте. Дождь вверх, часть 2: Протокол 08. Куда уходит дождь? 🌧️⬆️🌊"
    hashtags: ["#дождьвверх", "#фантастика", "#протокол", "#страшныеистории", "#апокалипсис"]
    cover: "ЗВОНИТ МОЙ НОМЕР"
    sound: "Своя музыка движка (drone → tension → pulse → epic → sub → drone)"
  reels:

        visual: "Крупно: Соня смотрит в просвет облаков вниз, на крошечную девочку с жёлтым зонтом во дворе нижнего города. Глеб садится рядом."
        actors: [person, cloud_bank, umbrella, archive]
        camera: "Наезд через плечо Сони"
        animation:
          - {at: "@я#3", what: "Соня показывает вниз"}
          - {at: "@ты", what: "Глеб берёт её за плечи"}
        graphics:
          - {at: "@я#3", type: callout, text: "ДЕВОЧКА С ЖЁЛТЫМ ЗОНТОМ"}
        sfx:
          - {at: "@ты", sound: heartbeat}
        transition: cut

  # ------------------------------------------------------------------ 6. DESCENT — спуск на белье; звонок «хрипло, с ветром»
  - id: descent
    role: payoff
    title: "Хрипло, с ветром"
    goal: "Правило r4 работает (простыни мокнут — Глеб срезает по одной), связь появляется; Глеб кричит себе те самые слова из части 1 — загадка звонка закрыта."
    vo: "Глеб режет последнюю верёвку. Кабина уходит вниз сквозь дождь, который летит вверх. Простыни мокнут сильнее и тянут обратно. Глеб срезает по одной. Девяносто восемь. Девяносто семь. Ветер в люке ревёт. Одна палочка связи. Две. Три. Внизу шесть сорок восемь. Глеб набирает себя и кричит в ветер. Не веди её на крышу. Спрячь в лифт, в яму. Ключ у тебя в левом кармане. Хрипло. С ветром."
    lines:
      - {who: sonya, say: "Девяносто восемь. Девяносто семь."}
      - {who: gleb, say: "Не веди её на крышу."}
      - {who: gleb, say: "Спрячь в лифт, в яму."}
      - {who: gleb, say: "Ключ у тебя в левом кармане."}
    scene: {when: "07:10 (внизу 06:48)", where: "кабина под простынями, спуск сквозь облака к нижнему городу"}
    on_screen: "ВНИЗУ 06:48 · СВЯЗЬ 3"
    devices: [callback, mini_payoff, sound_hit, emotion]
    music: epic
    marks: {"с ветром": "#f2f4f6"}
    shots:
      - id: e_drop
        visual: "Самый красивый кадр серии: кабина лифта висит под огромным облаком из ста белых простыней на тросах и уходит вниз сквозь облака; вокруг дождь летит ВВЕРХ; сверху удаляется квартал с перевёрнутыми фигурками."
        actors: [sky, cloud_bank, city_chunk, new:sheet_rig, rain, archive]
        camera: "Дрон: камера опускается вместе с кабиной"
        animation:
          - {at: "@последнюю", what: "Трос лопается, кабина уходит вниз"}
          - {at: "@сквозь", what: "Облако проглатывает кабину и выпускает снизу"}
          - {at: "@вверх", what: "Дождь бьёт снизу в простыни"}
          - {at: "@обратно", what: "Простыни раздуваются, спуск замедляется"}
        sfx:
          - {at: "@последнюю", sound: scrape}
          - {at: "@вниз", sound: whoosh}
        ambience: [wind, rain]
        transition: whip_y
      - id: e_count
        at: "@Глеб#2-0.1"
        visual: "Из люка кабины: Глеб ножом срезает по одной простыне — каждая улетает вверх белым флагом; Соня считает. Счётчик 98 → 97, альтиметр падает."
        actors: [lift_cabin, person, new:sheet, rain, archive]
        camera: "Нашлемная камера, сильный ветер, дрожь"
        animation:
          - {at: "@Девяносто", what: "Простыня улетает, счётчик 98"}
          - {at: "@Девяносто#2", what: "Ещё одна, 97"}
          - {at: "@ревёт", what: "Ветер рвёт капюшон"}
        graphics:
          - {at: "@Девяносто", type: badge, text: "98"}
          - {at: "@Девяносто#2", type: badge, text: "97"}
        sfx:
          - {at: "@Девяносто", sound: whoosh}
          - {at: "@Девяносто#2", sound: whoosh}
          - {at: "@ревёт", sound: noise_sweep}
        transition: cut
      - id: e_bars
        at: "@Одна-0.1"
        visual: "Экран телефона в ветре: палочки связи 1 → 2 → 3; часы нижнего города 06:48; набор «Глеб · Мой номер» → «ВЫЗОВ ИДЁТ» → «СОЕДИНЕНО»."
        actors: [phone_call, archive]
        camera: "Ручная, сильная дрожь"
        animation:
          - {at: "@Одна", what: "Одна палочка"}
          - {at: "@Две", what: "Две"}
          - {at: "@Три", what: "Три"}
          - {at: "@набирает", what: "Соединено"}
        graphics:
          - {at: "@сорок", type: badge, text: "ВНИЗУ 06:48"}
        sfx:
          - {at: "@Одна", sound: blip}
          - {at: "@Две", sound: blip}
          - {at: "@Три", sound: blip}
        transition: cut
      - id: e_shout
        at: "@Не-0.1"
        visual: "Глеб кричит в телефон, высунувшись из люка, лицо в каплях, летящих вверх; за ним белое облако простыней. На экране — та же запись вызова, что в части 1: «06:48:21»."
        actors: [lift_cabin, person, new:sheet_rig, rain, mark, archive]
        camera: "Крупный план, ветер, дрожь"
        animation:
          - {at: "@крышу", what: "Глеб кричит"}
          - {at: "@яму", what: "Порыв ветра"}
          - {at: "@кармане", what: "Метка: «ЗАПИСЬ ВЫЗОВА 06:48:21 — СОВПАДАЕТ»"}
          - {at: "@Хрипло", what: "Стоп-кадр, сбой"}
        graphics:
          - {at: "@кармане", type: callout, text: "ВЫЗОВ 06:48:21 · СОВПАДАЕТ"}
        sfx:
          - {at: "@крышу", sound: whoosh}
          - {at: "@Хрипло", sound: glitch}
        transition: cut

  # ------------------------------------------------------------------ 7. TWIST — море вверх дном
  - id: twist
    role: twist
    title: "Море вверх дном"
    goal: "Улики (соль, водоросли, шум) щёлкают: над облаками море вверх дном, туда уходит дождь; уровень опускается на квартал каждые двадцать минут — это и есть обратный прилив."
    vo: "Глеб поднимает голову. Облако над ними рвётся. Над городом — море. Вверх дном. Волны висят в небе, как потолок. В них тонут кварталы, а окна ещё горят под водой. Вот куда шёл дождь. И почему он солёный. Квартал Петровича уходит в волну. Внимание. Уровень моря опускается на квартал каждые двадцать минут. Нижний город — следующий."
    lines:
      - {who: system, say: "Внимание. Уровень моря опускается на квартал каждые двадцать минут."}
      - {who: system, say: "Нижний город — следующий."}
    scene: {when: "07:12", where: "кабина под простынями, взгляд вверх"}
    on_screen: "МОРЕ ВВЕРХ ДНОМ"
    devices: [mini_payoff, visual_proof, emotion, stakes_raise]
    music: sub
    marks: {"вверх дном": "#f2f4f6", "двадцать минут": "#f2f4f6"}
    shots:
      - id: t_tear
        visual: "Взгляд вверх из люка: облачная пелена рвётся, сквозь разрыв — тёмно-зелёная перевёрнутая толща воды."
        actors: [sky, cloud_bank, new:sky_sea, new:sheet_rig, archive]
        camera: "Нашлемная камера: запрокинутая голова, наезд вверх"
        animation:
          - {at: "@рвётся", what: "Облака расходятся"}
          - {at: "@море", what: "Толща воды проступает"}
        sfx:
          - {at: "@рвётся", sound: riser}
        transition: dip
      - id: t_sea
        at: "@Волны-0.1"
        visual: "Главный кадр: над всем городом висит море вверх дном — поверхность смотрит вниз, гребни волн свисают, как сталактиты, пена — это облака. В воде, вверх ногами, тонут верхние кварталы — лестница из шести; в их окнах горит свет под водой, блики-каустика. Ниже — наша кабина под белыми простынями, крошечная."
        actors: [sky, new:sky_sea, city_chunk, cloud_bank, new:sheet_rig, rain, rule_card, archive]
        camera: "Кинематографичный медленный отъезд, огромный масштаб"
        animation:
          - {at: "@потолок", what: "Волна прокатывается по перевёрнутой поверхности"}
          - {at: "@кварталы", what: "Кварталы в толще воды"}
          - {at: "@горят", what: "Окна под водой мерцают"}
          - {at: "@солёный", what: "Карточка «КУДА УХОДИТ ДОЖДЬ»"}
        graphics:
          - {at: "@дождь", type: rule_card, text: "ВЕСЬ ДОЖДЬ УХОДИТ В МОРЕ"}
        sfx:
          - {at: "@Волны", sound: riser}
          - {at: "@горят", sound: chime}
        transition: cut
      - id: t_petr
        at: "@Квартал-0.1"
        visual: "Средний план: опускающаяся поверхность моря касается крыш квартала Петровича; перевёрнутые фигурки с фонариками уходят в волну; огни гаснут один за другим."
        actors: [new:sky_sea, city_chunk, person, cloud_bank, archive]
        camera: "Медленный наезд"
        animation:
          - {at: "@уходит", what: "Квартал погружается, огни гаснут"}
          - {at: "@волну", what: "Последний фонарик"}
        sfx:
          - {at: "@волну", sound: boom}
        transition: cut
      - id: t_alert
        at: "@Внимание-0.1"
        visual: "ЭЛТ-экран системы оповещения (как в части 1), по нему бегут строки протокола; интерфейс сбоит."
        actors: [crt_tv, archive]
        camera: "Наезд на экран"
        animation:
          - {at: "@Внимание", what: "«ВНИМАНИЕ ВСЕМ · ПРОТОКОЛ 08»"}
          - {at: "@двадцать", what: "«УРОВЕНЬ: −1 КВАРТАЛ / 20 МИН»"}
          - {at: "@следующий", what: "«НИЖНИЙ ГОРОД — СЛЕДУЮЩИЙ», сбой"}
        sfx:
          - {at: "@Внимание", sound: alarm}
          - {at: "@следующий", sound: boom}
        transition: glitch

  # ------------------------------------------------------------------ 8. CLIFF — посадка во дворе; звонят с его номера, а оба Глеба здесь
  - id: cliff
    role: cliffhanger
    title: "Звонят из-под воды"
    goal: "Посадка в нижнем дворе; звонок, которого быть не может: оба Глеба на месте, значит, звонят сверху — из-под воды."
    vo: "Шесть пятьдесят две. Кабина садится во двор на Речной. Пусто. Все на крышах. Нижний Глеб с дочкой уже в яме, там нет связи. У Глеба жужжит телефон. Звонит Глеб. Его собственный номер. Но оба Глеба — здесь. Звонят сверху. Из-под воды."
    scene: {when: "06:52 нижнего города", where: "двор на Речной в нижнем городе"}
    on_screen: "ЗВОНИТ: МОЙ НОМЕР"
    devices: [open_loop, callback, pattern_interrupt, sound_hit]
    music: drone
    marks: {"собственный номер": "#f2f4f6", "из-под воды": "#f2f4f6"}
    shots:
      - id: c_land
        visual: "Камера наблюдения CAM 03 нижнего двора (тот же ракурс, что в начале части 1): мокрый двор, дождь летит вверх; сверху опускается кабина под простынями и садится в лужу; простыни отрываются и улетают вверх белой стаей."
        actors: [sky, panel_block, wet_ground, puddle, lift_cabin, new:sheet_rig, rain, archive]
        camera: "Неподвижная камера наблюдения"
        animation:
          - {at: "@садится", what: "Кабина касается асфальта, брызги"}
          - {at: "@Пусто", what: "Простыни улетают вверх"}
        graphics:
          - {at: "@Шесть", type: timetag, text: "06:52 · РЕЧНАЯ, 12 · НИЖНИЙ ГОРОД"}
        sfx:
          - {at: "@садится", sound: impact}
          - {at: "@Пусто", sound: whoosh}
        ambience: [rain]
        transition: dip
      - id: c_roofs
        at: "@Все-0.1"
        visual: "Взгляд вверх с асфальта: на крышах панелек — силуэты жильцов с вещами под дождём, который летит вверх; над ними облака и днище нашего квартала."
        actors: [sky, panel_block, person, cloud_bank, city_chunk, rain, archive]
        camera: "Медленный подъём по фасаду к крышам"
        animation:
          - {at: "@крышах", what: "Силуэты на крышах, первые уже отрываются"}
        sfx:
          - {at: "@крышах", sound: noise_sweep}
        transition: cut
      - id: c_pit
        at: "@Нижний-0.1"
        visual: "Разрез дома (как в части 1): в яме лифта светится кабина с двумя фигурками; значок «нет связи»."
        actors: [house_section, mark, archive]
        camera: "Наезд на яму"
        animation:
          - {at: "@яме", what: "Подсвечивается кабина в яме"}
          - {at: "@связи", what: "Значок: связь 0"}
        graphics:
          - {at: "@связи", type: callout, text: "ЯМА ЛИФТА · СВЯЗЬ 0"}
        sfx:
          - {at: "@яме", sound: drip}
        transition: cut
      - id: c_call
        at: "@жужжит-0.1"
        visual: "Телефон в руке Глеба, капли на экране летят вверх: «ЗВОНИТ: ГЛЕБ · МОЙ НОМЕР». Поверх — красная плашка Протокола 08 «НЕ ОТВЕЧАЙТЕ. ЭТО НЕ ВЫ». Источник вызова: «ГЛУБИНА 40 М»."
        actors: [phone_call, rule_card, mark, archive]
        camera: "Ручная, наезд на экран"
        animation:
          - {at: "@Звонит", what: "Вызов"}
          - {at: "@номер", what: "Красная плашка «НЕ ОТВЕЧАЙТЕ. ЭТО НЕ ВЫ»"}
          - {at: "@оба", what: "Глеб смотрит на подвал — там второй Глеб"}
          - {at: "@здесь", what: "Сбой: «ИСТОЧНИК: ГЛУБИНА 40 М»"}
          - {at: "@воды", what: "Экран заливает рябь, как вода"}
        graphics:
          - {at: "@сверху", type: callout, text: "ИСТОЧНИК: ГЛУБИНА 40 М"}
        sfx:
          - {at: "@жужжит", sound: buzz}
          - {at: "@воды", sound: noise_sweep}
        transition: cut

  # ------------------------------------------------------------------ 9. CTA — ответить или сбросить
  - id: cta
    role: cta
    title: "Ответить или сбросить"
    goal: "Вопрос-выбор одним словом по главной дилемме части + третья часть."
    vo: "Протокол говорит: не отвечай. Но такой звонок уже спас Соню. Ответишь или сбросишь? Пиши одним словом. Протокол девять — в третьей части."
    on_screen: "ОТВЕТИТЬ ИЛИ СБРОСИТЬ?"
    devices: [comment_bait, open_loop]
    music: drone
    shots:
      - id: q_choice
        visual: "Тёмный экран-архив: две карточки — «А · ПРОТОКОЛ: СБРОСИТЬ» и «Б · СВОЙ ГОЛОС: ОТВЕТИТЬ», между ними телефон со входящим «Мой номер»; сверху едва видна перевёрнутая волна. Финал — «КОНЕЦ ЗАПИСИ 062 / 093»."
        actors: [new:sky_sea, rule_card, phone_call, title_card, archive]
        camera: "Медленный наезд"
        animation:
          - {at: "@отвечай", what: "Карточка А"}
          - {at: "@Соню", what: "Карточка Б"}
          - {at: "@сбросишь", what: "Вопрос"}
          - {at: "@одним", what: "Телефон вибрирует, кнопки «ответить / сбросить» мигают"}
          - {at: "@части", what: "Сбой: КОНЕЦ ЗАПИСИ"}
        graphics:
          - {at: "@сбросишь", type: title, text: "ОТВЕТИТЬ ИЛИ СБРОСИТЬ?"}
        sfx:
          - {at: "@отвечай", sound: blip}
          - {at: "@Соню", sound: blip}
          - {at: "@части", sound: glitch}
        transition: glitch

loops:
  - {id: l0, question: "Если звонят с вашего номера и это не вы — то кто?", open: hook, close: cliff}
  - {id: l1, question: "Кто кричал Глебу в части 1 «хрипло, с ветром» и почему сверху не дозвониться?", open: call, close: descent}
  - {id: l2, question: "Почему дождь солёный и что шумит над облаками?", open: call, close: twist}
  - {id: l3, question: "Кто звонит с номера Глеба из-под воды?", open: cliff, close: cta}

engagement:
  comment: "Ответить или сбросить? Одним словом."
  share: "Переслать тому, с кем смотрели первую часть и спорили «крыша или лифт»."
  save: "Сохранить ради правил: мокрое — вверх, сухое — вниз; простыня = минус четыре килограмма; облако промачивает за минуту."
  follow: "Подписка на третью часть — «Протокол 09»: кто звонит из-под воды."
  rewatch: "В первом кадре в облаках на миг виден гребень перевёрнутой волны; капля солёная, на днище водоросли, Петрович слышит море — всё это до поворота."
  cta: {beat: cta, text: "Ответить или сбросить? Пиши одним словом", type: comment}


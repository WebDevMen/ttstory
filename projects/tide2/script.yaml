  # ------------------------------------------------------------------ 3. PROBLEM — облако опускается; Петрович вверх ногами
  - id: problem
    role: reveal
    title: "Вверх ногами"
    goal: "Новая угроза и правило r3: облако опускается и промачивает за минуту; доказательство — Петрович вверх ногами; улики 2 и 3 — водоросли, шум моря."
    vo: "Глеб выбирается во двор. Над крышами, в тридцати метрах, висит днище другого квартала. Трубы, корни, водоросли. На нём стоит человек. Вверх ногами. Аркадий Петрович, семьдесят лет, сосед. Он ушёл на крышу по сирене. Глеб! Облако опускается! Через пять минут оно здесь. В нём промокаешь за минуту. Я проверил. И наверху шумит. Как море."
    lines:
      - {who: petrovich, say: "Глеб! Облако опускается! Через пять минут оно здесь."}
      - {who: petrovich, say: "В нём промокаешь за минуту. Я проверил."}
      - {who: petrovich, say: "И наверху шумит. Как море."}

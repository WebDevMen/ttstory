# СЦЕНАРИЙ: «Обратный прилив. Протокол 08» — часть 2 из 3, одна история ~3 минуты (вымысел, фантастика).
# Продолжение projects/tide: та же точка зрения (Глеб), та же ставка (Соня), та же стилистика EMERGENCY ARCHIVE.
# Отвечает на обрыв части 1 (Глеб набирает себя — внизу сбрасывают) и на вопрос «куда девается дождь, который идёт вверх».
# Правила ясности: docs/SCRIPTING.md §14.6. Проверка: python3 vg.py script check tide2 [--tts]
#
# Время (at:) — ссылки на слова текста ЭТОГО блока. Реплики героев написаны прямо в vo, lines отмечает, чья реплика.
# «Система» — тот же женский голос оповещения, что в части 1.


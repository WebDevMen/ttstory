production:
  theme: {preset: archive, accent: "#d9e2ea", captions: clean}
  palette: ["#0a0c0f почти чёрный", "#3c4650 сталь", "#8a96a2 холодный серый", "#f2f4f6 белый (простыни)", "#1f4a4c глубина моря (новый цвет части 2, только в поворот)", "#e3262f аварийный красный (только опасность)", "#ffd23a жёлтый — единственный тёплый цвет (куртка Сони, зонт внизу)"]
  music: {key: E, mode: minor, bpm: 88}
  voices:
    narrator: {voice: ru-RU-SvetlanaNeural, rate: "+15%"}
    system: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+6%", pitch: "-2Hz"}
    gleb: {voice: ru-RU-DmitryNeural, rate: "+10%", pitch: "-4Hz"}
    sonya: {voice: ru-RU-SvetlanaNeural, rate: "+16%", pitch: "+45Hz"}

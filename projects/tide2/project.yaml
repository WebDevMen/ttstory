            - {actor: cloud_bank, x: -500, y: 0, w: 2100, h: 500, color: "#a7b1ba", shade: "#6c7782", n: 30, blur: 30, speed: 10, opacity: 0.8}
            - {actor: city_chunk, x: -200, y: 20, w: 1480, soil: 520, seed: 33, flat: true, weed: 1, drip: 1, tunnel: false}
            - {actor: person, x: 250, y: 570, scale: 1.0, rot: 180, air: true, look: *n1, pose: stand, hold: torch}

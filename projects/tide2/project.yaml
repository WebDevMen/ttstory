            - {actor: person, id: petr, x: 540, y: 570, scale: 1.2, rot: 180, air: true, look: *petr, face: talk,
               pose: [{at: 0, v: stand}, {at: "@мокрый", v: shrug, dur: 0.3}, {at: "@Поднимайтесь", v: {a1: [7, 4], a2: [160, 0], l1: [2, 0], l2: [2, 0]}, dur: 0.3}]}
            - {actor: shape, kind: path, d: "M260,830 L120,1250 L400,1250 Z", fill: {linear: ["rgba(240,236,210,0.35)", "rgba(240,236,210,0)"], angle: 180}, at: "@Здесь", enter: {type: fade, dur: 0.3}}
            - {actor: cloud_bank, x: -500, y: 1300, w: 2100, h: 500, color: "#8b96a1", shade: "#5a656f", n: 26, blur: 30}
            - {actor: skyline, x: 540, y: 2560, w: 2600, h: 320, color: "#6f7a84", color2: "#66717b", lit: 0.05, seed: 9, par: 0.6}
            - {actor: shape, kind: rect, x: 540, y: 2500, w: 2600, h: 400, par: 0.62, fill: {linear: ["rgba(140,150,160,0)", "rgba(140,150,160,0.8)"], angle: 180}}
            - {actor: panel_block, x: 140, y: 2400, scale: 0.95, floors: 9, cols: 4, seed: 4, lit: 0.25, stains: 0.6}
            - {actor: wet_ground, x: -400, y: 2380, w: 1300, h: 400}
            - {actor: shape, kind: path, d: "M860,2380 L1500,2380 L1500,2800 L940,2800 L900,2600 Z", fill: "#2a2622"}

  # ------------------------------------------------------------------ 8. TWIST — море вверх дном
  - id: twist
    text: "Глеб поднимает голову. Облако над ними рвётся. Над городом — море. Вверх дном. Волны висят в небе, как потолок. В них тонут кварталы, а окна ещё горят под водой. Вот куда шёл дождь. И почему он солёный. Квартал Петровича уходит в волну. Внимание. Уровень моря опускается на квартал каждые двадцать минут. Нижний город — следующий."
    lines:
      - {who: system, say: "Внимание. Уровень моря опускается на квартал каждые двадцать минут."}
      - {who: system, say: "Нижний город — следующий."}
    caption_marks: {"вверх дном": "#f2f4f6", "двадцать минут": "#f2f4f6"}
    shots:

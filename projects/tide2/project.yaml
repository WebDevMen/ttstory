  # ------------------------------------------------------------------ 9. CLIFF — посадка; звонок с его номера, когда оба Глеба здесь
  - id: cliff
    text: "Шесть пятьдесят две. Кабина садится во двор на Речной. Пусто. Все на крышах. Нижний Глеб с дочкой уже в яме, там нет связи. У Глеба жужжит телефон. Звонит Глеб. Его собственный номер. Но оба Глеба — здесь. Звонят сверху. Из-под воды."
    caption_marks: {"собственный номер": "#f2f4f6", "из-под воды": "#f2f4f6"}
    shots:
      - id: c_land
        transition: {type: dip, dur: 0.35}
        captions_top: 1700
        ambience: [{sound: rain, gain: -15}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.06, x: 540, y: 1000}], shakes: [{at: "@садится", amp: 10, dur: 0.4, freq: 5}]}

  # ------------------------------------------------------------------ 7. DESCENT — спуск на белье, связь, звонок «хрипло, с ветром»
  - id: descent
    text: "Глеб режет последнюю верёвку. Кабина уходит вниз сквозь дождь, который летит вверх. Простыни мокнут сильнее и тянут обратно. Глеб срезает по одной. Девяносто восемь. Девяносто семь. Ветер в люке ревёт. Одна палочка связи. Две. Три. Внизу шесть сорок восемь. Глеб набирает себя и кричит в ветер. Не веди её на крышу. Спрячь в лифт, в яму. Ключ у тебя в левом кармане. Хрипло. С ветром."
    lines:
      - {who: sonya, say: "Девяносто восемь. Девяносто семь."}
      - {who: gleb, say: "Не веди её на крышу."}
      - {who: gleb, say: "Спрячь в лифт, в яму."}
      - {who: gleb, say: "Ключ у тебя в левом кармане."}
    caption_marks: {"с ветром": "#f2f4f6"}
    shots:

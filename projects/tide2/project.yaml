# «Обратный прилив. Протокол 08» (~3:08) — часть 2 из 3. Своя графика кодом (method draw), без ИИ-картинок.
# Та же концепция EMERGENCY ARCHIVE, что в части 1 (projects/tide): «найденные записи» (камеры наблюдения, телефон,
# нашлемная камера, дрон, документы) + кинематографичные кадры; интерфейс PROTOCOL 08 в углу (актёр archive), правила —
# крупно (rule_card), красный — только опасность. Новое: перевёрнутая вертикаль (люди вверх ногами на днищах, бельё как
# пламя), кабина под облаком из ста простыней, море вверх дном над городом. Интерфейс ломается к повороту (stage 1 → 2).
# Сценарий: projects/tide2/script.yaml. Актёры: части 1 (projects/tide/actors, через actors/series.txt) + actors/sea.js.
# Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Обратный прилив. Протокол 08"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+15%", pitch: "+0Hz", tail: 1.6}
voices:
  system: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+6%", pitch: "-2Hz"}
  gleb: {voice: ru-RU-DmitryNeural, rate: "+10%", pitch: "-4Hz"}
  sonya: {voice: ru-RU-SvetlanaNeural, rate: "+16%", pitch: "+45Hz"}
  petrovich: {voice: ru-RU-DmitryNeural, rate: "-2%", pitch: "-18Hz"}

theme:
  preset: archive
  accent: "#d9e2ea"
  captions: {style: clean, top: auto, size: 64, max_chars: 20}

post: {vignette: 0.18, chromatic: 0, grain: 0.02}

draw:
  palette: {ink: "#0a0c0f", steel: "#3c4650", grey: "#8a96a2", white: "#f2f4f6", red: "#e3262f", yellow: "#ffd23a", water: "#9fc4dc", sea: "#1f4a4c"}

audio:
  music:
    key: E
    mode: minor
    bpm: 88
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@problem.start", style: tension}
      - {at: "@dilemma.start", style: pulse}
      - {at: "@descent.start", style: epic}
      - {at: "@twist.start", style: sub}
      - {at: "@cliff.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-sky-high: &sky_high {actor: sky, x: -300, y: 0, w: 1680, h: 2000, hour: 12, colors: ["#28313a", "#4a5560", "#78848f"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1700, par: 0}
x-rule: &rule {actor: rule_card, x: 540, y: 800, space: screen, enter: {type: wipe_right, dur: 0.25}, exit: {type: fade, dur: 0.2}, sfx: false}
x-look-gleb: &gleb {age: adult, outfit: gakuran, hair: short, silhouette: "#14181c"}
x-look-sonya: &sonya {age: kid, outfit: kyushoku, hat: none, mask: false, hair: twintails, silhouette: "#6b5718"}
x-look-petr: &petr {age: adult, outfit: blazer, hair: buzz, glasses: true, silhouette: "#1e2124"}
x-look-n1: &n1 {age: adult, outfit: casual, silhouette: "#1a1e22", hair: bob}
x-look-n2: &n2 {age: adult, outfit: casual, silhouette: "#1a1e22", hair: short}
x-arch: &arch {actor: archive, x: 0, y: 0, space: screen, proto: "PROTOCOL 08", stage: 1, date: "14.11.2026"}
# the torn-off block seen from the side, with three panel blocks on top (our home on Rechnaya, 12)
x-home-small: &home_small [{x: 160, floors: 9, cols: 5, cell: [52, 42], seed: 4, lit: 0.25, far: false}, {x: 420, floors: 9, cols: 4, cell: [52, 42], seed: 6, color: "#6e767d", lit: 0.2}, {x: 630, floors: 5, cols: 2, cell: [52, 42], seed: 12, color: "#737b82", lit: 0.15}]
x-home-blds: &home_blds [{x: 210, floors: 9, cols: 6, cell: [58, 46], seed: 4, lit: 0.25, far: false}, {x: 570, floors: 9, cols: 5, cell: [58, 46], seed: 6, color: "#6e767d", lit: 0.2}, {x: 850, floors: 5, cols: 3, cell: [58, 46], seed: 12, color: "#737b82", lit: 0.15}]

scenes:

  # ------------------------------------------------------------------ 1. HOOK — квартал висит в небе; звонят с вашего номера
  - id: hook
    text: "Звонят с вашего номера? Не отвечайте. Это не вы."
    gap_after: 1.4
    lines:
      - {who: system, say: "Звонят с вашего номера? Не отвечайте. Это не вы."}
    caption_marks: {"вашего номера": "#f2f4f6"}
    shots:
      - id: h_block
        transition: {type: fade, dur: 0.2}
        captions_top: 1150
        ambience: [{sound: wind, gain: -15}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, x: 540, y: 1000}, {t: end, z: 1.16, x: 560, y: 900}], sway: {x: 6, y: 5, roll: 0.4, freq: 0.4}, shakes: [{at: "@номера", amp: 6, dur: 0.5, freq: 5}]}
          layers:
            - *sky_high
            - {actor: skyline, x: 540, y: 1900, w: 2400, h: 260, color: "#6c7782", color2: "#65707a", lit: 0, seed: 21, par: 0.1}
            - {actor: cloud_bank, x: -500, y: 1350, w: 2100, h: 700, color: "#8994a0", shade: "#56616c", n: 34, blur: 30, par: 0.15}
            - {actor: city_chunk, x: 160, y: 980, w: 760, soil: 340, seed: 4, drip: 1, tunnel: false, buildings: *home_small, par: 0.6}
            - {actor: cloud_bank, x: -500, y: 1150, w: 2100, h: 500, color: "#a3adb6", shade: "#6c7782", n: 22, blur: 36, speed: 16, opacity: 0.85}
            - {actor: rain, x: 0, y: 0, space: screen, count: 220, v: -0.7, alpha: 0.45, seed: 2}
            - {actor: phone_call, x: 540, y: 1570, scale: 0.4, space: screen, state: incoming, bars: 0, clock: "07:03", name: "Глеб", number: "+7 912 406-17-33", own: "Мой номер",
               at: "@Звонят+0.3", enter: {type: slide_up, dur: 0.35}, wiggle: {rot: 1.5, freq: 9}}
            - {<<: *rule, y: 560, at: "@отвечайте-0.05", until: end, kicker: "ПРОТОКОЛ 08 · ВЕРХНИЙ ГОРОД", text: "НЕ ОТВЕЧАЙТЕ", danger: true, size: 112}
            - {<<: *arch, kind: drone, src: "UAV-3 · МЧС · ВЫСОТА 1,9 КМ", tc: 25380, status: "ВЕРХНИЙ ГОРОД", glitch: [{at: "@вашего", dur: 0.2}]}
      - id: h_title
        start: "@Это-0.22"
        transition: {type: glitch, dur: 0.25}
        look: {bloom: [0.75, 0.25]}
        draw:
          world: [1080, 3000]
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 2100}, {t: end, z: 1.04, x: 540, y: 1150, ease: inout}], sway: {x: 6, y: 4, roll: 0.4, freq: 0.3}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 3000, hour: 12, colors: ["#0e1a1c", "#2b3a40", "#66727d"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 2900}
            # easter egg: crests of the upside-down sea through the clouds at the very top
            - {actor: sky_sea, x: -260, y: -200, w: 1600, h: 900, level: 560, amp: 70, opacity: 0.55, blur: 2, foam: 0.6, rain: 0.4, seed: 3}
            - {actor: cloud_bank, x: -500, y: 420, w: 2100, h: 700, color: "#56616a", shade: "#28323a", n: 40, blur: 34}
            - {actor: city_chunk, x: 330, y: 950, w: 420, soil: 180, seed: 31, opacity: 0.4, blur: 3, drip: 0.6, tunnel: false}
            - {actor: city_chunk, x: 220, y: 1380, w: 640, soil: 260, seed: 33, opacity: 0.6, blur: 2, drip: 0.7, buildings: [{x: 150, floors: 9, cols: 5, cell: [46, 36], seed: 2}, {x: 440, floors: 6, cols: 4, cell: [46, 36], seed: 7}]}
            - {actor: cloud_bank, x: -500, y: 1650, w: 2100, h: 600, color: "#6c7782", shade: "#323b44", n: 30, blur: 32, seed: 7}
            - {actor: city_chunk, x: 40, y: 2050, w: 1000, soil: 420, seed: 4, drip: 1, buildings: *home_blds}
            - {actor: rain, x: 0, y: 0, space: screen, count: 260, v: -0.75, seed: 8}
            - {actor: title_card, x: 540, y: 760, space: screen, at: "@вы-0.15", enter: {type: fade, dur: 0.15}, kicker: "ПРОТОКОЛ 08", text: "ОБРАТНЫЙ ПРИЛИВ", sub: "ЧАСТЬ 2 · ЗАПИСЬ 032 / 062"}
            - {<<: *arch, kind: cinema, src: "РЕКОНСТРУКЦИЯ · МАТЕРИАЛЫ ДЕЛА", tc: 25384, glitch: [{at: "@Это-0.2", dur: 0.2}]}
    sfx:
      - {sound: buzz, at: "@Звонят+0.3", gain: -10}
      - {sound: buzz, at: "@номера", gain: -12}
      - {sound: alarm, at: "@отвечайте", gain: -14}
      - {sound: glitch, at: "@Это-0.2", gain: -14}
      - {sound: boom, at: "@вы", gain: -10}

  # ------------------------------------------------------------------ 2. SETUP — квартал в облаках, кабина, герои
  - id: setup
    text: "Семь ноль три. Над городом в облаках висит оторванный квартал. На дне его шахты — стальная кабина лифта. Глеб, двадцать девять лет, лифтёр. Соня, семь лет, его дочь."
    shots:
      - id: s_block
        transition: {type: dip, dur: 0.35}
        ambience: [{sound: wind, gain: -16}]
        look: {bloom: [0.8, 0.2]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 520, y: 1000}, {t: "@шахты", z: 1.08, x: 540, y: 1060, ease: inout}, {t: end, z: 1.18, x: 560, y: 1120}], sway: {x: 5, y: 4, roll: 0.3, freq: 0.35}}
          layers:
            - *sky_high
            - {actor: skyline, x: 540, y: 1960, w: 2400, h: 280, color: "#6f7a84", color2: "#66717b", lit: 0, seed: 9, par: 0.1}
            - {actor: shape, kind: rect, x: 540, y: 1900, w: 2600, h: 400, par: 0.12, fill: {linear: ["rgba(140,150,160,0)", "rgba(140,150,160,0.8)"], angle: 180}}
            - {actor: cloud_bank, x: -500, y: -120, w: 2100, h: 520, color: "#5d6872", shade: "#333c45", n: 34, blur: 34, par: 0.05}
            - {actor: cloud_bank, x: -500, y: 1380, w: 2100, h: 520, color: "#8b96a1", shade: "#5a656f", n: 30, blur: 30, par: 0.2}
            - {actor: city_chunk, id: home, x: 160, y: 980, w: 760, soil: 360, seed: 4, drip: 1, tunnel: false, buildings: *home_small, par: 0.6}
            # x-ray of the lift shaft inside the soil, the cabin at the bottom
            - {actor: shape, kind: rect, x: 330, y: 1170, w: 50, h: 230, fill: "none", stroke: "#f2f4f6", sw: 4, dash: "10 8", par: 0.6, at: "@шахты-0.1", enter: {type: wipe_down, dur: 0.6}}
            - {actor: shape, kind: rect, x: 330, y: 1262, w: 40, h: 44, fill: "#f2f4f6", par: 0.6, glow: {color: "#f2f4f6", r: 16, a: 0.9}, at: "@кабина-0.1", enter: {type: pop, dur: 0.3}, pulse: {amp: 0.06, freq: 1.2}}
            - {actor: mark, x: 330, y: 1262, w: 90, h: 90, par: 0.6, at: "@кабина", enter: {type: fade, dur: 0.2}, label: "КАБИНА П-2", sub: "ГЛУБИНА 6 М", side: bottom}
            - {actor: cloud_bank, x: -500, y: 1250, w: 2100, h: 420, color: "#b4bdc5", shade: "#7a8590", n: 18, blur: 40, speed: 14, opacity: 0.7, par: 1.1}
            - {actor: rain, x: 0, y: 0, space: screen, count: 200, v: -0.7, alpha: 0.4, seed: 4}
            - {actor: mark, x: 540, y: 470, w: 520, h: 10, space: screen, at: "@Семь", until: "@шахты-0.3", exit: fade, enter: {type: fade, dur: 0.2}, label: "07:03 · ВЫСОТА 1,9 КМ", sub: "РЕЧНАЯ, 12 · ОТОРВАН В 07:00:41", side: top}
            - {<<: *arch, kind: drone, src: "UAV-3 · МЧС · ОБЛЁТ", tc: 25381, status: "ВЕРХНИЙ ГОРОД"}
      - id: s_cabin
        start: "@Глеб-0.22"
        transition: {type: cut}
        captions_top: 640
        ambience: [{sound: hum, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 980}, {t: end, z: 1.06, x: 520, y: 1000}]}
          layers:
            - {actor: lift_cabin, x: 0, y: 0, tape: 4, floor: 0, flicker: [{at: 0, v: 0}, {at: "@дочь", v: 1}]}
            - {actor: person, id: gleb, x: 420, y: 1660, scale: 1.6, look: *gleb, face: [{at: 0, v: neutral}, {at: "@лифтёр", v: determined}], pose: sit,
               look_dx: [{at: 0, v: 0}, {at: "@Соня", v: 0.5, dur: 0.4}]}
            - {actor: person, id: sonya, x: 650, y: 1690, scale: 1.3, look: *sonya, face: [{at: 0, v: sad}, {at: "@дочь", v: neutral}], pose: sit, look_dx: -0.4}
            - {actor: mark, x: 420, y: 1350, w: 280, h: 330, space: screen, at: "@Глеб", until: "@Соня-0.1", exit: fade, enter: {type: fade, dur: 0.2}, label: "ГЛЕБ, 29", sub: "ЛИФТЁР · ПОДЪЕЗД 2"}
            - {actor: mark, x: 650, y: 1450, w: 220, h: 260, space: screen, at: "@Соня", enter: {type: fade, dur: 0.2}, label: "СОНЯ, 7", sub: "ДОЧЬ"}
            - {<<: *arch, kind: cctv, src: "CAM ЛИФТ П-2 · КАБИНА", tc: 25388, status: "ВЕРХНИЙ ГОРОД"}
    sfx:
      - {sound: whoosh, at: "@Семь", gain: -16}
      - {sound: drip, at: "@квартал", gain: -16}
      - {sound: blip, at: "@кабина", gain: -14}
      - {sound: click, at: "@Глеб", gain: -16}

  # ------------------------------------------------------------------ 3. CALL — внизу 06:43, сброс, солёная капля
  - id: call
    text: "Внизу, на Речной, снова шесть сорок три. Глеб звонит себе. Сброс. Ещё раз. Сброс. Соня высовывается в люк и ловит каплю языком. Пап, он солёный! Закрой люк!"
    lines:
      - {who: sonya, say: "Пап, он солёный!"}
      - {who: gleb, say: "Закрой люк!"}
    caption_marks: {"солёный": "#f2f4f6"}
    shots:
      - id: s_below
        transition: {type: whip_y}
        look: {bloom: [0.8, 0.2]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.9, x: 470, y: 1380, ease: inout}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1400, h: 2200, fill: {linear: ["#6f7b86", "#a9b3bb"], angle: 180}}
            - {actor: skyline, x: 540, y: 1180, w: 2200, h: 300, color: "#8a949c", color2: "#7d878f", lit: 0, seed: 21}
            - {actor: ground, x: -600, y: 1170, w: 2300, h: 900, color: ["#7d868d", "#5d656c"]}
            - {actor: panel_block, x: 160, y: 1320, scale: 0.42, floors: 9, cols: 8, seed: 3, lit: 0.05, color: "#9aa2a8", stains: 0.2}
            - {actor: panel_block, x: 880, y: 1300, scale: 0.4, floors: 9, cols: 7, seed: 8, lit: 0.05, color: "#929aa0", stains: 0.2}
            - {actor: panel_block, x: 470, y: 1500, scale: 0.5, floors: 9, cols: 9, cell: [100, 84], seed: 4, lit: 0.05, entrances: [4], color: "#9aa2a8", stains: 0.2}
            - {actor: ground, x: -600, y: 1490, w: 2300, h: 600, color: ["#6a737a", "#4d555c"]}
            - {actor: tree, kind: round, x: 760, y: 1530, h: 160, color: "#4a5a50", trunk: "#3a3430", seed: 3}
            - {actor: person, x: 455, y: 1515, scale: 0.17, look: *gleb, pose: stand}
            - {actor: person, x: 495, y: 1515, scale: 0.15, look: *sonya, pose: {a1: [7, 4], a2: [90, 30], l1: [2, 0], l2: [2, 0]}}
            - {actor: umbrella, x: 506, y: 1488, scale: 0.12, open: 1}
            # the hole in the clouds we look through
            - {actor: cloud_bank, x: -700, y: -200, w: 1200, h: 2300, color: "#c9d1d8", shade: "#8a96a2", n: 30, blur: 40, speed: 6, anim: [{at: "@Речной-0.3", dur: 2.5, x: -1000, ease: out}]}
            - {actor: cloud_bank, x: 600, y: -200, w: 1200, h: 2300, color: "#c9d1d8", shade: "#8a96a2", n: 30, blur: 40, speed: -6, seed: 8, anim: [{at: "@Речной-0.3", dur: 2.5, x: 900, ease: out}]}
            - {actor: mark, x: 478, y: 1490, w: 140, h: 120, at: "@сорок-0.1", enter: {type: fade, dur: 0.3}, label: "ВНИЗУ 06:43", sub: "РЕЧНАЯ, 12 · ДВОР", side: top}
            - {<<: *arch, kind: helmet, src: "НАШЛЕМНАЯ КАМЕРА · ВЗГЛЯД ВНИЗ", tc: 25392, status: "ВРЕМЯ НЕ СОВПАДАЕТ"}
      - id: s_call
        start: "@звонит-0.22"
        transition: {type: cut}
        draw:
          bg: "#0e1114"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}], shakes: [{at: "@Сброс", amp: 5, dur: 0.4, freq: 5}, {at: "@Сброс#2", amp: 6, dur: 0.4, freq: 5}], sway: {x: 6, y: 6, roll: 0.6, freq: 0.7}}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#2c3238", "#0c0e11"]}}
            - {actor: phone_call, x: 540, y: 860, scale: 0.9, bars: 0, clock: "07:03", name: "Глеб", number: "+7 912 406-17-33", own: "Вызов себе",
               state: [{at: 0, v: dialing}, {at: "@Сброс-0.1", v: declined}, {at: "@Ещё-0.1", v: dialing}, {at: "@Сброс#2-0.1", v: declined}]}
            - {actor: mark, x: 540, y: 470, w: 520, h: 130, space: screen, at: "@Сброс#2", enter: {type: fade, dur: 0.2}, label: "СВЯЗЬ: 0", sub: "СТАЛЬНАЯ КАБИНА ГЛУШИТ СИГНАЛ", side: bottom, danger: true}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ЭКРАН", tc: 25395, status: "ВЕРХНИЙ ГОРОД", glitch: [{at: "@Сброс", dur: 0.15}, {at: "@Сброс#2", dur: 0.15}]}
      - id: s_salt
        start: "@Соня-0.22"
        transition: {type: cut}
        look: {bloom: [0.7, 0.35]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: "@языком", z: 1.1, x: 540, y: 940}, {t: end, z: 1.04, x: 540, y: 1000}], shakes: [{at: "@Закрой", amp: 14, dur: 0.35, freq: 5}], sway: {x: 6, y: 6, roll: 0.5, freq: 0.6}}
          layers:
            - {actor: lift_cabin, x: 0, y: 0, view: hatch, hatch: [{at: 0, v: 0}, {at: "@высовывается-0.2", v: 1, dur: 0.6}, {at: "@Закрой+0.1", v: 0, dur: 0.25}]}
            - {actor: rain, x: 300, y: 600, w: 480, h: 720, count: 70, v: -0.8, len: 50, alpha: 0.7, seed: 4, opacity: [{at: 0, v: 0}, {at: "@высовывается", v: 1, dur: 0.4}, {at: "@Закрой+0.1", v: 0, dur: 0.2}]}
            - {actor: person, id: sonya, x: 540, y: 2050, scale: 2.4, air: true, look: *sonya, face: [{at: 0, v: happy}, {at: "@солёный-0.3", v: surprised}, {at: "@Закрой", v: sad}],
               pose: [{at: 0, v: {a1: [150, 20], a2: [150, 20], l1: [2, 0], l2: [2, 0], tilt: -12}}, {at: "@Закрой", v: {a1: [30, 40], a2: [30, 40], l1: [2, 0], l2: [2, 0]}, dur: 0.3}],
               anim: [{at: "@высовывается", dur: 0.6, y: 1900, ease: out}, {at: "@Закрой", dur: 0.35, y: 2150, ease: in}]}
            - {actor: shape, kind: circle, x: 548, y: 960, r: 9, fill: "#cfe3f0", at: "@ловит", until: "@языком+0.2", anim: [{at: "@ловит", dur: 0.6, y: 1150, ease: in}]}
            - {<<: *arch, kind: cctv, src: "CAM ЛИФТ П-2 · ЛЮК", tc: 25402, status: "ВЕРХНИЙ ГОРОД"}
    sfx:
      - {sound: whoosh, at: "@Речной", gain: -14}
      - {sound: blip, at: "@звонит", gain: -12}
      - {sound: click, at: "@Сброс", gain: -10}
      - {sound: click, at: "@Сброс#2", gain: -10}
      - {sound: creak, at: "@высовывается", gain: -12}
      - {sound: drip, at: "@языком", gain: -12}
      - {sound: slam, at: "@Закрой+0.1", gain: -10}

  # ------------------------------------------------------------------ 4. PROBLEM — Петрович вверх ногами; облако опускается
  - id: problem
    text: "Глеб выбирается во двор. Над крышами, в тридцати метрах, висит днище другого квартала. Трубы, корни, водоросли. На нём стоит человек. Вверх ногами. Аркадий Петрович, семьдесят лет, сосед. Он ушёл на крышу по сирене. Глеб! Облако опускается! Через пять минут оно здесь. В нём промокаешь за минуту. Я проверил. И наверху шумит. Как море."
    lines:
      - {who: petrovich, say: "Глеб! Облако опускается! Через пять минут оно здесь."}
      - {who: petrovich, say: "В нём промокаешь за минуту. Я проверил."}
      - {who: petrovich, say: "И наверху шумит. Как море."}
    caption_marks: {"вверх ногами": "#f2f4f6", "за минуту": "#f2f4f6"}
    shots:
      - id: p_yard
        transition: {type: whip_y}
        ambience: [{sound: wind, gain: -16}]
        draw:
          world: [1080, 2600]
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1640}, {t: "@днище", z: 1.0, x: 540, y: 1000, ease: inout}, {t: end, z: 1.06, x: 540, y: 900}], bob: {freq: 1.6, x: 4, y: 6, roll: 0.5}, sway: {x: 6, y: 6, roll: 0.5, freq: 0.5}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 2600, hour: 12, colors: ["#3a444e", "#5c6772", "#808c97"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 2400}
            - {actor: cloud_bank, x: -500, y: 600, w: 2100, h: 600, color: "#7a8590", shade: "#4c5660", n: 30, blur: 34, par: 0.4}
            # the block above: its underside 30 m over our roofs; weed on the soil, drops flying up into it
            - {actor: city_chunk, id: upper, x: -200, y: 20, w: 1480, soil: 520, seed: 33, flat: true, weed: 1, drip: 1, tunnel: false}
            - {actor: panel_block, x: 230, y: 2280, scale: 1.25, floors: 9, cols: 5, seed: 4, lit: 0.25, stains: 0.6}
            - {actor: panel_block, x: 860, y: 2300, scale: 1.1, floors: 9, cols: 4, seed: 6, lit: 0.2, color: "#737b82"}
            - {actor: wet_ground, x: -400, y: 2270, w: 1900, h: 400}
            - {actor: rain, x: 0, y: 0, space: screen, count: 200, v: -0.7, alpha: 0.45, seed: 6}
            - {actor: mark, x: 540, y: 950, w: 700, h: 300, at: "@тридцати-0.1", until: "@водоросли+0.6", exit: fade, enter: {type: fade, dur: 0.2}, label: "30 М", sub: "ДНИЩЕ ЗОНЫ 06", side: bottom}
            - {<<: *arch, kind: helmet, src: "НАШЛЕМНАЯ КАМЕРА · ЛИФТЁР П-2", tc: 25500, status: "ВЕРХНИЙ ГОРОД"}
      - id: p_petr
        start: "@На-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 900}, {t: "@ногами", z: 1.1, x: 540, y: 820, ease: inout}, {t: end, z: 1.14, x: 560, y: 800}], sway: {x: 8, y: 8, roll: 0.8, freq: 0.6}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 2000, hour: 12, colors: ["#3a444e", "#5c6772", "#808c97"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1800, par: 0}
            - {actor: cloud_bank, x: -500, y: 900, w: 2100, h: 700, color: "#7a8590", shade: "#4c5660", n: 30, blur: 34, par: 0.4}
            - {actor: panel_block, x: 200, y: 2050, scale: 0.9, floors: 9, cols: 5, seed: 4, lit: 0.25, par: 0.6}
            - {actor: panel_block, x: 880, y: 2080, scale: 0.8, floors: 9, cols: 4, seed: 6, lit: 0.2, color: "#737b82", par: 0.6}
            - {actor: city_chunk, x: -200, y: -10, w: 1480, soil: 420, seed: 33, flat: true, weed: 1, drip: 1, tunnel: false}
            # Petrovich and two neighbours stand UPSIDE DOWN on the underside (y = 440); drops fly up off them
            - {actor: person, x: 230, y: 440, scale: 1.0, rot: 180, air: true, look: *n1, pose: stand, hold: torch, flicker: 0}
            - {actor: person, x: 820, y: 440, scale: 0.95, rot: 180, air: true, look: *n2, pose: {a1: [7, 4], a2: [40, 30], l1: [2, 0], l2: [2, 0]}}
            - {actor: person, id: petr, x: 540, y: 440, scale: 1.25, rot: 180, air: true, look: *petr, face: [{at: 0, v: neutral}, {at: "@сирене", v: talk}],
               pose: [{at: 0, v: stand}, {at: "@сирене", v: wave, dur: 0.3}]}
            - {actor: mark, x: 540, y: 700, w: 300, h: 420, at: "@Аркадий-0.05", enter: {type: fade, dur: 0.2}, label: "А. П. ВОРОНОВ, 70", sub: "СОСЕД · УШЁЛ НА КРЫШУ", side: bottom}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ЗУМ ×8", tc: 25508, status: "ВЕРХНИЙ ГОРОД", glitch: [{at: "@ногами-0.1", dur: 0.2}]}
      - id: p_cloud
        start: "@Облако-0.22"
        transition: {type: cut}
        ambience: [{sound: rumble, gain: -16}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, x: 540, y: 980}, {t: end, z: 1.0, x: 540, y: 960, ease: inout}]}
          layers:
            - *sky_high
            - {actor: skyline, x: 540, y: 1960, w: 2400, h: 280, color: "#6f7a84", color2: "#66717b", lit: 0, seed: 9, par: 0.1}
            - {actor: city_chunk, x: 60, y: 300, w: 960, soil: 360, seed: 33, opacity: 0.85, blur: 1, drip: 0.8, buildings: [{x: 220, floors: 9, cols: 5, cell: [56, 44], seed: 2}, {x: 640, floors: 7, cols: 4, cell: [56, 44], seed: 7}]}
            - {actor: city_chunk, x: 40, y: 1180, w: 1000, soil: 420, seed: 4, drip: 1, buildings: *home_blds}
            # the cloud base comes down onto our roofs like a ceiling
            - {actor: cloud_bank, x: -500, y: 300, w: 2100, h: 700, color: "#a7b1ba", shade: "#6c7782", n: 44, blur: 30, speed: 10,
               anim: [{at: "@опускается-0.2", dur: 6, y: 520, ease: inOutSine}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 200, v: -0.7, alpha: 0.4, seed: 7}
            - {<<: *rule, y: 1420, at: "@пять-0.05", until: "@В-0.1", kicker: "ОБЛАКО ОПУСКАЕТСЯ · ДО ДВОРА", text: "05:00", size: 120}
            - {<<: *rule, y: 1420, at: "@промокаешь-0.05", kicker: "ПРАВИЛО 03 · ПРОВЕРЕНО: ВОРОНОВ", text: "ОБЛАКО ПРОМАЧИВАЕТ ЗА МИНУТУ", danger: true, size: 78}
            - {<<: *arch, kind: drone, src: "UAV-3 · МЧС · ЗОНЫ 06–07", tc: 25516, status: "ОБЛАКО ↓"}
      - id: p_sea
        start: "@И-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 540, y: 820}, {t: end, z: 1.22, x: 540, y: 760}]}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 2000, hour: 12, colors: ["#3a444e", "#5c6772", "#808c97"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1800, par: 0}
            - {actor: cloud_bank, x: -500, y: 900, w: 2100, h: 700, color: "#7a8590", shade: "#4c5660", n: 30, blur: 34, par: 0.4}
            - {actor: city_chunk, x: -200, y: -10, w: 1480, soil: 420, seed: 33, flat: true, weed: 1, drip: 1, tunnel: false}
            - {actor: person, id: petr, x: 540, y: 440, scale: 1.25, rot: 180, air: true, look: *petr, face: talk,
               pose: [{at: 0, v: stand}, {at: "@шумит", v: {a1: [7, 4], a2: [160, 20], l1: [2, 0], l2: [2, 0]}, dur: 0.3}]}
            # the sound from above: faint arcs through the soil
            - {actor: shape, kind: path, d: "M380,330 Q540,250 700,330", fill: "none", stroke: "#dfe8ee", sw: 4, opacity: [{at: 0, v: 0}, {at: "@шумит", v: 0.6, dur: 0.3}, {at: "@море", v: 0, dur: 1.2}], pulse: {amp: 0.08, freq: 1.4}}
            - {actor: shape, kind: path, d: "M320,270 Q540,170 760,270", fill: "none", stroke: "#dfe8ee", sw: 3, opacity: [{at: 0, v: 0}, {at: "@море-0.2", v: 0.5, dur: 0.3}, {at: "end", v: 0.2, dur: 0.6}], pulse: {amp: 0.08, freq: 1.4, phase: 1.5}}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ЗУМ ×8", tc: 25532, status: "ВЕРХНИЙ ГОРОД"}
    sfx:
      - {sound: creak, at: "@двор", gain: -14}
      - {sound: drip, at: "@водоросли", gain: -12}
      - {sound: noise_sweep, at: "@ногами", gain: -12}
      - {sound: groan, at: "@опускается", gain: -10}
      - {sound: impact, at: "@промокаешь", gain: -10}
      - {sound: noise_sweep, at: "@шумит", gain: -14}

  # ------------------------------------------------------------------ 5. RULE — бельё как пламя; весы минус четыре; противовес
  - id: rule
    text: "Глеб смотрит на балконы. Бельё на верёвках не висит. Оно стоит вверх, как пламя. Мокрое тянет вверх, сухое — вниз. В лифте главное — противовес. Кухня Петровича, его весы. Глеб привязывает к ним мокрую простыню. Минус четыре килограмма. Кабина с ними весит четыреста. Сто простыней — и она ничего не весит. Девяносто девять — плавно идёт вниз."
    lines:
      - {who: gleb, say: "В лифте главное — противовес."}
    caption_marks: {"минус четыре": "#f2f4f6", "противовес": "#f2f4f6"}
    shots:
      - id: r_laundry
        transition: {type: cut}
        ambience: [{sound: wind, gain: -16}]
        draw:
          world: [1080, 2600]
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1600}, {t: end, z: 1.04, x: 540, y: 1000, ease: inout}], sway: {x: 5, y: 5, roll: 0.4, freq: 0.5}}
          layers:
            - {actor: laundry_facade, x: 0, y: 0, w: 1080, h: 2600, rows: 6, cols: 3, seed: 6, up: [{at: 0, v: 0.85}, {at: "@стоит", v: 1, dur: 0.6}]}
            - {<<: *rule, y: 640, at: "@Мокрое-0.05", until: "@В-0.15", kicker: "ПРАВИЛО 01 · ЧАСТЬ 1", text: "МОКРОЕ ↑ · СУХОЕ ↓", size: 96}
            - {<<: *arch, kind: helmet, src: "НАШЛЕМНАЯ КАМЕРА · ЛИФТЁР П-2", tc: 25560, status: "ВЕРХНИЙ ГОРОД"}
      - id: r_idea
        start: "@В-0.22"
        transition: {type: glitch, dur: 0.2}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.05, x: 520, y: 940}]}
          layers:
            - {actor: lift_scheme, x: 0, y: 0, mode: lift, title: "ДОК. 08-01 · ЛИФТ: КАБИНА И ПРОТИВОВЕС", morph: [{at: 0, v: 0}, {at: "@противовес", v: 1, dur: 0.9, ease: inOutSine}]}
            - {<<: *arch, kind: doc, src: "ДОК. 08-01 · ЧЕРТЁЖ ЛИФТЁРА", tc: 25574, status: "ВЕРХНИЙ ГОРОД"}
      - id: r_scale
        start: "@Кухня-0.22"
        transition: {type: dip, dur: 0.25}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: end, z: 1.1, x: 540, y: 1120}], sway: {x: 8, y: 8, roll: 0.6, freq: 0.6}}
          layers:
            - {actor: kitchen, x: 0, y: 0, floor_y: 1420}
            - {actor: bath_scale, id: scale, x: 600, y: 1470, w: 560, kg: [{at: 0, v: 0}, {at: "@Минус-0.4", v: -4, dur: 0.5, ease: out}], alarm: [{at: 0, v: 0}, {at: "@Минус", v: 1}]}
            - {actor: sheet, x: 600, y: 1290, scale: 0.9, cord: 300, len: 420, w: 230, at: "@привязывает-0.1", enter: {type: rise, dur: 0.5}, up: [{at: 0, v: 0.3}, {at: "@мокрую", v: 1, dur: 0.6}]}
            - {actor: person, id: gleb, x: 260, y: 1460, scale: 1.5, look: *gleb, face: determined, pose: [{at: 0, v: stand}, {at: "@привязывает", v: {a1: [60, 30], a2: [40, 60], l1: [20, 30], l2: [-10, 30], lean: 12}, dur: 0.3}]}
            - {<<: *rule, y: 520, at: "@Минус-0.05", kicker: "ПРАВИЛО 04 · ПРОВЕРЕНО НА ВЕСАХ", text: "1 ПРОСТЫНЯ = −4 КГ", size: 104}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · КВ. 1", tc: 25600, status: "ВЕРХНИЙ ГОРОД"}
      - id: r_math
        start: "@Кабина-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.04, x: 540, y: 1000}]}
          layers:
            - {actor: lift_scheme, x: 0, y: 0, mode: rig, n: [{at: 0, v: 0}, {at: "@Сто-0.1", v: 100, dur: 1.6, ease: inOutSine}, {at: "@Девяносто-0.1", v: 99, dur: 0.1}]}
            - {<<: *arch, kind: doc, src: "ДОК. 08-02 · ЛИФТ БЕЗ ШАХТЫ", tc: 25610, status: "ВЕРХНИЙ ГОРОД"}
    sfx:
      - {sound: whoosh, at: "@стоит", gain: -14}
      - {sound: click, at: "@противовес", gain: -12}
      - {sound: creak, at: "@привязывает", gain: -14}
      - {sound: blip, at: "@Минус", gain: -10}
      - {sound: chime, at: "@Сто", gain: -12}
      - {sound: whoosh, at: "@Девяносто", gain: -14}

  # ------------------------------------------------------------------ 6. DILEMMA — бельё со всех балконов; наверх или вниз
  - id: dilemma
    text: "Они срезают бельё со всех балконов. Сто простыней над кабиной рвутся в небо. Петрович, к нам! Я мокрый, Глеб. Я вас только подниму. Поднимайтесь вы. Здесь живут. Вверх ногами, но живут. Отсюда мне не дозвониться. А внизу Соня. Такая же. Пап, там я? Там не ты."
    lines:
      - {who: gleb, say: "Петрович, к нам!"}
      - {who: petrovich, say: "Я мокрый, Глеб. Я вас только подниму."}
      - {who: petrovich, say: "Поднимайтесь вы. Здесь живут. Вверх ногами, но живут."}
      - {who: gleb, say: "Отсюда мне не дозвониться. А внизу Соня. Такая же."}
      - {who: sonya, say: "Пап, там я?"}
      - {who: gleb, say: "Там не ты."}
    shots:
      - id: d_cut
        transition: {type: cut}
        ambience: [{sound: wind, gain: -15}]
        draw:
          camera: {keys: [{t: 0, z: 1.06, x: 560, y: 1160}, {t: "@Сто", z: 1.0, x: 560, y: 900, ease: inout}, {t: end, z: 1.0, x: 560, y: 860}], shakes: [{at: "@небо", amp: 10, dur: 0.4, freq: 5}]}
          layers:
            - *sky_high
            - {actor: cloud_bank, x: -500, y: -150, w: 2100, h: 600, color: "#a7b1ba", shade: "#6c7782", n: 40, blur: 30, speed: 10, par: 0.1}
            - {actor: skyline, x: 540, y: 1950, w: 2400, h: 280, color: "#6f7a84", color2: "#66717b", lit: 0, seed: 9, par: 0.1}
            - {actor: cloud_bank, x: -500, y: 1500, w: 2100, h: 500, color: "#8b96a1", shade: "#5a656f", n: 26, blur: 30, par: 0.2}
            - {actor: panel_block, x: 160, y: 1460, scale: 0.95, floors: 9, cols: 4, cell: [96, 78], seed: 4, lit: 0.25, stains: 0.6}
            - {actor: wet_ground, x: -400, y: 1440, w: 1300, h: 600}
            # the torn edge of our block: asphalt ends, soil below
            - {actor: shape, kind: path, d: "M860,1440 L1500,1440 L1500,2100 L940,2100 L900,1800 Z", fill: "#2a2622"}
            - {actor: sheet_rig, id: rig, x: 620, y: 1460, scale: 0.92, n: [{at: 0, v: 8}, {at: "@срезают", v: 60, dur: 2.2}, {at: "@Сто-0.2", v: 100, dur: 1.0}],
               anim: [{at: "@небо-0.1", dur: 0.4, y: 1430, ease: out}, {at: "@небо+0.3", dur: 0.6, y: 1450, ease: inOutSine}]}
            - {actor: person, id: gleb, x: 380, y: 1470, scale: 1.0, look: *gleb, face: determined, pose: [{at: 0, v: {a1: [150, 10], a2: [7, 4], l1: [2, 0], l2: [2, 0]}}, {at: "@Сто", v: hold, dur: 0.3}]}
            - {actor: person, id: sonya, x: 300, y: 1470, scale: 0.8, look: *sonya, face: neutral, pose: {a1: [120, 30], a2: [7, 4], l1: [2, 0], l2: [2, 0]}}
            - {actor: sheet, x: 300, y: 1340, scale: 0.6, cord: 120, len: 300, w: 160, seed: 5, at: "@срезают", until: "@Сто", exit: {type: fly_up, dur: 0.6}}
            - {actor: rain, x: 0, y: 0, space: screen, count: 200, v: -0.7, alpha: 0.4, seed: 9}
            - {actor: mark, x: 620, y: 860, w: 560, h: 520, at: "@Сто-0.05", until: "@Петрович", exit: fade, enter: {type: fade, dur: 0.2}, label: "100 ПРОСТЫНЕЙ", sub: "КАБИНА П-2 · 400 КГ", side: top}
            - {<<: *arch, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ВИДЕО", tc: 25780, status: "ОБЛАКО 01:40"}
      - id: d_argue
        start: "@Петрович-0.22"
        transition: {type: cut}
        captions_top: 1640
        draw:
          world: [1080, 2700]
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1800}, {t: "@мокрый-0.2", z: 1.0, x: 540, y: 900, ease: inout}, {t: "@живут#2", z: 1.0, x: 540, y: 960}, {t: end, z: 1.0, x: 540, y: 1700, ease: inout}], sway: {x: 6, y: 6, roll: 0.5, freq: 0.5}}
          layers:

  # ------------------------------------------------------------------ 8. FINALE
  - id: finale
    accent: "255,74,122"
    text: "Хочешь учиться в такой школе? Пиши в комментариях: да или нет!"
    cues: {cta: "@Пиши"}
    shots:
      - id: f_night
        transition: {type: dissolve, dur: 0.6}
        look: {bloom: [0.7, 0.32, [1, 0.9, 0.75]], grade: {contrast: 0.06, sat: 1.06}}
        ambience: [{sound: wind, gain: -26}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, y: 900}, {t: end, z: 1.0, y: 960}]}
          layers:
            - {actor: sky, hour: 21, par: 0, stars: 180, moon: [860, 760]}
            - {actor: school, x: 540, y: 1190, scale: 0.92, plaque: "第一中学校", time: 21, lit: 0.12, par: 0.7}
            - {actor: ground, x: -300, y: 1186, w: 1700, h: 800, color: ["#3d3a52", "#2a283a"]}
            - {actor: tree, kind: sakura, h: 520, x: 60, y: 1330, color: "#d98aa6", par: 1.1}
            - {actor: tree, kind: sakura, h: 480, x: 1030, y: 1360, color: "#d98aa6", seed: 3, par: 1.1}
            - {actor: person, x: 330, y: 1720, scale: 1.05, look: {outfit: sailor, hair: long}, pose: wave, face: happy, enter: rise, at: "@start+0.2"}
            - {actor: person, x: 750, y: 1730, scale: 1.05, look: {outfit: gakuran, hair: spiky}, pose: [{at: 0, v: stand}, {at: "@да", v: cheer, dur: 0.3}], face: smile, enter: rise, at: "@start+0.35"}
            - {actor: particles, kind: petals, region: [0, 0, 1080, 1920], count: 24, colors: ["#ffc6d3", "#ffe0e8"], alpha: 0.85}
    hud:
      - {component: text, at: "@Хочешь-0.1", until: "@Пиши-0.1", text: "ХОЧЕШЬ В ТАКУЮ\n**ШКОЛУ?**", size: 76, width: 940, x: 540, y: 330, align: center top, text_align: center, enter: pop}
      - component: choices
        at: "@Пиши-0.15"

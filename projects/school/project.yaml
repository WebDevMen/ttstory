  # ------------------------------------------------------------------ 5. LUNCH
  - id: lunch
    accent: "242,164,58"
    text: Обед. Столовой нет — еду привозят прямо в класс, и раздают её сами ученики в белых халатах. Есть начинают только после слова «итадакимас».
    shots:
      - id: l_cart
        transition: {type: whip_x, flash: 0.1}
        captions_top: 1400
        effects:
          - {type: particles, mode: smoke, center: [560, 860], count: 22, size: [24, 80], rise: 380, drift: 30, spread: 120, life: [2.0, 3.2], depth: 0.6, color: [1, 1, 1], alpha: 0.12, from: "@привозят+0.6"}
        look: {bloom: [0.85, 0.12], grade: {contrast: 0.06, sat: 1.06}}
        ambience: [{sound: room, gain: -17}]
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.07}]}
          layers:
            - {actor: room, floor_y: 1050, wall: "#f3e9d8", floor: "#c98f5c", windows: [{x: 90, y: 300, w: 300, h: 400}, {x: 690, y: 300, w: 300, h: 400}]}
            - {actor: badge, x: 540, y: 560, at: "@Столовой-0.05", enter: stamp, style: solid, color: "#ff3b4e", icon: x, title: "СТОЛОВОЙ НЕТ", size: 44, sfx: {sound: kick, gain: -13}}
            - actor: group
              x: 1500
              y: 1090
              anim: [{at: "@привозят-0.3", dur: 1.4, x: 560, ease: outCubic}]
              children:
                - {actor: prop, kind: cart, x: 0, y: 130}
                - {actor: prop, kind: pot, x: -100, y: -88, scale: 0.8}
                - {actor: prop, kind: pot, x: 105, y: -88, scale: 0.7, color: "#d4c39a"}
                - {actor: prop, kind: milk, x: -110, y: 82, scale: 0.6}
                - {actor: prop, kind: milk, x: -60, y: 82, scale: 0.6}
                - {actor: prop, kind: milk, x: -10, y: 82, scale: 0.6}
            - {actor: text, text: "給食 · КЮСЁКУ", x: 540, y: 760, size: 46, font: round, color: "#ffffff", bg: {color: "#f2a43a", pad: "8px 24px", radius: 14}, at: "@класс", enter: pop, sfx: true}
      - id: l_serve
        start: "@раздают-0.12"
        transition: {type: whip_x, flash: 0.1}
        look: {bloom: [0.85, 0.12], grade: {contrast: 0.06, sat: 1.06}}
        ambience: [{sound: room, gain: -17}]
        draw:
          camera: {keys: [{t: 0, z: 1.08, y: 1000}, {t: end, z: 1.0, y: 960}]}
          layers:
            - {actor: room, floor_y: 1080, wall: "#f3e9d8", floor: "#c98f5c", board: {x: 80, y: 330, w: 280, h: 200}, clock: {x: 900, y: 330, r: 62, time: 12.5}}
            - {actor: person, id: srv1, x: 270, y: 1130, look: {outfit: kyushoku, hair: bob}, pose: hold, face: smile, seed: 3}
            - {actor: person, id: srv2, x: 540, y: 1130, look: {outfit: kyushoku, hair: short}, pose: hold, face: happy, seed: 8}
            - {actor: person, id: srv3, x: 810, y: 1130, look: {outfit: kyushoku, hair: ponytail}, pose: hold, face: smile, seed: 5}
            - {actor: shape, kind: rect, x: 60, y: 1010, w: 960, h: 34, radius: 8, fill: "#9aa3b5", origin: top-left}
            - {actor: shape, kind: rect, x: 80, y: 1044, w: 920, h: 150, radius: 6, fill: "#c7ccd6", origin: top-left}
            - {actor: prop, kind: pot, x: 270, y: 1020, scale: 0.75}
            - {actor: prop, kind: pot, x: 540, y: 1020, scale: 0.75, color: "#d4c39a"}
            - {actor: prop, kind: bento, x: 810, y: 1020, scale: 0.9, color: "#3a6fd8"}
            - {actor: callout, x: 540, y: 470, at: "@белых-0.1", enter: pop, target: "srv2.top", title: "ДЕЖУРНЫЕ", sub: "給食当番 · В БЕЛЫХ ХАЛАТАХ", icon: "🍚", color: "#f2a43a", size: 46, sfx: {sound: blip, gain: -18, f: 1400}}
      - id: l_tray
        start: "@Есть-0.12"
        transition: {type: whip_x, flash: 0.1}
        effects:
          - {type: particles, mode: smoke, center: [690, 690], count: 14, size: [20, 60], rise: 300, drift: 20, spread: 60, life: [2.0, 3.0], depth: 0.6, color: [1, 1, 1], alpha: 0.1}
        look: {bloom: [0.85, 0.12], grade: {contrast: 0.06, sat: 1.06}}
        ambience: [{sound: room, gain: -17}]
        draw:
          bg: {type: radial, at: "50% 40%", stops: [[0, "#fff6e8"], [1, "#efd9b8"]]}
          camera: {keys: [{t: 0, z: 1.0, roll: -1}, {t: end, z: 1.08, roll: 1}]}
          layers:

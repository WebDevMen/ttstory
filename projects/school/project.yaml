    caption_marks: {"не нужны": "47,191,113"}
    captions_top: 1330
    text: После уроков — о-содзи, уборка. Ученики сами моют полы, окна и даже туалеты. Вот почему уборщики не нужны.
    shots:
      - id: c_floor
        transition: {type: whip_x, flash: 0.1}
        look: {bloom: [0.85, 0.12], grade: {contrast: 0.06, sat: 1.06}}
        ambience: [{sound: room, gain: -17}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540}, {t: end, z: 1.05, x: 520}]}
          layers:
            - {actor: room, floor_y: 900, wall: "#eef0e6", floor: "#c98f5c", windows: [{x: 600, y: 300, w: 380, h: 420}]}
            - {actor: desk, part: desk, x: 120, y: 900, scale: 0.6}
            - {actor: desk, part: desk, x: 260, y: 900, scale: 0.6}
            - {actor: desk, part: desk, x: 400, y: 900, scale: 0.6}
            - {actor: person, x: 790, y: 905, scale: 0.85, at: "@окна-0.3", enter: rise, look: {outfit: pe, hair: bob}, pose: {a1: [10, 6], a2: [150, -40], l1: [2, 0], l2: [2, 0]}, wave_hand: true, hold: rag, hold_rot: 180, face: happy, seed: 2}
            - {actor: checklist, x: 60, y: 310, width: 520, size: 52, color: "#2fbf71", ink: "#1d2347", shadow: false, show_at: "@Ученики-0.2", items: [{text: "ПОЛЫ", at: "@полы"}, {text: "ОКНА", at: "@окна"}, {text: "ТУАЛЕТЫ", at: "@туалеты"}], sfx: {sound: pop, gain: -18}}
            - {actor: person, view: side, flip: true, x: 1250, y: 1210, look: {outfit: pe, hair: short}, pose: wipe, run: true, walk: 2.6, hold: rag, seed: 1, anim: [{at: "@start+0.2", dur: 2.6, x: -260, ease: linear}, {at: "@моют", dur: 0.01, x: 1300}, {at: "@моют+0.01", dur: 2.6, x: -260, ease: linear}], sfx: {sound: whoosh, gain: -20, d: 0.6}}
            - {actor: person, view: side, flip: true, x: 1450, y: 1235, look: {outfit: pe, hair: twintails}, pose: wipe, run: true, walk: 2.6, hold: rag, seed: 6, anim: [{at: "@start+0.2", dur: 2.6, x: -60, ease: linear}, {at: "@моют+0.4", dur: 0.01, x: 1500}, {at: "@моют+0.41", dur: 2.6, x: -60, ease: linear}]}
            - {actor: person, view: side, flip: true, x: 1650, y: 1260, look: {outfit: pe, hair: spiky}, pose: wipe, run: true, walk: 2.6, hold: rag, seed: 9, anim: [{at: "@start+0.2", dur: 2.6, x: 140, ease: linear}, {at: "@моют+0.8", dur: 0.01, x: 1700}, {at: "@моют+0.81", dur: 2.6, x: 140, ease: linear}]}
            - {actor: particles, kind: sparkles, region: [80, 1080, 1000, 1280], count: 14, at: "@полы"}
            - {actor: meter, x: 300, y: 690, w: 470, label: "ЧИСТОТА", color: "#2fbf71", size: 30, ink: dark, value: [{at: 0, v: 12}, {at: "@полы", v: 45, dur: 0.6}, {at: "@окна", v: 75, dur: 0.6}, {at: "@туалеты", v: 100, dur: 0.6}]}
      - id: c_done
        start: "@Вот-0.12"
        transition: {type: whip_x, flash: 0.1}
        look: {bloom: [0.85, 0.15], grade: {contrast: 0.06, sat: 1.08}}
        ambience: [{sound: birds, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.06}, {t: end, z: 1.0}]}
          layers:
            - {actor: sky, hour: 15.3, par: 0}
            - {actor: school, x: 540, y: 1190, scale: 0.92, time: 15.25, plaque: "第一中学校"}
            - {actor: ground, x: -300, y: 1186, w: 1700, h: 800, color: ["#e2cfa6", "#cdb386"]}
            - {actor: particles, kind: sparkles, region: [80, 700, 1000, 1180], count: 18, at: "@start"}
            - <<: *nojanitor
              x: 540
              y: 470
              at: "@Вот"
              enter: pop
              sfx: {sound: pop, gain: -14}
            - {actor: badge, x: 540, y: 735, at: "@не-0.05", enter: stamp, style: solid, color: "#2fbf71", icon: check, title: "НЕ НУЖНЫ", size: 50, sfx: {sound: chime, gain: -14, freqs: [988, 1319, 1760]}}

            - {actor: text, text: "いただきます！", x: 540, y: 1150, size: 96, font: round, color: "#e8333f", stroke: {w: 14, color: "#ffffff"}, at: "@итадакимас-0.05", enter: stamp, enter_dur: 0.35, shadow: true, sfx: {sound: chime, gain: -14, freqs: [784, 988, 1175]}}
            - {actor: image, emoji: "🙏", x: 540, y: 340, size: 130, at: "@итадакимас+0.15", enter: pop, bob: {amp: 6, freq: 1.2}}
            - {actor: particles, kind: sparkles, region: [150, 300, 930, 1100], count: 10, at: "@итадакимас+0.1"}

      - id: b_cards
        transition: {type: whip_x, flash: 0.1}
        look: {bloom: [0.8, 0.18, [1, 0.9, 0.8]], grade: {contrast: 0.06, sat: 1.08}}
        ambience: [{sound: birds, gain: -20}, {sound: wind, gain: -24}]
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.04}]}
          layers:
            - {actor: sky, hour: 16.8, par: 0}
            - {actor: school, x: 540, y: 1330, scale: 0.62, time: 16.5, par: 0.5}
            - {actor: ground, x: -300, y: 1328, w: 1700, h: 800, color: ["#dcb98a", "#c49f6f"]}

            - {actor: school, x: 540, y: 1190, scale: 0.92, plaque: "第一中学校", time: [{at: "@start", v: 17.0}, {at: "@start+0.2", v: 19.0, dur: 2.4, ease: linear}], lit: [{at: "@start", v: 0}, {at: "@start+1.4", v: 0.55, dur: 1.0}]}
            - {actor: ground, x: -300, y: 1186, w: 1700, h: 800, color: ["#9a7f6a", "#6d5a52"]}
            - {actor: streetlight, x: 140, y: 1400, on: [{at: "@start", v: 0}, {at: "@приходят", v: 1, dur: 0.2}]}
            - {actor: streetlight, x: 940, y: 1400, flip: true, on: [{at: "@start", v: 0}, {at: "@приходят+0.15", v: 1, dur: 0.2}]}

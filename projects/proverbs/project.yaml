      - {sound: riser, at: "@решать", gain: -16}
      - {sound: click, at: "@семьдесят", gain: -10}
      - {sound: slam, at: "@процентов", gain: -11}

  # ------------------------------------------------------------------ 5. TWIST — пословицы спорят
  - id: twist
    accent: "255,211,77"
    caption_marks: {"не законы": "255,211,77"}
    text: "И главное: пословицы спорят сами с собой. «Тише едешь — дальше будешь». Но «куй железо, пока горячо». Это не законы, а советы под ситуацию."
    shots:
      - id: t_vs
        transition: {type: glitch, dur: 0.25}
        effects:
          - {type: glow, at: [540, 820], sigma: 260, color: [1.0, 0.85, 0.3], intensity: 0.1, from: "@спорят", fade_in: 0.2}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.12}}
        draw:
          bg: *dusk_bg
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}], shakes: [{at: "@куй", amp: 12, dur: 0.3}]}
          layers:
            - *stars
            - {actor: text, text: "ПОСЛОВИЦЫ СПОРЯТ", x: 540, y: 300, size: 84, width: 980, weight: 900, color: "#ffffff", stroke: {w: 8, color: "#08060f"}, space: screen, at: "@главное", enter: rise}
            - {actor: text, text: "VS", x: 540, y: 830, size: 150, weight: 900, color: gold, stroke: {w: 10, color: "#08060f"}, shadow: "0 0 40px rgba(255,211,77,.8)", at: "@спорят-0.05", enter: stamp, pulse: {amp: 0.05, freq: 1.4}}
            - {actor: plank, text: "ТИШЕ ЕДЕШЬ —\nДАЛЬШЕ БУДЕШЬ", x: 540, y: 600, w: 760, h: 190, real: false, rot: -3, at: "@Тише-0.15", enter: {type: fly_left, dur: 0.35}}
            - {actor: snail, x: 210, y: 850, w: 240, at: "@Тише+0.2", enter: slide_right}
            - {actor: plank, text: "КУЙ ЖЕЛЕЗО,\nПОКА ГОРЯЧО", x: 540, y: 1060, w: 760, h: 190, real: false, rot: 3, at: "@куй-0.15", enter: {type: fly_right, dur: 0.3}}
            - {actor: anvil, x: 800, y: 1500, w: 360, strikes: ["@куй", "@железо", "@горячо"], at: "@куй-0.25", enter: pop}
            - {actor: particles, kind: embers, region: [660, 1120, 1000, 1360], count: 30, colors: ["#ffb02e", "#ff6a2e"], at: "@куй", enter: fade}
      - id: t_rule
        start: "@законы-0.2"
        transition: {type: zoom, dur: 0.3}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.12}}
        draw:
          bg: *dusk_bg
          camera: {keys: [{t: 0, z: 1.06}, {t: end, z: 1.0}], shakes: [{at: "@законы", amp: 12, dur: 0.3}]}
          layers:
            - *stars
            - {actor: toolbox, part: back, x: 540, y: 1260, w: 760, h: 300}
            - {actor: plank, text: "ВЫШЕ ГОЛОВЫ…", x: 540, y: 880, w: 560, h: 110, real: false, rot: -4, at: "@советы-0.2", enter: {type: drop, dur: 0.3}}
            - {actor: plank, text: "ЗА ДВУМЯ ЗАЙЦАМИ…", x: 540, y: 980, w: 560, h: 110, real: false, rot: 3, at: "@советы-0.05", enter: {type: drop, dur: 0.3}}
            - {actor: plank, text: "СЕМЬ РАЗ ОТМЕРЬ…", x: 540, y: 1080, w: 560, h: 110, real: false, rot: -2, at: "@советы+0.1", enter: {type: drop, dur: 0.3}}
            - {actor: toolbox, part: front, x: 540, y: 1260, w: 760, h: 300}
            - {actor: text, text: "СОВЕТЫ ПОД СИТУАЦИЮ", x: 540, y: 1286, size: 44, width: 560, weight: 900, color: paper, at: "@ситуацию-0.05", enter: pop}
            - {actor: text, text: "НЕ ЗАКОНЫ", x: 540, y: 470, size: 128, width: 1040, weight: 900, color: gold, stroke: {w: 12, color: "#08060f"}, shadow: "0 0 40px rgba(255,211,77,.7)", rot: -5, space: screen, at: "@законы-0.05", enter: stamp}
    sfx:
      - {sound: whoosh, at: "@главное", gain: -16}
      - {sound: glitch, at: "@спорят", gain: -14}
      - {sound: whoosh, at: "@Тише-0.1", gain: -13}
      - {sound: metal_ring, at: "@куй", gain: -12}
      - {sound: slam, at: "@законы", gain: -11}
      - {sound: impact, at: "@советы", gain: -15}
      - {sound: chime, at: "@ситуацию", gain: -15}

  # ------------------------------------------------------------------ 6. PAYOFF — сожаления
  - id: regret
    accent: "255,211,77"
    caption_marks: {"не попробовали": "255,211,77"}
    text: "И вот что важно. Психологи выяснили: с годами люди жалеют не об ошибках. Они жалеют о том, чего так и не попробовали."
    shots:
      - id: r_bench
        transition: {type: dissolve, dur: 0.35}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.08, warmth: 0.05}}
        ambience: [{sound: birds, gain: -28}]
        draw:
          bg: "#1a1130"
          px_per_m: 340
          floor: 1300
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.06, y: 900}]}
          layers:
            - {actor: sky, hour: [{at: 0, v: 18.2}, {at: end, v: 19.6}], par: 0}
            - {actor: tree, kind: round, x: 900, y: 1300, h: 760, par: 0.6, brightness: 0.6}
            - {actor: ground, x: -300, y: 1296, w: 1700, h: 600, color: ["#3b4a3a", "#1c241c"]}
            - {actor: bench, x: 520, y: 1300, w: 600, seat: 120, real: false}
            - actor: person
              x: 520
              y: 1385
              air: true
              look: {age: adult, outfit: casual, hair: short, hair_color: "#d9d9d9", color: "#7a6a5a", bottom_color: "#3a3f4e", glasses: true}
              pose: [{at: 0, v: sit}, {at: "@годами", v: {a1: [16, 95], a2: [12, 70], l1: [4, 0], l2: [4, 0], sit: 1, tilt: 6}, dur: 0.5}]
              face: [{at: 0, v: neutral}, {at: "@жалеют", v: sad}]
            - {actor: bubble, x: 640, y: 700, side: right, text: "А ЕСЛИ БЫ…", size: 42, color: paper, ink: ink, at: "@жалеют-0.05", enter: pop}
            - {actor: bubble, x: 420, y: 520, side: left, text: "А ЕСЛИ БЫ…", size: 42, color: paper, ink: ink, at: "@жалеют+0.3", enter: pop}
            - {actor: timetag, text: "СПУСТЯ ГОДЫ", x: 540, y: 220, size: 36, color: gold, space: screen, at: "@годами-0.05", enter: fade}
      - id: r_bars
        start: "@ошибках-0.2"
        transition: {type: zoom, dur: 0.3}
        effects:
          - {type: glow, at: [700, 800], sigma: 320, color: [1.0, 0.85, 0.3], intensity: 0.12, from: "@попробовали", fade_in: 0.3}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.1}}
        draw:
          bg: *dusk_bg
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05, y: 930}]}
          layers:
            - *stars
            - {actor: text, text: "О ЧЁМ ЖАЛЕЮТ СПУСТЯ ГОДЫ", x: 540, y: 300, size: 60, width: 960, weight: 900, color: "#ffffff", space: screen, at: 0, enter: rise}
            - {actor: chart, type: bar, x: 540, y: 820, w: 820, h: 700, size: 38, values: false, max: 110, data: [{label: "О СДЕЛАННОМ", value: 40, color: dim}, {label: "О НЕСДЕЛАННОМ", value: 100, color: gold}], grow: {at: "@ошибках", dur: 0.7, stagger: 2.6}}
            - {actor: text, text: "ПОПРОБУЙ", x: 330, y: 650, size: 78, weight: 900, color: lime, stroke: {w: 10, color: "#08060f"}, shadow: "0 0 34px rgba(198,255,61,.7)", rot: -6, at: "@попробовали+0.15", enter: stamp}
            - {actor: text, text: "Gilovich, Medvec · 1995", x: 540, y: 1340, size: 30, font: mono, color: dim, at: 0.1, enter: fade}
    sfx:
      - {sound: chime, at: "@важно", gain: -16}
      - {sound: chime, at: "@годами", gain: -17}
      - {sound: pop, at: "@жалеют", gain: -15}
      - {sound: pop, at: "@жалеют+0.3", gain: -15}
      - {sound: blip, at: "@ошибках", gain: -15}
      - {sound: kick, at: "@попробовали", gain: -11}
      - {sound: slam, at: "@попробовали+0.15", gain: -15}

  # ------------------------------------------------------------------ 7. CTA — доски разлетаются
  - id: cta
    accent: "255,211,77"
    text: "Какая пословица тормозила тебя? Напиши её в комментарии — разберём её в следующем видео."
    shots:
      - id: c_free
        transition: {type: whip_x, flash: 0.08}
        effects:
          - {type: glow, at: [540, 800], sigma: 460, color: [1.0, 0.8, 0.35], intensity: 0.08}
          - {type: glow, at: [540, 800], sigma: 460, color: [1.0, 0.85, 0.4], intensity: 0.14, from: "@Напиши", fade_in: 0.4}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.1, warmth: 0.04}}
        ambience: [{sound: room, gain: -22}]
        draw:
          bg: *night_bg
          px_per_m: 380
          floor: 1440
          camera: {keys: [{t: 0, z: 1.04, y: 940}, {t: "@Напиши", z: 1.0, y: 960, ease: out}, {t: end, z: 1.04, y: 950}], shakes: [{at: "@Напиши", amp: 14, dur: 0.35}]}
          layers:
            - *stars
            - *floor
            - *floorline
            - <<: *hero
              pose: [{at: 0, v: {a1: [150, -30], a2: [150, -30], l1: [4, 0], l2: [4, 0], tilt: -4}}, {at: "@Напиши+0.1", v: cheer, dur: 0.35}]
              face: [{at: 0, v: determined}, {at: "@Напиши+0.1", v: happy}]
            - {actor: plank, text: "ВЫШЕ ГОЛОВЫ НЕ ПРЫГНЕШЬ", x: 540, y: 685, w: 640, h: 120, real: false, crack: [{at: 0, v: 0}, {at: "@тормозила", v: 1, dur: 0.3}], split: [{at: 0, v: 0}, {at: "@Напиши+0.05", v: 1, dur: 0.7, ease: in}]}
            - {actor: plank, text: "ЗА ДВУМЯ ЗАЙЦАМИ…", x: 540, y: 560, w: 640, h: 120, real: false, rot: 2, crack: [{at: 0, v: 0}, {at: "@тормозила+0.2", v: 1, dur: 0.3}], split: [{at: 0, v: 0}, {at: "@Напиши", v: 1, dur: 0.7, ease: in}]}
            - {actor: plank, text: "СЕМЬ РАЗ ОТМЕРЬ…", x: 540, y: 435, w: 640, h: 120, real: false, rot: -2, crack: [{at: 0, v: 0}, {at: "@тебя", v: 1, dur: 0.3}], split: [{at: 0, v: 0}, {at: "@Напиши-0.05", v: 1, dur: 0.7, ease: in}]}
            - {actor: particles, kind: sparkles, region: [140, 420, 940, 1200], count: 30, colors: ["#ffd34d", "#c6ff3d", "#ffffff"], at: "@Напиши+0.2", enter: fade}
            - {actor: text, text: "КАКАЯ ТОРМОЗИЛА ТЕБЯ?", x: 540, y: 230, size: 80, width: 980, lines: 2, weight: 900, color: gold, stroke: {w: 10, color: "#06081a"}, shadow: "0 0 30px rgba(255,211,77,.6)", space: screen, at: 0.05, enter: rise}
            - {actor: badge, x: 540, y: 470, icon: "💬", title: "НАПИШИ В КОММЕНТАРИЯХ", style: solid, color: gold, size: 50, space: screen, at: "@Напиши+0.4", enter: pop}
            - {actor: badge, x: 540, title: "СЛЕДУЮЩАЯ — ТВОЯ", style: outline, color: lime, size: 46, space: screen, y: 590, at: "@следующем-0.05", enter: pop}
    sfx:
      - {sound: creak, at: "@тормозила", gain: -14}
      - {sound: creak, at: "@тебя", gain: -15}
      - {sound: boom, at: "@Напиши", gain: -11}
      - {sound: pop, at: "@Напиши+0.4", gain: -15}
      - {sound: sparkle, at: "@разберём", gain: -15}
      - {sound: pop, at: "@следующем", gain: -15}

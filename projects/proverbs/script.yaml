production:
  theme: {preset: minimal, accent: "#ffd34d", captions: clean}
  palette: ["#121735 ночная синь", "#f3e6c8 доска-пословица", "#c8323f народный красный орнамент", "#ffd34d золото", "#c6ff3d «можно» — опровержение", "#ff4b3e минус"]
  music: {key: E, mode: minor, bpm: 100}
  assets:
    - "Новые актёры проекта: plank (доска-пословица с орнаментом, треском и разломом), hare (бегущий заяц), tape (портновская рулетка), scissors (ножницы с открытием/щелчком)"
  notes:
    - "Цвет: тяжёлая ночная синь и кремовые доски → вспышки салатового на опровержениях → тёплое золото в финале"
    - "Сквозной образ — доски-пословицы: падают на человека в хуке, трескаются на каждом опровержении, разлетаются в финале"

review:
  scores: {hook: 8, clarity: 9, pacing: 8, novelty: 8, emotion: 8, payoff: 8, visuals: 8, cta: 9, platform: 8, accuracy: 8}
  weak_points:
    - "Исследование «гибридных» предпринимателей — американские данные и связь, а не причина; в голосе «учёные посчитали»."
    - "Рекорд Хольма — результат профессионала; кто-то возразит «он спортсмен» — это повод для комментариев, а смысл в том, что «потолок» из пословицы не закон природы."
    - "Сожаления о бездействии: эффект подтверждён репликацией 2022 года, но слабее исходного — поэтому без процентов."
  improvements:
    - "Отказались от «полных версий» пословиц: многие из них — сетевые выдумки."
    - "Добавили нюанс «советы под ситуацию»: ролик не высмеивает народную мудрость и честен про необратимые решения."
    - "Сквозной образ досок даёт петлю: в начале давят, в конце разлетаются."

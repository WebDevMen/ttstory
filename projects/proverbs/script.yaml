# СЦЕНАРИЙ: Пословицы, которые тормозят — «выше головы не прыгнешь», «за двумя зайцами», «семь раз отмерь»
# Skill write-script. Проверка: python3 vg.py script check proverbs [--tts] · документ: python3 vg.py script render proverbs
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово.end", "@слово+0.3",
# "@start"/"@end" блока, "@другой_блок/слово" или число = секунды от начала блока.

version: 1

meta:
  title: "Пословицы-тормоза"
  topic: "Пословицы, которые тормозят: «выше головы не прыгнешь», «за двумя зайцами», «семь раз отмерь» — когда народная мудрость мешает действовать"
  wishes: "Донести, что привычные выражения могут заставить опустить руки и усомниться в себе; они не законы и не всегда полезны"
  language: ru
  platforms: [tiktok, reels, shorts]
  primary_platform: tiktok
  duration: 60
  format: listicle
  style: motion
  voice: {voice: ru-RU-DmitryNeural, rate: "+18%", pitch: "+0Hz"}
  status: checked

brief:
  goal: "Показать на трёх знакомых пословицах и проверяемых фактах, что «народная мудрость» — не приговор: она бывает верной в одной ситуации и вредной в другой; вызвать комментарии с «своей» пословицей."
  kpi: [completion, comments, shares, saves, follows]
  audience:
    who: "Люди 18–35, которые хотят что-то начать (дело, спорт, учёбу, переезд), но сомневаются, — и слышат от близких «выше головы не прыгнешь»"
    age: "18–35"
    interests: [саморазвитие, психология, мотивация, карьера, своё дело]
    pains: ["страх ошибиться", "«не высовывайся» от родных", "бесконечная подготовка вместо действия", "ощущение, что потолок уже достигнут"]
    desires: ["аргумент против «выше головы не прыгнешь»", "разрешение начать без идеальной уверенности", "понять, когда пословица права"]
    knowledge: "Знают пословицы с детства и воспринимают их как правила; не знают, что есть рекорд прыжка на 59 см выше роста, исследование «гибридных» предпринимателей и правило 70% Безоса"
  promise: "Три пословицы, которые тихо держат тебя на месте, — и факты, которые их опровергают."
  tone: "Энергичный, тёплый, без нравоучений: пословица — не враг, а инструмент; эмоция — освобождение («можно»)."
  keywords: ["пословицы", "поговорки", "мотивация", "саморазвитие", "психология"]
  constraints:
    - "Не высмеивать народную мудрость: вывод — «совет под ситуацию», а не «пословицы врут»"
    - "Исследование Raffiee и Feng (2014) — США, связь, а не доказанная причина; в голосе «учёные посчитали», без «доказали»"
    - "Безос — имя в голосе без названия компании; на экране «ПРАВИЛО 70%», без логотипов"
    - "Сожаления о бездействии (Гилович и Медвец, 1995) — без процентов: репликация 2022 года подтвердила тенденцию, но эффект слабее"
    - "Не обещаем «прыгнешь выше головы, если поверишь»: рекорд Хольма — годы тренировок, пример показывает, что «потолок» в пословице — не физический закон"

research:
  summary: >-
    Шведский прыгун в высоту Стефан Хольм при росте 1,81 м взял 2,40 м (зал, 2005) — на 59 см выше собственного роста;
    это мировой рекорд «разницы», который он делит с Франклином Джейкобсом. Исследование Raffiee и Feng (Academy of
    Management Journal, 2014) показало: у тех, кто начинал своё дело, не бросая работу, риск закрыть бизнес на треть ниже,
    чем у тех, кто ушёл сразу. Безос в письме акционерам 2016 года советует принимать большинство решений, когда есть
    около 70% нужной информации, а осторожность оставлять для необратимых решений. Гилович и Медвец (1995): в
    краткосрочной перспективе люди больше жалеют о сделанном, в долгосрочной — о несделанном.
  facts:
    - id: f1
      text: "Стефан Хольм (Швеция), рост 1,81 м, личный рекорд в зале 2,40 м (2005); вместе с Франклином Джейкобсом владеет мировым рекордом разницы между ростом и высотой прыжка — 59 см."
      source: "https://en.wikipedia.org/wiki/Stefan_Holm"
      confidence: high
    - id: f2
      text: "В Мадриде-2005 Хольм прыгнул на 59 см выше своей головы, повторив мировое достижение по такой разнице (European Athletics)."
      source: "https://www.european-athletics.com/news/golden-moments-holm-soars-over-championship-record-40m-madrid"
      confidence: high
    - id: f3
      text: "Raffiee, Feng (2014), «Should I Quit My Day Job?: A Hybrid Path to Entrepreneurship»: у «гибридных» предпринимателей (совмещали своё дело и работу) риск выхода из бизнеса примерно на 33% ниже, чем у ушедших сразу (США, данные NLSY79)."
      source: "https://www.management-issues.com/news/6964/slow-burn-beats-big-bang"
      confidence: medium
    - id: f4
      text: "Безос, письмо акционерам 2016: большинство решений стоит принимать, имея около 70% информации, которую хотелось бы иметь; ждать 90% — почти всегда слишком медленно. Тщательно взвешивать — необратимые решения («двери в одну сторону»)."
      source: "https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders"
      confidence: high
    - id: f5
      text: "Gilovich, Medvec (1995), Psychological Review 102(2): в краткосрочной перспективе больше сожалеют о действиях, в долгосрочной — о бездействии."
      source: "https://doi.org/10.1037/0033-295X.102.2.379"
      confidence: high
    - id: f6
      text: "Сборник В. И. Даля «Пословицы русского народа» (1862) — более 30 тысяч пословиц, поговорок и загадок; в нём много пар с противоположным смыслом."
      source: "https://www.culture.ru/events/7056747/vystavka-mnogogrannyi-dal"
      confidence: high
  angles:
    - id: a1
      text: "Топ-3 пословицы-тормоза: каждая получает конкретный факт-опровержение (прыжок на 59 см выше головы, «гибридные» предприниматели, правило 70%), затем поворот — пословицы спорят сами с собой, и финал о сожалениях"
      score: 9
      why: "Узнаваемо всем, каждые 10 с новая награда-цифра, неожиданный поворот «пословицы противоречат друг другу», тёплый финал и естественный вопрос в комментарии."
    - id: a2
      text: "Пословицы противоречат друг другу: пары «тише едешь» против «куй железо» на всю минуту"
      score: 7
      why: "Смешно и вирусно, но без фактов и без личной пользы — только как поворот внутри a1."
    - id: a3
      text: "Психология установок: как фразы из детства превращаются в «я не смогу» (самосбывающиеся пророчества)"
      score: 6
      why: "Глубоко, но исследования спорные и тема абстрактная для 60 секунд."
    - id: a4
      text: "Настоящие полные версии пословиц, которые «обрезали»"
      score: 5
      why: "Популярно, но многие «полные версии» — сетевые выдумки; рискованно по точности."
  chosen_angle: a1
  insights:
    - "Самая наглядная награда — прыжок на 59 см выше головы: буквальное опровержение пословицы, легко нарисовать."
    - "«За двумя зайцами» опровергается неожиданно точно: совмещать работу и своё дело — безопаснее, чем бросить всё."
    - "«Семь раз отмерь» не ложь, а совет для необратимых решений; Безос сам разделяет решения на обратимые и нет — это честный нюанс."
    - "Поворот «пословицы спорят сами с собой» освобождает: если есть противоположная, значит, это не закон."
    - "Комментарий одной пословицей — лёгкий и личный ответ; ответы зрителей — материал для следующих роликов."

hooks:
  variants:
    - {id: h1, type: list_promise, vo: "Три пословицы из детства тихо держат тебя на месте.", on_screen: "3 ПОСЛОВИЦЫ-ТОРМОЗА", visual: "Человек держит над головой три тяжёлые доски-таблички с пословицами; с каждой доской он оседает ниже", score: 9, why: "Число, ключевое слово первым, «ты» и ощущение тяжести без звука; открывает петлю «какие?»."}
    - {id: h2, type: contrarian, vo: "«Выше головы не прыгнешь» — неправда. Один швед прыгнул на пятьдесят девять сантиметров выше.", on_screen: "ВЫШЕ ГОЛОВЫ? +59 СМ", visual: "Прыгун перелетает планку высоко над пунктиром «рост»", score: 8, why: "Сильный факт сразу, но раскрывает первую награду в первой секунде и сужает тему до одной пословицы."}
    - {id: h3, type: question, vo: "Почему ты до сих пор не начал? Может, виновата пословица.", on_screen: "ВИНОВАТА ПОСЛОВИЦА?", visual: "Палец указывает на табличку «СЕМЬ РАЗ ОТМЕРЬ»", score: 7, why: "Личный вопрос, но первая фраза без ключевого слова."}
    - {id: h4, type: shock_fact, vo: "Кто совмещал своё дело с работой, прогорал на треть реже.", on_screen: "НА ⅓ РЕЖЕ", visual: "Человек ловит сразу двух зайцев", score: 7, why: "Неожиданная цифра, но без контекста пословицы непонятна в первые 2 секунды."}
    - {id: h5, type: callout, vo: "Если тебе говорили «не высовывайся», это видео для тебя.", on_screen: "«НЕ ВЫСОВЫВАЙСЯ»?", visual: "Голова выглядывает из-за стены табличек", score: 7, why: "Цепляет своих, но обещание размытое."}
    - {id: h6, type: challenge, vo: "Спорим, хотя бы одна из этих пословиц тебя уже остановила?", on_screen: "СПОРИМ?", visual: "Три таблички падают по очереди", score: 7, why: "Вовлекает, но звучит как упрёк."}
    - {id: h7, type: curiosity_gap, vo: "Одна пословица из детства мешает тебе больше всех. Скажу, какая.", on_screen: "ОДНА МЕШАЕТ БОЛЬШЕ ВСЕХ", visual: "Три закрытые таблички, одна мигает", score: 8, why: "Хорошая недосказанность — A/B к основному; чуть длиннее."}
    - {id: h8, type: imagine, vo: "Представь: в голове звучит бабушкин голос — «семь раз отмерь».", on_screen: "СЕМЬ РАЗ ОТМЕРЬ", visual: "Пузыри с пословицами над головой человека", score: 6, why: "Образно, но медленно разгоняется."}
  primary: h1
  ab: [h7, h2]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Три пословицы-тормоза"
    goal: "Остановить палец образом тяжести (доски с пословицами давят на человека) и открыть петлю «какие три?»."
    vo: "Три пословицы из детства тихо держат тебя на месте. Третью ты слышал сто раз."
    on_screen: "3 ПОСЛОВИЦЫ-ТОРМОЗА"
    devices: [open_loop, direct_address, pattern_interrupt, text_reinforcement, sound_hit]
    music: pulse
    marks: {"пословицы": "#ffd34d"}
    shots:
      - id: h_weight
        visual: "Тёмно-синий фон, пол-полоса. Человек в футболке держит над головой стопку досок-табличек с народным орнаментом; доски падают сверху по одной («ВЫШЕ ГОЛОВЫ НЕ ПРЫГНЕШЬ», «ЗА ДВУМЯ ЗАЙЦАМИ…», «СЕМЬ РАЗ ОТМЕРЬ…»), с каждой он оседает ниже; сверху заголовок «3 ПОСЛОВИЦЫ-ТОРМОЗА»."
        actors: [person, new:plank, text, timetag]
        camera: "Медленный наезд, тряска на каждой доске"
        animation:
          - {at: "@start", what: "Первая доска падает на поднятые руки"}
          - {at: "@детства", what: "Вторая доска"}
          - {at: "@держат", what: "Третья доска, человек оседает, лицо грустнеет"}
        graphics:
          - {at: "@пословицы", type: "text stamp", text: "3 ПОСЛОВИЦЫ-ТОРМОЗА"}
        sfx:
          - {at: "@start", sound: impact, note: "доска 1"}
          - {at: "@детства", sound: impact, note: "доска 2"}
          - {at: "@держат", sound: boom, note: "доска 3"}
        ambience: [room]
        transition: cut
      - id: h_voices
        at: "@третью-0.1"
        visual: "Силуэты родных, учителя, соседа по кругу; над каждым всплывает реплика «СЕМЬ РАЗ ОТМЕРЬ!»; в центре счётчик «×100»."
        actors: [silhouette, bubble, text]
        camera: "Быстрый наезд к центру"
        animation:
          - {at: "@слышал", what: "Реплики всплывают одна за другой"}
          - {at: "@сто", what: "Счётчик бежит до ×100"}
        graphics:
          - {at: "@сто", type: "text count", text: "×100"}
        sfx:
          - {at: "@слышал", sound: pop}
          - {at: "@сто", sound: kick}
        transition: whip_x

  # ------------------------------------------------------------------ 2. POINT 1 — выше головы
  - id: jump
    role: point
    title: "№1 «Выше головы не прыгнешь»"
    goal: "Первая награда: прыгун ростом 1,81 взял 2,40 — буквально на 59 см выше головы."
    vo: "Первая: «выше головы не прыгнешь». Швед Стефан Хольм ростом метр восемьдесят один взял два сорок. Это на пятьдесят девять сантиметров выше головы."
    on_screen: "+59 СМ ВЫШЕ ГОЛОВЫ"
    devices: [mini_payoff, visual_proof, number_reveal, progress, contrast]
    facts: [f1, f2]
    music: pulse
    marks: {"пятьдесят девять сантиметров": "#c6ff3d"}
    shots:
      - id: j_plank
        visual: "Сектор прыжка в высоту ночью: стойки, планка; рядом стоит прыгун, пунктир на уровне макушки «1,81 м»; сверху доска «ВЫШЕ ГОЛОВЫ НЕ ПРЫГНЕШЬ» и метка «№1»."
        actors: [new:plank, person, shape, text, badge]
        camera: "Плавный подъём от прыгуна к планке"
        animation:
          - {at: "@Первая", what: "Доска-пословица падает сверху"}
          - {at: "@Хольм", what: "Пунктир «1,81 м» на уровне головы"}
        graphics:
          - {at: "@Первая", type: badge, text: "№1"}
          - {at: "@восемьдесят", type: text, text: "РОСТ 1,81 М"}
        sfx:
          - {at: "@Первая", sound: impact}
          - {at: "@Хольм", sound: blip}
        transition: whip_x
      - id: j_jump
        at: "@взял-0.1"
        visual: "Прыгун разбегается и перелетает планку спиной вперёд (фосбери-флоп); планка на 2,40; счётчик высоты."
        actors: [person, shape, text]
        camera: "Следит за прыгуном, лёгкий наезд в верхней точке"
        animation:
          - {at: "@взял", what: "Разбег и прыжок по дуге"}
          - {at: "@сорок", what: "Счётчик «2,40 М»"}
        graphics:
          - {at: "@сорок", type: "text count", text: "2,40 М"}
        sfx:
          - {at: "@взял", sound: whoosh}
          - {at: "@сорок", sound: kick}
        transition: cut
      - id: j_gap
        at: "@пятьдесят-0.1"
        visual: "Стоп-кадр: скобка между пунктиром «голова» и планкой, штамп «+59 СМ»; доска-пословица трескается пополам."
        actors: [shape, text, new:plank]
        camera: "Наезд на скобку, тряска на штампе"
        animation:
          - {at: "@пятьдесят", what: "Скобка растягивается"}
          - {at: "@выше#2", what: "Доска трескается и падает"}
        graphics:
          - {at: "@сантиметров", type: "text stamp", text: "+59 СМ"}
        sfx:
          - {at: "@пятьдесят", sound: riser}
          - {at: "@выше#2", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 3. POINT 2 — два зайца
  - id: hares
    role: point
    title: "№2 «За двумя зайцами»"
    goal: "Вторая награда: совмещать работу и своё дело — безопаснее, чем бросить всё."
    vo: "Вторая: «за двумя зайцами погонишься — ни одного не поймаешь». Но учёные посчитали: кто начинал своё дело, не бросая работу, прогорал на треть реже."
    on_screen: "НА ⅓ РЕЖЕ ПРОГОРАЛИ"
    devices: [mini_payoff, visual_proof, number_reveal, contrast, progress]
    facts: [f3]
    music: pulse
    marks: {"на треть реже": "#c6ff3d"}
    shots:
      - id: z_chase
        visual: "Поле ночью: два зайца разбегаются в разные стороны, человек в центре растерянно разводит руками; сверху доска «ЗА ДВУМЯ ЗАЙЦАМИ…» и «№2»."
        actors: [new:plank, new:hare, person, badge]
        camera: "Лёгкая панорама за зайцами"
        animation:
          - {at: "@Вторая", what: "Доска-пословица падает"}
          - {at: "@зайцами", what: "Зайцы разбегаются"}
          - {at: "@поймаешь", what: "Человек пожимает плечами"}
        graphics:
          - {at: "@Вторая", type: badge, text: "№2"}
        sfx:
          - {at: "@Вторая", sound: impact}
          - {at: "@зайцами", sound: whoosh}
          - {at: "@поймаешь", sound: blip}
        transition: whip_x
      - id: z_study
        at: "@учёные-0.1"
        visual: "Два столбца «РИСК ЗАКРЫТЬСЯ»: «УШЁЛ СРАЗУ» высокий красный и «СОВМЕЩАЛ» на треть ниже зелёный; штамп «−33%»; рядом человек держит двух зайцев."
        actors: [chart, text, badge, new:hare]
        camera: "Наезд на разницу столбцов"
        animation:
          - {at: "@посчитали", what: "Столбцы растут"}
          - {at: "@работу", what: "Зелёный останавливается ниже"}
          - {at: "@треть", what: "Штамп −33%"}
        graphics:
          - {at: "@посчитали", type: text, text: "РИСК ЗАКРЫТЬ ДЕЛО"}
          - {at: "@треть", type: "text stamp", text: "−33%"}
        sfx:
          - {at: "@посчитали", sound: typing}
          - {at: "@треть", sound: kick}
          - {at: "@реже", sound: chime}
        transition: zoom

  # ------------------------------------------------------------------ 4. POINT 3 — семь раз отмерь
  - id: measure
    role: point
    title: "№3 «Семь раз отмерь»"
    goal: "Третья награда: бесконечное «отмерь» = повод не начинать; правило 70%."
    vo: "Третья: «семь раз отмерь — один раз отрежь». Звучит мудро, но часто это повод не начинать вообще. Безос советует решать, когда знаешь семьдесят процентов."
    on_screen: "ПРАВИЛО 70%"
    devices: [mini_payoff, visual_proof, number_reveal, relatability, progress]
    facts: [f4]
    music: tension
    marks: {"семьдесят процентов": "#c6ff3d"}
    shots:
      - id: m_tape
        visual: "Стол с тканью: рулетка снова и снова протягивается, счётчик «ОТМЕРЕНО: 7 … 18 … 43»; ножницы висят над тканью и так и не режут; сверху доска «СЕМЬ РАЗ ОТМЕРЬ…» и «№3»."
        actors: [new:plank, new:tape, new:scissors, text, badge]
        camera: "Сверху, медленный наезд"
        animation:
          - {at: "@Третья", what: "Доска-пословица падает"}
          - {at: "@мудро", what: "Рулетка тянется снова и снова, счётчик растёт"}
          - {at: "@начинать", what: "Ножницы дрожат, но не режут"}
        graphics:
          - {at: "@Третья", type: badge, text: "№3"}
          - {at: "@мудро", type: "text count", text: "ОТМЕРЕНО: 43"}
        sfx:
          - {at: "@Третья", sound: impact}
          - {at: "@мудро", sound: scrape}
          - {at: "@начинать", sound: click}
        transition: whip_x
      - id: m_70
        at: "@Безос-0.1"
        visual: "Шкала «ИНФОРМАЦИЯ» заполняется до 70%, на отметке 70 загорается «РЕШАЙ»; ножницы щёлкают — ткань разрезана."
        actors: [meter, new:scissors, text, badge]
        camera: "Наезд на отметку 70"
        animation:
          - {at: "@решать", what: "Шкала заполняется"}
          - {at: "@семьдесят", what: "Отметка 70% вспыхивает, ножницы режут"}
        graphics:
          - {at: "@Безос", type: badge, text: "ПРАВИЛО ДЖЕФФА БЕЗОСА"}
          - {at: "@процентов", type: "text stamp", text: "70% → РЕШАЙ"}
        sfx:
          - {at: "@решать", sound: riser}
          - {at: "@процентов", sound: slam}
        transition: zoom

  # ------------------------------------------------------------------ 5. TWIST — пословицы спорят
  - id: twist
    role: twist
    title: "Пословицы спорят сами с собой"
    goal: "Поворот: на каждую пословицу есть противоположная — значит, это не законы."
    vo: "И главное: пословицы спорят сами с собой. «Тише едешь — дальше будешь». Но «куй железо, пока горячо». Это не законы, а советы под ситуацию."
    on_screen: "НЕ ЗАКОНЫ"
    devices: [twist, contrast, emotion, pattern_interrupt]
    facts: [f6]
    music: tension
    marks: {"не законы": "#ffd34d"}
    shots:
      - id: t_vs
        visual: "Две доски летят навстречу друг другу: слева «ТИШЕ ЕДЕШЬ — ДАЛЬШЕ БУДЕШЬ» с улиткой, справа «КУЙ ЖЕЛЕЗО, ПОКА ГОРЯЧО» с молотом и искрами; посередине молния «VS»."
        actors: [new:plank, image, text, particles]
        camera: "Наезд, тряска на столкновении"
        animation:
          - {at: "@спорят", what: "Знак VS вспыхивает"}
          - {at: "@Тише", what: "Левая доска въезжает"}
          - {at: "@куй", what: "Правая доска въезжает, искры"}
        graphics:
          - {at: "@спорят", type: text, text: "VS"}
        sfx:
          - {at: "@спорят", sound: glitch}
          - {at: "@Тише", sound: whoosh}
          - {at: "@куй", sound: metal_ring}
        transition: whip_x
      - id: t_rule
        at: "@законы-0.1"
        visual: "Доски ложатся в ящик с инструментами с надписью «СОВЕТЫ ПОД СИТУАЦИЮ»; штамп «НЕ ЗАКОНЫ»."
        actors: [new:plank, shape, text, badge]
        camera: "Сверху, отъезд"
        animation:
          - {at: "@законы", what: "Штамп «НЕ ЗАКОНЫ»"}
          - {at: "@советы", what: "Доски укладываются в ящик"}
        graphics:
          - {at: "@законы", type: "text stamp", text: "НЕ ЗАКОНЫ"}
          - {at: "@ситуацию", type: badge, text: "СОВЕТЫ ПОД СИТУАЦИЮ"}
        sfx:
          - {at: "@законы", sound: slam}
          - {at: "@ситуацию", sound: chime}
        transition: zoom

  # ------------------------------------------------------------------ 6. PAYOFF — сожаления
  - id: regret
    role: payoff
    title: "О чём жалеют с годами"
    goal: "Развязка: долгосрочные сожаления — о несделанном; значит, пробовать безопаснее, чем кажется."
    vo: "И вот что важно. Психологи выяснили: с годами люди жалеют не об ошибках. Они жалеют о том, чего так и не попробовали."
    on_screen: "ЖАЛЕЮТ О НЕСДЕЛАННОМ"
    devices: [mini_payoff, emotion, direct_address, save_trigger]
    facts: [f5]
    music: epic
    marks: {"не попробовали": "#ffd34d"}
    shots:
      - id: r_bench
        visual: "Сумерки, скамейка: пожилой человек с сединой сидит и думает; над ним всплывают пузыри «А ЕСЛИ БЫ…»."
        actors: [sky, person, bubble, ground]
        camera: "Медленный наезд"
        animation:
          - {at: "@годами", what: "Сумерки сгущаются"}
          - {at: "@жалеют", what: "Пузыри «А ЕСЛИ БЫ…» всплывают"}
        graphics:
          - {at: "@жалеют", type: bubble, text: "А ЕСЛИ БЫ…"}
        sfx:
          - {at: "@годами", sound: chime}
          - {at: "@жалеют", sound: pop}
        transition: whip_x
      - id: r_bars
        at: "@ошибках-0.1"
        visual: "Две чаши-столбца «СПУСТЯ ГОДЫ»: «О СДЕЛАННОМ» короткий, «О НЕСДЕЛАННОМ» высокий; надпись «ПОПРОБУЙ»."
        actors: [chart, text, badge]
        camera: "Наезд на высокий столбец"
        animation:
          - {at: "@ошибках", what: "Короткий столбец"}
          - {at: "@попробовали", what: "Высокий столбец растёт"}
        graphics:
          - {at: "@попробовали", type: "text stamp", text: "О НЕСДЕЛАННОМ"}
        sfx:
          - {at: "@ошибках", sound: blip}
          - {at: "@попробовали", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 7. CTA
  - id: cta
    role: cta
    title: "Какая тормозила тебя?"
    goal: "Вопрос в комментарии (одна пословица) + обещание разбора; отсылка к хуку: доски падают с плеч."
    vo: "Какая пословица тормозила тебя? Напиши её в комментарии — разберём её в следующем видео."
    on_screen: "КАКАЯ ТОРМОЗИЛА ТЕБЯ?"
    devices: [comment_bait, callback, follow_trigger, direct_address, loop_ending]
    music: epic
    shots:
      - id: c_free
        visual: "Тот же человек из хука со стопкой досок: доски трескаются и разлетаются, он выпрямляется и поднимает руки; внизу плашка «НАПИШИ В КОММЕНТАРИЯХ»."
        actors: [person, new:plank, text, badge, particles]
        camera: "Наезд, тряска на разломе"
        animation:
          - {at: "@тормозила", what: "Доски трескаются"}
          - {at: "@Напиши", what: "Доски разлетаются, человек поднимает руки"}
          - {at: "@разберём", what: "Обломки досок рассыпаются искрами"}
          - {at: "@следующем", what: "Плашка «СЛЕДУЮЩАЯ — ТВОЯ»"}
        graphics:
          - {at: "@start", type: text, text: "КАКАЯ ТОРМОЗИЛА ТЕБЯ?"}
          - {at: "@Напиши", type: badge, text: "НАПИШИ В КОММЕНТАРИЯХ"}
          - {at: "@следующем", type: badge, text: "СЛЕДУЮЩАЯ — ТВОЯ"}
        sfx:
          - {at: "@тормозила", sound: creak}
          - {at: "@Напиши", sound: boom}
          - {at: "@разберём", sound: sparkle}
          - {at: "@следующем", sound: pop}
        transition: whip_x

loops:
  - {id: l1, question: "Какие три пословицы держат меня на месте?", open: hook, close: measure}
  - {id: l2, question: "Если пословицы ошибаются — чему тогда верить?", open: jump, close: regret}

engagement:
  comment: "Какая пословица тормозила тебя? Напиши её одной строкой."
  share: "Переслать другу, который всё откладывает «пока не отмерит семь раз», или родителю, который говорит «выше головы не прыгнешь»."
  save: "Три аргумента на случай, когда снова скажут «не высовывайся»: +59 см, −33% провалов, правило 70%."
  follow: "Следующий ролик — разбор пословицы из комментариев."
  rewatch: "Быстрые цифры (1,81 → 2,40, −33%, 70%) и финал, где разлетаются те же доски, что падали в начале."
  cta: {beat: cta, text: "Какая пословица тормозила тебя? Напиши в комментарии", type: comment}


  - {<<: *misha, x: 505, y: 815, h: 480, arms: [around, down], face: smile}
  - {<<: *kostya, id: gap, x: 370, y: 818, h: 490, gone: 1}       # the vanished man: invisible, only for marks

scenes:

  # ------------------------------------------------------------------ 1. HOOK — снимок 08:41: средний человек выпадает
  - id: hook
    text: "Человек пропал с твоей фотографии? У тебя семь минут. Потом ты забудешь, что он был."
    caption_marks: {"семь минут": "#ffb23e"}
    shots:
      - id: k_photo
        transition: {type: fade, dur: 0.2}
        ambience: [{sound: city, gain: -22}]
        draw:
          bg: *desk_bg
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.07, x: 540, y: 990}], shakes: [{at: "@пропал", amp: 8, dur: 0.3}]}
          layers:
            - {actor: photo, x: 230, y: 1700, w: 560, h: 420, rot: 9, bg: "#8aa3b0", date: "'26 10 28", seed: 4, children: [{actor: shape, kind: rect, x: 0, y: 260, w: 560, h: 160, fill: "#6d7f62", origin: top-left}]}
            - {actor: photo, x: 900, y: 1640, w: 480, h: 360, rot: -7, bg: "#c79a6c", seed: 6, children: [{actor: shape, kind: circle, x: 240, y: 200, r: 90, fill: "#e8c9a0"}]}
            - actor: photo
              id: shot1
              x: 540
              y: 840
              scale: 0.93
              w: 740
              h: 880
              rot: -1.5
              date: "'26 10 29  08:41"
              glitch: [{at: "@пропал", dur: 0.35}]
              children:
                - *street_in_photo
                - {actor: branch, x: 600, y: -30, scale: 0.8, seed: 3, opacity: [{at: 0, v: 0}, {at: "@пропал+0.2", v: 1, dur: 0.05}]}
                - {actor: sidewalk, x: -300, y: 600, w: 1400, h: 300, shift: {x: 612, w: 116, dx: 34, dy: 8}, show_shift: [{at: 0, v: 0}, {at: "@пропал+0.2", v: 1, dur: 0.05}]}
                - {<<: *lena, x: 235, y: 812, h: 470, arms: [down, around], face: laugh}
                - {<<: *kostya, x: 370, y: 818, h: 490, arms: [around, around], face: smile, gone: [{at: 0, v: 0}, {at: "@пропал", v: 1, dur: 0.35}]}
                - {<<: *misha, x: 505, y: 815, h: 480, arms: [around, down], face: smile}
            - {actor: text, x: 540, y: 290, space: screen, at: "@семь", enter: pop, font: plex, size: 72, weight: 600, color: orange,
               text: [{at: 0, v: "7:00"}, {at: "@семь+1", v: "6:59"}, {at: "@семь+2", v: "6:58"}]}
            - {<<: *ev, src: "СВИДЕТЕЛЬСТВО 001 · ФОТО", time: "08:41:12"}
      - id: k_title
        start: "@Потом-0.22"
        transition: {type: zoom}
        draw:
          bg: *desk_bg
          camera: {keys: [{t: 0, z: 1.05, x: 540, y: 920}, {t: end, z: 1.3, x: 540, y: 960, ease: out}]}
          layers:
            - {actor: photo, x: 540, y: 840, scale: 0.93, w: 740, h: 880, rot: -1.5, date: "'26 10 29  08:41", children: *group_after}
            - {actor: text, x: 540, y: 470, space: screen, at: "@забудешь-0.1", enter: {type: fade, dur: 0.15}, text: "ДЕЛО 0841 · СВИДЕТЕЛЬСТВА", font: plex, size: 34, weight: 600, color: orange, letter: 4}
            - {actor: text, x: 540, y: 640, space: screen, at: "@забудешь-0.1", enter: {type: fade, dur: 0.2}, text: "ЛЮДИ ВЫПАДАЮТ ИЗ ФОТОГРАФИЙ", font: cond, size: 118, weight: 700, color: "#f6f2ea", lines: 2, width: 960,
               bg: {color: "rgba(18,16,14,.86)", pad: 30, radius: 4}}
    sfx:
      - {sound: shutter, at: 0.15, gain: -8}
      - {sound: glitch, at: "@пропал", gain: -12}
      - {sound: boom, at: "@забудешь", gain: -12}

  # ------------------------------------------------------------------ 2. SETUP — Садовая, Ира, Лена, два кофе
  - id: setup
    text: "Восемь сорок одна, фотоателье на Садовой. Ира, тридцать четыре года, ретушёр. Двадцать лет стирает с чужих снимков лишнее. Лена, администратор. У неё день рождения. Ира снимает коллег у витрины. На прилавке два кофе. Второй она взяла по привычке. Для кого — не помнит."
    caption_marks: {"два кофе": "#ffb23e"}
    shots:
      - id: s_street
        transition: {type: dip, dur: 0.3}
        ambience: [{sound: city, gain: -18}, {sound: birds, gain: -20}]
        draw:
          world: [1500, 1920]
          camera: {keys: [{t: 0, z: 1.0, x: 900, y: 960}, {t: end, z: 1.04, x: 640, y: 960, ease: inout}]}
          layers:
            - {actor: sky, x: -200, y: 0, w: 1900, h: 900, hour: 8.6, clouds: 3, par: 0}
            - {actor: skyline, x: 750, y: 420, w: 2400, h: 300, color: "#b9c6cf", color2: "#aab8c2", lit: 0, par: 0.3, seed: 3}
            - {actor: storefront, x: 640, y: 1360, w: 1100, h: 1150}
            - {actor: storefront, x: -420, y: 1360, w: 1000, h: 1150, sign: "ЦВЕТЫ", number: "САДОВАЯ 12", wall: "#c9b8a4", cups: false}
            - {actor: sidewalk, x: -300, y: 1340, w: 2100, h: 600}
            - {actor: tree, kind: round, x: 1290, y: 1500, h: 900, seed: 4}
            - {actor: streetlight, x: 140, y: 1480, h: 820}
            - {<<: *misha, x: 1180, y: 1760, h: 380, step: [{at: 0, v: 0}, {at: "@Восемь", v: 6, dur: 3}], anim: [{at: "@Восемь", dur: 3.2, x: 1500, ease: linear}], depth: 1}
            - {actor: particles, kind: dust, region: [0, 300, 1500, 1500], count: 26, colors: ["#fff7e0"], alpha: 0.5}
            - {actor: timetag, slot: tag, at: "@Восемь", enter: fade, text: "08:41 · САДОВАЯ"}
      - id: s_ira
        start: "@Ира-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06, y: 940}]}
          layers:
            - {actor: shape, kind: rect, x: 0, y: 0, w: 1080, h: 1920, fill: "#d8e6f0", origin: top-left}
            - {actor: storefront, x: 640, y: 2350, scale: 2.0}
            - {<<: *ira, x: 380, y: 2500, h: 2000, arms: [down, hold], face: calm, look_dx: 0.4}
            - actor: retouch_screen

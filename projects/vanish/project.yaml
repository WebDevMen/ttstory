                - {actor: shape, kind: rect, x: 0, y: 0, w: 276, h: 324, fill: "#9fc0d8", origin: top-left}
                - {actor: shape, kind: rect, x: 40, y: 140, w: 120, h: 200, fill: "#c9b48e", origin: top-left}
                - {actor: shape, kind: line, points: [[0, 80], [276, 110]], stroke: "#1d1d1d", sw: 3, opacity: [{at: 0, v: 1}, {at: "@стирает+0.2", v: 0, dur: 0.8}]}
            - {<<: *tag, at: "@Ира", x: 540, y: 300, text: "ИРА, 34 · РЕТУШЁР"}
      - id: s_group
        start: "@Лена-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05}]}
          layers:
            - {actor: shape, kind: rect, x: -100, y: 0, w: 1300, h: 1920, fill: "#d8e6f0", origin: top-left}
            - {actor: storefront, x: 540, y: 1150, scale: 0.92}
            - {actor: sidewalk, x: -300, y: 1120, w: 1700, h: 900}
            - {actor: branch, x: 860, y: -60, scale: 1.1, seed: 3}
            - {<<: *lena, x: 360, y: 1215, h: 640, face: laugh, arms: [{at: 0, v: [down, around]}, {at: "@рождения", v: [wave, around]}, {at: "@снимает", v: [down, around]}]}
            - {<<: *kostya, x: 540, y: 1225, h: 670, arms: [around, around], face: smile}
            - {<<: *misha, x: 720, y: 1220, h: 655, arms: [around, down], face: smile}
            - {actor: viewfinder, x: 0, y: 0, space: screen, focus: [{at: 0, v: 0.4}, {at: "@рождения", v: 1, dur: 0.5}], flash: ["@снимает"]}

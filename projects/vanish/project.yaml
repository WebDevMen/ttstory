# «Люди выпадают из фотографий» (~3:19). Своя графика кодом (method draw), без ИИ-картинок.
# Концепция ДЕЛО 0841 · ФОТОАРХИВ СВИДЕТЕЛЬСТВ: каждый кадр — свидетельство (отпечаток с оранжевой датой, экран
# фотоаппарата, камеры наблюдения, дрон, спутник, новости), в углу — номер дела, источник и время.
# Исчезновение — без силуэтов и дыма: короткая помеха, потом пустое место; фон за ним «неправильный» (сдвиг плитки,
# повторённая ветка). Начало яркое и обычное, к финалу — холоднее и тише, финал — белая засветка.
# Сценарий: projects/vanish/script.yaml. Актёры проекта: projects/vanish/actors/ (people, photo, places, aerial).
# Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Люди выпадают из фотографий"

voice: {voice: fr-FR-RemyMultilingualNeural, rate: "+20%", pitch: "+0Hz", tail: 1.6}
voices:
  ira: {voice: en-US-AvaMultilingualNeural, rate: "+12%"}
  lena: {voice: en-US-EmmaMultilingualNeural, rate: "+14%", pitch: "+6Hz"}
  kostya: {voice: en-US-AndrewMultilingualNeural, rate: "+4%", pitch: "-4Hz"}
  anchor: {voice: de-DE-FlorianMultilingualNeural, rate: "+12%"}

theme:
  preset: archive
  accent: "#ffb23e"
  captions: {style: clean, top: auto, size: 62, max_chars: 20, hide: [{from: "@cta/первыми-0.2", until: "@cta/ты-0.25"}, {from: "@cta/сделал-0.1", until: "@cta/нет#2.end"}]}

post: {vignette: 0.16, chromatic: 0, grain: 0.018}

draw:
  palette: {paper: "#f6f2ea", orange: "#ffb23e", desk: "#2a2420", grey: "#8b939c"}

audio:
  music:
    key: D
    mode: minor
    bpm: 84
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@setup.start", style: calm}
      - {at: "@problem.start", style: tension}
      - {at: "@rule.start", style: pulse}
      - {at: "@call.start", style: tension}
      - {at: "@station.start", style: dark}
      - {at: "@twist.start", style: sub}
      - {at: "@crossing.start", style: pulse}
      - {at: "@city.start", style: epic}
      - {at: "@dilemma.start", style: drone}
      - {at: "@cliff.start", style: silence}
      - {at: "@cta.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-ira: &ira {actor: figure, top: sweater, top_color: "#d9c9a8", hair: bun, hair_color: "#3a2a22", seed: 1}
x-lena: &lena {actor: figure, top: dress, top_color: "#3f7a5a", hair: bob, hair_color: "#b5562c", crown: true, seed: 2}
x-misha: &misha {actor: figure, top: shirt, top_color: "#6d8fb3", hair: short, hair_color: "#5a3a26", glasses: true, seed: 5}
x-kostya: &kostya {actor: figure, top: jacket, top_color: "#8b939c", top2: "#e8e4dc", hair: short, hair_color: "#2e2520", seed: 7}
x-ev: &ev {actor: evidence, x: 0, y: 0, space: screen, case: "ДЕЛО 0841"}
x-tag: &tag {actor: text, space: screen, font: plex, size: 44, weight: 600, color: orange, bg: {color: "rgba(18,16,14,.86)", pad: 14}, enter: {type: fade, dur: 0.2}, sfx: false}
x-desk: &desk_bg {type: radial, at: "50% 40%", stops: [[0, "#3a312a"], [1, "#16120f"]]}

# the group photo at 08:41 (image 740 x 880): Lena — Kostya — Misha at the atelier window
x-street-in-photo: &street_in_photo
  - {actor: shape, kind: rect, x: 0, y: 0, w: 740, h: 880, fill: "#d8e6f0", origin: top-left}
  - {actor: storefront, x: 370, y: 612, scale: 0.68}
  - {actor: sidewalk, x: -300, y: 600, w: 1400, h: 300, shift: {x: 612, w: 116, dx: 34, dy: 8}, show_shift: 0}
  - {actor: branch, x: 520, y: -30, scale: 0.8, seed: 3}
x-group-after: &group_after
  - {actor: shape, kind: rect, x: 0, y: 0, w: 740, h: 880, fill: "#d8e6f0", origin: top-left}
  - {actor: storefront, x: 370, y: 612, scale: 0.68}
  - {actor: sidewalk, x: -300, y: 600, w: 1400, h: 300, shift: {x: 612, w: 116, dx: 34, dy: 8}, show_shift: 1}
  - {actor: branch, x: 520, y: -30, scale: 0.8, seed: 3}
  - {actor: branch, x: 600, y: -30, scale: 0.8, seed: 3}

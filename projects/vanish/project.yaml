            - {actor: paper_cup, x: 700, y: 1360, scale: 1.5, letter: "К", steam: 1, sugar: true}
            - {actor: human_hand, x: 1300, y: 1000, rot: -70, skin: "#f1d2bd", sleeve: "#d9c9a8", anim: [{at: "@привычке-0.4", dur: 0.9, x: 860, y: 1080, ease: out}, {at: "@помнит", dur: 0.6, x: 1000, y: 1020}]}
            - {actor: text, slot: title, at: "@помнит-0.1", enter: fade, text: "ДЛЯ КОГО?", font: cond, size: 110, weight: 700, color: "#f6f2ea"}

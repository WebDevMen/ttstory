  # ------------------------------------------------------------------ cta: Призыв — Ты бы сделал селфи?
  # задача: Финальная мысль меняет смысл начала; вопрос на одно слово; вторая часть.
  # на экране: «ТЫ БЫ СДЕЛАЛ ЭТО СЕЛФИ?»
  - id: cta
    text: "Может, снимки никого не стирают. Может, они просто первыми видят, кого уже нет. А ты бы сделал это селфи? Да или нет? Во второй части люди вспомнят город, которого никогда не было."
    shots:
      - id: z_photo
        # ВИЗУАЛ: Возврат к первому снимку у витрины (08:41): трое — двое — пустое место; камера уходит к стаканам
        #         кофе за стеклом: буква «К». Над ними — «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ».
        # актёры: new:photo, new:storefront, person, new:paper_cup, text
        # камера: Медленный наезд на стакан с «К»
        # анимация: @снимки — Снимок появляется из белого
        # анимация: @стирают — Наезд на стакан «К»
        transition: {"type": "dissolve"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ТЫ БЫ СДЕЛАЛ ЭТО СЕЛФИ?", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Возврат к первому снимку у витрины (08:41): трое — двое — пустое место; камера уходит к стаканам кофе за стеклом: буква «К». Над ними — «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "08:41", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@стирают", "enter": "pop"}
      - id: z_text
        # ВИЗУАЛ: Крупно стакан «К» на снимке; поверх фраза «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ».
        # актёры: new:photo, new:paper_cup, text
        # камера: Очень медленный наезд
        # анимация: @видят — Фраза печатается
        start: "@первыми-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Крупно стакан «К» на снимке; поверх фраза «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@видят", "enter": "pop"}
      - id: z_cta
        # ВИЗУАЛ: Экран камеры телефона, фронталка смотрит на зрителя; кнопка затвора пульсирует; вопрос «ТЫ БЫ
        #         СДЕЛАЛ ЭТО СЕЛФИ? ДА / НЕТ»; ниже — «ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО».
        # актёры: phone, text, card
        # камера: Медленный наезд на кнопку затвора
        # анимация: @селфи — Кнопка затвора пульсирует
        # анимация: @Да — Кнопки ДА / НЕТ
        start: "@ты-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ДА ИЛИ НЕТ?", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Экран камеры телефона, фронталка смотрит на зрителя; кнопка затвора пульсирует; вопрос «ТЫ БЫ СДЕЛАЛ ЭТО СЕЛФИ? ДА / НЕТ»; ниже — «ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ДА ИЛИ НЕТ?", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@селфи", "enter": "pop"}
      - id: z_part2
        # ВИЗУАЛ: Спутниковый снимок незнакомого города на месте степи — проступает, как проявка; карточка «ЧАСТЬ
        #         2: ГОРОД, КОТОРОГО НЕ БЫЛО».
        # актёры: new:satellite, card
        # камера: Медленный отъезд
        # анимация: @вспомнят — Город проявляется на снимке
        # анимация: @никогда — Карточка «ЧАСТЬ 2»
        start: "@Во-0.22"
        transition: {"type": "dissolve"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Спутниковый снимок незнакомого города на месте степи — проступает, как проявка; карточка «ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@никогда", "enter": "pop"}
    sfx:
      - {"sound": "shutter", "at": "@снимки", "gain": -14}
      - {"sound": "boom", "at": "@видят", "gain": -14}
      - {"sound": "click", "at": "@селфи", "gain": -14}
      - {"sound": "riser", "at": "@вспомнят", "gain": -14}

# ЧЕРНОВИК ПРОЕКТА из projects/vanish/script.yaml (python3 vg.py script project vanish).
# Уже готово: голос, сцены с текстом, кадры со сменой на словах и переходами, музыка по блокам, звуки на словах.
# Вместо картинки каждый кадр — аниматик-карточка (текст на экране + описание кадра): темп можно проверить сразу
# (python3 vg.py voice vanish && python3 vg.py compile vanish && python3 vg.py preview vanish --shots).
# Дальше замените layers каждого кадра настоящей графикой по плану из комментариев (skill make-video, docs/DRAW.md).

title: "Люди выпадают из фотографий"

voice: {"voice": "fr-FR-RemyMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}
# голоса героев: реплики сцен (lines) звучат своим голосом, рассказчик — голосом voice
voices:
  ira: {"voice": "en-US-AvaMultilingualNeural", "rate": "+12%"}
  lena: {"voice": "en-US-EmmaMultilingualNeural", "rate": "+14%", "pitch": "+6Hz"}
  kostya: {"voice": "en-US-AndrewMultilingualNeural", "rate": "+4%", "pitch": "-4Hz"}
  anchor: {"voice": "de-DE-FlorianMultilingualNeural", "rate": "+12%"}

theme:
  preset: archive
  accent: "#ffb23e"
  captions: {"style": "clean", "top": 1250, "size": 64}

post: {vignette: 0.2, chromatic: 0, grain: 0.012}

audio:
  music:
    key: D
    mode: minor
    bpm: 84
    gain: -14
    sections:
      - {at: 0, style: drone}
      - {at: "@setup.start", style: calm}
      - {at: "@problem.start", style: tension}
      - {at: "@rule.start", style: pulse}
      - {at: "@call.start", style: tension}
      - {at: "@station.start", style: dark}
      - {at: "@twist.start", style: sub}
      - {at: "@crossing.start", style: pulse}
      - {at: "@city.start", style: epic}
      - {at: "@dilemma.start", style: drone}
      - {at: "@cliff.start", style: silence}
      - {at: "@cta.start", style: drone}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ hook: Крючок — Семь минут
  # задача: Сразу правило, срок и цена: пропал со снимка — через семь минут забудешь, что он был.
  # на экране: «ПРОПАЛ С ФОТОГРАФИИ? 7 МИНУТ»
  - id: hook
    accent: "#ffb23e"
    text: "Человек пропал с твоей фотографии? У тебя семь минут. Потом ты забудешь, что он был."
    caption_marks: {"семь минут": "#ffb23e"}
    shots:
      - id: k_photo
        # ВИЗУАЛ: Солнечный снимок-отпечаток (белая рамка, оранжевая дата 08:41) лежит на светлом столе: у витрины
        #         фотоателье стоят трое коллег, смеются; на прилавке за стеклом два стакана кофе, на одном буква
        #         «К» (пасхалка). На слове «пропал» — короткая цифровая помеха, и средний человек исчезает:
        #         остальные в тех же позах, рука девушки обнимает воздух, плитка за пустотой сдвинута.
        # актёры: new:photo, new:storefront, new:sidewalk, person, new:paper_cup, new:evidence
        # камера: Медленный наезд на снимок сверху; лёгкий толчок на помехе
        # анимация: @start — Снимок чуть покачивается на столе, блик света ползёт по глянцу
        # анимация: @пропал — Помеха — средний человек пропадает, на его месте сдвинутая плитка
        # анимация: @семь — Метка «7:00» начинает обратный счёт
        transition: {"type": "fade"}
        ambience: [{"sound": "city", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ПРОПАЛ С ФОТОГРАФИИ? 7 МИНУТ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Солнечный снимок-отпечаток (белая рамка, оранжевая дата 08:41) лежит на светлом столе: у витрины фотоателье стоят трое коллег, смеются; на прилавке за стеклом два стакана кофе, на одном буква «К» (пасхалка). На слове «пропал» — короткая цифровая помеха, и средний человек исчезает: остальные в тех же позах, рука девушки обнимает воздух, плитка за пустотой сдвинута.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "7:00", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@семь", "enter": "pop"}
      - id: k_title
        # ВИЗУАЛ: Тот же снимок, наезд на пустое место: зерно, растр, дата. Заголовок «ЛЮДИ ВЫПАДАЮТ ИЗ
        #         ФОТОГРАФИЙ» и строка архива «ДЕЛО 0841 · СВИДЕТЕЛЬСТВА». Полсекунды тишины.
        # актёры: new:photo, text, new:evidence
        # камера: Быстрый наезд на пустоту
        # анимация: @забудешь — Заголовок печатается, как штамп архива
        # анимация: @был — Тишина, только тикает метка времени
        start: "@Потом-0.22"
        transition: {"type": "zoom"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ЛЮДИ ВЫПАДАЮТ ИЗ ФОТОГРАФИЙ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Тот же снимок, наезд на пустое место: зерно, растр, дата. Заголовок «ЛЮДИ ВЫПАДАЮТ ИЗ ФОТОГРАФИЙ» и строка архива «ДЕЛО 0841 · СВИДЕТЕЛЬСТВА». Полсекунды тишины.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ЛЮДИ ВЫПАДАЮТ ИЗ ФОТОГРАФИЙ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@забудешь", "enter": "pop"}
    sfx:
      - {"sound": "shutter", "at": "@hook.start", "gain": -14}
      - {"sound": "glitch", "at": "@пропал", "gain": -14}
      - {"sound": "boom", "at": "@забудешь", "gain": -14}

  # ------------------------------------------------------------------ setup: Завязка — Ателье на Садовой
  # задача: Кто и где: солнечное утро, ретушёр Ира снимает коллег у витрины; два кофе — второй неизвестно для
  #         кого.
  # на экране: «08:41 · САДОВАЯ»
  - id: setup
    text: "Восемь сорок одна, фотоателье на Садовой. Ира, тридцать четыре года, ретушёр. Двадцать лет стирает с чужих снимков лишнее. Лена, администратор. У неё день рождения. Ира снимает коллег у витрины. На прилавке два кофе. Второй она взяла по привычке. Для кого — не помнит."
    shots:
      - id: s_street
        # ВИЗУАЛ: Улица в утреннем солнце: фасад фотоателье с вывеской «ФОТО», витрина с рамками, плитка тротуара,
        #         дерево с длинной тенью; напротив — дома, машины, голуби. Метка «08:41 · САДОВАЯ».
        # актёры: sky, building, new:storefront, new:sidewalk, tree, streetlight, particles, timetag
        # камера: Медленная панорама вдоль улицы к витрине
        # анимация: @Восемь — Голуби взлетают, проезжает машина
        # анимация: @Садовой — Камера останавливается на вывеске ателье
        transition: {"type": "dip"}
        ambience: [{"sound": "city", "gain": -18}, {"sound": "birds", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "08:41 · САДОВАЯ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Улица в утреннем солнце: фасад фотоателье с вывеской «ФОТО», витрина с рамками, плитка тротуара, дерево с длинной тенью; напротив — дома, машины, голуби. Метка «08:41 · САДОВАЯ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "08:41 · САДОВАЯ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Восемь", "enter": "pop"}
      - id: s_ira
        # ВИЗУАЛ: Ира у витрины с фотоаппаратом на шее: бежевый свитер, пучок; на столе ретуши за стеклом —
        #         монитор со снимком, где она стирает провод штампом.
        # актёры: person, new:storefront, new:retouch_screen, callout
        # камера: Средний план, лёгкий наезд
        # анимация: @Ира — Ира поднимает фотоаппарат
        # анимация: @тридцать — Блик солнца по стеклу витрины
        # анимация: @стирает — На мониторе провод исчезает под штампом
        start: "@Ира-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ИРА, 34 · РЕТУШЁР", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ира у витрины с фотоаппаратом на шее: бежевый свитер, пучок; на столе ретуши за стеклом — монитор со снимком, где она стирает провод штампом.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ИРА, 34 · РЕТУШЁР", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Ира", "enter": "pop"}
      - id: s_group
        # ВИЗУАЛ: Через видоискатель: Лена в бумажной короне и Миша у витрины, между ними ещё человек в серой
        #         куртке — но он стоит в тени козырька, лица не видно. Рамка видоискателя, фокус, щелчок затвора.
        # актёры: person, new:storefront, new:sidewalk, new:viewfinder
        # камера: Взгляд через видоискатель, фокусировка
        # анимация: @рождения — Лена поправляет корону
        # анимация: @снимает — Фокус, вспышка, щелчок
        start: "@Лена-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "08:41:12", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Через видоискатель: Лена в бумажной короне и Миша у витрины, между ними ещё человек в серой куртке — но он стоит в тени козырька, лица не видно. Рамка видоискателя, фокус, щелчок затвора.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "08:41:12", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@снимает", "enter": "pop"}
      - id: s_coffee
        # ВИЗУАЛ: Крупно: прилавок, два бумажных стакана кофе; на втором маркером «К» и две палочки сахара. Рука
        #         Иры замирает над вторым стаканом.
        # актёры: new:paper_cup, new:counter, human_hand
        # камера: Сверхкрупно, медленный наезд на букву «К»
        # анимация: @два — Пар над стаканами
        # анимация: @привычке — Рука тянется ко второму стакану и останавливается
        start: "@прилавке-0.22"
        transition: {"type": "dip"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ДЛЯ КОГО?", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Крупно: прилавок, два бумажных стакана кофе; на втором маркером «К» и две палочки сахара. Рука Иры замирает над вторым стаканом.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ДЛЯ КОГО?", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@помнит", "enter": "pop"}
    sfx:
      - {"sound": "chime", "at": "@Восемь", "gain": -14}
      - {"sound": "click", "at": "@стирает", "gain": -14}
      - {"sound": "shutter", "at": "@снимает", "gain": -14}
      - {"sound": "click", "at": "@два", "gain": -14}

  # ------------------------------------------------------------------ problem: Проблема — Пустое место
  # задача: Инцидент: на снимке пустое место; Ира видит след штампа; Лена уверена, что их было двое.
  # на экране: «СНАЧАЛА ЭТО ПРИНЯЛИ ЗА СБОЙ КАМЕРЫ»
  - id: problem
    text: "Восемь сорок четыре. Между Леной и Мишей — пустое место. Рука Лены лежит на чьём-то плече. Плеча нет. Камера глючит. Плитка за пустотой сдвинута. Ветка дерева повторяется дважды. Это штамп. Так закрашивают человека. Какого человека? Нас было двое."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: lena, say: "Камера глючит."}
      - {who: ira, say: "Это штамп. Так закрашивают человека."}
      - {who: lena, say: "Какого человека? Нас было двое."}
    shots:
      - id: p_screen
        # ВИЗУАЛ: Экран фотоаппарата в руках Иры: снимок 08:41 — Лена и Миша, между ними пустое место; рука Лены
        #         согнута на плече, которого нет. Короткая цифровая помеха и полсекунды тишины.
        # актёры: new:camera_back, new:photo, person, human_hand
        # камера: Крупно экран камеры, лёгкая дрожь рук
        # анимация: @Восемь — Снимок появляется на экране
        # анимация: @пустое — Помеха, пустое место подсвечивается рамкой
        # анимация: @плече — Наезд на руку Лены
        # анимация: @Плеча — Рука Лены обводится пунктиром — под ней пусто
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СНАЧАЛА ЭТО ПРИНЯЛИ ЗА СБОЙ КАМЕРЫ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Экран фотоаппарата в руках Иры: снимок 08:41 — Лена и Миша, между ними пустое место; рука Лены согнута на плече, которого нет. Короткая цифровая помеха и полсекунды тишины.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "08:44", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@пустое", "enter": "pop"}
      - id: p_lena
        # ВИЗУАЛ: Лена в бумажной короне за спиной Иры, с куском торта: смеётся, машет рукой.
        # актёры: person, new:studio_room, callout
        # камера: Средний план
        # анимация: @глючит — Лена отмахивается
        start: "@Камера-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СНАЧАЛА ЭТО ПРИНЯЛИ ЗА СБОЙ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Лена в бумажной короне за спиной Иры, с куском торта: смеётся, машет рукой.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "СНАЧАЛА ЭТО ПРИНЯЛИ ЗА СБОЙ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@глючит", "enter": "pop"}
      - id: p_zoom
        # ВИЗУАЛ: Монитор ретуши: снимок увеличен до пикселей; плитка за пустотой сдвинута на полплитки — рамка
        #         «СДВИГ»; ветка дерева повторена дважды — две одинаковые рамки «КОПИЯ» со стрелкой.
        # актёры: new:retouch_screen, new:photo, callout
        # камера: Резкий наезд в пиксели
        # анимация: @сдвинута — Рамка обводит сдвинутый шов плитки
        # анимация: @дважды — Две одинаковые ветки подсвечиваются
        # анимация: @штамп — Курсор-штамп мигает над пустотой
        start: "@Плитка-0.22"
        transition: {"type": "zoom"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СДВИГ ПЛИТКИ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Монитор ретуши: снимок увеличен до пикселей; плитка за пустотой сдвинута на полплитки — рамка «СДВИГ»; ветка дерева повторена дважды — две одинаковые рамки «КОПИЯ» со стрелкой.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "СДВИГ ПЛИТКИ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@сдвинута", "enter": "pop"}
            - {"actor": "badge", "x": 540, "y": 1190, "title": "КОПИЯ ВЕТКИ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@дважды", "enter": "pop"}
      - id: p_two
        # ВИЗУАЛ: Лена и Ира у монитора: Лена пожимает плечами. Ира смотрит на пустое место.
        # актёры: person, new:studio_room, new:retouch_screen
        # камера: Медленный наезд на лицо Иры
        # анимация: @двое — Лена показывает два пальца
        start: "@Какого-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "«НАС БЫЛО ДВОЕ»", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Лена и Ира у монитора: Лена пожимает плечами. Ира смотрит на пустое место.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "«НАС БЫЛО ДВОЕ»", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@двое", "enter": "pop"}
    sfx:
      - {"sound": "glitch", "at": "@пустое", "gain": -14}
      - {"sound": "pop", "at": "@глючит", "gain": -14}
      - {"sound": "blip", "at": "@сдвинута", "gain": -14}
      - {"sound": "blip", "at": "@дважды", "gain": -14}
      - {"sound": "heartbeat", "at": "@двое", "gain": -14}

  # ------------------------------------------------------------------ rule: Правило мира — Семь минут
  # задача: Масштаб растёт и правило проверено: везде не хватает одного мужчины; через семь минут Ира не помнит
  #         лица.
  # на экране: «СНИМОК → 7 МИНУТ → ПАМЯТЬ»
  - id: rule
    text: "К девяти таких снимков тысячи. Школьное фото девяносто восьмого года. Камера в супермаркете. Чья-то свадьба. Вокзал. Везде нет одного мужчины в серой куртке. Восемь пятьдесят одна. Ира вспоминает, кто стоял рядом с Леной. Куртку помнит. Лицо — нет. Прошло семь минут."
    shots:
      - id: r_school
        # ВИЗУАЛ: Школьное фото 1998 года (выцветший отпечаток с датой): три ряда учеников на ступенях школы; в
        #         последнем ряду пустое место, плечи соседей разомкнуты. Метка «09:02 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ»
        #         нет — метка «ФОТО 1998 · ПУСТОЕ МЕСТО».
        # актёры: new:photo, person, school, new:evidence
        # камера: Наезд, быстрая смена на ударе
        # анимация: @Школьное — Снимок падает на стол
        # анимация: @года — Рамка вокруг пустого места
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СНИМОК → 7 МИНУТ → ПАМЯТЬ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Школьное фото 1998 года (выцветший отпечаток с датой): три ряда учеников на ступенях школы; в последнем ряду пустое место, плечи соседей разомкнуты. Метка «09:02 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ» нет — метка «ФОТО 1998 · ПУСТОЕ МЕСТО».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "1998", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Школьное", "enter": "pop"}
      - id: r_market
        # ВИЗУАЛ: Камера наблюдения супермаркета, ч/б: полки, тележка едет сама по проходу; у кассы — пустое место
        #         в очереди.
        # актёры: cctv, new:shelves, new:evidence
        # камера: Статичная камера, рывок зума
        # анимация: @супермаркете — Тележка катится без человека
        start: "@Камера-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "CAM 03 · 08:52", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Камера наблюдения супермаркета, ч/б: полки, тележка едет сама по проходу; у кассы — пустое место в очереди.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "CAM 03 · 08:52", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Камера", "enter": "pop"}
      - id: r_wedding
        # ВИЗУАЛ: Свадебный снимок в парке: невеста и гости, у одного гостя рука на пустоте; конфетти застыло в
        #         воздухе.
        # актёры: new:photo, person, tree, particles
        # камера: Наезд
        # анимация: @свадьба — Снимок ложится на стопку
        start: "@свадьба-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СВАДЬБА · 2019", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Свадебный снимок в парке: невеста и гости, у одного гостя рука на пустоте; конфетти застыло в воздухе.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "СВАДЬБА · 2019", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@свадьба", "enter": "pop"}
      - id: r_station
        # ВИЗУАЛ: Камера зала ожидания вокзала: табло, скамьи; на скамье — пустое место между пассажирами, сумка
        #         стоит рядом с никем. Затем все четыре снимка рядом: на каждом в пустом месте пунктиром — один и
        #         тот же силуэт куртки, подпись «СЕРАЯ КУРТКА».
        # актёры: cctv, new:station_hall, new:photo, callout
        # камера: Отъезд — четыре снимка в ряд
        # анимация: @Вокзал — Камера вокзала
        # анимация: @мужчины — Отъезд: четыре снимка, пустые места обводятся
        # анимация: @куртке — Подпись «СЕРАЯ КУРТКА»
        start: "@Вокзал-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ОДИН И ТОТ ЖЕ МУЖЧИНА", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Камера зала ожидания вокзала: табло, скамьи; на скамье — пустое место между пассажирами, сумка стоит рядом с никем. Затем все четыре снимка рядом: на каждом в пустом месте пунктиром — один и тот же силуэт куртки, подпись «СЕРАЯ КУРТКА».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ОДИН И ТОТ ЖЕ МУЖЧИНА", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@куртке", "enter": "pop"}
      - id: r_memory
        # ВИЗУАЛ: Ира за столом ретуши, перед ней снимок 08:41. Схема правила поверх: «СНИМОК 08:44 → 7 МИНУТ →
        #         ПАМЯТЬ 08:51». Пустое место заполняется пунктиром серой куртки — но там, где лицо, пунктир не
        #         сходится.
        # актёры: person, new:retouch_screen, new:rule_card, new:photo
        # камера: Медленный наезд на снимок
        # анимация: @вспоминает — Пунктир куртки рисуется на пустом месте
        # анимация: @Куртку — Пунктир куртки вспыхивает
        # анимация: @Лицо — Пунктир лица рассыпается
        # анимация: @семь — Часы показывают 08:51
        start: "@пятьдесят-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СНИМОК → 7 МИН → ПАМЯТЬ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ира за столом ретуши, перед ней снимок 08:41. Схема правила поверх: «СНИМОК 08:44 → 7 МИНУТ → ПАМЯТЬ 08:51». Пустое место заполняется пунктиром серой куртки — но там, где лицо, пунктир не сходится.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "СНИМОК → 7 МИН → ПАМЯТЬ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@семь", "enter": "pop"}
    sfx:
      - {"sound": "shutter", "at": "@Школьное", "gain": -14}
      - {"sound": "shutter", "at": "@Камера", "gain": -14}
      - {"sound": "shutter", "at": "@свадьба", "gain": -14}
      - {"sound": "shutter", "at": "@Вокзал", "gain": -14}
      - {"sound": "boom", "at": "@куртке", "gain": -14}
      - {"sound": "glitch", "at": "@Лицо", "gain": -14}
      - {"sound": "blip", "at": "@семь", "gain": -14}

  # ------------------------------------------------------------------ call: Эскалация — Звонок
  # задача: Незнакомый голос знает Иру: «две ложки сахара» — второй кофе; он на вокзале и просит включить камеру.
  # на экране: «09:05 · НЕИЗВЕСТНЫЙ НОМЕР»
  - id: call
    text: "Девять ноль пять. Звонит незнакомый номер. Ира, ты меня помнишь? Кто это? Это Костя. Ты кладёшь мне две ложки сахара. Ира смотрит на второй стакан. Я на вокзале. Включи камеру над кассами."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: kostya, say: "Ира, ты меня помнишь?"}
      - {who: ira, say: "Кто это?"}
      - {who: kostya, say: "Это Костя. Ты кладёшь мне две ложки сахара."}
      - {who: kostya, say: "Я на вокзале. Включи камеру над кассами."}
    shots:
      - id: c_phone
        # ВИЗУАЛ: Телефон на столе вибрирует: «НЕИЗВЕСТНЫЙ НОМЕР · 09:05». Рядом снимок с пустым местом и два
        #         стакана кофе.
        # актёры: phone, new:paper_cup, new:counter, buzz
        # камера: Сверху, медленный наезд на экран
        # анимация: @Звонит — Телефон вибрирует
        # анимация: @помнишь — Экран вызова: идёт разговор 00:03
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:05 · НЕИЗВЕСТНЫЙ НОМЕР", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Телефон на столе вибрирует: «НЕИЗВЕСТНЫЙ НОМЕР · 09:05». Рядом снимок с пустым местом и два стакана кофе.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "НЕИЗВЕСТНЫЙ НОМЕР", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Звонит", "enter": "pop"}
      - id: c_ira
        # ВИЗУАЛ: Ира у окна ателье с телефоном у уха, за стеклом солнечная улица.
        # актёры: person, new:studio_room, callout
        # камера: Средний план, медленный наезд
        # анимация: @Кто — Ира хмурится
        # анимация: @Костя — На экране телефона подпись «КОСТЯ?»
        start: "@Кто-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "«КОСТЯ»", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ира у окна ателье с телефоном у уха, за стеклом солнечная улица.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "«КОСТЯ»", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Костя", "enter": "pop"}
      - id: c_cup
        # ВИЗУАЛ: Крупно: второй стакан, на крышке буква «К», рядом две пустые палочки сахара.
        # актёры: new:paper_cup, new:counter, human_hand
        # камера: Сверхкрупно, наезд на «К»
        # анимация: @сахара — Палочки сахара подсвечиваются
        # анимация: @стакан — Рука Иры касается стакана
        start: "@ложки-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "2 ЛОЖКИ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Крупно: второй стакан, на крышке буква «К», рядом две пустые палочки сахара.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "2 ЛОЖКИ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@сахара", "enter": "pop"}
      - id: c_kassy
        # ВИЗУАЛ: Ноутбук: сайт городских камер, плитка трансляций; курсор выбирает «ВОКЗАЛ · КАССЫ · LIVE».
        # актёры: new:retouch_screen, new:cam_grid
        # камера: Наезд на плитку вокзала
        # анимация: @Включи — Клик — трансляция открывается
        start: "@вокзале-0.22"
        transition: {"type": "zoom"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "LIVE · ВОКЗАЛ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ноутбук: сайт городских камер, плитка трансляций; курсор выбирает «ВОКЗАЛ · КАССЫ · LIVE».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "LIVE · ВОКЗАЛ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@кассами", "enter": "pop"}
    sfx:
      - {"sound": "buzz", "at": "@Звонит", "gain": -14}
      - {"sound": "heartbeat", "at": "@Костя", "gain": -14}
      - {"sound": "chime", "at": "@сахара", "gain": -14}
      - {"sound": "click", "at": "@Включи", "gain": -14}

  # ------------------------------------------------------------------ station: Раскрытие — Девять двенадцать
  # задача: Правило 2 на человеке: с фото в 08:44 — из мира в 09:12, двадцать восемь минут.
  # на экране: «09:12 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ»
  - id: station
    text: "Прямой эфир. Мужчина в серой куртке подходит к камере. Смотрит в объектив, как в глаза. Губы шевелятся. Не забывай. Девять двенадцать. Картинка дёргается. Его нет. В трубке гудки. Снимок опередил мир на двадцать восемь минут."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: kostya, say: "Не забывай."}
    shots:
      - id: v_cam
        # ВИЗУАЛ: Камера наблюдения над кассами, ч/б с лёгким цветом: очередь, табло, пассажиры; мужчина в серой
        #         куртке выходит из толпы и подходит прямо к объективу — лицо крупно, но в тени козырька кепки не
        #         разобрать, только губы.
        # актёры: cctv, new:station_hall, person
        # камера: Статичная камера наблюдения, рывок цифрового зума
        # анимация: @подходит — Мужчина идёт к камере, растёт в кадре
        # анимация: @объектив — Цифровой зум на лицо
        ambience: [{"sound": "hum", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:12 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Камера наблюдения над кассами, ч/б с лёгким цветом: очередь, табло, пассажиры; мужчина в серой куртке выходит из толпы и подходит прямо к объективу — лицо крупно, но в тени козырька кепки не разобрать, только губы.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "LIVE · CAM 07 · ВОКЗАЛ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@эфир", "enter": "pop"}
      - id: v_lips
        # ВИЗУАЛ: Цифровой зум до пикселей: лицо в тени козырька, видны только губы; субтитр чтения по губам «НЕ
        #         ЗАБЫВАЙ».
        # актёры: cctv, person, text
        # камера: Рывок цифрового зума, лёгкая тряска
        # анимация: @шевелятся — Губы двигаются
        # анимация: @забывай — Подпись чтения по губам
        start: "@Губы-0.22"
        transition: {"type": "zoom"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "«НЕ ЗАБЫВАЙ»", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Цифровой зум до пикселей: лицо в тени козырька, видны только губы; субтитр чтения по губам «НЕ ЗАБЫВАЙ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "«НЕ ЗАБЫВАЙ»", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@забывай", "enter": "pop"}
      - id: v_gone
        # ВИЗУАЛ: Таймкод 09:12:00; кадр рвётся помехой — полосы, сдвиг строк; через полсекунды картинка чистая:
        #         очередь та же, мужчины нет, турникет ещё качается.
        # актёры: cctv, new:station_hall, person, new:evidence
        # камера: Статично, тряска на помехе
        # анимация: @дёргается — Помеха
        # анимация: @нет — Пусто, турникет качается
        start: "@Девять-0.22"
        transition: {"type": "glitch"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:12 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Таймкод 09:12:00; кадр рвётся помехой — полосы, сдвиг строк; через полсекунды картинка чистая: очередь та же, мужчины нет, турникет ещё качается.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:12 · ПОВТОРНОЕ ИСЧЕЗНОВЕНИЕ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@двенадцать", "enter": "pop"}
      - id: v_rule
        # ВИЗУАЛ: Схема-таймлайн на листе дела: «08:44 СНИМОК» → «08:51 ПАМЯТЬ» → «09:12 МИР»; стрелка «28 МИНУТ»
        #         растёт между первой и последней меткой.
        # актёры: new:rule_card, new:timeline, new:evidence
        # камера: Панорама вдоль таймлайна
        # анимация: @опередил — Метка «МИР» гаснет
        # анимация: @Двадцать — Стрелка растёт, число 28 считает
        start: "@Снимок-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "СНИМОК → 28 МИН → МИР", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Схема-таймлайн на листе дела: «08:44 СНИМОК» → «08:51 ПАМЯТЬ» → «09:12 МИР»; стрелка «28 МИНУТ» растёт между первой и последней меткой.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "СНИМОК → 28 МИН → МИР", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@минут", "enter": "pop"}
    sfx:
      - {"sound": "blip", "at": "@эфир", "gain": -14}
      - {"sound": "heartbeat", "at": "@Губы", "gain": -14}
      - {"sound": "glitch", "at": "@дёргается", "gain": -14}
      - {"sound": "blip", "at": "@гудки", "gain": -14}
      - {"sound": "boom", "at": "@мир", "gain": -14}
      - {"sound": "riser", "at": "@Двадцать", "gain": -14}

  # ------------------------------------------------------------------ twist: Поворот — Свадебный альбом
  # задача: Щелчок: на свадебном фото Ира одна, рука держит пустоту; отражение мужчины в зеркале исчезает; кольцо
  #         есть — мужа нет.
  # на экране: «КОЛЬЦО ЕСТЬ. МУЖА НЕТ.»
  - id: twist
    text: "Ира достаёт свадебный альбом. На снимке она одна, в белом платье. Рука держит пустоту. В зеркале за спиной ещё виден мужчина. Секунду. Потом гаснет и отражение. Ира пытается вспомнить его лицо. Не может. Кольцо на пальце есть. Мужа нет."
    caption_marks: {"Мужа нет": "#ffb23e"}
    shots:
      - id: t_album
        # ВИЗУАЛ: Ящик стола выдвигается: альбом в бархатной обложке «НАША СВАДЬБА». Альбом раскрывается.
        # актёры: new:album, new:counter, human_hand
        # камера: Сверху, наезд
        # анимация: @достаёт — Ящик выдвигается
        # анимация: @альбом — Обложка открывается
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "КОЛЬЦО ЕСТЬ. МУЖА НЕТ.", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ящик стола выдвигается: альбом в бархатной обложке «НАША СВАДЬБА». Альбом раскрывается.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "НАША СВАДЬБА", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@альбом", "enter": "pop"}
      - id: t_photo
        # ВИЗУАЛ: Свадебный снимок в зале: Ира в белом платье, рука согнута под чужой локоть — пустота; за спиной
        #         большое зеркало в раме, в нём ещё видно отражение мужчины в костюме рядом с ней.
        # актёры: new:photo, person, new:mirror, new:wedding_hall
        # камера: Медленный наезд на зеркало
        # анимация: @платье — Блик по глянцу снимка
        # анимация: @пустоту — Рамка вокруг согнутой руки
        start: "@снимке-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "РУКА ДЕРЖИТ ПУСТОТУ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Свадебный снимок в зале: Ира в белом платье, рука согнута под чужой локоть — пустота; за спиной большое зеркало в раме, в нём ещё видно отражение мужчины в костюме рядом с ней.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "РУКА ДЕРЖИТ ПУСТОТУ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@пустоту", "enter": "pop"}
      - id: t_mirror
        # ВИЗУАЛ: Наезд на зеркало в раме за спиной Иры на снимке: в отражении рядом с ней ещё стоит мужчина в
        #         костюме, лицо не в фокусе. Помеха — отражение гаснет, в зеркале только она.
        # актёры: new:photo, new:mirror, person, callout
        # камера: Медленный наезд в зеркало
        # анимация: @мужчина — Отражение мужчины чуть дрожит
        # анимация: @Секунду — Метка секунды 0:01
        # анимация: @гаснет — Отражение гаснет помехой
        # анимация: @вспомнить — Пунктир лица рисуется и рассыпается
        start: "@зеркале-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ОТРАЖЕНИЕ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Наезд на зеркало в раме за спиной Иры на снимке: в отражении рядом с ней ещё стоит мужчина в костюме, лицо не в фокусе. Помеха — отражение гаснет, в зеркале только она.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ОТРАЖЕНИЕ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@мужчина", "enter": "pop"}
      - id: t_ring
        # ВИЗУАЛ: Крупно: рука Иры над альбомом, на безымянном пальце кольцо; тень от кольца на пустой половине
        #         снимка.
        # актёры: human_hand, new:photo, text
        # камера: Сверхкрупно, очень медленный наезд
        # анимация: @Кольцо — Блик на кольце
        # анимация: @Мужа — Надпись «МУЖА НЕТ»
        start: "@Кольцо-0.22"
        transition: {"type": "dip"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "КОЛЬЦО ЕСТЬ. МУЖА НЕТ.", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Крупно: рука Иры над альбомом, на безымянном пальце кольцо; тень от кольца на пустой половине снимка.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "КОЛЬЦО ЕСТЬ. МУЖА НЕТ.", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Мужа", "enter": "pop"}
    sfx:
      - {"sound": "scrape", "at": "@достаёт", "gain": -14}
      - {"sound": "shutter", "at": "@снимке", "gain": -14}
      - {"sound": "glitch", "at": "@гаснет", "gain": -14}
      - {"sound": "gong", "at": "@Мужа", "gain": -14}

  # ------------------------------------------------------------------ crossing: Эскалация — Перекрёсток
  # задача: Аномалия выходит из снимков в мир: люди исчезают на ходу, всё быстрее.
  # на экране: «09:20 · ДРОН · ЦЕНТР»
  - id: crossing
    text: "Девять двадцать. Съёмка с дрона. Люди на переходе. Женщина исчезает на полушаге. Потом мужчина с собакой. Потом десятки. Машины едут дальше. Двери автобуса открываются — выходить некому. У Кости было двадцать восемь минут. У них — секунды."
    shots:
      - id: x_drone
        # ВИЗУАЛ: Вид сверху с дрона: перекрёсток, зебра, люди-точки с тенями идут по переходу; машины, деревья,
        #         крыши. Оверлей дрона: высота, координаты, REC.
        # актёры: new:crossing_top, new:drone_hud
        # камера: Медленный дрейф дрона вниз
        # анимация: @Съёмка — Дрон дрейфует над перекрёстком
        # анимация: @переходе — Люди идут по зебре
        # анимация: @полушаге — Женщина в красном исчезает — тень остаётся на долю секунды
        # анимация: @собакой — Мужчина исчезает, собака на поводке убегает
        ambience: [{"sound": "city", "gain": -18}, {"sound": "wind", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:20 · ДРОН · ЦЕНТР", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Вид сверху с дрона: перекрёсток, зебра, люди-точки с тенями идут по переходу; машины, деревья, крыши. Оверлей дрона: высота, координаты, REC.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:20 · ДРОН", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Девять", "enter": "pop"}
      - id: x_many
        # ВИЗУАЛ: Дрон поднимается выше: весь квартал, на тротуарах точки людей гаснут одна за другой, счётчик
        #         «ЛЮДЕЙ В КАДРЕ» падает 214 → 37; машины продолжают ехать, автобус останавливается, двери
        #         открываются.
        # актёры: new:crossing_top, new:drone_hud, meter
        # камера: Подъём дрона, отъезд
        # анимация: @десятки — Точки людей гаснут волной
        # анимация: @Машины — Машины едут дальше
        start: "@десятки-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ЛЮДЕЙ В КАДРЕ 214 → 37", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Дрон поднимается выше: весь квартал, на тротуарах точки людей гаснут одна за другой, счётчик «ЛЮДЕЙ В КАДРЕ» падает 214 → 37; машины продолжают ехать, автобус останавливается, двери открываются.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ЛЮДЕЙ В КАДРЕ 214 → 37", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@десятки", "enter": "pop"}
      - id: x_bus
        # ВИЗУАЛ: Дрон ниже, над остановкой: автобус стоит, двери складываются; на остановке пусто, на скамейке
        #         стаканчик и сумка.
        # актёры: new:crossing_top, new:drone_hud
        # камера: Дрон снижается к остановке
        # анимация: @открываются — Двери автобуса открываются
        # анимация: @некому — Двери стоят открытыми, никто не выходит
        start: "@Двери-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ОСТАНОВКА · 0 ЧЕЛ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Дрон ниже, над остановкой: автобус стоит, двери складываются; на остановке пусто, на скамейке стаканчик и сумка.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ОСТАНОВКА · 0 ЧЕЛ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@некому", "enter": "pop"}
      - id: x_rule
        # ВИЗУАЛ: Лист дела: таймлайн «28 МИНУТ» сжимается в «СЕКУНДЫ».
        # актёры: new:timeline, new:rule_card
        # камера: Наезд
        # анимация: @секунды — Стрелка сжимается в точку
        start: "@Кости-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "28 МИН → СЕКУНДЫ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Лист дела: таймлайн «28 МИНУТ» сжимается в «СЕКУНДЫ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "28 МИН → СЕКУНДЫ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@секунды", "enter": "pop"}
    sfx:
      - {"sound": "glitch", "at": "@полушаге", "gain": -14}
      - {"sound": "glitch", "at": "@собакой", "gain": -14}
      - {"sound": "noise_sweep", "at": "@десятки", "gain": -14}
      - {"sound": "hiss", "at": "@открываются", "gain": -14}
      - {"sound": "slam", "at": "@секунды", "gain": -14}

  # ------------------------------------------------------------------ city: Эскалация — Ольховск
  # задача: Масштаб мира: город пропадает со спутникового снимка, дороги обрываются; диктор исчезает на полуслове.
  # на экране: «09:47 · ГОРОД НЕ ОБНАРУЖЕН»
  - id: city
    text: "Девять сорок семь. Два спутниковых снимка Ольховска с разницей в минуту. На первом — город. На втором — степь. Дороги к нему остались. Они обрываются в траве. Связь с Ольховском потеряна. Стул диктора пуст."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: anchor, say: "Связь с Ольховском потеряна."}
    shots:
      - id: g_sat1
        # ВИЗУАЛ: Спутниковый снимок сверху: город у реки — кварталы, крыши, дороги, мост, поля вокруг; оверлей
        #         «SAT · 09:46:00 · 3 М/ПИКС».
        # актёры: new:satellite, new:evidence
        # камера: Медленный наезд сверху
        # анимация: @снимка — Снимок прогружается полосами
        # анимация: @Ольховска — Подпись города проступает на снимке
        # анимация: @город — Рамка вокруг города
        ambience: [{"sound": "rumble", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:47 · ГОРОД НЕ ОБНАРУЖЕН", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Спутниковый снимок сверху: город у реки — кварталы, крыши, дороги, мост, поля вокруг; оверлей «SAT · 09:46:00 · 3 М/ПИКС».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:46 · SAT", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Девять", "enter": "pop"}
      - id: g_sat2
        # ВИЗУАЛ: Второй снимок прогружается поверх первого полосой: вместо города — ровная степь; дороги, мост и
        #         линия электропередачи доходят до края бывшего города и обрываются в траве. Метка «09:47 · ГОРОД
        #         НЕ ОБНАРУЖЕН». Низкий гул обрывается.
        # актёры: new:satellite, callout, new:evidence
        # камера: Наезд на обрыв дороги
        # анимация: @степь — Полоса прогрузки стирает город
        start: "@втором-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:47 · ГОРОД НЕ ОБНАРУЖЕН", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Второй снимок прогружается поверх первого полосой: вместо города — ровная степь; дороги, мост и линия электропередачи доходят до края бывшего города и обрываются в траве. Метка «09:47 · ГОРОД НЕ ОБНАРУЖЕН». Низкий гул обрывается.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:47 · ГОРОД НЕ ОБНАРУЖЕН", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@степь", "enter": "pop"}
      - id: g_road
        # ВИЗУАЛ: Цифровой зум на край бывшего города: асфальт с разметкой, мост и опоры ЛЭП доходят до травы и
        #         обрываются ровной линией; по дороге к обрыву едет одна машина.
        # актёры: new:satellite, callout
        # камера: Рывок зума, медленный дрейф вдоль дороги
        # анимация: @остались — Подсветка дорог к городу
        # анимация: @обрываются — Выноска к концу дороги
        start: "@Дороги-0.22"
        transition: {"type": "zoom"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ДОРОГА ОБРЫВАЕТСЯ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Цифровой зум на край бывшего города: асфальт с разметкой, мост и опоры ЛЭП доходят до травы и обрываются ровной линией; по дороге к обрыву едет одна машина.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ДОРОГА ОБРЫВАЕТСЯ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@обрываются", "enter": "pop"}
      - id: g_news
        # ВИЗУАЛ: Студия новостей: диктор за столом, бегущая строка «ОЛЬХОВСК: СВЯЗЬ ПОТЕРЯНА». Помеха — стул пуст
        #         и медленно поворачивается, листы ещё оседают на стол.
        # актёры: new:news_studio, new:evidence
        # камера: Статичная телекамера, лёгкий наезд
        # анимация: @потеряна — Диктор договаривает фразу
        # анимация: @Стул — Помеха, диктора нет
        # анимация: @пуст — Стул поворачивается
        start: "@Связь-0.22"
        transition: {"type": "glitch"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ОЛЬХОВСК: СВЯЗЬ ПОТЕРЯНА", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Студия новостей: диктор за столом, бегущая строка «ОЛЬХОВСК: СВЯЗЬ ПОТЕРЯНА». Помеха — стул пуст и медленно поворачивается, листы ещё оседают на стол.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ОЛЬХОВСК: СВЯЗЬ ПОТЕРЯНА", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Связь", "enter": "pop"}
    sfx:
      - {"sound": "typing", "at": "@снимка", "gain": -14}
      - {"sound": "boom", "at": "@степь", "gain": -14}
      - {"sound": "whoosh", "at": "@Дороги", "gain": -14}
      - {"sound": "glitch", "at": "@Стул", "gain": -14}

  # ------------------------------------------------------------------ dilemma: Эскалация — Не проверяй
  # задача: Выбор с ценой: узнать, сколько осталось, или не знать.
  # на экране: «ПРОВЕРИТЬ СЕБЯ?»
  - id: dilemma
    text: "Ателье. Лена собирает сумку. Не проверяй себя, Ир. Не знать — легче. Если знать — успею позвонить маме. Лена уходит к детям. Ира одна. Поднимает телефон."
    lines:                       # реплики героев: голос из voices, подпись говорящего на экране
      - {who: lena, say: "Не проверяй себя, Ир. Не знать — легче."}
      - {who: ira, say: "Если знать — успею позвонить маме."}
    shots:
      - id: d_studio
        # ВИЗУАЛ: Фотостудия ателье: белый бумажный фон, софтбоксы, штатив; Лена у двери с сумкой и остатком
        #         торта; Ира у фона.
        # актёры: new:studio_room, person, callout
        # камера: Медленный отъезд
        # анимация: @собирает — Лена застёгивает сумку
        # анимация: @легче — Лена смотрит на Иру
        transition: {"type": "dip"}
        ambience: [{"sound": "room", "gain": -18}]
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ПРОВЕРИТЬ СЕБЯ?", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Фотостудия ателье: белый бумажный фон, софтбоксы, штатив; Лена у двери с сумкой и остатком торта; Ира у фона.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "«НЕ ЗНАТЬ — ЛЕГЧЕ»", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@проверяй", "enter": "pop"}
      - id: d_choice
        # ВИЗУАЛ: Ира крупно у белого фона; поверх — выбор на листе дела: «СЕЛФИ: ЗНАТЬ, СКОЛЬКО ОСТАЛОСЬ» / «НЕ
        #         ПРОВЕРЯТЬ: НЕ ЗНАТЬ».
        # актёры: person, new:studio_room, card
        # камера: Наезд на лицо
        # анимация: @маме — Выбор появляется двумя карточками
        start: "@Если-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ЗНАТЬ / НЕ ЗНАТЬ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Ира крупно у белого фона; поверх — выбор на листе дела: «СЕЛФИ: ЗНАТЬ, СКОЛЬКО ОСТАЛОСЬ» / «НЕ ПРОВЕРЯТЬ: НЕ ЗНАТЬ».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ЗНАТЬ / НЕ ЗНАТЬ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@маме", "enter": "pop"}
      - id: d_alone
        # ВИЗУАЛ: Дверь ателье закрывается, колокольчик качается. Ира одна в студии, поднимает телефон фронтальной
        #         камерой к себе.
        # актёры: new:studio_room, person, phone
        # камера: Медленный наезд
        # анимация: @детям — Колокольчик над дверью качается
        start: "@уходит-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:54", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Дверь ателье закрывается, колокольчик качается. Ира одна в студии, поднимает телефон фронтальной камерой к себе.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:54", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@одна", "enter": "pop"}
      - id: d_phone
        # ВИЗУАЛ: Экран телефона в руке Иры: камера переключается на фронтальную, в кадре её лицо и белый фон
        #         студии; палец над кнопкой затвора.
        # актёры: phone, human_hand, new:studio_room
        # камера: Крупно, медленный наезд на кнопку
        # анимация: @телефон — Камера переключается на фронтальную
        start: "@Поднимает-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ФРОНТАЛЬНАЯ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Экран телефона в руке Иры: камера переключается на фронтальную, в кадре её лицо и белый фон студии; палец над кнопкой затвора.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ФРОНТАЛЬНАЯ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@телефон", "enter": "pop"}
    sfx:
      - {"sound": "click", "at": "@собирает", "gain": -14}
      - {"sound": "blip", "at": "@маме", "gain": -14}
      - {"sound": "chime", "at": "@детям", "gain": -14}
      - {"sound": "click", "at": "@телефон", "gain": -14}

  # ------------------------------------------------------------------ cliff: Обрыв — Селфи
  # задача: Финальный поворот: на селфи её нет, телефон висит в воздухе; на последнем снимке нет и комнаты.
  # на экране: «09:55 · ОБЪЕКТ НЕ ОБНАРУЖЕН»
  - id: cliff
    text: "Щелчок. Ира открывает снимок. На нём пустая студия. И телефон, который висит в воздухе. Телефон падает на пол. Ещё щелчок. На последнем снимке нет даже комнаты."
    shots:
      - id: f_selfie
        # ВИЗУАЛ: Экран телефона: интерфейс камеры, затвор. Затем снимок в галерее: пустая белая студия,
        #         софтбоксы, штатив — и телефон, висящий в воздухе на высоте руки, без руки.
        # актёры: phone, new:studio_room, new:phone_float
        # камера: Крупно экран, медленный наезд на висящий телефон
        # анимация: @Щелчок — Белая вспышка затвора
        transition: {"type": "flash"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:55 · ОБЪЕКТ НЕ ОБНАРУЖЕН", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Экран телефона: интерфейс камеры, затвор. Затем снимок в галерее: пустая белая студия, софтбоксы, штатив — и телефон, висящий в воздухе на высоте руки, без руки.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:55:02", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@Щелчок", "enter": "pop"}
      - id: f_gallery
        # ВИЗУАЛ: Снимок в галерее: пустая белая студия, софтбоксы, штатив — и телефон, висящий в воздухе на
        #         высоте руки, без руки.
        # актёры: phone, new:studio_room, new:phone_float, callout
        # камера: Медленный наезд на висящий телефон
        # анимация: @пустая — Снимок открывается в галерее
        # анимация: @студия — Камера скользит по пустой студии
        # анимация: @воздухе — Рамка вокруг висящего телефона
        start: "@открывает-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "ТЕЛЕФОН · БЕЗ РУКИ", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Снимок в галерее: пустая белая студия, софтбоксы, штатив — и телефон, висящий в воздухе на высоте руки, без руки.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "ТЕЛЕФОН · БЕЗ РУКИ", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@воздухе", "enter": "pop"}
      - id: f_fall
        # ВИЗУАЛ: Вид студии: телефон падает в пустоте на пол, кувыркается; удар; экран вспыхивает — ещё щелчок.
        #         Тишина.
        # актёры: new:studio_room, new:phone_float
        # камера: Камера падает вместе с телефоном, удар — тряска
        # анимация: @падает — Телефон падает и кувыркается
        # анимация: @пол — Удар об пол, тряска
        # анимация: @Ещё — Вспышка: случайный снимок
        start: "@падает-0.22"
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:55:31", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Вид студии: телефон падает в пустоте на пол, кувыркается; удар; экран вспыхивает — ещё щелчок. Тишина.", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}
            - {"actor": "badge", "x": 540, "y": 1080, "title": "09:55:31", "size": 44, "style": "solid", "color": "#ffb23e", "at": "@щелчок#2", "enter": "pop"}
      - id: f_void
        # ВИЗУАЛ: Последний снимок в галерее: только ровная белёсая пустота с горизонтом, как засвеченная плёнка;
        #         в углу дата 09:55. Метка «ОБЪЕКТ НЕ ОБНАРУЖЕН».
        # актёры: new:photo, new:evidence
        # камера: Почти статично, медленный отъезд
        # анимация: @комнаты — Снимок бледнеет до белого
        start: "@последнем-0.22"
        transition: {"type": "fade"}
        draw:
          bg: {"type": "radial", "at": "50% 38%", "stops": [[0, "#232a40"], [1, "#0c0f19"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {"actor": "text", "text": "09:55 · ОБЪЕКТ НЕ ОБНАРУЖЕН", "x": 540, "y": 560, "size": 76, "width": 940, "color": "#ffffff", "at": "@start", "enter": "pop"}
            - {"actor": "text", "text": "Последний снимок в галерее: только ровная белёсая пустота с горизонтом, как засвеченная плёнка; в углу дата 09:55. Метка «ОБЪЕКТ НЕ ОБНАРУЖЕН».", "x": 540, "y": 900, "size": 34, "width": 900, "weight": 500, "color": "#9aa6c4", "at": "@start", "enter": "fade"}

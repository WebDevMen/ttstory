      - {sound: click, at: "@два", gain: -16}

  # ------------------------------------------------------------------ 3. PROBLEM — 08:44: пустое место; штамп
  - id: problem
    text: "Восемь сорок четыре. Между Леной и Мишей — пустое место. Рука Лены лежит на чьём-то плече. Плеча нет. Камера глючит. Плитка за пустотой сдвинута. Ветка дерева повторяется дважды. Это штамп. Так закрашивают человека. Какого человека? Нас было двое."
    lines:
      - {who: lena, say: "Камера глючит."}
      - {who: ira, say: "Это штамп. Так закрашивают человека."}
      - {who: lena, say: "Какого человека? Нас было двое."}
    caption_marks: {"пустое место": "#ffb23e"}
    shots:
      - id: p_screen
        draw:
          bg: *desk_bg
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@плече", z: 1.0, x: 540, y: 960}, {t: "@Плеча", z: 1.45, x: 520, y: 900, ease: inout}], shakes: [{at: "@пустое", amp: 6, dur: 0.3}]}
          layers:
            - actor: camera_back
              x: 540
              y: 960
              w: 1040
              h: 820
              hud: "08:41  1/250  F5.6"
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 750, h: 680, fill: "#0b0b0b", origin: top-left}
                - actor: photo
                  x: 375
                  y: 340
                  w: 572
                  h: 680
                  border: 0
                  shadow: 0
                  date: "08:41"
                  glitch: [{at: "@пустое", dur: 0.3}]
                  marks: [{of: gap, at: "@пустое", until: "@Камера-0.25", pad: 6}]
                  children: [{actor: group, x: 0, y: 0, scale: 0.773, children: *group_after}]
            - {<<: *ev, src: "СВИДЕТЕЛЬСТВО 002 · ЭКРАН КАМЕРЫ", time: "08:44:05"}
      - id: p_lena
        start: "@Камера-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.05}]}
          layers:
            - {actor: studio_room, x: -160, y: 0, w: 1400, h: 1920, floor_y: 1500, door: false}
            - {<<: *lena, x: 540, y: 2900, h: 2400, arms: [down, wave], face: laugh, talk: [["@Камера", "@глючит.end"]]}
            - {actor: text, slot: title, at: "@глючит", enter: fade, text: "СНАЧАЛА ЭТО ПРИНЯЛИ ЗА СБОЙ", font: cond, size: 84, weight: 700, color: "#f6f2ea", lines: 2, width: 900, bg: {color: "rgba(18,16,14,.85)", pad: 24}}
      - id: p_zoom
        start: "@Плитка-0.22"
        transition: {type: zoom}
        draw:
          bg: "#141517"
          camera: {keys: [{t: 0, z: 1.0}]}
          layers:
            - actor: retouch_screen
              x: 540
              y: 900
              w: 1000
              h: 1160
              file: "IMG_0841.JPG"
              zoom: "300%"
              cursor: [{at: 0, v: [330, 760]}, {at: "@штамп", v: [330, 640], dur: 0.6}, {at: "@человека", v: [360, 600], dur: 0.6}]
              cursor_on: [{at: 0, v: 0}, {at: "@штамп", v: 1, dur: 0.1}]
              children:
                - actor: photo
                  x: 335
                  y: 529
                  w: 670
                  h: 1058
                  border: 0
                  shadow: 0
                  grain: 0.1
                  marks:
                    - {in: grp, x: 370, y: 700, w: 120, h: 200, at: "@сдвинута", dash: "1 0", pad: 0}
                    - {in: grp, x: 500, y: 110, w: 150, h: 170, at: "@дважды", dash: "1 0", pad: 0}
                    - {in: grp, x: 580, y: 110, w: 150, h: 170, at: "@дважды+0.15", dash: "1 0", pad: 0}
                  children: [{actor: group, id: grp, x: -169, y: 26, scale: 1.3, children: *group_after}]
            - {<<: *tag, at: "@сдвинута", x: 680, y: 1330, text: "СДВИГ ПЛИТКИ"}
            - {<<: *tag, at: "@дважды", x: 695, y: 780, text: "КОПИЯ ВЕТКИ"}
            - {<<: *ev, src: "СВИДЕТЕЛЬСТВО 002 · РЕТУШЬ", time: "08:46:40"}
      - id: p_two
        start: "@Какого-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.08, y: 900}]}
          layers:
            - {actor: studio_room, x: -160, y: 0, w: 1400, h: 1920, floor_y: 1500, door: false}
            - {<<: *lena, x: 720, y: 2200, h: 1650, arms: [down, point], face: calm, talk: [["@Какого", "@двое.end"]]}
            - {<<: *ira, x: 330, y: 2500, h: 1900, view: back}
            - {actor: text, slot: title, at: "@двое", enter: pop, text: "«НАС БЫЛО ДВОЕ»", font: cond, size: 96, weight: 700, color: "#f6f2ea", bg: {color: "rgba(18,16,14,.85)", pad: 24}}
    sfx:
      - {sound: glitch, at: "@пустое", gain: -12}
      - {sound: blip, at: "@сдвинута", gain: -16}
      - {sound: blip, at: "@дважды", gain: -16}
      - {sound: heartbeat, at: "@двое", gain: -10}

  # ------------------------------------------------------------------ 4. RULE — снимки со всего города; через 7 минут — память
  - id: rule
    text: "К девяти таких снимков тысячи. Школьное фото девяносто восьмого года. Камера в супермаркете. Чья-то свадьба. Вокзал. Везде нет одного мужчины в серой куртке. Восемь пятьдесят одна. Ира вспоминает, кто стоял рядом с Леной. Куртку помнит. Лицо — нет. Прошло семь минут."
    caption_marks: {"серой куртке": "#ffb23e", "семь минут": "#ffb23e"}
    shots:
      - id: r_school
        draw:
          bg: *desk_bg
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.08}]}
          layers:
            - {actor: text, slot: title, at: "@девяти", enter: fade, until: "@Школьное-0.1", exit: fade, text: "ТЫСЯЧИ СНИМКОВ", font: cond, size: 96, weight: 700, color: "#f6f2ea"}
            - actor: photo
              x: 540
              y: 960
              w: 780
              h: 600
              rot: 2
              tone: faded
              date: "'98 05 25"
              at: "@Школьное-0.15"
              enter: {type: drop, dur: 0.3}
              marks: [{of: gap, at: "@года", pad: 4}]
              children:

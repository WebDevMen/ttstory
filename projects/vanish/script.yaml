# СЦЕНАРИЙ: «Люди выпадают из фотографий» — одна история, ~3 минуты (вымысел, мистическая фантастика).
# Идея пользователя (человек пропадает со снимка → из памяти → из мира; мужчина в серой куртке на всех снимках;
# мать в зеркале на старом фото; перекрёсток с дрона; город на спутниковом снимке; селфи без себя) переписана в одну
# историю по правилам ясности (docs/SCRIPTING.md §14.6): героиня-точка зрения Ира, реплики героев своими голосами,
# два правила мира с цифрами (7 минут → память, 28 минут → мир), улика «второй кофе» трижды, дилемма «сделать селфи?».
# Проверка: python3 vg.py script check vanish [--tts] · документ: python3 vg.py script render vanish


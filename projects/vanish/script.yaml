brief:
  goal: "Рассказать одну понятную мистическую историю так, чтобы зритель досмотрел три минуты, понял оба правила мира, узнал мужа раньше героини — и поспорил в комментариях, сделал бы он это селфи."
  kpi: [completion, comments, rewatch, shares, follows]
  audience:
    who: "Зрители мистики, «Чёрного зеркала», страшилок-«свидетельств» и сюжетных роликов в ленте"
    age: "16–34"
    interests: [мистика, фантастика, необъяснимое, фотография, «Чёрное зеркало», эффект Манделы]
    pains: ["хорроры со скримерами и монстрами вместо идеи", "непонятно, кто герой и за кого бояться", "финал «продолжение следует» без ответа"]
    desires: ["простое правило, по которому можно «играть» самому", "жуть из обычных вещей — фотографий, кофе, кольца", "финал, после которого хочется пересмотреть начало"]
    knowledge: "Все фотографируют каждый день и знают, как выглядит «замазанный» человек на снимке; про этот мир ничего не знают — всё объясняется по ходу"
  promise: "Одна история ретушёра Иры: со снимков пропадает мужчина в серой куртке, через семь минут его забывают, через двадцать восемь — его нет; и финальное селфи, после которого смотришь на свои фотографии иначе."
  tone: "Солнечное будничное утро, тёплая плёночная фотография; жуть — в тишине, в пустом месте между людьми, в сдвинутой плитке. Чем больше масштаб — тем спокойнее подача: камеры, дрон, спутник, новости."
  keywords: ["пропал с фотографии", "люди исчезают", "фотография", "мистика", "селфи"]
  constraints:
    - "Вымысел целиком: Ира, Костя, Лена, ателье на Садовой и город Ольховск придуманы; реальны штамп в ретуши, стёртые с советских снимков люди, ложные воспоминания по поддельному фото, ежедневная спутниковая съёмка суши"
    - "Одна точка зрения — Ира: зритель видит только то, что видит она (снимки, звонок, камеры, новости)"
    - "Два правила мира, оба проверены на Косте с цифрами: снимок → 7 минут → память; снимок → 28 минут → мир (дальше интервал сокращается)"
    - "Без монстров, крови, чёрных силуэтов и дыма: человек просто отсутствует; 13+"
    - "Из идеи пользователя переработаны: мать в зеркале → муж в зеркале на свадебном фото (та же сцена, больше ставка); оператор с селфи → сама Ира"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах. Ретушёры убирают людей со снимков штампом — копируют соседний
    кусок фона поверх; поэтому на подделках повторяются ветки, плитка и узоры. В СССР людей стирали с официальных
    фотографий — самый известный пример: нарком Ежов рядом со Сталиным у канала. Опыт 2002 года: по поддельной фотографии
    половина участников «вспомнила» полёт на воздушном шаре, которого не было, — фото управляет памятью. Спутники
    Planet снимают всю сушу Земли каждый день — поэтому два снимка одного города подряд в мире истории возможны.
    И бонус для второй части: город Агло существовал только на карте — как ловушка картографов, — а потом стал «настоящим».
  facts:
    - id: f1
      text: "После ареста наркома Николая Ежова стёрли с официальных фотографий; самый известный пример — снимок, где он стоял рядом со Сталиным у канала Москва — Волга."
      source: "https://en.wikipedia.org/wiki/Censorship_of_images_in_the_Soviet_Union"
      confidence: high
    - id: f2
      text: "Опыт Wade, Garry, Read, Lindsay (2002): по поддельной фотографии полёта на воздушном шаре половина участников создала полное или частичное ложное воспоминание."
      source: "https://link.springer.com/article/10.3758/BF03196318"
      confidence: high
    - id: f3
      text: "Инструмент «штамп» (Clone Stamp) копирует пиксели из одной части снимка в другую — так ретушёры закрывают лишние предметы и людей; след подделки — повторяющиеся фрагменты фона."
      source: "https://en.wikipedia.org/wiki/Clone_tool"
      confidence: medium
    - id: f4
      text: "Спутники PlanetScope (Planet) снимают всю сушу Земли каждый день с разрешением около трёх метров."
      source: "https://www.earthdata.nasa.gov/about/csda/vendor-planet"
      confidence: medium
    - id: f5
      text: "Агло (штат Нью-Йорк) — несуществующий город, который картографы General Drafting в 1930-х нанесли на карту как ловушку для копировщиков; позже рядом появилась «Agloe Lodge», а в 2014 году название попало в базу USGS."
      source: "https://en.wikipedia.org/wiki/Agloe,_New_York"
      confidence: high
  angles:
    - id: a1
      archetype: rule_break
      text: "Фотография перестаёт быть памятью и становится прогнозом: человек сначала пропадает со всех снимков, через семь минут — из памяти, через двадцать восемь — из мира"
      paradox: "Снимок, который всегда хранил прошлое, первым показывает будущее — и чем дольше смотришь на пустое место, тем меньше помнишь, кто там стоял"
      score: 9
      why: "Правило мира понятно с первого кадра (пустое место между людьми), проверяется цифрами (08:44 → 08:51 → 09:12) и даёт финал-селфи без нового чуда."
    - id: a2
      archetype: unreliable
      text: "Героиня рассказывает про незнакомца в серой куртке — а зритель раньше неё понимает, что это её муж (два кофе, ложки сахара, кольцо)"
      paradox: "Самый близкий человек становится незнакомцем, хотя все улики у неё на столе"
      score: 9
      why: "Личная ставка внутри глобальной аномалии; взят внутрь a1 как главный поворот."
    - id: a3
      archetype: inhuman_pov
      text: "История глазами фотоаппарата, который первым видит, кого уже нет"
      paradox: "Камера помнит лучше людей — и поэтому первой забывает"
      score: 6
      why: "Холодно и без героя, за которого страшно; оставлено как финальная мысль."
    - id: a4
      archetype: what_if
      text: "Что если исчезают места: на спутнике город, а через минуту — степь, и дороги обрываются в траве"
      paradox: "Дороги ещё ведут туда, чего уже нет"
      score: 7
      why: "Сильная картинка масштаба, но без героя это обзор; стала эскалацией внутри a1."
  chosen_angle: a1
  insights:
    - "Пустое место между людьми на снимке понятно без звука за секунду — лучший первый кадр."
    - "Ретушёр — героиня, которая профессионально видит подделку: сдвинутая плитка и повторённая ветка — след «штампа». Это делает мир честным."
    - "Зритель узнаёт мужа раньше Иры (второй кофе, «две ложки сахара», кольцо) — драматическая ирония держит середину."
    - "Масштаб растёт будничными источниками: снимок → школьное фото, камера супермаркета, свадьба, вокзал → дрон над перекрёстком → спутник → новости. Подача тем спокойнее, чем больше беда."
    - "Дилемма «проверить себя селфи или не знать» понятна каждому, у кого в руке телефон, — и даёт вопрос на одно слово."

story:
  logline: "Ира, ретушёр, хочет понять, кто пропал с её снимка, но через семь минут пропавших забывают, а через двадцать восемь их нет; не успеет — потеряет человека, которого любила, и даже память о нём."
  retell: "С фотографий пропадает мужчина в серой куртке, и Ира его забывает. Он звонит ей — это её муж Костя, — и исчезает на камере вокзала. Люди и города пропадают всё быстрее, и Ира делает селфи, на котором её нет."
  premise: "Что если человек сначала пропадает со всех своих фотографий — а через семь минут его забывают, через двадцать восемь его нет?"
  paradox: "Фотография всегда хранила прошлое, а теперь первой показывает будущее; и единственный способ узнать, сколько тебе осталось, — сфотографировать себя"
  genre: "мистическая фантастика, глобальная аномалия"
  series: {name: "Выпадение", part: 1, of: 3, next: vanish2, cliff: "Селфи без себя: на снимке Иры нет её самой, потом нет и комнаты"}
  world_rules:
    - id: r1
      rule: "Человек сначала пропадает со всех своих снимков — от детских до вчерашних; через семь минут его забывают все, кто видел пустое место"
      test: "Снимок у ателье: 08:44 — пустое место между Леной и Мишей; 08:51 — Ира помнит серую куртку, но не лицо"
      shown_in: rule
      basis: f2
    - id: r2
      rule: "Снимок опережает мир: кто пропал со снимков, исчезает и в жизни — у Кости через двадцать восемь минут, дальше интервал сокращается до секунд"
      test: "Костя: со снимка в 08:44, с камеры вокзала в 09:12 — двадцать восемь минут; у людей на перекрёстке в 09:20 — секунды; Ольховск в 09:47 — за минуту"
      shown_in: station
      basis: f1
  characters:
    - id: ira
      name: "Ира"
      intro: "Ира, тридцать четыре года, ретушёр. Двадцать лет стирает с чужих снимков лишнее."
      role: "героиня, точка зрения; ретушёр фотоателье на Садовой"
      want: "понять, кто стоял на пустом месте, и вернуть его хотя бы в память"
      fear: "что пустое место было кем-то, кого она любила"
      look: "тёмные волосы в пучке, бежевый свитер, на пальце кольцо, фотоаппарат на шее"
      arc: "от «здесь кто-то стоял» (профессиональное любопытство) — к селфи, на котором её нет"
    - id: kostya
      name: "Костя"
      intro: "Это Костя."
      role: "муж Иры, «мужчина в серой куртке» — первый случай, 08:41"
      want: "чтобы жена его вспомнила — хотя бы на минуту"
      fear: "исчезнуть для неё раньше, чем исчезнет совсем"
      look: "серая куртка, всегда расстёгнута; на всех снимках — только пустое место"
      arc: "из пустого места на снимке — в голос в трубке — в лицо на камере вокзала — в пустоту"
    - id: lena
      name: "Лена"
      intro: "Лена, администратор. У неё день рождения."
      role: "коллега Иры, администратор ателье; голос «не знать — легче»"
      want: "жить как раньше: день рождения, торт, дети"
      fear: "узнать о себе то, что нельзя исправить"
      look: "рыжее каре, зелёное платье, бумажная корона «С ДР»"
      arc: "«камера глючит» → «нас было двое» → уходит к детям и просит Иру не проверять себя"
    - id: anchor
      name: "Диктор новостей"
      role: "голос будничной хроники: чем страшнее новость, тем ровнее тон"
      want: "дочитать выпуск"
      fear: "—"
      intro: "Стул диктора пуст."
      look: "студия новостей, бегущая строка; в конце — пустой стул"
      arc: "читает новость про Ольховск — и пропадает на полуслове"
  twists:
    - id: t1
      what: "Мужчина в серой куртке, которого не хватает на всех снимках, — муж Иры Костя; второй кофе по привычке был для него, кольцо на её пальце — от него"
      setup: [setup, problem, call]
      payoff: twist
    - id: t2
      what: "Фотографии не стирают людей — они первыми фиксируют, кто уже перестал существовать: на селфи Иры нет её самой, а потом нет и комнаты"
      setup: [hook, station, city]
      payoff: cliff
  dilemmas:
    - id: d1
      beat: dilemma
      who: ira
      question: "Сфотографировать себя и узнать, сколько осталось, или не проверять и жить, пока живётся?"
      options: ["Селфи: если её нет на снимке, у неё семь минут, пока её помнят, — успеть позвонить маме; но знать это страшнее всего", "Не проверять: спокойные минуты с Леной и тортом — но, может быть, последние, и попрощаться она не успеет"]

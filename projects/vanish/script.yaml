          - {at: "@щелчок#2", type: chip, text: "09:55:31"}
        sfx:
          - {at: "@пол", sound: drop}
          - {at: "@щелчок#2", sound: shutter}
        transition: cut
      - id: f_void
        at: "@последнем-0.1"
        visual: "Последний снимок в галерее: только ровная белёсая пустота с горизонтом, как засвеченная плёнка; в углу дата 09:55. Метка «ОБЪЕКТ НЕ ОБНАРУЖЕН»."
        actors: [new:photo, new:evidence]
        camera: "Почти статично, медленный отъезд"
        animation:
          - {at: "@комнаты", what: "Снимок бледнеет до белого"}
        graphics:
          - {at: "@комнаты", type: chip, text: "09:55 · ОБЪЕКТ НЕ ОБНАРУЖЕН"}
        sfx:
          - {at: "@комнаты", sound: hiss}
        transition: fade

  # ------------------------------------------------------------------ 12. CTA — мысль-поворот + вопрос-выбор + вторая часть
  - id: cta
    role: cta
    title: "Ты бы сделал селфи?"
    goal: "Финальная мысль меняет смысл начала; вопрос на одно слово; вторая часть."
    vo: "Может, снимки никого не стирают. Может, они просто первыми видят, кого уже нет. А ты бы сделал это селфи? Да или нет? Во второй части люди вспомнят город, которого никогда не было."
    on_screen: "ТЫ БЫ СДЕЛАЛ ЭТО СЕЛФИ?"
    devices: [comment_bait, follow_trigger, loop_ending, callback, rewatch_trigger]
    music: drone
    shots:
      - id: z_photo
        visual: "Возврат к первому снимку у витрины (08:41): трое — двое — пустое место; камера уходит к стаканам кофе за стеклом: буква «К». Над ними — «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ»."
        actors: [new:photo, new:storefront, person, new:paper_cup, text]
        camera: "Медленный наезд на стакан с «К»"
        animation:
          - {at: "@снимки", what: "Снимок появляется из белого"}
          - {at: "@стирают", what: "Наезд на стакан «К»"}
        graphics:
          - {at: "@стирают", type: chip, text: "08:41"}
        sfx:
          - {at: "@снимки", sound: shutter}
        transition: dissolve
      - id: z_text
        at: "@первыми-0.1"
        visual: "Крупно стакан «К» на снимке; поверх фраза «СНИМКИ ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ»."
        actors: [new:photo, new:paper_cup, text]
        camera: "Очень медленный наезд"
        animation:
          - {at: "@видят", what: "Фраза печатается"}
        graphics:
          - {at: "@видят", type: text, text: "ПЕРВЫМИ ВИДЯТ, КОГО УЖЕ НЕТ"}
        sfx:
          - {at: "@видят", sound: boom}
        transition: cut
      - id: z_cta
        at: "@ты-0.1"
        visual: "Экран камеры телефона, фронталка смотрит на зрителя; кнопка затвора пульсирует; вопрос «ТЫ БЫ СДЕЛАЛ ЭТО СЕЛФИ? ДА / НЕТ»; ниже — «ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО»."
        actors: [phone, text, card]
        camera: "Медленный наезд на кнопку затвора"
        animation:
          - {at: "@селфи", what: "Кнопка затвора пульсирует"}
          - {at: "@Да", what: "Кнопки ДА / НЕТ"}
        graphics:
          - {at: "@селфи", type: text, text: "ДА ИЛИ НЕТ?"}
        sfx:
          - {at: "@селфи", sound: click}
        transition: cut
      - id: z_part2
        at: "@Во-0.1"
        visual: "Спутниковый снимок незнакомого города на месте степи — проступает, как проявка; карточка «ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО»."
        actors: [new:satellite, card]
        camera: "Медленный отъезд"
        animation:
          - {at: "@вспомнят", what: "Город проявляется на снимке"}
          - {at: "@никогда", what: "Карточка «ЧАСТЬ 2»"}
        graphics:
          - {at: "@никогда", type: card, text: "ЧАСТЬ 2: ГОРОД, КОТОРОГО НЕ БЫЛО"}

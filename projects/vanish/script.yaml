review:
  scores: {hook: 9, clarity: 8, pacing: 8, novelty: 9, emotion: 9, payoff: 9, visuals: 8, cta: 9, platform: 8, accuracy: 8}
  weak_points:
    - "Три минуты — длинно для ленты: держится на часах (08:41 → 08:44 → 08:51 → 09:12 → 09:47) и на загадке «для кого второй кофе»."
    - "Зритель может понять, что пропавший — муж, раньше поворота; это задумано (драматическая ирония), удар держит сцена с зеркалом."
    - "Финальная мысль «снимки первыми видят» — без объяснения механики: это продолжение во второй части."
  improvements:
    - "Из идеи пользователя взята последовательность масштаба, но добавлена героиня-ретушёр: она профессионально видит след штампа — это делает «неправильный фон» понятным."
    - "Мать в зеркале заменена на мужа в зеркале свадебного снимка: та же сцена, но ставка личная и закрывает улику «второй кофе»."
    - "Правила проверены на одном человеке цифрами: 08:44 → 08:51 (память) → 09:12 (мир)."
    - "Финальная дилемма «проверить себя или не знать» — вопрос на одно слово для комментариев."

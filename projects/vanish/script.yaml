beats:
  # ------------------------------------------------------------------ 1. HOOK — правило-предупреждение; пустое место на снимке
  - id: hook
    role: hook
    title: "Семь минут"
    goal: "Сразу правило, срок и цена: пропал со снимка — через семь минут забудешь, что он был."
    vo: "Человек пропал с твоей фотографии? У тебя семь минут. Потом ты забудешь, что он был."
    on_screen: "ПРОПАЛ С ФОТОГРАФИИ? 7 МИНУТ"
    devices: [open_loop, visual_proof, text_reinforcement, sound_hit, direct_address]
    music: drone
    marks: {"семь минут": "#ffb23e"}
    accent: "#ffb23e"
    shots:
      - id: k_photo
        visual: "Солнечный снимок-отпечаток (белая рамка, оранжевая дата 08:41) лежит на светлом столе: у витрины фотоателье стоят трое коллег, смеются; на прилавке за стеклом два стакана кофе, на одном буква «К» (пасхалка). На слове «пропал» — короткая цифровая помеха, и средний человек исчезает: остальные в тех же позах, рука девушки обнимает воздух, плитка за пустотой сдвинута."
        actors: [new:photo, new:storefront, new:sidewalk, person, new:paper_cup, new:evidence]

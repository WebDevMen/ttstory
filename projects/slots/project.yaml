      - id: a_team
        transition: {type: whip_y, flash: 0.08}
        effects:
          - {type: glow, at: [540, 420], sigma: 360, color: [1.0, 0.8, 0.3], intensity: 0.12}
        look: {bloom: [0.65, 0.4], grade: {contrast: 0.1, sat: 1.1}}
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.12, y: 1000}, {t: end, z: 1.0, y: 960}]}
          layers:
            - {<<: *machine, x: 140, y: 1330, scale: 0.62, par: 0.6, brightness: 0.55, blur: 2}
            - {<<: *machine, x: 420, y: 1330, scale: 0.62, par: 0.6, brightness: 0.55, blur: 2, title: "FORTUNE", neon: "#4de1ff"}
            - {<<: *machine, x: 700, y: 1330, scale: 0.62, par: 0.6, brightness: 0.55, blur: 2, title: "BONUS", neon: "#7a2cff"}
            - {<<: *machine, x: 980, y: 1330, scale: 0.62, par: 0.6, brightness: 0.55, blur: 2}

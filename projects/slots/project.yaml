            - {actor: hand, pose: hold_back, x: 540, y: 960, scale: 0.92, sleeve: "#161a28"}
            - id: ph
              actor: phone
              x: 540
              y: 960
              scale: 0.92
              screen: app
              glow: "#ff3b4e"
              children:
                - {<<: *machine, x: 262, y: 840, scale: 0.62, start: [seven, bar, cherry], spins: [{at: "@start", dur: 0.5, result: [bell, star, cherry]}, {at: "@start+1.0", dur: 0.5, result: [bar, bar, seven]}, {at: "@start+2.0", dur: 0.5, result: [cherry, bell, star]}]}
                - {actor: shape, kind: rect, x: 0, y: 0, w: 524, h: 924, fill: "rgba(0,0,0,.25)", origin: top-left}
                - {actor: text, text: "● REC", x: 110, y: 72, size: 34, font: mono, color: "#ff3b4e", blink: {freq: 1.2}}
                - {actor: text, text: "ВРАЩЕНИЙ: {n}", x: 262, y: 150, size: 40, font: mono, color: "#ffffff", count: {from: 1, to: 24, at: "@снимал", dur: 1.4}}
                - {actor: meter, x: 262, y: 875, w: 440, value: [{at: 0, v: 0}, {at: "@отправлял", v: 100, dur: 0.7}], max: 100, label: "ОТПРАВКА", color: code, size: 26, at: "@отправлял-0.1", enter: fade}
            - {actor: hand, pose: hold_front, x: 540, y: 960, scale: 0.92}
            - {actor: text, text: "24 ВРАЩЕНИЯ", x: 540, y: 250, size: 70, weight: 900, color: gold, stroke: {w: 8, color: "#05020b"}, space: screen, at: "@десятков", enter: pop}
            - {actor: shape, kind: rect, x: 520, y: 520, w: 40, h: 40, radius: 8, fill: code, glow: {color: "#4de1ff", r: 16, a: 1}, at: "@отправлял", anim: [{at: "@отправлял", dur: 0.55, dy: -700, ease: in}], enter: pop}
            - {actor: shape, kind: rect, x: 470, y: 560, w: 30, h: 30, radius: 6, fill: code, glow: {color: "#4de1ff", r: 14, a: 1}, at: "@отправлял+0.12", anim: [{at: "@отправлял+0.12", dur: 0.55, dy: -760, ease: in}], enter: pop}
            - {actor: shape, kind: rect, x: 590, y: 560, w: 30, h: 30, radius: 6, fill: code, glow: {color: "#4de1ff", r: 14, a: 1}, at: "@отправлял+0.24", anim: [{at: "@отправлял+0.24", dur: 0.55, dy: -760, ease: in}], enter: pop}
      - id: r_map
        start: "@Петербург-0.12"
        transition: {type: whip_x, flash: 0.06}
        effects:
          - {type: glow, at: [700, 520], sigma: 300, color: [0.3, 0.85, 1.0], intensity: 0.12, pulse: {freq: 1.0, amp: 0.3}}
        look: {bloom: [0.7, 0.35]}
        draw:
          bg: {type: radial, at: "50% 40%", stops: [[0, "#0d1530"], [1, "#03050c"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {actor: stars, region: [0, 0, 1080, 1920], count: 140, size: 2.5}
            - actor: map
              x: 540
              y: 760
              w: 980
              h: 980
              projection: orthographic
              rotate: [{at: 0, v: [-62, 42]}, {at: "@вычисляли", v: [-25, 50], dur: 2.2}]
              land: "#1d2c52"
              ocean: "#0a1226"
              stroke: "#2b3f73"
              graticule: true
              pin_color: gold
              pins:
                - {lon: -90.2, lat: 38.63, label: "СЕНТ-ЛУИС", at: "@start", size: 34}
                - {lon: 30.31, lat: 59.94, label: "ПЕТЕРБУРГ", at: "@Петербург+0.9", size: 40, color: code}
              routes:
                - {src: [-90.2, 38.63], dst: [30.31, 59.94], at: "@Петербург-0.05", dur: 1.0, color: code, width: 7, packets: 3, period: 1.1}
            - actor: group
              x: 740
              y: 1010
              scale: 0.85
              at: "@вычисляли-0.05"
              enter: pop
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 520, h: 300, radius: 20, fill: "rgba(6,20,32,.92)", stroke: code, sw: 3}
                - {actor: text, text: "РИТМ МАШИНЫ", x: 0, y: -105, size: 30, font: mono, color: code}
                - {actor: chart, type: line, x: 0, y: 30, w: 440, h: 190, values: false, color: "#4de1ff", size: 1, data: [{label: "", value: 3}, {label: "", value: 8}, {label: "", value: 2}, {label: "", value: 9}, {label: "", value: 4}, {label: "", value: 7}, {label: "", value: 1}, {label: "", value: 8}, {label: "", value: 5}], grow: {at: "@вычисляли", dur: 1.0}}
      - id: r_buzz
        start: "@четверть-0.12"
        captions_top: 1480
        transition: {type: zoom, dur: 0.3}
        effects:
          - {type: flash, events: [{at: "@вибрировал+0.3", amp: 0.3, decay: 0.35}]}
          - {type: glow, at: [690, 1180], sigma: 220, color: [1.0, 0.25, 0.35], intensity: 0.12, pulse: {freq: 2, amp: 0.4}}
        look: {bloom: [0.65, 0.4], grade: {contrast: 0.1, sat: 1.15}}
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: "@вибрировал", z: 1.1, y: 960}], shakes: [{at: "@вибрировал", amp: 10, dur: 0.3}, {at: "@вибрировал+0.25", amp: 16, dur: 0.3}]}
          layers:
            - <<: *machine
              x: 540
              y: 1600
              scale: 1.25
              start: [bar, cherry, star]
              spins: [{at: "@четверть", dur: 1.75, stagger: 0.12, result: [seven, seven, seven], loops: 4}]
              press: ["@вибрировал+0.25"]
              wins: ["@вибрировал+0.45"]
              button_glow: 1
            - {actor: coins, bursts: [{at: "@вибрировал+0.45", x: 540, y: 1470, count: 24, power: 1500}]}
            - {actor: phone, x: 175, y: 930, rot: -12, scale: 0.42, screen: lock, time: "03:41", glow: "#ffd34d", shakes: [{at: "@вибрировал", amp: 10, dur: 0.35}]}
            - {actor: buzz, x: 175, y: 930, w: 270, h: 230, color: gold, times: ["@вибрировал"]}
            - id: finger
              actor: hand
              pose: point
              x: 690
              y: 1265
              rot: 160
              scale: 0.9
              sleeve: "#161a28"
              anim: [{at: "@вибрировал+0.17", dur: 0.08, dy: 75, ease: in}, {at: "@вибрировал+0.42", dur: 0.25, dy: -50}]
            - actor: text
              text: "{n} С"
              x: 540
              y: 190
              size: 110
              weight: 900
              color: gold
              stroke: {w: 10, color: "#05020b"}
              shadow: "0 0 30px rgba(255,211,77,.7)"
              space: screen
              count: {from: 1.0, to: 0.25, at: "@четверть", dur: 0.6, decimals: 2}
              at: "@четверть-0.05"
              enter: pop
    sfx:
      - {sound: click, at: "@снимал", gain: -15}
      - {sound: whoosh, at: "@отправлял", gain: -15}
      - {sound: noise_sweep, at: "@Петербург", gain: -16}
      - {sound: blip, at: "@ритм", gain: -15}
      - {sound: buzz, at: "@вибрировал", gain: -13, f: 120, d: 0.08, n: 3}
      - {sound: kick, at: "@вибрировал+0.25", gain: -11}
      - {sound: sparkle, at: "@вибрировал+0.45", gain: -14}

  # ------------------------------------------------------------------ 6. BAN — подарок от запрета
  - id: ban
    accent: "255,59,78"
    caption_marks: {"запретила казино": "255,59,78"}
    text: Откуда у них такие автоматы? В две тысячи девятом Россия запретила казино — и машины распродали за бесценок.
    shots:
      - id: b_sign
        transition: {type: flash, dur: 0.25}
        effects:
          - {type: glow, at: [540, 720], sigma: 380, color: [1.0, 0.2, 0.8], intensity: 0.14, until: "@запретила+0.6", fade_out: 0.5}
          - {type: tint_pulse, at: "@запретила", decay: 0.7, gain: [0.3, 0.0, 0.02], lift: [0.06, 0.0, 0.0]}
        look: {bloom: [0.65, 0.4], grade: {contrast: 0.1}}
        ambience: [{sound: wind, gain: -22}, {sound: city, gain: -24}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.1, y: 900}]}
          layers:
            - {actor: sky, hour: 22.5, par: 0, clouds: 3}
            - {actor: skyline, x: 540, y: 1180, w: 1600, h: 420, color: "#0e0a1c", color2: "#171030", lit: 0.25, par: 0.35}
            - {actor: shape, kind: rect, x: 60, y: 560, w: 960, h: 1000, fill: {linear: ["#1c1230", "#0d0818"], angle: 180}, stroke: "#2a1f45", sw: 4, origin: top-left}
            - {actor: shape, kind: rect, x: 340, y: 1060, w: 400, h: 500, radius: 10, fill: "#07040d", stroke: "#3a2a5c", sw: 6, origin: top-left}
            - {actor: neon_sign, text: "КАЗИНО", x: 540, y: 780, size: 150, color: neon, off_at: "@запретила", stagger: 0.09}
            - {actor: timetag, text: "РОССИЯ · 1 ИЮЛЯ 2009", x: 540, y: 250, size: 38, color: alarm, space: screen, at: "@две-0.05", enter: wipe_right, enter_dur: 0.5}
            - {actor: text, text: "ЗАПРЕТ", x: 540, y: 1220, size: 150, weight: 900, color: alarm, stroke: {w: 10, color: "#05020b"}, rot: -8, space: screen, at: "@запретила", enter: stamp, shadow: "0 0 30px rgba(255,59,78,.7)"}
            - {actor: prop, kind: question, x: 900, y: 470, scale: 2.2, color: gold, at: "@Откуда", until: "@две", enter: pop, exit: shrink, wiggle: {rot: 8, freq: 1.2}, glow: {color: "#ffd34d", r: 14, a: 0.9}}
      - id: b_sale
        start: "@машины-0.12"
        transition: {type: whip_x, flash: 0.06}
        look: {bloom: [0.7, 0.3]}
        draw:
          bg: {type: radial, at: "50% 40%", stops: [[0, "#241034"], [1, "#07030c"]]}
          camera: {keys: [{t: 0, z: 1.0, x: 540}, {t: end, z: 1.0, x: 700}]}
          layers:
            - {actor: shape, kind: rect, x: -400, y: 1330, w: 2200, h: 700, fill: "#140a1c", origin: top-left}
            - {<<: *machine, x: 160, y: 1340, scale: 0.6, lights: 0.2, anim: [{at: "@бесценок", dur: 0.7, dx: 1500, ease: in}]}
            - {<<: *machine, x: 540, y: 1340, scale: 0.6, lights: 0.2, title: "FORTUNE", neon: "#4de1ff", anim: [{at: "@бесценок+0.08", dur: 0.7, dx: 1500, ease: in}]}
            - {<<: *machine, x: 920, y: 1340, scale: 0.6, lights: 0.2, title: "BONUS", neon: "#7a2cff", anim: [{at: "@бесценок+0.16", dur: 0.7, dx: 1500, ease: in}]}
            - {actor: badge, x: 160, y: 900, title: "УЦЕНКА", style: solid, color: alarm, size: 44, rot: -10, at: "@машины", enter: stamp, anim: [{at: "@бесценок", dur: 0.7, dx: 1500, ease: in}]}
            - {actor: badge, x: 540, y: 900, title: "УЦЕНКА", style: solid, color: alarm, size: 44, rot: 6, at: "@машины+0.12", enter: stamp, anim: [{at: "@бесценок+0.08", dur: 0.7, dx: 1500, ease: in}]}
            - {actor: badge, x: 920, y: 900, title: "УЦЕНКА", style: solid, color: alarm, size: 44, rot: -6, at: "@машины+0.24", enter: stamp, anim: [{at: "@бесценок+0.16", dur: 0.7, dx: 1500, ease: in}]}
            - {actor: text, text: "РАСПРОДАЖА", x: 540, y: 330, size: 110, weight: 900, color: gold, stroke: {w: 8, color: "#05020b"}, space: screen, at: "@машины", enter: stamp, shadow: "0 0 30px rgba(255,211,77,.6)"}
    sfx:

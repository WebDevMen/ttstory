      - id: n_rows
        transition: {type: dip, dur: 0.35}
        look: {bloom: [0.7, 0.3], grade: {contrast: 0.1}}
        ambience: [{sound: room, gain: -20}]
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.25, y: 1000}, {t: end, z: 0.95, y: 960}]}
          layers:
            - {<<: *machine, x: 100, y: 1050, scale: 0.36, brightness: 0.5, lights: [{at: 0, v: 0.15}, {at: "@менять", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 320, y: 1050, scale: 0.36, brightness: 0.5, lights: [{at: 0, v: 0.15}, {at: "@менять+0.05", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 540, y: 1050, scale: 0.36, brightness: 0.5, lights: [{at: 0, v: 0.15}, {at: "@менять+0.1", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 760, y: 1050, scale: 0.36, brightness: 0.5, lights: [{at: 0, v: 0.15}, {at: "@менять+0.15", v: 1, dur: 0.2}]}

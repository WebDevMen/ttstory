      - {sound: slam, at: "@запретила", gain: -11}
      - {sound: pop, at: "@машины", gain: -14}
      - {sound: whoosh, at: "@бесценок", gain: -14}

  # ------------------------------------------------------------------ 7. ARREST — четверть миллиона и арест
  - id: arrest
    accent: "255,211,77"
    caption_marks: {"двухсот пятидесяти тысяч долларов": "255,211,77"}
    text: Команда из четырёх таких игроков могла поднять больше двухсот пятидесяти тысяч долларов за неделю. В декабре четверых из них арестовали.

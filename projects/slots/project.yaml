      - {sound: slam, at: "@арестовали", gain: -11}

  # ------------------------------------------------------------------ 8. NOFIX — починить нельзя, выдаёт палец
  - id: nofix
    accent: "255,59,78"
    caption_marks: {"палец": "255,211,77"}

            - {actor: person, x: 430, y: 1560, scale: 1.5, look: {age: adult, outfit: suit, silhouette: "#0a0710"}, at: "@четырёх+0.05", enter: rise}
            - {actor: person, x: 650, y: 1560, scale: 1.45, look: {age: adult, outfit: casual, hair: long, silhouette: "#0a0710"}, at: "@четырёх+0.2", enter: rise}
            - {actor: person, x: 870, y: 1560, scale: 1.5, look: {age: adult, outfit: casual, hat: cap, silhouette: "#0a0710"}, at: "@четырёх+0.35", enter: rise}
            - {actor: coins, kind: bill, rain: {from: "@двухсот", until: "@неделю+1", count: 46}}
            - actor: text
              text: "${n}+"
              x: 540
              y: 340
              size: 140
              weight: 900
              color: gold
              stroke: {w: 10, color: "#12051f"}
              shadow: "0 0 34px rgba(255,211,77,.7)"
              space: screen
              count: {from: 0, to: 250000, at: "@двухсот", dur: 1.5, sep: " "}
              at: "@двухсот-0.05"
              enter: pop
            - {actor: text, text: "ЗА НЕДЕЛЮ", x: 540, y: 475, size: 60, font: mono, color: "#ffffff", space: screen, at: "@неделю-0.05", enter: rise}
      - id: a_cuffs
        start: "@декабре-0.12"
        transition: {type: flash, dur: 0.2}
        look: {bloom: [0.6, 0.4], grade: {contrast: 0.12}}
        draw:
          bg: {type: radial, at: "50% 40%", stops: [[0, "#1a0c22"], [1, "#05020a"]]}
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}], shakes: [{at: "@арестовали", amp: 14, dur: 0.35}]}
          layers:
            - {actor: shape, kind: circle, x: 180, y: 900, r: 760, fill: {radial: ["rgba(255,40,60,.75)", "rgba(255,40,60,0)"]}, blink: {freq: 2.2, duty: 0, min: 0.05}}
            - {actor: shape, kind: circle, x: 900, y: 900, r: 760, fill: {radial: ["rgba(40,110,255,.75)", "rgba(40,110,255,0)"]}, blink: {freq: 2.2, duty: 0, min: 0.05, phase: 3.14}}
            - {actor: shape, kind: rect, x: -400, y: 1320, w: 2000, h: 700, fill: "#0c0610", origin: top-left}
            - {actor: person, x: 210, y: 1560, scale: 1.45, look: {age: adult, outfit: casual, silhouette: "#05030a"}, pose: [{at: 0, v: stand}, {at: "@арестовали", v: arms_up, dur: 0.3}]}
            - {actor: person, x: 430, y: 1560, scale: 1.5, look: {age: adult, outfit: suit, silhouette: "#05030a"}, pose: [{at: 0, v: stand}, {at: "@арестовали+0.08", v: arms_up, dur: 0.3}]}
            - {actor: person, x: 650, y: 1560, scale: 1.45, look: {age: adult, outfit: casual, hair: long, silhouette: "#05030a"}, pose: [{at: 0, v: stand}, {at: "@арестовали+0.16", v: arms_up, dur: 0.3}]}
            - {actor: person, x: 870, y: 1560, scale: 1.5, look: {age: adult, outfit: casual, hat: cap, silhouette: "#05030a"}, pose: [{at: 0, v: stand}, {at: "@арестовали+0.24", v: arms_up, dur: 0.3}]}
            - {actor: text, text: "АРЕСТ", x: 540, y: 380, size: 170, weight: 900, color: "#ffffff", stroke: {w: 12, color: "#c2001f"}, rot: -6, space: screen, at: "@арестовали-0.05", enter: stamp, shadow: "0 0 40px rgba(255,40,60,.8)"}
            - {actor: timetag, text: "ДЕКАБРЬ 2014 · СЕНТ-ЛУИС", x: 540, y: 250, size: 36, color: alarm, space: screen, at: "@декабре", enter: wipe_right, enter_dur: 0.5}

            - {<<: *machine, x: 300, y: 1500, scale: 0.5, brightness: 0.75, title: "FORTUNE", neon: "#4de1ff", lights: [{at: 0, v: 0.15}, {at: "@менять+0.15", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 600, y: 1500, scale: 0.5, brightness: 0.75, title: "BONUS", neon: "#7a2cff", lights: [{at: 0, v: 0.15}, {at: "@менять+0.2", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 900, y: 1500, scale: 0.5, brightness: 0.75, lights: [{at: 0, v: 0.15}, {at: "@менять+0.25", v: 1, dur: 0.2}]}
            - {<<: *machine, x: 1200, y: 1500, scale: 0.5, brightness: 0.75, title: "FORTUNE", neon: "#4de1ff", lights: [{at: 0, v: 0.15}, {at: "@менять+0.3", v: 1, dur: 0.2}]}
            - {actor: shape, kind: rect, x: -600, y: 1490, w: 2400, h: 700, fill: {linear: ["#3a0d2e", "#12040e"], angle: 180}, origin: top-left}
            - {actor: image, emoji: "🔧", x: 540, y: 420, size: 220, space: screen, at: "@автоматы", enter: pop}
            - {actor: shape, kind: line, points: [[400, 560], [680, 280]], stroke: alarm, sw: 26, cap: round, space: screen, at: "@починили", enter: draw, enter_dur: 0.3}
            - {actor: badge, x: 540, y: 690, title: "ЗАМЕНИТЬ ВСЕ?", style: solid, color: gold, size: 54, space: screen, at: "@менять", enter: stamp}
      - id: n_finger
        start: "@Единственная-0.12"
        transition: {type: zoom, dur: 0.3}
        effects:
          - {type: glow, at: [540, 1180], sigma: 260, color: [1.0, 0.25, 0.4], intensity: 0.12, pulse: {freq: 1.2, amp: 0.4}}
        look: {bloom: [0.65, 0.4], grade: {contrast: 0.1}}
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: end, z: 1.12, y: 1000}]}
          layers:
            - {<<: *machine, x: 228, y: 1450, scale: 2.6, button_glow: 1, lights: 0.6, start: [seven, bar, cherry]}
            - {actor: hand, pose: point, x: 540, y: 850, rot: 180, scale: 1.0, sleeve: "#161a28", wiggle: {rot: 0.6, freq: 3}, bob: {amp: 4, freq: 1.4}}
            - actor: cctv
              space: screen
              cam: "CAM 12 · ЗАЛ B"
              date: "2014-06-02"
              clock: 85420
              label: "ПАЛЕЦ НАД КНОПКОЙ"
              box_at: "@палец-0.05"
              box: [420, 540, 240, 440]
            - actor: text
              text: "ЖДЁТ: {n} С"
              x: 540
              y: 1150
              size: 56
              font: mono
              color: "#ffffff"
              space: screen
              count: {from: 0, to: 4.0, at: "@палец", dur: 2.5, decimals: 1}
              at: "@палец"
              enter: fade
    sfx:
      - {sound: buzz, at: "@починили", gain: -15}
      - {sound: groan, at: "@менять", gain: -15}
      - {sound: blip, at: "@палец", gain: -14}
      - {sound: heartbeat, at: "@висит", gain: -12}

  # ------------------------------------------------------------------ 9. CTA — взлом или математика + петля к началу
  - id: cta
    accent: "255,211,77"
    text: "Это взлом или просто математика? Пиши одним словом — и подпишись: дальше афера ещё наглее."
    shots:
      - id: z_choice
        transition: {type: whip_x, flash: 0.08}
        look: {bloom: [0.65, 0.4], grade: {contrast: 0.1, sat: 1.1}}
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.06}, {t: end, z: 1.0}]}
          layers:
            - {actor: digits, color: code, size: 28, speed: 1.6, density: 0.3, opacity: 0.18}
            - actor: group
              x: 540
              y: 560
              at: "@взлом-0.05"
              enter: stamp
              pulse: {freq: 1.6, amp: 0.03}
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 760, h: 220, radius: 110, origin: center, fill: {linear: ["#ff5a6e", "#b3001b"], angle: 180}, stroke: "#ffd34d", sw: 6, glow: {color: "#ff3b4e", r: 30, a: 0.9}}
                - {actor: text, text: "ВЗЛОМ", x: 0, y: 4, size: 110, weight: 900, color: "#ffffff"}
            - {actor: text, text: "ИЛИ", x: 540, y: 760, size: 70, font: mono, color: "#ffffff", at: "@или", enter: pop, blink: {freq: 1.5, min: 0.4}}
            - actor: group
              x: 540
              y: 960
              at: "@математика-0.05"
              enter: stamp
              pulse: {freq: 1.6, amp: 0.03, phase: 3.14}
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 900, h: 220, radius: 110, origin: center, fill: {linear: ["#5ee8ff", "#0a7fa6"], angle: 180}, stroke: "#ffd34d", sw: 6, glow: {color: "#4de1ff", r: 30, a: 0.9}}
                - {actor: text, text: "МАТЕМАТИКА", x: 0, y: 4, size: 100, weight: 900, color: "#ffffff"}
            - {actor: badge, x: 540, y: 330, icon: "🔔", title: "АФЕРА №2 — ЕЩЁ НАГЛЕЕ", style: solid, color: gold, size: 46, at: "@подпишись", enter: drop}
      - id: z_loop
        start: "@наглее-0.15"
        transition: {type: zoom, dur: 0.3}
        effects:
          - {type: glow, at: [600, 560], sigma: 360, color: [1.0, 0.3, 0.85], intensity: 0.12, pulse: {freq: 0.8, amp: 0.3}}
        look: {bloom: [0.7, 0.35], grade: {contrast: 0.1, sat: 1.15}}
        draw:
          bg: *casino_bg
          camera: {keys: [{t: 0, z: 1.06, y: 940}, {t: end, z: 1.0, y: 980}]}
          layers:
            - {<<: *machine, x: 80, y: 1260, scale: 0.55, par: 0.45, brightness: 0.45, blur: 3, title: "BONUS", neon: "#7a2cff"}
            - {<<: *machine, x: 1010, y: 1260, scale: 0.55, par: 0.45, brightness: 0.45, blur: 3, title: "FORTUNE", neon: "#4de1ff"}
            - *floor
            - {<<: *machine, x: 610, y: 1600, scale: 1.06, start: [bar, cherry, star], spins: [{at: "@start+0.3", dur: 2.0, result: [seven, bell, star], loops: 4}], button_glow: 1}
            - {actor: hand, pose: hold_back, x: 300, y: 1060, rot: -9, scale: 0.5, sleeve: "#161a28"}
            - {actor: phone, x: 300, y: 1060, rot: -9, scale: 0.5, screen: app, glow: "#ff3b4e", shakes: [{at: "@наглее", amp: 9, dur: 0.5}], children: [{actor: text, text: "● REC 00:00", x: 262, y: 120, size: 34, font: mono, color: "#ff3b4e", blink: {freq: 1.2}}]}
            - {actor: hand, pose: hold_front, x: 300, y: 1060, rot: -9, scale: 0.5}
            - {actor: buzz, x: 300, y: 1060, w: 300, h: 260, color: gold, times: ["@наглее", "@наглее+0.8"]}
    sfx:
      - {sound: blip, at: "@взлом", gain: -14}
      - {sound: blip, at: "@математика", gain: -14, f: 1900}
      - {sound: pop, at: "@подпишись", gain: -15}
      - {sound: buzz, at: "@наглее", gain: -13, f: 120, d: 0.08, n: 3}
      - {sound: buzz, at: "@наглее+0.8", gain: -15, f: 120, d: 0.08, n: 3}

brief:
  goal: "Охват и подписки на рубрику «аферы»: true crime + технологии, где зритель понимает механизм и спорит в комментариях."
  kpi: [completion, rewatch, comments, shares, follows]
  audience:
    who: "Русскоязычные зрители 18–35, которые любят истории про хакеров, аферы и «как это вообще работает»"
    age: "18–35"
    interests: [true crime, хакеры, технологии, деньги, казино и азарт как тема историй]
    pains: ["скучные пересказы без механики", "кликбейт без доказательств"]
    desires: ["понять, как именно провернули схему", "удивиться и пересказать другу", "поспорить, честно это или нет"]
    knowledge: "Знают, что «казино всегда в плюсе», и думают, что автомат выдаёт чистую случайность; не знают про генератор псевдослучайных чисел и связь этой истории с запретом казино в России"
  promise: "Реальная афера с доказательствами: как телефон и команда в Петербурге вычисляли игровые автоматы в США — и почему это не смогли починить."
  tone: "Расследование-триллер: холодная неоновая ночь казино, нарастающий ритм, в финале — спор «взлом или математика». Главная эмоция — «да ладно, так можно было?»."
  keywords: ["казино", "игровые автоматы", "хакеры", "афера"]
  constraints:
    - "Офлайн-казино вместо онлайн: история сильнее и с первоисточником, а «онлайн» в ней есть — видео с телефона уходило на удалённый сервер в Петербурге"
    - "Только механизм в общих чертах, без инструкции: формула на экране — условная иллюстрация, не алгоритм автомата"
    - "Не реклама азартных игр: ни названий казино-брендов в подписи, ни призывов играть; финал — про охрану и закон (правила площадок ограничивают продвижение азартных игр)"
    - "Имена фигурантов не звучат: в истории достаточно «этот человек», «четверо»; лица — силуэты"
    - "Цифры заработка — со слов эксперта по безопасности казино в расследовании Wired (средняя уверенность); формулировки «могла поднять», «больше»"

research:
  summary: >-
    В июне 2014 года бухгалтерия казино Lumiere Place в Сент-Луисе заметила, что несколько игровых автоматов Aristocrat
    за два дня отдали больше денег, чем приняли, без крупных джекпотов. Камеры показали игрока, который держал телефон
    у экрана, отходил и возвращался — и за два дня выиграл чуть больше 21 тысячи долларов. Схема: телефон снимал около
    двух десятков вращений, видео уходило техникам в Петербург; зная устройство генератора псевдослучайных чисел этой модели,
    они вычисляли состояние машины и присылали в приложение метки времени — телефон вибрировал примерно за 0.25 с до
    момента нажатия. Автоматы для изучения организация получила после запрета казино в России 2009 года, когда тысячи
    заведений распродали оборудование. В декабре 2014 четверых участников арестовали в Сент-Луисе (обвинение — минимум 10 казино
    в трёх штатах), трое получили по два года. Производители не нашли «дефекта», а заменить все старые автоматы казино
    невыгодно — главной приметой для охраны остался палец, слишком долго висящий над кнопкой.
  facts:
    - id: f1
      text: "2–3 июня 2014 года несколько автоматов в казино Lumiere Place (Сент-Луис) отдали больше денег, чем приняли, не выдав крупных джекпотов (отрицательный «холд»)."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: high
    - id: f2
      text: "Игрок держал айфон у экрана старых автоматов Aristocrat, отходил и возвращался; превращал 20–60 долларов в сумму до 1300 и за два дня выиграл чуть больше 21 000 долларов. Перед нажатием подолгу держал палец над кнопкой Spin."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: high
    - id: f3
      text: "Телефон записывал около двух десятков вращений, видео уходило техникам в Петербург; они вычисляли закономерность машины по известному генератору и присылали в приложение метки — телефон вибрировал примерно за 0.25 с до нажатия (время реакции человека)."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: high
    - id: f4
      text: "Результаты автоматов задают генераторы псевдослучайных чисел: начальное число (seed) плюс входные данные вроде внутренних часов; это не настоящая случайность, и, зная составляющие, выход можно предсказать."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: high
    - id: f5
      text: "С 1 июля 2009 года в России запрещена работа игорных заведений вне специальных игорных зон; по Wired, запрет заставил тысячи казино распродать автоматы со скидкой, часть попала к организации в Петербурге."
      source: "https://www.nalog.gov.ru/rn58/news/archive/3776764/"
      confidence: high
    - id: f6
      text: "По словам консультанта по безопасности казино Уилли Эллисона: один такой игрок обычно выигрывал больше 10 000 долларов в день (держа выигрыш на одном автомате ниже 1000), команда из четырёх человек — больше 250 000 долларов за неделю."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: medium
    - id: f7
      text: "10 декабря 2014 года Минюст США (Восточный округ Миссури) объявил об обвинении четырёх человек: сговор с целью обмана минимум 10 казино в Миссури, Калифорнии и Иллинойсе с помощью электронных устройств, предсказывавших поведение автоматов Aristocrat Mark VI через связь с зарубежным сервером."
      source: "https://www.justice.gov/usao-edmo/pr/four-russian-nationals-indicted-fraud-charges"
      confidence: high
    - id: f8
      text: "Трое пошли на сделку и получили по два года федеральной тюрьмы с последующей депортацией. Быстрого исправления нет: производителям пришлось бы снять все взломанные машины, а казино выгоднее держать старые автоматы; единственная зацепка охраны — палец, слишком долго висящий над кнопкой."
      source: "https://www.wired.com/2017/02/russians-engineer-brilliant-slot-machine-cheat-casinos-no-fix/"
      confidence: high
  angles:
    - id: a1
      text: "Телефон, который выигрывал: механика аферы как детектив — от странной бухгалтерии казино до Петербурга и запрета казино 2009 года"
      score: 9
      why: "Есть всё для удержания: загадка в первой фразе, раскрытие механизма с картинкой, неожиданная связь с Россией (поворот для нашей аудитории), арест и вечный спор «взлом или математика». Первоисточник — Минюст США."
    - id: a2
      text: "Онлайн-покер: сотрудник видел карты всех игроков, а выдал его файл, который покер-рум сам прислал проигравшему (Absolute Poker, 2007)"
      score: 8
      why: "Именно онлайн и сильный поворот, но это покер-рум, а не казино; механика сводится к «видел карты» — меньше вау от «как», и правила покера нужно объяснять."
    - id: a3
      text: "Лазерный сканер в телефоне: в лондонском «Ритце» выиграли 1.3 млн фунтов в рулетку — и им вернули деньги"
      score: 7
      why: "Отличный финал «деньги вернули», но мало проверенных деталей механики и картинка беднее; история 2004 года известна."
    - id: a4
      text: "Фил Айви и «сортировка краёв» карт: 10 млн долларов и суд о том, что считать обманом"
      score: 6
      why: "Очень известная история — много роликов уже есть; спор интересный, но механика (узор рубашки) хуже читается в 60 секундах."
  chosen_angle: a1
  insights:
    - "Главное вау — не сумма, а механика: «случайность» автомата оказалась формулой, а подсказкой был обычный виброзвонок."
    - "Для русскоязычной аудитории сильнейший поворот — автоматы для опытов появились после запрета казино в России в 2009 году."
    - "Спорность (это кража или честная математика — автомат ведь никто не вскрывал) даёт комментарии одним словом."
    - "Деталь «палец над кнопкой» — идеальная концовка-отсылка: зритель пересматривает первый кадр, где палец уже висит над кнопкой."
    - "Онлайн-составляющая есть: видео с телефона уходило на сервер за океан, позже — потоком в реальном времени."

hooks:
  variants:
    - {id: h1, type: shock_fact, vo: "Этот человек обыграл казино обычным телефоном. И автомат он даже не взламывал.", on_screen: "ОБЫГРАЛ КАЗИНО ТЕЛЕФОНОМ", visual: "Рука с телефоном у неонового игрового автомата, барабаны встают на 7-7-7, телефон вибрирует", score: 9, why: "Парадокс в первой фразе (казино + обычный телефон), ключевое слово сразу, вторая фраза открывает петлю «как?»; первый кадр понятен без звука."}
    - {id: h2, type: curiosity_gap, vo: "Его телефон вибрировал — и игровой автомат отдавал деньги. Вот как это работало.", on_screen: "ВИБРАЦИЯ = ВЫИГРЫШ", visual: "Крупно вибрирующий телефон, за ним вспыхивает выигрыш", score: 8, why: "Сильная загадка и картинка, но «вот как это работало» — штамп, а первая фраза длиннее трёх секунд."}
    - {id: h3, type: contrarian, vo: "Игровые автоматы не случайны. Это доказали хакеры из Петербурга.", on_screen: "АВТОМАТЫ НЕ СЛУЧАЙНЫ", visual: "Барабаны превращаются в поток цифр", score: 8, why: "Ломает убеждение и сразу даёт «наших» героев; но абстрактнее первого варианта — нет человека и действия."}
    - {id: h4, type: question, vo: "Как обыграть казино, не прикасаясь к автомату?", on_screen: "НЕ ТРОГАЯ АВТОМАТ?", visual: "Палец замирает в сантиметре от кнопки", score: 7, why: "Хорошая петля, но звучит как обещание инструкции — риск для правил площадки и ожиданий зрителя."}
    - {id: h5, type: shock_fact, vo: "Двадцать одна тысяча долларов за два дня — с помощью айфона.", on_screen: "$21 000 ЗА 2 ДНЯ", visual: "Счётчик кредитов автомата крутится до 21 000", score: 7, why: "Конкретная цифра, но без механики сумма не удивляет — бывают выигрыши и больше."}
    - {id: h6, type: imagine, vo: "Представь: телефон вибрирует — и через четверть секунды автомат выдаёт выигрыш.", on_screen: "0.25 СЕКУНДЫ", visual: "Таймер 0.25 и вспышка выигрыша", score: 7, why: "Вовлекает, но раскрывает главную деталь механизма слишком рано — середине нечем удивлять."}
    - {id: h7, type: callout, vo: "Если думаешь, что казино нельзя обыграть, посмотри на этих ребят из Петербурга.", on_screen: "КАЗИНО МОЖНО ОБЫГРАТЬ?", visual: "Силуэты четверых на фоне неоновой вывески", score: 6, why: "Длинно, мягкий старт; звучит как реклама «как выиграть» — риск."}
    - {id: h8, type: result_first, vo: "Четверых арестовали в Америке из-за пальца над кнопкой автомата.", on_screen: "ВЫДАЛ ПАЛЕЦ", visual: "Палец над светящейся кнопкой, вокруг — красная рамка камеры", score: 7, why: "Интригующий финал вперёд, но фактически арест был не только из-за пальца — формулировка на грани точности."}
  primary: h1
  ab: [h3, h2]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Обыграл казино телефоном"
    goal: "Остановить палец: парадокс «казино + обычный телефон + без взлома» и открытая петля «как?»."
    vo: "Этот человек обыграл казино обычным телефоном. И автомат он даже не взламывал."
    on_screen: "ОБЫГРАЛ КАЗИНО ТЕЛЕФОНОМ"
    devices: [open_loop, pattern_interrupt, text_reinforcement, sound_hit, visual_proof]
    music: pulse
    marks: {"телефоном": "#ffd34d"}
    shots:
      - id: h_win
        visual: "Ночь в казино: крупно неоновый игровой автомат, перед ним рука держит телефон экраном к барабанам (на экране телефона — запись, красная точка REC). Фон — размытые огни зала. Барабаны крутятся с первого кадра."
        actors: [new:slot_machine, phone, new:hand, particles, text]
        camera: "Медленный наезд на автомат; на «обыграл» — удар-тряска"
        animation:
          - {at: "@start", what: "Барабаны крутятся, огни автомата бегут по кругу, точка REC на телефоне мигает"}
          - {at: "@человек", what: "Телефон коротко вибрирует (кольца вибрации вокруг)"}
          - {at: "@обыграл", what: "Барабаны встают на 7-7-7, автомат вспыхивает, из лотка сыплются жетоны"}
        graphics:
          - {at: "@казино", type: "text slam", text: "ОБЫГРАЛ КАЗИНО ТЕЛЕФОНОМ"}
        sfx:
          - {at: "@человек", sound: buzz, note: "виброзвонок"}
          - {at: "@обыграл", sound: kick}
          - {at: "@обыграл+0.1", sound: sparkle, note: "звон жетонов"}
          - {at: "@телефоном", sound: chime}
        ambience: [room]
        effects: "Боке неоновых огней, лёгкий блум"
        transition: cut
      - id: h_lock
        at: "@автомат-0.1"
        visual: "Автомат анфас, на корпусе целая пломба-щит с зелёной галочкой «НЕ ВЗЛОМАН»; над автоматом всплывают три вопросительных знака."
        actors: [new:slot_machine, badge, prop]
        camera: "Быстрый наезд, затем лёгкое покачивание"
        animation:
          - {at: "@автомат", what: "Пломба-щит загорается зелёным"}
          - {at: "@взламывал", what: "Вопросительные знаки выскакивают по очереди"}
        graphics:
          - {at: "@даже", type: badge, text: "НЕ ВЗЛОМАН ✓"}
        sfx:
          - {at: "@взламывал", sound: pop}
        transition: zoom

  # ------------------------------------------------------------------ 2. PROBLEM: the casino loses
  - id: problem
    role: problem
    title: "Казино в минусе"
    goal: "Где и когда: реальное казино, реальная дата; аномалия — автоматы отдают больше, чем принимают."
    vo: "Июнь две тысячи четырнадцатого. Автоматы казино в Сент-Луисе за два дня отдали больше, чем приняли."
    on_screen: "КАЗИНО В МИНУСЕ"
    devices: [progress, contrast, visual_proof]
    facts: [f1]
    music: tension
    shots:
      - id: p_floor
        visual: "Зал казино ночью: ряды автоматов уходят в перспективу, неоновая вывеска, ковёр с узором. Сверху метка времени и места."
        actors: [new:slot_machine, text, timetag, particles]
        camera: "Плавная панорама вдоль ряда автоматов"
        animation:
          - {at: "@start", what: "Панорама по залу, огни автоматов мигают"}
          - {at: "@Июнь", what: "Метка «ИЮНЬ 2014 · СЕНТ-ЛУИС» печатается по буквам"}
          - {at: "@Автоматы", what: "Экраны автоматов один за другим вспыхивают"}
        graphics:
          - {at: "@Июнь", type: timetag, text: "ИЮНЬ 2014 · СЕНТ-ЛУИС"}
        sfx:
          - {at: "@Июнь", sound: typing}
        ambience: [room]
        transition: whip_x
      - id: p_chart
        at: "@отдали-0.1"
        visual: "Бухгалтерский экран: два столбика — «ПРИНЯЛИ» и «ОТДАЛИ»; «ОТДАЛИ» растёт выше и краснеет, внизу баланс уходит в минус."
        actors: [chart, text, badge]
        camera: "Наезд на столбики"
        animation:
          - {at: "@отдали", what: "Столбик «ОТДАЛИ» вырастает и обгоняет «ПРИНЯЛИ»"}
          - {at: "@приняли", what: "Баланс краснеет и уходит в минус, экран мигает"}
        graphics:
          - {at: "@приняли", type: badge, text: "КАЗИНО В МИНУСЕ"}
        sfx:
          - {at: "@отдали", sound: riser}
          - {at: "@приняли", sound: buzz}
        transition: zoom

  # ------------------------------------------------------------------ 3. PROOF: CCTV
  - id: cctv
    role: proof
    title: "Камеры нашли игрока"
    goal: "Первая награда: видеонаблюдение показывает странное поведение — телефон у экрана; цифра выигрыша."
    vo: "Камеры нашли игрока. Он подносил телефон к экрану — и выиграл двадцать одну тысячу долларов."
    on_screen: "$21 000 ЗА 2 ДНЯ"
    devices: [visual_proof, number_reveal, pattern_interrupt, mini_payoff]
    facts: [f2]
    music: tension
    marks: {"двадцать одну тысячу долларов": "#ffd34d"}
    shots:
      - id: c_cam
        visual: "Кадр камеры наблюдения: зелёно-серое зерно, вид сверху-сбоку на игрока (силуэт) у автомата; поверх — «CAM 07», мигающий REC, тикающий таймкод."
        actors: [new:cctv, person, new:slot_machine]
        camera: "Цифровой зум камеры наблюдения ступеньками"
        animation:
          - {at: "@start", what: "Таймкод тикает, по кадру бегут полосы помех"}
          - {at: "@нашли", what: "Красная рамка захвата ловит игрока"}
          - {at: "@подносил", what: "Силуэт поднимает телефон к экрану автомата; рамка сужается на телефон"}
        graphics:
          - {at: "@нашли", type: "cctv target", text: "ЦЕЛЬ"}
          - {at: "@телефон", type: callout, text: "ТЕЛЕФОН У ЭКРАНА"}
        sfx:
          - {at: "@нашли", sound: blip}
          - {at: "@телефон", sound: click}
        ambience: [hum]
        transition: glitch
      - id: c_money
        at: "@выиграл-0.1"
        visual: "Экран автомата крупно: счётчик выигрыша бешено крутится до 21 000 долларов, вокруг взлетают жетоны."
        actors: [new:slot_machine, text, particles]
        camera: "Резкий наезд на счётчик"
        animation:
          - {at: "@выиграл", what: "Счётчик кредитов крутится от 0"}
          - {at: "@тысячу", what: "Счётчик замирает на $21 000, вспышка, жетоны"}
        graphics:
          - {at: "@двадцать", type: "text count", text: "$21 000 ЗА 2 ДНЯ"}
        sfx:
          - {at: "@выиграл", sound: typing, note: "бег счётчика"}
          - {at: "@долларов", sound: sparkle}
        transition: zoom

  # ------------------------------------------------------------------ 4. REVEAL: pseudo-random
  - id: formula
    role: reveal
    title: "Случайность — это формула"
    goal: "Главная мысль механизма простыми словами: результат автомата считает формула, значит его можно вычислить."
    vo: "Фокус в том, что автомат не случаен. Результат выбирает формула. А формулу можно вычислить."
    on_screen: "ПСЕВДОСЛУЧАЙНО"
    devices: [mini_payoff, contrast, visual_proof, text_reinforcement]
    facts: [f4]
    music: pulse
    marks: {"формулу": "#4de1ff"}
    shots:
      - id: f_reels
        visual: "Барабаны автомата крупно; символы растворяются в колонки бегущих цифр (как поток данных)."
        actors: [new:slot_machine, text]
        camera: "Наезд сквозь стекло внутрь автомата"
        animation:
          - {at: "@Фокус", what: "Символы на барабанах начинают распадаться на цифры"}
          - {at: "@случаен", what: "Слово «СЛУЧАЙНО» штампом, перед ним дописывается «ПСЕВДО»"}
        graphics:
          - {at: "@случаен", type: "text stamp", text: "ПСЕВДОСЛУЧАЙНО"}
        sfx:
          - {at: "@Фокус", sound: noise_sweep}
          - {at: "@случаен", sound: kick}
        transition: zoom
      - id: f_math
        at: "@Результат-0.1"
        visual: "Тёмный экран-доска: условная формула светится голубым (иллюстрация, не реальный алгоритм); стрелка от формулы к трём будущим символам 7-7-7, которые проявляются заранее."
        actors: [text, shape, new:slot_machine]
        camera: "Медленный отъезд"
        animation:
          - {at: "@формула", what: "Формула печатается моноширинным шрифтом"}
          - {at: "@вычислить", what: "Формула подсвечивается, стрелка рисуется к символам 7-7-7 — они загораются до вращения"}
        graphics:
          - {at: "@формула", type: "text type", text: "СЛЕД = (A·X + C) MOD M"}
          - {at: "@вычислить", type: badge, text: "МОЖНО ВЫЧИСЛИТЬ"}
        sfx:
          - {at: "@формула", sound: typing}
          - {at: "@вычислить", sound: ping}
        transition: dissolve

  # ------------------------------------------------------------------ 5. ESCALATION: St. Petersburg
  - id: remote
    role: escalation
    title: "Мозг схемы — в Петербурге"
    goal: "Самая интересная механика: видео → Петербург → вибросигнал. Онлайн-часть аферы."
    vo: "Телефон снимал пару десятков вращений и отправлял видео в Петербург. Там вычисляли ритм машины. И за четверть секунды до нужного нажатия телефон вибрировал."
    on_screen: "СИГНАЛ ЗА 0.25 С"
    devices: [stakes_raise, visual_proof, number_reveal, progress, sound_hit]
    facts: [f3]
    music: pulse
    marks: {"Петербург": "#4de1ff", "четверть секунды": "#ffd34d"}
    shots:
      - id: r_rec
        visual: "Экран телефона в режиме записи: в видоискателе барабаны автомата, счётчик вращений бежит 1…24."
        actors: [phone, text, new:slot_machine]
        camera: "Лёгкий наезд на экран телефона"
        animation:
          - {at: "@снимал", what: "Счётчик вращений на экране телефона бежит до 24"}
          - {at: "@отправлял", what: "Полоса загрузки заполняется, из телефона вылетают пакеты данных вверх"}
        graphics:
          - {at: "@десятков", type: "text count", text: "24 ВРАЩЕНИЯ"}
        sfx:
          - {at: "@снимал", sound: click}
          - {at: "@отправлял", sound: whoosh}
        transition: whip_y
      - id: r_map
        at: "@Петербург-0.1"
        visual: "Ночная карта мира: светящаяся дуга от Сент-Луиса через океан к Петербургу; в Петербурге — мониторы с волной «ритма» машины."
        actors: [map, shape, chart, text]
        camera: "Облёт карты от США к России"
        animation:
          - {at: "@Петербург", what: "Дуга рисуется через океан, пин Петербурга вспыхивает"}
          - {at: "@вычисляли", what: "Рядом с пином появляется монитор с волной-графиком «РИТМ», волна бежит"}
        graphics:
          - {at: "@Петербург", type: callout, text: "САНКТ-ПЕТЕРБУРГ"}
          - {at: "@ритм", type: text, text: "РИТМ МАШИНЫ"}
        sfx:
          - {at: "@Петербург", sound: noise_sweep}
          - {at: "@ритм", sound: blip}
        transition: whip_x
      - id: r_buzz
        at: "@четверть-0.1"
        visual: "Макро: телефон в нагрудном кармане вибрирует, крупно таймер 0.25 С; палец ударяет по кнопке SPIN — барабаны встают на выигрыш."
        actors: [phone, new:hand, text, new:slot_machine]
        camera: "Резкий наезд, на «вибрировал» — тряска"
        animation:
          - {at: "@четверть", what: "Таймер «0.25 С» появляется и обратный отсчёт"}
          - {at: "@нажатия", what: "Палец заносится над кнопкой SPIN"}
          - {at: "@вибрировал", what: "Телефон вибрирует (кольца), палец бьёт по кнопке, вспышка выигрыша"}
        graphics:
          - {at: "@четверть", type: "text count", text: "0.25 С"}
        sfx:
          - {at: "@вибрировал", sound: buzz}
          - {at: "@вибрировал+0.25", sound: kick}
        transition: zoom

  # ------------------------------------------------------------------ 6. TWIST: the 2009 ban
  - id: ban
    role: twist
    title: "Подарок от запрета"
    goal: "Поворот для русскоязычного зрителя: автоматы для опытов появились из-за запрета казино в России."
    vo: "Откуда у них такие автоматы? В две тысячи девятом Россия запретила казино — и машины распродали за бесценок."
    on_screen: "ЗАПРЕТ 2009"
    devices: [twist, relatability, contrast, sound_hit]
    facts: [f5]
    music: sub
    shots:
      - id: b_sign
        visual: "Улица ночью: неоновая вывеска «КАЗИНО» над входом гаснет буква за буквой, на дверь падает красный штамп «ЗАКРЫТО»."
        actors: [new:neon_sign, text, sky, skyline]
        camera: "Медленный наезд на вывеску"
        animation:
          - {at: "@Откуда", what: "Вывеска «КАЗИНО» мигает"}
          - {at: "@запретила", what: "Вывеска гаснет по буквам, падает штамп «ЗАПРЕТ 2009»"}
        graphics:
          - {at: "@запретила", type: "text stamp", text: "ЗАПРЕТ 2009"}
        sfx:
          - {at: "@Откуда", sound: glitch}
          - {at: "@запретила", sound: slam}
        transition: flash
      - id: b_sale
        at: "@машины-0.1"
        visual: "Ряд автоматов с бирками «РАСПРОДАЖА»; цены на бирках зачёркиваются и падают; автоматы уезжают вправо — «в лабораторию»."
        actors: [new:slot_machine, badge, text]
        camera: "Панорама вправо вслед за автоматами"
        animation:
          - {at: "@машины", what: "На автоматах появляются бирки «РАСПРОДАЖА»"}
          - {at: "@бесценок", what: "Цены зачёркиваются, автоматы уезжают вправо"}
        graphics:
          - {at: "@машины", type: badge, text: "РАСПРОДАЖА"}
        sfx:
          - {at: "@машины", sound: pop}
          - {at: "@бесценок", sound: whoosh}
        transition: whip_x

  # ------------------------------------------------------------------ 7. PAYOFF: scale and arrest
  - id: arrest
    role: payoff
    title: "Четверть миллиона в неделю — и арест"
    goal: "Масштаб и развязка: сколько могла приносить схема и чем кончилось для четверых."
    vo: "Команда из четырёх таких игроков могла поднять больше двухсот пятидесяти тысяч долларов за неделю. В декабре четверых из них арестовали."
    on_screen: "$250 000 ЗА НЕДЕЛЮ"
    devices: [number_reveal, stakes_raise, mini_payoff, emotion]
    facts: [f6, f7]
    music: epic
    marks: {"двухсот пятидесяти тысяч долларов": "#ffd34d"}
    shots:
      - id: a_team
        visual: "Четыре силуэта в ряд на фоне стены из автоматов; над ними огромный счётчик долларов, сверху сыплются купюры."
        actors: [silhouette, text, image, particles]
        camera: "Отъезд, чтобы видеть всех четверых"
        animation:
          - {at: "@четырёх", what: "Силуэты появляются по одному"}
          - {at: "@двухсот", what: "Счётчик крутится до $250 000, сыплются купюры"}
        graphics:
          - {at: "@двухсот", type: "text count", text: "$250 000+ / НЕДЕЛЯ"}
        sfx:
          - {at: "@четырёх", sound: footstep}
          - {at: "@неделю", sound: sparkle}
        transition: whip_y
      - id: a_cuffs
        at: "@декабре-0.1"
        visual: "Те же силуэты под красно-синими мигалками; поверх — штамп «АРЕСТ · ДЕКАБРЬ 2014» и строка «10+ КАЗИНО · 3 ШТАТА»."
        actors: [silhouette, text, badge]
        camera: "Резкий стоп, лёгкая тряска"
        animation:
          - {at: "@декабре", what: "Свет становится красно-синим, мигалки"}
          - {at: "@арестовали", what: "Штамп «АРЕСТ», силуэты замирают"}
        graphics:
          - {at: "@арестовали", type: "text stamp", text: "АРЕСТ · ДЕКАБРЬ 2014"}
          - {at: "@арестовали+0.6", type: badge, text: "10+ КАЗИНО · 3 ШТАТА"}
        sfx:
          - {at: "@декабре", sound: alarm}
          - {at: "@арестовали", sound: slam}
        effects: "Красно-синее мигание (glow)"
        transition: flash

  # ------------------------------------------------------------------ 8. TWIST 2: no fix + the tell
  - id: nofix
    role: twist
    title: "Починить нельзя"
    goal: "Второй поворот и отсылка к началу: машины так и не исправили; выдаёт только палец над кнопкой."
    vo: "Но автоматы так и не починили — пришлось бы менять все. Единственная примета для охраны — палец, который слишком долго висит над кнопкой."
    on_screen: "ПАЛЕЦ НАД КНОПКОЙ"
    devices: [twist, callback, rewatch_trigger, emotion]
    facts: [f8]
    music: tension
    shots:
      - id: n_rows
        visual: "Бесконечные ряды старых автоматов; гаечный ключ над ними перечёркнут; бирка «ЗАМЕНИТЬ ВСЕ?» с огромной суммой."
        actors: [new:slot_machine, image, badge]
        camera: "Отъезд, ряды уходят в бесконечность"
        animation:
          - {at: "@починили", what: "Иконка гаечного ключа перечёркивается красным"}
          - {at: "@менять", what: "Все автоматы в рядах подсвечиваются, бирка «ЗАМЕНИТЬ ВСЕ?»"}
        graphics:
          - {at: "@менять", type: badge, text: "ЗАМЕНИТЬ ВСЕ?"}
        sfx:
          - {at: "@починили", sound: buzz}
          - {at: "@менять", sound: groan}
        transition: dip
      - id: n_finger
        at: "@Единственная-0.1"
        visual: "Макро: указательный палец висит над светящейся кнопкой SPIN, едва дрожит; вокруг — красная рамка камеры наблюдения и бегущий таймер ожидания."
        actors: [new:hand, new:slot_machine, new:cctv, text]
        camera: "Очень медленный наезд на палец"
        animation:
          - {at: "@палец", what: "Палец замирает над кнопкой, рамка камеры ловит его"}
          - {at: "@висит", what: "Таймер ожидания тикает 1…2…3, сердцебиение"}
        graphics:
          - {at: "@палец", type: "cctv target", text: "ПАЛЕЦ НАД КНОПКОЙ"}
        sfx:
          - {at: "@палец", sound: blip}
          - {at: "@висит", sound: heartbeat}
        transition: zoom

  # ------------------------------------------------------------------ 9. CTA
  - id: cta
    role: cta
    title: "Взлом или математика?"
    goal: "Комментарий одним словом (спор) + подписка на рубрику; последний кадр замыкает петлю — телефон снова вибрирует."
    vo: "Это взлом или просто математика? Пиши одним словом — и подпишись: дальше афера ещё наглее."
    on_screen: "ВЗЛОМ ИЛИ МАТЕМАТИКА?"
    devices: [comment_bait, follow_trigger, loop_ending, direct_address]
    music: pulse
    shots:
      - id: z_choice
        visual: "Две большие неоновые кнопки как на автомате: красная «ВЗЛОМ» и голубая «МАТЕМАТИКА»; между ними мигает «ИЛИ»; в финале на переднем плане снова рука с вибрирующим телефоном у автомата — как в первом кадре."
        actors: [text, shape, phone, new:hand, new:slot_machine]
        camera: "Лёгкий наезд, на «подпишись» — отъезд к первому кадру"
        animation:
          - {at: "@взлом", what: "Загорается красная кнопка «ВЗЛОМ»"}
          - {at: "@математика", what: "Загорается голубая кнопка «МАТЕМАТИКА»"}
          - {at: "@Пиши", what: "Обе кнопки пульсируют по очереди"}
          - {at: "@подпишись", what: "Плашка «АФЕРА №2 — ЕЩЁ НАГЛЕЕ»"}
          - {at: "@наглее", what: "Камера отъезжает к первому кадру: рука с телефоном у автомата, телефон вибрирует — петля к началу"}
        graphics:
          - {at: "@взлом", type: text, text: "ВЗЛОМ"}
          - {at: "@математика", type: text, text: "МАТЕМАТИКА"}
          - {at: "@подпишись", type: badge, text: "АФЕРА №2 — ЕЩЁ НАГЛЕЕ"}
        sfx:
          - {at: "@взлом", sound: blip}
          - {at: "@математика", sound: blip}
          - {at: "@наглее", sound: buzz, note: "вибро — петля к первому кадру"}
        transition: whip_x

loops:
  - {id: l1, question: "Как можно обыграть казино телефоном, не взламывая автомат?", open: hook, close: formula}
  - {id: l2, question: "Кто и где на самом деле вычислял автомат?", open: cctv, close: remote}
  - {id: l3, question: "Поймают ли их — и смогут ли казино защититься?", open: cctv, close: nofix}

engagement:
  comment: "Это взлом или просто математика? Ответ одним словом — спор, потому что автомат никто не вскрывал."
  share: "Переслать другу, который «знает систему» в автоматах или любит истории про хакеров."
  save: "Сохранить как пример того, почему «случайность» в автоматах — это формула (и почему казино всё равно в плюсе)."
  follow: "Рубрика «Аферы»: следующая история — ещё наглее (обещание серии в призыве)."
  rewatch: "Палец над кнопкой виден уже в первом кадре; быстрые цифры (21 000, 0.25 с, 250 000); финал зацикливается на вибрации телефона."
  cta: {beat: cta, text: "Взлом или математика? Пиши одним словом — и подпишись", type: comment}

package:
  tiktok:
    caption: "Афера в казино: хакеры из Петербурга обыгрывали игровые автоматы в США обычным телефоном. Взлом или математика? 👇"
    hashtags: ["#казино", "#афера", "#хакеры", "#игровыеавтоматы", "#truecrime"]
    cover: "ОБЫГРАЛ КАЗИНО ТЕЛЕФОНОМ"
    sound: "Своя музыка движка (pulse → tension → epic), без трендового звука: голос и вибро-акценты важнее"
  reels:
    caption: "Телефон вибрировал — и автомат отдавал деньги 📱🎰 Реальная афера в казино 2014 года: что вычисляли в Петербурге. Перешли другу-айтишнику."
    hashtags: ["#казино", "#афера", "#хакеры"]
    cover: "ОБЫГРАЛ КАЗИНО ТЕЛЕФОНОМ"
  shorts:
    title: "Как хакеры из Петербурга обыграли казино обычным телефоном"
    description: "Реальная история 2014 года: игровые автоматы, генератор псевдослучайных чисел, вибросигнал за 0.25 секунды и арест в Сент-Луисе."
    hashtags: ["#казино", "#хакеры"]
  first_frame: "Неоновый автомат и рука с телефоном (REC), барабаны уже крутятся, палец рядом с кнопкой — понятно без звука: «телефон против автомата»."
  posting: ["Вечер пятницы–субботы, 19:00–22:00", "Закрепить комментарий: «Я думаю — математика. А ты?»", "Без ссылок и названий казино: это история о преступлении, а не реклама"]

production:
  theme: {preset: minimal, accent: "#ffd34d", captions: clean}
  palette: ["#0b0716 ночь казино", "#7a2cff неон фиолетовый", "#ffd34d золото выигрыша", "#4de1ff голубой «код»", "#ff3b4e тревога", "#3cff8a камера наблюдения"]
  music: {key: E, mode: minor, bpm: 104}
  assets:

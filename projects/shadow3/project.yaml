  # ------------------------------------------------------------------ 8. CTA / LOOP — найди в первой части
  - id: cta
    text: "Но тень Марты с тех пор отстаёт. На миг. Найди это в первой части."
    shots:
      - id: q_lag
        transition: {type: dip}
        ambience: [{sound: birds, gain: -20}]
        draw:
          camera: {keys: [{t: 0, z: 1.12, y: 1060}, {t: end, z: 1.25, x: 500, y: 1080}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 7.3, par: 0, sun: [190, 860], horizon: 930, clouds: 3, seed: 4}
            - {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#7c8a8a", seed: 3, par: 0.2}
            - {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#8d9474", "#717858"], par: 0.2}
            - {actor: shape, kind: rect, x: 540, y: 905, w: 2100, h: 200, par: 0.25, fill: {linear: ["rgba(255,230,200,0)", "rgba(255,226,190,0.5)", "rgba(255,230,200,0)"], angle: 180}}
            - {actor: cottage, x: 90, y: 985, scale: 0.36, seed: 11, par: 0.45}
            - {actor: chapel, x: 760, y: 985, scale: 0.44, par: 0.45}
            - {actor: cottage, x: 1010, y: 985, scale: 0.34, seed: 12, floors: 1, par: 0.45}
            - {actor: ground, x: -520, y: 965, w: 2120, h: 1000, color: ["#9a9070", "#7a7258"], par: 0.45}
            - {actor: cottage, x: 120, y: 1060, scale: 0.72, seed: 3}
            - {actor: cottage, x: 960, y: 1060, scale: 0.7, seed: 8, floors: 2, thatch: false}
            - {actor: cobbles, x: -300, y: 1030, w: 1680, h: 950, color: "#7a7064"}
            - {actor: well, x: 760, y: 1110, scale: 0.72}
            # she stops — her shadow takes one more step, then turns its head to us
            - {<<: *vsh, x: 260, y: 1280, scale: 0.95, view: side, look: *marta, walk: [{at: "@cta.start", v: 1.5}, {at: "@отстаёт", v: 0}], lag: 0.55, anim: [{at: "@cta.start", dur: 1.55, x: 520, ease: linear}]}
            - {actor: person, id: marta, x: 260, y: 1280, scale: 0.95, view: side, look: *marta, walk: [{at: "@cta.start", v: 1.5}, {at: "@отстаёт", v: 0}], face: neutral, anim: [{at: "@cta.start", dur: 1.55, x: 520, ease: linear}]}
            - {actor: particles, kind: dust, region: [0, 300, 1080, 1300], count: 22, colors: ["#fff1d0"], alpha: 0.5, seed: 13}
            - {<<: *title, y: 640, size: 92, text: "НА МИГ", at: "@миг-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: q_find
        start: "@Найди-0.22"
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#0c0e16"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - actor: group
              x: 540
              y: 900
              children:
                - {actor: shape, kind: rect, x: 0, y: 0, w: 700, h: 960, fill: "#1a1612", stroke: "#e8dcc0", sw: 10}
                - {actor: shape, kind: rect, x: 0, y: -200, w: 680, h: 560, fill: {linear: ["#7ab0e6", "#cfe4f2"], angle: 180}}
                - {actor: forest, x: 0, y: -10, w: 680, h: 70, hill: 50, color: "#7c8a8a", seed: 3}
                - {actor: shape, kind: rect, x: 0, y: 230, w: 680, h: 460, fill: "#7a7064"}
                - {actor: cottage, x: -250, y: 60, scale: 0.36, seed: 3}
                - {actor: cottage, x: 250, y: 60, scale: 0.34, seed: 8, thatch: false}
                - {actor: well, x: 0, y: 70, scale: 0.36}
                - {actor: person, x: -200, y: 200, scale: 0.42, look: {age: adult, outfit: peasant_f, hair: bun}}
                - {actor: person, x: -60, y: 200, scale: 0.42, look: {age: adult, outfit: tunic, hair: short}}
                - {actor: person, x: 90, y: 200, scale: 0.42, look: {age: adult, outfit: tunic, hair: side, color: "#6a5a7a"}}
                - {actor: person, x: 230, y: 200, scale: 0.42, look: {age: adult, outfit: tunic, hair: short, beard: true}}
                - {actor: person, x: -120, y: 110, scale: 0.32, view: side, look: *marta}
                - {actor: text, x: -250, y: -440, size: 34, font: mono, color: "#ffffff", bg: {color: "#1a1612", pad: 6, radius: 4}, text: "ЧАСТЬ 1"}
                - {actor: text, x: 260, y: -440, size: 34, font: mono, color: "#ffffff", bg: {color: "#1a1612", pad: 6, radius: 4}, text: "0:0?"}
            - actor: group
              x: [{at: 0, v: 860}, {at: "@первой", v: 630, dur: 0.8, ease: inOut}]
              y: [{at: 0, v: 1250}, {at: "@первой", v: 1010, dur: 0.8, ease: inOut}]
              children:
                - {actor: shape, kind: line, points: [[60, 60], [170, 170]], stroke: "#c9a46a", sw: 22, cap: round}
                - {actor: shape, kind: circle, x: 0, y: 0, r: 90, fill: "rgba(255,255,255,0.15)", stroke: "#e8dcc0", sw: 12}
            - {<<: *title, y: 330, size: 92, text: "НАЙДИ В ЧАСТИ 1", at: "@Найди-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
            - {actor: badge, x: 540, y: 1430, title: "НА КАКОЙ СЕКУНДЕ?", style: solid, color: gold, size: 50, space: screen, at: "@части", enter: pop, sfx: false}
    sfx:
      - {sound: footstep, at: "@отстаёт", gain: -14}
      - {sound: hiss, at: "@миг", gain: -12}
      - {sound: click, at: "@первой", gain: -14}
      - {sound: bell, at: "@части", gain: -12}

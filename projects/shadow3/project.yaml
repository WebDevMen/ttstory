# «Без тени», часть 3/3 — «Затмение». 100% code-drawn (method draw) from projects/shadow3/script.yaml (v2, fiction mode).
# Series plan: projects/shadow1/series.md. Actors: library medieval.js (+ eclipse, shield, hourglass, star_stone drink/crack)
# + person with medieval outfits. Coordinates: screen px 1080x1920. Times: "@word".
# Light: grey-blue darkness of the eclipse, the last bonfires, then ONE white beam (the brightest thing in the series),
# then warm dawn; the last frame repeats the first frame of part 1.

title: "Без тени. Часть 3: Затмение"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+14%", pitch: "+0Hz", tail: 1.4}

theme:
  preset: minimal
  accent: "#e8eef7"
  captions:
    style: clean
    top: 1480
    size: 62
    max_chars: 20

post: {vignette: 0.34, chromatic: 0, grain: 0.03}

draw:
  palette: {gold: "#ffcf6a", fire: "#ffb347", ink: "#3a2416", beam: "#f4f8ff"}

# ------------------------------------------------------------------ shared pieces
x-title: &title {actor: text, x: 540, y: 420, size: 100, width: 980, lines: 2, color: "#ffffff", stroke: {w: 10, color: "#0c0e16"}, shadow: "0 0 34px rgba(200,220,255,.6)", space: screen}
x-tag: &tag {actor: timetag, x: 540, y: 200, size: 36, color: gold, space: screen}

x-look-marta: &marta {age: student, outfit: dress, hair: braid, hair_color: "#b8481e", skin: light}
x-look-hans: &hans {age: adult, outfit: smith, hair: short, hair_color: "#3a2418", beard: true, skin: mid, hollow: true}
x-look-tomas: &tomas {age: kid, outfit: tunic, hair: short, hair_color: "#e2c070", color: "#7a8a5a", skin: light, hollow: true}
x-look-godfrid: &godfrid {age: adult, outfit: knight, hair: short, hair_color: "#d0d0d0", beard: "#dadada", skin: light}

x-sky-eclipse: &sky_eclipse {actor: sky, x: -200, w: 1480, hour: 21, par: 0, sun: false, moon: false, horizon: 930, clouds: 1, seed: 7, colors: ["#0c1020", "#1e2638", "#3a4256"]}
x-eclipse: &eclipse_full {actor: eclipse, x: 700, y: 330, r: 90, cover: 1, par: 0}
x-forest-dark: &forest_dark {actor: forest, x: 540, y: 905, w: 2100, h: 150, hill: 120, color: "#1a2030", seed: 3, par: 0.2}
x-ground-dark-far: &ground_dark_far {actor: ground, x: -520, y: 890, w: 2120, h: 1100, color: ["#1a1e2a", "#12151e"], par: 0.2}
x-shade: &shade {actor: living_shadow, color: "#05050a", glow: {color: "#9a8cff", r: 10, a: 0.45}}
x-vsh: &vsh {actor: cast_shadow, angle: 128, len: 1.0, flat: 0.42, alpha: 0.5, color: "#1a1410", soft: 2.5}

audio:
  music:
    key: D
    mode: minor
    bpm: 92
    gain: -15
    sections:
      - {at: 0, style: dark, chords: [Dm, Bb, Gm, A]}
      - {at: "@context.start", style: tension}
      - {at: "@problem.start", style: dark}
      - {at: "@escalation.start", style: epic}
      - {at: "@rule.start", style: pulse, chords: [Dm, Bb, F, C]}
      - {at: "@lead.start", style: tension}
      - {at: "@light.start", style: epic, chords: [Bb, C, Dm, F]}
      - {at: "@return.start", style: calm}
      - {at: "@cta.start", style: drone, chords: [Dm, Bb, F, A]}
  duck: 0.6

scenes:

  # ------------------------------------------------------------------ 1. HOOK — тени не боятся огня
  - id: hook
    accent: "#e8eef7"
    text: "Когда погасло солнце, тени перестали бояться огня. А Марте нужно было выйти из круга."
    caption_marks: {"перестали бояться огня": "#ff6a3d"}
    shots:
      - id: h_eclipse
        ambience: [{sound: wind, gain: -20}, {sound: fire, gain: -20}]
        look: {bloom: [0.7, 0.3]}
        draw:
          camera: {keys: [{t: 0, z: 1.05, y: 760}, {t: end, z: 1.0, y: 1060}]}
          layers:
            - *sky_eclipse
            - {actor: stars, region: [0, 0, 1080, 800], count: 60, size: 2}
            - {actor: eclipse, x: 700, y: 330, r: 90, cover: [{at: 0, v: 0.9}, {at: "@погасло", v: 1, dur: 0.5}], par: 0}
            - *forest_dark
            - *ground_dark_far
            - {actor: chapel, x: 300, y: 1040, scale: 0.6, lit: 0.6, brightness: 0.55, par: 0.6}
            - {actor: cottage, x: 880, y: 1040, scale: 0.5, seed: 8, floors: 2, thatch: false, brightness: 0.5, par: 0.6}
            - {actor: ground, x: -520, y: 1025, w: 2120, h: 1000, color: ["#22201e", "#161412"], par: 0.6}
            - {actor: ground, x: -520, y: 1080, w: 2120, h: 900, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 540, y: 1260, r: 620, sy: 0.42, color: "#ff9a3a", a: 0.5, k: [{at: 0, v: 1}, {at: "@огня", v: 0.45, dur: 0.6}]}
            - {actor: bonfire, x: 243, y: 1154, scale: 0.52, seed: 5, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 540, y: 1110, scale: 0.5, seed: 6, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 837, y: 1154, scale: 0.52, seed: 7, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 120, y: 1260, scale: 0.6, seed: 4, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 960, y: 1260, scale: 0.6, seed: 8, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {<<: *shade, x: 60, y: 1150, h: 440, alpha: 0.9, reach: 0.8, anim: [{at: "@тени", dur: 1.2, x: 300, y: 1240, ease: inOut}]}
            - {<<: *shade, x: 1020, y: 1140, h: 420, alpha: 0.9, reach: 0.8, flip: true, anim: [{at: "@тени+0.2", dur: 1.2, x: 790, y: 1240, ease: inOut}]}
            - {actor: person, x: 430, y: 1275, scale: 0.78, look: {age: adult, outfit: peasant_f, hair: bun}, face: [{at: 0, v: neutral}, {at: "@огня", v: surprised}]}
            - {actor: person, x: 540, y: 1290, scale: 0.68, look: {age: kid, outfit: tunic, hair: short, hair_color: "#6a4a2a"}, face: [{at: 0, v: neutral}, {at: "@огня", v: sad}]}
            - {actor: person, x: 650, y: 1270, scale: 0.76, look: *marta, face: [{at: 0, v: neutral}, {at: "@огня", v: determined}]}
            - {actor: bonfire, x: 243, y: 1366, scale: 0.68, seed: 3, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 540, y: 1410, scale: 0.72, seed: 2, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {actor: bonfire, x: 837, y: 1366, scale: 0.68, seed: 1, k: [{at: 0, v: 1}, {at: "@огня", v: 0.5, dur: 0.6}]}
            - {<<: *tag, text: "ЧАСТЬ 3/3 · ЗАТМЕНИЕ", at: 0.05, enter: fade}
            - {<<: *title, y: 780, size: 92, text: "ТЕНИ НЕ БОЯТСЯ ОГНЯ", at: "@огня-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
      - id: h_marta
        start: "@Марте-0.22"
        transition: {type: zoom}
        draw:
          camera: {keys: [{t: 0, z: 1.15, x: 540, y: 1000}, {t: end, z: 1.25, x: 480, y: 1000}]}
          layers:
            - *sky_eclipse
            - {actor: eclipse, x: 300, y: 380, r: 80, cover: 1, par: 0}
            - *forest_dark
            - *ground_dark_far
            - {actor: ground, x: -520, y: 1000, w: 2120, h: 1000, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 760, y: 1240, r: 420, sy: 0.4, color: "#ff9a3a", a: 0.55}
            - {actor: shape, kind: ellipse, x: 540, y: 1260, w: 760, h: 190, fill: "none", stroke: "rgba(255,180,90,0.7)", sw: 4, dash: "14 10"}
            - {actor: bonfire, x: 820, y: 1210, scale: 0.6, seed: 4, k: 0.55}
            - {<<: *shade, x: 150, y: 1180, h: 480, alpha: 0.9, reach: 1}
            - {actor: person, id: marta, x: 560, y: 1290, scale: 1.0, look: *marta, face: determined, look_dx: [{at: 0, v: 0}, {at: "@круга", v: -1, dur: 0.4}],
               pose: [{at: 0, v: together}, {at: "@выйти", v: point, dur: 0.4}], anim: [{at: "@выйти", dur: 0.8, dx: -60}]}
            - {actor: bonfire, x: 260, y: 1400, scale: 0.7, seed: 3, k: 0.55}
            - {actor: callout, target: "marta.top", x: 680, y: 600, title: "МАРТА", color: gold, size: 44, space: screen, at: "@Марте", enter: pop, sfx: false}
    sfx:
      - {sound: riser, at: "@hook.start", gain: -14}
      - {sound: impact, at: "@огня", gain: -12}
      - {sound: creature, at: "@тени", gain: -14}
      - {sound: hiss, at: "@круга", gain: -14}

  # ------------------------------------------------------------------ 2. SETUP — света слишком мало
  - id: context
    text: "Часть третья. Затмение. Костры шипят, но их света мало — тени идут сквозь круг."
    shots:
      - id: c_recap
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.04, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 3}
            - {actor: shape, kind: path, d: "M0,-32 L330,-40 L330,40 L0,32 Z", x: 540, y: 860, rot: 0, fill: "rgba(42,26,16,0.6)", blur: 2, opacity: [{at: 0, v: 0}, {at: "@Затмение", v: 1, dur: 0.5}]}
            - {actor: shape, kind: path, d: "M0,-32 L330,-40 L330,40 L0,32 Z", x: 540, y: 860, rot: 90, fill: "rgba(42,26,16,0.6)", blur: 2, opacity: [{at: 0, v: 0}, {at: "@Затмение+0.1", v: 1, dur: 0.5}]}
            - {actor: shape, kind: path, d: "M0,-32 L330,-40 L330,40 L0,32 Z", x: 540, y: 860, rot: 180, fill: "rgba(42,26,16,0.6)", blur: 2, opacity: [{at: 0, v: 0}, {at: "@Затмение+0.2", v: 1, dur: 0.5}]}
            - {actor: shape, kind: path, d: "M0,-32 L330,-40 L330,40 L0,32 Z", x: 540, y: 860, rot: 270, fill: "rgba(42,26,16,0.6)", blur: 2, opacity: [{at: 0, v: 0}, {at: "@Затмение+0.3", v: 1, dur: 0.5}]}
            - {actor: bonfire, x: 230, y: 900, scale: 0.42, k: [{at: 0, v: 1}, {at: "@Затмение", v: 0.4, dur: 0.5}]}
            - {actor: bonfire, x: 540, y: 590, scale: 0.42, k: [{at: 0, v: 1}, {at: "@Затмение", v: 0.4, dur: 0.5}]}
            - {actor: bonfire, x: 850, y: 900, scale: 0.42, k: [{at: 0, v: 1}, {at: "@Затмение", v: 0.4, dur: 0.5}]}
            - {actor: bonfire, x: 540, y: 1210, scale: 0.42, k: [{at: 0, v: 1}, {at: "@Затмение", v: 0.4, dur: 0.5}]}
            - {actor: shape, kind: circle, x: 540, y: 860, r: 46, fill: "#5a3e28"}
            - {actor: shape, kind: ellipse, x: 540, y: 860, w: 150, h: 70, fill: "#5a3e28", opacity: 0.6}
            - {actor: shape, kind: rect, x: 540, y: 900, w: 1010, h: 1120, fill: "#0c1020", opacity: [{at: 0, v: 0}, {at: "@Затмение", v: 0.45, dur: 0.6}]}
            - {<<: *tag, text: "ЧАСТЬ 2 · ПРАВИЛА", at: "@Часть-0.05", enter: wipe_right, enter_dur: 0.5}
      - id: c_ring
        start: "@Костры-0.22"
        transition: {type: dip}
        ambience: [{sound: fire, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 1080}, {t: end, z: 1.08, y: 1140}]}
          layers:
            - *sky_eclipse
            - {actor: stars, region: [0, 0, 1080, 800], count: 60, size: 2}
            - *eclipse_full
            - *forest_dark
            - *ground_dark_far
            - {actor: chapel, x: 300, y: 1040, scale: 0.6, lit: 0.6, brightness: 0.55, par: 0.6}
            - {actor: cottage, x: 880, y: 1040, scale: 0.5, seed: 8, floors: 2, thatch: false, brightness: 0.5, par: 0.6}
            - {actor: ground, x: -520, y: 1025, w: 2120, h: 1000, color: ["#22201e", "#161412"], par: 0.6}
            - {actor: ground, x: -520, y: 1080, w: 2120, h: 900, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 540, y: 1260, r: 620, sy: 0.42, color: "#ff9a3a", a: 0.5, k: [{at: 0, v: 0.6}, {at: "@мало", v: 0.25, dur: 0.6}]}
            - {actor: bonfire, x: 243, y: 1154, scale: 0.52, seed: 5, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 540, y: 1110, scale: 0.5, seed: 6, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 837, y: 1154, scale: 0.52, seed: 7, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 120, y: 1260, scale: 0.6, seed: 4, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 960, y: 1260, scale: 0.6, seed: 8, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: smoke, x: 243, y: 1120, w: 80, h: 380, color: "#5a5060", n: 8, blur: 7, speed: 30, alpha: 0.5, seed: 3}
            - {actor: smoke, x: 837, y: 1120, w: 80, h: 380, color: "#5a5060", n: 8, blur: 7, speed: 30, alpha: 0.5, seed: 5}
            - {<<: *shade, x: 330, y: 1120, h: 440, alpha: 0.9, reach: 1, anim: [{at: "@сквозь", dur: 1.0, x: 420, y: 1230, ease: inOut}]}
            - {<<: *shade, x: 760, y: 1120, h: 430, alpha: 0.9, arms_up: 0.6, flip: true, anim: [{at: "@сквозь+0.15", dur: 1.0, x: 680, y: 1225, ease: inOut}]}
            - {actor: person, x: 470, y: 1300, scale: 0.78, look: {age: adult, outfit: peasant_f, hair: bun}, face: sad}
            - {actor: person, x: 560, y: 1310, scale: 0.68, look: {age: kid, outfit: tunic, hair: short, hair_color: "#6a4a2a"}, face: surprised}
            - {actor: person, x: 640, y: 1300, scale: 0.8, look: {age: adult, outfit: tunic, hair: side, beard: true}, face: determined}
            - {actor: bonfire, x: 243, y: 1366, scale: 0.68, seed: 3, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 540, y: 1410, scale: 0.72, seed: 2, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {actor: bonfire, x: 837, y: 1366, scale: 0.68, seed: 1, k: [{at: 0, v: 0.55}, {at: "@мало", v: 0.35, dur: 0.5}]}
            - {<<: *title, y: 640, size: 92, text: "СВЕТА СЛИШКОМ МАЛО", at: "@мало-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: noise_sweep, at: "@Затмение", gain: -14}
      - {sound: hiss, at: "@шипят", gain: -14}
      - {sound: kick, at: "@мало", gain: -12}
      - {sound: creature, at: "@сквозь", gain: -12}

  # ------------------------------------------------------------------ 3. PROBLEM — камень пьёт свет
  - id: problem
    text: "В лесу пустые выкопали камень. Он поднялся над ямой и пил свет. Пламя факелов гнулось к нему, как трава под ветром."
    shots:
      - id: p_rise
        transition: {type: whip_x}
        captions_top: auto
        ambience: [{sound: rumble, gain: -16}]
        draw:
          camera: {keys: [{t: 0, z: 1.18, y: 1080}, {t: end, z: 1.25, y: 1000}]}
          layers:
            - *sky_eclipse
            - {actor: stars, region: [0, 0, 1080, 800], count: 60, size: 2}
            - {actor: eclipse, x: 820, y: 360, r: 80, cover: 1, par: 0}
            - {actor: forest, x: 540, y: 1010, w: 2100, h: 260, hill: 40, color: "#141a24", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 995, w: 2120, h: 1000, color: ["#161a22", "#101318"], par: 0.3}
            - {actor: ground, x: -520, y: 1150, w: 2120, h: 900, color: ["#2a2220", "#1a1614"]}
            - {actor: crater, x: 540, y: 1430, w: 1000, depth: 230, color: "#3a2e26", glow: 0.25}
            - {actor: star_stone, id: stone, x: 540, y: [{at: 0, v: 1310}, {at: "@поднялся", v: 1050, dur: 1.4, ease: inOut}], r: 70, drink: [{at: 0, v: 0}, {at: "@поднялся+0.8", v: 0.6, dur: 0.6}], rim: "#7a4aff"}
            - {actor: particles, kind: dust, region: [400, 1150, 700, 1350], count: 30, colors: ["#6a5440"], size: [4, 9], alpha: 0.7, at: "@поднялся", seed: 6}
            - {actor: person, view: side, x: 150, y: 1220, scale: 0.72, look: *hans, hold: shovel, hold_rot: 150, face: neutral, brightness: 0.7}
            - {actor: person, view: side, x: 290, y: 1205, scale: 0.62, look: *tomas, face: neutral, brightness: 0.7}
            - {actor: person, view: side, flip: true, x: 820, y: 1210, scale: 0.7, look: {age: adult, outfit: peasant_f, hair: bun, hollow: true}, hold: shovel, hold_rot: 150, face: neutral, brightness: 0.7}
            - {actor: person, view: side, flip: true, x: 950, y: 1220, scale: 0.72, look: {age: adult, outfit: tunic, hair: short, hollow: true}, hold: shovel, hold_rot: 150, face: neutral, brightness: 0.7}
            - {actor: callout, target: "stone", x: 540, y: 640, title: "ВОТ ЧТО ОНИ КОПАЛИ", color: gold, size: 42, space: screen, at: "@выкопали", enter: pop, sfx: false}
      - id: p_drink
        start: "@пил-0.22"
        transition: {type: zoom}
        captions_top: 1520
        look: {bloom: [0.7, 0.3]}
        draw:
          bg: "#0a0c14"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.1}]}
          layers:
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: {radial: ["#2a2a44", "#141624", "#08090e"]}}
            - {actor: torch, x: 160, y: 1350, len: 300, scale: 1.2, rot: 14, halo: 200, lean: [{at: 0, v: 0}, {at: "@Пламя", v: 1.2, dur: 0.6}]}
            - {actor: torch, x: 930, y: 1360, len: 300, scale: 1.2, rot: -14, halo: 200, lean: [{at: 0, v: 0}, {at: "@Пламя", v: -1.2, dur: 0.6}]}
            - {actor: torch, x: 330, y: 1500, len: 260, scale: 1.1, rot: 8, halo: 180, lean: [{at: 0, v: 0}, {at: "@Пламя+0.15", v: 1.0, dur: 0.6}]}
            # the flames are pulled toward the stone: tips bend to it (lean), and streams of fire flow from each flame into it
            - {actor: light_stream, x: 0, y: 0, from: [266, 930], to: [470, 860], bend: -40, width: 18, seed: 1, k: [{at: 0, v: 0}, {at: "@Пламя", v: 1, dur: 0.8, ease: out}]}
            - {actor: light_stream, x: 0, y: 0, from: [824, 940], to: [610, 860], bend: 40, width: 18, seed: 2, k: [{at: 0, v: 0}, {at: "@Пламя", v: 1, dur: 0.8, ease: out}]}
            - {actor: light_stream, x: 0, y: 0, from: [384, 1150], to: [500, 960], bend: -30, width: 14, seed: 3, k: [{at: 0, v: 0}, {at: "@Пламя+0.15", v: 1, dur: 0.8, ease: out}]}
            - {actor: star_stone, x: 540, y: 820, r: 170, drink: [{at: 0, v: 0.6}, {at: "@пил", v: 1, dur: 0.4}], rim: "#7a4aff", pulse: {freq: 1.2, amp: 0.02}}
            - {actor: particles, kind: embers, region: [100, 800, 1000, 1500], count: 30, seed: 7}
            - {<<: *title, text: "КАМЕНЬ ПЬЁТ СВЕТ", at: "@пил-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: groan, at: "@поднялся", gain: -12}
      - {sound: noise_sweep, at: "@пил", gain: -14}
      - {sound: hiss, at: "@Пламя", gain: -14}

  # ------------------------------------------------------------------ 4. ESCALATION — он держал огонь
  - id: escalation
    text: "Сир Годфрид держал огонь последним. Держал, пока его тень не забрали. Но огонь не погас."
    shots:
      - id: e_knight
        transition: {type: whip_x}
        ambience: [{sound: fire, gain: -16}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 1000}, {t: end, z: 1.12, x: 520, y: 980}]}
          layers:
            - *sky_eclipse
            - *eclipse_full
            - *forest_dark
            - *ground_dark_far
            - {actor: ground, x: -520, y: 1080, w: 2120, h: 900, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 560, y: 1330, r: 460, sy: 0.5, color: "#ff9a3a", a: 0.55}
            - {actor: bonfire, x: 700, y: 1330, scale: 0.7, seed: 3}

            - {<<: *vsh, x: 960, y: 1230, scale: 0.72, view: side, flip: true, look: {age: adult, outfit: tunic, hair: short}, angle: 160, alpha: [{at: 0, v: 0}, {at: "@хозяевам+0.2", v: 0.5, dur: 0.3}]}

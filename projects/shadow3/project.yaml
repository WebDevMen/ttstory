      - {sound: footstep, at: "@повела", gain: -14}
      - {sound: heartbeat, at: "@ждала", gain: -12}

  # ------------------------------------------------------------------ 7. PAYOFF — луч в камень
  - id: light
    text: "Луч! Марта подняла щит. Свет ударил в камень — и тот треснул со звоном."
    shots:
      - id: l_beam
        transition: {type: flash}
        look: {bloom: [0.55, 0.5]}
        draw:
          camera: {keys: [{t: 0, z: 1.0, y: 960}, {t: "@ударил", z: 1.06, x: 600, y: 980}, {t: end, z: 1.1, x: 620, y: 990}], shakes: [{at: "@ударил", amp: 10, dur: 0.4}]}
          layers:
            - *sky_eclipse
            - {actor: stars, region: [0, 0, 1080, 800], count: 50, size: 2}
            - {actor: eclipse, x: 200, y: 300, r: 80, cover: [{at: 0, v: 1}, {at: "@Луч", v: 0.96, dur: 0.3}], from: 30, ring: [{at: 0, v: 0}, {at: "@Луч", v: 1, dur: 0.2}]}
            - {actor: forest, x: 540, y: 1010, w: 2100, h: 260, hill: 40, color: "#141a24", seed: 9, par: 0.3}
            - {actor: ground, x: -520, y: 995, w: 2120, h: 1000, color: ["#161a22", "#101318"], par: 0.3}
            - {actor: ground, x: -520, y: 1150, w: 2120, h: 900, color: ["#2a2220", "#1a1614"]}
            - {actor: crater, x: 640, y: 1430, w: 900, depth: 220, color: "#3a2e26", glow: 0.2}
            - {actor: star_stone, id: stone, x: 700, y: 1000, r: 70, drink: 0.8, rim: "#7a4aff"}
            # the beam: sun edge → shield → stone
            - {actor: shape, kind: line, points: [[160, 330], [300, 1050]], stroke: beam, sw: 12, at: "@Луч+0.1", enter: draw, enter_dur: 0.3, glow: {color: "#ffffff", r: 22, a: 1}}
            - {actor: shape, kind: line, points: [[300, 1050], [700, 1000]], stroke: beam, sw: 14, at: "@щит", enter: draw, enter_dur: 0.3, glow: {color: "#ffffff", r: 26, a: 1}}
            - {actor: person, id: marta, view: side, x: 230, y: 1250, scale: 0.9, look: *marta, face: determined, pose: [{at: 0, v: {a1: [50, 60], a2: [50, 60], l1: [2, 0], l2: [-2, 0]}}, {at: "@подняла", v: {a1: [90, 30], a2: [90, 30], l1: [10, 0], l2: [-10, 0]}, dur: 0.3}]}
            - {actor: shield, id: mirror, x: [{at: 0, v: 280}, {at: "@подняла", v: 300, dur: 0.3}], y: [{at: 0, v: 1130}, {at: "@подняла", v: 1050, dur: 0.3}], r: 55, sx: 0.55, shine: [{at: 0, v: 0}, {at: "@Луч", v: 1, dur: 0.2}], glow: {color: "#ffffff", r: 20, a: 0.9}}
            - {actor: callout, target: "mirror.top", x: 540, y: 600, title: "ЩИТ КУЗНЕЦА = ЗЕРКАЛО", color: gold, size: 40, space: screen, at: "@щит", enter: pop, sfx: false}
      - id: l_crack
        start: "@треснул-0.22"
        transition: {type: zoom}
        captions_top: 1520
        look: {bloom: [0.5, 0.6]}
        draw:
          bg: "#0a0c14"
          camera: {keys: [{t: 0, z: 1.1}, {t: end, z: 0.95}], shakes: [{at: "@треснул", amp: 18, dur: 0.5}]}
          layers:

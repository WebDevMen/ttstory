      - {sound: groan, at: "@забрали", gain: -12}
      - {sound: boom, at: "@погас", gain: -10}

  # ------------------------------------------------------------------ 5. RULE — затмение, луч, зеркало
  - id: rule
    text: "Ансельм успел крикнуть главное. Полное затмение — не дольше семи с половиной минут. Потом бьёт первый луч. А зеркало вернёт его под тем же углом."
    shots:
      - id: r_timer
        transition: {type: whip_x}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.05, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 9}
            - {actor: eclipse, x: 540, y: 760, r: 150, cover: [{at: 0, v: 0.6}, {at: "@Полное", v: 1, dur: 0.8, ease: inOut}]}
            - {actor: hourglass, x: 820, y: 1170, scale: 1.0, flow: [{at: 0, v: 0}, {at: "@крикнуть", v: 1, dur: 4.0, ease: linear}], at: "@Ансельм", enter: drop}
            - {actor: human_hand, x: 1050, y: 1500, scale: 0.6, rot: -40, skin: "#e2b08a", sleeve: "#6e665c", cuff: "#5e574e", at: "@Ансельм", enter: fade, anim: [{at: "@Ансельм", dur: 0.6, x: 960, y: 1360}]}
            - {actor: badge, x: 540, y: 1260, title: "НЕ ДОЛЬШЕ 7,5 МИНУТ", style: solid, color: gold, size: 50, space: screen, at: "@семи", enter: pop, sfx: false}
      - id: r_ring
        start: "@Потом-0.22"
        transition: {type: zoom}
        captions_top: 1520
        look: {bloom: [0.6, 0.45]}
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.1, y: 820}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 9}
            - {actor: eclipse, x: 540, y: 760, r: 150, cover: [{at: 0, v: 1}, {at: "@первый", v: 0.96, dur: 0.4}], from: 160, ring: [{at: 0, v: 0}, {at: "@первый", v: 1, dur: 0.3}]}
            - {actor: shape, kind: line, points: [[400, 720], [130, 1260]], stroke: beam, sw: 10, at: "@луч", enter: draw, enter_dur: 0.4, glow: {color: "#ffffff", r: 18, a: 1}}
            - {actor: callout, target: [400, 720], x: 540, y: 1260, title: "ПЕРВЫЙ ЛУЧ", color: gold, size: 44, at: "@луч", enter: pop, sfx: false}
      - id: r_mirror
        start: "@зеркало-0.22"
        transition: {type: dip}
        captions_top: 1520
        draw:
          bg: "#120d0a"
          camera: {keys: [{t: 0, z: 1.0, y: 900}, {t: end, z: 1.04, y: 900}]}
          layers:
            - {actor: parchment, x: 540, y: 900, w: 1010, h: 1120, seed: 4}
            - {actor: shape, kind: line, points: [[150, 420], [540, 1120]], stroke: "#c0882a", sw: 8, at: "@зеркало", enter: draw, enter_dur: 0.4}
            - {actor: shape, kind: line, points: [[540, 1120], [880, 510]], stroke: "#c0882a", sw: 8, at: "@углом-0.5", enter: draw, enter_dur: 0.4}
            - {actor: shape, kind: line, points: [[540, 1120], [540, 700]], stroke: "#7a5a3a", sw: 3, dash: "8 8"}
            - {actor: shape, kind: arc, x: 540, y: 1120, r: 110, start: -90, end: -61, stroke: gold, sw: 6, fill: "none", at: "@углом", enter: draw}
            - {actor: shape, kind: arc, x: 540, y: 1120, r: 110, start: -119, end: -90, stroke: gold, sw: 6, fill: "none", at: "@углом", enter: draw}
            - {actor: shield, x: 540, y: 1160, r: 110, shine: 1, sy: 0.45}
            - {actor: star_stone, x: 900, y: 480, r: 60}
            - {actor: badge, x: 540, y: 1310, title: "УГОЛ ПАДЕНИЯ = УГОЛ ОТРАЖЕНИЯ", style: solid, color: gold, size: 34, space: screen, at: "@углом", enter: pop, sfx: false}
    sfx:
      - {sound: click, at: "@Ансельм", gain: -14}
      - {sound: kick, at: "@семи", gain: -12}

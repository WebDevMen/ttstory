            - {actor: star_stone, x: 540, y: 860, r: 190, crack: [{at: 0, v: 0}, {at: "@треснул", v: 1, dur: 0.5}], drink: [{at: 0, v: 1}, {at: "@треснул", v: 0, dur: 0.2}]}
            - {actor: particles, kind: sparkles, region: [200, 500, 900, 1200], count: 30, at: "@треснул", seed: 4}
            - {actor: shape, kind: rect, x: -200, y: -100, w: 1480, h: 2200, origin: top-left, fill: "#ffffff", opacity: [{at: 0, v: 0}, {at: "@звоном", v: 0.7, dur: 0.1}, {at: "@звоном+0.15", v: 0, dur: 0.5}]}
            - {<<: *title, text: "ЛУЧ В КАМЕНЬ", at: "@треснул-0.05", reveal: {by: word, mode: slam, stagger: 0.12}}
    sfx:
      - {sound: sparkle, at: "@Луч", gain: -12}
      - {sound: noise_sweep, at: "@подняла", gain: -14}
      - {sound: impact, at: "@ударил", gain: -12}
      - {sound: boom, at: "@треснул", gain: -10}
      - {sound: metal_ring, at: "@звоном", gain: -12}

  # ------------------------------------------------------------------ 7b. REVEAL — тени вернулись

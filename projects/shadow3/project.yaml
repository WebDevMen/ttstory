  # ------------------------------------------------------------------ 6. TWIST — щит и тень ведут к камню
  - id: lead
    text: "Марта сорвала со стены отцовский щит — Ганс начищал его до блеска. Тень повела её к камню. Она не охотилась. Она ждала первого луча."
    shots:
      - id: t_shield
        transition: {type: whip_x}
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 460, y: 1000}, {t: end, z: 1.2, x: 520, y: 1020}]}
          layers:
            - *sky_eclipse
            - *eclipse_full
            - *forest_dark
            - *ground_dark_far
            - {actor: forge, x: 400, y: 1330, scale: 1.6, brightness: 0.6}
            - {actor: ground, x: -520, y: 1310, w: 2120, h: 800, color: ["#2e2620", "#1a1612"]}
            - {actor: light_pool, x: 900, y: 1250, r: 460, sy: 0.6, color: "#ff9a3a", a: 0.5}
            - {actor: bonfire, x: 960, y: 1360, scale: 0.6, seed: 2, k: 0.6}
            - {actor: shield, id: shld, x: [{at: 0, v: 650}, {at: "@сорвала+0.1", v: 700, dur: 0.6, ease: out}], y: [{at: 0, v: 900}, {at: "@сорвала+0.1", v: 1170, dur: 0.6, ease: out}], r: 95, shine: [{at: 0, v: 0}, {at: "@блеска", v: 1, dur: 0.3}], glow: {color: "#ffd9a0", r: 14, a: 0.6}}
            - {actor: person, id: marta, x: 760, y: 1360, scale: 0.95, view: side, flip: true, look: *marta, face: determined,
               pose: [{at: 0, v: {a1: [4, 6], a2: [-4, 8], l1: [2, 0], l2: [-2, 0]}}, {at: "@сорвала-0.3", v: {a1: [100, 10], a2: [110, 10], l1: [6, 0], l2: [-6, 0]}, dur: 0.3}, {at: "@сорвала+0.3", v: {a1: [50, 60], a2: [50, 60], l1: [2, 0], l2: [-2, 0]}, dur: 0.4}]}
            - {actor: callout, target: "shld", x: 420, y: 560, title: "ЩИТ КУЗНЕЦА", color: gold, size: 44, space: screen, at: "@щит", enter: pop, sfx: false}
      - id: t_forest
        start: "@Тень-0.22"
        transition: {type: whip_x}
        ambience: [{sound: wind, gain: -18}]
        draw:
          camera: {keys: [{t: 0, x: 500, y: 1000, z: 1.0}, {t: end, x: 600, y: 1000, z: 1.06}]}
          layers:
            - {actor: sky, x: -200, w: 1480, hour: 21, par: 0, sun: false, moon: false, horizon: 1100, clouds: 1, seed: 2, colors: ["#0c1020", "#1e2638", "#3a4256"]}
            - {actor: eclipse, x: 820, y: 330, r: 80, cover: 1, par: 0}
            - {actor: light_pool, x: 1050, y: 1150, r: 520, sy: 0.5, color: "#9a7aff", a: 0.45, par: 0.3}
            - {actor: forest, x: 540, y: 1120, w: 2100, h: 300, hill: 60, color: "#121820", seed: 6, par: 0.3}
            - {actor: ground, x: -520, y: 1100, w: 2120, h: 900, color: ["#121820", "#0c1016"], par: 0.3}
            - {actor: tree, kind: pine, h: 560, x: 120, y: 1230, color: "#161e28", par: 0.6, seed: 1}
            - {actor: tree, kind: pine, h: 620, x: 520, y: 1230, color: "#161e28", par: 0.6, seed: 2}
            - {actor: tree, kind: pine, h: 500, x: 900, y: 1230, color: "#161e28", par: 0.6, seed: 3}
            - {actor: ground, x: -520, y: 1215, w: 2120, h: 900, color: ["#1c2028", "#12151b"], par: 0.6}
            - {actor: ground, x: -520, y: 1330, w: 2120, h: 700, color: ["#2a2420", "#1a1612"]}
            # her shadow glides ahead along the ground — a guide, not a hunter
            - {<<: *shade, x: 420, y: 1340, h: 420, alpha: 0.85, lean: 14, reach: 1, anim: [{at: "@Тень-0.22", dur: 3.4, x: 900, ease: out}], arms_up: [{at: "@Тень-0.22", v: 0}, {at: "@ждала", v: 1, dur: 0.5}]}
            - {actor: person, view: side, x: 80, y: 1345, scale: 0.92, look: *marta, walk: [{at: "@Тень-0.22", v: 3.0}, {at: "@ждала", v: 0}], anim: [{at: "@Тень-0.22", dur: 3.6, x: 700, ease: out}]}
            - {actor: shield, x: 132, y: 1170, r: 50, sx: 0.5, anim: [{at: "@Тень-0.22", dur: 3.6, x: 752, ease: out}]}

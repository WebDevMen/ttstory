            - {actor: light_pool, x: 600, y: 1300, r: 460, sy: 0.5, color: "#ff9a3a", a: [{at: 0, v: 0.4}, {at: "@погас", v: 0.8, dur: 0.3}]}
            - {actor: bonfire, x: 760, y: 1320, scale: 0.7, seed: 3, k: [{at: 0, v: 0.7}, {at: "@погас", v: 1.3, dur: 0.3}]}
            - {actor: torch, x: 560, y: 1380, len: 200, rot: 6, halo: 160, k: [{at: 0, v: 1}, {at: "@погас", v: 1.3, dur: 0.3}]}
            - {actor: person, view: side, x: 420, y: 1420, scale: 1.05, look: *godfrid, face: [{at: 0, v: determined}, {at: "@огонь", v: sleep}],
               pose: [{at: 0, v: {a1: [40, 40], a2: [60, 40], l1: [14, 10], l2: [-14, 14], lean: 10}}, {at: "@огонь", v: {a1: [10, 20], a2: [60, 20], l1: [80, 90], l2: [-10, 100], lean: 30, sit: 0.6}, dur: 0.5}]}

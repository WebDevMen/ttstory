            - {<<: *vsh, x: 420, y: 1420, scale: 1.05, look: *godfrid, view: side, angle: 150, alpha: [{at: 0, v: 0.55}, {at: "@забрали", v: 0, dur: 0.6}], len: [{at: 0, v: 1}, {at: "@забрали", v: 0, dur: 0.6}]}
            - {<<: *shade, x: 420, y: 1440, h: 380, alpha: [{at: 0, v: 0}, {at: "@забрали-0.1", v: 0.9, dur: 0.3}], lean: -20, anim: [{at: "@забрали", dur: 0.9, x: 80, ease: in}]}

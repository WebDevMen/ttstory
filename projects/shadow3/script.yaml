brief:
  goal: "Закрыть серию сильной развязкой, которая честно следует правилам мира, и отправить зрителя пересматривать часть 1 (финальная деталь-петля)."
  kpi: [completion, rewatch, comments, follows, shares]
  audience:
    who: "Зрители частей 1–2 и новые зрители, которые любят мистику и финалы с поворотом"
    age: "16–34"
    interests: [мистика, фэнтези, средневековье, апокалипсис, сериалы, загадки]
    pains: ["финалы, где всё решает чудо", "оборванные серии без развязки"]
    desires: ["развязка по правилам, которые уже знаешь", "жертва и победа", "последний поворот, который заставит пересмотреть всё"]
    knowledge: "Знают из частей 1–2: тени входят через твою тень, круг огня защищает, пустые копают у камня, тень Марты предупреждает, через три дня затмение"
  promise: "Чем кончилась история: как девочка и законы света победили тени в полную темноту — и какую деталь ты пропустил в первой части."
  tone: "Эпичный финал: серая тьма затмения, золото последних костров, белый ослепительный луч, тёплый рассвет; в самом конце — тихая жуть."
  keywords: ["тени", "без тени", "затмение", "средневековье", "мистика"]
  constraints:
    - "Вымысел целиком; реальны только длительность полного затмения, первый луч после него, закон отражения и металлические зеркала"
    - "Развязка — только через правила мира (свет, тень, затмение, зеркало), без нового чуда"
    - "Без крови: рыцарь падает, когда его тень забирают; без смерти на экране"
    - "Длина и структура как у частей 1 и 2: 8 блоков, ~60 с; финал отсылает к первому кадру части 1"

research:
  summary: >-
    Финал держится на трёх настоящих вещах. Полное солнечное затмение короткое: фаза полной тени не длится дольше
    7 минут 32 секунд. Когда Луна сходит с диска, первым вспыхивает яркий край — эффект «бриллиантового кольца».
    Зеркало отражает свет под тем же углом, под которым он упал, — им можно направить луч точно в цель. В Средние века
    зеркала были в основном металлическими — поэтому зеркалом становится начищенный щит.
  facts:
    - id: f1
      text: "Полное солнечное затмение не может длиться дольше 7 минут 32 секунд."
      source: "https://en.wikipedia.org/wiki/Solar_eclipse"
      confidence: high
    - id: f2
      text: "В конце полной фазы (третий контакт) появляется «бриллиантовое кольцо» — возвращается первый яркий свет Солнца."
      source: "https://en.wikipedia.org/wiki/Solar_eclipse"
      confidence: high
    - id: f3
      text: "Закон отражения: луч отражается от зеркала под тем же углом, под которым падает на него."
      source: "https://en.wikipedia.org/wiki/Mirror"
      confidence: high
    - id: f4
      text: "В Средние века в Европе зеркала были в основном из полированного металла; стеклянные — редкость."
      source: "https://en.wikipedia.org/wiki/Mirror"
      confidence: high
    - id: f5
      text: "Тень — тёмная область, куда свет от источника не доходит; при нескольких источниках тени перекрываются."
      source: "https://en.wikipedia.org/wiki/Shadow"
      confidence: high
    - id: f6
      text: "В одном и том же месте полное затмение повторяется в среднем раз в 360–410 лет."
      source: "https://en.wikipedia.org/wiki/Solar_eclipse"
      confidence: high
  angles:
    - id: a1
      text: "Затмение гасит защиту, рыцарь жертвует собой, а девочка отражает первый луч после затмения щитом прямо в камень"
      score: 9
      why: "Развязка по правилам мира (свет и тень), реальная физика (длительность затмения, отражение), жертва и победа; финальная деталь отправляет пересматривать часть 1."
    - id: a2
      text: "Марта уходит со своей тенью в камень, чтобы закрыть его изнутри"
      score: 7
      why: "Сильная жертва, но мистическое решение без правил — обманет ожидание «как это работает»."
    - id: a3
      text: "Монах разбивает камень молотом кузнеца"
      score: 5
      why: "Просто и ожидаемо; в части 2 уже показали, что сила здесь не работает."
  chosen_angle: a1
  insights:
    - "Таймер полного затмения на экране — естественный «прогресс» и напряжение: минуты, а не часы."
    - "Щит отца-кузнеца как зеркало связывает семейную линию (отец пустой с части 1) и правило отражения."
    - "Последняя деталь (тень Марты отстаёт) превращает финал в петлю: зритель идёт пересматривать часть 1 и ищет кадр."

hooks:
  variants:
    - {id: h1, type: stakes, vo: "Когда погасло солнце, тени перестали бояться огня. Спасти деревню могла только девочка с живой тенью.", on_screen: "ТЕНИ НЕ БОЯТСЯ ОГНЯ", visual: "Затмение: чёрный диск с короной над деревней, костры круга тускнеют, тени шагают внутрь", score: 9, why: "Отменяет главное правило части 2 — ставки максимальные; вторая фраза обещает героиню и развязку."}
    - {id: h2, type: result_first, vo: "Деревню спас один луч света и щит кузнеца.", on_screen: "ОДИН ЛУЧ", visual: "Белый луч бьёт из щита в чёрный камень", score: 8, why: "Интригует решением, но раскрывает развязку."}
    - {id: h3, type: question, vo: "Как победить тень, когда весь мир — тень?", on_screen: "ВЕСЬ МИР — ТЕНЬ", visual: "Деревня во тьме затмения, всё залито тенью", score: 8, why: "Чистая загадка, хорошо для новых зрителей."}
    - {id: h4, type: curiosity_gap, vo: "Затмение длится минуты. У Марты было ровно столько.", on_screen: "У НЕЁ ЕСТЬ МИНУТЫ", visual: "Таймер над диском затмения", score: 8, why: "Таймер и ставки, но без контекста непонятно, кто Марта."}
    - {id: h5, type: visual_shock, vo: "Рыцарь держал огонь, пока его собственная тень не ушла.", on_screen: "ЖЕРТВА РЫЦАРЯ", visual: "Рыцарь с факелом, его тень отрывается и уходит", score: 7, why: "Эмоционально, но спойлерит середину."}
    - {id: h6, type: callout, vo: "Если ты смотрел первую часть, ты пропустил одну деталь.", on_screen: "ТЫ ПРОПУСТИЛ ДЕТАЛЬ", visual: "Стоп-кадр площади из части 1 с лупой", score: 7, why: "Сильно для пересмотров, но отрезает новых зрителей."}
    - {id: h7, type: imagine, vo: "Представь: солнце гаснет, а твой единственный щит — огонь.", on_screen: "СОЛНЦЕ ГАСНЕТ", visual: "Человек в кольце костров под затмением", score: 7, why: "Личное «ты», но размыто."}
    - {id: h8, type: shock_fact, vo: "Полное затмение длится не дольше семи с половиной минут. Тени хватило бы и этого.", on_screen: "7 МИНУТ ТЬМЫ", visual: "Таймер 7:32 на фоне короны", score: 8, why: "Реальный факт-крючок, но холоднее истории."}
  primary: h1
  ab: [h4, h3]

beats:
  # ------------------------------------------------------------------ 1. HOOK
  - id: hook
    role: hook
    title: "Тени не боятся огня"
    goal: "Отменить главное правило части 2 (круг огня) — максимальные ставки; открыть петлю «как спасёт девочка»."
    vo: "Когда погасло солнце, тени перестали бояться огня. Спасти деревню могла только девочка с живой тенью."
    on_screen: "ТЕНИ НЕ БОЯТСЯ ОГНЯ"
    devices: [open_loop, stakes_raise, text_reinforcement, visual_proof, sound_hit]
    music: dark
    marks: {"перестали бояться огня": "#ff6a3d"}
    accent: "#e8eef7"
    shots:
      - id: h_eclipse
        visual: "Затмение над деревней: чёрный диск с белой короной, серо-синие сумерки днём, звёзды; внизу церковный двор с кольцом костров — пламя тускнеет, тени шагают через кольцо внутрь."
        actors: [sky, new:eclipse, stars, new:chapel, new:bonfire, new:living_shadow, person, ground]
        camera: "Сверху вниз от затмения к кольцу костров"
        animation:
          - {at: "@start", what: "Последний серп солнца исчезает"}
          - {at: "@погасло", what: "Вспыхивает корона, двор погружается в серую тьму"}
          - {at: "@тени", what: "Тени перешагивают через кольцо костров"}
          - {at: "@огня", what: "Пламя костров сжимается и тускнеет"}
        graphics:
          - {at: "@start", type: chip, text: "ЧАСТЬ 3/3 · ЗАТМЕНИЕ"}
          - {at: "@огня", type: "text slam", text: "ТЕНИ НЕ БОЯТСЯ ОГНЯ"}
        sfx:
          - {at: "@start", sound: riser}
          - {at: "@огня", sound: impact}
        ambience: [wind, fire]
        transition: cut
      - id: h_marta
        at: "@Спасти-0.1"
        visual: "Марта в центре круга, рыжая коса, зелёное платье, в руках круглый щит; позади её тень стоит отдельно — и смотрит туда же, куда она, в сторону леса."
        actors: [person, new:cast_shadow, new:shield, new:bonfire, sky]
        camera: "Наезд на Марту и её тень"
        animation:
          - {at: "@девочка", what: "Марта поднимает голову"}
          - {at: "@тенью", what: "Тень за её спиной поворачивается к лесу"}
        graphics:
          - {at: "@девочка", type: callout, text: "МАРТА"}
        sfx:
          - {at: "@тенью", sound: hiss}
        transition: zoom

  # ------------------------------------------------------------------ 2. CONTEXT
  - id: context
    role: context
    title: "Финал. Затмение"
    goal: "Коротко ввести новых зрителей: финал, затмение, круг огня перестал защищать."
    vo: "Часть третья, финал. Затмение. Костры горят, но их света мало — тени идут сквозь круг."
    on_screen: "СВЕТА СЛИШКОМ МАЛО"
    devices: [callback, progress, pattern_interrupt]
    facts: [f5]
    music: tension
    shots:
      - id: c_recap
        visual: "Карточка-напоминание: схема круга костров из части 2 (человек в центре, тени тают) — и в ней же гаснет солнце: тени возвращаются и становятся плотными."
        actors: [new:bonfire, person, new:cast_shadow, shape, timetag]
        camera: "Медленный наезд"
        animation:
          - {at: "@Часть", what: "Схема круга из части 2 разворачивается"}
          - {at: "@Затмение", what: "Фон схемы темнеет до серого"}
        graphics:
          - {at: "@Часть", type: timetag, text: "ЧАСТЬ 2 · ПРАВИЛА"}
        sfx:
          - {at: "@Затмение", sound: noise_sweep}
        transition: whip_x
      - id: c_ring
        at: "@Костры-0.1"
        visual: "Кольцо костров сбоку: люди внутри жмутся друг к другу; свет костров не дотягивается до краёв — тени проступают и идут сквозь кольцо."
        actors: [new:bonfire, person, new:living_shadow, new:chapel, sky, ground]
        camera: "Панорама вдоль кольца"
        animation:
          - {at: "@мало", what: "Пятна света вокруг костров сжимаются"}
          - {at: "@сквозь", what: "Тени проходят между кострами"}
        graphics:
          - {at: "@мало", type: "text slam", text: "СВЕТА СЛИШКОМ МАЛО"}
        sfx:
          - {at: "@мало", sound: kick}
          - {at: "@сквозь", sound: creature}
        transition: dip

  # ------------------------------------------------------------------ 3. PROBLEM — камень пьёт свет
  - id: problem
    role: problem
    title: "Камень пьёт свет"
    goal: "Ответ на загадку части 2 (что копали пустые) и источник беды: камень поднялся и пьёт свет."
    vo: "А в лесу пустые выкопали камень. Он поднялся над ямой и пил свет. Даже пламя гнулось к нему."
    on_screen: "КАМЕНЬ ПЬЁТ СВЕТ"
    devices: [callback, visual_proof, mini_payoff, pattern_interrupt]
    music: dark
    shots:
      - id: p_rise
        visual: "Воронка в лесу под затмением: пустые (Ганс, Томас и другие, без теней) стоят по краю неподвижно; чёрный камень медленно поднимается из ямы и зависает над ней."
        actors: [new:crater, new:star_stone, person, tree, sky, new:eclipse]
        camera: "Снизу вверх за камнем"
        animation:
          - {at: "@выкопали", what: "Пустые опускают лопаты"}
          - {at: "@поднялся", what: "Камень поднимается над ямой, вокруг осыпается земля"}
        graphics:
          - {at: "@выкопали", type: callout, text: "ВОТ ЧТО ОНИ КОПАЛИ"}
        sfx:
          - {at: "@поднялся", sound: groan}
        ambience: [rumble]
        transition: whip_x
      - id: p_drink
        at: "@пил-0.1"
        visual: "Крупно: от факелов пустых тянутся нити света к камню и исчезают в нём; языки пламени гнутся к камню, как от ветра."
        actors: [new:star_stone, new:torch, particles]
        camera: "Медленный наезд на камень"
        animation:
          - {at: "@пил", what: "Нити света втягиваются в камень"}
          - {at: "@пламя", what: "Пламя факелов наклоняется к камню"}
        graphics:
          - {at: "@пил", type: "text stamp", text: "КАМЕНЬ ПЬЁТ СВЕТ"}
        sfx:
          - {at: "@пил", sound: noise_sweep}
          - {at: "@пламя", sound: hiss}
        transition: zoom

  # ------------------------------------------------------------------ 4. ESCALATION — жертва рыцаря
  - id: escalation
    role: escalation
    title: "Последний у костров"
    goal: "Жертва: рыцарь держит огонь, пока у него не забирают тень, — круг держится ценой героя."
    vo: "Сир Годфрид держал огонь последним. Держал, пока его тень не забрали. Но огонь не погас."
    on_screen: "ОН ДЕРЖАЛ ОГОНЬ"
    devices: [emotion, stakes_raise, sound_hit]
    music: epic
    shots:
      - id: e_knight
        visual: "Сир Годфрид у последнего костра с двумя факелами в руках, отмахивается ими от теней; по его плащу ползут тени; позади люди в кругу."
        actors: [person, new:torch, new:bonfire, new:living_shadow, sky, ground]
        camera: "Снизу, медленный облёт рыцаря"
        animation:
          - {at: "@Годфрид", what: "Рыцарь вскидывает факелы над головой"}
          - {at: "@тень", what: "Тень рыцаря отрывается от него и уходит в темноту"}
        graphics:
          - {at: "@Годфрид", type: callout, text: "СИР ГОДФРИД"}
        sfx:
          - {at: "@Годфрид", sound: whoosh}
          - {at: "@забрали", sound: groan}
        ambience: [fire]
        transition: whip_x
      - id: e_fall
        at: "@Но-0.1"
        visual: "Рыцарь опускается на колено, факел втыкается в землю и продолжает гореть; огонь костра за ним вспыхивает выше."
        actors: [person, new:torch, new:bonfire, sky]
        camera: "Медленный наезд на факел"
        animation:
          - {at: "@огонь#2", what: "Рыцарь опускается на колено, факел втыкается в землю"}
          - {at: "@погас", what: "Пламя вспыхивает выше"}
        graphics:
          - {at: "@погас", type: "text stamp", text: "ОН ДЕРЖАЛ ОГОНЬ"}
        sfx:
          - {at: "@погас", sound: boom}
        transition: dip

  # ------------------------------------------------------------------ 5. PROOF — затмение, луч, зеркало
  - id: rule
    role: proof
    title: "Первый луч и зеркало"
    goal: "Как это работает: затмение короткое, первый луч после него, зеркало возвращает свет под тем же углом — план победы."
    vo: "Ансельм знал главное. Полное затмение длится не больше семи с половиной минут. Потом из-за Луны бьёт первый луч. А зеркало возвращает свет под тем же углом."
    on_screen: "МАКСИМУМ 7,5 МИНУТ"
    devices: [mini_payoff, visual_proof, number_reveal, progress]
    facts: [f1, f2, f3, f4]
    music: pulse
    shots:
      - id: r_timer
        visual: "Схема-пергамент: солнце, на него наезжает луна; рядом песочные часы и таймер, отсчитывающий от 7:32."
        actors: [new:eclipse, new:hourglass, text, shape]
        camera: "Статично, лёгкий наезд"
        animation:
          - {at: "@Ансельм", what: "Рука монаха ставит на пергамент песочные часы"}
          - {at: "@семи", what: "Луна закрывает солнце, таймер начинает отсчёт"}
        graphics:
          - {at: "@семи", type: counter, text: "МАКСИМУМ 7,5 МИНУТ"}
        sfx:
          - {at: "@Ансельм", sound: click}
          - {at: "@семи", sound: kick}
        transition: whip_x
      - id: r_ring
        at: "@Потом-0.1"
        visual: "Та же схема: луна сходит с края солнца, на краю вспыхивает яркая точка — «бриллиантовое кольцо»; от точки выходит белый луч."
        actors: [new:eclipse, shape, text]
        camera: "Наезд на вспышку"
        animation:
          - {at: "@первый", what: "На краю солнца вспыхивает бриллиантовое кольцо"}
          - {at: "@луч", what: "Из вспышки выходит белый луч"}
        graphics:
          - {at: "@луч", type: callout, text: "ПЕРВЫЙ ЛУЧ"}
        sfx:
          - {at: "@первый", sound: sparkle}
        transition: zoom
      - id: r_mirror
        at: "@зеркало-0.1"
        visual: "Схема отражения: луч падает на круглый щит под углом, отражается под тем же углом и уходит в чёрный кружок-камень; две дуги углов подписаны одинаково."
        actors: [new:shield, shape, text, new:star_stone]
        camera: "Статично"
        animation:
          - {at: "@зеркало", what: "Луч падает на щит"}
          - {at: "@углом", what: "Отражённый луч уходит в камень, дуги углов вспыхивают одинаково"}
        graphics:
          - {at: "@углом", type: badge, text: "УГОЛ ПАДЕНИЯ = УГОЛ ОТРАЖЕНИЯ"}
        sfx:
          - {at: "@углом", sound: chime}
        transition: dip

  # ------------------------------------------------------------------ 6. TWIST — тень ведёт
  - id: lead
    role: twist
    title: "Тень ведёт к камню"
    goal: "Поворот: тень Марты — проводник; она знала план с самого начала."
    vo: "Тень Марты повела её к камню. Она не охотилась. Она ждала первого луча."
    on_screen: "ТЕНЬ ВЕДЁТ"
    devices: [twist, callback, emotion]
    music: tension
    shots:
      - id: t_forest
        visual: "Тёмный лес под затмением: тень Марты скользит впереди по земле и стволам, Марта бежит за ней со щитом; между деревьями видно бледное свечение воронки."
        actors: [tree, person, new:living_shadow, new:shield, sky, ground]
        camera: "Камера бежит следом"
        animation:
          - {at: "@повела", what: "Тень скользит вперёд, Марта бежит"}
          - {at: "@ждала", what: "Тень останавливается у края воронки и указывает рукой на небо"}
        graphics:
          - {at: "@повела", type: "text slam", text: "ТЕНЬ ВЕДЁТ"}
        sfx:
          - {at: "@повела", sound: footstep}
          - {at: "@ждала", sound: heartbeat}
        ambience: [wind]
        transition: whip_x

  # ------------------------------------------------------------------ 7. PAYOFF — луч в камень
  - id: light
    role: payoff
    title: "Луч"
    goal: "Развязка по правилам: первый луч, щит-зеркало, камень треснул, тени вернулись, Томас снова с тенью."
    vo: "Луч! Марта подняла отцовский щит, начищенный как зеркало. Свет ударил в камень, и тот треснул."
    on_screen: "ЛУЧ В КАМЕНЬ"
    devices: [mini_payoff, visual_proof, emotion, sound_hit]
    facts: [f2, f3]
    music: epic
    shots:
      - id: l_beam
        visual: "Край воронки: на небе вспыхивает бриллиантовое кольцо, белый луч падает на щит в руках Марты, отражается и бьёт в висящий над ямой камень."
        actors: [new:eclipse, person, new:shield, new:star_stone, new:crater, tree, particles]
        camera: "Резкий наезд по лучу к камню"
        animation:
          - {at: "@Луч", what: "Вспышка бриллиантового кольца, луч падает на щит"}
          - {at: "@подняла", what: "Марта поворачивает щит, по нему пробегает блик"}
          - {at: "@зеркало", what: "Отражённый луч бьёт в камень"}
        graphics:
          - {at: "@зеркало", type: callout, text: "ЩИТ КУЗНЕЦА = ЗЕРКАЛО"}
        sfx:
          - {at: "@Луч", sound: sparkle}
          - {at: "@подняла", sound: noise_sweep}
        transition: flash
      - id: l_crack
        at: "@треснул-0.1"
        visual: "Камень покрывается сияющими трещинами и раскалывается; осколки света разлетаются, лес вокруг воронки вспыхивает белым."
        actors: [new:star_stone, particles, new:crater, tree]
        camera: "Тряска, затем отъезд"
        animation:
          - {at: "@треснул", what: "Трещины света, камень раскалывается"}
        graphics:
          - {at: "@треснул", type: "text stamp", text: "ЛУЧ В КАМЕНЬ"}
        sfx:
          - {at: "@треснул", sound: boom}
        transition: zoom

  # ------------------------------------------------------------------ 7b. REVEAL — тени возвращаются
  - id: return
    role: reveal
    title: "Тени вернулись"
    goal: "Закрыть главную петлю: тени возвращаются к хозяевам, Томас снова с тенью."
    vo: "Тени рванули к хозяевам. Томас вдохнул — и открыл глаза. Под ним снова лежала тень."
    on_screen: "ТЕНИ ВЕРНУЛИСЬ"
    devices: [mini_payoff, emotion, visual_proof]
    music: calm
    shots:
      - id: l_fly
        visual: "Из осколков камня во все стороны вылетают тени и мчатся к пустым, стоящим по краю воронки, — прилипают к их ногам; рассветный свет возвращается."
        actors: [new:living_shadow, person, new:crater, tree, sky, particles]
        camera: "Отъезд, чтобы видеть всю воронку"
        animation:
          - {at: "@рванули", what: "Тени летят к людям"}
          - {at: "@хозяевам", what: "Тени прилипают к ногам пустых, небо светлеет"}
        graphics:
          - {at: "@хозяевам", type: "text slam", text: "ТЕНИ ВЕРНУЛИСЬ"}
        sfx:
          - {at: "@рванули", sound: whoosh}
        transition: cut
      - id: l_tomas
        at: "@Томас-0.1"
        visual: "Рассветный свет возвращается: Томас моргает, в глазах снова блики, он делает вдох; под ним на траве ложится тень. Рядом Ганс обнимает сына."
        actors: [person, new:cast_shadow, sky, tree, ground]
        camera: "Медленный наезд на тень под ногами Томаса"
        animation:
          - {at: "@вдохнул", what: "Томас вдыхает, глаза оживают"}
          - {at: "@тень", what: "Под ним ложится тень"}
        graphics: []
        sfx:
          - {at: "@вдохнул", sound: breath}
          - {at: "@тень", sound: chime}
        ambience: [birds]
        transition: dip

  # ------------------------------------------------------------------ 8. CTA / LOOP
  - id: cta
    role: cta
    title: "Тень отстаёт"
    goal: "Последний поворот и пересмотр: тень Марты отстаёт на миг — зритель ищет это в первой части и пишет секунду."
    vo: "Но тень Марты с тех пор отстаёт. На миг. Найди это в первой части."
    on_screen: "НАЙДИ В ЧАСТИ 1"
    devices: [comment_bait, rewatch_trigger, loop_ending, direct_address, callback]
    music: drone
    shots:
      - id: q_lag
        visual: "Утро, площадь Вельмара, как в первом кадре части 1: люди с тенями; Марта идёт через площадь — её тень повторяет шаги с опозданием; на последнем шаге тень поворачивает голову к зрителю."
        actors: [sky, new:cottage, new:well, person, new:cast_shadow, ground]
        camera: "Медленный наезд на Марту"
        animation:
          - {at: "@отстаёт", what: "Марта останавливается — тень делает ещё шаг и замирает"}
          - {at: "@миг", what: "Тень поворачивает голову к камере"}
        graphics: []
        sfx:
          - {at: "@отстаёт", sound: footstep}
          - {at: "@миг", sound: hiss}
        ambience: [birds]
        transition: dip
      - id: q_find
        at: "@Найди-0.1"
        visual: "Стоп-кадр первого кадра части 1 в рамке-плёнке, лупа скользит по площади к Марте; таймер ролика «0:0?»."
        actors: [new:cottage, person, new:cast_shadow, text, badge]
        camera: "Наезд вслед за лупой"
        animation:
          - {at: "@первой", what: "Кадр части 1 появляется в рамке"}
          - {at: "@части", what: "Лупа останавливается на Марте"}
        graphics:
          - {at: "@первой", type: "text slam", text: "НАЙДИ В ЧАСТИ 1"}
          - {at: "@части", type: badge, text: "НА КАКОЙ СЕКУНДЕ?"}
        sfx:
          - {at: "@первой", sound: click}
          - {at: "@части", sound: bell}
        transition: whip_x

loops:
  - {id: l1, question: "Как девочка с живой тенью спасёт деревню, если огонь больше не защищает?", open: hook, close: return}
  - {id: l2, question: "Что копали пустые в лесу (из части 2)?", open: context, close: problem}
  - {id: l3, question: "Зачем тень Марты ведёт её к камню?", open: lead, close: light}


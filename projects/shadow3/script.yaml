# СЦЕНАРИЙ: «Без тени», часть 3 из 3 — «Затмение»
# Серия: три равные части по ~60 с, одна история (план серии: projects/shadow1/series.md). Вымысел; skill write-script.
# Проверка: python3 vg.py script check shadow3 [--tts] · документ: python3 vg.py script render shadow3
#
# Время (at:) — ссылки на слова текста ЭТОГО блока: "@слово", "@слово#2", "@слово.end", "@слово+0.3",
# "@start"/"@end" блока, "@другой_блок/слово" или число = секунды от начала блока.

version: 1

meta:
  title: "Без тени. Часть 3: Затмение"
  topic: "Без тени, часть 3: затмение, камень, который пьёт свет, и первый луч в зеркале щита (средневековая мистика, вымысел)"
  wishes: "Финал серии из 3 равных частей; жертва рыцаря, развязка через законы света, финальный поворот-петля к части 1"
  language: ru
  platforms: [tiktok, reels, shorts]

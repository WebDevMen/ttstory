brief:
  goal: "Рассказать одну понятную фантастическую историю так, чтобы зритель досмотрел три минуты, понял оба правила мира и поспорил в комментариях: крыша или лифт."
  kpi: [completion, comments, rewatch, shares, follows]
  audience:
    who: "Зрители страшилок-«протоколов», фантастики и сюжетных роликов в ленте, которые любят правила выживания и спорят, как поступили бы сами"
    age: "16–34"
    interests: [фантастика, страшные истории, правила выживания, «Чёрное зеркало», аниме-апокалипсис]
    pains: ["протоколы-страшилки, где правила ничем не объяснены", "непонятно, кто герой и за кого бояться", "финал «ответ во второй части» без ответа"]
    desires: ["правила мира, по которым можно «играть» самому", "живые герои и спор, где у каждого своя правда", "финал, после которого хочется пересмотреть начало"]
    knowledge: "Знают формат «протоколов» и сирену «Внимание всем»; ничего не знают об этом мире — всё объясняется по ходу"
  promise: "Одна история про отца и дочь в городе, который падает в небо: два простых правила, звонок с собственного номера и финал, который объясняет этот звонок."
  tone: "Холодный утренний дождь и бетон панелек против тёплого жёлтого зонта; тишина вместо скримеров, жуть от простых вещей — капель, весов, следов на потолке."
  keywords: ["дождь вверх", "обратный прилив", "протокол", "город в небе", "фантастика"]
  constraints:
    - "Вымысел целиком: город, двор на Речной, люди и протокол 07 придуманы; реальны вес облака, скорость капли, сигнал «Внимание всем», литр воды = килограмм"
    - "Одна точка зрения — Глеб: всё, что видит зритель, видит он"
    - "Два правила мира, не больше; оба проверены на людях с цифрой (весы 22 → 9 → 20 кг; этаж воды за шесть минут)"
    - "Без крови и скримеров; люди уходят вверх, в облака, — без подробностей; 13+"
    - "Из шаблона не взяты дословно: тень за дверью, огнетушитель, «выше второго этажа» — заменены правилами этого мира"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах: облако — это сотни тонн воды, которые висят в воздухе; капля
    дождя падает со скоростью около восьми метров в секунду; литр воды весит килограмм, поэтому промокший ребёнок
    заметно тяжелеет — а в нашем мире легчает. Сигнал «Внимание всем» в России — сирены и затем речевое сообщение:
    из этого вырос голос «Системы».
  facts:
    - id: f1
      text: "Кучевое облако размером примерно километр на километр весит около 500 тонн (1,1 млн фунтов) — и висит в воздухе."
      source: "https://www.usgs.gov/media/images/how-much-does-a-cloud-weigh"
      confidence: high
    - id: f2
      text: "Капля диаметром 3 мм падает с установившейся скоростью около 8 м/с; капли обычно 0,5–4 мм."
      source: "https://en.wikipedia.org/wiki/Raindrop"
      confidence: high
    - id: f3
      text: "Сигнал «Внимание всем!» — сирены и прерывистые гудки, после которых по радио и телевидению передаётся речевое сообщение о том, что делать."
      source: "https://mchs.gov.ru/deyatelnost/press-centr/novosti/4463772"
      confidence: medium
    - id: f4
      text: "Литр воды весит около одного килограмма."
      source: "https://en.wikipedia.org/wiki/Litre"
      confidence: high
    - id: f5
      text: "Мокрое тело теряет тепло намного быстрее, чем сухое: вода отводит тепло быстрее воздуха."
      source: "https://en.wikipedia.org/wiki/Hypothermia"
      confidence: high
  angles:
    - id: a1
      archetype: time_loop
      text: "Отец спасает дочь в городе, который падает в небо, по подсказкам голоса из телефона — а в конце понимает, что звонил он сам, из верхнего города"
      paradox: "Чтобы спастись, Глеб должен поверить самому себе, а не официальной системе; а спасшись, он сам становится этим голосом"
      score: 9
      why: "Личная ставка (дочь), простые часы (три минуты, этаж за шесть минут), спор с соседом, дилемма «крыша или лифт» и финал-петля, который отправляет пересматривать звонок в начале."
    - id: a2
      archetype: role_swap
      text: "Официальный протокол эвакуации — и есть подъём: сирена зовёт людей на крыши, ближе к небу"
      paradox: "Спасатель оказывается механизмом беды"
      score: 8
      why: "Сильная жуть, взята внутрь a1 как цена дилеммы: кто пошёл на крышу — ушёл в облака."
    - id: a3
      archetype: rule_break
      text: "Гравитация меняется только для мокрого: сухое падает вниз, мокрое — вверх"
      paradox: "Вода, которая всегда тянет вниз, утягивает в небо; спасает полотенце"
      score: 8
      why: "Это правило мира №1 — «опыт», который зритель может сыграть сам (весы, полотенце, газ)."
    - id: a4
      archetype: inhuman_pov
      text: "История глазами дождевой капли, которая падает вверх"
      paradox: "Капля помнит, откуда упала"
      score: 5
      why: "Красиво, но не за кого бояться; теряется ясность."
  chosen_angle: a1
  insights:
    - "Ставка понятна за секунду: девочка в мокрой куртке отрывается от асфальта — объяснять ничего не надо."
    - "Правила даны цифрами, которые можно проверить: весы 22 → 9 → 20 кг; вода в доме опускается на этаж за шесть минут."
    - "Спор у лестницы — дилемма без правильного ответа: официальная эвакуация на крышу или собственный голос из телефона."
    - "Улика звонка сеется трижды: звонок до события, голос знает про ключ в левом кармане, днища городов в облаках — и щёлкает в финале."

story:
  logline: "Глеб, лифтёр, должен спасти дочь Соню в городе, где всё мокрое падает в небо, но сирена зовёт на крышу, а голос с его собственного номера — в яму лифта; ошибётся — дочь уйдёт в облака."
  retell: "Дождь пошёл вверх, и промокшая Соня чуть не улетела. Сирена зовёт на крыши, а голос Глеба из телефона — в яму лифта. Глеб слушает себя, дом взлетает над точно таким же городом, и звонить вниз теперь ему."
  premise: "Что если в шесть сорок две дождь пошёл вверх — и всё, что намокло, стало падать в небо?"
  paradox: "Вода, которая тянет вниз, тянет вверх; спасает не эвакуация, а сухая стальная коробка в самом низу дома — и голос, который принадлежит тебе самому"
  genre: "фантастика, лёгкий хоррор"
  world_rules:
    - id: r1
      rule: "Всё, что намокло под этим дождём, теряет вес и падает вверх; высохнет — снова тяжёлое. На человека — около трёх минут"
      test: "Соня промокла: на весах Петровича девять килограммов вместо утренних двадцати двух; полотенца и газ — через минуту двадцать"
      shown_in: rule
      basis: f4
    - id: r2
      rule: "Вода в доме течёт вверх, копится под крышей и затапливает дом сверху вниз — этаж за шесть минут"
      test: "Вода ползёт по стене подъезда вверх; девятый этаж уже под водой, через шесть минут — восьмой; на потолке площадки следы тех, кто промок"
      shown_in: water
      basis: f1
  characters:
    - id: gleb
      name: "Глеб"
      intro: "Глеб, двадцать девять лет, лифтёр. Знает в этом доме каждый трос."
      role: "герой, точка зрения; отец Сони"
      want: "удержать дочь на земле"
      fear: "не успеть схватить её за руку"
      look: "тёмная куртка лифтёра с отражающей полосой, рабочий пояс с ключами"
      arc: "от «сбросить странный звонок» — к тому, что он сам набирает свой номер"
    - id: sonya
      name: "Соня"
      intro: "Соня, семь лет, его дочь. Складывает жёлтый зонт, чтобы ловить дождь языком."
      role: "дочь, ставка"
      want: "поймать дождь языком"
      fear: "улететь от папы"
      look: "жёлтая куртка, две косички, жёлтый зонт"
      arc: "ловит дождь → чуть не улетает → считает этажи в кабине лифта"
    - id: petrovich
      name: "Аркадий Петрович"
      intro: "Аркадий Петрович, семьдесят лет. Тридцать лет на метеостанции."
      role: "сосед с первого этажа, голос порядка и опыта"
      want: "спасти всех по правилам"
      fear: "что система, которой он верил тридцать лет, ошибается"
      look: "седой, очки, вязаный жилет, транзисторный приёмник"
      arc: "спасает Соню полотенцами — и уходит с соседями на крышу, по сирене"
    - id: system
      name: "Оповещение"
      role: "женский голос городской системы оповещения из динамиков; говорит правилами протокола"
      want: "чтобы жители выполнили протокол"
      fear: "—"
      look: "нет лица: решётка динамика, красная плашка на экране"
      arc: "от правил, которые спасают, — к инструкции, после которой безопасного выхода нет"
  twists:
    - id: t1
      what: "Голос с номера Глеба — сам Глеб из верхнего города: их город теперь висит над точно таким же, где снова шесть сорок одна"
      setup: [hook, setup, call]
      payoff: twist
    - id: t2
      what: "Спасает самый низ дома: земля мокрая с ночи, и весь квартал падает в небо целиком — а сухая кабина лифта в яме летит вместе с ним"
      setup: [setup, rule, water]
      payoff: pit
  dilemmas:
    - id: d1
      beat: dilemma
      who: gleb
      question: "Вести дочь на крышу, как велит сирена, или спрятать её в яме лифта, как велит его собственный голос?"
      options: ["Крыша: эвакуация в семь, все соседи и Петрович там — но на крыше идёт дождь", "Яма лифта: сухо, но вода опускается этаж за шесть минут, и в подвале их никто не найдёт"]
  stakes:
    - {beat: setup, level: personal}
    - {beat: problem, level: family}
    - {beat: rule, level: family}
    - {beat: call, level: community}
    - {beat: dilemma, level: community}
    - {beat: pit, level: community}
    - {beat: twist, level: world}

hooks:
  variants:
    - {id: h1, type: rule_warning, vo: "Дождь пошёл вверх? Высохните за три минуты. Иначе упадёте в небо.", on_screen: "ПРОТОКОЛ 07", visual: "Мокрая улица на рассвете: капли летят вверх, машина врезается в фонарь и не падает, а всплывает", score: 9, why: "Правило, срок и цена в первой фразе; аномалия видна без звука."}
    - {id: h2, type: anomaly, vo: "Машина врезалась в столб. И не упала. Она всплыла.", on_screen: "ДОЖДЬ ИДЁТ ВВЕРХ", visual: "Машина у столба медленно поднимается, с неё капает вверх", score: 8, why: "Мгновенная аномалия, но нет срока и ставки."}
    - {id: h3, type: stakes, vo: "У промокшего ребёнка три минуты. Потом он упадёт в небо.", on_screen: "3 МИНУТЫ", visual: "Девочка в мокрой куртке отрывается от асфальта, отец держит её за руку", score: 8, why: "Сильная личная ставка, но раскрывает инцидент раньше времени."}
    - {id: h4, type: speculative, vo: "В шесть сорок две дождь пошёл вверх. А с ним — всё, что намокло.", on_screen: "06:42", visual: "Капли замирают в воздухе и летят вверх", score: 8, why: "Хорошая формула, но без обращения к зрителю."}
    - {id: h5, type: visual_shock, vo: "Над городом в облаках висит днище другого города.", on_screen: "ДНО В ОБЛАКАХ", visual: "Снизу видны фундаменты, трубы и корни целого квартала", score: 7, why: "Загадочно, но спойлерит финал."}
    - {id: h6, type: result_first, vo: "Его спас звонок с собственного номера.", on_screen: "ЗВОНИТ: ГЛЕБ", visual: "Экран телефона: входящий с номера владельца", score: 7, why: "Интрига есть, но нет мира и правила."}
    - {id: h7, type: imagine, vo: "Представь: твой зонт падает вверх.", on_screen: "ЗОНТ ПАДАЕТ ВВЕРХ", visual: "Жёлтый зонт уходит в облака", score: 6, why: "«Представь» — штамп, медленный вход."}
    - {id: h8, type: question, vo: "Что ты сделаешь, если дождь пойдёт вверх?", on_screen: "ДОЖДЬ ВВЕРХ?", visual: "Капли летят вверх", score: 5, why: "Вопрос-лекция, слабее правила с цифрой."}
  primary: h1
  ab: [h2, h4]

beats:
  # ------------------------------------------------------------------ 1. HOOK — голос Системы, правило-предупреждение
  - id: hook
    role: hook
    title: "Три минуты"
    goal: "Сразу правило, срок и цена: мокрое падает в небо через три минуты."
    vo: "Дождь пошёл вверх? Высохните за три минуты. Иначе упадёте в небо."
    lines:
      - {who: system, say: "Дождь пошёл вверх? Высохните за три минуты. Иначе упадёте в небо."}
    on_screen: "ПРОТОКОЛ 07 · ОБРАТНЫЙ ПРИЛИВ"
    devices: [open_loop, stakes_raise, visual_proof, text_reinforcement, sound_hit]
    music: drone
    marks: {"дождь пошёл вверх": "#7fd8ff", "три минуты": "#ffd23a"}
    accent: "#7fd8ff"
    shots:
      - id: k_car
        visual: "Мокрая улица между панельками на рассвете, синий свет, фонари. Седан врезается в фонарный столб — и вместо того, чтобы замереть, медленно отрывается от асфальта; капли дождя вокруг летят вверх, с машины капает вверх. Дальний план — панельки в дымке, ближний — мокрый асфальт с отражениями."
        actors: [sky, building, street, streetlight, ground, new:sedan, new:rain, particles]
        camera: "Низкий план, медленный подъём камеры вслед за машиной; толчок на ударе"
        animation:
          - {at: "@start", what: "Капли падают вниз, машина едет"}
          - {at: "@дождь", what: "Удар о столб, капли замирают и разворачиваются вверх"}
          - {at: "@вверх", what: "Машина отрывается от асфальта"}
          - {at: "@минуты", what: "Таймер 3:00 начинает обратный счёт"}
        graphics:
          - {at: "@три", type: badge, text: "3:00"}
        sfx:
          - {at: "@start", sound: impact, note: "удар о столб"}
          - {at: "@вверх", sound: riser}
        ambience: [rain, city]
        transition: cut
      - id: k_title
        at: "@Иначе-0.1"
        visual: "Общий план: машина, вывеска и мусорный бак поднимаются к облакам; в просвете облаков еле видно тёмное днище другого квартала — фундаменты и трубы (пасхалка). Крупно: «ПРОТОКОЛ 07 · ОБРАТНЫЙ ПРИЛИВ»."
        actors: [sky, cloud, skyline, building, new:sedan, new:rain, new:city_chunk, text]
        camera: "Резкий подъём камеры вверх, к облакам"
        animation:
          - {at: "@Иначе", what: "Камера уходит вверх за машиной"}
          - {at: "@небо", what: "Заголовок бьётся в кадр, в облаках проступает днище квартала"}
        graphics:
          - {at: "@небо", type: "text slam", text: "ПРОТОКОЛ 07 · ОБРАТНЫЙ ПРИЛИВ"}
        sfx:
          - {at: "@небо", sound: boom}
        transition: whip_y

  # ------------------------------------------------------------------ 2. SETUP — двор, герои, первый звонок (улика 1)
  - id: setup
    role: setup
    title: "Двор на Речной"
    goal: "Кто и где: Глеб и Соня во дворе под дождём; Соня складывает зонт; звонок с собственного номера — Глеб сбрасывает."
    vo: "Шесть сорок одна. Двор на Речной. Дождь идёт всю ночь. Глеб, двадцать девять лет, лифтёр. Знает в этом доме каждый трос. Соня, семь лет, его дочь. Складывает жёлтый зонт, чтобы ловить дождь языком. Сонь, промокнешь! Пап, он сладкий! У Глеба жужжит телефон. Звонит Глеб. Его собственный номер. Он сбрасывает."
    lines:
      - {who: gleb, say: "Сонь, промокнешь!"}
      - {who: sonya, say: "Пап, он сладкий!"}
    scene: {when: "06:41, утро", where: "двор девятиэтажки на Речной"}
    on_screen: "06:41 · ДВОР НА РЕЧНОЙ"
    devices: [relatability, emotion, open_loop, pattern_interrupt]
    music: drone
    shots:
      - id: s_yard
        visual: "Двор панельной девятиэтажки в утреннем дожде: козырёк подъезда с лампой, лужи, детская горка, деревья; на заднем плане ещё панельки в дымке. Метка «06:41 · РЕЧНАЯ»."

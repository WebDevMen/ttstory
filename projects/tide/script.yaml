    - "Три минуты — длинно для ленты: держится на часах (три минуты, этаж за шесть минут) и на споре; первые десять секунд должны продать правило."
    - "Петля времени может запутать: финал показывает её действием (он набирает свой номер, внизу сбрасывают), без объяснений словами."
    - "Голоса Глеба, звонящего и Петровича — один движок (Дмитрий) с разной высотой; подписи говорящих обязательны."
  improvements:
    - "Из шаблона взята идея, но не сцены: тень за дверью и «выше второго этажа» заменены правилами этого мира — вода копится наверху, поэтому спасение внизу."
    - "Один герой-точка зрения (Глеб) и личная ставка (дочь) вместо безымянного «человека»."
    - "Правила проверены на людях цифрами: весы 22 → 9 → 20 кг; этаж воды за шесть минут."
    - "Звонок с собственного номера посеян трижды (до события, знает про ключ, днища городов) и закрыт действием: Глеб сам набирает себя."
    - "Финал отвечает на загадку «кто тянет город» картинкой — лестница из семи кварталов, а не лекцией."

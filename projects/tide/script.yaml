          - {at: "@крышу", what: "Глеб замирает"}
          - {at: "@яму", what: "Взгляд вниз, на дверь подвала"}
          - {at: "@кармане", what: "Рука достаёт ключ"}
        graphics:
          - {at: "@кармане", type: callout, text: "КЛЮЧ ОТ ШАХТЫ"}
        sfx:
          - {at: "@кармане", sound: click}
        transition: cut

  # ------------------------------------------------------------------ 7. DILEMMA — спор у лестницы
  - id: dilemma
    role: escalation
    title: "Крыша или яма"
    goal: "Дилемма: Петрович верит Системе, Глеб — своему голосу. У каждой стороны своя правда."
    vo: "Петрович, на крыше дождь! А здесь потоп сверху. Система тридцать лет не врала. А если врёт? Тогда ошибёмся все вместе."
    lines:
      - {who: gleb, say: "Петрович, на крыше дождь!"}
      - {who: petrovich, say: "А здесь потоп сверху. Система тридцать лет не врала."}
      - {who: gleb, say: "А если врёт?"}
      - {who: petrovich, say: "Тогда ошибёмся все вместе."}
    scene: {when: "06:49", where: "подъезд, у лестницы"}
    on_screen: "КРЫША ИЛИ ЛИФТ?"
    devices: [contrast, stakes_raise, emotion, direct_address]
    music: pulse
    shots:
      - id: d_argue
        visual: "Глеб и Петрович лицом к лицу у лестницы, Соня в пледе между ними; за спиной вода ползёт по стене; Глеб показывает вверх, Петрович — на стену."
        actors: [new:stairwell, person, new:water_wall, new:archive]
        camera: "Ручная съёмка, восьмёрка: с Глеба на Петровича"
        animation:
          - {at: "@дождь", what: "Глеб показывает вверх"}
          - {at: "@потоп", what: "Петрович показывает на стену с водой"}
          - {at: "@врала", what: "Петрович стучит пальцем по транзистору"}
          - {at: "@врёт", what: "Глеб берёт Соню на руки"}
        graphics: []
        sfx:
          - {at: "@врёт", sound: heartbeat}
        transition: cut
      - id: d_choice
        at: "@Тогда-0.1"
        visual: "Петрович уходит вверх по лестнице; поверх — две карточки на схеме дома: «КРЫША — вертолёт, но дождь» и «ЯМА ЛИФТА — сухо, но никто не найдёт»."
        actors: [new:house_section, card, text, new:archive]
        camera: "Неподвижно, лёгкий наезд"
        animation:
          - {at: "@ошибёмся", what: "Обе карточки вспыхивают"}
          - {at: "@вместе", what: "Карточка «КРЫША» мигает красным"}
        graphics:
          - {at: "@ошибёмся", type: "text slam", text: "КРЫША ИЛИ ЛИФТ?"}
        sfx:
          - {at: "@ошибёмся", sound: impact}
          - {at: "@вместе", sound: footstep}
        transition: dip

  # ------------------------------------------------------------------ 8. PIT — яма лифта, квартал падает в небо
  - id: pit
    role: payoff
    title: "Яма"
    goal: "Глеб выбирает свой голос: кабина в яме, скотч на щелях; мокрая с ночи земля отрывает весь квартал — а они сухие внутри."
    vo: "Подвал. Глеб отпирает шахту ключом из левого кармана. На дне — сухая стальная кабина. Он заклеивает щели скотчем. Восемь. Семь. Шесть. В семь ноль-ноль сверху гул. Это не вертолёт. Земля под домом мокрая с ночи. И весь квартал отрывается от города."
    lines:
      - {who: sonya, say: "Восемь. Семь. Шесть."}
    scene: {when: "06:52 → 07:00", where: "подвал, яма лифта"}
    on_screen: "КВАРТАЛ ОТОРВАЛСЯ"
    devices: [mini_payoff, visual_proof, stakes_raise, sound_hit, callback]
    music: epic
    shots:
      - id: c_shaft
        visual: "Нашлемная камера лифтёра: подвал, трубы, тусклая лампа; ключ поворачивается в двери шахты; створки открываются — кабина стоит в яме на буферах, тросы уходят вверх."
        actors: [new:lift_pit, human_hand, new:archive]
        camera: "Взгляд от первого лица, наезд на ключ, затем в шахту"
        animation:
          - {at: "@отпирает", what: "Ключ поворачивается"}
          - {at: "@дне", what: "Створки открываются, внутри сухо и светло"}
        graphics: []
        sfx:
          - {at: "@отпирает", sound: click}
          - {at: "@дне", sound: creak}
        ambience: [hum]
        transition: whip_y
      - id: c_tape
        at: "@заклеивает-0.1"
        visual: "Камера наблюдения в кабине (CAM ЛИФТ 1, «рыбий глаз»): Глеб клеит скотч по щелям; Соня в пледе в углу шепчет этажи; на табло этажей цифры гаснут."
        actors: [new:lift_cabin, person, text, new:archive]
        camera: "Неподвижная камера, широкий угол"
        animation:
          - {at: "@скотчем", what: "Полоса скотча"}
          - {at: "@Восемь", what: "На табло гаснет 8"}
          - {at: "@Семь", what: "Гаснет 7"}
          - {at: "@Шесть", what: "Гаснет 6"}
        graphics: []
        sfx:
          - {at: "@скотчем", sound: scrape}
          - {at: "@Восемь", sound: drip}
          - {at: "@Шесть", sound: drip}
        transition: cut
      - id: c_hum
        at: "@семь#2-0.1"
        visual: "Та же камера кабины: лампа мигает, картинка дрожит, по стенам бежит вибрация; Соня закрывает уши, Глеб прижимает её к себе. Таймкод 07:00:00 и сбой сигнала."
        actors: [new:lift_cabin, person, new:archive]
        camera: "Неподвижная камера, нарастающая тряска"
        animation:
          - {at: "@гул", what: "Лампа мигает, тряска"}
          - {at: "@вертолёт", what: "Сбой сигнала на полсекунды"}
        graphics: []
        sfx:
          - {at: "@гул", sound: groan}
          - {at: "@вертолёт", sound: glitch}
        transition: glitch
      - id: c_tear
        at: "@Земля-0.1"
        visual: "Кинематографичный кадр (съёмка с дрона): под девятиэтажкой трескается земля, весь квартал с трубами, корнями и асфальтом отрывается и медленно поднимается; на крышах соседних домов люди уходят вверх в облака."
        actors: [sky, new:city_chunk, building, new:rain, particles, new:archive]
        camera: "Широкий план, тряска, камера отъезжает вниз"
        animation:
          - {at: "@Земля", what: "Трещины в земле"}
          - {at: "@ночи", what: "Под домом видны трубы и корни"}
          - {at: "@квартал", what: "Люди на крышах отрываются вверх"}
          - {at: "@отрывается", what: "Квартал поднимается"}
        graphics:
          - {at: "@отрывается", type: "text slam", text: "КВАРТАЛ ОТОРВАЛСЯ"}
        sfx:
          - {at: "@Земля", sound: thunder}
          - {at: "@отрывается", sound: boom}
        ambience: [rumble, wind]
        transition: dip
  # ------------------------------------------------------------------ 8. TWIST — верхний город (выстрел улики)
  - id: twist
    role: twist
    title: "Нижний город"
    goal: "Поворот: дом висит в облаках над точно таким же целым городом, где снова шесть сорок одна; Система: вы в верхнем городе."
    vo: "Глеб приоткрывает люк кабины. Дом висит в облаках. Над ним — днища шести таких же кварталов. А внизу город. Точно такой же. Целый. Двор на Речной. Мужчина и девочка с жёлтым зонтом. Шесть сорок одна. Протокол семь завершён. Если вы слышите это, вы в верхнем городе. Нижний город — следующая зона подъёма."
    lines:
      - {who: system, say: "Протокол семь завершён. Если вы слышите это, вы в верхнем городе."}
      - {who: system, say: "Нижний город — следующая зона подъёма."}
    scene: {when: "07:00", where: "в облаках, над нижним городом"}
    on_screen: "ВЫ В ВЕРХНЕМ ГОРОДЕ"
    devices: [twist, callback, visual_proof, emotion, number_reveal]
    music: sub
    shots:
      - id: t_hatch
        visual: "Люк на крыше кабины приоткрыт: Глеб высовывается; вокруг белые облака и обломки шахты; ветер."
        actors: [sky, cloud, new:lift_cabin, person]
        camera: "Медленный подъём из люка"
        animation:
          - {at: "@приоткрывает", what: "Люк открывается, внутрь бьёт белый свет"}
          - {at: "@облаках", what: "Облака плывут мимо"}
        graphics: []
        sfx:
          - {at: "@приоткрывает", sound: breath}
        ambience: [wind]
        transition: dip
      - id: t_above
        at: "@Над-0.1"
        visual: "Взгляд вверх: в облаках висят шесть кварталов — видны их днища: фундаменты, трубы, корни, с каждого капает вверх; лестница из городов уходит в небо."
        actors: [sky, cloud, new:city_chunk, text]
        camera: "Панорама вверх по лестнице городов"
        animation:
          - {at: "@днища", what: "Проступают днища одно за другим"}
          - {at: "@шести", what: "Цифры 1–6 у кварталов"}
        graphics:
          - {at: "@шести", type: badge, text: "6 КВАРТАЛОВ ВЫШЕ"}
        sfx:
          - {at: "@днища", sound: riser}
        transition: whip_y
      - id: t_below
        at: "@внизу-0.1"
        visual: "Взгляд вниз сквозь облака: целый город, точно такой же; камера приближает двор на Речной — сухой асфальт, мужчина и девочка с жёлтым зонтом. Метка «06:41»."
        actors: [sky, cloud, skyline, building, tree, person, new:umbrella, timetag]
        camera: "Падающий наезд вниз, к двору"
        animation:
          - {at: "@Точно", what: "Город внизу целиком"}
          - {at: "@двор", what: "Наезд на двор"}
          - {at: "@зонтом", what: "Жёлтый зонт открыт"}
        graphics:
          - {at: "@Шесть", type: timetag, text: "06:41"}
        sfx:
          - {at: "@зонтом", sound: chime}
        transition: cut
      - id: t_alert
        at: "@Протокол-0.1"
        visual: "Экран оповещения поверх облаков: красная рамка, «ПРОТОКОЛ 07 ЗАВЕРШЁН», затем «ВЫ В ВЕРХНЕМ ГОРОДЕ» и «НИЖНИЙ ГОРОД — СЛЕДУЮЩАЯ ЗОНА»."
        actors: [new:city_chunk, sky, text, shape]
        camera: "Медленный наезд"
        animation:
          - {at: "@завершён", what: "Плашка «ЗАВЕРШЁН»"}
          - {at: "@верхнем", what: "Главная надпись"}
          - {at: "@следующая", what: "Нижний город мигает красным"}
        graphics:
          - {at: "@верхнем", type: "text slam", text: "ВЫ В ВЕРХНЕМ ГОРОДЕ"}
        sfx:
          - {at: "@Протокол", sound: alarm}
          - {at: "@следующая", sound: boom}
        transition: cut

  # ------------------------------------------------------------------ 9. CLIFF — он звонит себе
  - id: cliff
    role: cliffhanger
    title: "Звонок вниз"
    goal: "Петля: Глеб набирает свой номер, внизу мужчина сбрасывает — как Глеб в начале; нижний город начинает отрываться."
    vo: "Одна палочка связи. Глеб набирает свой номер. Внизу мужчина достаёт телефон. И сбрасывает. Глеб набирает снова. А внизу от земли отрываются первые дома."
    scene: {when: "07:01 / внизу 06:41", where: "кабина в облаках → двор нижнего города"}
    on_screen: "ЗВОНИТ: ГЛЕБ"
    devices: [callback, twist, rewatch_trigger, loop_ending]
    music: drone
    shots:
      - id: f_dial
        visual: "Крупно: телефон Глеба, одна палочка связи, набор номера — его собственного; на экране «ВЫЗОВ: ГЛЕБ»."
        actors: [new:phone_call, hand, sky, cloud]
        camera: "Сверхкрупно, наезд"
        animation:
          - {at: "@палочка", what: "Мигает одна палочка"}
          - {at: "@набирает", what: "Набор номера"}
        graphics: []
        sfx:
          - {at: "@набирает", sound: blip}
        transition: cut
      - id: f_reject
        at: "@Внизу-0.1"
        visual: "Сверху вниз: двор нижнего города, мужчина под козырьком достаёт телефон и сбрасывает; девочка рядом складывает жёлтый зонт."
        actors: [building, tree, ground, person, new:umbrella, new:rain]
        camera: "Высокий ракурс, медленный наезд"
        animation:
          - {at: "@достаёт", what: "Мужчина достаёт телефон"}
          - {at: "@сбрасывает", what: "Сбрасывает"}
          - {at: "@снова", what: "Телефон снова светится"}
        graphics: []
        sfx:
          - {at: "@сбрасывает", sound: click}
        transition: cut
      - id: f_rise
        at: "@А-0.1"
        visual: "Общий план: нижний город, крайние дома трескаются по фундаменту и медленно отрываются; дождь над ним разворачивается вверх. Финальная надпись «ПРОТОКОЛ 08»."
        actors: [sky, skyline, building, new:city_chunk, new:rain, text]
        camera: "Медленный отъезд вверх"
        animation:
          - {at: "@отрываются", what: "Первые дома поднимаются"}
        graphics:
          - {at: "@дома", type: "text slam", text: "ПРОТОКОЛ 08"}
        sfx:
          - {at: "@отрываются", sound: riser}
          - {at: "@дома", sound: boom}
        transition: dip

  # ------------------------------------------------------------------ 10. CTA — крыша или лифт
  - id: cta
    role: cta
    title: "Крыша или лифт"
    goal: "Вопрос-выбор зрителю по дилемме."
    vo: "Сирена звала на крышу. Свой голос — в яму лифта. Кого бы послушал ты? Пиши: крыша или лифт."
    on_screen: "КРЫША ИЛИ ЛИФТ?"
    devices: [comment_bait, direct_address, follow_trigger]
    music: drone
    shots:
      - id: q_choice
        visual: "Две карточки на фоне лестницы городов в облаках: «КРЫША» (вертолёт и дождь) и «ЛИФТ» (кабина в яме); между ними телефон с входящим «ГЛЕБ»."
        actors: [sky, new:city_chunk, card, new:phone_call, text]
        camera: "Медленный наезд"
        animation:
          - {at: "@крышу", what: "Карточка «КРЫША»"}
          - {at: "@лифта", what: "Карточка «ЛИФТ»"}
          - {at: "@Свой", what: "Телефон между карточками вибрирует: ЗВОНИТ ГЛЕБ"}
          - {at: "@Пиши", what: "Обе пульсируют"}
          - {at: "@лифт", what: "Сбой сигнала, на миг — NO SIGNAL"}
        graphics:
          - {at: "@Пиши", type: "text slam", text: "КРЫША ИЛИ ЛИФТ?"}
        sfx:
          - {at: "@крышу", sound: blip}
          - {at: "@лифта", sound: blip}
          - {at: "@Пиши", sound: impact}
        transition: cut

loops:
  - {id: l1, question: "Кто звонит Глебу с его собственного номера?", open: setup, close: cliff}
  - {id: l2, question: "Что такое «протокол 07» и что висит в облаках?", open: hook, close: twist}
  - {id: l3, question: "Крыша или яма — кто прав: сирена или голос?", open: dilemma, close: pit}

engagement:
  comment: "Крыша или лифт? Ответ одним словом."
  share: "Переслать другу, с которым спорите, кому верить в беде: официальной сирене или себе."
  save: "Сохранить ради правил: мокрое падает вверх, сухое — тяжёлое; вода в доме опускается на этаж за шесть минут."
  follow: "Подписка на «Протокол 08» и новые истории со своими правилами мира."
  rewatch: "Звонок во второй сцене — это Глеб сверху; днище квартала видно в облаках уже на первом кадре."
  cta: {beat: cta, text: "Крыша или лифт? Пиши одним словом", type: comment}


meta:
  title: "Обратный прилив"
  topic: "Обратный прилив: в 06:42 дождь в городе пошёл вверх, и всё мокрое падает в небо (фантастика, вымысел)"
  wishes: "Взять идею шаблона «Если ваш город начал тонуть в небо» (протокол 07, дождь вверх, звонок со своего номера, город над таким же городом), но не копировать: свой сюжет, интерес, детальная графика; 2–3 минуты"

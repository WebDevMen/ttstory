    hashtags: ["#дождьвверх", "#фантастика", "#протокол", "#страшныеистории", "#апокалипсис"]
    cover: "ДОЖДЬ ИДЁТ ВВЕРХ"
    sound: "Своя музыка движка (drone → tension → dark → pulse → epic → sub)"
  reels:
    caption: "В 06:42 дождь пошёл вверх. Сирена зовёт на крыши, а звонок с собственного номера — в яму лифта. Кому бы поверил ты? 🌧️⬆️"
    hashtags: ["#дождьвверх", "#фантастика", "#страшныеистории"]
    cover: "ДОЖДЬ ИДЁТ ВВЕРХ"
  shorts:
    title: "Дождь пошёл вверх — и город падает в небо. Протокол 07"

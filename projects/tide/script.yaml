production:
  theme: {preset: minimal, accent: "#d9e2ea", captions: clean}
  palette: ["#0a0c0f почти чёрный", "#3c4650 сталь", "#8a96a2 холодный серый", "#f2f4f6 белый", "#e3262f аварийный красный (только опасность, ошибки, критические предупреждения)", "#ffd23a жёлтый зонт — единственный тёплый цвет, сквозная деталь"]
  concept:
    name: "EMERGENCY ARCHIVE — утёкший видеопротокол службы выживания"
    rules:
      - "70–80% — «найденные записи», нарисованные кодом: камеры наблюдения (ч/б, рыбий глаз, дата), телефон (REC, дрожь, вертикаль), видеорегистратор, нашлемная камера, дрон; разные экспозиция, зерно, тряска"
      - "15–20% — кинематографичные кадры катастрофы (квартал отрывается, лестница городов, нижний город): движение камеры, частицы, дым, глубина"
      - "Интерфейс протокола всегда в углу: PROTOCOL 07, таймкод, источник записи; новое правило — крупно на 1–2 с; красный — только опасность"
      - "Сбои (обрыв сигнала, стоп-кадр, скачок таймкода) — только в ключевых местах: 06:42, второй звонок, 07:00, финал"
      - "Эволюция: начало — чистые метки; середина — предупреждения, противоречия источников (сирена vs голос); финал — интерфейс ломается, таймкод скачет, последняя инструкция поверх кадра"
      - "Шрифты: заголовки Oswald, метки и таймкоды IBM Plex Mono, субтитры Inter; не больше двух шрифтов в кадре; без игрового HUD"
  music: {key: E, mode: minor, bpm: 88}
  voices:
    narrator: {voice: ru-RU-SvetlanaNeural, rate: "+10%"}

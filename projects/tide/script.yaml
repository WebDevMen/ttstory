# СЦЕНАРИЙ: «Обратный прилив» — одна история, ~3 минуты (вымысел, фантастика). Правила ясности: docs/SCRIPTING.md §14.6.
# Идея пользователя (город падает в небо, протокол оповещения, звонок с собственного номера, город над таким же городом)
# переписана в свою историю: герой-точка зрения, два правила мира с цифрами, спор, дилемма, улика трижды, петля времени.
# Проверка: python3 vg.py script check tide [--tts] · документ: python3 vg.py script render tide
#
# Время (at:) — ссылки на слова текста ЭТОГО блока. Реплики героев написаны прямо в vo, lines отмечает, чья реплика
# (голоса — production.voices). «Система» — женский голос оповещения из динамиков.


  # ------------------------------------------------------------------ 8. PIT — яма лифта; квартал отрывается
  - id: pit
    text: "Подвал. Глеб отпирает шахту ключом из левого кармана. На дне — сухая стальная кабина. Он заклеивает щели скотчем. Восемь. Семь. Шесть. В семь ноль-ноль сверху гул. Это не вертолёт. Земля под домом мокрая с ночи. И весь квартал отрывается от города."
    lines:
      - {who: sonya, say: "Восемь. Семь. Шесть."}
    caption_marks: {"мокрая с ночи": "#f2f4f6"}
    shots:
      - id: c_shaft
        transition: {type: whip_y}
        ambience: [{sound: hum, gain: -16}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: "@дне", z: 1.06, x: 540, y: 960}, {t: end, z: 1.18, x: 540, y: 1000}], bob: {freq: 1.7, x: 4, y: 6, roll: 0.5}, sway: {x: 6, y: 6, roll: 0.5, freq: 0.5}}
          layers:
            - {actor: lift_pit, x: 0, y: 0, turn: [{at: 0, v: 0}, {at: "@отпирает", v: 1, dur: 0.5}], open: [{at: 0, v: 0}, {at: "@дне-0.3", v: 1, dur: 1.2, ease: inOutSine}], hand: 0}
            - {actor: archive, x: 0, y: 0, space: screen, kind: helmet, src: "НАШЛЕМНАЯ КАМЕРА · ЛИФТЁР П-2", tc: 25080, stage: 1, status: "ПОДВАЛ"}

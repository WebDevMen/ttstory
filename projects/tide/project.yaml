  # ------------------------------------------------------------------ 4. RULE — подъезд, Система, Петрович, весы
  - id: rule
    text: "Глеб затаскивает её в подъезд. Из динамика лифта — женский голос. Всё, что намокло, падает вверх. Высушите себя и детей. Аркадий Петрович, семьдесят лет. Тридцать лет на метеостанции. Сюда! На весы её! На весах девять килограммов. Утром было двадцать два. Полотенца. Газ. Через минуту — двадцать. Сухое — тяжёлое."
    lines:
      - {who: system, say: "Всё, что намокло, падает вверх. Высушите себя и детей."}
      - {who: petrovich, say: "Сюда! На весы её!"}
      - {who: petrovich, say: "Сухое — тяжёлое."}
    caption_marks: {"девять килограммов": "#f2f4f6"}
    shots:

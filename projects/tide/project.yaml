  # ------------------------------------------------------------------ 9. TWIST — верхний город над нижним
  - id: twist
    text: "Глеб приоткрывает люк кабины. Дом висит в облаках. Над ним — днища шести таких же кварталов. А внизу город. Точно такой же. Целый. Двор на Речной. Мужчина и девочка с жёлтым зонтом. Шесть сорок одна. Протокол семь завершён. Если вы слышите это, вы в верхнем городе. Нижний город — следующая зона подъёма."
    lines:
      - {who: system, say: "Протокол семь завершён. Если вы слышите это, вы в верхнем городе."}
      - {who: system, say: "Нижний город — следующая зона подъёма."}
    caption_marks: {"жёлтым зонтом": "#ffd23a", "верхнем городе": "#f2f4f6"}
    shots:
      - id: t_hatch
        transition: {type: dip, dur: 0.5}
        ambience: [{sound: wind, gain: -14}]
        look: {bloom: [0.7, 0.4]}

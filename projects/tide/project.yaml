        transition: {type: whip_x}
        ambience: [{sound: room, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.12, x: 540, y: 760}], shakes: [{at: "@затаскивает", amp: 10, dur: 0.3, freq: 5}]}

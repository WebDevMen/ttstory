# «Обратный прилив» (~3:07). Своя графика кодом (method draw), без ИИ-картинок. Концепция EMERGENCY ARCHIVE:
# утёкший видеопротокол службы выживания — «найденные записи» (камеры наблюдения, регистратор, телефон, нашлемная камера,
# дрон) + кинематографичные кадры катастрофы; интерфейс PROTOCOL 07 в углу (актёр archive), правила — крупно (rule_card),
# красный — только опасность. Интерфейс ломается к финалу (stage 0 → 1 → 2).
# Сценарий: projects/tide/script.yaml. Актёры проекта: projects/tide/actors/ (archive.js, city.js, interior.js).
# Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Обратный прилив"

voice: {voice: ru-RU-SvetlanaNeural, rate: "+15%", pitch: "+0Hz", tail: 1.6}
voices:
  system: {voice: de-DE-SeraphinaMultilingualNeural, rate: "+6%", pitch: "-2Hz"}
  gleb: {voice: ru-RU-DmitryNeural, rate: "+10%", pitch: "-4Hz"}
  sonya: {voice: ru-RU-SvetlanaNeural, rate: "+16%", pitch: "+45Hz"}
  petrovich: {voice: ru-RU-DmitryNeural, rate: "-2%", pitch: "-18Hz"}

theme:
  preset: archive
  accent: "#d9e2ea"
  captions: {style: clean, top: auto, size: 64, max_chars: 20}

post: {vignette: 0.18, chromatic: 0, grain: 0.02}

draw:
  palette: {ink: "#0a0c0f", steel: "#3c4650", grey: "#8a96a2", white: "#f2f4f6", red: "#e3262f", yellow: "#ffd23a", water: "#9fc4dc"}

audio:
  music:
    key: E
    mode: minor
    bpm: 88
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@problem.start", style: tension}
      - {at: "@water.start", style: dark}
      - {at: "@call.start", style: pulse}
      - {at: "@pit.start", style: epic}
      - {at: "@twist.start", style: sub}
      - {at: "@cliff.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-sky: &sky_rain {actor: sky, x: -300, y: 0, w: 1680, h: 1500, hour: 12, colors: ["#1d242b", "#38424b", "#5a6570"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1100, par: 0}
x-clouds: &clouds {actor: cloud_bank, x: -400, y: -80, w: 1900, h: 760, par: 0.05, color: "#56606a", shade: "#262d34", n: 32}
x-skyline: &skyline_far {actor: skyline, x: 540, y: 1012, w: 2200, h: 380, color: "#47515a", color2: "#3d464e", lit: 0.1, par: 0.2, seed: 5}
x-ground-far: &ground_far {actor: ground, x: -600, y: 1000, w: 2300, h: 1000, color: ["#3a434b", "#2c333a"], par: 0.2}
x-haze: &haze {actor: shape, kind: rect, x: 540, y: 985, w: 2400, h: 300, par: 0.22, fill: {linear: ["rgba(110,122,134,0)", "rgba(110,122,134,0.6)", "rgba(110,122,134,0)"], angle: 180}}
x-ground-mid: &ground_mid {actor: ground, x: -600, y: 1150, w: 2300, h: 900, color: ["#30373e", "#23292f"], par: 0.5}
x-rule: &rule {actor: rule_card, x: 540, y: 800, space: screen, enter: {type: wipe_right, dur: 0.25}, exit: {type: fade, dur: 0.2}, sfx: false}
x-look-gleb: &gleb {age: adult, outfit: gakuran, hair: short, silhouette: "#14181c"}
x-look-sonya: &sonya {age: kid, outfit: kyushoku, hat: none, mask: false, hair: twintails, silhouette: "#6b5718"}
x-look-sonya-wet: &sonya_wet {age: kid, outfit: kyushoku, hat: none, mask: false, hair: twintails, silhouette: "#4e4114"}
x-look-petr: &petr {age: adult, outfit: blazer, hair: buzz, glasses: true, silhouette: "#1e2124"}

scenes:

  # ------------------------------------------------------------------ 1. HOOK — регистратор: машина всплывает; заголовок
  - id: hook
    text: "Дождь пошёл вверх? Высохните за три минуты. Иначе упадёте в небо."
    lines:
      - {who: system, say: "Дождь пошёл вверх? Высохните за три минуты. Иначе упадёте в небо."}
    caption_marks: {"три минуты": "#f2f4f6"}
    shots:
      - id: k_car
        transition: {type: fade, dur: 0.2}
        ambience: [{sound: rain, gain: -14}, {sound: city, gain: -22}]
        draw:
          camera: {keys: [{t: 0, z: 1.06, x: 540, y: 1010}, {t: "@вверх", z: 1.1, x: 560, y: 980}, {t: end, z: 1.12, x: 570, y: 900}],
                   shakes: [{at: 0.55, amp: 18, dur: 0.5, freq: 5}], sway: {x: 4, y: 3, roll: 0.3, freq: 0.6}}
          layers:
            - *sky_rain
            - *clouds
            - *skyline_far
            - *ground_far
            - *haze
            - {actor: panel_block, x: 160, y: 1162, scale: 0.62, floors: 9, cols: 8, seed: 3, lit: 0.18, par: 0.5}
            - {actor: panel_block, x: 900, y: 1162, scale: 0.58, floors: 9, cols: 7, seed: 8, lit: 0.22, par: 0.5, color: "#737b82"}
            - *ground_mid
            - {actor: wet_ground, x: -400, y: 1290, w: 1900, h: 800, curb: 0, lines: 230, lights: [[760, "#e8eef2", 40], [300, "#e9d9a8", 26]]}
            - {actor: puddle, x: 300, y: 1560, w: 420, h: 70, up: [{at: 0, v: 0}, {at: "@вверх", v: 1, dur: 0.6}]}
            - {actor: puddle, x: 860, y: 1700, w: 360, h: 60, seed: 5, up: [{at: 0, v: 0}, {at: "@вверх+0.2", v: 1, dur: 0.6}]}
            - {actor: lamp_post, x: 760, y: 1310, h: 700, left: true}
            # the sedan hits the pole and, instead of stopping, floats up
            - {actor: sedan, id: car, air: true, x: 120, y: 1330, scale: 1.05, color: "#59656f", lights: 1, drip_up: [{at: 0, v: 0}, {at: "@вверх", v: 1, dur: 0.8}],
               anim: [{at: 0, dur: 0.55, x: 515, ease: in}, {at: 0.55, dur: 0.2, x: 500, rot: -3, ease: out}, {at: "@вверх-0.2", dur: 5, y: 760, rot: -11, ease: inOutSine}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 320, v: [{at: 0, v: 1}, {at: 0.6, v: 0, dur: 0.5}, {at: "@вверх", v: -0.7, dur: 1.2}]}
            - {<<: *rule, at: "@Высохните-0.05", until: end, kicker: "ПРАВИЛО 00 · ДОЖДЬ ИДЁТ ВВЕРХ", text: "3 МИНУТЫ, ЧТОБЫ ВЫСОХНУТЬ", danger: true}
            - {actor: archive, x: 0, y: 0, space: screen, kind: dash, src: "DVR · МАРШРУТ 41 · ПР. СТРОИТЕЛЕЙ", tc: 24124, glitch: [{at: 0.55, dur: 0.2}]}
      - id: k_title
        start: "@Иначе-0.22"
        transition: {type: whip_y}
        look: {bloom: [0.75, 0.25]}
        draw:
          world: [1080, 2900]
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1900}, {t: end, z: 1.04, x: 540, y: 1000, ease: inout}], sway: {x: 6, y: 4, roll: 0.4, freq: 0.3}}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 2900, hour: 12, colors: ["#141a20", "#2e373f", "#55606b"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 2600}
            # easter egg: the underside of another city block, barely visible through the clouds
            - {actor: city_chunk, x: 120, y: 150, w: 860, soil: 380, seed: 21, opacity: 0.45, blur: 3, drip: 0.8, buildings: []}
            - {actor: cloud_bank, x: -500, y: 300, w: 2100, h: 800, color: "#4d5761", shade: "#20262c", n: 40, blur: 34}
            - {actor: cloud_bank, x: -500, y: 900, w: 2100, h: 700, color: "#5d6873", shade: "#2c343b", n: 30, seed: 7}
            - {actor: skyline, x: 540, y: 2620, w: 2200, h: 520, color: "#3d464e", color2: "#333b42", lit: 0.12, seed: 9, par: 0.3}
            - {actor: ground, x: -600, y: 2610, w: 2300, h: 400, color: ["#2c333a", "#1d2227"], par: 0.3}
            - {actor: sedan, x: 600, y: 1700, air: true, scale: 0.55, rot: -18, color: "#59656f", drip_up: 1, anim: [{at: "@Иначе-0.2", dur: 3, y: 1250, rot: -32, ease: linear}]}
            - {actor: shape, kind: rect, x: 300, y: 1950, w: 120, h: 70, fill: "#3c4650", rot: 24, anim: [{at: "@Иначе-0.2", dur: 3, y: 1500, rot: 60, ease: linear}]}
            - {actor: shape, kind: rect, x: 860, y: 2150, w: 60, h: 90, fill: "#2c333a", rot: -12, anim: [{at: "@Иначе-0.2", dur: 3, y: 1780, rot: -50, ease: linear}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 300, v: -0.75, seed: 8}
            - {actor: title_card, x: 540, y: 720, space: screen, at: "@небо-0.15", enter: {type: fade, dur: 0.15}, kicker: "ПРОТОКОЛ 07", text: "ОБРАТНЫЙ ПРИЛИВ", sub: "ЗАПИСЬ 001 / 031 · ДОСТУП ОГРАНИЧЕН"}
            - {actor: archive, x: 0, y: 0, space: screen, kind: cinema, src: "РЕКОНСТРУКЦИЯ · МАТЕРИАЛЫ ДЕЛА", tc: 24127, glitch: [{at: "@небо-0.2", dur: 0.18}]}
    sfx:
      - {sound: impact, at: 0.55, gain: -8}
      - {sound: glitch, at: 0.55, gain: -16}
      - {sound: riser, at: "@вверх", gain: -12}
      - {sound: boom, at: "@небо", gain: -10}

  # ------------------------------------------------------------------ 2. SETUP — двор на Речной, Глеб, Соня, первый звонок
  - id: setup
    text: "Шесть сорок одна. Двор на Речной. Дождь идёт всю ночь. Глеб, двадцать девять лет, лифтёр. Знает в этом доме каждый трос. Соня, семь лет, его дочь. Складывает жёлтый зонт, чтобы ловить дождь языком. Сонь, промокнешь! Пап, он сладкий! У Глеба жужжит телефон. Звонит Глеб. Его собственный номер. Он сбрасывает."
    lines:
      - {who: gleb, say: "Сонь, промокнешь!"}
      - {who: sonya, say: "Пап, он сладкий!"}
    caption_marks: {"жёлтый зонт": "#ffd23a", "собственный номер": "#f2f4f6"}
    shots:
      - id: s_yard
        transition: {type: dip, dur: 0.35}
        ambience: [{sound: rain, gain: -15}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 520, y: 990}]}
          layers:
            - *sky_rain
            - *clouds
            - *skyline_far
            - *ground_far
            - *haze
            - {actor: panel_block, x: 900, y: 1150, scale: 0.55, floors: 9, cols: 6, seed: 12, lit: 0.2, par: 0.5}
            - *ground_mid
            # the block on Rechnaya: entrance 2 with a canopy and a lamp
            - {actor: panel_block, id: home, x: 380, y: 1330, scale: 1.0, floors: 9, cols: 9, cell: [100, 84], seed: 4, lit: [{at: 0, v: 0.12}, {at: "@ночь", v: 0.3, dur: 1.2}], entrances: [4], stains: 0.7}
            - {actor: wet_ground, x: -400, y: 1310, w: 1900, h: 800, lights: [[440, "#e8eef2", 60]]}
            - {actor: tree, kind: round, x: 930, y: 1360, h: 520, color: "#2c3a33", trunk: "#2a2420", seed: 3, sway: 1}
            - {actor: puddle, x: 560, y: 1520, w: 460, h: 80}
            - {actor: puddle, x: 180, y: 1680, w: 300, h: 56, seed: 7}
            - {actor: sedan, x: -300, y: 1600, scale: 1.1, color: "#4a545e", lights: 1, at: "@ночь", enter: {type: fade, dur: 0.3}, anim: [{at: "@ночь", dur: 3.5, x: 1500, ease: linear}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 300}
            - {actor: archive, x: 0, y: 0, space: screen, kind: cctv, src: "CAM 03 · РЕЧНАЯ, 12 · ДВОР", tc: 24063}
      - id: s_gleb
        start: "@Глеб-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 980}, {t: end, z: 1.07, x: 520, y: 960}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 600, w: 1400, h: 1300, fill: "#3a4148"}
            - {actor: panel_block, x: 540, y: 1460, scale: 2.6, floors: 4, cols: 4, cell: [100, 84], seed: 4, lit: 0.1, entrances: [1], stains: 0.6, roof: false}
            - {actor: wet_ground, x: -400, y: 1440, w: 1900, h: 600, lights: [[540, "#e8eef2", 120]]}
            - {actor: person, id: gleb, x: 520, y: 1470, scale: 1.75, look: *gleb, face: neutral,
               pose: [{at: 0, v: stand}, {at: "@двадцать", v: {a1: [7, 4], a2: [60, 110], l1: [2, 0], l2: [2, 0]}, dur: 0.3}, {at: "@лифтёр", v: hold, dur: 0.3}, {at: "@трос", v: {a1: [30, 40], a2: [7, 4], l1: [2, 0], l2: [2, 0]}, dur: 0.3}],
               look_dx: [{at: 0, v: 0}, {at: "@двадцать", v: -0.4, dur: 0.3}, {at: "@трос", v: 0.2, dur: 0.3}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 260, seed: 3}
            - {actor: mark, x: 520, y: 760, w: 300, h: 320, space: screen, at: "@Глеб", enter: {type: fade, dur: 0.2}, label: "ГЛЕБ, 29", sub: "ЛИФТЁР · ПОДЪЕЗД 2"}
            - {actor: archive, x: 0, y: 0, space: screen, kind: cctv, src: "CAM 04 · ПОДЪЕЗД 2 · ВХОД", tc: 24070}
      - id: s_sonya
        start: "@Соня-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.02, x: 540, y: 1010}, {t: end, z: 1.1, x: 560, y: 1000}], sway: {x: 10, y: 8, roll: 0.8, freq: 0.5}}
          layers:
            - *sky_rain
            - *clouds
            - *skyline_far
            - *ground_far
            - *haze
            - {actor: panel_block, x: 120, y: 1170, scale: 0.7, floors: 9, cols: 6, seed: 4, lit: 0.3, par: 0.5}
            - {actor: panel_block, x: 960, y: 1170, scale: 0.6, floors: 9, cols: 5, seed: 6, lit: 0.25, par: 0.5}
            - *ground_mid
            - {actor: wet_ground, x: -400, y: 1250, w: 1900, h: 800}
            - {actor: shape, kind: path, d: "M760,1400 L860,1180 L880,1180 L800,1400 Z", fill: "#7b838a"}
            - {actor: shape, kind: path, d: "M840,1190 L980,1190 L980,1400 L960,1400 L960,1210 L840,1210 Z", fill: "#4a545e"}
            - {actor: puddle, x: 420, y: 1560, w: 520, h: 80}
            - {actor: umbrella, x: 690, y: 1280, scale: 0.7, rot: 8, open: [{at: 0, v: 1}, {at: "@Складывает", v: 0, dur: 0.6}],
               anim: [{at: "@Складывает+0.4", dur: 0.6, x: 640, y: 1350, rot: 70}]}
            - {actor: person, id: sonya, x: 560, y: 1460, scale: 1.55, look: *sonya, face: [{at: 0, v: smile}, {at: "@языком", v: happy}],
               pose: [{at: 0, v: {a1: [7, 4], a2: [40, 60], l1: [2, 0], l2: [2, 0]}}, {at: "@языком", v: {a1: [60, 20], a2: [60, 20], l1: [3, 0], l2: [3, 0], tilt: -14}, dur: 0.4}]}
            - {actor: rain, x: 0, y: 0, space: screen, count: 280, seed: 6}
            - {actor: mark, x: 560, y: 1000, w: 260, h: 260, space: screen, at: "@Соня", until: "@промокнешь", exit: fade, enter: {type: fade, dur: 0.2}, label: "СОНЯ, 7", sub: "ДОЧЬ"}
            - {actor: archive, x: 0, y: 0, space: screen, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ВИДЕО", tc: 24076}
      - id: s_call
        start: "@жужжит-0.22"
        transition: {type: dip, dur: 0.25}
        draw:
          bg: "#0e1114"
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}], shakes: [{at: "@жужжит", amp: 6, dur: 0.6, freq: 5}, {at: "@Звонит", amp: 5, dur: 0.6, freq: 5}], sway: {x: 6, y: 6, roll: 0.6, freq: 0.7}}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1300, h: 2100, fill: {radial: ["#2a3138", "#0e1114"]}}
            - {actor: rain, x: 0, y: 0, count: 120, alpha: 0.35, seed: 9}
            - {actor: phone_call, x: 540, y: 820, scale: 0.92, state: [{at: 0, v: incoming}, {at: "@сбрасывает+0.15", v: declined}], tap: [{at: 0, v: 0}, {at: "@сбрасывает", v: -1}, {at: "@сбрасывает+0.5", v: 0}],
               clock: "06:41", name: "Глеб", number: "+7 912 406-17-33", own: "Мой номер"}
            - {actor: mark, x: 540, y: 520, w: 520, h: 150, space: screen, at: "@номер-0.2", enter: {type: fade, dur: 0.2}, label: "ЭТО ЕГО НОМЕР", sub: "ВЫЗОВ 06:41:52", side: bottom}
            - {actor: archive, x: 0, y: 0, space: screen, kind: phone, src: "КАМЕРА ДОМОФОНА · ПОДЪЕЗД 2", tc: 24112}
    sfx:
      - {sound: drip, at: "@Шесть", gain: -16}
      - {sound: click, at: "@трос", gain: -14}
      - {sound: click, at: "@Складывает", gain: -14}
      - {sound: buzz, at: "@жужжит", gain: -10}
      - {sound: buzz, at: "@Звонит", gain: -12}
      - {sound: click, at: "@сбрасывает", gain: -10}

  # ------------------------------------------------------------------ 3. PROBLEM — 06:42, капли замирают, всё мокрое уходит вверх
  - id: problem
    text: "Шесть сорок две. Капли замирают в воздухе. И падают вверх. Лужи идут дождём в небо. Машина у подъезда бьётся о столб — и всплывает. Жёлтый зонт уходит в облака. Пап, я лечу! Кроссовки Сони отрываются от асфальта. Глеб ловит её за руку."
    lines:
      - {who: sonya, say: "Пап, я лечу!"}
    caption_marks: {"падают вверх": "#f2f4f6"}
    shots:
      - id: p_freeze
        transition: {type: glitch, dur: 0.3}
        ambience: [{sound: rain, gain: -16}]
        draw:
          camera: {keys: [{t: 0, z: 1.15, x: 540, y: 1100}, {t: "@замирают", z: 1.25, x: 540, y: 1080}, {t: end, z: 1.3, x: 540, y: 900}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1400, h: 2200, fill: {linear: ["#2a333c", "#141a1f"], angle: 180}}
            - {actor: panel_block, x: 540, y: 1300, scale: 1.4, floors: 9, cols: 8, seed: 4, lit: 0.3, blur: 6, brightness: 0.7}
            - {actor: wet_ground, x: -400, y: 1290, w: 1900, h: 800}
            - {actor: puddle, x: 540, y: 1480, w: 760, h: 120, up: [{at: 0, v: 0}, {at: "@вверх", v: 1, dur: 0.5}], ripples: [{at: 0, v: 1}, {at: "@замирают", v: 0, dur: 0.3}]}
            - {actor: rain, x: 0, y: 0, count: 220, len: 110, width: 3, alpha: 0.75, seed: 4, v: [{at: 0, v: 1}, {at: "@замирают", v: 0, dur: 0.35}, {at: "@вверх", v: -0.8, dur: 0.6}]}
            - {<<: *rule, at: "@вверх-0.05", kicker: "06:42:00 · НАЧАЛО СОБЫТИЯ", text: "КАПЛИ ПАДАЮТ ВВЕРХ", danger: true}
            - {actor: archive, x: 0, y: 0, space: screen, kind: phone, src: "ТЕЛЕФОН ГЛЕБА · ВИДЕО", tc: 24119, stage: 1, status: "СОБЫТИЕ", glitch: [{at: "@Шесть", dur: 0.25}]}
      - id: p_puddles
        start: "@Лужи-0.22"
        ambience: [{sound: wind, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1040}, {t: end, z: 1.04, x: 540, y: 880}], shakes: [{at: "@бьётся", amp: 14, dur: 0.4, freq: 5}]}
          layers:
            - *sky_rain
            - *clouds
            - *skyline_far
            - *ground_far
            - *haze
            - *ground_mid
            - {actor: panel_block, x: 300, y: 1330, scale: 1.0, floors: 9, cols: 9, cell: [100, 84], seed: 4, lit: 0.3, entrances: [4], stains: 0.7}
            - {actor: wet_ground, x: -400, y: 1310, w: 1900, h: 800}
            - {actor: lamp_post, x: 860, y: 1330, h: 640, left: true}
            - {actor: puddle, x: 420, y: 1500, w: 460, h: 80, up: 1}

  # ------------------------------------------------------------------ 8. TWIST — пустая коробка, бирка, часы прыгают, все бегут
  - id: twist
    text: "Пять ноль-ноль. Савва срывает пломбу. Коробка пустая. Только бирка на дне. Цена — всё. Ограничение — навсегда. Побочный эффект — тебя боятся. Часы у всех троих прыгают на пять ноль одну. Он открыл. Теперь он — рынок. И охотники бегут. От него."
    lines:
      - {who: clock, say: "Он открыл. Теперь он — рынок."}
    caption_marks: {"пустая": "#f2ede4", "тебя боятся": "#e0283a"}
    shots:
      - id: t_open
        transition: {type: cut}
        captions_top: 1470
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 560, y: 1150}, {t: "@пустая", z: 1.08, x: 580, y: 1130, ease: out}, {t: end, z: 1.12, x: 590, y: 1120}], shakes: [{at: "@срывает", amp: 8, dur: 0.25, freq: 6}]}
          layers:
            - *dark_bg
            - {actor: light_pool, x: 540, y: 760, r: 560, color: "#fff1c8", a: 0.2}
            - {actor: shape, kind: rect, x: 540, y: 600, w: 3000, h: 260, rot: -12, fill: {linear: ["rgba(255,244,214,0)", "rgba(255,244,214,0.16)", "rgba(255,244,214,0)"], angle: 180}, anim: [{at: "@twist.start", dur: 5.6, x: 1400, ease: linear}]}
            - {actor: lot_box, x: 470, y: 1560, scale: 1.15, inside_tag: "ЦЕНА: ВСЁ",
               seal: [{at: 0, v: 1}, {at: "@срывает", v: 0, dur: 0.25}], string: [{at: 0, v: 1}, {at: "@срывает+0.2", v: 0, dur: 0.3}],
               open: [{at: 0, v: 0}, {at: "@пустая-0.4", v: 1, dur: 0.6, ease: out}], tag: [{at: 0, v: 1}, {at: "@срывает", v: 0, dur: 0.2}]}
            - *noir
      - id: t_tag
        start: "@Цена-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 540, y: 940}], shakes: [{at: "@боятся", amp: 10, dur: 0.3, freq: 6}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#1a1712", "#050505"]}}
            - {actor: price_tag, x: 560, y: 820, scale: 1.12, rot: 3, title: "ЛОТ 7 · КОРОБКА",
               rows: [{k: "ЦЕНА", v: "ВСЁ"}, {k: "ОГРАНИЧЕНИЕ", v: "НАВСЕГДА"}, {k: "ПОБОЧНЫЙ ЭФФЕКТ", v: "ТЕБЯ БОЯТСЯ", red: true}],
               show: [{at: 0, v: 0}, {at: "@всё", v: 1, dur: 0.4}, {at: "@навсегда", v: 2, dur: 0.4}, {at: "@боятся", v: 3, dur: 0.4}]}
            - *noir
      - id: t_watches
        start: "@Часы-0.22"
        transition: {type: glitch}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 400, y: 960}, {t: end, z: 1.0, x: 680, y: 960}]}
          layers:
            - *dark_bg
            - {actor: death_watch, x: 200, y: 960, kind: wrist, scale: 0.6, display: [{at: 0, v: "2061"}, {at: "@прыгают", v: "05:01"}], disp_color: [{at: 0, v: "#e8a23a"}], glow: 1, shake: [{at: 0, v: 0}, {at: "@прыгают", v: 12}, {at: "@прыгают+0.5", v: 0, dur: 0.3}]}
            - {actor: death_watch, x: 540, y: 960, kind: wrist, scale: 0.6, display: [{at: 0, v: "2058"}, {at: "@прыгают+0.08", v: "05:01"}], glow: 1, shake: [{at: 0, v: 0}, {at: "@прыгают", v: 12}, {at: "@прыгают+0.5", v: 0, dur: 0.3}]}
            - {actor: death_watch, x: 880, y: 960, kind: wrist, scale: 0.6, display: [{at: 0, v: "2049"}, {at: "@прыгают+0.16", v: "05:01"}], glow: 1, shake: [{at: 0, v: 0}, {at: "@прыгают", v: 12}, {at: "@прыгают+0.5", v: 0, dur: 0.3}]}
            - {actor: noir_rule, x: 540, y: 1480, space: screen, kicker: "ЧАСЫ ВСЕХ ТРОИХ", text: "05:01 — ЧЕРЕЗ МИНУТУ", size: 76, at: "@одну", enter: {type: wipe_right, dur: 0.2}}
            - {<<: *noir, glitch: [{at: "@прыгают", dur: 0.2}]}
      - id: t_flee
        start: "@открыл-0.22"
        captions_top: 770
        transition: {type: dip, dur: 0.3}
        draw:
          camera: {keys: [{t: 0, z: 1.02, x: 540, y: 980}, {t: end, z: 1.0, x: 540, y: 950}]}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 1500, hour: 23, colors: ["#07090c", "#141b22", "#2a343e"], sun: false, moon: false, stars: 0, clouds: 0}
            - {actor: pier, x: 0, y: 0, view: end, vp: [540, 900], beam_speed: 0.12}
            - {actor: noir_figure, x: 260, y: 1660, scale: 1.1, kind: hat, watch: "#e8a23a", rim: "#ffcf8a", flip: true,
               pose: [{at: 0, v: back}], walk: [{at: 0, v: 0.6}, {at: "@бегут", v: 3.4, dur: 0.2}], anim: [{at: "@открыл", dur: 1.2, dx: -60}, {at: "@бегут", dur: 1.6, x: -400, ease: in}]}
            - {actor: noir_figure, x: 120, y: 1700, scale: 1.15, kind: hat, watch: "#e8a23a", rim: "#ffcf8a", flip: true, walk: [{at: 0, v: 0}, {at: "@бегут-0.2", v: 3.4, dur: 0.2}], anim: [{at: "@бегут-0.2", dur: 1.4, x: -500, ease: in}]}
            - {actor: noir_figure, x: 380, y: 1650, scale: 1.05, kind: hat, watch: "#e8a23a", rim: "#ffcf8a", flip: true, walk: [{at: 0, v: 0}, {at: "@бегут", v: 3.4, dur: 0.2}], anim: [{at: "@бегут", dur: 1.8, x: -400, ease: in}]}
            - {actor: noir_figure, x: 860, y: 1650, scale: 1.05, kind: hat, rim: "#9fc4dc", walk: [{at: 0, v: 0}, {at: "@бегут-0.1", v: 3.4, dur: 0.2}], anim: [{at: "@бегут-0.1", dur: 1.6, x: 1500, ease: in}]}
            - {actor: noir_figure, x: 980, y: 1690, scale: 1.12, kind: coat, rim: "#9fc4dc", walk: [{at: 0, v: 0}, {at: "@бегут+0.1", v: 3.4, dur: 0.2}], anim: [{at: "@бегут+0.1", dur: 1.6, x: 1600, ease: in}]}
            - {actor: noir_figure, x: 740, y: 1640, scale: 1.2, view: front, kind: courier, rim: "#ffcf8a", rim_side: 1}
            - {actor: lot_box, x: 790, y: 1640, scale: 0.42, open: 1, tag: 0, string: 0, seal: 0}
            - {actor: laser, x: 0, y: 0, from: [900, -100], to: [{at: 0, v: [740, 1300]}, {at: "@него-0.4", v: [700, 600], dur: 0.6, ease: in}], beam: 0.6, on: [{at: 0, v: 1}, {at: "@него", v: 0, dur: 0.3}]}
            - *rain
            - {actor: noir_title, x: 540, y: 560, space: screen, text: "ТЕПЕРЬ ОН — РЫНОК", size: 104, at: "@рынок-0.1", enter: {type: zoom, dur: 0.25}}
            - {actor: name_tag, x: 540, y: 300, space: screen, label: "ЧАСОВЩИК", color: sodium, at: "@открыл", until: "@бегут", enter: {type: fade, dur: 0.2}, exit: {type: fade, dur: 0.2}}
            - *noir
    sfx:
      - {sound: metal_ring, at: "@срывает", gain: -9}
      - {sound: breath, at: "@пустая", gain: -10}
      - {sound: typing, at: "@всё", gain: -14}
      - {sound: typing, at: "@навсегда", gain: -14}
      - {sound: impact, at: "@боятся", gain: -8}
      - {sound: glitch, at: "@прыгают", gain: -9}
      - {sound: boom, at: "@рынок", gain: -9}
      - {sound: footstep, at: "@бегут", gain: -10}
      - {sound: footstep, at: "@бегут+0.3", gain: -11}

  # ------------------------------------------------------------------ 9. CLIFF — часы Вайса остановились; через неделю Савва в кресле
  - id: cliff
    text: "В пять утра на хладокомбинате остановились часы Вайса. Его кресло пустое. Через неделю четверг. Савва ставит на стол коробку. Перед ним новый курьер. Не открывай."
    lines:
      - {who: savva, say: "Не открывай."}
    caption_marks: {"не открывай": "#e0283a"}
    shots:
      - id: c_chair
        transition: {type: dip, dur: 0.4}
        captions_top: 700
        ambience: [{sound: hum, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: end, z: 1.04, x: 540, y: 1000}]}
          layers:
            - {actor: market_hall, x: -160, y: 0, w: 1400, blur: 8, brightness: 0.5, crowd: 0, lights: [{at: 0, v: 0.5}, {at: "@пустое", v: 0.1, dur: 0.3}]}
            - {actor: ground, x: -400, y: 1860, w: 1900, h: 500, color: ["#1e1b18", "#0a0908"]}
            - {actor: appraiser_desk, x: 540, y: 1880, scale: 1.15, chair: true, lamp: [{at: 0, v: 1}, {at: "@пустое", v: 0.05, dur: 0.15}]}
            - {actor: death_watch, x: 740, y: 1365, kind: wrist, scale: 0.22, rot: 70, display: "05:00", stopped: [{at: 0, v: 0}, {at: "@остановились", v: 1}], tick: true}
            - *noir
      - id: c_loop
        start: "@Через-0.22"
        captions_top: 750
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: end, z: 1.04, x: 540, y: 1010}]}
          layers:
            - {actor: market_hall, x: -160, y: 0, w: 1400, blur: 8, brightness: 0.55, crowd: 5}
            - {actor: noir_figure, x: 540, y: 1560, scale: 1.25, view: front, kind: courier, rim: "#ffd89a", rim_side: -1, pose: {sh1: 20, el1: 50, sh2: 20, el2: 50, th1: 0, kn1: 0, th2: 0, kn2: 0, lean: 0}}
            - {actor: ground, x: -400, y: 1860, w: 1900, h: 500, color: ["#1e1b18", "#0a0908"]}
            - {actor: appraiser_desk, x: 540, y: 1880, scale: 1.15, chair: false}
            - {actor: lot_box, x: 500, y: 1470, scale: 0.6, at: "@ставит-0.15", enter: {type: drop, dur: 0.3}}
            - {actor: noir_figure, x: 160, y: 2240, scale: 2.4, view: front, kind: courier, rim: "#9fb6c8", rim_side: 1, blur: 6, brightness: 0.7, par: 1.2, at: "@новый-0.2", enter: {type: slide_right, dur: 0.4}}
            - {actor: timetag, slot: tag, text: "ЧТ · 01:20 · ЧЕРЕЗ НЕДЕЛЮ", at: "@четверг", enter: {type: fade, dur: 0.3}}
            - {actor: noir_title, x: 540, y: 600, space: screen, text: "НЕ ОТКРЫВАЙ", size: 120, at: "@открывай-0.1", enter: {type: zoom, dur: 0.25}}
            - *noir
    sfx:
      - {sound: click, at: "@остановились", gain: -10}
      - {sound: click, at: "@пустое", gain: -14}
      - {sound: kick, at: "@ставит", gain: -9}
      - {sound: boom, at: "@открывай", gain: -9}

  # ------------------------------------------------------------------ 10. CTA — открыть или довезти
  - id: cta
    text: "А ты бы открыл коробку — или довёз до пяти? Пиши: открыть или довезти."
    shots:
      - id: q_choice
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.12, x: 540, y: 1000}, {t: end, z: 1.2, x: 540, y: 1010}]}
          layers:
            - *hall_blur
            - {actor: shape, kind: rect, x: 540, y: 1600, w: 1800, h: 900, fill: {linear: ["#2a2420", "#0e0c0a"], angle: 180}}
            - {actor: shape, kind: rect, x: 540, y: 1162, w: 1800, h: 14, fill: "#4a3a2c"}
            - {actor: shape, kind: polygon, points: [[540, 260], [470, 260], [120, 1220], [960, 1220]], fill: {linear: ["rgba(255,224,170,0.30)", "rgba(255,224,170,0)"], angle: 180}}
            - {actor: light_pool, x: 540, y: 290, r: 150, color: "#ffe3b0", a: 0.9}
            - {actor: shape, kind: circle, x: 540, y: 286, r: 16, fill: "#fff3d6"}
            - {actor: lot_box, x: 470, y: 1210, scale: 1.25}
            - {actor: card, x: 300, y: 480, space: screen, w: 400, style: dark, title: "ОТКРЫТЬ", at: "@открыл", enter: {type: pop, dur: 0.25}, pulse: {amp: 0.03, freq: 1.2}}
            - {actor: card, x: 780, y: 480, space: screen, w: 400, style: dark, title: "ДОВЕЗТИ", color: red, at: "@довёз", enter: {type: pop, dur: 0.25}, pulse: {amp: 0.03, freq: 1.2, phase: 3.14}}
            - {actor: laser, x: 0, y: 0, from: [1400, 340], to: [560, 900], beam: 0.5, at: "@Пиши", enter: {type: fade, dur: 0.15}}
            - {actor: text, x: 540, y: 300, space: screen, text: "ОТКРЫТЬ ИЛИ ДОВЕЗТИ?", font: cond, size: 84, weight: 700, color: warm, at: "@Пиши", enter: {type: fade, dur: 0.2}}
            - {<<: *noir, flare: [540, 290], flare_k: 0.7}
    sfx:
      - {sound: blip, at: "@открыл", gain: -12}
      - {sound: blip, at: "@довёз", gain: -12}
      - {sound: impact, at: "@Пиши", gain: -9}

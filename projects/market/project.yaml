# «Чёрный рынок невозможного» (~3:11). Своя графика кодом (method draw), без ИИ-картинок. Концепция NOIR MACRO:
# криминальный нуар — промышленные помещения, мокрый асфальт, практический свет (лампы в сетках, натриевые фонари, фары,
# луч маяка), неон только на своих вывесках (бар «24», аптечный крест), макро вещей рынка с малой глубиной резкости,
# погони с проводками и рывками камеры, резкие переходы. Красный — только бечёвка, пломба, прицел и опасность.
# Сценарий: projects/market/script.yaml. Актёры проекта: projects/market/actors/ (noir.js, items.js, places.js, shared.js).
# Время: "@слово" (числа в at — абсолютные секунды ролика).

title: "Чёрный рынок невозможного"

voice: {"voice": "ru-RU-SvetlanaNeural", "rate": "+18%", "pitch": "-4Hz", "tail": 1.6}
voices:
  savva: {"voice": "en-US-BrianMultilingualNeural", "rate": "+8%", "pitch": "+0Hz"}
  vais: {"voice": "de-DE-FlorianMultilingualNeural", "rate": "+8%", "pitch": "-6Hz"}
  ada: {"voice": "de-DE-SeraphinaMultilingualNeural", "rate": "+6%", "pitch": "-6Hz"}
  clock: {"voice": "en-US-AndrewMultilingualNeural", "rate": "+4%", "pitch": "-10Hz"}

theme:
  preset: archive
  accent: "#e0283a"
  captions: {style: clean, top: auto, size: 62, max_chars: 20}

post: {vignette: 0.16, chromatic: 0, grain: 0.015}

draw:
  palette: {ink: "#07080a", conc: "#1b1f24", steel: "#3a4048", grey: "#8a8f96", warm: "#f2ede4", sodium: "#e8a23a", red: "#e0283a"}

audio:
  music:
    key: D
    mode: minor
    bpm: 92
    gain: -15
    sections:
      - {at: 0, style: drone}
      - {at: "@price.start", style: tension}
      - {at: "@shot.start", style: pulse}
      - {at: "@dilemma.start", style: tension}
      - {at: "@twist.start", style: sub}
      - {at: "@cliff.start", style: drone}
  duck: 0.6

# ------------------------------------------------------------------ shared pieces
x-noir: &noir {actor: noir_frame, x: 0, y: 0, space: screen}
x-sky: &sky_night {actor: sky, x: -400, y: 0, w: 1880, h: 1500, hour: 23, colors: ["#07090c", "#121820", "#26303a"], sun: false, moon: false, stars: 0, clouds: 0, horizon: 1100, par: 0}
x-clouds: &clouds {actor: cloud_bank, x: -500, y: -60, w: 2100, h: 700, par: 0.05, color: "#2c343c", shade: "#11151a", n: 30}
x-cranes: &cranes_far {actor: cranes, x: 540, y: 1030, w: 2000, h: 620, n: 4, color: "#2e3640", par: 0.2, seed: 4}
x-ground-far: &ground_far {actor: ground, x: -700, y: 1010, w: 2500, h: 1000, color: ["#20262c", "#15191d"], par: 0.2}
x-haze: &haze {actor: shape, kind: rect, x: 540, y: 1000, w: 2600, h: 320, par: 0.22, fill: {linear: ["rgba(90,104,118,0)", "rgba(90,104,118,0.55)", "rgba(90,104,118,0)"], angle: 180}}
x-ground-mid: &ground_mid {actor: ground, x: -700, y: 1150, w: 2500, h: 900, color: ["#1d2227", "#121518"], par: 0.5}
x-rain: &rain {actor: rain, x: 0, y: 0, space: screen, count: 280, alpha: 0.5, color: "#c9d6e0"}
x-dark: &dark_bg {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2300, fill: {radial: ["#1a1f25", "#060708"]}}
x-hall-blur: &hall_blur {actor: market_hall, x: -160, y: 0, w: 1400, blur: 16, brightness: 0.55, crowd: 6, par: 0.3}

scenes:

  # ------------------------------------------------------------------ 1. HOOK — макро: коробка, пломба, три прицела; заголовок
  - id: hook
    accent: "#e0283a"
    text: "Коробку с чёрного рынка нельзя открывать. Четыре часа. Три банды. Одно правило."
    caption_marks: {"чёрного рынка": "#e0283a", "нельзя открывать": "#f2ede4"}
    shots:
      - id: k_box
        transition: {type: fade, dur: 0.2}
        ambience: [{sound: hum, gain: -18}]
        draw:
          camera: {keys: [{t: 0, z: 1.12, x: 540, y: 1000}, {t: end, z: 1.24, x: 520, y: 1010}],
                   shakes: [{at: "@Три", amp: 7, dur: 0.25, freq: 6}, {at: "@банды", amp: 7, dur: 0.25, freq: 6}], sway: {x: 3, y: 2, roll: 0.2, freq: 0.5}}
          layers:
            - *hall_blur
            - {actor: shape, kind: rect, x: 540, y: 1600, w: 1800, h: 900, fill: {linear: ["#2a2420", "#0e0c0a"], angle: 180}}
            - {actor: shape, kind: rect, x: 540, y: 1162, w: 1800, h: 14, fill: "#4a3a2c"}
            - {actor: shape, kind: polygon, points: [[540, 260], [470, 260], [120, 1220], [960, 1220]], fill: {linear: ["rgba(255,224,170,0.30)", "rgba(255,224,170,0)"], angle: 180}, flicker: {amp: 0.05}}
            - {actor: shape, kind: path, d: "M540,0 L540,250", stroke: "#15171a", sw: 4}
            - {actor: shape, kind: path, d: "M500,250 h80 l-10,46 h-60 Z M508,296 q32,40 64,0", stroke: "#2b3036", sw: 5, fill: "none"}
            - {actor: light_pool, x: 540, y: 290, r: 150, color: "#ffe3b0", a: 0.9}
            - {actor: shape, kind: circle, x: 540, y: 286, r: 16, fill: "#fff3d6"}
            - {actor: lot_box, id: box, x: 560, y: 1210, scale: 1.05, label: "НЕ ОТКРЫВАТЬ\nДО 05:00"}
            - {actor: particles, kind: steam, from: [420, 1080], region: [200, 600, 900, 1150], count: 8, alpha: 0.18, speed: 0.5}
            - {actor: laser, x: 0, y: 0, from: [-260, 260], to: [420, 1010], beam: 0.5, at: "@Три-0.05", enter: {type: fade, dur: 0.12}}
            - {actor: laser, x: 0, y: 0, from: [1400, 340], to: [600, 930], beam: 0.5, at: "@Три+0.35", enter: {type: fade, dur: 0.12}}
            - {actor: laser, x: 0, y: 0, from: [760, -200], to: [700, 1080], beam: 0.5, at: "@банды-0.05", enter: {type: fade, dur: 0.12}}
            - {actor: text, slot: tag, text: "КОРОБКА С ЧЁРНОГО РЫНКА", font: plex, size: 40, weight: 600, letter: 6, color: warm, at: "@Коробку", enter: {type: fade, dur: 0.3}}
            - {actor: text, x: 540, y: 420, space: screen, text: "04:00:00", font: plex, size: 72, weight: 600, color: "#ff6a78", bg: {color: "rgba(7,8,10,0.94)", pad: 14, radius: 6}, at: "@Четыре", enter: {type: fade, dur: 0.15}}
            - {<<: *noir, flare: [540, 290], flare_k: 0.7}
      - id: k_title
        start: "@Одно-0.22"
        transition: {type: slam}
        draw:
          camera: {keys: [{t: 0, z: 1.06}, {t: end, z: 1.0}], shakes: [{at: "@правило", amp: 14, dur: 0.35, freq: 6}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1400, h: 2200, fill: {radial: ["#1c1f24", "#050506"]}}
            - {actor: noir_title, x: 540, y: 700, kicker: "ЛОТ 7 · ЧЕТВЕРГ", text: "ЧЁРНЫЙ РЫНОК<br>НЕВОЗМОЖНОГО", size: 132, sub: "ВЕЩИ, КОТОРЫХ НЕ БЫВАЕТ", at: "@правило-0.1", enter: {type: zoom, dur: 0.25}}
            - {actor: death_watch, x: 270, y: 1170, scale: 0.3, display: "05:00", at: "@правило", enter: {type: fade, dur: 0.2}}
            - {actor: mirror_24, x: 540, y: 1150, scale: 0.26, frost: 0.4, at: "@правило+0.12", enter: {type: fade, dur: 0.2},
               children: [{actor: shape, kind: rect, x: 274, y: 404, w: 560, h: 820, fill: {radial: ["#3a4652", "#10141a"]}}]}
            - {actor: bullet_macro, x: 810, y: 1170, scale: 0.28, at: "@правило+0.24", enter: {type: fade, dur: 0.2}}
            - {<<: *noir, glitch: [{at: "@правило-0.12", dur: 0.12}]}
    sfx:
      - {sound: hiss, at: "@hook.start", gain: -16}
      - {sound: click, at: "@Три", gain: -10}
      - {sound: click, at: "@Три+0.35", gain: -11}
      - {sound: click, at: "@банды", gain: -10}
      - {sound: boom, at: "@правило", gain: -9}

  # ------------------------------------------------------------------ 2. SETUP — комбинат под дождём, термометр, ворота, Савва
  - id: setup
    text: "Час ночи. Заброшенный хладокомбинат на Портовой. В камерах до сих пор минус восемнадцать. Пахнет аммиаком и ржавчиной. По четвергам здесь рынок. Савва, двадцать шесть лет, курьер. Возит то, что нельзя отправить почтой."
    caption_marks: {"минус восемнадцать": "#9fc4dc"}
    shots:
      - id: s_gate
        transition: {type: dip, dur: 0.3}
        ambience: [{sound: rain, gain: -14}, {sound: hum, gain: -24}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.1, x: 560, y: 1000}], sway: {x: 3, y: 2, roll: 0.2, freq: 0.4}}
          layers:
            - *sky_night
            - *clouds
            - *cranes_far
            - *ground_far
            - *haze
            - {actor: containers, x: 1000, y: 1162, scale: 0.42, n: 3, seed: 3, fog: "#46525e", fog_k: 0.5, par: 0.5}
            - *ground_mid
            - {actor: factory, id: plant, x: 470, y: 1336, scale: 0.74, door: 0.25}
            - {actor: wet_ground, x: -500, y: 1312, w: 2100, h: 800, lights: [[880, "#e8a23a", 60], [470, "#ffcf8a", 90]]}
            - {actor: puddle, x: 300, y: 1560, w: 420, h: 70, sky: "#3a4652", light: "#e8a23a"}
            - {actor: puddle, x: 760, y: 1720, w: 360, h: 60, seed: 5, sky: "#3a4652"}
            - {actor: lamp_post, x: 900, y: 1330, h: 700, left: true, on: [{at: 0, v: 1}, {at: "@Заброшенный", v: 0.2, dur: 0.05}, {at: "@Заброшенный+0.12", v: 1, dur: 0.05}, {at: "@Заброшенный+0.3", v: 0.3, dur: 0.05}, {at: "@Заброшенный+0.4", v: 1, dur: 0.05}]}
            - *rain
            - {actor: timetag, slot: tag, text: "ЧТ · 01:00 · ПОРТОВАЯ", at: "@Час", enter: {type: fade, dur: 0.3}}
            - *noir
      - id: s_cold
        start: "@минус-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 600, y: 960}, {t: end, z: 1.08, x: 500, y: 940}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#2a3640", "#07090b"]}}
            - {actor: light_pool, x: 300, y: 500, r: 520, color: "#bcd4e6", a: 0.25, blur: 20}
            - {actor: thermometer, x: 540, y: 980, value: [{at: 0, v: -12}, {at: "@восемнадцать", v: -18, dur: 0.6, ease: out}]}
            - {actor: particles, kind: sparkles, region: [0, 400, 1080, 1500], count: 26, size: [6, 14], colors: ["#e8f2ff"], alpha: 0.7}
            - {actor: particles, kind: steam, from: [940, 1240], region: [700, 800, 1080, 1300], count: 6, alpha: 0.14, speed: 0.4}
            - *noir
      - id: s_doors
        start: "@четвергам-0.22"
        transition: {type: whip_y}
        draw:
          camera: {keys: [{t: 0, z: 1.05, x: 540, y: 1100}, {t: end, z: 1.0, x: 540, y: 980}]}
          layers:
            - {actor: sky, x: -300, y: 0, w: 1680, h: 1500, hour: 23, colors: ["#0a0d12", "#1b2430", "#33404c"], sun: false, moon: false, stars: 0, clouds: 0}
            - {actor: cranes, x: 540, y: 1100, w: 1800, h: 520, n: 3, color: "#2e3640", seed: 6, par: 0.2}
            - {actor: ground, x: -300, y: 1090, w: 1700, h: 500, color: ["#232a31", "#181c20"], par: 0.2}
            - {actor: shape, kind: rect, x: 540, y: 1080, w: 1800, h: 200, fill: {linear: ["rgba(90,104,118,0)", "rgba(90,104,118,0.5)", "rgba(90,104,118,0)"], angle: 180}}
            - {actor: containers, x: 300, y: 1190, scale: 0.4, n: 2, seed: 2, fog: "#46525e", fog_k: 0.5}
            - {actor: ground, x: -300, y: 1180, w: 1700, h: 400, color: ["#20262c", "#15191d"]}
            - {actor: lamp_post, x: 760, y: 1200, h: 520, left: true}
            - {actor: rain, x: 0, y: 0, count: 200, alpha: 0.5, color: "#c9d6e0"}
            - {actor: roll_gate, x: 0, y: 0, floor_y: 1420, open: [{at: 0, v: 0.05}, {at: "@четвергам", v: 0.7, dur: 1.2, ease: out}]}
            - {actor: light_pool, x: 540, y: 1460, r: 420, sy: 0.25, color: "#9fb6c8", a: 0.35}
            - *noir
      - id: s_savva
        start: "@Савва-0.22"
        captions_top: 740
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.06, x: 540, y: 930}]}
          layers:
            - {actor: market_hall, x: 0, y: 0, crowd: 8, lights: 1}
            - {actor: noir_figure, id: savva, x: 790, y: 1660, view: front, kind: courier, hold: none, scale: 1.45, rim: "#ffcf8a", rim_side: 1, walk: 1.4,
               anim: [{at: "@Савва-0.2", dur: 5.6, scale: 1.75, y: 1820, ease: linear}]}
            - {actor: particles, kind: steam, from: [790, 980], region: [630, 760, 950, 1020], count: 5, alpha: 0.2, speed: 0.6, at: "@почтой-0.3"}
            - {actor: name_tag, x: 540, y: 420, space: screen, label: "САВВА, 26", sub: "КУРЬЕР", at: "@Савва", enter: {type: wipe_right, dur: 0.3}}
            - {<<: *noir, flare: [540, 640], flare_k: 0.35}
    sfx:
      - {sound: click, at: "@Заброшенный", gain: -18}
      - {sound: hiss, at: "@минус", gain: -16}
      - {sound: drip, at: "@ржавчиной", gain: -14}
      - {sound: creak, at: "@четвергам", gain: -10}
      - {sound: footstep, at: "@Савва", gain: -14}
      - {sound: footstep, at: "@курьер", gain: -15}

  # ------------------------------------------------------------------ 2b. STALLS — макро вещей рынка; зеркало
  - id: stalls
    text: "На прилавках — часы, которые показывают время смерти владельца. Зеркало, в котором эта комната через сутки. Патроны, которые бьют в цель только при условии. Савва проходит мимо зеркала. В отражении он сидит в кресле оценщика. Моргает — обычное зеркало."
    caption_marks: {"время смерти": "#e8a23a", "через сутки": "#9fc4dc"}
    shots:
      - id: s_watch
        transition: {type: whip_x}
        draw:
          camera: {keys: [{t: 0, z: 1.1, x: 600, y: 940}, {t: end, z: 1.2, x: 520, y: 920}], sway: {x: 2, y: 2, freq: 0.5}}
          layers:
            - *hall_blur
            - {actor: shape, kind: rect, x: 540, y: 1500, w: 1800, h: 1200, fill: {linear: ["#3a1418", "#12060a"], angle: 180}}
            - {actor: light_pool, x: 760, y: 700, r: 520, color: "#ffd89a", a: 0.3, blur: 30}
            - {actor: death_watch, x: 540, y: 880, scale: 1.0, time: 3.2, display: [{at: 0, v: "--.--.---- --:--"}, {at: "@смерти", v: "14.11.2061 · 03:12"}], glow: [{at: 0, v: 0.2}, {at: "@смерти", v: 1, dur: 0.4}]}
            - {actor: name_tag, x: 540, y: 330, space: screen, label: "ЧАСЫ", sub: "ВРЕМЯ СМЕРТИ ВЛАДЕЛЬЦА", color: sodium, at: "@часы", enter: {type: wipe_right, dur: 0.3}}
            - {<<: *noir, flare: [760, 520], flare_k: 0.4}
      - id: s_mirror
        start: "@Зеркало-0.22"
        transition: {type: whip_x}
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.08}]}
          layers:
            - *hall_blur
            - {actor: mirror_24, x: 540, y: 960, scale: 1.05, stamp: "+24 Ч", ripple: [{at: 0, v: 0}, {at: "@сутки-0.2", v: 1, dur: 0.25}, {at: "@сутки+0.2", v: 0, dur: 0.4}],
               children: [
                 {actor: market_hall, x: 0, y: 0, w: 548, h: 808, vp: [274, 380], crowd: 5, lights: 1, sway: 0},
                 {actor: market_hall, x: 0, y: 0, w: 548, h: 808, vp: [274, 380], crowd: 0, lights: 0.35, sway: 0, stalls: false, seed: 9, at: "@сутки", enter: {type: fade, dur: 0.3}},
                 {actor: shape, kind: rect, x: 274, y: 404, w: 560, h: 820, fill: "rgba(60,90,130,0.25)", at: "@сутки", enter: {type: fade, dur: 0.3}}]}
            - {actor: name_tag, x: 540, y: 330, space: screen, label: "ЗЕРКАЛО", sub: "ЭТА КОМНАТА ЧЕРЕЗ 24 ЧАСА", color: "#9fc4dc", at: "@Зеркало", enter: {type: wipe_right, dur: 0.3}}
            - *noir
      - id: s_bullets
        start: "@Патроны-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.15, x: 420, y: 960}, {t: end, z: 1.2, x: 640, y: 960}]}
          layers:
            - *hall_blur
            - {actor: shape, kind: rect, x: 540, y: 1500, w: 1800, h: 1200, fill: {linear: ["#2a1d12", "#0e0905"], angle: 180}}
            - {actor: light_pool, x: 540, y: 600, r: 600, color: "#ffd89a", a: 0.25, blur: 30}
            - {actor: bullet_macro, x: 540, y: 1000, scale: 1.0, glow: [{at: 0, v: 0}, {at: "@условии", v: 1, dur: 0.4}]}
            - {actor: name_tag, x: 540, y: 330, space: screen, label: "ПАТРОНЫ", sub: "БЬЮТ ПРИ УСЛОВИИ", color: sodium, at: "@Патроны", enter: {type: wipe_right, dur: 0.3}}
            - {<<: *noir, flare: [540, 560], flare_k: 0.35}
      - id: s_reflect
        start: "@проходит-0.22"
        captions_top: 1490
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: "@отражении", z: 1.12, x: 540, y: 900, ease: out}, {t: "@Моргает", z: 1.12, x: 540, y: 900}, {t: end, z: 1.1, x: 540, y: 940}]}
          layers:
            - *hall_blur
            - {actor: mirror_24, x: 540, y: 900, scale: 0.95, frost: 0.5,
               ripple: [{at: 0, v: 0}, {at: "@отражении-0.15", v: 0.8, dur: 0.15}, {at: "@отражении+0.1", v: 0, dur: 0.3}, {at: "@Моргает-0.1", v: 1, dur: 0.1}, {at: "@Моргает+0.15", v: 0, dur: 0.25}],
               children: [
                 {actor: market_hall, x: 0, y: 0, w: 548, h: 808, vp: [274, 360], crowd: 4, lights: 1, sway: 0, seed: 3},
                 {actor: noir_figure, x: 120, y: 760, scale: 1.0, kind: courier, rim: "#ffcf8a", walk: 1.3, anim: [{at: "@проходит-0.2", dur: 6.5, x: 520, ease: linear}], until: "@отражении", exit: {type: fade, dur: 0.1}},
                 {actor: noir_figure, x: 274, y: 760, scale: 0.62, view: front, kind: courier, rim: "#ffcf8a", pose: {sh1: 20, el1: 60, sh2: 20, el2: 60, th1: 0, kn1: 0, th2: 0, kn2: 0, lean: 0}, at: "@отражении", until: "@Моргает", enter: {type: fade, dur: 0.1}, exit: {type: fade, dur: 0.08}},
                 {actor: appraiser_desk, x: 274, y: 800, scale: 0.42, at: "@отражении", until: "@Моргает", enter: {type: fade, dur: 0.1}, exit: {type: fade, dur: 0.08}},
                 {actor: noir_figure, x: 300, y: 760, scale: 1.0, kind: courier, rim: "#ffcf8a", walk: 1.3, at: "@Моргает", anim: [{at: "@Моргает", dur: 3, x: 520, ease: linear}], enter: {type: fade, dur: 0.1}}]}
            - {actor: noir_figure, x: -200, y: 2100, scale: 2.6, kind: courier, rim: "#ffcf8a", walk: 1.3, blur: 10, brightness: 0.6, par: 1.2, anim: [{at: "@проходит-0.2", dur: 2.4, x: 1400, ease: linear}]}
            - {<<: *noir, glitch: [{at: "@Моргает-0.05", dur: 0.18}]}
    sfx:
      - {sound: click, at: "@часы", gain: -12}
      - {sound: click, at: "@часы+1", gain: -14}
      - {sound: whoosh, at: "@Зеркало-0.2", gain: -14}
      - {sound: sparkle, at: "@сутки", gain: -14}
      - {sound: metal_ring, at: "@Патроны", gain: -12}
      - {sound: noise_sweep, at: "@отражении", gain: -12}
      - {sound: glitch, at: "@Моргает", gain: -12}

  # ------------------------------------------------------------------ 3. PRICE — Вайс; парень седеет; три строки
  - id: price
    text: "Вайс, шестьдесят лет. Оценщик. Говорит цену раньше, чем ты спросишь. Парень в мокрой куртке берёт часы. Цена — десять лет жизни. Он расписывается. И седеет за секунду. У каждой вещи три строки. Цена. Ограничение. Побочный эффект. А цену забирает хозяин рынка."
    lines:
      - {who: vais, say: "У каждой вещи три строки. Цена. Ограничение. Побочный эффект."}
      - {who: vais, say: "А цену забирает хозяин рынка."}
    caption_marks: {"десять лет жизни": "#e0283a", "хозяин рынка": "#e0283a"}
    shots:
      - id: p_vais
        transition: {type: whip_x}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.08, x: 580, y: 940}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#1a2620", "#050606"]}}
            - {actor: light_pool, x: 880, y: 1000, r: 560, color: "#9fe0b0", a: 0.22, blur: 30}
            - {actor: appraiser_desk, x: 1050, y: 2060, scale: 1.2, chair: false, blur: 6, brightness: 0.7}
            - {actor: noir_face, x: 440, y: 900, scale: 1.15, loupe: true, collar: true, hair: "#9a9fa6", age: 0.6, rim: "#ffd89a",
               eye: [{at: 0, v: 1}, {at: "@Оценщик", v: 0.1, dur: 0.08}, {at: "@Оценщик+0.15", v: 1, dur: 0.1}]}
            - {actor: name_tag, x: 540, y: 330, space: screen, label: "ВАЙС, 60", sub: "ОЦЕНЩИК", at: "@Вайс", enter: {type: wipe_right, dur: 0.3}}
            - {<<: *noir, flare: [860, 760], flare_k: 0.3}
      - id: p_buyer
        start: "@Парень-0.22"
        captions_top: 830
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 980}, {t: end, z: 1.06, x: 540, y: 960}]}
          layers:
            - {actor: market_hall, x: -160, y: 0, w: 1400, blur: 10, brightness: 0.5, crowd: 5}
            - {actor: ground, x: -400, y: 1860, w: 1900, h: 500, color: ["#1e1b18", "#0a0908"]}
            - {actor: appraiser_desk, x: 600, y: 1880, scale: 1.0, chair: true}
            - {actor: noir_figure, x: 190, y: 1880, scale: 1.7, kind: courier, rim: "#9fe0b0", rim_side: 1,
               pose: [{at: 0, v: stand}, {at: "@берёт", v: reach, dur: 0.4}, {at: "@расписывается", v: {sh1: 60, el1: 40, sh2: -4, el2: 10, th1: 4, kn1: 2, th2: -4, kn2: 2, lean: 8}, dur: 0.3}]}
            - {actor: price_tag, x: 640, y: 560, scale: 0.78, rot: -4, title: "ЛОТ 12 · ЧАСЫ", rows: [{k: "ЦЕНА", v: "10 ЛЕТ ЖИЗНИ", red: true}],
               show: [{at: 0, v: 0}, {at: "@Цена", v: 1, dur: 0.6}], sign_line: true, sign: [{at: 0, v: 0}, {at: "@расписывается", v: 1, dur: 0.9}], at: "@берёт", enter: {type: drop, dur: 0.3}}
            - {<<: *noir, flare: [400, 1440], flare_k: 0.25}
      - id: p_grey
        start: "@седеет-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.08}, {t: end, z: 1.18}], shakes: [{at: "@седеет", amp: 6, dur: 0.3, freq: 5}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#13201a", "#040505"]}}
            - {actor: noir_face, x: 560, y: 920, scale: 1.2, hair: [{at: 0, v: "#15171a"}, {at: "@седеет", v: "#e8e6e0", dur: 0.9}], age: [{at: 0, v: 0}, {at: "@седеет", v: 1, dur: 1.0}], rim: "#9fe0b0"}
            - {<<: *noir, glitch: [{at: "@седеет", dur: 0.12}]}
      - id: p_tag
        start: "@каждой-0.22"
        transition: {type: cut}
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 960}, {t: end, z: 1.07, x: 560, y: 940}], shakes: [{at: "@хозяин", amp: 10, dur: 0.3, freq: 6}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#2a2218", "#070605"]}}
            - {actor: light_pool, x: 300, y: 500, r: 600, color: "#ffd89a", a: 0.25, blur: 30}
            - {actor: price_tag, x: 540, y: 780, scale: 1.1, rot: -3, size: 42, title: "ЛЮБАЯ ВЕЩЬ РЫНКА",
               rows: [{k: "ЦЕНА", v: "ЧТО ТЫ ОТДАШЬ"}, {k: "ОГРАНИЧЕНИЕ", v: "ЧЕГО ОНА НЕ МОЖЕТ"}, {k: "ПОБОЧНЫЙ ЭФФЕКТ", v: "ЧТО ПРИДЁТ САМО"}],
               show: [{at: 0, v: 0}, {at: "@Цена#2", v: 1, dur: 0.5}, {at: "@Ограничение", v: 2, dur: 0.5}, {at: "@Побочный", v: 3, dur: 0.5}],
               stamp: "ХОЗЯИНУ", stamp_k: [{at: 0, v: 0}, {at: "@хозяин", v: 1, dur: 0.2}]}
            - {actor: name_tag, x: 540, y: 300, space: screen, label: "ВАЙС", sub: "ОЦЕНЩИК", at: "@каждой", enter: {type: wipe_right, dur: 0.3}}
            - *noir
    sfx:
      - {sound: creak, at: "@Вайс", gain: -14}
      - {sound: scrape, at: "@расписывается", gain: -12}
      - {sound: noise_sweep, at: "@седеет", gain: -10}
      - {sound: typing, at: "@Цена#2", gain: -14}
      - {sound: typing, at: "@Ограничение", gain: -14}
      - {sound: typing, at: "@Побочный", gain: -14}
      - {sound: impact, at: "@хозяин", gain: -8}

  # ------------------------------------------------------------------ 4. JOB — коробка на столе, разговор, без веса, часы Вайса
  - id: job
    text: "Вайс ставит на стол коробку. Красная бечёвка, свинцовая пломба. Северный мол. До пяти утра. Не открывай. Что внутри? То, за что тебя будут убивать. Савва поднимает коробку. Она ничего не весит. На запястье Вайса — часы рынка. На них сегодняшняя дата. Пять ноль-ноль."
    lines:
      - {who: vais, say: "Северный мол. До пяти утра. Не открывай."}
      - {who: savva, say: "Что внутри?"}
      - {who: vais, say: "То, за что тебя будут убивать."}
    caption_marks: {"не открывай": "#e0283a"}
    shots:
      - id: j_box
        transition: {type: cut}
        captions_top: 760
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 1000}, {t: "@пломба", z: 1.0, x: 540, y: 1000}, {t: "@мол", z: 1.35, x: 520, y: 980, ease: inout}, {t: end, z: 1.38, x: 520, y: 980}]}
          layers:
            - {actor: market_hall, x: -160, y: 0, w: 1400, blur: 12, brightness: 0.45, crowd: 4}
            - {actor: ground, x: -400, y: 1880, w: 1900, h: 500, color: ["#1e1b18", "#0a0908"]}
            - {actor: appraiser_desk, x: 540, y: 1900, scale: 1.25, chair: true, book: false}
            - {actor: lot_box, x: 500, y: 1458, scale: 0.85, at: "@ставит-0.15", enter: {type: drop, dur: 0.3}}
            - {actor: noir_rule, x: 540, y: 520, space: screen, kicker: "ЗАКАЗ", text: "СЕВЕРНЫЙ МОЛ · ДО 05:00", size: 70, at: "@мол", enter: {type: wipe_right, dur: 0.25}}
            - {actor: name_tag, x: 540, y: 300, space: screen, label: "ВАЙС", sub: "ОЦЕНЩИК", at: "@мол", enter: {type: fade, dur: 0.2}}
            - {<<: *noir, flare: [460, 1150], flare_k: 0.35}
      - id: j_talk
        start: "@Не-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.0}, {t: end, z: 1.06}]}
          layers:
            - {actor: shape, kind: rect, x: 540, y: 960, w: 1500, h: 2200, fill: {radial: ["#1a2620", "#050606"]}}
            - {actor: light_pool, x: 760, y: 1100, r: 600, color: "#9fe0b0", a: 0.2, blur: 30}
            - {actor: noir_face, x: 440, y: 900, scale: 1.15, loupe: true, collar: true, hair: "#9a9fa6", age: 0.6, rim: "#ffd89a",
               talk: [["@Не", "@открывай.end"]], until: "@внутри-0.35", exit: {type: fade, dur: 0.05}}
            - {actor: noir_face, x: 640, y: 900, scale: 1.15, flip: true, hood: true, rim: "#d6e6f2", at: "@внутри-0.35", until: "@То-0.15", enter: {type: fade, dur: 0.05}, exit: {type: fade, dur: 0.05}}
            - {actor: noir_face, x: 440, y: 900, scale: 1.2, loupe: true, collar: true, hair: "#9a9fa6", age: 0.6, rim: "#ffd89a",
               smile: [{at: 0, v: 0}, {at: "@убивать", v: 1, dur: 0.4}], at: "@То-0.15", enter: {type: fade, dur: 0.05}}
            - {actor: name_tag, x: 540, y: 300, space: screen, label: "САВВА", sub: "КУРЬЕР", color: "#9fb6c8", at: "@внутри-0.3", until: "@То-0.15", enter: {type: fade, dur: 0.15}, exit: {type: fade, dur: 0.1}}
            - *noir
      - id: j_weight
        start: "@поднимает-0.22"
        draw:
          camera: {keys: [{t: 0, z: 1.15, x: 760, y: 1120}, {t: end, z: 1.25, x: 780, y: 1080}]}
          layers:
            - {actor: market_hall, x: -160, y: 0, w: 1400, blur: 12, brightness: 0.45, crowd: 4}
            - {actor: ground, x: -400, y: 1880, w: 1900, h: 500, color: ["#1e1b18", "#0a0908"]}
            - {actor: appraiser_desk, x: 540, y: 1900, scale: 1.25, chair: true, book: false, scale_text: "0 Г"}
            - {actor: lot_box, x: 880, y: 1380, scale: 0.5, tag: 0, anim: [{at: "@поднимает", dur: 0.5, dy: -360, ease: "back.out(1.4)"}]}
            - {actor: noir_rule, x: 540, y: 520, space: screen, kicker: "ВЕСЫ", text: "ВЕС: 0 Г", size: 84, danger: false, at: "@весит", enter: {type: wipe_right, dur: 0.25}}

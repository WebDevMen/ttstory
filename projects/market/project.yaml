    caption_marks: {"две тысячи шестьдесят первый": "#e8a23a"}
    shots:
      - id: o_street
        transition: {type: whip_x}
        ambience: [{sound: rain, gain: -15}, {sound: city, gain: -22}]
        draw:
          camera: {keys: [{t: 0, z: 1.0, x: 540, y: 980}, {t: end, z: 1.12, x: 540, y: 1040}]}

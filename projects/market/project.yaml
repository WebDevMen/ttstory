            - {actor: noir_figure, x: 980, y: 1520, scale: 1.0, view: front, kind: hat, watch: "#e8a23a", rim: "#e8a23a", rim_side: 1, walk: 0.9, at: "@выходят+0.1", enter: {type: fade, dur: 0.6}, anim: [{at: "@выходят", dur: 5, y: 1600, scale: 1.12, ease: linear}]}
            - {actor: noir_figure, x: 790, y: 1560, scale: 1.08, view: front, kind: hat, watch: "#e8a23a", rim: "#e8a23a", rim_side: 1, walk: 0.9, at: "@выходят", enter: {type: fade, dur: 0.6}, anim: [{at: "@выходят", dur: 5, y: 1650, scale: 1.2, ease: linear}]}
            - {actor: shape, kind: rect, x: 540, y: 1400, w: 2000, h: 360, fill: {linear: ["rgba(90,104,118,0)", "rgba(90,104,118,0.35)", "rgba(90,104,118,0)"], angle: 180}}

  # ------------------------------------------------------------------ 6b. MIRRORS — коридор контейнеров; зеркало в будке маяка
  - id: mirrors
    text: "За контейнерами Ада его не видит. Савва бежит. А на моле уже ждут третьи. Зеркальщики. Вчера они повесили зеркало в будке маяка. И увидели эту ночь."

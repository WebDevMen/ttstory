               glow: [{at: 0, v: 0.4}, {at: "@Пять", v: 1, dur: 0.3}]}
            - {actor: shape, kind: rect, x: 540, y: -400, w: 760, h: 900, fill: {linear: ["#0d0e10", "#1c1e22"], angle: 180}, anim: [{at: "@Пять+0.9", dur: 0.8, y: 360, ease: inout}]}
            - {actor: name_tag, x: 540, y: 300, space: screen, label: "ЧАСЫ ВАЙСА", sub: "ВРЕМЯ ЕГО СМЕРТИ", color: sodium, at: "@запястье", enter: {type: wipe_right, dur: 0.3}}
            - *noir
    sfx:
      - {sound: kick, at: "@ставит", gain: -9}
      - {sound: heartbeat, at: "@убивать", gain: -12}
      - {sound: whoosh, at: "@поднимает", gain: -14}
      - {sound: blip, at: "@весит", gain: -12}
      - {sound: click, at: "@Пять", gain: -10}

  # ------------------------------------------------------------------ 5. SHOT — двор, Ада, пуля огибает трубу, шагом
  - id: shot
    text: "Двор хладокомбината. Холодный дождь и один фонарь. На груди Саввы вспыхивает красная точка. Ада, снайпер. Шесть патронов рынка. Попадают только в бегущего. Савва бежит. Пуля огибает трубу и прошивает коробку насквозь. Внутри ничего не звякнуло. Савва замирает. Вторая пуля уходит в бетон у виска. Он идёт. Шагом. Под прицелом."
    caption_marks: {"только в бегущего": "#e0283a"}
    shots:
      - id: h_yard
        transition: {type: whip_y}
        ambience: [{sound: rain, gain: -13}]

  # ------------------------------------------------------------------ 7. DILEMMA — тупик на молу
  - id: dilemma
    text: "Четыре пятьдесят восемь. Северный мол. Гул прибоя. Слева люди с часами. Справа зеркальщики. Сверху красная точка Ады. Открой. Покажи, что там, — и уйдёшь. Отдай, курьер. Мои часы говорят: я сегодня не умру. Открыть — нарушить единственное правило. Не открыть — не дожить до пяти."
    lines:
      - {who: ada, say: "Открой. Покажи, что там, — и уйдёшь."}
      - {who: clock, say: "Отдай, курьер. Мои часы говорят: я сегодня не умру."}

  wishes: "Концепция пользователя: рынок невозможных вещей (часы со временем смерти владельца, зеркало, отражающее комнату через 24 часа, патроны, попадающие при условии); у каждой вещи цена, ограничение, побочный эффект; курьер с запретной коробкой, три группы охотников, коробка пустая — но все бегут от курьера. Графика: криминальный нуар, промышленные помещения, неон только там, где он оправдан, макросъёмка предметов, погони, резкие монтажные переходы. Своя графика (draw)."

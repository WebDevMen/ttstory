        graphics: []
        sfx:
          - {at: "@бетон", sound: impact}
          - {at: "@Шагом", sound: footstep}
        transition: cut

  # ------------------------------------------------------------------ 6. PORT — правило 3: люди с часами; зеркальщики
  - id: port
    role: escalation
    title: "Люди с часами"
    goal: "Вторая и третья банды: Часовщик, у которого часы показывают две тысячи шестьдесят первый, — бросается под фуру и встаёт; зеркальщики знают место и время."
    vo: "Портовая улица. Пахнет солью и мазутом. Из переулка выходят трое в одинаковых часах. Главный у них — Часовщик. На его часах две тысячи шестьдесят первый. Он бросается под фуру. И встаёт. Ему нечего бояться до старости."
    scene: {when: "03:40", where: "портовая улица и контейнерный терминал"}
    on_screen: "ЧАСЫ: 2061"
    devices: [stakes_raise, visual_proof, number_reveal, contrast, pattern_interrupt]
    music: pulse
    shots:
      - id: o_street
        visual: "Портовая улица ночью: мокрый асфальт, контейнеры, краны в тумане, аптечный крест мигает зелёным над дверью; из переулка выходят трое в одинаковых пальто, на запястьях светятся одинаковые часы."
        actors: [sky, cloud_bank, new:cranes, new:containers, wet_ground, lamp_post, person, rain, neon_sign]
        camera: "Низкий план, медленный наезд на троих"
        animation:
          - {at: "@выходят", what: "Трое выходят из тумана"}
          - {at: "@мазутом", what: "Аптечный крест мигает, капли с козырька"}
          - {at: "@часах", what: "Три одинаковых огонька на запястьях"}
        graphics: []
        sfx:
          - {at: "@выходят", sound: footstep}
        ambience: [rain, city]
        transition: whip_x
      - id: o_clock
        at: "@Часовщик-0.1"
        visual: "Макро: часы Часовщика, табло «2061»; рядом выноска."
        actors: [new:death_watch, callout, new:noir_frame]
        camera: "Сверхкрупно"
        animation:
          - {at: "@шестьдесят", what: "Табло: 2061"}
        graphics:
          - {at: "@Часовщик", type: callout, text: "ЧАСОВЩИК · ЧАСЫ: 2061"}
        sfx:
          - {at: "@Часовщик", sound: click}
        transition: cut
      - id: o_truck
        at: "@бросается-0.1"
        visual: "Фура с горящими фарами летит по улице; Часовщик прыгает ей под колёса наперерез Савве; визг, искры — и он поднимается с асфальта, поправляет часы."
        actors: [new:truck, wet_ground, person, particles, rain]
        camera: "Широкий план, тряска, наезд на «встаёт»"
        animation:
          - {at: "@фуру", what: "Фура, фары, удар"}
          - {at: "@встаёт", what: "Часовщик встаёт"}
        graphics: []
        sfx:
          - {at: "@фуру", sound: impact}
          - {at: "@встаёт", sound: metal_ring}
        transition: cut
      - id: o_walk
        at: "@Ему-0.1"
        visual: "Часовщик идёт на Савву сквозь пар от решётки ливнёвки, отряхивая пальто; за ним в свете фар уезжает фура; Савва пятится к контейнерам."
        actors: [wet_ground, person, new:containers, rain, particles]
        camera: "Ручная камера, медленный наезд на Часовщика"
        animation:
          - {at: "@бояться", what: "Часовщик поправляет часы, улыбается"}
          - {at: "@старости", what: "Савва пятится"}
        graphics: []
        sfx:
          - {at: "@старости", sound: footstep}
        transition: whip_x

  # ------------------------------------------------------------------ 6b. MIRRORS — третья банда знает место и время
  - id: mirrors
    role: escalation
    title: "Зеркальщики"
    goal: "Третья банда: зеркало, повешенное вчера в будке маяка, показало им эту ночь — они ждут на молу."
    vo: "За контейнерами Ада его не видит. Савва бежит. А на моле уже ждут третьи. Зеркальщики. Вчера они повесили зеркало в будке маяка. И увидели эту ночь."
    scene: {when: "04:40", where: "контейнерный терминал → будка маяка на молу"}
    on_screen: "ЗЕРКАЛО ВИДЕЛО ЭТУ НОЧЬ"
    devices: [stakes_raise, open_loop, visual_proof]
    music: pulse
    shots:
      - id: o_run
        visual: "Контейнерный терминал: коридор из ржавых контейнеров, Савва бежит, красная точка прицела соскальзывает с контейнера и гаснет; сверху кран."
        actors: [new:containers, new:cranes, person, new:laser, rain]
        camera: "Проводка, резкие рывки"
        animation:
          - {at: "@видит", what: "Точка гаснет"}
          - {at: "@бежит", what: "Савва срывается на бег"}
        graphics: []
        sfx:
          - {at: "@бежит", sound: footstep}
        transition: whip_x
      - id: o_mirror
        at: "@моле-0.1"
        visual: "Будка маяка на конце мола: внутри на стене зеркало; в зеркале — эта же будка ночью, за стеклом виден курьер с коробкой; у будки двое в чёрном."
        actors: [new:pier, new:mirror_24, person, rain]
        camera: "Медленный наезд в зеркало"
        animation:
          - {at: "@Зеркальщики", what: "Двое у будки"}
          - {at: "@повесили", what: "Зеркало качается на гвозде"}
          - {at: "@ночь", what: "В зеркале курьер с коробкой"}
        graphics:
          - {at: "@увидели", type: tag, text: "ЗЕРКАЛО: ВЧЕРА → СЕГОДНЯ"}
        sfx:
          - {at: "@ночь", sound: noise_sweep}
        transition: dip

  # ------------------------------------------------------------------ 7. DILEMMA — тупик на молу
  - id: dilemma
    role: escalation
    title: "Тупик"
    goal: "Дилемма: с трёх сторон банды, бежать нельзя; Ада и Часовщик спорят, у каждого своя правда; открыть или не дожить до пяти."
    vo: "Четыре пятьдесят восемь. Северный мол. Гул прибоя. Слева люди с часами. Справа зеркальщики. Сверху красная точка Ады. Открой. Покажи, что там, — и уйдёшь. Отдай, курьер. Мои часы говорят: я сегодня не умру. Открыть — нарушить единственное правило. Не открыть — не дожить до пяти."
    lines:
      - {who: ada, say: "Открой. Покажи, что там, — и уйдёшь."}
      - {who: clock, say: "Отдай, курьер. Мои часы говорят: я сегодня не умру."}
    scene: {when: "04:58", where: "конец Северного мола у маяка"}
    on_screen: "ОТКРЫТЬ ИЛИ ДОВЕЗТИ?"
    devices: [contrast, stakes_raise, emotion, direct_address]
    music: tension
    shots:
      - id: d_pier
        visual: "Конец мола: маяк, бетонные кнехты, волны бьют в волнорез, туман. Савва с коробкой у края; слева трое с часами, справа двое у будки; сверху красная точка."
        actors: [sky, new:pier, person, new:laser, rain, timetag]
        camera: "Общий план сверху, медленный облёт"
        animation:
          - {at: "@Четыре", what: "Таймер 04:58"}
          - {at: "@прибоя", what: "Волна бьёт в волнорез, брызги"}
          - {at: "@мол", what: "Луч маяка проходит над Саввой"}
        graphics:
          - {at: "@Четыре", type: timetag, text: "04:58 · СЕВЕРНЫЙ МОЛ"}
        sfx:
          - {at: "@прибоя", sound: noise_sweep}
        ambience: [ocean, wind]
        transition: whip_y
      - id: d_three
        at: "@Слева-0.1"
        visual: "Савва спиной к морю, коробка у груди; слева из тумана трое с часами, справа двое у будки маяка; сверху на коробку ложится красная точка."
        actors: [new:pier, person, new:laser, rain]
        camera: "Панорама слева направо, затем вверх"
        animation:
          - {at: "@Слева", what: "Трое с часами входят слева"}
          - {at: "@Справа", what: "Зеркальщики справа"}
          - {at: "@Сверху", what: "Красная точка на коробке"}
        graphics: []
        sfx:
          - {at: "@Слева", sound: footstep}
          - {at: "@Сверху", sound: click}
        transition: cut
      - id: d_argue
        at: "@Открой-0.1"
        visual: "Крупно: Часовщик протягивает руку, часы светятся; за ним туман и маяк. Голос Ады — из рации у него на поясе."
        actors: [new:pier, person, new:death_watch, rain]
        camera: "Восьмёрка: Часовщик — Савва"
        animation:
          - {at: "@уйдёшь", what: "Шаг вперёд"}
          - {at: "@Отдай", what: "Протянутая рука"}
          - {at: "@умру", what: "Стучит по часам"}
        graphics: []
        sfx:
          - {at: "@умру", sound: heartbeat}
        transition: cut
      - id: d_choice
        at: "@нарушить-0.1"
        visual: "Макро: пальцы Саввы на красной бечёвке у пломбы; поверх две карточки: «ОТКРЫТЬ — нарушить правило» и «ДОВЕЗТИ — не дожить до 05:00»."
        actors: [new:lot_box, card, text, new:noir_frame]
        camera: "Сверхкрупно, медленный наезд"
        animation:
          - {at: "@правило", what: "Карточка «ОТКРЫТЬ»"}
          - {at: "@дожить", what: "Карточка «ДОВЕЗТИ», пальцы сжимают бечёвку"}
        graphics:
          - {at: "@дожить", type: "text slam", text: "ОТКРЫТЬ ИЛИ ДОВЕЗТИ?"}
        sfx:
          - {at: "@дожить", sound: impact}
        transition: cut

  # ------------------------------------------------------------------ 8. TWIST — коробка пустая; все бегут
  - id: twist
    role: twist
    title: "Пустая"
    goal: "Выстрел улик: коробка пустая, на дне бирка; часы всех прыгают на пять ноль одну; Часовщик: он теперь рынок; охотники бегут от курьера."
    vo: "Пять ноль-ноль. Савва срывает пломбу. Коробка пустая. Только бирка на дне. Цена — всё. Ограничение — навсегда. Побочный эффект — тебя боятся. Часы у всех троих прыгают на пять ноль одну. Он открыл. Теперь он — рынок. И охотники бегут. От него."
    lines:
      - {who: clock, say: "Он открыл. Теперь он — рынок."}
    scene: {when: "05:00", where: "конец Северного мола"}
    on_screen: "ТЕПЕРЬ ОН — РЫНОК"
    devices: [twist, callback, visual_proof, emotion, number_reveal]
    music: sub
    shots:
      - id: t_open
        visual: "Макро: пломба лопается, бечёвка соскальзывает, крышка поднимается — внутри пустота и пыль в луче фонаря маяка; на дне бирка."
        actors: [new:lot_box, particles, new:noir_frame]
        camera: "Сверху вниз, наезд в коробку"
        animation:
          - {at: "@срывает", what: "Пломба лопается"}
          - {at: "@пустая", what: "Крышка открыта — пусто"}
          - {at: "@бирка", what: "Бирка на дне"}
        graphics: []
        sfx:
          - {at: "@срывает", sound: metal_ring}
          - {at: "@пустая", sound: breath}
        transition: cut
      - id: t_tag
        at: "@Цена-0.1"
        visual: "Макро бирки со дна коробки: три строки проступают — ЦЕНА: ВСЁ / ОГРАНИЧЕНИЕ: НАВСЕГДА / ПОБОЧНО: ТЕБЯ БОЯТСЯ."
        actors: [new:price_tag, new:noir_frame]
        camera: "Сверхкрупно"
        animation:
          - {at: "@всё", what: "Строка 1"}
          - {at: "@навсегда", what: "Строка 2"}
          - {at: "@боятся", what: "Строка 3, красная"}
        graphics: []
        sfx:
          - {at: "@всё", sound: typing}
          - {at: "@боятся", sound: impact}
        transition: cut
      - id: t_watches
        at: "@Часы-0.1"
        visual: "Три запястья рядом: табло часов одновременно перескакивают с далёких лет на «05:01»."
        actors: [new:death_watch, new:noir_frame]
        camera: "Быстрый проезд по трём часам"
        animation:
          - {at: "@прыгают", what: "Табло прыгают"}
          - {at: "@одну", what: "05:01 горит красным"}
        graphics:
          - {at: "@одну", type: badge, text: "05:01"}
        sfx:
          - {at: "@прыгают", sound: glitch}
        transition: glitch
      - id: t_flee
        at: "@открыл-0.1"
        visual: "Общий план мола: Часовщик пятится, роняет рацию; трое и зеркальщики разворачиваются и бегут в туман; красная точка соскальзывает с Саввы и гаснет; Савва один у края с пустой коробкой, свет маяка проходит над ним."
        actors: [sky, new:pier, person, new:laser, rain, text]
        camera: "Отъезд вверх и назад"
        animation:
          - {at: "@рынок", what: "Часовщик пятится"}
          - {at: "@бегут", what: "Все бегут в туман"}
          - {at: "@него", what: "Точка гаснет, Савва один"}
        graphics:
          - {at: "@рынок", type: "text slam", text: "ТЕПЕРЬ ОН — РЫНОК"}
        sfx:
          - {at: "@рынок", sound: boom}
          - {at: "@бегут", sound: footstep}
        transition: dip

  # ------------------------------------------------------------------ 9. CLIFF — часы Вайса, новый курьер
  - id: cliff
    role: cliffhanger
    title: "Следующий четверг"
    goal: "Петля: часы Вайса остановились в пять, кресло пустое; через неделю Савва в кресле ставит коробку перед новым курьером — «Не открывай»."
    vo: "В пять утра на хладокомбинате остановились часы Вайса. Его кресло пустое. Через неделю четверг. Савва ставит на стол коробку. Перед ним новый курьер. Не открывай."
    lines:
      - {who: savva, say: "Не открывай."}
    scene: {when: "05:00 → следующий четверг, 01:20", where: "хладокомбинат, стол оценщика"}
    on_screen: "НЕ ОТКРЫВАЙ"
    devices: [callback, twist, rewatch_trigger, loop_ending]
    music: drone
    shots:
      - id: c_chair
        visual: "Стол оценщика в пустом цеху: часы Вайса лежат на столе, табло 05:00 не мигает; кожаное кресло пустое, лупа на сиденье; лампа гаснет."
        actors: [new:market_hall, new:appraiser_desk, new:death_watch]
        camera: "Медленный наезд на кресло"
        animation:
          - {at: "@остановились", what: "Табло замирает"}
          - {at: "@пустое", what: "Лампа гаснет"}
        graphics: []
        sfx:
          - {at: "@остановились", sound: click}
        ambience: [hum]
        transition: dip
      - id: c_loop
        at: "@Через-0.1"
        visual: "Тот же стол через неделю — кадр как в зеркале: Савва в кресле, лупа на лбу; ставит на стол коробку с красной бечёвкой; напротив молодой курьер в мокрой куртке."
        actors: [new:market_hall, new:appraiser_desk, new:lot_box, person, timetag]
        camera: "Восьмёрка, затем наезд на коробку"
        animation:
          - {at: "@четверг", what: "Метка «ЧТ · 01:20»"}
          - {at: "@ставит", what: "Коробка на стол"}
          - {at: "@открывай", what: "Савва убирает руку, улыбается краем рта"}
        graphics:
          - {at: "@четверг", type: timetag, text: "ЧТ · 01:20 · ЧЕРЕЗ НЕДЕЛЮ"}
          - {at: "@открывай", type: "text slam", text: "НЕ ОТКРЫВАЙ"}
        sfx:
          - {at: "@ставит", sound: kick}
          - {at: "@открывай", sound: boom}
        transition: cut

  # ------------------------------------------------------------------ 10. CTA — открыть или довезти
  - id: cta
    role: cta
    title: "Открыть или довезти"
    goal: "Вопрос-выбор зрителю по дилемме."
    vo: "А ты бы открыл коробку — или довёз до пяти? Пиши: открыть или довезти."
    on_screen: "ОТКРЫТЬ ИЛИ ДОВЕЗТИ?"
    devices: [comment_bait, direct_address, follow_trigger]
    music: drone
    shots:
      - id: q_choice
        visual: "Коробка с красной бечёвкой под лампой, как в первом кадре; по бокам две карточки «ОТКРЫТЬ» и «ДОВЕЗТИ»; на коробку снова наползает красная точка."
        actors: [new:lot_box, card, text, new:laser, new:noir_frame]
        camera: "Медленный наезд"
        animation:
          - {at: "@открыл", what: "Карточка «ОТКРЫТЬ»"}
          - {at: "@довёз", what: "Карточка «ДОВЕЗТИ»"}
          - {at: "@Пиши", what: "Обе пульсируют, красная точка на коробке"}
          - {at: "@довезти", what: "Карточка «ДОВЕЗТИ» вспыхивает"}
        graphics:
          - {at: "@Пиши", type: "text slam", text: "ОТКРЫТЬ ИЛИ ДОВЕЗТИ?"}
        sfx:
          - {at: "@открыл", sound: blip}
          - {at: "@довёз", sound: blip}
          - {at: "@Пиши", sound: impact}
        transition: cut

loops:
  - {id: l1, question: "Что в коробке, которую нельзя открывать?", open: hook, close: twist}
  - {id: l2, question: "Почему в зеркале Савва сидит в кресле оценщика?", open: stalls, close: cliff}
  - {id: l3, question: "Открыть или довезти — выживет ли курьер до пяти?", open: dilemma, close: twist}


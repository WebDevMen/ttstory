# СЦЕНАРИЙ: «Чёрный рынок невозможного» — одна история, ~3 минуты (вымысел, криминальная мистика). Правила ясности: docs/SCRIPTING.md §14.6.
# Концепция пользователя: подпольный рынок вещей, которых не бывает (часы со временем смерти владельца, зеркало на сутки
# вперёд, патроны с условием); у каждой вещи цена, ограничение и побочный эффект; курьер везёт коробку, которую нельзя
# открывать, за ним охотятся три группы; коробка пустая — но преследователи бегут от курьера.
# Здесь эта идея стала одной историей: герой-точка зрения (курьер Савва), три правила мира, каждое проверено на человеке,
# у каждой из трёх банд своя вещь рынка, спор в тупике, дилемма «открыть или довезти», улика трижды и петля в финале.
# Проверка: python3 vg.py script check market [--tts] · документ: python3 vg.py script render market
#
# Время (at:) — ссылки на слова текста ЭТОГО блока. Реплики героев написаны прямо в vo, lines отмечает, чья реплика
# (голоса — production.voices).

version: 1


  follow: "Подписка на новые выпуски «Чёрного рынка невозможного»: каждый раз новая вещь, её цена и тот, кто её заплатит."
  rewatch: "Во второй сцене зеркало уже показывает Савву в кресле оценщика; часы Вайса стоят на пяти; дыра в коробке пустая — ответ виден заранее."
  cta: {beat: cta, text: "Открыть или довезти? Пиши одним словом", type: comment}


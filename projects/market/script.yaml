brief:
  goal: "Рассказать одну понятную криминально-мистическую историю так, чтобы зритель досмотрел три минуты, запомнил три вещи рынка с их ценой и поспорил в комментариях: открыть коробку или довезти."
  kpi: [completion, comments, rewatch, shares, follows]
  audience:
    who: "Зрители сюжетных роликов, страшилок с правилами, криминальных историй и мистики в ленте; любят, когда у чуда есть цена и логика"
    age: "16–34"
    interests: [криминал, мистика, фантастика, «Чёрное зеркало», «Сумеречная зона», нуар, истории с правилами]
    pains: ["магия без цены — значит, без напряжения", "непонятно, кто герой и за кого бояться", "финал «продолжение следует» без ответа"]
    desires: ["вещи с понятными правилами, по которым можно «играть» самому", "погоня, где герой выигрывает головой, а не силой", "поворот, после которого хочется пересмотреть начало"]
    knowledge: "Знают жанр нуара и «проклятых предметов»; ничего не знают об этом рынке — всё объясняется по ходу"
  promise: "Одна ночь курьера: коробка, которую нельзя открывать, три банды с невозможными вещами и финал, где охотники бегут от добычи — и это объясняется правилами рынка."
  tone: "Холодный нуар: бетон, ржавчина, мокрый асфальт, натриевые фонари; один красный цвет — бечёвка коробки и прицел; неон только там, где он висит в мире (вывеска бара, аптечный крест). Без крови: выстрелы в бетон, страх вместо жестокости."
  keywords: ["коробка с чёрного рынка", "чёрный рынок", "чёрный рынок невозможного", "курьер", "коробка", "мистика"]
  constraints:
    - "Вымысел целиком: рынок, хладокомбинат на Портовой, Северный мол, люди и вещи придуманы; реальны мороз холодильных камер, скорость пистолетной пули, пломба, которую нельзя снять, не сломав"
    - "Одна точка зрения — курьер Савва: всё, что видит зритель, видит он"
    - "Три правила мира, у каждого цифра: цена десять лет жизни; шесть патронов, попадают только в бегущего; часы показывают год смерти"
    - "Без крови и убийств в кадре: пули уходят в бетон и в коробку; 13+"
    - "Из концепции взяты все три вещи и финал с пустой коробкой; придумано, ПОЧЕМУ охотники бегут: открывший коробку становится хозяином рынка, а цену за каждую вещь забирает хозяин"

research:
  summary: >-
    История выдумана, но держится на настоящих вещах: в камерах хладокомбината держат минус восемнадцать и ниже,
    поэтому брошенный завод — правдоподобное место для рынка, где ничего не портится; пистолетная пуля летит около
    трёхсот шестидесяти метров в секунду — от неё не убежать, поэтому правило «попадает только в бегущего» превращает
    погоню в шаг; пломба на проволоке не снимается, не сломав её, — коробку нельзя открыть незаметно.
  facts:
    - id: f1
      text: "Пуля 9×19 мм (стандартная, 115 гран) вылетает со скоростью около 360 м/с."
      source: "https://en.wikipedia.org/wiki/9%C3%9719mm_Parabellum"
      confidence: high
    - id: f2
      text: "Долгое хранение замороженного требует постоянной температуры −18 °C или ниже."
      source: "https://en.wikipedia.org/wiki/Frozen_food"
      confidence: high
    - id: f3
      text: "Пломбу на проволоке нельзя снять, не перерезав проволоку или не повредив пломбу; такие пломбы ставят на счётчики и контейнеры."
      source: "https://en.wikipedia.org/wiki/Tamper-evident_technology"
      confidence: high
  angles:
    - id: a1
      archetype: role_swap
      text: "Курьера с запретной коробкой загоняют три банды с невозможными вещами; он открывает коробку, она пуста — и охотники бегут от него, потому что открывший стал хозяином рынка"
      paradox: "Пустая коробка оказывается самым дорогим лотом рынка: внутри не вещь, а право забирать цену за все вещи"
      score: 9
      why: "Идея пользователя целиком, но с логикой: правило «цену забирает хозяин» сеется в начале и щёлкает в финале; охотник становится дичью; дилемма «открыть или довезти» без правильного ответа."
    - id: a2
      archetype: inheritance
      text: "Старый оценщик передаёт рынок по наследству через пустую коробку: кто нарушит запрет, тот и наследник"
      paradox: "Запрет «не открывай» нужен, чтобы коробку открыл только тот, кому больше нечего терять"
      score: 8
      why: "Взято внутрь a1 как второй поворот: часы Вайса стоят на пяти, а в финале Савва сам говорит новому курьеру «Не открывай»."
    - id: a3
      archetype: rule_break
      text: "Патроны, которые попадают только в бегущего: погоня, в которой убегать нельзя"
      paradox: "Чтобы спастись от пули, надо идти к стрелку шагом"
      score: 8
      why: "Это правило мира №2 — опыт, который зритель «проигрывает» сам; делает погоню умной."
    - id: a4
      archetype: inhuman_pov
      text: "История глазами зеркала, которое видит комнату на сутки вперёд"
      paradox: "Зеркало знает финал, но не может предупредить"
      score: 5
      why: "Красиво, но не за кого бояться и нет погони."
  chosen_angle: a1
  insights:
    - "Ставка понятна за секунду: красная бечёвка, пломба, «НЕ ОТКРЫВАТЬ» и три красные точки прицела на коробке."
    - "Каждая вещь рынка — как бирка с тремя строками: цена, ограничение, побочный эффект; зритель сам видит, сколько стоит чудо."
    - "Погоня держится на правиле: бегущего пуля не промахнётся — курьер идёт шагом под прицелом."
    - "Улика сеется трижды: зеркало показывает Савву в кресле оценщика, «цену забирает хозяин рынка», коробка ничего не весит."

story:
  logline: "Савва, курьер ночного рынка, должен до пяти утра довезти коробку, которую нельзя открывать, но за ним охотятся три банды с невозможными вещами; не довезёт — не доживёт до утра."
  retell: "Курьер Савва везёт через порт коробку, которую нельзя открывать, а за ним охотятся три банды с вещами рынка. Загнанный на молу, он открывает её — она пустая. Открывший стал хозяином рынка, которому все платят цену, и охотники бегут от него."
  premise: "Что если на чёрном рынке продают вещи, которых не бывает, — а цену за каждую забирает хозяин рынка, и хозяином становится тот, кто откроет пустую коробку?"
  paradox: "Пустая коробка — самый дорогой лот: кто её откроет, нарушив запрет, тот получает право на цену всех вещей; добыча становится тем, кого боятся охотники"
  genre: "криминальная фантастика, мистика, нуар"
  world_rules:
    - id: r1
      rule: "Каждая вещь рынка работает, но у неё три строки: цена, ограничение, побочный эффект; цену забирает хозяин рынка"
      test: "Парень берёт часы смерти за десять лет жизни — расписывается и седеет за секунду"
      shown_in: price
      basis: вымысел
    - id: r2
      rule: "Патроны рынка попадают только в бегущего"
      test: "У Ады шесть патронов: Савва бежит — пуля огибает трубу и прошивает коробку; замер — вторая уходит в бетон у виска; дальше он идёт шагом"
      shown_in: shot
      basis: f1
    - id: r3
      rule: "Часы рынка показывают время смерти владельца — и не ошибаются"
      test: "У Часовщика на часах две тысячи шестьдесят первый — поэтому он прыгает под фуру и встаёт; в финале часы всех троих прыгают на пять ноль одну"
      shown_in: port
      basis: вымысел
  characters:
    - id: savva
      name: "Савва"
      intro: "Савва, двадцать шесть лет, курьер. Возит то, что нельзя отправить почтой."
      role: "герой, точка зрения; курьер рынка"
      want: "довезти коробку до пяти и выжить"
      fear: "узнать, что везёт смерть — свою"
      look: "тёмная куртка с капюшоном, сумка курьера через плечо, коробка под мышкой"
      arc: "от «моё дело — не открывать» к тому, что он сам ставит коробку перед новым курьером"
    - id: vais
      name: "Вайс"
      intro: "Вайс, шестьдесят лет. Оценщик. Говорит цену раньше, чем ты спросишь."
      role: "оценщик и хозяин рынка; заказчик"
      want: "передать рынок до пяти утра"
      fear: "что коробку не откроет никто"
      look: "седой, длинное пальто, лупа часовщика на лбу, часы рынка на запястье"
      arc: "даёт коробку с запретом — в пять его часы останавливаются, кресло пустеет"
    - id: ada
      name: "Ада"
      intro: "Ада, снайпер. Шесть патронов рынка."
      role: "первая банда: стрелок с крыш"
      want: "забрать коробку"
      fear: "промахнуться последним патроном"
      look: "силуэт на крыше, длинная винтовка, красная точка прицела"
      arc: "ведёт Савву прицелом через весь порт — и бежит в финале"
    - id: clock
      name: "Часовщик"
      intro: "Главный у них — Часовщик. На его часах две тысячи шестьдесят первый."
      role: "вторая банда: люди в одинаковых часах рынка"
      want: "отнять коробку любой ценой"
      fear: "ничего — часы обещают, что он доживёт до старости"
      look: "трое в одинаковых пальто, на запястьях светятся одинаковые часы"
      arc: "не боится ничего — пока его часы не прыгают на пять ноль одну"
  twists:
    - id: t1
      what: "Коробка пуста: лот — сам рынок. Открывший становится хозяином, а цену за каждую вещь забирает хозяин, — и все, у кого есть вещи рынка, теперь должны Савве"
      setup: [stalls, price, job]
      payoff: twist
    - id: t2
      what: "Вайс всё рассчитал: его часы смерти стояли на пяти утра, он искал наследника, а запрет нужен, чтобы коробку открыл тот, кому некуда бежать"
      setup: [job, dilemma]
      payoff: cliff
  dilemmas:
    - id: d1
      beat: dilemma
      who: savva
      question: "Открыть коробку и нарушить единственное правило курьера — или не открывать и не дожить до пяти?"
      options: ["Открыть: может, внутри то, что спасёт, — но запрет Вайса и пломба, которую не вернуть", "Довезти закрытой: правило соблюдено, но с трёх сторон банды, а бежать нельзя"]
  stakes:
    - {beat: setup, level: personal}
    - {beat: stalls, level: personal}
    - {beat: price, level: personal}
    - {beat: job, level: personal}
    - {beat: shot, level: personal}
    - {beat: port, level: community}
    - {beat: mirrors, level: community}
    - {beat: dilemma, level: community}
    - {beat: twist, level: world}
    - {beat: cliff, level: world}

hooks:
  variants:
    - {id: h1, type: rule_warning, vo: "Коробку с чёрного рынка нельзя открывать. Четыре часа. Три банды. Одно правило.", on_screen: "НЕ ОТКРЫВАТЬ · ДО 05:00", visual: "Макро: коробка с красной бечёвкой и свинцовой пломбой под одной лампой; на неё по одной наползают три красные точки прицела", score: 9, why: "Правило, срок и угроза в первой фразе; аномалия-конфликт видна без звука — три прицела на одной коробке."}
    - {id: h2, type: anomaly, vo: "Это зеркало показывает комнату через сутки. В нём ты уже сидишь в чужом кресле.", on_screen: "ЗЕРКАЛО: +24 ЧАСА", visual: "Зеркало в раме, отражение отличается от комнаты: кресло занято", score: 8, why: "Сильная аномалия, но нет срока и ставки, спойлерит финал."}
    - {id: h3, type: stakes, vo: "У курьера четыре часа и коробка, за которую убивают.", on_screen: "4 ЧАСА", visual: "Курьер под дождём, коробка под мышкой, на ней красная точка", score: 8, why: "Ясная ставка, но без правила-запрета."}
    - {id: h4, type: speculative, vo: "Здесь продают часы, которые знают час твоей смерти. Цена — десять лет.", on_screen: "ЦЕНА: 10 ЛЕТ", visual: "Макро циферблата: вместо цифр дата и время смерти", score: 8, why: "Хорошо продаёт мир, но не героя."}
    - {id: h5, type: visual_shock, vo: "Пуля обогнула трубу. Потому что он побежал.", on_screen: "ПОПАДАЕТ В БЕГУЩЕГО", visual: "Пуля огибает трубу по дуге", score: 7, why: "Эффектно, но без контекста непонятно."}
    - {id: h6, type: result_first, vo: "Он открыл пустую коробку — и все, кто за ним охотился, побежали.", on_screen: "ОХОТНИКИ БЕГУТ", visual: "Пустая коробка, трое убегают в туман", score: 7, why: "Интрига есть, но раскрывает финал."}
    - {id: h7, type: imagine, vo: "Представь рынок, где продают невозможное.", on_screen: "РЫНОК НЕВОЗМОЖНОГО", visual: "Прилавки в цеху", score: 5, why: "«Представь» — штамп, медленный вход."}
    - {id: h8, type: question, vo: "Что бы ты купил на чёрном рынке невозможного?", on_screen: "ЧТО КУПИШЬ?", visual: "Три вещи на прилавке", score: 5, why: "Вопрос-лекция, слабее правила."}
  primary: h1
  ab: [h3, h4]

beats:
  # ------------------------------------------------------------------ 1. HOOK — запрет, срок, три прицела
  - id: hook
    role: hook
    title: "Одно правило"
    goal: "Сразу правило, срок и угроза: коробку нельзя открывать, четыре часа, три банды."
    vo: "Коробку с чёрного рынка нельзя открывать. Четыре часа. Три банды. Одно правило."
    on_screen: "КОРОБКА С ЧЁРНОГО РЫНКА"
    devices: [open_loop, stakes_raise, visual_proof, text_reinforcement, sound_hit]
    music: drone
    marks: {"чёрного рынка": "#e0283a", "нельзя открывать": "#f2ede4"}
    accent: "#e0283a"
    shots:
      - id: k_box
        visual: "Макросъёмка: коробка из серого картона на ржавом железном столе, перевязана красной бечёвкой крест-накрест, на узле свинцовая пломба; бирка «НЕ ОТКРЫВАТЬ · ДО 05:00». Одна лампа сверху, пар от холода, за коробкой в расфокусе — бетонная колонна и мясные крюки цеха. На коробку по одной наползают три красные точки прицела."
        actors: [new:lot_box, new:noir_frame, particles, shape, text]
        camera: "Сверхкрупно, медленный наезд; толчок на каждой точке"
        animation:
          - {at: "@start", what: "Лампа качается, пар"}
          - {at: "@открывать", what: "Пломба крупно, бирка поворачивается"}
          - {at: "@Четыре", what: "Таймер 04:00:00"}
          - {at: "@Три", what: "Три красные точки одна за другой на коробке"}
        graphics:
          - {at: "@Коробку", type: tag, text: "КОРОБКА С ЧЁРНОГО РЫНКА"}
          - {at: "@нельзя", type: tag, text: "НЕ ОТКРЫВАТЬ · ДО 05:00"}
        sfx:
          - {at: "@start", sound: hiss, note: "пар холодильной камеры"}
          - {at: "@Три", sound: click, note: "щелчки прицелов"}
        ambience: [hum]
        transition: cut
      - id: k_title
        at: "@Одно-0.1"
        visual: "Резкая смена: чёрный экран, по нему вспышкой — заголовок «ЧЁРНЫЙ РЫНОК НЕВОЗМОЖНОГО», под ним три маленьких силуэта предметов: часы, зеркало, патрон."
        actors: [new:noir_frame, text, new:death_watch, new:mirror_24, new:bullet_macro]

            - {actor: smoke, x: 860, y: 1180, w: 300, h: 700, color: "#3a2420", seed: 3, par: 0.35, speed: 40, drift: -0.2}
            - {<<: *far_ground, y: 1372}
            - {actor: ruin, id: tower, x: 560, y: floor, floors: 16, cols: 6, cell: [86, 84], seed: 7, burn: 0.07, break: 4.2}
            - {actor: smoke, x: 600, y: 470, w: 420, h: 520, color: "#2a1d1a", seed: 6, speed: 45, drift: -0.45}
            - {actor: fire, x: 600, y: 470, w: 150, h: 120, seed: 4}
            - {actor: ground, x: -300, y: 1580, w: 1700, h: 400, color: ["#24120d", "#0b0605"]}
            - {actor: rubble, x: 250, y: floor, w: 420, h: 150, seed: 3}

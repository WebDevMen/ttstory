# Test: three code-drawn post-apocalyptic frames (method draw — no AI images): a ruined high-rise, survivors, abandoned cars.
# Project actors: actors/ruins.js (ruin, smoke, fire, rubble, car). Frames: vg.py preview apocalypse --shots
#
# Depth: every background plane has its own strip of ground with the SAME par, whose top edge sits above the bases of
# that plane's buildings (they are sunk into it) — so nothing hangs in the air whatever the camera does. Planes, far → near:
#   city (par 0.15, a whole distant city in haze) → ruins row (0.25) → far ruins (0.35) → main plane (1).
# Further planes are lighter and closer to the sky colour (aerial perspective); a haze band softens the horizon.

title: "Апокалипсис — три кадра"

voice: {voice: ru-RU-DmitryNeural, rate: "+0%", lead_in: 0.3, gap: 0.6, tail: 1.2}

theme:
  preset: minimal
  captions: {enabled: false}

post: {vignette: 0.32, chromatic: 0, grain: 0.03}

x-sky: &sky {actor: sky, x: -150, w: 1380, par: 0, colors: ["#1a0b0b", "#6a2414", "#d9662c"], stars: 0, clouds: 0, sun: [690, 1080], moon: false, horizon: 1250}
x-ash: &ash {actor: particles, kind: snow, region: [0, 0, 1080, 1920], count: 70, size: [2, 5], speed: 50, colors: ["#b8aaa0", "#8d8079"], alpha: 0.6, seed: 4}
x-embers: &embers {actor: particles, kind: embers, region: [0, 900, 1080, 1920], count: 40, colors: ["#ffb347", "#ff6a1a"], seed: 8}

# plane 1 — a distant city in haze
x-city: &city {actor: skyline, x: 540, w: 1800, h: 360, color: "#6e2a17", color2: "#7c321b", win: "#ffb060", cell: 12, lit: 0.02, par: 0.15}
x-city-ground: &city_ground {actor: ground, x: -500, w: 2100, h: 900, color: ["#7a341c", "#3a1a12"], par: 0.15}
x-city-smoke: &city_smoke {actor: smoke, w: 160, h: 900, color: "#5a3326", n: 14, blur: 8, speed: 25, drift: -0.25, par: 0.15}
# plane 2 — a row of small ruins
x-row: &row {actor: ruin, color: "#6a2e1b", rim: "#ffa060", burn: 0, scale: 0.24, cols: 5, par: 0.25}
x-row-ground: &row_ground {actor: ground, x: -500, w: 2100, h: 900, color: ["#5a2616", "#2e140e"], par: 0.25}
x-row-fire: &row_fire {actor: fire, w: 50, h: 34, tongues: 3, par: 0.25}
# plane 3 — far ruins
x-far: &far {actor: ruin, color: "#4a2219", rim: "#ff8a4a", burn: 0, par: 0.35}
x-far-ground: &far_ground {actor: ground, x: -400, w: 1900, h: 800, color: ["#3a1a12", "#160a08"], par: 0.35}
# haze over the horizon (between plane 2 and plane 3)
x-haze: &haze {actor: shape, kind: rect, x: 540, w: 1900, h: 300, par: 0.3,
               fill: {linear: ["rgba(217,102,44,0)", "rgba(200,92,40,0.45)", "rgba(150,64,30,0)"], angle: 180}}

scenes:
  - id: tower
    text: Город.
    shots:

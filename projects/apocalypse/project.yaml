        draw:
          bg: "#1a0b0b"
          floor: 1580
          camera: {keys: [{t: 0, z: 1.06, y: 1060}, {t: end, z: 1.1, y: 1050}]}
          layers:
            - *sky
            - {<<: *city_smoke, x: 160, y: 1318, seed: 21}
            - {<<: *city_smoke, x: 980, y: 1318, seed: 22, drift: -0.15}
            - {<<: *city, y: 1330, seed: 5}
            - {<<: *city_ground, y: 1316}
            - {<<: *row, x: 60, y: 1352, floors: 11, seed: 31}
            - {<<: *row, x: 250, y: 1352, floors: 8, seed: 32}
            - {<<: *row, x: 780, y: 1352, floors: 10, seed: 33}
            - {<<: *row, x: 1010, y: 1352, floors: 12, seed: 34}
            - {<<: *row_ground, y: 1338}
